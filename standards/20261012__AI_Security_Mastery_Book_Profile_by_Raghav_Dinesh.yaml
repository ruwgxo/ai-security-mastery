record: AI_SECURITY_MASTERY_BOOK_PROFILE
title: AI Security Mastery - Book Profile
version: 0.1.0
updated: 2026-10-12
status: draft for review
scope: >
  Every file under book/ in ruwgxo/ai-security-mastery from v2.0.0 on: the 270 section files,
  the 18 chapter indexes and the book index.
implements: YAML_MARKUP_STANDARD 1.0.0
purpose: >
  Fixes one layout for every section of the book and says, key by key, which standard block
  each book key renders as. A renderer that knows the standard and this profile renders any
  section without guessing. A converter that follows this profile turns any v1 section into
  that layout without losing a word.
principle: >
  The standard lets a body be "domain-specific keys that a renderer maps onto blocks". The book
  keeps a small fixed set of its own keys, because readers, tooling and the indexes depend on
  them, and this profile is the map from those keys to blocks. Inside a key, content is either
  a fixed shape this profile names or an explicit list of standard blocks. Nothing is dropped.
  A v1 key either lands in a named slot, becomes a heading with its key kept as the anchor id,
  or is kept verbatim as metadata.

# ─────────────────────────────────────────────────────────────
# FILES
# ─────────────────────────────────────────────────────────────
files:
  names:
    section: section_NN_MM_slug.yaml, unchanged from v1. The chapter indexes and reading order depend on them.
    chapter_index: chapter_NN_index.yaml, unchanged
    book_index: ai_security_mastery_book_index.yaml, unchanged
    note: >
      The standard's YYYYMMDD__Title_by_Author.yaml convention applies to records such as this
      profile, not to book content files, whose names are part of the book's addressing.
  documents: >
    Exactly one YAML document per file. The first-line filename comment and the document
    start marker stay. A trailing document marker that opens an empty second document is
    removed (v1 has this in section_01_11 and section_03_02).
  encoding: UTF-8, LF line endings, two-space indentation, no tabs
  line_width: >
    Folded prose is wrapped near 100 columns for editing comfort. The wrap carries no meaning.
    Literal scalars are never rewrapped.

# ─────────────────────────────────────────────────────────────
# SCALARS - the standard's rule applied to this book
# ─────────────────────────────────────────────────────────────
scalars:
  prose: folded (>). Every paragraph of narrative, every description, summary, note and table description.
  literal: >
    Literal (|) only inside a code block: source code, shell sessions, config, Sigma rules,
    ASCII diagrams, display formulas, and deliberately broken lines whose breaks carry meaning.
  short: plain or single-quoted, for single-line values, list items and table cells
  apostrophes:
    rule: >
      In a block scalar (> or |) an apostrophe is written once: model's. The doubled form
      model''s is the escape for single-quoted scalars only. Inside a block scalar it is two
      literal characters and renders as two apostrophes.
    v1_fix: >
      Prose: every '' that YAML does not consume as a single-quote escape becomes ' when it
      sits between word characters or closes a quoted token (Goodfellow et al.''s,
      reduction=''none''). Code: never a blind replace. Most '' in code is Python (an empty
      string '' or a docstring delimiter '''). Only a genuine bug is fixed: two string tokens
      glued with no gap ('Track 7''s' parses as 'Track 7' 's' and prints Track 7s), or a
      doubled apostrophe inside a comment or docstring. Each fix is listed in its chapter PR.
  inline_markup: >
    The migration adds no inline markup. Prose spans that the standard's inline syntax would
    misread (~87% read as subscript, Phi^-1(p_A) - Phi^-1(p_B) read as superscript, $ amounts
    read as math, == read as highlight) are listed per chapter as collisions for the author.
    Wrapping them in backticks is a separate decision, not part of the migration.

# ─────────────────────────────────────────────────────────────
# FRONTMATTER - from v1 document_info
# ─────────────────────────────────────────────────────────────
frontmatter:
  title: document_info.title, verbatim apart from the apostrophe fix
  updated: >
    document_info.created. The standard defines updated as the last substantive rewrite. The
    migration changes form only, so it is not a rewrite and does not move the date. v1 has no
    better source: git history starts at bulk imports dated after created. Where a later
    commit plausibly rewrote a section, the chapter PR lists it for the author to set.
  version: document_info.version, verbatim
  authors: '[document_info.author]'
  tags: document_info.tags, then metadata.tags, deduplicated in source order
  omitted: status and scope are not set on sections. v1 has no per-section values for them.

section_info:
  role: >
    Identity and bookkeeping metadata the renderer uses for the badge line and navigation
    (chapter, section, reading time, pages). It is metadata, not content. It sits outside
    the frontmatter because the standard closes the frontmatter key list.
  keys:
    chapter: integer, from document_info.chapter or the filename
    section: integer, from document_info.section or the filename. v1 forms such as '6.13' or '25' are normalised to the number after the chapter. The original string is kept in legacy when it differs.
    section_code: verbatim, when present
    part: verbatim, when present
    created: document_info.created, verbatim
    estimated_pages: verbatim, when present
    estimated_reading_time: verbatim, when present
    license: verbatim
    repository: document_info.github, verbatim
    book: verbatim, when present
  legacy: >
    Every other v1 metadata value, verbatim, under its v1 key path: section_metadata.*,
    count fields (deliverables.count, key_takeaways.count), schema_version, word counts,
    notebook names, status flags. Nothing renders from legacy. Each chapter PR lists what
    went there so the author can delete it deliberately later.

# ─────────────────────────────────────────────────────────────
# SECTION LAYOUT - one layout, fixed key order
# A slot with no v1 source is absent, never empty (standard: empty is absent).
# Slot labels are renderer labels fixed by this profile, the same in every section.
# ─────────────────────────────────────────────────────────────
section_layout:
  order:
    - title
    - updated
    - version
    - authors
    - tags
    - section_info
    - lead
    - overview
    - learning_objectives
    - prerequisites
    - prose_content
    - reference_materials
    - deliverables
    - artifacts
    - exercises
    - common_mistakes
    - section_summary
    - next
    - connections

  slots:

    lead:
      shape: string, folded if it wraps
      block: lead
      v1_sources: [section_overview.one_line_summary]
      rule: Only from a v1 one-line summary. A section without one gets no lead. None is written.

    overview:
      shape: list of part
      block: heading (level 2, the part heading) + its blocks
      v1_sources:
        - section_overview.why_this_section_exists
        - section_overview.position_in_chapter
        - section_overview.purpose
        - section_overview.what_you_will_build
        - section_overview.key_transitions
        - section_content.overview
        - section_content.why_this_matters
        - content.opening
        - topics/summary/chapter-summary openers (purpose, summary_overview)
      rule: >
        One part per v1 key, in v1 order. Heading text is the v1 key run through the v1 site's
        label function (why_this_section_exists -> Why This Section Exists), which is the text
        v1 readers already saw. The v1 key is kept as the part id.

    learning_objectives:
      shape: '{intro: optional folded string, groups: mapping of group key to list of strings}'
      block: slot label (level 2), intro as prose, each group as heading (level 3) + list (bullet)
      v1_sources:
        - learning_objectives.{knowledge, skills, security_mindset}
        - learning_objectives.{primary -> intro, by_end_of_section}
        - section_overview.learning_objectives.*
        - section_content.learning_objectives.*
      rule: Group keys are kept as written. Their labels come from the same label function.

    prerequisites:
      shape: 'list of strings, or {groups} as in learning_objectives'
      block: slot label + list (bullet), grouped like learning_objectives
      v1_sources: [prerequisites, section_overview.prerequisites, section_content.prerequisites]

    prose_content:
      shape: list of part
      block: heading (level 2) + blocks, nested parts at level 3 and 4
      v1_sources:
        - prose_content.part_N / prose_content.part_N_slug / prose_content[] (title or heading, body)
        - section_content.subsection_N (number, title, content, key_point)
        - content.subsection_N, content.subsections[]
        - topics[] (topic_number, title, overview, content, implementation, security_implications)
        - every other narrative key in a v1 body, at its v1 position (see unmapped_keys)
      rule: >
        Part order is v1 order. The v1 key is kept verbatim as the part id (part_1,
        part_7_sigma_cli, subsection_3). A v1 number (6.13.1) is kept as number and rendered
        before the heading text.

    reference_materials:
      shape: 'list of {heading, id, description, table}'
      block: heading (level 3) + prose (description) + table
      v1_sources:
        - reference_materials.table_N / reference_materials.table_N_slug
        - reference_materials (list form)
        - quick-reference tables inside section_content
      table: '{columns: [string], rows: [[cell]]}, rows and columns verbatim'
      rule: >
        A table whose rows do not all match its column count is migrated as written and listed
        as a content defect (v1: one table, section_10_03 table_3). The migration does not
        repair it.

    deliverables:
      shape: 'list of {heading, id, filename, lang, description, notes, dependencies, code}'
      block: >
        heading (level 3) + prose (description) + prose (notes, labelled Implementation notes)
        + list (dependencies) + code (lang, caption = filename, text = code)
      v1_sources:
        - deliverables.deliverable_N (chapters 8-18)
        - implementations.implementation_N (chapters 5-6)
        - code_examples[] (chapter 7)
        - implementation.notebooks (chapter 4)
      lang: >
        From an explicit v1 language key when present. Otherwise derived from the filename
        extension: .py python, .yml and .yaml yaml, .json json, .sh bash, .sql sql, .md
        markdown. A file whose language cannot be derived is listed. No language is guessed.
      code: literal, byte-identical to v1 except listed apostrophe fixes
      rule: >
        Code that v1 places inline inside narrative (section_content.practical_implementation,
        topics[].implementation) stays where it is, as a code block inside its part. Only v1
        collections of code units move to this slot.

    artifacts:
      shape: list of fields
      block: fields (subject = title, entries id, type, description, file)
      v1_sources: [deliverables.items (chapters 5-6, the output files a section's code produces)]
      rule: >
        In chapters 5-6 the v1 key deliverables means produced outputs, not code. Those outputs
        come here so that deliverables means code units everywhere.

    exercises:
      shape: list of fields
      block: fields (subject = title, entries in v1 order)
      v1_sources: [exercises.exercise_N, exercises (list form), assessment]

    common_mistakes:
      shape: 'list of {subject, entries: [{label, value}]}'
      block: fields
      v1_sources:
        - common_mistakes.mistake_N (description, why_it_happens, consequence, correct_approach)
        - common_mistakes[] (mistake, why_it_matters, correct_approach)
        - section_content.common_mistakes.mistake_N (name or error, plus free-form fields; chapters 1-2)
        - section_content.common_mistakes.*
        - common_mistakes_and_solutions
      rule: >
        subject is the first of title, description, mistake, name, error that exists. Every other v1 field
        becomes an entry in v1 order, with its label from the label function. Labels are never
        renamed into a different meaning: why_it_matters does not become why_it_happens.
        Siblings in one section should share one label set. Where v1 siblings differ, the
        difference is listed, never padded or renamed. A list of plain strings (key_takeaways.common_mistakes) stays a
        list block under the Common mistakes label.

    section_summary:
      shape: '{compact: folded string, key_takeaways: list of strings or {groups}}'
      block: slot label + prose (compact), then Key Takeaways (level 3) + list
      v1_sources:
        - section_summary.compact / section_summary.one_paragraph / section_summary (string)
        - section_summary.key_takeaways, key_takeaways (list, items[], takeaway_N, or groups)
        - section_content.key_takeaways.*
        - key_concepts_summary
      rule: >
        key_takeaways.items[] entries of {number, takeaway} become an ordered list. Grouped v1
        takeaways (conceptual_understanding, practical_skills, security_mindset, remember_this,
        next_steps) keep their groups.

    next:
      shape: '{kind: section|chapter|part, target: string, title: string, summary: folded string}'
      block: callout (variant note, title = title, text = summary)
      v1_sources:
        - preview_section_NN_MM / preview_section_NN (kind section, target from the key)
        - preview_chapter_NN (kind chapter)
        - preview_part_N (kind part, preview -> summary)
        - preview_next
        - section_summary.next_section
      rule: >
        v1 gives every section's preview a different key (130 layouts become 14 once these
        are normalised). The key name is kept as kind and target, so nothing is lost.

    connections:
      shape: mapping of group key to list
      block: 'slot label + per group heading (level 3) + list; items shaped {section, link} render as a definition block (term = section, description = link)'
      v1_sources:
        - metadata.{cross_chapter_references, forward_references, atlas_anchors}
        - connections.{backward, forward, builds_on, leads_to, prepares_for, external_references}
        - cross_references.{backward, forward}
        - further_reading.*
      rule: >
        Group keys are kept as written. They are not merged, because backward and
        cross_chapter_references do not mean the same thing. connections.security_thread is
        prose and becomes a callout (security) at the head of the slot.

  part:
    shape:
      heading: string (required)
      number: optional, v1 numbering such as 6.13.1
      id: optional anchor, the v1 key or slug
      blocks: list of standard blocks
      parts: optional nested parts (two levels below a slot at most, so headings stay within level 4)
    rule: >
      A dict deeper than heading level 4 does not become another heading. Its leaves become a
      fields block (subject = the dict's label, id = its v1 key, entries = its keys).

  slot_labels:
    rule: >
      Rendered as the level-2 heading of a slot. Fixed by this profile and identical in every
      section. Slots without a label (lead, overview, prose_content, next) render their own
      headings or none.
    learning_objectives: Learning Objectives
    prerequisites: Prerequisites
    reference_materials: Reference Tables
    deliverables: Deliverables
    artifacts: Artifacts
    exercises: Exercises
    common_mistakes: Common Mistakes
    section_summary: Summary
    connections: Connections

# ─────────────────────────────────────────────────────────────
# BLOCKS INSIDE PARTS - turning a v1 literal into standard blocks
# ─────────────────────────────────────────────────────────────
literal_to_blocks:
  method: >
    A v1 prose value is split at blank lines into paragraphs, and each paragraph is classified as
    a whole. Paragraphs are never shredded line by line.
  prose: >
    Every non-final line runs close to the paragraph's wrap width, so the breaks are editing
    wraps. Becomes one prose block, folded. This is the default and by far the most common case.
  hyphen_wraps: >
    A word that v1 hyphen-wrapped across lines (first- then order) is rejoined without a space
    (first-order), because v1's own renderer showed first- order. A suspended hyphen before
    and, or or to (pre- and post-) keeps its space and is flagged. Every rejoin is listed.
  list: >
    A line opening with a marker (-, *, •, 1., 1), a)) starts a list item only at the top of a
    paragraph, directly after a line ending in a colon, or after another item. Anywhere else it
    is a wrapped line that happens to begin with a year or an operator (2019) replays...,
    * ||delta||), so it stays text and is listed. Indented lines under an item are its
    continuation. A list paragraph becomes an optional prose lead-in plus a list block, ordered
    when the markers are numbers.
  line_structured: >
    A paragraph with indented lines, arrow or box-drawing diagrams, aligned columns, or where
    most lines stop well short of the wrap width (worked calculations, Label: value lines,
    deliberately broken lines) keeps its breaks. It becomes one code block with lang text and
    its lines exactly as written. Consecutive line-structured paragraphs merge into one block, so
    a diagram or a worked example stays whole. Every such paragraph is listed for review,
    because some of them may read better as a list.
  isolated_break: >
    A prose paragraph with only an occasional short line (a lead-in ending in a colon before a
    formula on its own line) is split there. The prose stays prose, and a lone formula line
    becomes a code block with lang text. Each split is listed.
  inline_code: >
    A v1 value that is code as a whole (a code key such as practical_implementation, or text
    that opens with imports, defs or a shebang) stays at its v1 position as one code block,
    byte-identical.
  security_keys: >
    A v1 key named security_* that holds prose (security_note, security_relevance,
    security_takeaway, security_finding, security_thread, and others) becomes a callout with
    variant security at its v1 position, titled with its label. A security_* key that holds a
    structure (the chapter 1-2 security_implications dicts of technique, attack and defense) is
    a sub-section, not an interruption, so it becomes a part headed Security Implications.
    security_mindset lists stay lists in learning_objectives or section_summary.
  key_point: v1 key_point holding prose becomes a callout with variant note, titled Key Point, at its v1 position.
  dict_of_short_values: >
    A v1 dict whose values are all single-paragraph strings or numbers becomes one fields block.
    subject is the dict's label, id is the v1 key, and each value becomes an entry. A v1 list
    value inside such a dict stays a YAML list. The standard types a fields value as a string,
    so this gap is listed and the author decides.

# ─────────────────────────────────────────────────────────────
# KEYS THAT DO NOT FIT
# ─────────────────────────────────────────────────────────────
unmapped_keys:
  order_of_resolution:
    - Named in a slot's v1_sources -> that slot.
    - Narrative (prose, lists, nested dicts of text) -> a part at its v1 position, heading from the label function, v1 key kept as id.
    - Metadata (numbers, dates, ids, counts, flags, file lists) -> section_info.legacy, verbatim.
  guarantee: >
    No v1 key or value is dropped. Each chapter PR carries an accounting table: every v1 key
    path, where it went, and a count check that every v1 text leaf appears exactly once in
    the migrated file.
  known_v1_only_keys: >
    Chapter-closing and capstone sections (03_21, 04_17, 04_18, 07_13, 07_15, 05_15) have
    one-off keys such as phase_1_build, grading_rubric, reading_map, chapter_statistics,
    catalog_design and chapter_completion_note. They follow the same resolution and become
    parts of prose_content, unless that chapter's PR proposes a better slot for the author to
    approve.

# ─────────────────────────────────────────────────────────────
# LABEL FUNCTION - the v1 site's own, so headings read as before
# ─────────────────────────────────────────────────────────────
label_function:
  rule: >
    Underscores become spaces. The first word is capitalised. Later words are capitalised
    unless they are one of a, an, the, and, or, of, in, on, at, to, for, vs, via.
  examples:
    - why_this_section_exists -> Why This Section Exists
    - position_in_chapter -> Position in Chapter
  note: >
    This is the text v1 readers saw. Improving it (sentence case: Why this section exists) is
    a style change, so it is outside the migration.

# ─────────────────────────────────────────────────────────────
# INDEXES
# ─────────────────────────────────────────────────────────────
indexes:
  rule: >
    Chapter indexes and the book index keep their v1 keys, because the reading order and the
    site build read them. They get the same frontmatter (title, updated, version, authors,
    tags), the same scalar rules and apostrophe fix, and prose keys such as purpose become
    folded. Each index migrates in its own chapter's PR. chapter_01_index and
    chapter_02_index nest everything under chapter_NN_index. That wrapper is lifted to match
    the other sixteen, with the move listed in their PRs.

# ─────────────────────────────────────────────────────────────
# VERIFICATION - what every chapter PR proves
# ─────────────────────────────────────────────────────────────
verification:
  - {check: parses, detail: every file is a single YAML document that safe_load reads}
  - {check: layout, detail: top-level keys are a subset of section_layout.order in that order, and every slot has its profile shape}
  - {check: no prose literals, detail: no | scalar outside a code block}
  - {check: prose identical, detail: 'per slot, the v2 words equal the v1 words as a multiset, and every v1 text value appears in its slot as one contiguous run. Whitespace, hyphen wraps and list markers are normalised by the rules above, independently of the converter. The only accepted differences are the listed apostrophe fixes.'}
  - {check: code identical, detail: every code block byte-identical to v1 apart from listed apostrophe fixes}
  - {check: accounting, detail: every v1 text leaf appears exactly once, and every v1 key is accounted for}
  - {check: execution, detail: every runnable code deliverable gives the same output before and after. Deliverables needing missing libraries are reported by name.}

tooling: >
  The converter, validator and renderer used for the migration live outside the repository,
  which holds book content only. Each PR states the checks run and their results.
