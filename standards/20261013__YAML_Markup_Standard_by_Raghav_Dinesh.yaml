record: YAML_MARKUP_STANDARD
title: YAML Markup Standard
version: 1.1.0
updated: 2026-10-13
status: draft for review
supersedes: 1.0.0
authors: [Raghav Dinesh]
schema: 20261013__YAML_Markup_Standard_Schema_by_Raghav_Dinesh.json
purpose: >
  A formatting vocabulary for YAML, parallel to what markdown provides for plain text.
  YAML is the authoring format across all books and records. This defines the block types,
  document shapes and book assembly rules a renderer needs to turn any conforming source into
  a readable PDF, ebook, web page or spoken text without guessing at intent.
principle: >
  Markdown encodes formatting in punctuation. YAML encodes it in keys. Every markdown
  construct gets a YAML equivalent here, plus the constructs markdown lacks that technical
  writing actually needs.
principle_no_guessing: >
  A renderer never decides what the author meant. Everything it needs is written in the
  source: what is metadata, what the reader sees, what each heading says, what order the
  files go in, and what a block becomes where it cannot be shown. Where the source is silent,
  this standard gives the default. Where the source breaks a rule, validation fails with a
  reason. Nothing degrades silently.

# ─────────────────────────────────────────────────────────────
# INLINE MARKUP
# Inside reader-facing scalars only. Deliberately identical to markdown.
# ─────────────────────────────────────────────────────────────
inline:
  bold: "**text**"
  italic: "*text*"
  bold_italic: "***text***"
  code: "`text`"
  strikethrough: "~~text~~"
  link: "[label](url)"
  reference: "[label](#id) or [label](document_id#id), and an empty label [](#id) asks the renderer to write the label"
  footnote_ref: "[^1]"
  math_inline: "$expr$"
  superscript: "^text^"
  subscript: "~text~"
  keyboard: "[[Ctrl+C]]"
  highlight: "==text=="
  rules:
    - bold marks the one scannable thing in a line, never a whole sentence
    - code marks anything literal that must not be reflowed or smart-quoted
    - never a bare URL in prose, always a link with a label
  parsing_boundary:
    parsed_in: >
      Reader-facing text only: prose and lead text, heading text, list items, table cells,
      fields subjects and values, definition terms and descriptions, callout titles and
      text, quote text, captions, step titles and details, footnote text, and alt text.
    never_parsed_in: >
      Code block text, diagram source, math source, ids, references' targets, file paths
      and src values, lang and variant values, and every structural attribute. These are
      always literal.
  escaping: >
    A backslash before a markup character makes it literal: \* \_ \~ \^ \$ \= \[ \] \`
    and \\ for a backslash itself. Inside backticks nothing is parsed, so `a ~ b` needs no
    escape.
  document_switch: >
    The frontmatter key inline_markup takes markdown (the default) or none. With none, reader text
    is shown exactly as written and no markup is parsed. This is for text written before a
    source adopted this standard, where ~87% or w^T x would otherwise be misread.

# ─────────────────────────────────────────────────────────────
# SCALAR STYLE - the single most common rendering error
# ─────────────────────────────────────────────────────────────
scalars:
  folded:
    syntax: "key: >"
    meaning: >
      Prose. Line breaks in the source are authoring artifacts and the renderer joins them.
      A blank line inside a folded scalar is a paragraph break.
    use_for: all narrative text, descriptions, summaries
  literal:
    syntax: "key: |"
    meaning: line breaks carry meaning. Renderer preserves them exactly.
    use_for: code, diagram source, math source, poetry, addresses, deliberately broken lines
  plain:
    syntax: "key: text"
    use_for: short single-line values
  rule: >
    Prose authored with | is the number one cause of broken rendering, because the 80-column
    wraps a writer adds for editing comfort reach the reader as hard line breaks mid-sentence.
    If it is a paragraph, it is >. No exceptions.
  apostrophes: >
    Inside a block scalar (> or |) an apostrophe is written once: model's. The doubled form
    model''s is the escape for single-quoted scalars only. In a block scalar it is two literal
    characters and renders as two.

# ─────────────────────────────────────────────────────────────
# COMMON BLOCK ATTRIBUTES
# Optional on every block. A renderer that does not support one ignores it with a warning.
# ─────────────────────────────────────────────────────────────
attributes:
  id: >
    Anchor for references. Lowercase letters, digits, hyphen and underscore, starting with a
    letter or digit. Unique within its document.
  visibility: >
    reader (the default), author or internal. See VISIBILITY.
  alt: >
    Text that stands in for the block where it cannot be shown, such as speech, plain text
    or a failed image. Required on figure and diagram, recommended on math, code and table.
  numbered: true or false. Whether the block takes a number from the book's numbering rules.
  page_break_before: pagination hint, see PAGINATION
  keep_with_next: pagination hint, see PAGINATION
  keep_together: pagination hint, see PAGINATION

# ─────────────────────────────────────────────────────────────
# BLOCK TYPES
# The vocabulary. A renderer that handles these handles any document in the system.
# ─────────────────────────────────────────────────────────────
blocks:

  heading:
    yaml: {type: heading, level: 1-6, text: string, id: optional-anchor}
    renders: h1 through h6
    note: >
      Levels are document-relative. Level 1 is the document's own title and is written by
      the renderer from frontmatter, so a body starts at level 2. Beyond level 4 inside one
      document means the document should split. Heading text never contains its own number;
      numbers are generated (see HEADINGS AND NUMBERING).

  prose:
    yaml: {type: prose, text: "> folded scalar"}
    renders: paragraph, or several when the folded text contains blank lines

  lead:
    yaml: {type: lead, text: string}
    renders: opening paragraph at larger size, visually distinct from body prose
    use_for: the first paragraph of a chapter or section

  list:
    yaml: {type: list, style: bullet|ordered|task, items: [string or nested list]}
    renders: ul, ol, or checkbox list
    note: two levels of nesting maximum. Deeper means it should be headings.

  definition:
    yaml: {type: definition, items: [{term: string, description: string}]}
    renders: term in bold or heading weight, description indented beneath
    use_for: >
      Glossaries, component breakdowns, parameter references, anything shaped as "name plus
      explanation".

  fields:
    yaml: {type: fields, subject: string, entries: [{label: string, value: string or list of strings}]}
    renders: >
      Subject as a heading, then each label as a consistent small-caps or bold label with its
      value beneath. A list value renders as a bullet list under its label. Every entry
      renders its label, always.
    use_for: >
      Repeated structures where each instance has the same field set - a component with
      purpose, example, and security note; a finding with severity, evidence, and fix.

  table:
    yaml:
      type: table
      columns: [string]
      rows: [[cell]]
      align: optional, per column, left|center|right
      widths: optional, per column, relative numbers such as [1, 3, 2]
      header_rows: optional, default 1
      caption: optional
    renders: table
    rules:
      - Every row has exactly as many cells as there are columns. A mismatch fails validation.
      - Only when columns genuinely align across every row. Do not force prose into a table.
    long_tables: see TABLES

  quote:
    yaml: {type: quote, text: string, attribution: optional, source: optional}
    renders: blockquote with attribution line
    use_for: directly quoted external content only, never general emphasis

  callout:
    yaml: {type: callout, variant: note|tip|warning|danger|security|example, title: optional, text: string}
    renders: bounded box, colour and icon per variant
    use_for: >
      Content that interrupts the flow deliberately. Security notes in a technical book are
      the main case.

  code:
    yaml:
      type: code
      lang: string
      text: "| literal scalar"
      filename: optional, the file name this code is saved as
      caption: optional, a description shown with the block
      line_numbers: optional, default false (true when highlight_lines is set)
      start_line: optional, default 1
      highlight_lines: optional, [integer]
      runnable: optional, true when the block is meant to execute as written
    renders: fenced block with syntax highlighting
    behaviour: see CODE

  math:
    yaml: {type: math, tex: "| literal LaTeX source", alt: recommended, numbered: optional}
    renders: >
      Display formula. MathML or rendered TeX where the target supports it, an image
      otherwise, alt in speech and plain text.
    use_for: a formula on its own line. Never write display math as prose or as a text code block.

  figure:
    yaml:
      type: figure
      src: path relative to the source file
      sources: 'optional mapping of format to path, such as {svg: a.svg, png: a.png}'
      alt: string, required
      caption: optional
      width: optional, fraction of text width from 0.1 to 1.0
    renders: image with caption
    behaviour: see FIGURES

  diagram:
    yaml:
      type: diagram
      notation: mermaid|graphviz|plantuml|ascii
      text: "| literal diagram source"
      alt: string, required
      caption: optional
      fallback: optional, path to a pre-rendered image
    renders: the diagram drawn from its source, numbered like a figure
    behaviour: see FIGURES

  steps:
    yaml: {type: steps, items: [{title: string, detail: string}]}
    renders: numbered sequence with each step's title visually distinct from its detail
    use_for: procedures where order matters and each step needs more than one line

  comparison:
    yaml: {type: comparison, subjects: [string], criteria: [{label: string, values: [string]}]}
    renders: side-by-side table or column layout
    use_for: A-versus-B analysis where the same criteria apply to each subject

  divider:
    yaml: {type: divider}
    renders: horizontal rule
    note: between major sections only. Headings already separate content.

  toc:
    yaml: {type: toc, depth: integer}
    renders: generated table of contents from headings

  footnotes:
    yaml: {type: footnotes, items: [{id: string, text: string}]}
    renders: numbered notes at document end, linked from inline refs

# ─────────────────────────────────────────────────────────────
# DOCUMENT SHAPE
# ─────────────────────────────────────────────────────────────
document:
  frontmatter:
    where: top-level keys of the document
    required: [title, updated]
    optional: [subtitle, status, scope, version, tags, authors, language, description, inline_markup, standard, profile, id]
    rule: metadata only. Never rules, instructions, or content.
    notes:
      standard: the version this source targets, such as 1.1. Absent means 1.0.
      profile: path to the profile that maps this document's domain keys to blocks
      id: the document's id for cross-document references. Defaults to the filename without extension.
  meta: >
    One reserved top-level key for metadata the author wants stored but never shown: counts,
    planning dates, schema versions, notes to tooling. It can hold anything. It never renders
    in any target.
  body: >
    Either body as a sequence of blocks, or domain-specific keys that a declared profile maps
    onto blocks. A document with domain keys and no profile (its own or its book's) fails
    validation. A renderer never maps an undeclared key by guessing.
  keys_are_not_text: >
    A renderer never shows a key name to the reader. Every heading, label and title the
    reader sees is written in the source, or produced by a template in the profile. A key
    such as why_this_section_exists is an address, not a heading.
  filename: YYYYMMDD__Title_by_Author.yaml for records. Book content files may use other names, because the book manifest addresses them.
  date_meaning: last substantive rewrite, not every append

visibility:
  reader: shown in every reader-facing output. The default.
  author: shown only in author and review builds, marked as such. For editorial notes, open questions and planning.
  internal: never rendered. For instructions to tools and anything a reader must never see.
  applies_to: any block, any part of a profile-mapped document, and any entry in a book manifest
  inheritance: a container's visibility applies to everything inside it, and a child cannot raise it
  versus_meta: >
    meta holds data. visibility marks content. A planning paragraph is content with
    visibility author. A word count is meta.

append_only_documents:
  rule: new entries at the bottom in date order, never reorder
  correction: >
    A past entry is never edited. A correction is a new entry stating what changed and which
    entry it supersedes.
  closing: closing something out is a closing entry, not a deletion of the history above it
  no_changelog: >
    The append-only history already shows what changed and when. A separate changelog block
    duplicates it and falls out of sync.

# ─────────────────────────────────────────────────────────────
# BOOKS - the manifest
# ─────────────────────────────────────────────────────────────
book:
  rule: >
    A book is one manifest document with type book. It lists every file of the book in
    reading order. A renderer assembles the book from the manifest alone, never from
    filenames, directory order or heading text. A content file the manifest does not list is
    not part of the book, and validation warns about it.
  yaml: |
    type: book
    title: AI Security Mastery
    subtitle: From ML Fundamentals to Production Detection Systems
    authors: [Raghav Dinesh]
    updated: 2026-10-13
    language: en
    standard: 1.1
    profile: standards/20261012__AI_Security_Mastery_Book_Profile_by_Raghav_Dinesh.yaml
    numbering:
      parts: upper-roman
      chapters: decimal
      sections: chapter.decimal
      figures: chapter.decimal
      tables: chapter.decimal
      equations: chapter.decimal
    labels: {part: Part, chapter: Chapter, section: Section, figure: Figure, table: Table, equation: Equation}
    front:
      - {file: front/about.yaml}
      - {file: front/planning_notes.yaml, visibility: author}
    parts:
      - title: Machine Learning Foundations
        id: part-ml-foundations
        chapters:
          - title: Machine Learning Fundamentals
            id: ch-ml-fundamentals
            file: book/chapter_01_index.yaml
            sections:
              - book/section_01_01_what_is_ml.yaml
              - book/section_01_02_linear_algebra.yaml
    appendices:
      - {file: back/glossary.yaml}
    back:
      - {file: back/resources.yaml}
  entries: >
    An entry is a path, or a mapping with file, and optionally title, id and visibility. A
    part or chapter entry that has a title but no file renders a generated heading page for
    its title. Paths are relative to the manifest.
  divisions: front, parts, appendices and back, in that order. A book without parts lists chapters directly.

# ─────────────────────────────────────────────────────────────
# HEADINGS AND NUMBERING
# ─────────────────────────────────────────────────────────────
headings_and_numbering:
  relative_levels: >
    Each document's headings are relative to that document. When a book is assembled, every
    level shifts by the document's depth in the manifest: the book title is level 1, parts
    level 2, chapters level 3, sections level 4, a section's own level 2 headings become
    level 5. A book without parts shifts one less. A heading pushed beyond level 6 fails
    validation.
  numbers_are_generated: >
    Titles never carry their own numbers. Part, chapter, section, figure, table, equation and
    code numbers come from the manifest's numbering rules and labels, and the renderer
    prefixes them (Chapter 10, Section 10.3, Figure 10.2). A block opts out with numbered:
    false. Legacy titles that already contain a number set numbered: false until they are
    cleaned, so a number is never printed twice.
  formats: decimal, upper-roman, lower-roman, upper-alpha, lower-alpha, chapter.decimal, none

# ─────────────────────────────────────────────────────────────
# ANCHORS AND CROSS-REFERENCES
# ─────────────────────────────────────────────────────────────
references:
  addresses: >
    A document is addressed by its id. A block, part or heading inside it is addressed by
    document_id#block_id. Within the same document, #block_id is enough. Ids are unique
    within their document, so v1-style ids such as part_1 stay valid.
  syntax: an inline link whose target starts with # or with a document id followed by #
  generated_labels: >
    An empty label asks the renderer to write it from numbering: [](#fig-squeezer) becomes
    Figure 10.4, [](section_10_04_pgd_attack) becomes Section 10.4.
  per_target:
    pdf: label plus page number (Figure 10.4 on page 212) and a clickable link
    html: hyperlink
    epub: hyperlink
    docx: cross-reference field
    markdown: relative link
    speech: label only, never page numbers
    plain_text: label only
  rule: a reference that does not resolve fails validation

# ─────────────────────────────────────────────────────────────
# PAGINATION - hints for paged targets (PDF, DOCX, print)
# Screen targets ignore them, except EPUB, which starts a new file at page_break_before.
# ─────────────────────────────────────────────────────────────
pagination:
  hints:
    page_break_before: start the block on a new page
    keep_with_next: never end a page between this block and the next
    keep_together: never split this block across pages
  defaults:
    part_and_chapter: page_break_before true
    heading: keep_with_next true
    code: keep_together true up to 15 lines
    table: keep_together true up to 10 rows
    callout, fields, figure, diagram, math: keep_together true
    paragraphs: at least 2 lines at the bottom and top of a page
  rule: >
    Hints are requests. A block taller than a page splits anyway, with the marks set out in
    CODE and TABLES. A renderer never shrinks, crops or drops content to honour a hint.

# ─────────────────────────────────────────────────────────────
# CODE
# ─────────────────────────────────────────────────────────────
code:
  exactness: Code text renders exactly as authored. Never reflowed, smart-quoted, trimmed or truncated.
  filename_and_caption: filename renders as a header bar above the block, caption beneath it. Both are optional.
  line_numbers: off by default. On when line_numbers is true or highlight_lines is set. Numbering starts at start_line.
  overflow:
    print: >
      A line wider than the page wraps, and every wrapped continuation is marked with a
      visible continuation glyph (↪) so the reader knows it is one source line. Silent
      wrapping is not allowed.
    screen_and_epub: the block scrolls horizontally. Lines never wrap.
    speech: the block is skipped and its alt is read. With no alt, the renderer says that a code listing is skipped, naming the filename or lang.
  splitting: >
    Blocks over 15 lines may split across pages unless keep_together is true. A split block
    repeats the filename header with a continued marker on the next page.
  tabs: a tab displays as 4 columns. The source keeps the tab.
  runnable: >
    runnable true marks a block a test harness may execute. It changes nothing in rendering.

# ─────────────────────────────────────────────────────────────
# TABLES
# ─────────────────────────────────────────────────────────────
tables:
  header_rows: the first header_rows rows (default 1, taken from columns) repeat at the top of every page the table spans
  widths: relative hints. A renderer keeps their proportions and may widen columns to fit the longest word.
  splitting: a table splits between rows. A single row never splits unless it alone is taller than a page.
  too_wide:
    pdf_and_docx: the table moves to a landscape page; if it still does not fit, the font shrinks to no less than 7 points; if it still does not fit, validation warns and the table renders as fields per row
    html_and_epub: the table scrolls horizontally inside its own container
    speech: every row is read as its column labels with their values, and alt is read first when set
    plain_text: one fields block per row
  caption: renders above the table, numbered per the manifest when the table is numbered

# ─────────────────────────────────────────────────────────────
# FIGURES AND DIAGRAMS
# ─────────────────────────────────────────────────────────────
figures:
  paths: src, sources and fallback are relative to the file that contains the block. A missing file fails validation.
  formats: >
    With sources, each target takes the best format it supports: svg for html and epub, pdf
    or svg for pdf, png everywhere else.
  size: width is a fraction of the text width. Without it, the image renders at its natural size, never wider than the text.
  numbering: figures and diagrams share one counter, per the manifest
  diagram_rendering: >
    The renderer draws the diagram from its notation at build time. If it cannot, it uses
    fallback. If there is no fallback, it shows the source as a literal block with alt beneath
    it and warns. ascii diagrams are always shown as literal monospace text.
  speech: alt is read, followed by the caption

# ─────────────────────────────────────────────────────────────
# PROFILES - mapping domain keys onto blocks, as data
# ─────────────────────────────────────────────────────────────
profiles:
  rule: >
    A profile is a record that maps a family of documents' domain keys onto blocks. It is
    data a renderer executes, not prose a person interprets. A new book with its own keys
    needs a new profile, never new renderer code.
  yaml: |
    record: PROFILE
    title: Example Book Profile
    updated: 2026-10-13
    standard: 1.1
    maps:
      lead:
        - {block: lead, from: lead}
      deliverables[]:
        - {block: heading, level: 3, text: '{heading}', id: '{id}'}
        - {block: prose, from: description}
        - {block: code, lang: '{lang}', filename: '{filename}', from: code}
      next:
        - {block: callout, variant: note, title: 'Next: {title}', from: summary}
      section_info:
        - {visibility: internal}
    unmapped: error
  paths: a key path, with [] marking every item of a list and * marking every key of a mapping
  templates: '{field} is replaced by that field of the matched item. A missing field fails validation.'
  from: the field whose value becomes the block's text, items, rows or entries
  unmapped: >
    error (the default) fails validation on any key the profile does not map. warn renders
    it by the unknown-block fallback with a warning. ignore is not allowed.

# ─────────────────────────────────────────────────────────────
# UNKNOWN AND UNSUPPORTED CONTENT - never silent
# ─────────────────────────────────────────────────────────────
fallback:
  unknown_block: >
    A block type the renderer does not know renders every reader-facing value inside it in
    source order: strings as paragraphs, lists of strings as lists, columns and rows as a
    table, mappings as a fields block labelled with their keys. The renderer warns with the
    block's path. It never fails silently and never drops content.
  unknown_attribute: ignored with a warning
  unsupported_in_target: the per-target mapping below decides. Every degradation is logged in the build report.
  build_report: >
    Every build writes a report listing warnings, degraded blocks and skipped content by
    path. An empty report is the evidence that nothing was lost.

# ─────────────────────────────────────────────────────────────
# HIERARCHY
# ─────────────────────────────────────────────────────────────
hierarchy:
  rule: >
    Nesting depth must be visible without reading the content. Each level needs at least two
    of - size, weight, colour, indentation - differing from its parent. Three structural
    levels need three visibly distinct treatments.
  test: >
    View the rendered page at 30% zoom or squint at it. The hierarchy should still read as
    shape. If every label looks like a peer of every other label, the treatment has collapsed
    and the reader has to reconstruct nesting from meaning alone.

# ─────────────────────────────────────────────────────────────
# OUTPUT TARGETS
# The same source renders to each. Every block has a defined result in every target.
# ─────────────────────────────────────────────────────────────
targets:
  markdown:
    native: [heading, prose, list, table, quote, code, figure, divider]
    lead: normal paragraph, or italic if emphasis matters
    definition: bold term, then the description indented beneath
    fields: bold subject, then each label in bold with its value on the following line
    callout: GitHub alert syntax, or a blockquote with a bold variant prefix
    steps: ordered list with bold titles
    comparison: table with subjects as columns
    math: a $$ fenced block of the tex source
    diagram: a fenced block in its notation, then the fallback image if one exists
    toc: list of links to headings
    footnotes: markdown footnotes
  html:
    rule: full fidelity. Every block renders natively with a CSS class per type, and math renders as MathML.
  pdf:
    rule: >
      Full fidelity through HTML plus a print stylesheet, or a direct typesetter. Pagination
      hints, repeating table headers, code continuation marks, page-numbered references, and
      bookmarks for every heading down to the section level.
    toc: generated with page numbers
  docx:
    heading: Word heading styles 1 to 6, so the navigation pane works
    prose_list_quote: native paragraph, list and quote styles
    table: native table with the header row set to repeat
    code: monospace paragraph style with shading, never wrapped without a continuation mark
    callout: single-cell shaded table with the variant as a bold title
    fields_definition_steps: styled paragraphs that keep labels bold
    math: native equation when converted from tex, otherwise an image with alt
    figure_diagram: inline image with a caption field
    references: cross-reference fields
  epub:
    rule: EPUB 3. Reading order from the manifest. A new XHTML file at every page_break_before. Navigation from headings.
    table: scroll container. Too-wide tables follow the html rule.
    code: no wrap, horizontal scroll
    math: MathML with alt text
    figure_diagram: svg where supplied, png otherwise, alt always set
  speech:
    rule: >
      Text only, in reading order, tuned for text-to-speech. No page numbers, running
      headers or footers. Headings are read as headings, with a pause after.
    heading: its generated number and its text
    list: items read in order, with ordered lists numbered aloud
    table: alt, then each row as column label and value pairs
    code: alt, or a one-line notice that a listing is skipped
    math: alt, or the tex source when there is no alt
    figure_diagram: alt, then caption
    callout: the variant and title, then the text
    fields: subject, then each label and value
    inline_markup: removed. Links read their label only.
  plain_text:
    rule: all markup stripped. Hierarchy carried by indentation and blank lines.
    table: one fields-style block per row
    code: kept verbatim, indented four spaces
  slack:
    rule: >
      Slack mrkdwn is a reduced set - bold, italic, strike, code, blockquote, lists. Headings
      degrade to bold. Tables degrade to code blocks or field-per-line. Callouts degrade to a
      blockquote with a bold variant prefix. Accept the loss, do not invent syntax Slack will
      render literally.

# ─────────────────────────────────────────────────────────────
# VALIDATION AND COMPATIBILITY
# ─────────────────────────────────────────────────────────────
validation:
  schema: >
    The machine-readable schema named in this record's schema key checks document shape,
    block types, required fields, allowed values and attribute types. It is published with
    this standard and versioned with it.
  errors:
    - frontmatter is missing title or updated
    - a block has an unknown type, unless the profile marks unmapped as warn
    - a required block field is missing, or an allowed value is wrong
    - a table row's cell count differs from its column count
    - a reference does not resolve, or an id repeats within a document
    - a figure, diagram or fallback path does not exist
    - a figure or diagram has no alt
    - a domain key is not mapped by the declared profile
    - an assembled heading level is greater than 6
    - prose is written as a literal (|) scalar outside code, diagram or math
  warnings:
    - a content file is not listed in the book manifest
    - an unknown attribute was ignored
    - a table needed to degrade to fields per row
    - a diagram had no renderer and no fallback
    - code, math or table has no alt and the build includes the speech target
  versions: >
    Semantic versioning. A minor version only adds optional fields, blocks, targets and
    rules for things that had no defined behaviour, so every 1.x document stays valid under
    any later 1.y. A renderer for 1.y renders every 1.x document with x not greater than y.
    A major version may change existing behaviour, and states the migration.
  this_version_vs_1_0_0: >
    Additive except for one behaviour change: under 1.0.0 a renderer could show key names as
    labels, and under 1.1.0 it may not (keys_are_not_text). Sources that relied on that need
    a profile that writes the labels. Everything else in 1.0.0 means the same here.

# ─────────────────────────────────────────────────────────────
# RENDERER CONFORMANCE
# A renderer implementing this standard must pass all of these.
# ─────────────────────────────────────────────────────────────
conformance:
  - {check: prose reflows, detail: 'no sentence breaks except at the right margin. Folded scalars joined, literal scalars preserved.'}
  - {check: labels complete, detail: 'every entry in a fields block renders its label, consistently across every sibling instance'}
  - {check: hierarchy visible, detail: 'three structural levels distinguishable at a glance'}
  - {check: literals intact, detail: 'inline code, code blocks, figures and filenames render exactly as authored, never reflowed, smart-quoted, wrapped without a mark or truncated'}
  - {check: empty is absent, detail: 'a key with no value renders nothing, not an empty label with blank space under it'}
  - {check: unknown blocks degrade, detail: 'an unknown block renders all of its reader-facing content, structured as the fallback rules say, and the build reports it'}
  - {check: inline markup honoured, detail: 'bold, code and links parse inside every reader-facing scalar and nowhere else'}
  - {check: metadata never renders, detail: 'frontmatter and meta appear in no output. author content appears only in author builds, internal content never.'}
  - {check: no derived text, detail: 'no key name reaches the reader. Every visible label comes from the source or a profile template.'}
  - {check: manifest order, detail: 'a book renders in exactly the order its manifest lists'}
  - {check: numbers generated, detail: 'numbers come from the numbering rules, and no number is printed twice'}
  - {check: references resolve, detail: 'every reference renders as a working link or label in every target'}
  - {check: nothing silent, detail: 'every degradation, skip and fallback appears in the build report'}
