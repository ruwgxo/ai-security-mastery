common_mistakes:
  mistake_1:
    description: Treating a deployed, integrated detector suite as finished
    why_it_happens: |-
      Every visible engineering task is complete -- the detectors work, they are deployed, their detections reach the SIEM -- so the work feels done.
    consequence: |-
      The suite silently decays as attacks and traffic drift away from its training distribution, missing new attacks and flagging shifted-but-benign traffic, with no error to announce it.
    correct_approach: |-
      Treat the suite as a living system inside a continuous improvement loop that measures the decay and reverses it, so degradation is caught and corrected rather than accumulating unseen.
  mistake_2:
    description: Tuning the detectors by intuition instead of against measured metrics
    why_it_happens: |-
      A specific false positive or missed attack is vivid and prompts an immediate hand-tuned fix, which feels responsive.
    consequence: |-
      Each fix optimises for the last anecdote and may worsen the aggregate, because there is no baseline to show whether the change improved or regressed the suite overall.
    correct_approach: |-
      Measure detection and performance metrics first, tune against them, and confirm the change improved the aggregate -- the metrics are the objective, not the anecdote.
  mistake_3:
    description: Monitoring only performance, or only detection quality
    why_it_happens: |-
      Performance dashboards are standard operational hygiene and detection quality feels like a build-time concern, so one family gets watched and the other does not.
    consequence: |-
      A performance-only view misses a suite that is fast and quietly blind; a detection-only view misses a suite that is accurate and unusably slow -- and the two are coupled, so tuning one blind damages the other.
    correct_approach: |-
      Monitor both families as two axes of one optimisation, so a tuning decision can weigh a recall gain against its latency cost rather than optimise one in ignorance of the other.
  mistake_4:
    description: Retraining or swapping in a candidate detector without validating it first
    why_it_happens: |-
      A retrained model built from fresh data is assumed to be an improvement, so it is promoted directly.
    consequence: |-
      A candidate can be worse than the incumbent -- trained on noisy or imbalanced labels, or a poisoned dataset -- and deploying it unvalidated silently degrades the suite it was meant to improve.
    correct_approach: |-
      Validate every candidate against the quality bar, promote through the versioned registry with a rollback path, and A/B-test on bounded live traffic before full promotion, because improvement must be safe.
section_summary:
  compact: |-
    Section 17.01 anchors Chapter 17 by refuting the idea that a deployed, integrated detector suite is finished. A suite decays without maintenance because the attacks and traffic it faces evolve away from the distribution it was built on -- the same silent drift Chapter 13 detects, now addressed operationally. The answer is a continuous improvement loop with a fixed sequence: measure, curate, retrain, validate, A/B-test, promote, and then measure again, because the loop never terminates and each stage produces exactly what the next consumes. Measurement splits into two coupled families that must both be watched: detection metrics (TPR, FPR, precision, recall) say how well the suite detects, and performance metrics (latency, throughput, errors) say how well it runs, and because tuning for recall often costs latency they are two axes of one optimisation rather than independent dashboards. The loop tunes toward three concrete targets -- reduce false positives, raise the true-positive rate toward 95%+, hold P99 latency under 50ms -- which form a trade-off surface where moving toward one moves away from another, and the base-rate problem makes false-positive reduction the governing constraint because rare attacks let even a small false-positive rate dominate precision. The loop is assembled from pieces the earlier chapters left ready: it measures on the Chapter 14 observability stack, triggers retraining from the Chapter 13 drift signal, and promotes through the Chapter 12 model registry. Its one new piece is where it closes -- at the analyst, whose disposition of a SIEM alert as a true or false positive labels that detection and supplies the ground truth the whole improvement half runs on.
  key_takeaways:
  - |-
    A deployed, integrated detector suite degrades without tuning because attacks and traffic drift away from its training distribution
  - |-
    The continuous improvement loop -- measure, curate, retrain, validate, A/B-test, promote -- is the discipline that reverses the decay and never terminates
  - |-
    Detection metrics and performance metrics are two coupled axes of one optimisation, and both must be monitored
  - |-
    The optimisation targets -- FP down, TPR toward 95%+, latency under 50ms -- form a trade-off surface, not three independent goals
  - |-
    The base-rate problem makes false-positive reduction the governing constraint, because rare attacks let a small FPR dominate precision
  - |-
    The loop closes at the analyst: a disposition of a SIEM alert labels the detection and supplies the ground truth for retraining
preview_section_17_02:
  title: 'Detection Metrics: TPR, FPR, Precision, and Recall'
  summary: |-
    Section 17.02 builds the first measurement family: the detection metrics that quantify how well the detectors detect. It computes true-positive rate, false-positive rate, precision, and recall per detector and at the suite level from a confusion matrix, develops the precision-recall trade-off that the detector threshold controls, and makes the base-rate problem calculable -- showing why, for rare attacks, precision is dominated by the false-positive rate and a strong detector still floods analysts with false alarms unless its FPR is driven very low. These metrics are the objective the whole tuning loop optimises.
