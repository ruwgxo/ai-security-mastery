section_overview:
  one_line_summary: |-
    A deployed, integrated detector suite is not a finished artifact -- its detection quality decays as attacks and traffic evolve away from what it was built on -- and Section 17.01 is the map of the continuous improvement loop that reverses that decay: measure the detectors with detection and performance metrics, curate a labelled dataset from analyst dispositions, retrain, validate, and A/B-test the improvement before promoting it, all driving three concrete targets -- false positives down, true-positive rate up toward 95%+, and latency held under 50ms.
  why_this_section_exists: |-
    Chapters 15 and 16 built the detector suite and wired it into security operations. A reader could reasonably think the job is done: the detectors work, they are deployed, their detections reach the SIEM. This section exists to refute that. A detector suite is not a finished artifact but a system that degrades the moment it stops being maintained, because the world it detects does not hold still -- attackers change their techniques, legitimate traffic shifts, and the distribution the detectors learned drifts out from under them. This is the same silent decay the Chapter 13 drift monitors detect; Chapter 17 is the operational answer to it, a full loop that measures the degradation and reverses it.

    The section anchors the chapter the way 15.01 and 16.01 anchored theirs, and it makes the loop concrete rather than aspirational. The loop has two halves. The measurement half quantifies the current state: detection metrics (true-positive rate, false-positive rate, precision, recall) say how well the detectors detect, and performance metrics (latency, throughput, errors) say how well they run. The improvement half acts on what measurement reveals: dataset curation collects true and false positives by reading analyst dispositions of SIEM alerts, retraining refreshes the detectors on that curated data when drift and label accumulation warrant it, and A/B testing compares a candidate against the incumbent on live traffic before it is promoted. Between them the two halves close a feedback loop from operations back to the detectors, and that loop drives the chapter's optimisation targets. State the loop and the targets once here, and the following six sections are each a deliberate build of one stage.
  position_in_chapter: |-
    Section 17.01 is the taxonomy anchor for the six sections that follow. It frames the continuous improvement loop that 17.02-17.03 measure, 17.04-17.05 feed and refresh, and 17.06 closes and assembles, and it states the optimisation targets the whole chapter tunes toward. It builds on the Chapter 14 observability stack and the Chapter 13 drift detection, and depends on the Chapter 16 SIEM integration whose alert dispositions become the curation labels.
