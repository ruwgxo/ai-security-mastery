prose_content:
  part_1:
    title: Why a Deployed Suite Is Not a Finished Suite
    body: |-
      It is tempting to read the end of Chapter 16 as the end of the work. The detectors are built, tuned to a quality bar, deployed behind a production gateway, and their detections flow into the SIEM as actionable alerts. Every visible task is complete. And yet the suite, left exactly as it is, will get worse -- not because anything breaks, but because the world it was built to detect keeps moving. Attackers revise their techniques the moment the old ones stop working; legitimate traffic shifts as the product changes and users find new ways to phrase things; the statistical distribution the detectors learned during training slowly stops matching the distribution they see in production. A detector is a snapshot of a moving target, and a snapshot ages.

      This is the same phenomenon Chapter 13 named as drift and built monitors to detect. There, drift was a signal to watch. Here, it is a problem to solve operationally. A detector whose training distribution has drifted away from live traffic quietly loses accuracy: it misses attacks it would once have caught because they no longer look like its examples, and it flags benign traffic that has wandered into territory its training marked as suspicious. Neither failure announces itself. There is no error, no alarm, no crash -- just a slow erosion of detection quality that is invisible unless something is measuring it. The premise of this chapter is that a detection system must be treated as a living thing that requires continuous maintenance, and that the maintenance has a definite shape: a loop that measures the erosion and reverses it. The rest of the section lays out that loop.
  part_2:
    title: The Continuous Improvement Loop
    body: |-
      The maintenance is not a grab-bag of tuning tricks; it is a single loop with a fixed sequence, and naming the sequence is what turns ad-hoc tinkering into a discipline. The loop is: measure, curate, retrain, validate, A/B-test, promote -- and then measure again, because the loop never terminates. Measure establishes the current detection and performance quality, so tuning has an objective baseline rather than a hunch. Curate collects labelled examples from live operation -- the true and false positives that analysts confirm -- so retraining has fresh, real data rather than a stale training set. Retrain produces a candidate detector from the curated data. Validate checks that candidate against the quality bar and current traffic before it is allowed anywhere near production. A/B-test compares it against the incumbent on a bounded slice of live traffic to see which is actually better. And promote installs the winner, at which point the loop returns to measuring the newly-promoted suite.

      The order matters and the loop's closure matters. Each stage produces exactly what the next consumes: measurement identifies where the suite is weak, curation turns operation into training data, retraining turns data into a candidate, validation and A/B testing turn a candidate into a trusted promotion. And because the loop closes -- promotion feeds back into measurement -- the suite does not merely get fixed once but keeps improving as the loop runs. A suite outside such a loop is maintained by heroics: someone notices a problem, investigates, hand-tunes a fix, and hopes. A suite inside the loop is maintained by process: the degradation is measured, the fix is data-driven, and the improvement is proven before it ships. This chapter builds each stage of the loop as a concrete, running component.
  part_3:
    title: 'Two Metric Families: Detecting Well and Running Well'
    body: |-
      Measurement -- the first stage of the loop -- splits into two questions that must not be confused, because they answer to different owners and trade against each other. The first is: how well does the suite detect? That is the detection metrics -- true-positive rate, false-positive rate, precision, and recall -- computed by comparing what the detectors decided against what was actually true. They are the security-quality metrics: a detector with a high true-positive rate catches the attacks, and one with a low false-positive rate does not drown analysts in false alarms. The second question is: how well does the suite run? That is the performance metrics -- latency, throughput, error rate -- the operational metrics that say whether the suite meets its sub-50ms budget and its capacity under load.

      Both families must be monitored, and monitoring only one is a classic failure. A suite watched only for performance can be fast, cheap, and quietly blind -- missing attacks while every latency dashboard stays green. A suite watched only for detection quality can be accurate and unusably slow, catching everything a hundred milliseconds too late. Worse, the two families are coupled: tuning a detector for higher recall often costs latency, because catching more attacks may mean running a heavier model or an extra layer. So the two families are not independent dashboards to glance at separately; they are two axes of one optimisation, and a tuning decision that improves one while ignoring the other is not actually an improvement. Sections 17.02 and 17.03 build the two families precisely so that later tuning can weigh them against each other rather than optimise one blind to the other.
  part_4:
    title: The Optimisation Targets and Their Trade-offs
    body: |-
      Measurement is only useful if there is a target to measure against, and this chapter's targets are concrete: reduce false positives, raise the true-positive rate toward 95% and above, and hold the P99 latency under 50 milliseconds. These are not independent goals to be maximised in isolation -- they are a trade-off surface, and the value of stating them together is that it forces every tuning decision to be honest about what it costs. Raising the true-positive rate by lowering a detector's threshold will, on the same detector, raise the false-positive rate too, because a threshold that catches more attacks also catches more benign traffic that resembles them. Driving false positives to near zero by raising thresholds will let more real attacks slip through as missed detections. And squeezing either detection target hard enough will eventually cost latency, as the suite reaches for heavier models to make the distinction.

      The base-rate problem, which Section 17.02 develops in full, sharpens the false-positive target into the dominant constraint. Because real attacks are rare, precision -- the fraction of alerts that are real -- is governed far more by the false-positive rate than by the true-positive rate: even a small false-positive rate, applied to the vast majority of traffic that is benign, produces more false alerts than there are real attacks to find. So 'reduce false positives' is not one target among three; for a suite facing rare attacks it is often the binding one, the number that decides whether the alerts are worth an analyst's attention at all. Tuning, then, is not maximising three numbers. It is choosing a defensible point on a surface where moving toward one target moves away from another, with the base rate deciding how much a given false-positive rate really costs. The metrics exist so that this choice is made with evidence rather than asserted.
  part_5:
    title: Building on Chapter 14 and 13, and Closing the Loop at the Analyst
    body: |-
      The improvement loop does not start from nothing. Its measurement half is built on the Chapter 14 observability stack: the golden-signal instrumentation, the metrics pipeline, the logging and tracing already emit the raw execution data that performance monitoring reads, so Section 17.03 watches the suite over time by consuming what Chapter 14 already produces rather than instrumenting afresh. Its trigger comes from Chapter 13: the drift detection that Chapter 13 built as a warning signal becomes, in Section 17.05, the trigger that decides when retraining is warranted, so the suite is refreshed when the data has actually moved rather than on an arbitrary calendar. And its validation reuses the Chapter 12 model registry, so a retrained detector is promoted as a versioned artifact with a rollback path rather than swapped in place. Chapter 17 is less a new construction than the assembly of pieces the earlier chapters left ready.

      The one genuinely new piece is where the loop closes: at the security analyst. The detections flowing into the SIEM from Chapter 16 are not just alerts to be actioned -- they are unlabelled examples waiting to be labelled, and the analyst who dispositions an alert as a true or false positive is, in that act, labelling the detection that produced it. Those dispositions are the ground truth the whole improvement half runs on: they are the labels dataset curation collects (17.04), which become the data retraining consumes (17.05), which produces the candidate A/B testing evaluates (17.06). The feedback loop from operations back to detection is, concretely, the analyst's disposition flowing backward into the training set. This is why the loop could only be built now, after the SIEM integration: without detections reaching analysts and analysts dispositioning them, there is no label supply, and without labels there is nothing to retrain on. The chapter proceeds through the loop in order -- metrics (17.02-17.03), curation (17.04), retraining (17.05), A/B testing and the assembled loop (17.06), and synthesis (17.07) -- each section a stage made concrete.
