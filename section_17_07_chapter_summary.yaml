assessment:
  title: Chapter 17 Knowledge Assessment
  description: |-
    Twenty questions covering the continuous improvement loop: the two metric families and the base-rate problem, dataset curation, retraining and validation, A/B testing, and the assembled loop. Answers follow the questions.
  questions:
  - Q1. Why is a deployed, integrated detector suite not a finished artifact?
  - Q2. Name the six stages of the continuous improvement loop in order.
  - |-
    Q3. What distinguishes detection metrics from performance metrics, and why must both be monitored?
  - |-
    Q4. Define true-positive rate, false-positive rate, and precision in terms of the confusion matrix.
  - |-
    Q5. What is the base-rate problem, and why does it make false-positive reduction the governing target?
  - Q6. How does the detector threshold control the precision-recall trade-off?
  - Q7. Why is latency monitored by P99 rather than by average?
  - Q8. What is the purpose of the warning band in regression detection?
  - |-
    Q9. Where does the feedback loop close, and how does an alert become a training label?
  - |-
    Q10. How are conflicting analyst dispositions of the same detection resolved into one label?
  - |-
    Q11. Why must a curated set not be used for training in its true, benign-dominated proportion?
  - |-
    Q12. Why keep the full imbalanced curated set alongside the rebalanced training view?
  - Q13. When is retraining triggered, and why not on a fixed calendar?
  - Q14. What does the cooldown prevent?
  - Q15. Why must every retrained candidate be validated, and against what two bars?
  - |-
    Q16. Why is validation performed on the true imbalanced distribution rather than a balanced set?
  - |-
    Q17. Why is validation on a held-out set not sufficient, making a live A/B test necessary?
  - |-
    Q18. What two guardrails bound the harm a bad candidate can do during an A/B test?
  - |-
    Q19. Why must an A/B difference be statistically significant before it decides a winner?
  - |-
    Q20. How does the assembled loop guarantee that a change reaches production only after being proven better?
  answers:
  - |-
    A1. Because the attacks and traffic it faces evolve away from its training distribution, so it silently decays -- missing new attacks and flagging shifted-but-benign traffic -- unless continuously monitored and tuned.
  - |-
    A2. Measure, curate, retrain, validate, A/B-test, promote -- then measure again; the loop never terminates.
  - |-
    A3. Detection metrics (TPR, FPR, precision, recall) say how well the suite detects; performance metrics (latency, throughput, errors) say how well it runs. Both matter because a suite can be accurate and slow or fast and blind, and the two are coupled -- tuning for recall often costs latency.
  - |-
    A4. TPR (recall) = TP/(TP+FN), fraction of attacks caught; FPR = FP/(FP+TN), fraction of benign traffic falsely alerted; precision = TP/(TP+FP), fraction of alerts that are real.
  - |-
    A5. When attacks are rare, precision is dominated by the false-positive rate acting on the vast benign majority, not the true-positive rate on the rare attacks -- so even a small FPR makes most alerts false, and reducing FPR is the only path to usable precision.
  - |-
    A6. The threshold is the score above which the detector alerts; lowering it raises recall and lowers precision (more alerts, more of them false), raising it does the reverse -- so tuning is choosing a point on the trade-off.
  - |-
    A7. An average hides the slow tail; the P99 is the latency one request in a hundred experiences, and the budget is written against the tail because that is where the user-visible pain is.
  - |-
    A8. It flags a P99 that has climbed past a fraction of the budget (e.g. 80%) before it breaches, so a regression is caught while the suite still meets its budget and there is headroom to act.
  - |-
    A9. At the analyst: an analyst dispositions a SIEM alert as a true or false positive, and that disposition is a ground-truth label on the detection that produced the alert; accumulated dispositions are the training dataset.
  - |-
    A10. By confidence-weighted vote -- summing the confidence behind each verdict and taking the heavier side -- with the strength of agreement carried forward as the label confidence, so contested labels are trusted less.
  - |-
    A11. A model trained on data that is overwhelmingly one class learns to predict that class always -- a benign-dominated set teaches the detector to call everything benign, zeroing both its true-positive and false-positive rates.
  - |-
    A12. The rebalanced view is for training (so a boundary can be learned); the full imbalanced set is for evaluation, because precision measured on a balanced set is a base-rate fiction that would not predict production.
  - |-
    A13. On the Chapter 13 drift signal or the accumulation of enough new curated labels. A calendar either retrains when nothing changed (risk, no reward) or stays stale when the world shifts fast between dates.
  - |-
    A14. Thrashing -- it enforces a minimum number of cycles between retrains so a noisy drift signal flickering above and below its threshold cannot trigger constant retraining and constant regression risk.
  - |-
    A15. Because a candidate can be worse (label noise, imbalance, or poisoning). It is validated against the absolute quality bar (minimum recall, maximum FPR, minimum precision) and against the incumbent (no recall regression); it must clear both.
  - |-
    A16. Because precision on a balanced set is a fiction that ignores the real base rate, so a candidate that looks precise there would flood production with false positives; the true distribution gives numbers that predict production.
  - |-
    A17. A held-out set is a frozen sample and production is live and shifting; a candidate can pass validation yet underperform on traffic the set did not represent, so a live A/B test proves it on the real distribution before takeover.
  - |-
    A18. A bounded, hard-capped candidate traffic fraction (a bad candidate harms only a small slice) and early-stopping (a significantly-regressing candidate is stopped rather than run to completion) -- bounding harm in breadth and in duration.
  - |-
    A19. Because a small difference may be sampling noise that reverses on the next batch; promoting on a non-significant difference is promoting on chance, so the loop would random-walk while believing it improves. Ties keep the incumbent.
  - |-
    A20. It places a gate at every stage -- curation quality, validation, A/B significance, with rollback -- and provides no path to production that bypasses them, so a change fails at whichever gate it cannot pass and only a measured, validated, live-proven candidate is promoted (and can still be rolled back).
section_summary:
  compact: |-
    Section 17.07 synthesises Chapter 17 into one system and hands off to Chapter 18. The whole chapter is a single never-terminating loop: the suite runs and is measured (detection metrics 17.02, performance metrics 17.03); analysts disposition its SIEM alerts and those dispositions become labels the curator turns into a quality-gated dataset (17.04); drift or accumulated labels trigger a retrain that is validated against the quality bar and the incumbent (17.05); a validated candidate is proven on live traffic by an A/B test and promoted only if it wins, reversibly (17.06); and then the suite is measured again. One rule runs through every stage -- a change reaches production only after being measured against a baseline, validated, and proven significantly better on live traffic, and even then stays reversible -- and no single stage enforces it; the loop does, by placing a cumulative set of gates (curation quality, validation, A/B significance, rollback) that a change cannot bypass, making the safe path the only path. Beneath the loop sits measurement as its foundation: every stage depends on honest metrics measured on the true distribution, which is why the base-rate problem -- precision dominated by the false-positive rate for rare attacks -- is the sharpest expression of measuring the thing that predicts production rather than the convenient thing. The section provides the loop architecture, a metric-and-stage reference card, a monitoring-and-tuning checklist, the consolidated mistakes, and a twenty-question assessment. It then transitions to Chapter 18: the suite is now built, deployed, integrated, and self-improving, and what remains is hardening the whole assembly -- including the improvement loop itself, which can be poisoned and makes automatic production changes -- to be dependable under real-world failure, abuse, and scale.
  key_takeaways:
  - |-
    The chapter is one never-terminating loop: measure, curate, retrain, validate, A/B-test, promote, measure again
  - |-
    One rule governs it -- a change reaches production only after being measured, validated, and proven better on live traffic
  - |-
    The loop enforces that rule with cumulative gates that a change cannot bypass, making the safe path the only path
  - |-
    Measurement on the true distribution is the foundation everything rests on; the base-rate problem is why it must be careful
  - |-
    The feedback loop closes at the analyst, whose dispositions supply the labels that make the suite self-improving
  - |-
    Chapter 18 hardens the built, integrated, self-improving suite -- including the loop itself -- for production at scale
