    rows:
    - - Treating a deployed suite as finished
      - A suite decays without continuous tuning
    - - Tuning by intuition, not measurement
      - Measurement is the objective; tuning without it is guessing
    - - Monitoring only performance or only detection
      - The two families are coupled axes of one optimisation
    - - Judging a detector by TPR alone
      - The base rate makes FPR govern precision for rare attacks
    - - Passing the raw disposition stream to training
      - Curation must resolve, rebalance, and quality-gate labels
    - - Training on the benign-dominated distribution
      - A rebalanced view trains; the true distribution evaluates
    - - Retraining on a fixed calendar
      - Retraining is triggered by evidence of change, not the date
    - - Promoting a candidate without validation
      - A candidate can be worse and must be proven, not trusted
    - - Skipping the live A/B test
      - A held-out set approximates production but cannot equal it
    - - Promoting on a non-significant difference
      - A difference must be significant, or it is noise
    - - Promoting irreversibly
      - Validation cannot catch every regression, so promotion must roll back
