deliverables:
  deliverable_1:
    title: PII-Leakage Case Analysis
    filename: (case analysis -- incident, detection, response, lessons)
    description: |-
      The full incident-detection-response-lessons analysis of the PII-leakage case: the healthcare scenario where PII handling is routine, the low-false-positive balance as the distinctive challenge, leakage as a contextual rather than lexical distinction, input and output PII with output as the graver surface, the compliance-shaped and calibrated response, and the lessons on the inverted detection posture. Presented as the structured analysis in the prose and reference tables.
    implementation_notes: |-
      No runnable code: a case analysis in the chapter's deliverable form. It follows the 18.01 method, foregrounding how the Chapter 15 PII scanner must integrate with the behavioural context to distinguish leakage from legitimate handling, and why output monitoring is the higher-severity surface.
    code: |
      # Section 18.05 deliverable: PII-Leakage Case Analysis.
      #
      #   INCIDENT   Composite healthcare deployment where PII handling is the routine
      #              work; the rare misuse must be found among mostly-legitimate PII.
      #   DETECTION  Catching PII is the easy part (Ch15 scanner). The hard part is
      #              distinguishing LEAKAGE from LEGITIMATE HANDLING, which is
      #              CONTEXTUAL, not lexical -- the same identifier is a leak or not
      #              depending on who/where/why. This draws in the behavioural context
      #              (entity, authorisation, purpose, channel) from Ch13.
      #              Input PII  -> input scanner (access/appropriateness).
      #              Output PII -> output monitoring (the graver, system-disclosure surface).
      #   RESPONSE   Compliance-shaped AND calibrated: contain + audit + assess-thresholds
      #              + report; route AMBIGUOUS flows to rapid human judgement rather than
      #              auto-block, because both errors cost (missed leak = breach;
      #              over-flag = disrupted care).
      #   LESSONS    The detection posture INVERTS: precision over recall, because the
      #              thing detected is mostly legitimate. A PII scanner tuned like an
      #              attack detector fails in a PII-native domain.
      print('Section 18.05: PII-leakage case analysis -- see prose and tables.')
    note: Deliverable is a structured case analysis, not code.
  deliverable_2:
    title: Compliance-Aware PII-Leak Response Playbook
    filename: (response playbook -- PII leak under healthcare compliance)
    description: |-
      The response playbook for a PII leak under healthcare compliance, following the 18.01 template but calibrated against two costly errors: the trigger, the calibrated containment (block confirmed leaks, route ambiguous flows to rapid human judgement), the enrichment with flow context, the compliance escalation with reporting assessment, the recovery, and the review. The playbook that meets a PII leak's regulatory stakes without disrupting the legitimate care the false-positive would impede.
    implementation_notes: |-
      No runnable code: a response playbook in the chapter's deliverable form. It extends the enterprise compliance playbook of 18.02 with the calibrated, precision-oriented handling the PII balance requires, depending on the Chapter 16 integration to carry the flow context a human judgement needs.
    code: |
      # Section 18.05 deliverable: Compliance-Aware PII-Leak Response Playbook.
      #
      #   TRIGGER   PII scanner or output monitoring flags a PII flow.
      #   CONTAIN   Confirmed leak -> block and preserve the record under access control.
      #             Ambiguous flow -> do NOT auto-block; route to rapid human judgement
      #             (auto-block impedes care; auto-permit risks a breach).
      #   ENRICH    Attach the flow context -- entity, authorisation, purpose, channel,
      #             input vs output surface -- via the Ch16 integration.
      #   ESCALATE  For a confirmed leak: audit-log to standard, assess against
      #             reporting thresholds, escalate to compliance, trigger reporting if met.
      #             Output leaks escalate at higher severity than input leaks.
      #   RECOVER   Confirm the leak is contained; restore normal handling; ensure
      #             legitimate care flows are not left blocked.
      #   REVIEW    Disposition into the Ch17 tuning loop, tuning for precision so the
      #             scanner does not drift toward disrupting legitimate handling.
      print('Section 18.05: compliance-aware PII-leak response playbook -- see prose.')
    note: Deliverable is a response playbook, not code.
common_mistakes:
  mistake_1:
    description: Tuning a PII scanner like an attack detector in a PII-native domain
    why_it_happens: |-
      The scanner is a detector, so it is tuned for high recall on PII the way an attack detector is tuned for high recall on attacks.
    consequence: |-
      In a healthcare deployment where PII handling is routine, the recall-maximising scanner flags the bulk of the legitimate workload and makes the assistant unusable for clinical work.
    correct_approach: |-
      Tune for precision, following the domain's cost structure: the target is the rare misuse of a mostly-legitimate thing, so over-flagging disrupts the work the system exists to support.
  mistake_2:
    description: Detecting leakage lexically, on the presence of PII patterns
    why_it_happens: |-
      PII has recognisable patterns, so flagging on those patterns looks like a direct way to catch leaks.
    consequence: |-
      A lexical scanner cannot separate a leak from legitimate handling, because the identical PII is both depending on context, so it either misses leaks or floods on legitimate use.
    correct_approach: |-
      Detect leakage contextually -- judging the flow's destination, handler, purpose, and channel -- by integrating the scanner with the behavioural context that defines whether a flow is legitimate.
  mistake_3:
    description: Monitoring input PII but not output PII
    why_it_happens: |-
      Input scanning catches data coming in, which feels like the natural place to stop leaks -- at the door.
    consequence: |-
      Output leakage goes uncaught, and the model can disclose protected data that was never in the input -- from training or cross-context -- which is the graver, system-disclosure surface.
    correct_approach: |-
      Treat output monitoring as first-class and higher-severity than input scanning, because an output leak is the system itself disclosing protected data.
  mistake_4:
    description: Auto-blocking every flagged PII flow to be safe
    why_it_happens: |-
      Blocking anything flagged seems like the cautious, compliance-safe default for protected data.
    consequence: |-
      In a clinical setting a false-positive block impedes legitimate care, so an aggressive auto-block trades a compliance risk for a direct disruption to the work -- both are costly.
    correct_approach: |-
      Calibrate the response: block confirmed leaks, but route ambiguous flows to rapid human judgement, because both a missed leak and an over-flag carry real cost in care.
section_summary:
  compact: |-
    Section 18.05 returns to the healthcare compliance dimension in depth around PII leakage, and its distinctive contribution is that it is the one case not fundamentally about catching an attack but about catching leaks without blocking legitimate use -- in a domain where the data being scanned for is the substance of the work. In a clinical assistant, PII handling is routine and necessary, so a scanner tuned like an attack detector, flagging PII wherever it appears, would flag the entire workload and make the system unusable. The real problem is not detecting PII, which the Chapter 15 scanner does well, but distinguishing the rare leak from the overwhelming majority of legitimate handling -- a needle in a needlestack rather than a needle in a haystack, which inverts the usual detection posture from recall-priority to precision-priority. The central analytical move is that leakage is contextual, not lexical: the identical patient identifier is a leak or legitimate depending on who handles it, for what purpose, through what channel, so a lexical scanner cannot make the distinction and must integrate with the behavioural context -- entity, authorisation, purpose -- that defines a flow as appropriate or not. The case works both surfaces: input PII, largely about access and appropriateness, and output PII, the graver surface, because an output leak is the system itself disclosing protected data rather than a user mishandling data they already had. Under healthcare compliance both errors carry real cost -- a missed leak is a reportable breach, an over-flag is a disruption to care -- so the response is calibrated rather than maximally aggressive, blocking confirmed leaks but routing ambiguous flows to rapid human judgement. The recommendations centre on the balance: contextual detection, output-surface priority, calibrated response, and domain-tuned precision. The deeper lesson is that detection posture must follow the domain's cost structure, not a generic recall-maximising default.
  key_takeaways:
  - |-
    In a PII-native domain like healthcare, PII handling is the work, so flagging PII wherever it appears makes the system unusable
  - |-
    The challenge is not catching PII but distinguishing rare leaks from mostly-legitimate handling -- a precision, not recall, problem
  - |-
    Leakage is contextual, not lexical: the identical PII is a leak or legitimate depending on the flow's who, why, and how
  - |-
    Output PII leakage is the graver surface, because it is the system itself disclosing protected data
  - |-
    Under compliance both a missed leak and an over-flag carry real cost, so the response is calibrated and routes ambiguity to humans
  - |-
    The deeper lesson is that detection posture must follow the domain's cost structure, not a generic recall-maximising default
preview_section_18_06:
  title: 'Case Study 5: Model Abuse Detection'
  summary: |-
    Section 18.06 takes the final case to model abuse in an e-commerce context, where the threat is not a single attacker but a coordinated network. It shows the rate-based, coverage, and graph detection of Chapter 13 against real exfiltration, enumeration, and coordinated abuse -- the exfiltration campaign of individually-benign queries, the enumeration sweep, and the Sybil and bot networks of individually-clean accounts that only aggregate detection can catch -- and draws the architecture recommendations for entity and graph detection in production, completing the case studies before the book conclusion.
