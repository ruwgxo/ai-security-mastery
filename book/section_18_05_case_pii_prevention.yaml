section_overview:
  one_line_summary: |-
    The fourth case, a composite: the PII scanner and output monitoring against real PII leakage on both inputs and outputs in a healthcare deployment, where the distinctive challenge is not catching leaks -- the scanner does that -- but the low-false-positive requirement at scale, because a healthcare assistant must legitimately handle PII constantly, so a scanner that over-flags disrupts the exact clinical work the system exists to support, making the balance between catching leaks and permitting legitimate handling the heart of the case.
  why_this_section_exists: |-
    Every prior case has been about catching an attack. This one is about a subtler and, in a regulated domain, harder problem: catching leaks without blocking legitimate use, where legitimate use itself involves the very data being scanned for. In a healthcare deployment, PII is not an anomaly to be flagged wherever it appears -- it is the substance of the work. A clinical assistant handles patient identifiers, diagnoses, and records constantly and legitimately, so a PII scanner tuned like an attack detector, flagging PII wherever it sees it, would flag almost everything and make the assistant unusable. The case exists to examine that balance, which is the defining difficulty of PII detection in a domain where PII handling is the point.

    This reframes what the PII scanner of Chapter 15 has to do. It is not enough to detect PII with high recall; the scanner must distinguish leakage -- PII going somewhere it should not, to someone who should not receive it, through a channel that should not carry it -- from legitimate handling, where the same PII is used exactly as intended. The distinction is contextual, not lexical: the identical patient identifier is a leak in one context and appropriate clinical data in another. The case works both surfaces of leakage: PII on inputs, where a user provides data that should not enter the system or should be handled with special care, and PII on outputs, where the model produces data it should not have surfaced -- the more dangerous surface, because an output leak is the system itself disclosing protected data. And it works the whole thing under healthcare compliance, where a leak is a reportable regulatory event and an over-flag is a disruption to care, so both kinds of error carry real cost. As established in 18.01, the leaks and the clinical traffic are representative composites, not specific proprietary incidents.
  position_in_chapter: |-
    Section 18.05 is the fourth case study, returning to the healthcare compliance dimension introduced in the enterprise case (18.02) and developing it in depth around one attack class. It exercises the Chapter 15 PII scanner and output monitoring, foregrounds the low-false-positive-at-scale balance that distinguishes PII detection from attack detection, and produces the PII-prevention architecture recommendation and compliance-aware playbook. It sets up the final case (18.06), where the threat shifts from data leakage to coordinated abuse.
