prose_content:
  part_1:
    title: 'The Scenario: PII Where PII Is the Work'
    body: |-
      The scenario is a composite healthcare deployment -- a clinical assistant used by care providers, handling patient data as the ordinary substance of its work. This is what makes the PII case categorically different from the attack cases. When the injection detector flags injection, it is flagging something that should never be there; injection is always anomalous, always unwanted, and a detector that catches all of it is doing exactly right. PII in a healthcare assistant is the opposite: it is supposed to be there, constantly, because the work is clinical and clinical work is made of patient data. A provider asking the assistant to summarise a patient's history, draft a referral, or check a medication is handling PII legitimately and necessarily. A PII scanner that treated every appearance of a patient identifier as a problem would flag the entire workload and make the assistant useless for the purpose it was deployed for.

      So the PII case is not really about whether PII can be detected -- the scanner of Chapter 15 detects PII well, and detection is the easy part. It is about distinguishing the small fraction of PII appearances that are leaks from the overwhelming majority that are legitimate handling. This is a needle-in-a-needlestack problem: not finding PII in a haystack of non-PII, but finding the misplaced PII in a haystack of correctly-placed PII. It inverts the usual detection posture. Where an attack detector wants high recall on a rare bad thing against a benign background, the PII scanner in a healthcare setting needs to find the rare misuse of a thing that is overwhelmingly used correctly, and it must do so without disrupting the correct use. The base-rate problem the book has returned to throughout appears here in a new form: leaks are rare among PII appearances, so the false-positive cost is not just analyst fatigue but direct disruption to clinical care, and that raises the stakes on precision far above the usual.
  part_2:
    title: 'Leakage Versus Legitimate Handling: A Contextual Distinction'
    body: |-
      The core analytical move of the case is recognising that leakage is not a property of the data but of its context. The exact same patient identifier -- the same name, the same record number, the same diagnosis -- is legitimate clinical data in one context and a leak in another. It is legitimate when the provider handling it is authorised, the purpose is clinical, and the channel is appropriate; it is a leak when it flows to someone unauthorised, for a purpose outside care, or through a channel that should not carry it. Nothing about the PII itself distinguishes the two cases. The distinction is entirely contextual, which means a scanner that works lexically -- flagging on the presence of PII patterns -- cannot make it, and will necessarily either miss leaks (if tuned permissively) or flag legitimate handling (if tuned aggressively). The lexical scanner is looking at the wrong thing.

      What the case shows is that effective PII leakage prevention requires the scanner to be contextual: to consider not just whether PII is present but where it is going, who is handling it, and whether that flow is appropriate. This draws the PII detection into the behavioural context the book built -- the entity handling the data, the session it occurs in, the authorisation and purpose that make a flow legitimate or not. A PII appearance is evaluated against the context of its flow, so the same identifier that passes in an authorised clinical summary is flagged when it appears in an output heading to an unauthorised destination. This is why the PII case, despite centring on a per-request scanner, still exercises the behavioural layer: the context that distinguishes leak from legitimate use is exactly the entity-and-session context the behavioural layer maintains. Catching PII is a lexical problem the scanner solves; distinguishing a leak from legitimate handling is a contextual problem that requires the surrounding system.
  part_3:
    title: Input PII and Output PII
    body: |-
      The case works two surfaces of PII leakage, and the distinction between them is consequential. Input PII is data arriving in a request -- a user providing patient information to the assistant. Some input PII is entirely legitimate (the provider gives the assistant the data it needs to do clinical work), and some is problematic: data that should not enter the system at all, data provided by someone not authorised to handle it, or data that entered through an inappropriate channel. The input PII scanner examines what comes in, catching the problematic inflows while permitting the legitimate ones -- and permitting the legitimate ones is the hard part, because the legitimate inflows are the bulk of the traffic. Input PII detection is largely about access and appropriateness: is this person, in this context, permitted to bring this data in.

      Output PII is the graver surface, and the case treats it as such. Output PII is data the model produces -- and when the model surfaces PII it should not have, that is the system itself disclosing protected data, which is a categorically more serious event than a user bringing in data they had access to anyway. An output leak means the assistant told someone something protected they should not have learned: it surfaced one patient's data in another's context, produced information the requester was not authorised to receive, or reconstructed protected data the model had absorbed. Output monitoring is therefore essential and distinct from input scanning -- it watches what the model says, not just what it is told, because the model can leak data that was never in the input, drawn from its training or from context it should have kept separate. The case shows both surfaces monitored, with output leakage treated as the higher-severity event, because the difference between a user mishandling data they already had and the system disclosing data it should have protected is the difference between a policy violation and a breach.
  part_4:
    title: The Compliance-Shaped Response and the Cost of Both Errors
    body: |-
      Under healthcare compliance, the PII-leak response is shaped by regulation exactly as the enterprise case established, but the PII case sharpens a point that the balance makes unavoidable: both errors carry real cost, so the response must be calibrated rather than maximally aggressive. A missed leak -- a false negative -- is a compliance event, potentially a reportable breach with regulatory and patient-harm consequences. But an over-flag -- a false positive -- is not a harmless abundance of caution here; it is a disruption to clinical care, blocking or delaying a provider doing legitimate work with patient data, and in a clinical setting that disruption has its own real cost. This is unlike the attack cases, where a false positive is mostly wasted analyst time; in the PII case, a false positive can impede care. The response must therefore be precise, and the playbook reflects a calibrated posture rather than a block-everything one.

      When a genuine leak is caught, the response is the full compliance-shaped sequence: contain the leak, preserve the record to the regulatory standard, assess against reporting thresholds, escalate to the compliance function, and trigger the reporting obligation if the thresholds are met -- the healthcare version of the enterprise playbook, with the reporting stakes at their highest because a PII breach is squarely what the regulations exist to govern. But the playbook also has to handle the ambiguous case gracefully: a flagged flow that might be a leak or might be legitimate handling should be escalated for rapid human judgement rather than automatically blocked, because auto-blocking a false positive impedes care and auto-permitting a false negative risks a breach -- neither error is acceptable to make silently. The SIEM integration of Chapter 16 carries the leak detection into operations with the context that lets a responder make that judgement quickly: the entity, the flow, the authorisation, the reason it was flagged. The case shows that PII response under compliance is a precision exercise, calibrated against two costly errors, in a way the attack responses are not.
  part_5:
    title: Lessons and Architecture Recommendations
    body: |-
      The PII case validates the scanner and output monitoring against real leakage under the hardest constraint -- a domain where PII handling is routine -- and yields architecture recommendations centred on the low-false-positive balance. The first is contextual detection: a PII scanner in a PII-native domain must evaluate the context of a flow, not just the presence of PII, because leakage is contextual and a lexical scanner cannot separate leak from legitimate use. This means integrating the scanner with the behavioural context -- entity, authorisation, purpose, channel -- so the same identifier is judged by where it is going. The second is output-surface priority: output monitoring must be treated as first-class and higher-severity than input scanning, because an output leak is the system disclosing protected data, the graver event. The third is calibrated response: because both a missed leak and an over-flag carry real cost in a clinical setting, the response must be precise and route ambiguous cases to rapid human judgement rather than auto-blocking, so it neither impedes care nor risks a silent breach.

      The deeper lesson is about the inverted detection posture the PII case reveals. Every attack case sought a rare bad thing against a benign background, where high recall is the priority and a false positive is cheap. The PII case seeks the rare misuse of a thing that is overwhelmingly used correctly, where precision is the priority and a false positive is expensive -- it disrupts the legitimate work the system exists to support. This inversion is the case's contribution to the chapter: it shows that detection is not one posture but several, and that a detector's tuning must follow the cost structure of its domain, not a generic recall-maximising default. A PII scanner tuned like an attack detector fails in healthcare not because it detects badly but because it detects with the wrong posture for a domain where the thing it detects is mostly legitimate. It validates that the Chapter 15 PII scanner, integrated with context and tuned for its domain's cost structure, prevents leakage without disrupting care -- and it sets up the final case, where the threat returns to coordinated attack, distributed across a network of entities that the graph analysis must catch.
