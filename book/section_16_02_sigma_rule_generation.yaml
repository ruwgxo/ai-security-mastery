lead: >
  The first integration is the portable one: a generator that turns the detector suite into Sigma
  rules -- platform-agnostic detection logic in the logsource-detection-condition taxonomy -- by
  mapping detector verdicts to Sigma conditions, so the detection logic deploys to any SIEM and,
  because it is generated rather than hand-authored, stays in sync with the deployed detectors.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          The connectors in the sections that follow each bind the suite to one platform. Sigma is
          the antidote to that: a rule written once in a neutral format that Splunk, Elastic, and
          other platforms each compile to their own query language. Generating Sigma from the
          detectors gives the integration surface a portable core -- detection logic that runs
          anywhere without being rewritten per platform -- and it is where the chapter starts
          because it is the least coupled and the most reusable part of the surface.
      - type: prose
        text: >
          The section also settles a question the whole chapter depends on: how does a detector
          verdict become a rule the SIEM evaluates? A Sigma rule is governed by three keys --
          logsource (the stream it runs on), detection (the field selection that matches), and
          condition (how selections combine). The detection-event schema of 16.01 supplies the
          fields, and the verdict supplies the selection: flag and block alert, allow stays quiet.
          That mapping is small but load-bearing, and it is kept as data so it is auditable and
          tunable rather than buried in the generator. Finally, the section makes generation the
          mechanism that defeats drift. Hand-authored SIEM rules go stale the moment a detector
          changes; generated rules are regenerated from the detectors, and a content hash over the
          rule set turns a detector change into a redeploy signal, keeping the SIEM logic current by
          construction.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 16.02 builds the portable core of the integration surface before the
          platform-specific connectors of 16.03-16.05. It consumes the detection-event schema of
          16.01, expresses the Chapter 11 Section 11.02 signature layer as SIEM-deployable rules,
          and produces the rule set that the Splunk (16.03) and Elastic (16.05) integrations deploy
          onto their platforms. The verdict-to-condition mapping defined here is reused by every
          connector that evaluates rules.
