prose_content:
  part_1:
    title: Sigma as Portable Detection Logic
    body: |-
      Every platform connector in this chapter binds the suite to one product: the Splunk connector speaks HEC, the Datadog connector speaks the Logs API, the Elastic connector speaks Logstash. That binding is necessary for delivering events, but it is a liability for detection logic. If the rule that says 'a blocked injection is a high-severity alert' is written in Splunk's search language, it runs only on Splunk, and a team that moves to Elastic rewrites it. Sigma exists to break that coupling. A Sigma rule is detection logic in a neutral, YAML-based format, and each platform has a Sigma compiler that translates it into that platform's own query language. Write the rule once; deploy it anywhere.

      That portability is why the chapter builds Sigma generation first, before any connector. The generated rules are the part of the integration surface with no platform lock-in -- the same rule set targets Splunk and Elastic and whatever comes next, through their compilers. And generating the rules from the detectors, rather than writing them by hand, adds a second property that matters as much as portability: the rules cannot drift from the detectors, because they are derived from them. The rest of the section builds the generator, defines the verdict mapping it rests on, and makes regeneration the mechanism that keeps deployment current.
  part_2:
    title: 'The Sigma Taxonomy: Logsource, Detection, Condition'
    body: |-
      A Sigma rule is governed by three keys. Logsource names the stream the rule runs on -- here, the detection gateway's event stream, identified by a product and service so the platform routes the rule to the right index or data source. Detection is the heart of the rule: one or more named selections, each a set of field values that must be present for the selection to match. Condition combines the selections into the rule's overall match -- in the simplest case, just the name of the single selection. Around these three sit metadata: a title, a stable id, a description, a level, and optional tags such as MITRE ATLAS technique references.

      The generator's job is to fill those keys from a detector. The logsource is fixed for the whole suite -- every detector writes to the same gateway stream. The detection selection is where the detector's identity and verdicts go: a selection that matches when the event's detector field is this detector and its verdict is one of the alerting verdicts. The condition references that selection. The level comes from the detector's severity. So a rule is almost entirely determined by two facts about the detector -- its name and which verdicts should alert -- which is exactly why generation is feasible: there is no per-rule cleverness to hand-craft, only a descriptor to translate.
  part_3:
    title: Mapping Detector Verdicts to Sigma Conditions
    body: |-
      The translation from a detection to a Sigma match runs through the verdict. The suite's three verdicts are allow, flag, and block, and they do not all deserve an alert. Allow means nothing was detected; emitting a Sigma match for every allowed request would bury the real alerts under the overwhelming majority of benign traffic, so allow stays quiet -- it produces no rule match. Flag means suspicious but not blocked, and it alerts at a medium level so an analyst reviews it without it reading as a confirmed block. Block means a high-confidence detection the gateway stopped, and it alerts at a high level, escalated to critical for the exfiltration detector where a block is a confirmed data-loss event.

      This mapping is small, but it is load-bearing, so the section keeps it as data rather than hiding it in the generator's control flow. A verdict-mapping table states, for each verdict, whether it alerts and at what level, with the rationale attached. That makes the translation auditable -- a reviewer can see exactly which detections become alerts -- and tunable, because a deployment that wants flags to stay silent, or blocks to alert at critical across the board, changes the data, not the code. The generator reads the alerting verdicts from this mapping and writes them into the detection selection, so the one rule about which detections matter lives in one place and feeds every generated rule.
  part_4:
    title: Generation Versus Hand-Authoring, and the Drift Problem
    body: |-
      It is entirely possible to write these Sigma rules by hand -- there are only six detectors, and each rule is short. The reason not to is drift. A hand-authored rule is a snapshot: it is correct on the day it is written and slowly wrong thereafter, because the detector it mirrors keeps changing. A detector gains a new verdict behaviour, is renamed, has its severity revised -- and the hand-written rule, untouched, now describes a detector that no longer exists. The gap is invisible, because nothing errors; the SIEM simply evaluates a rule that no longer matches what the suite does, and the divergence surfaces only when an incident falls through it.

      Generation removes the snapshot. The rules are a function of the detector descriptors, so regenerating after any detector change produces rules that match the detectors as they are now. The section makes the change itself detectable with a content hash over the whole rule set: regenerate, and if the hash differs from the last deployed hash, the rule set has changed and must be redeployed. With auto-redeploy enabled, that hash difference is the trigger -- a detector change flows automatically to regenerated rules to a redeploy, with no engineer remembering to update a rule. Keeping the SIEM in sync stops being a maintenance task and becomes a property of the pipeline.
  part_5:
    title: Versioning, Deployment, and the Signature-Layer Connection
    body: |-
      The generated rules are versioned as a set, not individually. A ruleset version and a content hash together identify exactly what is deployed, and the deployment configuration names the targets -- the platforms the portable rules compile to, typically Splunk and Elastic, whose connectors evaluate Sigma. The deployment plan is a small decision: compute the current hash, compare it to the previously deployed hash, and if they differ and auto-redeploy is on, deploy to the configured targets. That is the whole control loop, and it is deliberately boring, because a deployment mechanism that is exciting is a deployment mechanism that surprises you.

      Finally, the generated rules close a loop opened much earlier in the book. Chapter 11 Section 11.02 introduced Sigma as the format of the signature detection layer -- the human-readable, portable expression of a known-bad pattern. Back then, Sigma was where a detection concept was written down. Here it is where a deployed detector is expressed for the SIEM. The same format that described the signature layer as a detection idea now carries the whole suite's detections to the platforms that action them, so the signature-layer concept and its SIEM-deployable form are two views of one thing. With the portable core built, the next three sections bind the events themselves to the specific platforms.
