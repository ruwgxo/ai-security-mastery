overview:
  - heading: 'Atlas Reference Note'
    id: atlas_reference_note
    blocks:
      - type: prose
        text: >
          Technique IDs in this book were checked against MITRE ATLAS data version 5.6.0 (November
          2026). Since the book was first written, ATLAS has renamed many techniques from "ML" to
          "AI" (for example AML.T0015 Evade ML Model is now Evade AI Model) and renamed others
          outright: AML.T0053 LLM Plugin Compromise is now AI Agent Tool Invocation, AML.T0018
          Backdoor ML Model is now Manipulate AI Model, AML.T0056 LLM Meta Prompt Extraction is now
          Extract LLM System Prompt and AML.T0048 System Misuse for External Effect is now External
          Harms. The IDs are unchanged, and this book keeps the earlier names, as the chapters that
          build on this one do. Indirect prompt injection is AML.T0051.001 and LLM jailbreak is
          AML.T0054.
