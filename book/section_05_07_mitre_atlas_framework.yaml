section_summary:
  compact: >
    Section 5.7 establishes MITRE ATLAS as the detection engineering vocabulary for AI security,
    beginning with the four gaps in MITRE ATT&CK that motivated ATLAS's creation (adversarial
    examples, training data poisoning, model extraction, and inference evasion — all techniques with
    no ATT&CK analogue). The four-level ATLAS hierarchy (tactics, techniques, sub-techniques, case
    studies) mirrors ATT&CK's structure for immediate adoption by practitioners who know ATT&CK,
    while the AML.TXXXX identifier namespace unambiguously distinguishes ATLAS from ATT&CK entries
    for joint campaign tracking. All 12 ATLAS tactics are documented in kill-chain order with
    adversary goal, representative techniques, ATT&CK parallel, and detection opportunity summary,
    then mapped to the eight attack surface layers from Section 5.2 — giving practitioners the dual
    vocabulary needed to bridge architecture and threat intelligence. Four adversary profiles
    (nation-state, criminal, insider, researcher) are characterised by their distinctive ATLAS
    technique sets and detection challenges. Three real case studies (GPT-2 training data extraction
    via prefix probing, physical adversarial patch on traffic sign classifier, Microsoft Tay
    coordinated poisoning) are analysed as complete tactic-technique chains with detection
    opportunity assessment and mitigation mapping. The ATLAS vs ATT&CK comparison section identifies
    five AI-specific ATLAS techniques with no ATT&CK parallel and provides a layered coverage model
    combining both frameworks. The section closes with detection engineering and red teaming
    applications: the detection opportunity matrix mapping each ATLAS technique to data source and
    detection logic, quantitative coverage measurement methodology, and a four-phase
    ATLAS-structured red team exercise template. Three implementations deliver the complete
    12-tactic reference card with layer mapping, the detection opportunity matrix with coverage
    scoring, and a three-case-study analyser.
  key_takeaways:
    style: ordered
    items:
      - >
        ATLAS fills the gap ATT&CK cannot: adversarial ML techniques (adversarial examples, training
        data poisoning, model extraction, inference evasion) have no ATT&CK analogues. ATLAS and
        ATT&CK are complementary, not competing — real attacks against ML-deployed organisations
        span both frameworks across a single kill chain.
      - >
        The four-level hierarchy (tactic → technique → sub-technique → case study) mirrors ATT&CK
        and enables immediate adoption by practitioners who already know ATT&CK. Tactic = adversary
        goal (stable); technique = how they achieve it (evolves with new research); case study =
        empirical grounding (real incident or peer-reviewed demonstration).
      - >
        All 12 ATLAS tactics map onto the eight-layer AI attack surface from Section 5.2. This dual
        vocabulary is the practitioner's bridge between architecture and threat intelligence: attack
        surface layer tells you where to instrument; ATLAS tactic tells you what adversary behaviour
        to detect there.
      - >
        Four adversary profiles have distinct ATLAS technique signatures: nation-state (patient,
        long-duration, supply chain focus), criminal (ROI-optimised, extraction and evasion),
        insider (legitimate access, collection and exfiltration), researcher (capability probing,
        data extraction for publication). Detection thresholds and response procedures differ by
        profile.
      - >
        The three case studies (GPT-2 extraction, physical adversarial patch, Tay poisoning)
        represent three distinct ATLAS impact types: confidentiality (training data extraction),
        integrity (model evasion), and availability/integrity via poisoning. Each had detectable
        signals that existing monitoring would have caught with the right data sources instrumented.
      - >
        Five ATLAS techniques have no ATT&CK parallel: adversarial example crafting, training data
        extraction via inference, systematic model capability probing, training data poisoning, and
        influence operations via generative AI. These are the techniques that require entirely new
        detection logic — ATT&CK-aligned rules do not cover them.
      - >
        ATLAS enables quantitative detection programme coverage measurement: covered techniques /
        total techniques = coverage percentage. This metric is defensible to stakeholders in a way
        that OWASP risk counts are not, because ATLAS techniques are specific observable behaviours,
        not risk categories.
      - >
        Red team exercises structured around ATLAS tactics produce the most operationally realistic
        ML security assessments. The four-phase structure (reconnaissance, initial access, impact
        and exfiltration, reporting) mirrors how real adversaries operate and generates actionable
        detection gap findings aligned to specific AML.TXXXX identifiers.
