prose_content:
  - number: '5.7.1'
    heading: 'Why ATLAS Exists: The Gap ATT&CK Could Not Fill'
    id: subsection_01
    blocks:
      - type: fields
        subject: 'Why ATLAS Exists: The Gap ATT&CK Could Not Fill'
        entries:
          - label: 'Mitre Att and Ck Background'
            value: >
              MITRE ATT&CK (Adversarial Tactics, Techniques and Common Knowledge) was first
              published in 2013 as a structured knowledge base of adversary behaviour observed in
              real intrusions against enterprise networks. It catalogues how adversaries: gain
              initial access, execute code, establish persistence, escalate privilege, evade
              defences, move laterally, collect data, and exfiltrate it. ATT&CK became the de facto
              standard vocabulary for detection engineering, red teaming, and threat intelligence
              sharing across the security industry. By 2020, ATT&CK was referenced in vendor
              documentation, government advisories, and detection rule sets worldwide.
    parts:
      - heading: 'The Gap Att and Ck Leaves'
        id: the_gap_att_and_ck_leaves
        blocks:
          - type: prose
            text: >
              ATT&CK was built on observed behaviour against traditional IT systems: operating
              systems, network protocols, enterprise software. As ML systems began appearing in
              production deployments — in content moderation, fraud detection, autonomous vehicles,
              healthcare diagnostics — a new class of attack emerged that ATT&CK had no vocabulary
              for:
          - type: fields
            subject: 'The Gap Att and Ck Leaves'
            entries:
              - label: 'Gap 01 Adversarial Examples'
                value: >
                  Adversarial examples (Szegedy et al., 2013) exploit the decision boundaries of
                  neural networks using crafted inputs that are indistinguishable to humans but
                  cause the model to misclassify. This is not privilege escalation, not code
                  execution, not lateral movement — it is manipulation of a learned function. ATT&CK
                  has no technique for it.
              - label: 'Gap 02 Training Data Poisoning'
                value: >
                  An adversary who can influence a model's training data — by injecting examples,
                  manipulating labels, or contaminating a data source that feeds a training pipeline
                  — can alter the model's behaviour before it is ever deployed. This attack occurs
                  months before the model reaches production. ATT&CK covers supply chain compromise
                  of software, but not the systematic manipulation of statistical learning at
                  training time.
              - label: 'Gap 03 Model Extraction'
                value: >
                  Reconstructing a model's functionality by querying its API has no ATT&CK analogue.
                  The "exfiltration" of a neural network is not file transfer — it is the
                  statistical reconstruction of learned weights through inference queries. The
                  target is not data; it is a function approximator.
              - label: 'Gap 04 Inference Evasion'
                value: >
                  Bypassing a deployed ML-based security system (malware classifier, fraud detector,
                  deepfake detector) through adversarially crafted inputs is an attack technique
                  with no ATT&CK entry. The closest analogue is "defence evasion" — but the
                  mechanism is exploitation of gradient-based vulnerabilities, not OS-level or
                  network-level technique.
      - heading: 'Atlas Origin'
        id: atlas_origin
        blocks:
          - type: prose
            text: >
              MITRE ATLAS (Adversarial Threat Landscape for Artificial-Intelligence Systems) was
              developed by MITRE's AI security team in collaboration with industry partners and
              first published in 2021. It was explicitly designed to fill the ATT&CK gap for ML
              systems, using the same structural framework (tactics, techniques, sub-techniques) and
              the same philosophy (empirically grounded in real incidents, not theoretical).
          - type: fields
            subject: 'Design Principles'
            id: design_principles
            entries:
              - label: 'Att and Ck Compatible'
                value: >
                  ATLAS uses the same tactic-technique-sub-technique hierarchy as ATT&CK, enabling
                  practitioners who know ATT&CK to immediately read ATLAS. Where an adversary
                  campaign spans both traditional IT and ML systems (the common case), practitioners
                  can track the full kill chain across both frameworks without switching vocabulary.
              - label: 'Empirically Grounded'
                value: >
                  Every ATLAS technique is backed by at least one case study documenting real
                  adversary behaviour — either a confirmed real-world incident or a peer-reviewed
                  research demonstration. Theoretical attacks without empirical grounding are not
                  included.
              - label: 'Living Framework'
                value: >
                  ATLAS is versioned and continuously updated as new ML attack techniques are
                  documented. The community can contribute case studies through a submission
                  process, making ATLAS a living threat intelligence resource rather than a static
                  catalogue.
      - heading: 'Atlas in One Sentence'
        id: atlas_in_one_sentence
        blocks:
          - type: fields
            subject: 'Atlas in One Sentence'
            entries:
              - label: 'Atlas in One Sentence'
                value: >
                  ATLAS is to ML security what ATT&CK is to network and endpoint security: a
                  structured, empirically grounded, community-maintained catalogue of adversary
                  tactics and techniques, enabling detection engineers, red teamers, and threat
                  intelligence analysts to speak a common language about ML-specific threats.
  - number: '5.7.2'
    heading: 'ATLAS Structure: Tactics, Techniques, Sub-Techniques, and Case Studies'
    id: subsection_02
    parts:
      - heading: 'Four Level Hierarchy'
        id: four_level_hierarchy
        blocks:
          - type: fields
            subject: 'Level 1 Tactics'
            id: level_1_tactics
            entries:
              - label: Definition
                value: >
                  A tactic is the adversary's goal — what they are trying to achieve. Tactics are
                  high-level and stable: they change rarely because adversary goals (reconnaissance,
                  access, impact) are fundamental regardless of the specific technology being
                  attacked.
              - label: 'Count in Atlas'
                value: >
                  12 tactics in ATLAS 4.x (2023-2024); ATLAS 5.6.0 (November 2026) has 16, adding
                  Privilege Escalation, Credential Access, Lateral Movement and Command and Control
              - label: Example
                value: 'ML Reconnaissance — the adversary is trying to learn about the target ML system'
              - label: 'Att and Ck Parallel'
                value: 'Initial Reconnaissance in ATT&CK'
          - type: fields
            subject: 'Level 2 Techniques'
            id: level_2_techniques
            entries:
              - label: Definition
                value: >
                  A technique answers: how does the adversary achieve their tactical goal?
                  Techniques are more specific than tactics and evolve as new attack methods are
                  discovered. Each technique has a unique AML.TXXXX identifier.
              - label: 'Count in Atlas'
                value: '40 techniques and 27 sub-techniques across 12 tactics in ATLAS 4.4.0 (2023)'
              - label: Example
                value: 'AML.T0040 — ML Model Inference API Access (technique for ML Reconnaissance)'
              - label: 'Att and Ck Parallel'
                value: 'Techniques in ATT&CK (e.g. T1566 Phishing)'
          - type: fields
            subject: 'Level 3 Sub Techniques'
            id: level_3_sub_techniques
            entries:
              - label: Definition
                value: >
                  Sub-techniques describe specific implementations of a technique — variations in
                  how the technique is executed. Not all techniques have sub-techniques.
              - label: Example
                value: >
                  AML.T0043.000 — Craft Adversarial Data: Perform White-box Optimization
                  AML.T0043.001 — Craft Adversarial Data: Perform Black-box Optimization
                  AML.T0043.004 — Craft Adversarial Data: Insert Backdoor Triggers
              - label: 'Att and Ck Parallel'
                value: 'Sub-techniques in ATT&CK (e.g. T1566.001 Spearphishing Attachment)'
          - type: fields
            subject: 'Level 4 Case Studies'
            id: level_4_case_studies
            entries:
              - label: Definition
                value: >
                  Case studies are documented real-world incidents or peer-reviewed research
                  demonstrations mapped to ATLAS tactics and techniques. They provide the empirical
                  grounding for every technique entry and give practitioners concrete examples of
                  what each technique looks like in practice.
              - label: Format
                value: >
                  Each case study documents: target system, adversary type, techniques used (as
                  AML.TXXXX references), outcome, detection opportunities, and references.
              - label: Examples
                value:
                  - 'Botnet detection system evasion via adversarial example crafting'
                  - 'GPT-2 training data extraction via prefix probing (Carlini et al.)'
                  - 'Face recognition system bypass via physical adversarial patches'
                  - 'Autonomous vehicle lane detection manipulation via road sticker attacks'
      - heading: 'Reading an Atlas Technique Entry'
        id: reading_an_atlas_technique_entry
        blocks:
          - type: prose
            text: >
              Every ATLAS technique entry contains:
          - type: fields
            subject: 'Reading an Atlas Technique Entry'
            entries:
              - label: Id
                value: 'AML.TXXXX or AML.TXXXX.YYY'
              - label: Name
                value: 'Short descriptive name'
              - label: Tactic
                value: 'Which of the 12 tactics this technique serves'
              - label: Description
                value: 'What the adversary does and why'
              - label: Procedure
                value: 'Specific known implementations (linked to case studies)'
              - label: Mitigations
                value: 'Recommended countermeasures'
              - label: Detection
                value: 'Detection approach and data sources'
              - label: References
                value: 'Academic papers, incident reports, CVEs'
      - heading: 'Atlas Technique Id Format'
        id: atlas_technique_id_format
        blocks:
          - type: prose
            text: >
              AML.TXXXX — technique (4-digit number, e.g. AML.T0040) AML.TXXXX.YYY — sub-technique
              (3-digit suffix, e.g. AML.T0043.001) AML.MXXXX — mitigation (M prefix) AML.CSXXXX —
              case study (CS prefix)
          - type: prose
            text: >
              The "AML" namespace distinguishes ATLAS identifiers from ATT&CK identifiers (which use
              plain T, M, G, S prefixes), enabling unambiguous cross-reference.
  - number: '5.7.3'
    heading: 'The 12 ATLAS Tactics: Adversary Goals from Reconnaissance to Impact'
    id: subsection_03
    parts:
      - heading: 'Atlas 12 Tactics'
        id: atlas_12_tactics
        blocks:
          - type: fields
            subject: 'Tactic 01'
            id: tactic_01
            entries:
              - label: Id
                value: AML.TA0002
              - label: Name
                value: 'ML Reconnaissance'
              - label: 'Adversary Goal'
                value: 'Gather information about the target ML system before attacking'
              - label: 'Representative Techniques'
                value:
                  - 'AML.T0000 — Search for Victim''s Publicly Available Research Materials'
                  - 'AML.T0003 — Search Victim-Owned Websites'
                  - 'AML.T0040 — ML Model Inference API Access (probe capabilities)'
                  - 'AML.T0047 — ML-Enabled Product or Service'
              - label: 'What the Adversary Learns'
                value:
                  - 'Model type, architecture, and task'
                  - 'Input/output format and constraints'
                  - 'Performance characteristics and known failure modes'
                  - 'Training data sources and update cadence'
              - label: 'Att and Ck Parallel'
                value: 'TA0043 Reconnaissance'
              - label: 'Detection Opportunity'
                value: 'API probe patterns; unusual input diversity; capability enumeration queries'
          - type: fields
            subject: 'Tactic 02'
            id: tactic_02
            entries:
              - label: Id
                value: AML.TA0003
              - label: Name
                value: 'ML Resource Development'
              - label: 'Adversary Goal'
                value: 'Establish resources needed to conduct the ML attack campaign'
              - label: 'Representative Techniques'
                value:
                  - 'AML.T0002 — Acquire Public ML Artifacts (datasets, pre-trained models)'
                  - 'AML.T0002.000 — Acquire Training Data'
                  - 'AML.T0008 — Acquire Infrastructure (attack ML infrastructure)'
                  - 'AML.T0005 — Create Proxy ML Model (surrogate for attack development)'
              - label: 'What the Adversary Builds'
                value:
                  - 'Surrogate model approximating the target for offline attack development'
                  - 'Adversarial example generation pipeline'
                  - 'Poisoned training dataset'
              - label: 'Att and Ck Parallel'
                value: 'TA0042 Resource Development'
              - label: 'Detection Opportunity'
                value: 'Limited — resource development occurs on adversary infrastructure'
          - type: fields
            subject: 'Tactic 03'
            id: tactic_03
            entries:
              - label: Id
                value: AML.TA0004
              - label: Name
                value: 'Initial Access to ML'
              - label: 'Adversary Goal'
                value: 'Gain entry into the target''s ML pipeline or model serving infrastructure'
              - label: 'Representative Techniques'
                value:
                  - 'AML.T0049 — Exploit Public-Facing Application (ML API)'
                  - 'AML.T0012 — Valid Accounts (insider or compromised credentials)'
                  - 'AML.T0010 — ML Supply Chain Compromise'
              - label: Notes
                value: >
                  Initial access to ML pipelines often occurs through traditional IT techniques
                  (phishing, credential stuffing, supply chain compromise) — the ML-specific aspect
                  is what the adversary does once they have access.
              - label: 'Att and Ck Parallel'
                value: 'TA0001 Initial Access'
              - label: 'Detection Opportunity'
                value: 'Anomalous API access; unauthorised model registry access; supply chain integrity alerts'
        parts:
          - heading: 'Tactic 04'
            id: tactic_04
            blocks:
              - type: fields
                subject: 'Tactic 04'
                entries:
                  - label: Id
                    value: AML.TA0000
                  - label: Name
                    value: 'ML Model Access'
                  - label: 'Adversary Goal'
                    value: 'Obtain different levels of access to the target model for attack purposes'
              - type: fields
                subject: 'Access Levels Documented'
                id: access_levels_documented
                entries:
                  - label: 'Black Box'
                    value: 'Query access via API only — inputs and outputs visible'
                  - label: 'Grey Box'
                    value: 'API access plus partial knowledge (architecture, training data type)'
                  - label: 'White Box'
                    value: 'Full access to model weights, architecture, and training data'
              - type: fields
                subject: 'Tactic 04'
                entries:
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0040 — ML Model Inference API Access'
                      - 'AML.T0047 — ML-Enabled Product or Service'
                      - 'AML.T0044 — Full ML Model Access (insider/direct weight access)'
                  - label: 'Att and Ck Parallel'
                    value: 'No direct parallel — ML-specific access level taxonomy'
                  - label: 'Detection Opportunity'
                    value: 'Access tier monitoring; logprob access pattern; weight file read events'
          - heading: 'Tactic 05'
            id: tactic_05
            blocks:
              - type: fields
                subject: 'Tactic 05'
                entries:
                  - label: Id
                    value: AML.TA0005
                  - label: Name
                    value: Execution
                  - label: 'Adversary Goal'
                    value: 'Run adversary-controlled code within the target ML environment'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0011 — User Execution (victim loads malicious model)'
                      - 'AML.T0049 — Exploit Public-Facing Application (ML framework CVE)'
                  - label: Notes
                    value: >
                      ML-specific execution technique: pickle deserialisation RCE (Section 5.5) is
                      the primary documented mechanism. torch.load() on a malicious .pkl file
                      achieves code execution as a direct consequence of ML workflow.
                  - label: 'Att and Ck Parallel'
                    value: 'TA0002 Execution'
                  - label: 'Detection Opportunity'
                    value: 'Model file format check; process spawned from ML serving process'
          - heading: 'Tactic 06'
            id: tactic_06
            blocks:
              - type: fields
                subject: 'Tactic 06'
                entries:
                  - label: Id
                    value: AML.TA0006
                  - label: Name
                    value: 'Persistence in ML'
                  - label: 'Adversary Goal'
                    value: 'Maintain access or implant capabilities that survive model retraining'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0020 — Poison Training Data (backdoor that survives future retraining)'
                      - 'AML.T0018 — Backdoor ML Model (trigger embedded in weights)'
                  - label: Notes
                    value: >
                      ML persistence is fundamentally different from traditional persistence.
                      Traditional persistence survives reboot. ML persistence must survive
                      retraining — a much harder requirement. Backdoor triggers inserted into
                      training data propagate into the retrained model if the poisoned data is
                      retained in the training corpus.
                  - label: 'Att and Ck Parallel'
                    value: 'TA0003 Persistence — but mechanism is entirely different'
                  - label: 'Detection Opportunity'
                    value: 'Training data provenance audit; behavioural regression testing; canary tokens'
          - heading: 'Tactic 07'
            id: tactic_07
            blocks:
              - type: fields
                subject: 'Tactic 07'
                entries:
                  - label: Id
                    value: AML.TA0007
                  - label: Name
                    value: 'Defence Evasion via ML'
                  - label: 'Adversary Goal'
                    value: 'Avoid detection by ML-based security systems'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0015 — Evade ML Model (bypass malware classifier, spam filter, fraud detector)'
                      - 'AML.T0052 — Spearphishing via ML-Generated Lure (AI-generated phishing)'
                  - label: Notes
                    value: >
                      Defence Evasion via ML has an adversarial relationship with detection
                      engineering: as detectors improve (adversarial example detectors, LLM output
                      classifiers), adversaries develop evasion techniques targeted at the detector.
                      This creates an arms race at the ML layer that has no traditional IT security
                      equivalent.
                  - label: 'Att and Ck Parallel'
                    value: 'TA0005 Defence Evasion — extended to ML-based defences'
                  - label: 'Detection Opportunity'
                    value: 'Statistical distribution shift detection on classifier inputs; ensemble detectors'
          - heading: 'Tactic 08'
            id: tactic_08
            blocks:
              - type: fields
                subject: 'Tactic 08'
                entries:
                  - label: Id
                    value: AML.TA0008
                  - label: Name
                    value: Discovery
                  - label: 'Adversary Goal'
                    value: 'Learn about the ML environment from the inside after gaining access'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0007 — Discover ML Artifacts (find model files, configs, training data)'
                      - 'AML.T0007 — Discover ML Artifacts (identify frameworks and versions)'
                  - label: Notes
                    value: >
                      Post-access ML discovery complements traditional IT discovery (host
                      enumeration, network mapping). An adversary with filesystem access enumerates:
                      model weight files, training data paths, experiment tracking databases
                      (MLflow, Weights & Biases), model registry configs, and pipeline orchestration
                      files.
                  - label: 'Att and Ck Parallel'
                    value: 'TA0007 Discovery'
                  - label: 'Detection Opportunity'
                    value: 'Filesystem access logs on model and data directories; ML tool invocation logs'
          - heading: 'Tactic 09'
            id: tactic_09
            blocks:
              - type: fields
                subject: 'Tactic 09'
                entries:
                  - label: Id
                    value: AML.TA0009
                  - label: Name
                    value: Collection
                  - label: 'Adversary Goal'
                    value: 'Gather ML assets of interest for later exfiltration or use'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0035 — Collect ML Artifacts from Internal Repositories'
                      - 'AML.T0036 — Data from Information Repositories (training data)'
                  - label: 'Att and Ck Parallel'
                    value: 'TA0009 Collection'
                  - label: 'Detection Opportunity'
                    value: 'Bulk read of model registry; unusual training data access volume'
          - heading: 'Tactic 10'
            id: tactic_10
            blocks:
              - type: fields
                subject: 'Tactic 10'
                entries:
                  - label: Id
                    value: AML.TA0001
                  - label: Name
                    value: 'ML Attack Staging'
                  - label: 'Adversary Goal'
                    value: >
                      Prepare the actual ML attack artifacts — adversarial examples, poisoned
                      datasets, crafted prompts — before delivery
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0043 — Craft Adversarial Data'
                      - 'AML.T0042 — Verify Attack (test attack on surrogate before production)'
                      - 'AML.T0043 — Craft Adversarial Data (physical adversarial patches)'
              - type: fields
                subject: 'Sub Technique Detail'
                id: sub_technique_detail
                entries:
                  - label: 'Aml T0043 000'
                    value: 'White-box optimisation (gradient-based, FGSM/PGD)'
                  - label: 'Aml T0043 001'
                    value: 'Black-box optimisation (query-based, no gradient access)'
                  - label: 'Aml T0043 004'
                    value: 'Insert backdoor trigger patterns'
              - type: fields
                subject: 'Tactic 10'
                entries:
                  - label: 'Att and Ck Parallel'
                    value: 'TA0042 Resource Development / partial TA0001 Reconnaissance'
                  - label: 'Detection Opportunity'
                    value: 'Systematic near-identical query patterns during attack staging probes'
          - heading: 'Tactic 11'
            id: tactic_11
            blocks:
              - type: fields
                subject: 'Tactic 11'
                entries:
                  - label: Id
                    value: AML.TA0010
                  - label: Name
                    value: 'Exfiltration via ML'
                  - label: 'Adversary Goal'
                    value: 'Extract valuable ML assets: model weights, training data, embeddings'
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0057 — LLM Data Leakage (extract training data from model)'
                      - 'AML.T0040 — ML Model Inference API Access (systematic extraction)'
                      - 'AML.T0024.002 — Extract ML Model (query-based extraction)'
                  - label: 'Exfiltration Targets'
                    value:
                      - 'Model weights (the IP asset)'
                      - 'Training data (PII, proprietary data memorised by model)'
                      - 'System prompt and configuration'
                      - 'Embedding space representations of sensitive documents'
                  - label: 'Att and Ck Parallel'
                    value: 'TA0010 Exfiltration — but target is statistical knowledge, not files'
                  - label: 'Detection Opportunity'
                    value: 'Query volume anomaly; logprob access monitor; output perplexity anomaly'
          - heading: 'Tactic 12'
            id: tactic_12
            blocks:
              - type: fields
                subject: 'Tactic 12'
                entries:
                  - label: Id
                    value: AML.TA0011
                  - label: Name
                    value: 'Impact on ML'
                  - label: 'Adversary Goal'
                    value: >
                      Cause the target ML system to perform incorrectly, degrade availability, or
                      produce outputs that serve the adversary's ultimate objective
                  - label: 'Representative Techniques'
                    value:
                      - 'AML.T0015 — Evade ML Model (bypass classifier)'
                      - 'AML.T0029 — Denial of ML Service'
                      - 'AML.T0031 — Erode ML Model Integrity'
                      - 'AML.T0048.002 — Influence Operations via Generative AI'
              - type: fields
                subject: 'Impact Types'
                id: impact_types
                entries:
                  - label: Integrity
                    value: 'Model produces wrong outputs — misclassification, hallucination, bypassed detection'
                  - label: Availability
                    value: 'Model service degraded or unavailable — DoS, resource exhaustion'
                  - label: Confidentiality
                    value: 'Model reveals sensitive training data or system configuration'
              - type: fields
                subject: 'Tactic 12'
                entries:
                  - label: 'Att and Ck Parallel'
                    value: 'TA0040 Impact'
                  - label: 'Detection Opportunity'
                    value: 'Model output accuracy monitoring; resource exhaustion alerts; FMEA-based impact detection'
      - heading: 'Tactics Added in Atlas 5'
        id: tactics_added_in_atlas_5
        blocks:
          - type: fields
            subject: 'Tactics Added in Atlas 5'
            entries:
              - label: Note
                value: >
                  ATLAS 5.x adds four tactics to the twelve above, all adapted from ATT&CK. They
                  matter once an adversary is inside an AI environment: agents with tool access,
                  model registries, experiment trackers. In ATLAS 5.6.0's kill-chain order they sit
                  where "position" says.
          - type: fields
            subject: 'Privilege Escalation'
            id: privilege_escalation
            entries:
              - label: Id
                value: AML.TA0012
              - label: Position
                value: 'after Persistence'
              - label: 'Adversary Goal'
                value: 'Gain higher-level permissions in the AI environment'
              - label: 'Att and Ck Parallel'
                value: 'TA0004 Privilege Escalation'
          - type: fields
            subject: 'Credential Access'
