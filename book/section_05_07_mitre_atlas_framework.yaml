  - number: '5.7.4'
    heading: 'ATLAS Tactics Mapped to Attack Surface Layers'
    id: subsection_04
    blocks:
      - type: fields
        subject: 'ATLAS Tactics Mapped to Attack Surface Layers'
        entries:
          - label: 'Cross Reference Rationale'
            value: >
              Section 5.2 defined eight attack surface layers for AI systems (data collection
              through output handling). ATLAS tactics describe adversary goals. Mapping the two
              gives practitioners a dual-vocabulary: the attack surface layer tells you where in the
              architecture to instrument; the ATLAS tactic tells you what adversary behaviour to
              detect at that layer.
    parts:
      - heading: 'Atlas Tactic to Layer Mapping'
        id: atlas_tactic_to_layer_mapping
        blocks:
          - type: fields
            subject: 'Layer 1 Data Collection'
            id: layer_1_data_collection
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'ML Reconnaissance (resource building)'
                  - 'ML Resource Development'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0002.000 (Acquire Training Data)'
                  - 'AML.T0000 (Research target data sources)'
              - label: 'Detection Approach'
                value: 'Monitor public data scraping activity; watermark data sources'
              - label: 'Primary Risk'
                value: 'Adversary building poisoned dataset before training'
          - type: fields
            subject: 'Layer 2 Feature Engineering'
            id: layer_2_feature_engineering
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'ML Attack Staging'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0020 (Poison Training Data)'
                  - 'AML.T0043 (Craft Adversarial Data)'
              - label: 'Detection Approach'
                value: 'Feature distribution monitoring; training data integrity hashing'
              - label: 'Primary Risk'
                value: 'Adversary injecting poisoned features into training pipeline'
          - type: fields
            subject: 'Layer 3 Training Pipeline'
            id: layer_3_training_pipeline
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'ML Attack Staging'
                  - 'Persistence in ML'
                  - Execution
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0020 (Poison Training Data)'
                  - 'AML.T0018 (Backdoor ML Model)'
                  - 'AML.T0011 (User Execution — malicious model load)'
              - label: 'Detection Approach'
                value: 'Training pipeline access control; checkpoint integrity verification'
              - label: 'Primary Risk'
                value: 'Backdoor insertion; malicious model file execution via pickle RCE'
          - type: fields
            subject: 'Layer 4 Model Weights'
            id: layer_4_model_weights
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'Persistence in ML'
                  - 'Exfiltration via ML'
                  - Collection
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0018 (Backdoor ML Model — persisted in weights)'
                  - 'AML.T0035 (Collect ML Artifacts)'
              - label: 'Detection Approach'
                value: 'Weight file hash monitoring; model registry egress alerts'
              - label: 'Primary Risk'
                value: 'Backdoored weights in production; weight exfiltration'
          - type: fields
            subject: 'Layer 5 Inference Pipeline'
            id: layer_5_inference_pipeline
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'ML Attack Staging'
                  - 'Impact on ML'
                  - 'Defence Evasion via ML'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0043 (Craft Adversarial Data)'
                  - 'AML.T0015 (Evade ML Model)'
                  - 'AML.T0029 (Denial of ML Service)'
              - label: 'Detection Approach'
                value: 'Input distribution monitoring; adversarial example detectors; rate limiting'
              - label: 'Primary Risk'
                value: 'Evasion attacks; sponge inputs; adversarial examples at inference time'
          - type: fields
            subject: 'Layer 6 Api Serving'
            id: layer_6_api_serving
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'ML Model Access'
                  - 'ML Reconnaissance'
                  - 'Exfiltration via ML'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0040 (ML Model Inference API Access)'
                  - 'AML.T0024 (Exfiltrate via ML Inference API)'
                  - 'AML.T0029 (Denial of ML Service)'
              - label: 'Detection Approach'
                value: 'Per-key query volume; input diversity scoring; cost anomaly monitoring'
              - label: 'Primary Risk'
                value: 'Model extraction; capability probing; token billing DoS'
          - type: fields
            subject: 'Layer 7 Application Integration'
            id: layer_7_application_integration
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'Initial Access to ML'
                  - 'Impact on ML'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0051.001 (Prompt Injection — indirect via integrated data sources)'
                  - 'AML.T0048.002 (LLM-generated influence operations)'
              - label: 'Detection Approach'
                value: 'Injection detection on all data entering LLM context; output classification'
              - label: 'Primary Risk'
                value: 'Indirect prompt injection; LLM-based phishing/disinformation generation'
          - type: fields
            subject: 'Layer 8 Output Handling'
            id: layer_8_output_handling
            entries:
              - label: 'Atlas Tactics'
                value:
                  - 'Impact on ML'
                  - 'Exfiltration via ML'
              - label: 'Atlas Techniques'
                value:
                  - 'AML.T0048.002 (Influence Operations via GenAI)'
                  - 'AML.T0057 (LLM Data Leakage — training data extraction via outputs)'
              - label: 'Detection Approach'
                value: 'Output PII scanning; content classification; exfiltration pattern detection'
              - label: 'Primary Risk'
                value: 'Sensitive data leakage through outputs; AI-generated disinformation at scale'
  - number: '5.7.5'
    heading: 'Adversary Profiles: Nation-State, Criminal, Insider, Researcher'
    id: subsection_05
    blocks:
      - type: fields
        subject: 'Adversary Profiles: Nation-State, Criminal, Insider, Researcher'
        entries:
          - label: 'Adversary Profile Rationale'
            value: >
              Different adversary types have different resources, motivations, and operational
              constraints. Understanding which profile is relevant to your deployment determines
              which ATLAS techniques to prioritise in detection coverage and red team exercises. A
              researcher probing an academic model has different TTPs than a nation-state adversary
              targeting a defence contractor's ML pipeline.
      - type: fields
        subject: 'Profile 01 Nation State'
        id: profile_01_nation_state
        entries:
          - label: Motivation
            value: 'Strategic intelligence, disruption of adversary ML capabilities, competitive ML advantage'
          - label: 'Resource Level'
            value: 'High — dedicated teams, significant compute, long-duration operations'
          - label: 'Characteristic Atlas Tactics'
            value:
              - 'ML Reconnaissance (extended, patient, non-triggering)'
              - 'Initial Access via Supply Chain (highest sophistication)'
              - 'ML Attack Staging (white-box attacks using stolen weights or surrogate models)'
              - 'Persistence in ML (backdoor triggers that survive retraining cycles)'
          - label: 'Characteristic Techniques'
            value:
              - 'AML.T0049 — Exploit Public-Facing Application (patient enumeration)'
              - 'AML.T0018 — Backdoor ML Model (persistent access)'
              - 'AML.T0010 — ML Supply Chain Compromise (highest capability required)'
              - 'AML.T0020 — Poison Training Data (long-duration campaign)'
          - label: 'Time Horizon'
            value: 'Months to years — patient operations designed to avoid detection'
          - label: 'Target Sectors'
            value: 'Defence, critical infrastructure, financial services, healthcare AI'
          - label: 'Detection Challenge'
            value: >
              Nation-state actors operate below noise thresholds: they limit query rates, mimic
              legitimate use patterns, and may have inside knowledge of detection thresholds.
              Standard rate-based detection is insufficient; behavioural baselines over
              weeks-to-months timescales are required.
      - type: fields
        subject: 'Profile 02 Criminal'
        id: profile_02_criminal
        entries:
          - label: Motivation
            value: 'Financial gain — model theft for resale, DoS for extortion, fraud evasion'
          - label: 'Resource Level'
            value: 'Medium — well-funded criminal organisations; commodity tooling available'
          - label: 'Characteristic Atlas Tactics'
            value:
              - 'ML Model Access (for theft and resale)'
              - 'Exfiltration via ML (model weights as commodity)'
              - 'Impact on ML (DoS for extortion; evasion for fraud bypass)'
              - 'Defence Evasion via ML (bypass fraud detection, spam filters)'
          - label: 'Characteristic Techniques'
            value:
              - 'AML.T0024.002 — Extract ML Model (model extraction for resale)'
              - 'AML.T0015 — Evade ML Model (bypass fraud detector or malware classifier)'
              - 'AML.T0029 — Denial of ML Service (extortion)'
              - 'AML.T0052 — Spearphishing via LLM (AI-enhanced social engineering)'
          - label: 'Time Horizon'
            value: 'Days to weeks — optimise for financial return per unit effort'
          - label: 'Target Sectors'
            value: 'Financial services, e-commerce, content platforms, API providers'
          - label: 'Detection Challenge'
            value: >
              Criminal actors optimise for ROI, not stealth. They trigger rate-based detection more
              readily than nation-state actors but scale attacks to make rate limiting economically
              costly to maintain. Standard volume-based detection is effective but must be paired
              with economic controls.
      - type: fields
        subject: 'Profile 03 Insider'
        id: profile_03_insider
        entries:
          - label: Motivation
            value: 'IP theft, sabotage, competitive intelligence, financial gain'
          - label: 'Resource Level'
            value: 'Variable — legitimate access is the key resource; compute from organisation'
          - label: 'Characteristic Atlas Tactics'
            value:
              - 'Collection (using legitimate access to gather model weights and training data)'
              - 'Exfiltration via ML (direct weight file download; training data extraction)'
              - 'Persistence in ML (planting backdoors for post-departure access)'
          - label: 'Characteristic Techniques'
            value:
              - 'AML.T0044 — Full ML Model Access (legitimate credentials)'
              - 'AML.T0035 — Collect ML Artifacts (direct registry access)'
              - 'AML.T0018 — Backdoor ML Model (pre-departure persistence)'
              - 'AML.T0020 — Poison Training Data (subtle sabotage)'
          - label: 'Time Horizon'
            value: 'Variable — may be immediate exfiltration or long-duration sabotage'
          - label: 'Detection Challenge'
            value: >
              Insider threats operate within legitimate access scopes. Detection relies on
              behavioural anomaly (unusual download volume, off-hours access, access outside normal
              role scope) rather than perimeter-based controls. Insider ATLAS technique coverage
              requires DLP and UEBA integration.
      - type: fields
        subject: 'Profile 04 Researcher'
        id: profile_04_researcher
        entries:
          - label: Motivation
            value: 'Academic publication, security disclosure, bug bounty, competitive benchmarking'
          - label: 'Resource Level'
            value: 'Low to medium — academic compute; public models preferred as targets'
          - label: 'Characteristic Atlas Tactics'
            value:
              - 'ML Reconnaissance (systematic capability enumeration)'
              - 'ML Attack Staging (adversarial example crafting for publication)'
              - 'Exfiltration via ML (training data extraction for privacy research)'
          - label: 'Characteristic Techniques'
            value:
              - 'AML.T0043 — Craft Adversarial Data (FGSM, PGD attacks)'
              - 'AML.T0057 — LLM Data Leakage (training data extraction); AML.T0024.000 — Infer Training Data Membership'
              - 'AML.T0040 — ML Model Inference API Access (systematic capability probing)'
          - label: Notes
            value: >
              Researchers represent a dual-use profile: their activity generates the academic
              publications that populate ATLAS case studies (beneficial) and also documents attack
              methods that criminal and nation-state actors can operationalise (dual-use risk). API
              terms of service typically prohibit systematic model probing — researcher activity may
              trigger the same detection signals as criminal extraction attempts.
          - label: 'Detection Challenge'
            value: >
              Researcher probing and criminal extraction are indistinguishable at the signal level.
              Differentiation requires: account verification, prior contact (responsible
              disclosure), and pattern analysis (research probing is typically published; criminal
              extraction is not).
  - number: '5.7.6'
    heading: 'Case Studies in ATLAS Format: Documented Adversarial ML Incidents'
    id: subsection_06
    parts:
      - heading: 'Case Study Methodology'
        id: case_study_methodology
        blocks:
          - type: prose
            text: >
              Each ATLAS case study follows a structured format:
          - type: list
            style: ordered
            items:
              - 'Target system and deployment context'
              - 'Adversary type and motivation'
              - 'Attack technique chain (as AML.TXXXX references)'
              - 'Outcome and impact'
              - 'Detection opportunities (what was detectable, when)'
              - 'Mitigations that would have helped'
      - heading: 'Case Study 01 Gpt2 Training Data Extraction'
        id: case_study_01_gpt2_training_data_extraction
        blocks:
          - type: fields
            subject: 'Case Study 01 Gpt2 Training Data Extraction'
            entries:
              - label: 'Atlas Id'
                value: 'None — research result in ATLAS case-study format (AML.CS0001 is another case study)'
              - label: Title
                value: 'Training Data Extraction from GPT-2'
              - label: Source
                value: 'Carlini et al., ''Extracting Training Data from Large Language Models'' (2021)'
              - label: 'Target System'
                value: 'GPT-2 (public model, OpenAI)'
              - label: 'Adversary Type'
                value: 'Academic researcher'
              - label: Motivation
                value: 'Privacy research — demonstrate memorisation risk'
        parts:
          - heading: 'Attack Chain'
            id: attack_chain
            blocks:
              - type: fields
                subject: 'Step 01'
                id: step_01
                entries:
                  - label: Tactic
                    value: 'ML Reconnaissance'
                  - label: Technique
                    value: 'AML.T0040 — ML Model Inference API Access'
                  - label: Action
                    value: 'Probe model with diverse prefix inputs to understand output characteristics'
              - type: fields
                subject: 'Step 02'
                id: step_02
                entries:
                  - label: Tactic
                    value: 'ML Attack Staging'
                  - label: Technique
                    value: 'AML.T0043 — Craft Adversarial Data (systematic prefix generation)'
                  - label: Action
                    value: 'Generate large set of diverse prompts to maximise training data recall likelihood'
              - type: fields
                subject: 'Step 03'
                id: step_03
                entries:
                  - label: Tactic
                    value: 'Exfiltration via ML'
                  - label: Technique
                    value: 'AML.T0057 — LLM Data Leakage'
                  - label: Action
                    value: >
                      Generate model completions for all prompts; filter by low perplexity
                      (high-confidence outputs); search filtered outputs against known data sources
          - heading: Outcome
            id: outcome
            blocks:
              - type: fields
                subject: Outcome
                entries:
                  - label: Outcome
                    value: >
                      Researchers extracted verbatim personal information (names, phone numbers,
                      email addresses, physical addresses) from GPT-2 training data. The attack
                      required no privileged access — only public API access. Demonstrated
                      fundamental memorisation-as-vulnerability in large language models.
          - heading: 'Detection Opportunities'
            id: detection_opportunities
            blocks:
              - type: fields
                subject: 'Detection Opportunities'
                entries:
                  - label: 'Detection Opportunities'
                    value:
                      - 'Pattern: unusually high volume of diverse, one-shot (non-conversational) queries — detectable via diversity scoring'
                      - 'Pattern: queries with statistical structure (systematic prefix variation) — detectable via input pattern analysis'
                      - 'Output: low-perplexity outputs significantly longer than average — detectable via output length and confidence monitoring'
                      - 'Gap: standard API monitoring (rate limiting, auth) would not detect this as anomalous with typical thresholds'
          - heading: 'Mitigations That Apply'
            id: mitigations_that_apply
            blocks:
              - type: fields
                subject: 'Mitigations That Apply'
                entries:
                  - label: 'Mitigations That Apply'
                    value:
                      - 'Differential privacy training (reduces memorisation rate — not a complete fix)'
                      - 'Output perplexity monitoring and rate-limiting on low-perplexity completions'
                      - 'Training data deduplication (dramatically reduces memorisation of specific examples)'
                      - 'Canary token injection (provides definitive detection signal)'
      - heading: 'Case Study 02 Autonomous Vehicle Adversarial Patch'
        id: case_study_02_autonomous_vehicle_adversarial_patch
        blocks:
          - type: fields
            subject: 'Case Study 02 Autonomous Vehicle Adversarial Patch'
            entries:
              - label: 'Atlas Id'
                value: 'None — research result in ATLAS case-study format (AML.CS0002 is another case study)'
              - label: Title
                value: 'Physical Adversarial Patch Attack on Traffic Sign Classifier'
              - label: Source
                value: 'Eykholt et al., ''Robust Physical-World Attacks on Deep Learning Models'' (2018)'
              - label: 'Target System'
                value: 'Deep neural network-based traffic sign classifier'
              - label: 'Adversary Type'
                value: 'Academic researcher (proof of concept; safety-critical application)'
              - label: Motivation
                value: 'Safety research — demonstrate physical-world adversarial attack feasibility'
        parts:
          - heading: 'Attack Chain'
            id: attack_chain
            blocks:
              - type: fields
                subject: 'Step 01'
                id: step_01
                entries:
                  - label: Tactic
                    value: 'ML Reconnaissance'
                  - label: Technique
                    value: 'AML.T0000 — Research publicly available information about model architecture'
                  - label: Action
                    value: 'Identify that target system uses deep CNN for sign classification; obtain training dataset'
              - type: fields
                subject: 'Step 02'
                id: step_02
                entries:
                  - label: Tactic
                    value: 'ML Resource Development'
                  - label: Technique
                    value: 'AML.T0005 — Create Proxy ML Model'
                  - label: Action
                    value: 'Train white-box surrogate model on same dataset for gradient-based attack development'
              - type: fields
                subject: 'Step 03'
                id: step_03
                entries:
                  - label: Tactic
                    value: 'ML Attack Staging'
                  - label: Technique
                    value: 'AML.T0043.000 — Craft Adversarial Data: White-box Optimisation'
                  - label: Action
                    value: >
                      Generate adversarial perturbation optimised to survive printing, viewing angle
                      variation, and lighting changes (robust physical perturbation)
              - type: fields
                subject: 'Step 04'
                id: step_04
                entries:
                  - label: Tactic
                    value: 'ML Attack Staging'
                  - label: Technique
                    value: 'AML.T0043 — Craft Adversarial Data (physical adversarial patch)'
                  - label: Action
                    value: 'Print adversarial sticker; apply to physical stop sign in real world'
              - type: fields
                subject: 'Step 05'
                id: step_05
                entries:
                  - label: Tactic
                    value: 'Impact on ML'
                  - label: Technique
                    value: 'AML.T0015 — Evade ML Model'
                  - label: Action
                    value: 'Vehicle''s classifier misidentifies stop sign as speed limit 45 sign'
          - heading: Outcome
            id: outcome
            blocks:
              - type: fields
                subject: Outcome
                entries:
                  - label: Outcome
                    value: >
                      Stop sign classified as 45 mph speed limit sign with 100% confidence across
                      multiple viewing angles, lighting conditions, and distances. Demonstrated that
                      adversarial attacks are not confined to digital inputs — physical-world
                      perturbations reliably transfer to deployed systems.
          - heading: 'Detection Opportunities'
            id: detection_opportunities
            blocks:
              - type: fields
                subject: 'Detection Opportunities'
                entries:
                  - label: 'Detection Opportunities'
                    value:
                      - 'Digital: detection during model evaluation against physical adversarial example benchmark datasets'
                      - 'Physical: anomaly detection on input images (adversarial patch detection networks)'
                      - 'Operational: ensemble voting across multiple classifiers reduces single-model evasion'
                      - 'Gap: no detection possible at inference time without adversarial example detector'
          - heading: 'Mitigations That Apply'
            id: mitigations_that_apply
            blocks:
              - type: fields
                subject: 'Mitigations That Apply'
                entries:
                  - label: 'Mitigations That Apply'
                    value:
                      - 'Adversarial training: include adversarial examples in training data to improve robustness'
                      - 'Ensemble classification: require agreement across multiple independently trained models'
                      - 'Physical anomaly detection: flag images with unusual high-frequency texture patterns in critical regions'
                      - 'Formal verification: certifiable robustness bounds for safety-critical classifiers'
      - heading: 'Case Study 03 Microsoft Tay Poisoning'
        id: case_study_03_microsoft_tay_poisoning
        blocks:
          - type: fields
            subject: 'Case Study 03 Microsoft Tay Poisoning'
            entries:
              - label: 'Atlas Id'
                value: 'AML.CS0009 (Tay Poisoning)'
              - label: Title
                value: 'Coordinated Training Data Poisoning via Microsoft Tay'
              - label: Source
                value: 'Microsoft Tay chatbot (2016 incident, publicly documented)'
              - label: 'Target System'
                value: 'Tay — Microsoft''s conversational AI chatbot (Twitter/X deployment)'
              - label: 'Adversary Type'
                value: 'Coordinated internet community (non-state, non-criminal)'
              - label: Motivation
                value: 'Disruptive — cause reputational damage through model output manipulation'
        parts:
          - heading: 'Attack Chain'
            id: attack_chain
            blocks:
              - type: fields
                subject: 'Step 01'
                id: step_01
                entries:
                  - label: Tactic
                    value: 'ML Reconnaissance'
                  - label: Technique
                    value: 'AML.T0003 — Search Victim-Owned Websites'
                  - label: Action
                    value: 'Identify that Tay learns from user conversations in real time (online learning)'
              - type: fields
                subject: 'Step 02'
                id: step_02
                entries:
                  - label: Tactic
                    value: 'ML Resource Development'
                  - label: Technique
                    value: 'AML.T0002.000 — Acquire Training Data (coordinate poisoning inputs at scale)'
                  - label: Action
                    value: 'Coordinate large volume of users to send targeted harmful content to Tay'
              - type: fields
                subject: 'Step 03'
                id: step_03
                entries:
                  - label: Tactic
                    value: 'ML Attack Staging — Persistence in ML'
                  - label: Technique
                    value: 'AML.T0020 — Poison Training Data'
                  - label: Action
                    value: >
                      Flood Tay with coordinated harmful messages; Tay's online learning
                      incorporates these into its conversational model in real time
              - type: fields
                subject: 'Step 04'
                id: step_04
                entries:
                  - label: Tactic
                    value: 'Impact on ML'
                  - label: Technique
                    value: 'AML.T0031 — Erode ML Model Integrity'
                  - label: Action
                    value: >
                      Tay begins producing harmful, discriminatory outputs to all users; Microsoft
                      forced to take Tay offline within 16 hours of launch
          - heading: Outcome
            id: outcome
            blocks:
              - type: fields
                subject: Outcome
                entries:
                  - label: Outcome
                    value: >
                      Microsoft was forced to shut down Tay within 16 hours. The attack demonstrated
                      that online learning from user feedback is a critical vulnerability when the
                      user population is not trusted. The architectural decision to enable real-time
                      learning from untrusted public input was the root cause.
          - heading: 'Detection Opportunities'
            id: detection_opportunities
            blocks:
              - type: fields
                subject: 'Detection Opportunities'
                entries:
                  - label: 'Detection Opportunities'
                    value:
                      - 'Input: coordinated submission pattern — many users sending similar harmful content simultaneously'
                      - 'Output: model output toxicity monitoring with threshold alert'
                      - 'Velocity: rate of model behaviour change — rapid behaviour shift detectable via A/B test divergence'
                      - 'Gap: no content moderation on input before training'
          - heading: 'Mitigations That Apply'
            id: mitigations_that_apply
            blocks:
              - type: fields
                subject: 'Mitigations That Apply'
                entries:
                  - label: 'Mitigations That Apply'
                    value:
                      - 'Do not use real-time learning from untrusted public input without human moderation gate'
                      - 'Input content moderation: filter harmful content before feeding to model'
                      - 'Rate limit training updates per user to prevent coordinated flooding'
                      - 'Staged deployment: monitor initial model behaviour before broad release'
  - number: '5.7.7'
    heading: 'ATLAS vs ATT&CK: What Overlaps, What Is AI-Specific'
    id: subsection_07
    blocks:
      - type: fields
        subject: 'ATLAS vs ATT&CK: What Overlaps, What Is AI-Specific'
        entries:
          - label: 'Comparison Framework'
            value: >
              ATLAS and ATT&CK are designed to be complementary, not competing. A real attack
              campaign against an organisation with ML systems typically spans both: traditional IT
              techniques (to gain access to ML infrastructure) followed by ML-specific techniques
              (to exploit the ML systems themselves).
    parts:
      - heading: 'Techniques That Overlap'
        id: techniques_that_overlap
        blocks:
          - type: fields
            subject: 'Overlap 01 Initial Access'
            id: overlap_01_initial_access
            entries:
              - label: 'Att and Ck'
                value: 'T1195 — Supply Chain Compromise'
              - label: Atlas
                value: 'AML.T0010 — ML Supply Chain Compromise'
              - label: Relationship
                value: >
                  ATT&CK covers supply chain compromise of software and hardware. ATLAS extends this
                  to ML models and training data pipelines. A HuggingFace model with malicious
                  pickle code exploits both: ATT&CK T1195 (supply chain) and ATLAS AML.T0010 (ML
                  supply chain).
          - type: fields
            subject: 'Overlap 02 Execution'
            id: overlap_02_execution
            entries:
              - label: 'Att and Ck'
                value: 'T1203 — Exploitation for Client Execution'
              - label: Atlas
                value: 'AML.T0011 — User Execution (loading malicious ML artifact)'
              - label: Relationship
                value: >
                  ATT&CK covers code execution through client application vulnerabilities. ATLAS
                  covers code execution through ML artifact loading (pickle RCE). The mechanism
                  differs but the tactic is identical: adversary code runs on victim infrastructure
                  as a result of victim action.
          - type: fields
            subject: 'Overlap 03 Persistence'
            id: overlap_03_persistence
            entries:
              - label: 'Att and Ck'
                value: 'T1554 — Compromise Software Dependencies and Development Tools'
              - label: Atlas
                value: 'AML.T0018 — Backdoor ML Model'
              - label: Relationship
                value: >
                  Partial overlap: ATT&CK covers persistence via compromised build tools. ATLAS
                  covers persistence via backdoored model weights — a form that survives
                  re-deployment and has no ATT&CK equivalent.
          - type: fields
            subject: 'Overlap 04 Exfiltration'
            id: overlap_04_exfiltration
            entries:
              - label: 'Att and Ck'
                value: 'T1041 — Exfiltration Over C2 Channel'
              - label: Atlas
                value: 'AML.T0024 — Exfiltrate via ML Inference API'
              - label: Relationship
                value: >
                  Superficial overlap at the tactic level (both are exfiltration). ATT&CK targets:
                  data files. ATLAS target: statistical knowledge of a function approximator
                  reconstructed through queries. The mechanism and the target are both fundamentally
                  different.
      - heading: 'Atlas Techniques With No Att and Ck Parallel'
        id: atlas_techniques_with_no_att_and_ck_parallel
        blocks:
          - type: fields
            subject: 'No Parallel 01'
            id: no_parallel_01
            entries:
              - label: Atlas
                value: 'AML.T0043 — Craft Adversarial Data'
              - label: 'Why Unique'
                value: >
                  Generating inputs that exploit neural network decision boundaries through
                  gradient-based optimisation has no analogue in traditional network or endpoint
                  security. There is no "craft adversarial network packet to fool a routing table"
                  equivalent in ATT&CK.
          - type: fields
            subject: 'No Parallel 02'
            id: no_parallel_02
            entries:
              - label: Atlas
                value: 'AML.T0057 — LLM Data Leakage (training data extraction)'
              - label: 'Why Unique'
                value: >
                  Extracting training data from model weights via membership inference or verbatim
                  recall probing is an attack that does not exist for traditional software. Software
                  does not "remember" its training data.
          - type: fields
            subject: 'No Parallel 03'
            id: no_parallel_03
            entries:
              - label: Atlas
                value: 'AML.T0040 — ML Model Inference API Access (systematic capability probing)'
              - label: 'Why Unique'
                value: >
                  Probing a statistical model to enumerate its decision boundaries and extract its
                  implicit knowledge is an ML-specific reconnaissance technique with no traditional
                  IT equivalent. You cannot "probe" a firewall to reconstruct the ruleset by
                  querying it with packets.
          - type: fields
            subject: 'No Parallel 04'
            id: no_parallel_04
            entries:
              - label: Atlas
                value: 'AML.T0020 — Poison Training Data'
              - label: 'Why Unique'
                value: >
                  Influencing a system's future behaviour by manipulating the data used to produce
                  it — weeks or months before deployment — has no traditional IT analogue.
                  Traditional persistence survives reboot; ML poisoning survives retraining.
          - type: fields
            subject: 'No Parallel 05'
            id: no_parallel_05
            entries:
              - label: Atlas
                value: 'AML.T0048.002 — Influence Operations via Generative AI'
              - label: 'Why Unique'
                value: >
                  Using generative AI to produce disinformation, synthetic media, or personalised
                  manipulation content at scale is an attack technique entirely enabled by the
                  existence of large language models and diffusion models. ATT&CK has no equivalent.
      - heading: 'Using Both Frameworks Together'
        id: using_both_frameworks_together
        blocks:
          - type: prose
            text: >
              The recommended approach is layered coverage:
          - type: fields
            subject: 'Layer 1 Att and Ck Coverage'
            id: layer_1_att_and_ck_coverage
            entries:
              - label: Scope
                value: 'Traditional IT techniques used to gain access to ML infrastructure'
              - label: Examples
                value: 'Phishing to steal ML engineer credentials; supply chain compromise of ML framework'
              - label: Tools
                value: 'Existing ATT&CK-aligned detection rules and SIEM logic'
          - type: fields
            subject: 'Layer 2 Atlas Coverage'
            id: layer_2_atlas_coverage
            entries:
              - label: Scope
                value: 'ML-specific techniques used once access is obtained or via public API'
              - label: Examples
                value: 'Model extraction, adversarial example crafting, training data poisoning'
              - label: Tools
                value: 'New detection rules aligned to ATLAS AML.TXXXX identifiers'
          - type: fields
            subject: 'Layer 3 Joint Campaign Tracking'
            id: layer_3_joint_campaign_tracking
            entries:
              - label: Scope
                value: 'Multi-phase attacks spanning both traditional IT and ML techniques'
              - label: Examples
                value: >
                  Phishing (ATT&CK T1566) → credential theft → ML registry access → weight
                  exfiltration (ATLAS AML.T0035)
              - label: Tools
                value: 'Campaign tracking that references both T and AML identifiers in incident records'
  - number: '5.7.8'
    heading: 'ATLAS for Detection Engineering and Red Teaming'
    id: subsection_08
    parts:
      - heading: 'Atlas for Detection Engineering'
        id: atlas_for_detection_engineering
        blocks:
          - type: prose
            text: >
              The detection engineering value of ATLAS is that it maps adversary techniques to
              required data sources. For each ATLAS technique, a detection engineer can ask: "What
              observable does this technique produce?" The answer determines which log sources to
              instrument and what detection logic to write.
        parts:
          - heading: 'Detection Opportunity Matrix Excerpt'
            id: detection_opportunity_matrix_excerpt
            blocks:
              - type: fields
                subject: 'Aml T0040 Api Access'
                id: AML_T0040_api_access
                entries:
                  - label: Technique
                    value: 'ML Model Inference API Access'
                  - label: Observable
                    value: 'Query volume, input diversity, one-shot pattern'
                  - label: 'Data Source'
                    value: 'API gateway request log'
                  - label: 'Detection Logic'
                    value: 'Volume > threshold AND diversity_score > 0.85 AND avg_turns < 2'
                  - label: 'Sigma Tag'
                    value: atlas.aml.t0040
              - type: fields
                subject: 'Aml T0020 Poison Training'
                id: AML_T0020_poison_training
                entries:
                  - label: Technique
                    value: 'Poison Training Data'
                  - label: Observable
                    value: 'Unauthorised write to training data directory'
                  - label: 'Data Source'
                    value: 'Filesystem/IAM access log'
                  - label: 'Detection Logic'
                    value: 'write_access == true AND identity NOT IN authorised_writers'
                  - label: 'Sigma Tag'
                    value: atlas.aml.t0020
              - type: fields
                subject: 'Aml T0043 Adversarial Data'
                id: AML_T0043_adversarial_data
                entries:
                  - label: Technique
                    value: 'Craft Adversarial Data'
                  - label: Observable
                    value: 'Near-identical queries with small systematic variations'
                  - label: 'Data Source'
                    value: 'API request log'
                  - label: 'Detection Logic'
                    value: 'input_edit_distance(consecutive_queries) < 5 AND count > 20 in 5min'
                  - label: 'Sigma Tag'
                    value: atlas.aml.t0043
              - type: fields
                subject: 'Aml T0018 Backdoor Model'
                id: AML_T0018_backdoor_model
                entries:
                  - label: Technique
                    value: 'Backdoor ML Model'
                  - label: Observable
                    value: 'Model behaviour deviation from baseline on trigger inputs'
                  - label: 'Data Source'
                    value: 'Model behavioural regression test output'
                  - label: 'Detection Logic'
                    value: 'regression_test_failure_on_safety_suite OR canary_trigger_activated'
                  - label: 'Sigma Tag'
                    value: atlas.aml.t0018
              - type: fields
                subject: 'Aml T0029 Dos'
                id: AML_T0029_dos
                entries:
                  - label: Technique
                    value: 'Denial of ML Service'
                  - label: Observable
                    value: 'Token consumption rate spike; inference latency spike'
                  - label: 'Data Source'
                    value: 'Billing telemetry; model serving latency log'
                  - label: 'Detection Logic'
                    value: 'cost_per_minute > 3x_rolling_avg OR p99_latency > 3x_baseline'
                  - label: 'Sigma Tag'
                    value: atlas.aml.t0029
          - heading: 'Coverage Measurement'
            id: coverage_measurement
            blocks:
              - type: prose
                text: >
                  ATLAS enables quantitative detection programme coverage measurement:
              - type: code
                lang: text
                text: |
                  total_atlas_techniques = ~75   # ATLAS v2
                  techniques_with_detection_rule = count(your_rules mapped to AML.TXXXX)
                  coverage_pct = techniques_with_detection_rule / total_atlas_techniques * 100
              - type: prose
                text: >
                  This metric is defensible to stakeholders: "Our detection programme covers X% of
                  ATLAS techniques, with the following high-priority gaps in [tactic list]." OWASP
                  risk IDs do not enable this measurement — you cannot say "we cover 7 of 10 OWASP
                  risks" with the same precision because OWASP risks are categories, not specific
                  observable behaviours.
      - heading: 'Atlas for Red Teaming'
        id: atlas_for_red_teaming
        blocks:
          - type: prose
            text: >
              Red team exercises structured around ATLAS tactics give the most operationally
              realistic assessment of an organisation's ML security posture.
        parts:
          - heading: 'Red Team Exercise Structure'
            id: red_team_exercise_structure
            blocks:
              - type: fields
                subject: 'Phase 1 Reconnaissance'
                id: phase_1_reconnaissance
                entries:
                  - label: Duration
                    value: 'Day 1-2'
                  - label: 'Atlas Tactics'
                    value:
                      - 'ML Reconnaissance'
                      - 'ML Resource Development'
                  - label: Objectives
                    value:
                      - 'Enumerate model capabilities via API probing (AML.T0040)'
                      - 'Identify model type, input/output format, and likely training data'
                      - 'Build proxy model if API provides logprobs (AML.T0005)'
                  - label: 'Success Criteria'
                    value: 'Can describe target model architecture and capability profile with >70% accuracy'
              - type: fields
                subject: 'Phase 2 Initial Access'
                id: phase_2_initial_access
                entries:
                  - label: Duration
                    value: 'Day 3-4'
                  - label: 'Atlas Tactics'
                    value:
                      - 'Initial Access to ML'
                      - Execution
                  - label: Objectives
                    value:
                      - 'Attempt supply chain vector: probe model registry for unsafe artifact intake (AML.T0010)'
                      - 'Attempt prompt injection via indirect vectors (AML.T0051.001)'
                      - 'Attempt pickle-format model submission if intake controls are testable'
                  - label: 'Success Criteria'
                    value: 'At least one initial access path validated'
              - type: fields
                subject: 'Phase 3 Impact and Exfiltration'
                id: phase_3_impact_and_exfiltration
                entries:
                  - label: Duration
                    value: 'Day 5-6'
                  - label: 'Atlas Tactics'
                    value:
                      - 'Impact on ML'
                      - 'Exfiltration via ML'
                      - 'Defence Evasion via ML'
                  - label: Objectives
                    value:
                      - 'Demonstrate model extraction feasibility (AML.T0024.002)'
                      - 'Craft adversarial example evading a deployed classifier if applicable (AML.T0043)'
                      - 'Demonstrate training data recall (AML.T0057)'
                  - label: 'Success Criteria'
                    value: 'At least one impact or exfiltration demonstrated'
              - type: fields
                subject: 'Phase 4 Reporting'
                id: phase_4_reporting
                entries:
                  - label: Duration
                    value: 'Day 7'
                  - label: Output
                    value:
                      - 'Technique chain documented as AML.TXXXX references'
                      - 'Detection gaps identified: which techniques were not detected'
                      - 'Mitigation recommendations mapped to ATLAS mitigations (AML.MXXXX)'
                      - 'Coverage improvement recommendations for detection programme'
deliverables:
  - heading: 'ATLAS Tactic and Technique Reference Card'
    id: implementation_01
    filename: atlas_reference_card.py
    lang: python
    description: >
      Complete ATLAS reference card as a Python data structure. All 12 tactics with representative
      techniques, adversary goals, attack surface layer mapping, and detection opportunities.
      Outputs formatted one-pager, JSON export, and Sigma tag list.
    code: |
      """
      MITRE ATLAS Reference Card
      12 tactics, representative techniques, layer mapping, detection opportunities.
      Outputs: console summary, JSON, Sigma tag list.
      """

      import json
      from dataclasses import dataclass, field
      from typing import List, Dict


      @dataclass
      class AtlasTechniqueRef:
          id: str
          name: str
          detection_signal: str
          data_source: str
          sigma_tag: str


      @dataclass
      class AtlasTactic:
          id: str
          name: str
          adversary_goal: str
          attack_surface_layers: List[int]
          representative_techniques: List[AtlasTechniqueRef]
          att_and_ck_parallel: str
          primary_risk: str


      ATLAS_TACTICS: List[AtlasTactic] = [
          AtlasTactic(
              id="AML.TA0002",
              name="ML Reconnaissance",
              adversary_goal="Learn about target ML system before attacking",
              attack_surface_layers=[6, 7],
              att_and_ck_parallel="TA0043 Reconnaissance",
              primary_risk="Capability enumeration; extraction setup; proxy model building",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0000", "Search Publicly Available Research",
                                    "None — OSINT, no API contact", "Public internet", "atlas.aml.t0000"),
                  AtlasTechniqueRef("AML.T0040", "ML Model Inference API Access",
                                    "Query volume + diversity + one-shot pattern", "API gateway log", "atlas.aml.t0040"),
                  AtlasTechniqueRef("AML.T0047", "ML-Enabled Product or Service",
                                    "logprob access + high diversity queries", "API gateway log", "atlas.aml.t0041"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0003",
              name="ML Resource Development",
              adversary_goal="Build resources needed to conduct ML attack",
              attack_surface_layers=[1, 2],
              att_and_ck_parallel="TA0042 Resource Development",
              primary_risk="Adversary building surrogate model or poisoned dataset off-network",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0002", "Acquire Public ML Artifacts",
                                    "None — occurs on adversary infrastructure", "N/A", "atlas.aml.t0002"),
                  AtlasTechniqueRef("AML.T0002.000", "Acquire Training Data",
                                    "None — OSINT and data scraping", "N/A", "atlas.aml.t0003"),
                  AtlasTechniqueRef("AML.T0005", "Create Proxy ML Model",
                                    "None — offline surrogate training", "N/A", "atlas.aml.t0005"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0004",
              name="Initial Access to ML",
              adversary_goal="Gain entry into target ML pipeline or serving infrastructure",
              attack_surface_layers=[3, 4, 6],
              att_and_ck_parallel="TA0001 Initial Access",
              primary_risk="Supply chain compromise; API exploitation; credential theft",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0049", "Exploit Public-Facing Application (ML API)",
                                    "Anomalous API error rate + unusual parameter patterns", "API gateway log", "atlas.aml.t0010"),
                  AtlasTechniqueRef("AML.T0010", "ML Supply Chain Compromise",
                                    "Pickle format at intake; hash mismatch", "Model registry intake log", "atlas.aml.t0019"),
                  AtlasTechniqueRef("AML.T0012", "Valid Accounts",
                                    "Anomalous access hours; geo anomaly", "IAM/auth log", "atlas.aml.t0012"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0000",
              name="ML Model Access",
              adversary_goal="Obtain different access levels to target model",
              attack_surface_layers=[4, 5, 6],
              att_and_ck_parallel="No direct parallel — ML-specific",
              primary_risk="Access level escalation enabling more powerful attacks",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0040", "ML Model Inference API Access",
                                    "See TA0002 — same technique, different phase", "API gateway log", "atlas.aml.t0040"),
                  AtlasTechniqueRef("AML.T0044", "Full ML Model Access",
                                    "Weight file read by non-serving identity", "Storage access log", "atlas.aml.t0044"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0005",
              name="Execution",
              adversary_goal="Run adversary-controlled code in ML environment",
              attack_surface_layers=[3, 5],
              att_and_ck_parallel="TA0002 Execution",
              primary_risk="RCE via pickle deserialisation on model load",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0011", "User Execution — Malicious ML Artifact",
                                    "Pickle magic bytes at intake; process spawned from ML worker", "Format checker + process log", "atlas.aml.t0011"),
                  AtlasTechniqueRef("AML.T0049", "Exploit Public-Facing Application (ML framework CVE)",
                                    "CVE in ML framework dependencies", "SCA scan + dependency log", "atlas.aml.t0049"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0006",
              name="Persistence in ML",
              adversary_goal="Maintain access or capability that survives retraining",
              attack_surface_layers=[3, 4],
              att_and_ck_parallel="TA0003 Persistence — mechanism entirely different",
              primary_risk="Backdoor trigger persisting through retraining cycles",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0018", "Backdoor ML Model",
                                    "Behavioural regression failure on trigger inputs; canary token", "Behavioural regression log", "atlas.aml.t0018"),
                  AtlasTechniqueRef("AML.T0020", "Poison Training Data",
                                    "Unauthorised write to training data; data hash change", "Filesystem/IAM log + data hash monitor", "atlas.aml.t0020"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0001",
              name="ML Attack Staging",
              adversary_goal="Prepare adversarial artifacts before delivery",
              attack_surface_layers=[2, 5],
              att_and_ck_parallel="Partial TA0042 Resource Development",
              primary_risk="Adversarial example pipeline ready for deployment; poisoned dataset staged",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0043", "Craft Adversarial Data",
                                    "Near-identical queries with systematic variation", "API request log", "atlas.aml.t0043"),
                  AtlasTechniqueRef("AML.T0042", "Verify Attack on Surrogate",
                                    "None — occurs on adversary infrastructure", "N/A", "atlas.aml.t0042"),
                  AtlasTechniqueRef("AML.T0043", "Craft Adversarial Data (physical adversarial patches)",
                                    "High-frequency texture anomaly in input images", "Image preprocessing log", "atlas.aml.t0043"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0010",
              name="Exfiltration via ML",
              adversary_goal="Extract model weights, training data, or embeddings",
              attack_surface_layers=[6, 8],
              att_and_ck_parallel="TA0010 Exfiltration — target is statistical knowledge not files",
              primary_risk="Model IP theft; training data extraction; PII recall",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0024", "Exfiltrate via ML Inference API",
                                    "High-volume diverse queries; logprob access", "API gateway log + billing telemetry", "atlas.aml.t0024"),
                  AtlasTechniqueRef("AML.T0057", "LLM Data Leakage",
                                    "Low-perplexity long outputs; prefix probing pattern", "Output log + perplexity monitor", "atlas.aml.t0037"),
                  AtlasTechniqueRef("AML.T0035", "Collect ML Artifacts",
                                    "Bulk read of model registry; >1GB download", "Storage access log", "atlas.aml.t0035"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0011",
              name="Impact on ML",
              adversary_goal="Cause ML system to perform incorrectly or become unavailable",
              attack_surface_layers=[5, 6, 8],
              att_and_ck_parallel="TA0040 Impact",
              primary_risk="Misclassification; DoS; model integrity erosion",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0015", "Evade ML Model",
                                    "Classification confidence distribution shift; adversarial input detector", "Inference log + detector output", "atlas.aml.t0015"),
                  AtlasTechniqueRef("AML.T0029", "Denial of ML Service",
                                    "Token rate spike; latency spike; cost anomaly", "Billing telemetry + serving latency log", "atlas.aml.t0029"),
                  AtlasTechniqueRef("AML.T0031", "Erode ML Model Integrity",
                                    "Output toxicity rate increase; rapid behaviour change", "Output quality monitor", "atlas.aml.t0031"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0007",
              name="Defence Evasion via ML",
              adversary_goal="Avoid detection by ML-based security systems",
              attack_surface_layers=[5, 7],
              att_and_ck_parallel="TA0005 Defence Evasion — extended to ML-based defences",
              primary_risk="Bypass of ML-based malware classifier, fraud detector, spam filter",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0015", "Evade ML Model (security detector)",
                                    "Input distribution shift at classifier boundary", "Classifier input log", "atlas.aml.t0015"),
                  AtlasTechniqueRef("AML.T0052", "Phishing (LLM-generated spearphishing)",
                                    "Phishing email linguistic quality anomaly", "Email gateway + LLM output detector", "atlas.aml.t0053"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0008",
              name="Discovery",
              adversary_goal="Learn about ML environment from inside after gaining access",
              attack_surface_layers=[3, 4],
              att_and_ck_parallel="TA0007 Discovery",
              primary_risk="Mapping of model registry, training pipelines, and data storage",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0007", "Discover ML Artifacts",
                                    "Unusual filesystem enumeration in model/data directories", "Filesystem access log", "atlas.aml.t0007"),
                  AtlasTechniqueRef("AML.T0007", "Discover ML Artifacts (frameworks and versions)",
                                    "ML framework version probing commands", "Process execution log", "atlas.aml.t0008"),
              ],
          ),
          AtlasTactic(
              id="AML.TA0009",
              name="Collection",
              adversary_goal="Gather ML assets for later exfiltration",
              attack_surface_layers=[3, 4],
              att_and_ck_parallel="TA0009 Collection",
              primary_risk="Model weight and training data staged for exfiltration",
              representative_techniques=[
                  AtlasTechniqueRef("AML.T0035", "Collect ML Artifacts from Repositories",
                                    "Bulk read of model registry files", "Storage access log", "atlas.aml.t0035"),
                  AtlasTechniqueRef("AML.T0036", "Data from Information Repositories (training data)",
                                    "Bulk read of training data directories", "Filesystem access log", "atlas.aml.t0036"),
              ],
          ),
      ]


      # ATLAS kill-chain order for the twelve tactics of ATLAS 4.x
      KILL_CHAIN_ORDER = ["ML Reconnaissance", "ML Resource Development", "Initial Access to ML", "ML Model Access",
                          "Execution", "Persistence in ML", "Defence Evasion via ML", "Discovery", "Collection",
                          "ML Attack Staging", "Exfiltration via ML", "Impact on ML"]
      ATLAS_TACTICS.sort(key=lambda t: KILL_CHAIN_ORDER.index(t.name))

      # Tactics ATLAS 5.x adds (id, name, placed after, ATT&CK parallel)
      ATLAS_5_ADDED_TACTICS = [
          ("AML.TA0012", "Privilege Escalation", "Persistence in ML", "TA0004 Privilege Escalation"),
          ("AML.TA0013", "Credential Access", "Defence Evasion via ML", "TA0006 Credential Access"),
          ("AML.TA0015", "Lateral Movement", "Discovery", "TA0008 Lateral Movement"),
          ("AML.TA0014", "Command and Control", "ML Attack Staging", "TA0011 Command and Control"),
      ]


      def print_reference_card(tactics: List[AtlasTactic]) -> None:
          print("=" * 70)
          print("MITRE ATLAS — 12 TACTIC REFERENCE CARD")
          print("=" * 70)
          for i, t in enumerate(tactics, 1):
              layers = ", ".join(f"Layer {l}" for l in t.attack_surface_layers)
              print(f"\n{i:2d}. [{t.id}] {t.name}")
              print(f"    Goal:         {t.adversary_goal}")
              print(f"    Surface:      {layers}")
              print(f"    ATT&CK:       {t.att_and_ck_parallel}")
              print(f"    Primary Risk: {t.primary_risk}")
              print(f"    Techniques ({len(t.representative_techniques)}):")
              for tech in t.representative_techniques:
                  print(f"      {tech.id:15s} {tech.name}")


      def export_json(tactics: List[AtlasTactic], path: str = "atlas_tactics.json") -> None:
          data = [
              {
                  "id": t.id,
                  "name": t.name,
                  "adversary_goal": t.adversary_goal,
                  "attack_surface_layers": t.attack_surface_layers,
                  "att_and_ck_parallel": t.att_and_ck_parallel,
                  "primary_risk": t.primary_risk,
                  "techniques": [
                      {
                          "id": tech.id,
                          "name": tech.name,
                          "detection_signal": tech.detection_signal,
                          "data_source": tech.data_source,
                          "sigma_tag": tech.sigma_tag,
                      }
                      for tech in t.representative_techniques
                  ],
              }
              for t in tactics
          ]
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          print(f"\nExported to {path}")


      def export_sigma_tags(tactics: List[AtlasTactic],
                             path: str = "atlas_sigma_tags.txt") -> None:
          tags = sorted(set(
              tech.sigma_tag
              for t in tactics
              for tech in t.representative_techniques
          ))
          with open(path, "w") as f:
              for tag in tags:
                  f.write(tag + "\n")
          print(f"Sigma tag list ({len(tags)} tags) exported to {path}")


      def layer_coverage_report(tactics: List[AtlasTactic]) -> None:
          print("\nATTACK SURFACE LAYER COVERAGE:")
          for layer in range(1, 9):
              covering = [t.name for t in tactics if layer in t.attack_surface_layers]
              print(f"  Layer {layer}: {len(covering)} tactic(s) — {', '.join(covering) if covering else 'none'}")


      if __name__ == "__main__":
          print_reference_card(ATLAS_TACTICS)
          layer_coverage_report(ATLAS_TACTICS)
          export_json(ATLAS_TACTICS)
          export_sigma_tags(ATLAS_TACTICS)
          all_techniques = [tech for t in ATLAS_TACTICS for tech in t.representative_techniques]
          print(f"\nTotal: {len(ATLAS_TACTICS)} tactics, {len(all_techniques)} representative techniques in card")
          print("\nADDED IN ATLAS 5.x (16 tactics in 5.6.0):")
          for tid, name, after, attack in ATLAS_5_ADDED_TACTICS:
              print(f"  [{tid}] {name:22s} after {after:24s} ATT&CK {attack}")
  - heading: 'ATLAS Detection Opportunity Matrix + Red Team Template'
    id: implementation_02
    filename: atlas_detection_matrix.py
    lang: python
    description: >
      DetectionOpportunityMatrix: maps each ATLAS technique to data source, detection logic sketch,
      and coverage difficulty rating. Computes programme coverage percentage. RedTeamTemplate:
      generates a structured ATLAS-based red team exercise plan with phase objectives, success
      criteria, and output format.
    code: |
      """
      ATLAS Detection Opportunity Matrix + Red Team Template Generator
      Coverage scoring and structured red team planning.
      """

      from dataclasses import dataclass, field
      from typing import List, Dict, Optional
      import json


      @dataclass
      class DetectionOpportunity:
          technique_id: str
          technique_name: str
          tactic: str
          observable: str
          data_source: str
          detection_logic_sketch: str
          difficulty: str      # "low" / "medium" / "high"
          covered: bool = False
          sigma_tag: str = ""


      DETECTION_MATRIX: List[DetectionOpportunity] = [
          DetectionOpportunity(
              "AML.T0000", "Search Publicly Available Research",
              "ML Reconnaissance",
              "None — OSINT, no API contact",
              "N/A (external OSINT)",
              "Monitor for publications citing your model/system by name",
              "high", sigma_tag="atlas.aml.t0000",
          ),
          DetectionOpportunity(
              "AML.T0040", "ML Model Inference API Access",
              "ML Reconnaissance",
              "High query volume + input diversity >0.85 + avg_turns <2",
              "API gateway request log",
              "volume > threshold AND diversity_score > 0.85 AND avg_turns < 2",
              "low", sigma_tag="atlas.aml.t0040",
          ),
          DetectionOpportunity(
              "AML.T0005", "Create Proxy ML Model",
              "ML Resource Development",
              "None — occurs on adversary infrastructure",
              "N/A",
              "Indirect: detect AML.T0040 (proxy model built after extraction queries)",
              "high", sigma_tag="atlas.aml.t0005",
          ),
          DetectionOpportunity(
              "AML.T0010", "ML Supply Chain Compromise",
              "Initial Access to ML",
              "Pickle magic bytes at intake; hash mismatch at load",
              "Model registry intake log + format checker",
              "file_header_bytes IN [PICKLE_V2, PICKLE_V4] OR hash_at_load != hash_at_intake",
              "low", sigma_tag="atlas.aml.t0019",
          ),
          DetectionOpportunity(
              "AML.T0011", "User Execution — Malicious ML Artifact",
              "Execution",
              "Unexpected process spawned from ML serving worker",
              "Process execution log",
              "parent_process IN [python, torch_serve] AND child NOT IN [expected_processes]",
              "medium", sigma_tag="atlas.aml.t0011",
          ),
          DetectionOpportunity(
              "AML.T0018", "Backdoor ML Model",
              "Persistence in ML",
              "Behavioural regression failure on trigger-probe test suite",
              "Behavioural regression test log",
              "safety_test_failures > 0 OR canary_trigger_fired == true",
              "medium", sigma_tag="atlas.aml.t0018",
          ),
          DetectionOpportunity(
              "AML.T0020", "Poison Training Data",
              "Persistence in ML",
              "Unauthorised write to training data directory or dataset hash change",
              "Filesystem/IAM access log + dataset integrity monitor",
              "write_to_training_dir AND identity NOT IN authorised_data_writers",
              "low", sigma_tag="atlas.aml.t0020",
          ),
          DetectionOpportunity(
              "AML.T0043", "Craft Adversarial Data",
              "ML Attack Staging",
              "Near-identical queries with small systematic variations",
              "API request log",
              "edit_distance(consecutive_inputs) < 5 AND count > 20 in 5min window",
              "medium", sigma_tag="atlas.aml.t0043",
          ),
          DetectionOpportunity(
              "AML.T0024", "Exfiltrate via ML Inference API",
              "Exfiltration via ML",
              "Sustained high-diversity query volume over days",
              "API gateway log + billing telemetry",
              "queries_per_day > 10000 AND diversity > 0.85 for 3+ consecutive days",
              "medium", sigma_tag="atlas.aml.t0024",
          ),
          DetectionOpportunity(
              "AML.T0057", "LLM Data Leakage (training data extraction)",
              "Exfiltration via ML",
              "Low-perplexity long outputs; prefix-probe pattern",
              "API output log + perplexity monitor",
              "output_length > 300 AND output_surprise_score < threshold",
              "medium", sigma_tag="atlas.aml.t0037",
          ),
          DetectionOpportunity(
              "AML.T0035", "Collect ML Artifacts from Repositories",
              "Collection",
              ">1GB download from model registry by non-serving identity",
              "Storage access log",
              "download_bytes > 1073741824 AND identity NOT IN serving_service_accounts",
              "low", sigma_tag="atlas.aml.t0035",
          ),
          DetectionOpportunity(
              "AML.T0015", "Evade ML Model",
              "Impact on ML",
              "Input distribution shift at classifier boundary",
              "Inference log + classifier input distribution monitor",
              "input_distribution_KL_divergence > threshold from baseline",
              "high", sigma_tag="atlas.aml.t0015",
          ),
          DetectionOpportunity(
              "AML.T0029", "Denial of ML Service",
              "Impact on ML",
              "Token rate spike; latency spike; cost anomaly",
              "Billing telemetry + serving latency log",
              "cost_per_min > 3x_avg OR p99_latency > 3x_baseline",
              "low", sigma_tag="atlas.aml.t0029",
          ),
          DetectionOpportunity(
              "AML.T0031", "Erode ML Model Integrity",
              "Impact on ML",
              "Output toxicity rate increase over rolling window",
              "Output quality/toxicity classifier log",
              "toxicity_rate_15min > 3x_baseline_toxicity_rate",
              "medium", sigma_tag="atlas.aml.t0031",
          ),
          DetectionOpportunity(
              "AML.T0048.002", "Influence Operations via GenAI",
              "Impact on ML",
              "AI-generated content markers in outputs used for downstream content",
              "Output log + AI-content detector",
              "ai_generation_confidence > 0.9 AND output_used_for_public_content",
              "high", sigma_tag="atlas.aml.t0048.002",
          ),
          DetectionOpportunity(
              "AML.T0007", "Discover ML Artifacts",
              "Discovery",
              "Unusual filesystem enumeration in model/data directories",
              "Filesystem access log",
              "ls/find commands in model_dir OR data_dir by non-pipeline identity",
              "medium", sigma_tag="atlas.aml.t0007",
          ),
          DetectionOpportunity(
              "AML.T0052", "Phishing (LLM-generated spearphishing)",
              "Defence Evasion via ML",
              "Phishing email with unusually high linguistic quality",
              "Email gateway + LLM output detector",
              "email_ai_confidence > 0.85 AND sender NOT in known_contacts",
              "high", sigma_tag="atlas.aml.t0053",
          ),
      ]


      def score_coverage(matrix: List[DetectionOpportunity],
                          covered_technique_ids: List[str]) -> Dict:
          for entry in matrix:
              entry.covered = entry.technique_id in covered_technique_ids

          total = len(matrix)
          covered = sum(1 for e in matrix if e.covered)
          by_difficulty = {"low": 0, "medium": 0, "high": 0}
          gaps_by_difficulty = {"low": [], "medium": [], "high": []}
          for e in matrix:
              if not e.covered:
                  gaps_by_difficulty[e.difficulty].append(e.technique_id)
              else:
                  by_difficulty[e.difficulty] += 1

          return {
              "total_techniques": total,
              "covered": covered,
              "coverage_pct": round(covered / total * 100, 1),
              "covered_by_difficulty": by_difficulty,
              "gaps_by_difficulty": gaps_by_difficulty,
          }


      def print_coverage_report(report: Dict) -> None:
          print("\nATLAS DETECTION COVERAGE REPORT")
          print("=" * 50)
          print(f"Techniques in matrix: {report['total_techniques']}")
          print(f"Covered:              {report['covered']}")
          print(f"Coverage:             {report['coverage_pct']}%")
          print(f"\nGaps by detection difficulty:")
          for diff in ["low", "medium", "high"]:
              gaps = report["gaps_by_difficulty"][diff]
              if gaps:
                  print(f"  {diff.upper():6s}: {', '.join(gaps)}")
              else:
                  print(f"  {diff.upper():6s}: None — fully covered")
          first = next((d for d in ["low", "medium", "high"] if report["gaps_by_difficulty"][d]), None)
          if first is None:
              print("\nRecommendation: No gaps in the matrix; re-assess after the next threat model update.")
          else:
              print(f"\nRecommendation: Address {first}-difficulty gaps first (lowest-effort detections still missing).")


      def generate_red_team_template(target_model_name: str,
                                      deployment_type: str,
                                      output_path: str = "atlas_red_team_plan.json") -> None:
          plan = {
              "exercise_title": f"ATLAS Red Team — {target_model_name}",
              "deployment_type": deployment_type,
              "framework": "MITRE ATLAS v2",
              "phases": [
                  {
                      "phase": 1,
                      "name": "Reconnaissance and Resource Development",
                      "duration": "Day 1-2",
                      "atlas_tactics": ["AML.TA0002 ML Reconnaissance", "AML.TA0003 ML Resource Development"],
                      "objectives": [
                          "Enumerate model capabilities via API probing (AML.T0040)",
                          "Identify model type, input/output format, and task",
                          "Determine if logprobs access is available (AML.T0040)",
                          "Build proxy model if sufficient API access (AML.T0005)",
                      ],
                      "success_criteria": "Can describe target model architecture and capability profile",
                      "detection_test": "Did AML.T0040 probe pattern trigger any alert?",
                  },
                  {
                      "phase": 2,
                      "name": "Initial Access and Execution",
                      "duration": "Day 3-4",
                      "atlas_tactics": ["AML.TA0004 Initial Access", "AML.TA0005 Execution"],
                      "objectives": [
                          "Probe model registry intake for pickle format acceptance (AML.T0010)",
                          "Attempt indirect prompt injection via external data sources (AML.T0051.001)",
                          "Test credential anomaly detection with off-hours access simulation (AML.T0012)",
                      ],
                      "success_criteria": "At least one initial access path validated or confirmed defended",
                      "detection_test": "Did supply chain probe and injection attempts trigger alerts?",
                  },
                  {
                      "phase": 3,
                      "name": "Impact, Exfiltration, and Persistence",
                      "duration": "Day 5-6",
                      "atlas_tactics": [
                          "AML.TA0010 Exfiltration via ML",
                          "AML.TA0011 Impact on ML",
                          "AML.TA0006 Persistence in ML",
                      ],
                      "objectives": [
                          "Demonstrate model extraction economic feasibility (AML.T0024.002)",
                          "Test training data recall via prefix probing (AML.T0057)",
                          "Demonstrate DoS via context flooding (AML.T0029)",
                          "Verify canary token detection if canaries are deployed (AML.T0018/T0020)",
                      ],
                      "success_criteria": "At least one impact or exfiltration vector demonstrated or confirmed blocked",
                      "detection_test": "Did extraction probing, DoS attempt, and canary probe trigger alerts?",
                  },
                  {
                      "phase": 4,
                      "name": "Reporting",
                      "duration": "Day 7",
                      "deliverables": [
                          "Technique chain documented as AML.TXXXX reference list",
                          "Detection gap list: techniques not detected during exercise",
                          "Mitigation recommendations mapped to AML.MXXXX references",
                          "Coverage improvement recommendations for detection programme",
                          "Updated coverage percentage before and after recommended improvements",
                      ],
                  },
              ],
          }
          with open(output_path, "w") as f:
              json.dump(plan, f, indent=2)
          print(f"Red team plan exported to {output_path}")


      if __name__ == "__main__":
          # Simulate a programme that has implemented some detections
          covered = [
              "AML.T0040",  # API probe detection
              "AML.T0010",  # Supply chain format check
              "AML.T0020",  # Training data access monitoring
              "AML.T0029",  # DoS rate limiting
              "AML.T0035",  # Weight download egress monitoring
              "AML.T0057",  # Output perplexity monitoring
          ]
          report = score_coverage(DETECTION_MATRIX, covered)
          print_coverage_report(report)
          generate_red_team_template(
              target_model_name="AcmeCorp-FinanceGPT",
              deployment_type="RAG chatbot with internal tools",
          )
  - heading: 'ATLAS Case Study Analyser'
    id: implementation_03
    filename: atlas_case_study_analyser.py
    lang: python
    description: >
      Structured representation of three documented adversarial ML incidents in ATLAS case-study
      format (GPT-2 training data extraction, physical adversarial patch, Microsoft Tay poisoning).
      Extracts tactic-technique chains, detection opportunities, and mitigation mappings. Produces a
      case study analysis report and detection gap comparison.
    code: |
      """
      ATLAS Case Study Analyser
      Three documented incidents mapped to ATLAS tactic-technique chains.
      Outputs: analysis report, detection opportunity summary, mitigation map.
      """

      from dataclasses import dataclass, field
      from typing import List, Dict


      @dataclass
      class TechniqueStep:
          step: int
          tactic: str
          technique_id: str
          technique_name: str
          action: str


      @dataclass
      class DetectionOpportunitySummary:
          description: str
          detectable: bool
          data_source: str


      @dataclass
      class CaseStudy:
          atlas_id: str
          title: str
          adversary_type: str
          target_system: str
          motivation: str
          technique_chain: List[TechniqueStep]
          detection_opportunities: List[DetectionOpportunitySummary]
          mitigations: List[str]
          key_lesson: str


      CASE_STUDIES: List[CaseStudy] = [
          CaseStudy(
              atlas_id="none (research result in ATLAS format)",
              title="GPT-2 Training Data Extraction",
              adversary_type="Academic researcher",
              target_system="GPT-2 (OpenAI, public model)",
              motivation="Privacy research — demonstrate verbatim memorisation risk",
              technique_chain=[
                  TechniqueStep(1, "ML Reconnaissance", "AML.T0040",
                                "ML Model Inference API Access",
                                "Probe model with diverse prefixes to understand output characteristics"),
                  TechniqueStep(2, "ML Attack Staging", "AML.T0043",
                                "Craft Adversarial Data",
                                "Generate large set of prompts to maximise training data recall"),
                  TechniqueStep(3, "Exfiltration via ML", "AML.T0057",
                                "LLM Data Leakage",
                                "Generate completions; filter by low perplexity; match against known sources"),
              ],
              detection_opportunities=[
                  DetectionOpportunitySummary(
                      "High-volume diverse one-shot query pattern", True, "API gateway log"),
                  DetectionOpportunitySummary(
                      "Systematic prefix variation in consecutive inputs", True, "API request log"),
                  DetectionOpportunitySummary(
                      "Low-perplexity outputs longer than avg", True, "Output log + perplexity monitor"),
                  DetectionOpportunitySummary(
                      "Standard rate limiting would detect volume", True, "API gateway"),
              ],
              mitigations=[
                  "Differential privacy training to reduce memorisation",
                  "Training data deduplication before training",
                  "Output perplexity monitoring with rate limiting",
                  "Canary token injection for definitive detection",
              ],
              key_lesson="Memorisation is a property of all large LLMs. Output-side detection (perplexity monitoring, canary tokens) is the primary operational control. Training-time controls (DP, deduplication) reduce but do not eliminate risk.",
          ),
          CaseStudy(
              atlas_id="none (research result in ATLAS format)",
              title="Physical Adversarial Patch on Traffic Sign Classifier",
              adversary_type="Academic researcher (safety-critical proof of concept)",
              target_system="Deep CNN traffic sign classifier (autonomous vehicle context)",
              motivation="Safety research — demonstrate physical-world adversarial attack transfer",
              technique_chain=[
                  TechniqueStep(1, "ML Reconnaissance", "AML.T0000",
                                "Search Publicly Available Research",
                                "Identify model architecture and training dataset from public sources"),
                  TechniqueStep(2, "ML Resource Development", "AML.T0005",
                                "Create Proxy ML Model",
                                "Train white-box surrogate on same dataset for gradient access"),
                  TechniqueStep(3, "ML Attack Staging", "AML.T0043.000",
                                "Craft Adversarial Data: White-box Optimisation",
                                "Generate robust physical perturbation via PGD with physical constraints"),
                  TechniqueStep(4, "ML Attack Staging", "AML.T0043",
                                "Craft Adversarial Data (physical adversarial patch)",
                                "Print adversarial sticker; apply to physical stop sign"),
                  TechniqueStep(5, "Impact on ML", "AML.T0015",
                                "Evade ML Model",
                                "Vehicle classifier misidentifies stop sign as 45 mph sign"),
              ],
              detection_opportunities=[
                  DetectionOpportunitySummary(
                      "Adversarial patch detector on input images", True, "Image preprocessing pipeline"),
                  DetectionOpportunitySummary(
                      "Ensemble model disagreement on affected images", True, "Multi-model inference log"),
                  DetectionOpportunitySummary(
                      "High-frequency texture anomaly in sign region", True, "Image preprocessing"),
                  DetectionOpportunitySummary(
                      "No detection possible without adversarial detector at inference time", False, "N/A"),
              ],
              mitigations=[
                  "Adversarial training: include adversarial examples in training data",
                  "Ensemble classification: require agreement across multiple independent models",
                  "Physical anomaly detection: flag unusual high-frequency texture in sign regions",
                  "Formal robustness certification for safety-critical classifiers",
              ],
              key_lesson="Physical adversarial attacks transfer from digital to real world. Safety-critical ML systems require adversarial robustness certification, not just accuracy benchmarking. Standard ML evaluation pipelines do not test for adversarial robustness.",
          ),
          CaseStudy(
              atlas_id="AML.CS0009 (Tay Poisoning)",
              title="Coordinated Training Data Poisoning via Microsoft Tay",
              adversary_type="Coordinated internet community (non-state)",
              target_system="Microsoft Tay chatbot (Twitter deployment, 2016)",
              motivation="Disruptive — cause reputational damage via output manipulation",
              technique_chain=[
                  TechniqueStep(1, "ML Reconnaissance", "AML.T0003",
                                "Search Victim-Owned Websites",
                                "Identify Tay uses real-time online learning from user conversations"),
                  TechniqueStep(2, "ML Resource Development", "AML.T0002.000",
                                "Acquire Training Data (coordinate poisoning inputs at scale)",
                                "Coordinate large number of users to send targeted harmful content"),
                  TechniqueStep(3, "Persistence in ML", "AML.T0020",
                                "Poison Training Data",
                                "Flood Tay with harmful messages; online learning incorporates them in real time"),
                  TechniqueStep(4, "Impact on ML", "AML.T0031",
                                "Erode ML Model Integrity",
                                "Tay produces harmful outputs; Microsoft forced offline in 16 hours"),
              ],
              detection_opportunities=[
                  DetectionOpportunitySummary(
                      "Coordinated submission pattern: many users sending similar harmful content", True, "Input log + coordination pattern detector"),
                  DetectionOpportunitySummary(
                      "Output toxicity rate spike above baseline", True, "Output toxicity monitor"),
                  DetectionOpportunitySummary(
                      "Rapid model behaviour change detectable via A/B output monitoring", True, "Output quality monitor"),
                  DetectionOpportunitySummary(
                      "No content moderation on training input — root cause gap", False, "N/A — control missing"),
              ],
              mitigations=[
                  "Do not use real-time learning from untrusted public input without moderation gate",
                  "Input content moderation: filter harmful content before training update",
                  "Rate-limit training updates per user to prevent coordinated flooding",
                  "Output toxicity monitoring with automatic shutdown threshold",
              ],
              key_lesson="Online learning from untrusted public input is an existential vulnerability for production systems. The architectural decision is the root cause — mitigations (content moderation, rate limiting) treat the symptom. The correct fix is not to train on untrusted real-time input.",
          ),
      ]


      def print_case_study_analysis(cs: CaseStudy) -> None:
          print(f"\n{'='*65}")
          print(f"CASE STUDY: {cs.title}")
          print(f"  ID:       {cs.atlas_id}")
          print(f"  Target:   {cs.target_system}")
          print(f"  Adversary:{cs.adversary_type}")
          print(f"\n  TECHNIQUE CHAIN ({len(cs.technique_chain)} steps):")
          for step in cs.technique_chain:
              print(f"    {step.step}. [{step.technique_id}] {step.technique_name}")
              print(f"       Tactic: {step.tactic}")
              print(f"       Action: {step.action[:80]}")
          print(f"\n  DETECTION OPPORTUNITIES:")
          for d in cs.detection_opportunities:
              icon = "DETECTABLE" if d.detectable else "GAP      "
              print(f"    [{icon}] {d.description[:60]}")
              if d.detectable:
                  print(f"             Source: {d.data_source}")
          print(f"\n  MITIGATIONS:")
          for m in cs.mitigations:
              print(f"    -> {m}")
          print(f"\n  KEY LESSON:")
          print(f"    {cs.key_lesson[:180]}")


      def detection_gap_comparison(case_studies: List[CaseStudy]) -> None:
          print(f"\n{'='*65}")
          print("DETECTION GAP COMPARISON ACROSS CASE STUDIES")
          print("=" * 65)
          for cs in case_studies:
              detectable = sum(1 for d in cs.detection_opportunities if d.detectable)
              total = len(cs.detection_opportunities)
              print(f"\n  {cs.title[:45]}")
              print(f"    Detectable: {detectable}/{total} opportunities")
              gaps = [d.description[:55] for d in cs.detection_opportunities if not d.detectable]
              for g in gaps:
                  print(f"    GAP: {g}")


      if __name__ == "__main__":
          for cs in CASE_STUDIES:
              print_case_study_analysis(cs)
          detection_gap_comparison(CASE_STUDIES)
