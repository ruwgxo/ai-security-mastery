prose_content:
  part_1:
    title: The Whole Surface as One Flow
    body: |-
      Step back from the six builds and one pipeline appears. A request reaches the Chapter 15 detector suite, which produces a DetectorResult. A single function, build_event, turns that result and its request context into a DetectionEvent -- the platform-neutral, serialisable contract at the centre of everything. The enrichment pipeline fills that event's open slots with the Chapter 13 behavioural context, the derived IOCs, and the response actions, so the event is now an actionable alert while keeping the exact same shape. And then the event fans out: the Sigma rules express the detection logic portably for any platform to evaluate, and the connectors -- Splunk over HEC, Datadog over the Logs API and metrics, Elastic through Logstash, or the custom webhook for anything else -- each map that one event to their platform and deliver it.

      The shape of the flow is the lesson. There is one contract, built in one place, enriched in one place, and consumed by every delivery path. That is why five different platforms stay consistent: none of them sees a bespoke payload, all of them translate from the same schema, and a change to what a detection carries -- a new field, a revised severity rule, a new enrichment -- happens once and reaches all of them. The chapter's architecture is not five integrations; it is one detection event with five ways out.
  part_2:
    title: Choosing and Configuring a Platform
    body: |-
      The reference card that follows turns the flow into a decision. If a team is on Splunk, the path is HEC delivery plus the add-on plus the Sigma rules as correlation searches. On Datadog, it is the Logs API for detail and the metrics channel for rates that sit beside the Chapter 14 observability signals. On Elastic, it is the Logstash transform, the explicit keyword mapping, daily indices under a lifecycle policy, and the Sigma rules as detection rules. On anything else, it is the signed, versioned webhook. And across all of them, enrichment runs before delivery, so whichever path a team takes, the alert arrives with its context and response actions attached.

      The common structure under the four connectors is worth naming because it is what makes the suite maintainable. Every connector is a schema-to-platform mapping behind a swappable transport, configured by data with its secret read from the environment, and tested end to end on a stub before it ever touches the real platform. That uniformity means adding a sixth platform later is a known exercise -- write the mapping, stub the transport, test, wire the secret -- not a fresh invention. The reference card captures the per-platform specifics; the shared shape is what lets them all be reasoned about the same way.
  part_3:
    title: 'The Feedback Loop: From Delivery to Tuning'
    body: |-
      Delivering detections to the SIEM completes Chapter 16, but its real significance is what it starts. Until the detections reach a place a team watches, the suite runs blind: it makes decisions no one can observe in aggregate, and there is no way to know whether a detector is too aggressive, too lax, or silent when it should be firing. Integration ends that blindness. With detections flowing in as enriched, actionable alerts -- tagged by detector, verdict, and severity, carrying entity and session context -- a team can finally see the suite's behaviour: which detectors fire and how often, which alerts get dismissed as false positives, where incidents slipped through with no alert at all.

      That visibility is precisely the raw material for tuning, and tuning is Chapter 17. The metrics channel feeding Datadog, the indexed detections in Elastic, the correlation searches in Splunk -- these are not just where alerts live; they are the measurement surface the next chapter reads to decide what to adjust. A detector whose flags are almost always dismissed needs a higher threshold; a gap where incidents recur with no detection needs a new rule; a severity that consistently over- or under-states urgency needs remapping. None of those decisions is possible without the integration this chapter built. Chapter 16 is the sense organ; Chapter 17 is the learning it enables.
  part_4:
    title: What the Chapter Established
    body: |-
      Four commitments carried through every section. First, one detection-event schema: the entire surface consumes a single contract, built by one function, so a detection is expressed once and delivered everywhere consistently -- the single most important structural decision in the chapter. Second, portability before lock-in: Sigma gives detection logic that runs on any platform, generated from the detectors so it never drifts from them. Third, delivery plus enrichment equals actionability: a connector that ships a raw detection ships a fact, and only the enrichment that adds context, IOCs, and response actions makes it an alert a responder can act on. Fourth, automation over memory: generated-and-hashed rules and stubbed-and-tested connectors keep the SIEM in sync with the detectors by construction rather than by someone remembering to update it.

      Those commitments are why the chapter is a system and not a collection of exporters. Each connector was simple because the schema did the hard work of being the shared contract; enrichment composed with every path because it preserved that schema; deployment stayed current because generation made drift detectable. The knowledge assessment that follows checks these ideas -- the schema as contract, the push/pull and platform distinctions, the verdict-to-severity and verdict-to-Sigma mappings, the reason enrichment must preserve the schema, and the role integration plays in enabling monitoring. Mastery of the chapter is holding the whole flow at once: request to result to event to enriched alert to platform.
  part_5:
    title: 'Transition to Chapter 17: Monitoring and Tuning'
    body: |-
      Part 4 has moved from building detectors (Chapter 15) to delivering their detections to security operations (Chapter 16). Chapter 17 closes the loop by turning the delivered detections back on the detectors themselves. Monitoring is watching the suite through the SIEM it now feeds -- detection rates, false-positive rates, coverage gaps, latency trends -- and tuning is acting on what monitoring reveals: adjusting thresholds, adding and retiring rules, remapping severities, and measuring whether each change improved the suite. It is the maintenance discipline that keeps a detection system effective as the threats and the traffic it sees keep changing.

      The handoff is direct. Every measurement Chapter 17 relies on is a detection this chapter delivered: the aggregate rates come from the Datadog metrics channel, the searchable detection history from Elastic and Splunk, the enriched context that tells a true positive from a false one from the enrichment pipeline. Chapter 16 built the visibility; Chapter 17 uses it to close the feedback loop, so the suite does not merely run but improves. With detections now reaching security operations as actionable alerts, the next chapter turns to keeping the detectors that produce them sharp.
