      Consolidated from the sections: each mistake maps to a principle the chapter's design enforces.
    columns:
    - Mistake
    - Principle it violates
    rows:
    - - Computing detections but never delivering them
      - Delivery is the last mile; an undelivered detection is not actioned
    - - A separate ad-hoc export per platform
      - One shared schema keeps every path consistent
    - - Deriving severity per connector
      - Severity is derived once so platforms agree on urgency
    - - Hand-authoring SIEM rules
      - Generation keeps the SIEM in sync with the detectors
    - - Dropping the full detection to send only indexed fields
      - The whole detection must stay searchable for investigation
    - - An unsigned custom webhook
      - A generic channel must carry its own trust
    - - Delivering raw detections without enrichment
      - Context and actions are what make an alert actionable
    - - Enrichment that breaks the schema
      - Enrichment must preserve the shape so it composes with every connector
