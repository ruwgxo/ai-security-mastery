assessment:
  title: Chapter 16 Knowledge Assessment
  description: |-
    Twenty questions covering the integration surface: the detection-event schema as contract, the push/pull model, the Sigma generator and its mappings, the three platform connectors, the custom webhook, and the enrichment pipeline. Answers follow the questions.
  questions:
  - |-
    Q1. Why is a detection that is computed but never delivered to the SIEM considered not actioned?
  - |-
    Q2. What single object does every part of the integration surface consume, and what function produces it?
  - |-
    Q3. What does the detection-event schema add to a Chapter 15 DetectorResult, and why?
  - Q4. Why is severity derived once in the schema rather than in each connector?
  - |-
    Q5. Distinguish a push integration from a pull integration, and classify each Chapter 16 delivery path.
  - |-
    Q6. What makes Sigma portable, and why generate the rules rather than hand-author them?
  - Q7. Name the three governing keys of a Sigma rule and what each controls.
  - |-
    Q8. How does a detector verdict map to a Sigma condition, and why does allow stay quiet?
  - |-
    Q9. How does a content hash over the rule set keep the SIEM in sync with the detectors?
  - |-
    Q10. In the Splunk connector, which fields are promoted to indexed fields, and what stays in the event body, and why?
  - Q11. Why must the ISO timestamp be converted before sending to Splunk HEC?
  - Q12. What does a Splunk add-on package, and why ship the integration as one?
  - Q13. Why does the Datadog connector use two channels, and what does each carry?
  - |-
    Q14. How do detection events aggregate into Datadog metric series, and why aggregate at the connector?
  - |-
    Q15. How do the Datadog detection metrics connect to the Chapter 14 observability work?
  - |-
    Q16. In the Elastic connector, why is an explicit keyword mapping necessary for the facet fields?
  - Q17. Why do detections write to daily indices under a lifecycle policy?
  - |-
    Q18. Why does the custom webhook require an HMAC signature that the dedicated connectors did not?
  - Q19. What does the enrichment pipeline add to a raw detection, and from where?
  - Q20. Why must enrichment write only into the schema's existing slots?
  answers:
  - |-
    A1. Because operational value comes from a responder acting on it; inside the gateway it changes nothing -- a tree falling in an empty forest.
  - |-
    A2. The DetectionEvent, produced by the single build_event function from a DetectorResult and its request context.
  - |-
    A3. A timestamp, a derived severity, the request context (request id, session, surface, source), and iocs/labels slots -- everything a SIEM needs that the detector-facing result omits.
  - |-
    A4. So every platform sorts detections identically; deriving it per connector lets the same detection read critical on one platform and medium on another.
  - |-
    A5. Push: the gateway sends events and owns delivery (Splunk, Datadog, Elastic, custom webhook). Pull: the platform evaluates rules against events it holds (Sigma-based).
  - |-
    A6. Sigma is neutral logic each platform compiles to its own query language; generating from the detectors keeps the rules in sync rather than drifting as a hand-authored snapshot would.
  - |-
    A7. logsource (the event stream the rule runs on), detection (the field selection that matches), condition (how selections combine).
  - |-
    A8. The verdict becomes the selection value; flag and block alert (medium and high), and allow stays quiet because a match per allowed request would bury the real alerts.
  - |-
    A9. Regenerating after a detector change alters the hash; a differing hash signals the rule set changed and, with auto-redeploy, triggers deployment -- sync by construction.
  - |-
    A10. detector, verdict, and severity are promoted for fast filtering and alerting; the full detection stays in the body because an investigation needs the scores, evidence, session, and surface.
  - |-
    A11. HEC expects an epoch time; sending the ISO string mis-parses the event time and places detections at the wrong point on the Splunk timeline.
  - |-
    A12. The index, sourcetype, field extractions, and saved searches/dashboards -- so POSTed JSON becomes a structured, queryable data source rather than opaque text.
  - |-
    A13. A detection is both an event and a data point in a rate: the Logs API carries per-detection detail; the metrics interface carries aggregate counts by dimension.
  - |-
    A14. Events are counted by (detector, verdict, severity) into one series per combination; aggregating at the connector gives exact rates cheaply instead of counting raw logs.
  - |-
    A15. They are submitted under a namespace alongside the Chapter 14 golden-signal metrics, so operational and detection signals share dashboards and can be correlated.
  - |-
    A16. Without it Elasticsearch guesses string facets as analysed text, which cannot be aggregated cleanly, so Kibana breakdowns by detector or verdict return wrong or empty buckets.
  - |-
    A17. Daily indices make time-scoped queries efficient and let old data be dropped whole; the ILM policy bounds the footprint automatically so indices do not fill the cluster.
  - |-
    A18. A generic endpoint has no platform token machinery, so the contract must carry its own trust; the HMAC lets the receiver verify authenticity and integrity and reject forgeries.
  - |-
    A19. The Chapter 13 Section 13.11 entity/session/graph context and known-bad indicators (into labels and iocs) plus verdict-and-context-appropriate response actions.
  - |-
    A20. So the enriched event keeps the DetectionEvent shape and every connector delivers it unchanged; new top-level fields would break the schema mapping and stop enrichment composing with delivery.
section_summary:
  compact: |-
    Section 16.07 synthesises Chapter 16 into one flow and hands off to Chapter 17. The whole surface is a single pipeline: a request reaches the Chapter 15 detector suite, build_event turns the result into the platform-neutral DetectionEvent that is the chapter's central contract, the enrichment pipeline fills that event's open slots with the Chapter 13 behavioural context, IOCs, and response actions while preserving its shape, and the event then fans out -- as portable Sigma rules and through the Splunk, Datadog, Elastic, and custom-webhook connectors that each map the one event to their platform. The lesson of the flow is that there is one contract, built and enriched in one place and consumed by every delivery path, which is why five platforms stay consistent and why a change to a detection reaches all of them at once. The section provides a reference card for choosing and configuring each platform, a checklist that turns integration into ordered steps, and a consolidation of the chapter's mistakes against the principle each protects, plus a twenty-question assessment. Its final work is the handoff: delivering detections to the SIEM ends the suite's blindness and creates the measurement surface -- Datadog rates, indexed Elastic history, Splunk correlation searches, enriched context -- that Chapter 17's monitoring and tuning reads to adjust thresholds, add and retire rules, and remap severities. Chapter 16 built the sense organ; Chapter 17 is the learning it enables, because you cannot tune what you cannot see.
  key_takeaways:
  - |-
    The whole chapter is one flow: result to event to enriched alert to platform, around a single shared contract
  - |-
    One detection-event schema, built and enriched in one place, is what keeps five delivery paths consistent
  - |-
    Every connector shares a shape -- schema-to-platform mapping, swappable transport, env-sourced secret, stub-tested
  - |-
    Delivery plus enrichment equals actionability; automation over memory keeps the SIEM in sync with the detectors
  - |-
    Integration is the prerequisite for monitoring: the delivered detections are the measurement surface Chapter 17 tunes on
  - |-
    Chapter 17 closes the loop, turning the delivered detections back on the detectors to keep the suite sharp
