        value: >
          Combine all primitives into operational detection ensemble with weighted voting and
          disagreement diagnostics
      - label: Inputs
        value:
          - 'Candidate model and training data'
          - 'Ensemble configuration: which primitives, weighting, thresholds'
          - 'Decision policy: vote-any | weighted-vote | consensus'
      - label: Outputs
        value:
          - 'Per-primitive detection results'
          - 'Aggregated ensemble decision'
          - 'Disagreement diagnostic flags'
          - 'Recommended follow-up investigation'
      - label: 'Implementation Notes'
        value: >
          Single file /code/defences/chapter_08/ensemble_detection_harness.py. Single quotes
          throughout per book convention. Dependencies: all Section 8.12 deliverables 1-5. Default
          ensemble: spectral signatures + Neural Cleanse + STRIP + meta-classifier. Default
          decision: weighted vote with calibrated threshold. Disagreement diagnostics route
          ambiguous cases to additional analysis. Section 8.15 production pipeline integration
          point.
      - label: Usage
        value: >
          Production ensemble deployment; orchestration layer for Section 8.15 auditing pipeline
          detection track
common_mistakes:
  - subject: >
      Deploying a single detection primitive (typically Neural Cleanse) and treating it as
      comprehensive coverage
    id: mistake_1_single_primitive_deployment
    entries:
      - label: 'Why It Happens'
        value: >
          Research papers publishing detection primitives typically benchmark against canonical
          attacks at high TPR. Practitioners reading the papers see impressive single-primitive
          numbers and assume the coverage transfers. The transfer assumption is false when the
          threat model includes attacks the primitive does not cover. Single-primitive deployments
          are common; they look defensive on paper and are operationally fragile.
      - label: Consequence
        value: >
          No single primitive in Section 8.12 covers the full attack space. Single-primitive
          deployments have predictable coverage gaps that sophisticated adversaries can target.
          Neural Cleanse alone misses dynamic triggers entirely; spectral signatures alone misses
          composite triggers.
      - label: 'Correct Approach'
        value: >
          Deploy ensembles whose primitives have complementary failure modes. Section 8.12 ensemble
          design reference provides patterns from minimal to comprehensive. Section 8.15 production
          pipeline operationalises the comprehensive ensemble as default.
  - subject: 'Using primitive default thresholds without calibration against the deployment context'
    id: mistake_2_ignoring_threshold_calibration
    entries:
      - label: 'Why It Happens'
        value: >
          Default thresholds in research code reproduce paper benchmark results. The benchmarks are
          typically standardised datasets with specific characteristics. Production deployment
          contexts have different data distributions, model architectures, and acceptable
          false-positive rates. Default thresholds tuned for benchmark performance are not
          necessarily appropriate for production.
      - label: Consequence
        value: >
          Thresholds produce either too many false positives (operationally unworkable) or too few
          true positives (coverage failure). The defensive programme appears either alarmist or
          asleep depending on which way the calibration drifts.
      - label: 'Correct Approach'
        value: >
          Calibrate thresholds against held-out validation data representative of the deployment
          context. Recalibrate periodically as data distributions shift. Section 8.12 deliverables
          include threshold calibration tooling.
  - subject: >
      Treating meta-classifier training corpus as static and not updating for emerging attack
      variants
    id: mistake_3_static_attack_corpus_for_meta_classifier
    entries:
      - label: 'Why It Happens'
        value: >
          Meta-classifier training is expensive (large corpora of clean and backdoored models). Once
          trained, the classifier feels like a deployable asset rather than an ongoing maintenance
          commitment. Practitioners deploy and then under-invest in corpus updates as new attack
          variants emerge.
      - label: Consequence
        value: >
          Meta-classifier coverage matches the threat model at training time and drifts increasingly
          out of date. New attack variants appear in research and quickly in adversary practice; the
          meta-classifier does not learn to detect them. Coverage degrades over time without visible
          signal until the gap is exploited.
      - label: 'Correct Approach'
        value: >
          Treat meta-classifier corpus maintenance as ongoing operational responsibility. Update
          quarterly or on threat intelligence triggers. Section 8.12 deliverable 5 framework
          supports incremental retraining; Section 8.15 production pipeline includes corpus
          maintenance as standard discipline.
  - subject: 'Deploying STRIP runtime detection without any training-time detection primitive'
    id: mistake_4_runtime_detection_without_training_time
    entries:
      - label: 'Why It Happens'
        value: >
          Runtime detection feels comprehensive: every input is evaluated. Practitioners deploy
          STRIP and skip training-time primitives, reasoning that runtime coverage is sufficient.
          The reasoning misses that runtime detection cannot remediate -- it can only filter or
          alert -- and that runtime-only deployments provide no defence against attacks where the
          trigger is rare in production but consequential when present.
      - label: Consequence
        value: >
          Runtime filter catches some triggered inputs but cannot remove the underlying backdoor.
          Backdoored model continues to serve traffic; rare triggered inputs may slip past STRIP
          threshold; the underlying compromise is unaddressed. Backdoor remains exploitable
          indefinitely.
      - label: 'Correct Approach'
        value: >
          Deploy training-time detection (spectral signatures, activation clustering, Neural
          Cleanse) AND runtime detection (STRIP). Training-time detection catches and remediates the
          backdoor; runtime detection provides additional defence-in-depth. The two layers are
          complementary.
  - subject: >
      Treating ensemble primitive disagreement as a failure of the ensemble rather than as
      diagnostic information
    id: mistake_5_disagreement_as_failure
    entries:
      - label: 'Why It Happens'
        value: >
          Ensemble outputs feel cleaner when primitives agree. When they disagree, practitioners may
          decide the ensemble is unreliable and revert to single-primitive thinking. The intuition
          misses that disagreement is precisely the signal that distinguishes attack types.
          Spectral-positive Neural-Cleanse-negative is a different attack signature than
          spectral-negative Neural-Cleanse-positive; both are informative.
      - label: Consequence
        value: >
          Ensemble disagreement is treated as noise; the diagnostic information embedded in
          disagreement patterns is lost. Detection programmes lose the ability to distinguish attack
          types and miss opportunities for targeted follow-up investigation.
      - label: 'Correct Approach'
        value: >
          Treat disagreement as diagnostic. Specific disagreement patterns suggest specific attack
          types; specific patterns warrant specific follow-up analysis. Section 8.12 deliverable 6
          includes disagreement diagnostic logic; Section 8.15 production pipeline routes ambiguous
          cases based on disagreement pattern.
section_summary:
  compact: >
    Five principal detection primitives cover the published backdoor attack space with complementary
    failure modes. Spectral signatures detect poisoned-sample clusters via class-restricted feature
    covariance principal components. Activation clustering detects the same clusters via direct
    activation clustering with different sensitivity properties. Neural Cleanse reverse-engineers
    fixed triggers via per-class minimum-perturbation optimisation, providing both detection and
    remediation. STRIP detects triggered inputs at runtime via input-perturbation entropy,
    exploiting trigger-prediction dominance. Meta-classifiers learn to distinguish backdoored from
    clean models from training corpora of both, providing general-purpose coverage where analytical
    primitives have specific gaps. Each primitive has predictable failure modes: spectral signatures
    and activation clustering miss cluster-dispersing attacks; Neural Cleanse misses dynamic
    triggers; STRIP misses entropy-stable attacks; meta-classifiers miss attack variants outside
    their training corpus. Operational deployment requires ensemble construction with complementary
    failure modes, weighted voting calibrated against the threat model, and disagreement diagnostics
    that distinguish attack types via primitive response patterns. The reference ensemble (spectral
    signatures + Neural Cleanse + STRIP + meta-classifier) covers the full attack catalogue at
    meaningful TPR, with computational cost calibrated to deployment stakes. Section 8.13 covers
    complementary defensive training techniques; Section 8.14 extends to federated and gradient
    poisoning; Section 8.15 integrates everything into the production auditing pipeline.
  key_takeaways:
    - 'No single primitive covers the full backdoor attack space; ensemble deployment is structurally mandatory'
    - 'Spectral signatures and activation clustering exploit poisoned-sample feature/activation clustering; both fail on dispersed-cluster attacks'
    - 'Neural Cleanse reverse-engineers fixed triggers; provides remediation; fails on dynamic triggers entirely'
    - 'STRIP operates at runtime via input-perturbation entropy; principal layer for dynamic-trigger and per-input detection'
    - 'Meta-classifiers learn discrimination from corpora; coverage matches corpus diversity; ongoing corpus maintenance mandatory'
    - 'Reference comprehensive ensemble: spectral signatures + Neural Cleanse + STRIP + meta-classifier covers attack catalogue at varying TPR'
    - 'Threshold calibration is operational tuning that requires ongoing recalibration as data and threats evolve'
    - 'Ensemble disagreement is diagnostic information, not noise; specific disagreement patterns indicate specific attack types'
next:
  kind: section
  target: '13'
  title: 'Defensive Training Techniques: Robust Optimisation, DP-SGD, Data Filtering, Certified Defences'
  summary: >
    Section 8.12 covered detection primitives that identify backdoors after they are present in
    models or training data. Section 8.13 covers defensive training techniques that prevent
    backdoors from being installed in the first place, or that limit the effectiveness of installed
    backdoors through training-time interventions. Four principal techniques get coverage:
    differentially private SGD (DP-SGD) which limits per-sample influence, robust optimisation which
    trains models resistant to data perturbation, data filtering which removes suspect samples
    before training (using Section 8.12 detection as upstream input), and certified defences which
    provide mathematical guarantees of bounded backdoor impact. Detection (Section 8.12) and
    prevention (Section 8.13) are complementary defensive layers; production pipelines deploy both.
    Section 8.14 then extends to federated and gradient poisoning before Section 8.15 capstones the
    chapter.
