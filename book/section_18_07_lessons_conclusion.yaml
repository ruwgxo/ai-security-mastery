common_mistakes:
  mistake_1:
    description: Carrying away the specific detectors as the lesson, rather than the principles
    why_it_happens: |-
      The detectors are concrete and immediately usable, while the principles are abstract.
    consequence: |-
      As attacks evolve and the specific detectors age, the reader who learned only the implementations is left without the means to build the next ones.
    correct_approach: |-
      Carry away the recurring principles -- layered detection, baseline before anomaly, deployment as a discipline, continuous improvement -- because they are the durable content that builds the next detectors.
  mistake_2:
    description: Treating the built system as a finished defence
    why_it_happens: |-
      The book culminates in a validated, working system, which feels like a completed defence.
    consequence: |-
      The system decays against an adapting adversary, because there is no finished defence against attacks that keep evolving.
    correct_approach: |-
      Treat the built system as the beginning of an ongoing practice, kept effective by the continuous improvement loop and evolved by the durable principles as the landscape changes.
  mistake_3:
    description: Applying one detection posture to every domain
    why_it_happens: |-
      The attack cases all wanted high recall, so recall-maximising becomes the default posture.
    consequence: |-
      In a domain like healthcare where the detected thing is mostly legitimate, a recall-maximising posture disrupts the legitimate work the system exists to support.
    correct_approach: |-
      Tune the posture to the domain's cost structure -- recall for rare bad things, precision where the detected thing is mostly legitimate -- because the domain, not a default, sets the costs.
  mistake_4:
    description: Overstating what the evidence supports, in validation or reporting
    why_it_happens: |-
      Stronger claims are more convincing, and the discipline of honest evidence is easy to relax at the finish.
    consequence: |-
      The whole detection discipline rests on believing no more than the evidence supports; overstating it -- ignoring the base rate, claiming unverifiable metrics -- produces confident, wrong conclusions.
    correct_approach: |-
      Be honest about evidence throughout: measure on the true distribution, respect the base rate, and claim no more than the construction or the data supports.
section_summary:
  compact: |-
    Section 18.07 concludes Chapter 18, Part 4, and the book by lifting the reader from the five specific cases to the principles they share. Beneath five attacks across three domains, the same handful of principles recurred in every case, and that recurrence marks them as properties of the problem rather than artifacts of any attack. Layered detection is the most pervasive: every case turned on the interaction of layers, each matched to a scale, with the hardest attacks -- the multi-turn jailbreak, the coordinated network -- invisible to every layer but the one built for their scale, so layering is coverage, not redundancy. Baseline before anomaly is the second spine: the attacks that mattered rarely carried a local signature of badness and were caught only as departures from an established normal. Three more principles recurred -- the state-latency coupling that the behavioural-central cases strained, deployment as a distinct discipline that the at-scale cases made explicit, and continuous improvement that every case assumed -- and two cross-cutting practices held throughout: domain-aware response, because compliance and context shape what the response must do, and honesty about evidence, the discipline of believing no more than the evidence supports, of which the base-rate problem and the composite framing of these very cases are two faces. Stated as guidance, these become the consolidated best practices, transferable to attacks the book never named because they are properties of detecting adversarial behaviour in AI systems, not of any specific attack. The section reviews the complete Part 1 to 4 system the cases validated -- foundations, detection engineering, deployment, practical implementation, one pipeline from request to response detecting at every scale -- and concludes the book: the reader has built the whole system and, more durably, the way of thinking that produced it, leaving not with a finished defence, for there is none against an adapting adversary, but with a way of building and evolving one, equipped to meet attacks not yet invented.
  key_takeaways:
  - |-
    The same principles recurred across every case, marking them as properties of the problem, not of any attack
  - |-
    Layered detection across scales and baseline before anomaly are the spine of the whole approach
  - |-
    The state-latency coupling, deployment as a discipline, and continuous improvement recurred in every case
  - |-
    Domain-aware response and honesty about evidence are the cross-cutting practices that held throughout
  - |-
    The complete Part 1 to 4 system is one pipeline from request to response, detecting at every scale
  - |-
    The principles outlast the implementations: the reader leaves with a built system and the judgment to evolve it
