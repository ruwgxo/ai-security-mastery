prose_content:
  part_1:
    title: The Scenario and Why Scale Is the Challenge
    body: |-
      The scenario is a composite injection campaign against an enterprise LLM deployment operating at high request volume -- the ordinary condition of a production system serving many users. The campaign is not a single ingenious payload but a sustained, high-volume stream of injection attempts: many variations, probing the assistant across many requests and sessions, some direct and some routed through content the model retrieves. This is what injection looks like in production, and it is why the case is titled at scale rather than simply injection detection. The interesting question is not whether the detector can catch one crafted injection in isolation -- Chapter 15 established that -- but whether it can catch injection embedded in a high-volume live traffic stream without its accuracy slipping or its latency blowing the budget.

      Scale changes the problem in two ways that a functional test never surfaces. First, accuracy under load: a detector that is precise when called once may degrade when called on every request in a flood, if its performance characteristics shift under concurrency or if the operational pressure to keep latency down tempts a lighter, less accurate configuration. The detection quality has to hold at the ninety-ninth percentile of a busy system, not just on average in a quiet one. Second, the signal-to-noise problem of scale: a high-volume campaign hides in a high-volume traffic stream, and distinguishing the injection attempts from the legitimate requests they are buried in is harder precisely because there are so many of both. The scale challenge is therefore a joint property of the detector and the deployment, which is why this case exercises the Chapter 14 deployment engineering -- the batching, the resource provisioning, the latency budget management -- as centrally as it exercises the Chapter 15 detector. An injection detector that cannot hold its accuracy and latency at scale has not been validated for production, however well it scores on a test set.
  part_2:
    title: Direct Injection and the Per-Request Detector
    body: |-
      The campaign's direct injection attempts are the straightforward half, and they are where the per-request injection detector of Chapter 15 does exactly what it was built to do. A direct injection is an attempt to manipulate the model through the request itself -- an instruction embedded in the user's input that tries to override the system's intent, extract its prompt, or make it step outside its constraints. Because the manipulation is in the request, the input classifier sees it fully: the request is precisely the thing the detector examines, so a direct injection is caught on input, before it reaches the model, with the accuracy Chapter 15 established. At scale, the challenge for direct injection is purely the accuracy-and-latency-under-load problem of the previous part -- the detector is looking in the right place, and the question is only whether it keeps looking well under volume.

      The case shows the direct injection attempts being caught reliably at the input, and it is worth dwelling on why this half is comparatively easy, because it sharpens what makes the other half hard. The per-request detector's whole design assumption is that the threat is visible in the request it examines. For direct injection that assumption holds perfectly: the attacker put the manipulation in the request, and the request is what the detector reads. The deployment engineering ensures the detector runs on every request within budget even under the campaign's volume, so the direct injection is caught at scale as reliably as in isolation. This is the per-request layer at its strongest -- and precisely because it is so effective against direct injection, attackers reach for the form of injection that the per-request layer's core assumption does not cover, which is where the case gets interesting.
  part_3:
    title: Indirect Injection and the Gap in the Input Check
    body: |-
      Indirect injection is the harder half and the reason the case needs the behavioural layer. In indirect injection, the attacker does not put the manipulation in their own request -- they put it in content the model will retrieve: a document the assistant summarises, a web page it reads, a record it looks up, a field in data it processes. The user's request looks innocent, because it is; the malicious instruction rides in on the retrieved content, reaching the model through a channel the input classifier scrutinises far less closely. And that reduced scrutiny is not an oversight -- it is a design tension. Retrieved content is data the system fetched to do its job, often large and mostly benign, and subjecting every retrieved document to the same intensive per-request injection analysis as user input is expensive and floods the system with the volume of retrieved text. So the per-request detector, by design and by the economics of scale, examines retrieved content less thoroughly than direct input, and that is exactly the gap indirect injection exploits.

      This is where the case demonstrates the layering that the chapter keeps returning to. A single indirect injection, buried in a retrieved document, may pass the input check because the check is not looking as hard at retrieved content -- the individual payload slips through. But an indirect injection campaign is not a single payload; it is a pattern, and the pattern is visible even when the individual payloads are not. When the same injection technique appears across many requests through retrieved content, when a set of entities are all triggering unusual model behaviour after retrieval, when the sessions show the characteristic shape of a manipulation campaign, the behavioural layer of Chapter 13 sees it -- because the behavioural layer's whole purpose is to catch what is invisible in a single request but plain across many. The per-request detector's weakness against indirect injection is covered by the behavioural layer's strength at seeing campaigns, and that complementarity is the case's central finding: neither layer alone catches indirect injection at scale, but together they do, the per-request layer handling the direct attempts and the behavioural layer catching the indirect campaign by its pattern.
  part_4:
    title: The Response to an Injection Campaign
    body: |-
      The response to an injection campaign differs from the response to a single injection precisely because it is a campaign, and the playbook reflects that. When the per-request detector catches a direct injection, the immediate response is the ordinary one -- the request is blocked, the manipulation does not reach the model. But when the behavioural layer identifies an injection campaign, the response operates at the level of the campaign, not the individual request. The sources driving the campaign are identified and rate-limited or blocked; the retrieved-content channel being exploited for indirect injection is flagged for tighter scrutiny; the pattern the behavioural layer detected is turned into a signal that can catch the campaign's future attempts earlier. The response scales to the threat: a campaign is contained as a campaign.

      The SIEM integration of Chapter 16 is again what makes this coherent. The individual injection detections and the behavioural layer's campaign-level detection flow into security operations together, enriched with the entity, session, and pattern context that lets a responder see the campaign as one thing rather than as thousands of disconnected alerts. Without that enrichment and correlation, a high-volume campaign would present as an alert storm -- thousands of individual injection detections with no indication they are one coordinated effort -- and the responder would drown. The enrichment turns the storm into a single actionable picture: this is a campaign, from these sources, using this technique, through this channel. The response playbook for injection at scale is therefore as much about correlation and campaign-level action as about blocking individual payloads, and it depends on the integration layer to assemble the campaign view. The case shows the full path from a high volume of individual injection attempts to a single contained campaign, which is what responding to injection at scale actually requires.
  part_5:
    title: Lessons and Architecture Recommendations
    body: |-
      The injection-at-scale case validates the injection detector and the behavioural layer against a real campaign at production volume, and it yields architecture recommendations specific to holding injection detection at scale. The first is that injection detection is a joint detector-and-deployment property: the detector must be provisioned and configured to hold its accuracy and latency under load, so the deployment engineering of Chapter 14 -- batching, resource headroom, latency-budget management -- is part of the injection defence, not a separate concern. A detector validated only functionally, without the deployment that lets it hold at scale, is not validated for production. The second is that retrieved content is a first-class injection surface that the per-request layer under-covers by design, so indirect injection must be treated as a behavioural-layer responsibility -- the campaign pattern is the reliable signal when the individual retrieved payload is not. The third is campaign-level response: at scale, the response must correlate individual detections into campaigns and act at the campaign level, which depends on the enrichment and correlation the SIEM integration provides.

      The deeper lesson is the complementarity of the layers against a threat that neither catches alone. Direct injection is a per-request problem the input classifier solves; indirect injection at scale is a pattern problem the behavioural layer solves; and holding both at production volume is a deployment problem. The case is the chapter's clearest demonstration that the layering is not redundancy but coverage -- each layer covers a gap the others leave, and injection at scale requires all of them. It validates that the Chapter 15 injection detector and the Chapter 13 behavioural layer, on the Chapter 14 deployment, hold up against a real injection campaign -- and it establishes the pattern the remaining cases follow: a specific attack, the specific layers that catch it, and the specific way they combine. The next case takes that pattern to jailbreaks, where the multi-turn dimension makes the behavioural layer even more central.
