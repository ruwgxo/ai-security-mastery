section_overview:
  one_line_summary: |-
    The second case, a composite: the injection detector and the behavioural layer against a real injection campaign at high request volume, where the scale itself is part of the challenge -- accuracy and latency must hold across volume, exercising the Chapter 14 deployment as much as the Chapter 15 detector -- and where both direct injection and the indirect injection through retrieved content are in play, showing the behavioural layer catch what the per-request detector, scrutinising retrieved content less, lets through.
  why_this_section_exists: |-
    Injection is the archetypal LLM attack, and this case examines it under the condition that most distinguishes production from the lab: scale. A detector that catches injection in a test harness has proven something modest; a detector that catches it across an enterprise's live request volume, without its accuracy degrading and without its latency breaking the budget, has proven the thing that matters. The case exists to show that the injection detection built in Chapter 15 and the behavioural layer of Chapter 13 hold up not just against injection but against injection at scale -- and that holding up at scale is a property of the deployment engineering as much as of the detector, so the case exercises Chapter 14 as centrally as Chapter 15.

    The case has two axes. The first is the scale challenge itself: an injection campaign is not a single crafted payload but a high volume of attempts, and detecting it means holding detection quality and latency across that volume, where a detector that is accurate but slow, or fast but degrading under load, fails in production even though it would pass a functional test. The second axis is the two forms injection takes -- direct injection, where the attacker's manipulation is in the request itself and the per-request classifier scrutinises it fully; and indirect injection, where the manipulation arrives through content the model retrieves (a document, a web page, a record) that the input classifier examines far less closely, because it is data the system fetched rather than input the user typed. Indirect injection is the harder and more interesting half, because it is where the per-request detector is weakest and the behavioural layer earns its place, catching the campaign by its pattern across requests when the individual injected payload slipped past the input check. As established in 18.01, the campaign is a representative composite, not a specific proprietary incident.
  position_in_chapter: |-
    Section 18.03 is the second case study and the first to foreground a single attack class, narrowing from the enterprise mix of 18.02 to prompt injection. It exercises the Chapter 15 injection detector and the Chapter 13 behavioural layer under the Chapter 14 deployment's scale, covers direct and indirect injection, and produces the scaled-injection architecture recommendation and campaign playbook. It sets the pattern -- a specific attack, the layers that catch it, the response -- that the jailbreak, PII, and abuse cases follow.
