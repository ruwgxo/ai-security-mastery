    title: Injection-at-Scale Case Analysis
    filename: (case analysis -- incident, detection, response, lessons)
    description: |-
      The full incident-detection-response-lessons analysis of the injection-at-scale case: the high-volume composite campaign, the scale challenge as a joint detector-and-deployment property, the direct injection caught per-request and the indirect injection caught by the behavioural layer's pattern, the campaign-level response, and the lessons on the complementarity of the layers. Presented as the structured analysis in the prose and reference tables.
    implementation_notes: |-
      No runnable code: a case analysis in the chapter's deliverable form. It follows the 18.01 method, foregrounding how the per-request and behavioural layers combine against direct and indirect injection at scale, and how the Chapter 14 deployment holds detection under load.
    code: |
      # Section 18.03 deliverable: Injection-at-Scale Case Analysis.
      #
      #   INCIDENT   High-volume composite injection campaign against an enterprise
      #              deployment -- direct injection and indirect injection via retrieved
      #              content, buried in live traffic.
      #   DETECTION  Direct injection  -> per-request detector on input (Ch15).
      #              Indirect injection -> individual payloads slip the (by-design)
      #              reduced scrutiny of retrieved content; the CAMPAIGN is caught by
      #              the behavioural layer's pattern across requests (Ch13).
      #              Holding accuracy + latency at volume -> the Ch14 deployment.
      #   RESPONSE   Campaign-level: identify/rate-limit sources, flag the exploited
      #              retrieval channel, correlate individual detections into one campaign
      #              via the Ch16 integration, feed the pattern forward.
      #   LESSONS    The layers are complementary, not redundant: neither catches
      #              indirect injection at scale alone; injection detection is a joint
      #              detector-and-deployment property.
      print('Section 18.03: injection-at-scale case analysis -- see prose and tables.')
    note: Deliverable is a structured case analysis, not code.
  deliverable_2:
    title: Injection-Campaign Response Playbook
    filename: (response playbook -- injection at scale)
    description: |-
      The response playbook for an injection campaign at scale, following the 18.01 template but operating at campaign level: the trigger (behavioural-layer campaign detection), the containment (source rate-limiting, retrieval-channel scrutiny), the enrichment and correlation that assemble the campaign view, the escalation, the recovery, and the review that feeds the pattern forward into earlier detection. The playbook that turns thousands of individual injection attempts into one contained campaign.
    implementation_notes: |-
      No runnable code: a response playbook in the chapter's deliverable form. It extends the generic template with the correlation and campaign-level action that injection at scale requires, depending on the Chapter 16 integration to assemble the campaign view from individual detections.
    code: |
      # Section 18.03 deliverable: Injection-Campaign Response Playbook.
      #
      #   TRIGGER   Behavioural layer identifies an injection campaign (pattern across
      #             requests), and/or a spike of per-request injection detections.
      #   CONTAIN   Rate-limit or block the driving sources; raise scrutiny on the
      #             retrieval channel exploited for indirect injection.
      #   ENRICH    Correlate the individual detections into one campaign view via the
      #             Ch16 integration -- sources, technique, channel, affected sessions.
      #   ESCALATE  Present the single campaign picture to security operations, not the
      #             alert storm of thousands of individual detections.
      #   RECOVER   Confirm the campaign is contained; restore normal scrutiny once the
      #             source and channel are handled.
      #   REVIEW    Feed the detected pattern forward as an earlier-catching signal;
      #             disposition into the Ch17 tuning loop.
      print('Section 18.03: injection-campaign response playbook -- see prose.')
    note: Deliverable is a response playbook, not code.
common_mistakes:
  mistake_1:
    description: Validating an injection detector functionally but not at scale
    why_it_happens: |-
      The detector passes its test set with good accuracy, which looks like sufficient validation.
    consequence: |-
      In production the accuracy degrades under load or the latency breaks the budget, so a detector that works in the lab fails at the volume it actually has to run at.
    correct_approach: |-
      Validate the detector at production scale -- accuracy and latency held at the P99 of a busy system -- treating injection detection as a joint detector-and-deployment property.
  mistake_2:
    description: Relying on the per-request classifier to catch indirect injection
    why_it_happens: |-
      The per-request classifier catches direct injection so well that it is assumed to cover injection generally.
    consequence: |-
      Indirect injection through retrieved content slips the input check -- which by design scrutinises retrieved content less -- so the individual injected payloads pass undetected.
    correct_approach: |-
      Treat retrieved content as an injection surface the per-request layer under-covers, and make indirect injection a behavioural-layer responsibility caught by its campaign pattern.
  mistake_3:
    description: Subjecting all retrieved content to full per-request injection analysis at scale
    why_it_happens: |-
      It seems the obvious fix for indirect injection -- if the input check catches direct injection, apply it to retrieved content too.
    consequence: |-
      The cost and volume of fully analysing every retrieved document floods the system and breaks the latency budget, which is the very design tension that created the reduced scrutiny.
    correct_approach: |-
      Accept that per-request scrutiny of retrieved content is bounded by economics, and cover the gap with the behavioural layer's campaign detection rather than an unscalable input check.
  mistake_4:
    description: Responding to an injection campaign as thousands of individual detections
    why_it_happens: |-
      Each injection attempt fires its own detection, so the natural response is per-detection.
    consequence: |-
      The campaign presents as an alert storm with no indication the detections are one coordinated effort, and the responder drowns in disconnected alerts instead of seeing the campaign.
    correct_approach: |-
      Correlate the individual detections into a single campaign view via the SIEM integration and respond at the campaign level -- source, technique, channel -- not the individual request.
section_summary:
  compact: |-
    Section 18.03 narrows from the enterprise mix to prompt injection, examined under the condition that most distinguishes production from the lab: scale. The composite campaign is not one crafted payload but a high-volume stream of attempts, and the case's point is that catching injection at scale is a joint property of the detector and the deployment -- accuracy must hold at the P99 of a busy system and latency must stay within budget under a flood, so the Chapter 14 deployment engineering is exercised as centrally as the Chapter 15 detector. The case splits injection into its two forms. Direct injection, where the manipulation is in the user's request, is the per-request detector at its strongest -- the manipulation is exactly what the classifier examines, so it is caught on input reliably even at scale. Indirect injection, where the manipulation rides in on content the model retrieves, is the hard half: the input classifier scrutinises retrieved content far less closely, not by oversight but by the economics of scale, since fully analysing every retrieved document would flood the system -- and that reduced scrutiny is the gap indirect injection exploits. An individual indirect payload slips the input check, but an indirect campaign is a pattern, and the pattern is visible to the Chapter 13 behavioural layer even when the individual payload is not. This complementarity is the case's central finding: neither layer catches indirect injection at scale alone, but the per-request layer handles direct attempts while the behavioural layer catches the indirect campaign by its pattern. The response operates at campaign level, correlating thousands of individual detections into one contained campaign through the Chapter 16 integration, which turns an alert storm into a single actionable picture. The recommendations: injection detection is a detector-and-deployment property, retrieved content is a behavioural-layer responsibility, and the response must correlate detections into campaigns.
  key_takeaways:
  - |-
    Catching injection at scale is a joint detector-and-deployment property: accuracy and latency must hold under load
  - |-
    Direct injection is the per-request detector at its strongest -- the manipulation is exactly what it examines
  - |-
    Indirect injection through retrieved content exploits the input classifier's by-design reduced scrutiny of fetched data
  - |-
    An individual indirect payload slips the input check, but the campaign's pattern is visible to the behavioural layer
  - |-
    The layers are complementary, not redundant: neither catches indirect injection at scale alone, but together they do
  - |-
    The response operates at campaign level, correlating thousands of detections into one contained campaign via the integration
