section_summary:
  compact: >
    Section 5.3 establishes fluency with the OWASP LLM Top 10 as the industry-standard risk
    classification framework for LLM security. It covers the framework's origin (v1.0 May 2023 →
    v1.1 October 2023 → living document), its ranking methodology (prevalence × exploitability ×
    impact with important caveats about the limited evidence base), and all ten risks (LLM01 through
    LLM10) with one-line descriptions, attack surface layer mappings, impact categories, MITRE ATLAS
    cross-references, and chapter coverage pointers. The section then maps OWASP LLM Top 10 to the
    traditional OWASP Web Top 10, identifying four direct analogues (LLM01 ↔ A03, LLM02 ↔ XSS, LLM04
    ↔ DoS, LLM05 ↔ A06) and four genuinely novel risks with no web equivalent (LLM07, LLM08, LLM09,
    LLM10). It explains how to use OWASP as a risk communication tool for CISO briefings, vendor
    assessments, and risk register entries rather than as a binary checklist, documents OWASP's
    integration into EU AI Act, NIST AI RMF, SOC 2, and HIPAA, catalogues six significant
    limitations of the framework, and establishes the three-framework integration pipeline: OWASP
    (risk category) → MITRE ATLAS (attacker techniques) → NIST AI RMF (risk management process) →
    detection engineering (Part 3).
  key_takeaways:
    style: ordered
    items:
      - >
        OWASP LLM Top 10 is the industry lingua franca for LLM security risk — the standard
        reference for risk registers, compliance questionnaires, vendor assessments, and board
        reporting. Fluency is professionally mandatory for AI security engineers.
      - >
        The ranking methodology combines prevalence, exploitability, and impact. Rankings reflect
        the average deployment, not yours. Always re-rank for your specific context — a healthcare
        AI with fine-tuned patient data may rank LLM06 above LLM01.
      - >
        Four OWASP LLM Top 10 risks have direct web security analogues (LLM01 ↔ A03 Injection, LLM02
        ↔ A03 XSS, LLM04 ↔ DoS, LLM05 ↔ A06 Components). Four are genuinely novel with no web
        equivalent (LLM07, LLM08, LLM09, LLM10). Understanding which is which prevents
        misapplication of web security thinking.
      - >
        OWASP LLM Top 10 is a risk classification framework, not a detection engineering
        specification. It tells you what to communicate and what to prioritise. MITRE ATLAS tells
        you what attacker behaviour to detect. NIST AI RMF tells you how to run the risk management
        process. Use all three.
      - >
        OWASP LLM Top 10 has six significant limitations: static taxonomy in a fast-moving field,
        conflated exploitability and impact in ranking, prevention focus rather than detection
        focus, limited evidence base, coarse category granularity, and gaps in agentic and
        multimodal coverage. Know the limitations to use the framework correctly.
      - >
        OWASP has achieved regulatory integration: EU AI Act Article 15 and Article 9, NIST AI RMF
        Playbook, SOC 2 CC9, and HIPAA Security Rule all align with or reference OWASP LLM Top 10
        categories. Framing your security programme in OWASP terms connects security investment to
        compliance requirements.
      - >
        The OWASP LLM Top 10 contribution process is public and open. Track the GitHub repository
        for upcoming category changes. Build to MITRE ATLAS technique granularity rather than just
        OWASP category coverage — ATLAS tracks emerging techniques faster and provides the precision
        needed for detection rule development.
      - >
        The three-framework integration pipeline is: OWASP (identify the risk category) → MITRE
        ATLAS (identify the techniques) → NIST AI RMF (manage the risk) → Chapter 11-15 (build the
        detection). Each framework answers a different question; none answers all of them alone.
