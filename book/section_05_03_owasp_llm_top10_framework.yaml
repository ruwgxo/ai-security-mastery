prose_content:
  - number: '5.3.1'
    heading: 'What OWASP Is and Why It Matters for AI Security'
    id: subsection_01
    blocks:
      - type: prose
        text: >
          The Open Worldwide Application Security Project (OWASP) is a non-profit foundation whose
          mission is to improve software security through open-source projects, community-driven
          research, and freely available educational resources. Security professionals know OWASP
          primarily through its flagship output: the OWASP Top 10 Web Application Security Risks,
          first published in 2003 and updated periodically. That document became the de facto
          standard for web application risk communication — the shorthand that security teams,
          developers, and compliance officers worldwide use to discuss common threats.
      - type: prose
        text: >
          When LLMs began entering enterprise deployments at scale in 2023, the security community
          needed an equivalent reference. The OWASP LLM Top 10 project was initiated in response: a
          community-driven effort to catalogue, rank, and standardise the most significant security
          risks specific to LLM applications.
      - type: fields
        subject: 'Why Owasp Matters for Ai Security'
        id: why_owasp_matters_for_ai_security
        entries:
          - label: 'Lingua Franca Effect'
            value: >
              Security frameworks succeed when they create shared vocabulary. When a security
              engineer says "we have an LLM01 finding," a CISO, a compliance officer, a developer,
              and a procurement manager should all understand what that means without requiring a
              technical briefing. OWASP creates this shared vocabulary. Within two years of
              publication, LLM01 through LLM10 had become the standard reference in security
              assessments, vendor RFPs, compliance questionnaires, and regulatory guidance
              documents.
          - label: 'Risk Register Anchor'
            value: >
              Enterprise risk management runs through risk registers: structured catalogues of
              identified risks with likelihood, impact, owner, and control documentation. Adding
              "OWASP LLM Top 10" as a risk category is immediately legible to GRC teams. Security
              engineers who frame their findings in OWASP terms have an easier path to risk register
              entries, remediation budget, and executive awareness than those who use technically
              precise but organisationally unfamiliar terminology.
          - label: 'Compliance Integration'
            value: >
              Regulatory frameworks reference OWASP. The EU AI Act's technical annex on
              cybersecurity requirements for high-risk AI systems aligns with OWASP LLM Top 10
              categories. The NIST AI Risk Management Framework playbook cites OWASP LLM Top 10 as a
              reference for MEASURE function activities. As of 2026, SOC 2 assessors increasingly
              ask about OWASP LLM Top 10 coverage for clients deploying LLM-powered applications.
              Fluency with OWASP is fluency with the compliance landscape.
          - label: 'Vendor Assessment'
            value: >
              When your organisation evaluates a vendor's LLM product, the procurement questionnaire
              will include OWASP LLM Top 10 coverage questions. When you assess a third-party LLM
              integration, OWASP provides the assessment structure. When you write a bug bounty
              programme for your LLM deployment, OWASP categories define the scope. OWASP is the
              assessment framework.
      - type: fields
        subject: 'What OWASP Is and Why It Matters for AI Security'
        entries:
          - label: 'What Owasp Is Not'
            value: >
              OWASP LLM Top 10 is a risk classification and communication framework, not a technical
              specification or a control catalogue. It tells you what the ten most significant risk
              categories are and why they matter. It does not tell you exactly how to detect LLM01
              in your specific deployment, or which detection rule to write, or how to tune your
              classifier. That is the role of MITRE ATLAS (attack techniques), NIST AI RMF (risk
              management process), and this book's Part 3 (detection engineering).

              Think of OWASP LLM Top 10 as the map legend — it defines the symbols. The detailed
              terrain is filled in by the other frameworks and by your own detection engineering
              work.
  - number: '5.3.2'
    heading: 'Origin and Versioning History: From v1.0 to the Living Document'
    id: subsection_02
    parts:
      - heading: 'Version History'
        id: version_history
        blocks:
          - type: fields
            subject: 'V1 0 2023 05'
            id: v1_0_2023_05
            entries:
              - label: Released
                value: 'May 2023'
              - label: Context
                value: >
                  ChatGPT had launched publicly in November 2022 and reached 100 million users in
                  two months — the fastest consumer product adoption in history. Enterprises began
                  deploying LLM applications at pace. The security community, watching prompt
                  injection attacks, data extraction incidents, and jailbreaks go largely
                  undocumented, organised an OWASP working group in early 2023.
              - label: Methodology
                value: >
                  The v1.0 working group used a modified Delphi method: security researchers,
                  practitioners, and red teamers contributed candidate risk items, which were ranked
                  by a combination of expert vote, observed exploitation frequency, and potential
                  impact. The v1.0 list was produced in approximately 90 days from working group
                  formation to publication.
              - label: 'Notable Characteristics'
                value: >
                  v1.0 was intentionally broad — capturing the landscape rather than optimising for
                  precision. Several categories overlapped (prompt injection and insecure plugin
                  design share a root cause). The speed of production meant some items lacked the
                  depth of evidence behind the traditional OWASP Web Top 10 (which has decades of
                  CVE data behind it).
        parts:
          - heading: 'V1 1 2023 10'
            id: v1_1_2023_10
            blocks:
              - type: fields
                subject: 'V1 1 2023 10'
                entries:
                  - label: Released
                    value: 'October 2023'
            parts:
              - heading: 'Changes From V1 0'
                id: changes_from_v1_0
                blocks:
                  - type: list
                    style: bullet
                    items:
                      - 'Refined descriptions and attack scenario examples for all ten risks'
                      - 'Added clearer distinction between LLM01 (Prompt Injection) and LLM07 (Insecure Plugin Design) — v1.0 language had created confusion about scope'
                      - 'Expanded prevention guidance with concrete technical controls'
                      - 'Added MITRE ATLAS cross-references for the first time'
                      - 'Clarified LLM09 (Overreliance) to distinguish from hallucination as a pure accuracy problem vs hallucination as an exploitable security issue'
              - heading: Significance
                id: significance
                blocks:
                  - type: fields
                    subject: Significance
                    entries:
                      - label: Significance
                        value: >
                          v1.1 achieved broad enterprise adoption through 2024, and this book's
                          numbering (LLM01 to LLM10 in Sections 5.4 to 5.6 and the chapters that
                          follow) is the v1.1 numbering. It has since been superseded by the 2025
                          edition below; use the crosswalk to translate.
          - heading: 'V2025 2024 11'
            id: v2025_2024_11
            blocks:
              - type: fields
                subject: 'V2025 2024 11'
                entries:
                  - label: Released
                    value: 'November 2024 (published as the 2025 edition)'
            parts:
              - heading: List
                id: list
                blocks:
                  - type: prose
                    text: >
                      LLM01:2025 Prompt Injection LLM02:2025 Sensitive Information Disclosure
                      LLM03:2025 Supply Chain LLM04:2025 Data and Model Poisoning LLM05:2025
                      Improper Output Handling LLM06:2025 Excessive Agency LLM07:2025 System Prompt
                      Leakage LLM08:2025 Vector and Embedding Weaknesses LLM09:2025 Misinformation
                      LLM10:2025 Unbounded Consumption
              - heading: 'Crosswalk From V1 1'
                id: crosswalk_from_v1_1
                blocks:
                  - type: code
                    lang: text
                    text: |
                      v1.1 LLM01 Prompt Injection           -> 2025 LLM01 Prompt Injection
                      v1.1 LLM02 Insecure Output Handling   -> 2025 LLM05 Improper Output Handling
                      v1.1 LLM03 Training Data Poisoning    -> 2025 LLM04 Data and Model Poisoning
                      v1.1 LLM04 Model Denial of Service    -> 2025 LLM10 Unbounded Consumption
                      v1.1 LLM05 Supply Chain Vulnerabilities -> 2025 LLM03 Supply Chain
                      v1.1 LLM06 Sensitive Information Disclosure -> 2025 LLM02 Sensitive Information Disclosure
                      v1.1 LLM07 Insecure Plugin Design     -> no direct successor; covered mainly by
                                                               2025 LLM06 Excessive Agency and LLM05
                      v1.1 LLM08 Excessive Agency           -> 2025 LLM06 Excessive Agency
                      v1.1 LLM09 Overreliance               -> 2025 LLM09 Misinformation
                      v1.1 LLM10 Model Theft                -> 2025 LLM10 Unbounded Consumption
                                                               (model extraction is one of its risks)
                      New in 2025: LLM07 System Prompt Leakage, LLM08 Vector and Embedding Weaknesses.
              - heading: Significance
                id: significance
                blocks:
                  - type: fields
                    subject: Significance
                    entries:
                      - label: Significance
                        value: >
                          The 2025 edition is the current version for assessments and
                          questionnaires. It reflects the risks this section lists as under
                          discussion after v1.1: agentic action (LLM06), retrieval and vector stores
                          (LLM08), system prompt exposure (LLM07) and resource abuse (LLM10). When
                          mapping a v1.1 reference in this book to current reporting, translate it
                          with the crosswalk above.
          - heading: 'Ongoing Evolution'
            id: ongoing_evolution
            blocks:
              - type: fields
                subject: 'Ongoing Evolution'
                entries:
                  - label: 'Current Status'
                    value: >
                      The OWASP LLM Top 10 is maintained as a living document. The working group
                      continues to track new attack patterns and update category definitions,
                      including a separate effort on agentic AI threats.
                  - label: 'How to Track'
                    value: >
                      The authoritative source is
                      https://owasp.org/www-project-top-10-for-large-language-model-applications/.
                      The GitHub repository
                      (owasp/www-project-top-10-for-large-language-model-applications) contains
                      in-progress revisions and community discussion. Security engineers building
                      long-term AI security programmes should subscribe to repository notifications.
      - heading: 'Comparison to Web Top 10 Maturity'
        id: comparison_to_web_top_10_maturity
        blocks:
          - type: prose
            text: >
              The traditional OWASP Web Top 10 has the benefit of twenty-plus years of CVE data,
              penetration testing results, and bug bounty reports. Its rankings reflect the
              statistical frequency of vulnerabilities observed across millions of tested
              applications. The OWASP LLM Top 10 was produced in a field that is two years old at
              most. Its rankings reflect expert consensus about prevalence and impact —
              well-informed, but not statistically grounded in the same way.
          - type: prose
            text: >
              This means two things for practitioners:
          - type: list
            style: ordered
            items:
              - 'The OWASP LLM Top 10 rankings will shift more than the Web Top 10 as the field matures and as more incident data accumulates.'
              - 'The absence of a category from the Top 10 is less meaningful than in the Web Top 10 — the list is not yet exhaustive of all significant risks.'
  - number: '5.3.3'
    heading: 'Ranking Methodology: How OWASP Scores LLM Risks'
    id: subsection_03
    blocks:
      - type: prose
        text: >
          Understanding how OWASP ranks risks is essential for two reasons: it lets you interpret
          the list correctly (high rank ≠ highest theoretical severity), and it lets you challenge
          or adapt the rankings intelligently for your specific deployment context.
    parts:
      - heading: 'Three Ranking Dimensions'
        id: three_ranking_dimensions
        parts:
          - heading: Prevalence
            id: prevalence
            blocks:
              - type: fields
                subject: Prevalence
                entries:
                  - label: Definition
                    value: 'How commonly is this risk observed in real-world LLM deployments?'
            parts:
              - heading: 'Data Sources'
                id: data_sources
                blocks:
                  - type: list
                    style: bullet
                    items:
                      - 'Bug bounty reports against LLM-powered products'
                      - 'Security researcher disclosures and CVE-adjacent findings'
                      - 'Red team engagement findings shared by working group members'
                      - 'Publicly documented incidents (Bing Chat, GPT-4, Claude, Bard)'
              - heading: Caveat
                id: caveat
                blocks:
                  - type: fields
                    subject: Caveat
                    entries:
                      - label: Caveat
                        value: >
                          Prevalence data for LLM risks is sparse compared to web application risks.
                          Many LLM security incidents are not publicly disclosed (vendor NDA,
                          reputational concern, absence of CVE equivalent for AI flaws). The
                          prevalence ranking reflects observed-and-reported incidents, which likely
                          undercount actual frequency.
          - heading: Exploitability
            id: exploitability
            blocks:
              - type: fields
                subject: Exploitability
                entries:
                  - label: Definition
                    value: 'How easily can an adversary exploit this risk with available tools?'
            parts:
              - heading: 'Scoring Factors'
                id: scoring_factors
                blocks:
                  - type: list
                    style: bullet
                    items:
                      - 'Access required (API access only = high exploitability; training infrastructure access = low exploitability)'
                      - 'Technical skill required'
                      - 'Availability of public tooling and documented techniques'
                      - 'Time to first exploit (days vs months)'
              - heading: Example
                id: example
                blocks:
                  - type: fields
                    subject: Example
                    entries:
                      - label: Example
                        value: >
                          LLM01 (Prompt Injection) ranks high on exploitability: any user with API
                          access can attempt prompt injection with zero specialised tooling. LLM03
                          (Training Data Poisoning) ranks low on exploitability: the adversary needs
                          access to training infrastructure or a poisoning pathway into the data
                          pipeline.
          - heading: Impact
            id: impact
            blocks:
              - type: fields
                subject: Impact
                entries:
                  - label: Definition
                    value: 'What is the potential damage if this risk is successfully exploited?'
            parts:
              - heading: 'Scoring Factors'
                id: scoring_factors
                blocks:
                  - type: list
                    style: bullet
                    items:
                      - 'Confidentiality: sensitive data exposure'
                      - 'Integrity: model behaviour corruption, misinformation generation'
                      - 'Availability: service disruption'
                      - 'Financial: cost attack, IP theft'
                      - 'Legal/regulatory: compliance violation, liability'
                      - 'Reputational: brand damage from harmful model outputs'
              - heading: Example
                id: example
                blocks:
                  - type: fields
                    subject: Example
                    entries:
                      - label: Example
                        value: >
                          LLM10 (Model Theft) scores high on financial and IP impact — a proprietary
                          model represents millions in training compute — but lower on immediate
                          confidentiality and availability impact. LLM06 (Sensitive Information
                          Disclosure) scores high on regulatory and confidentiality impact,
                          potentially triggering GDPR breach notification requirements.
      - heading: 'How Rankings Should Be Interpreted'
        id: how_rankings_should_be_interpreted
        blocks:
          - type: fields
            subject: 'How Rankings Should Be Interpreted'
            entries:
              - label: 'Rank Reflects the Average Deployment Not Yours'
                value: >
                  OWASP rankings reflect the average enterprise LLM deployment. Your deployment may
                  have a fundamentally different risk profile. An LLM deployed in an air-gapped
                  environment with no external API access has a very different LLM04 (Model DoS)
                  risk than a public-facing ChatGPT competitor. An LLM with no fine-tuning on
                  proprietary data has a very different LLM06 (Sensitive Information Disclosure)
                  profile than one fine-tuned on customer records.

                  The correct use of OWASP is as a starting checklist — not as a pre-prioritised
                  risk register. You must apply your own likelihood assessment based on your
                  deployment context.
              - label: 'High Rank Does Not Mean Highest Impact for You'
                value: >
                  LLM01 (Prompt Injection) ranks first because it is nearly universally applicable,
                  highly exploitable, and easy to demonstrate. But for a healthcare organisation
                  that fine-tuned an LLM on patient data, LLM06 (Sensitive Information Disclosure)
                  may represent a higher business impact even though it ranks sixth — because the
                  regulatory consequences of a HIPAA violation from training data extraction are
                  existential, while a successful prompt injection may produce embarrassing but
                  non-critical output.
              - label: 'Use As a Communication Shorthand Not a Technical Specification'
                value: >
                  When you tell a CISO "we have an LLM01 exposure," you have communicated the risk
                  category in a term they can look up, connect to regulatory frameworks, and include
                  in risk register reporting. You have not communicated the detection approach, the
                  technical severity, or the remediation cost. OWASP starts the conversation; your
                  technical analysis finishes it.
  - number: '5.3.4'
    heading: 'LLM01 Through LLM10: The Full List at a Glance'
    id: subsection_04
    blocks:
      - type: prose
        text: >
          This subsection provides a concise reference for all ten risks with their attack surface
          layer mapping from Section 5.2, their primary impact category, and their chapter coverage
          in this book. Sections 5.4, 5.5, and 5.6 provide the full technical treatment of each
          risk.
      - type: fields
        subject: 'Llm01 Prompt Injection'
        id: llm01_prompt_injection
        entries:
          - label: Rank
            value: '1'
          - label: Name
            value: 'Prompt Injection'
          - label: 'One Line'
            value: >
              Adversary manipulates LLM behaviour through crafted inputs that override intended
              instructions
          - label: Variants
            value: >
              Direct (user input overrides system prompt) / Indirect (injected via retrieved
              documents, tool outputs, external data)
          - label: 'Attack Surface Layers'
            value:
              - '2'
              - '7'
          - label: 'Primary Impact'
            value: 'Integrity — model behaviour hijacked for adversary''s intent'
          - label: 'Secondary Impact'
            value: 'Confidentiality — system prompt extraction, data leakage'
          - label: Exploitability
            value: 'Very High — API access only, no specialised tooling'
          - label: Prevalence
            value: 'Very High — documented in almost every production LLM deployment tested'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 6 — Prompt Injection Attacks'
          - label: 'Section Deep Dive'
            value: 'Section 5.4'
      - type: fields
        subject: 'Llm02 Insecure Output Handling'
        id: llm02_insecure_output_handling
        entries:
          - label: Rank
            value: '2'
          - label: Name
            value: 'Insecure Output Handling'
          - label: 'One Line'
            value: 'Downstream components consume LLM output without validation, inheriting injection risks'
          - label: Variants
            value: >
              XSS via rendered LLM HTML / Command injection via executed LLM shell output / SSRF via
              LLM-generated URLs
          - label: 'Attack Surface Layers'
            value:
              - '8'
          - label: 'Primary Impact'
            value: 'Integrity — downstream system compromise through LLM as proxy'
          - label: 'Secondary Impact'
            value: 'Confidentiality — data exfiltration through compromised downstream system'
          - label: Exploitability
            value: 'High — exploits downstream application bugs, not the LLM itself'
          - label: Prevalence
            value: 'High — most LLM applications render output without sanitisation'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 15 — Building Production Detectors (output-side detection)'
          - label: 'Section Deep Dive'
            value: 'Section 5.4'
      - type: fields
        subject: 'Llm03 Training Data Poisoning'
        id: llm03_training_data_poisoning
        entries:
          - label: Rank
            value: '3'
          - label: Name
            value: 'Training Data Poisoning'
          - label: 'One Line'
            value: >
              Adversary contaminates training data to implant backdoors or alter model behaviour at
              inference time
          - label: Variants
            value: 'Label flipping / Backdoor trigger insertion / Preference data manipulation'
          - label: 'Attack Surface Layers'
            value:
              - '1'
              - '3'
          - label: 'Primary Impact'
            value: 'Integrity — model learns adversary-specified behaviour'
          - label: 'Secondary Impact'
            value: 'Availability — degraded model performance on targeted inputs'
          - label: Exploitability
            value: 'Low — requires access to training pipeline or data sources'
          - label: Prevalence
            value: 'Medium — hard to measure; many incidents go undetected'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 8 — Training Data Poisoning'
          - label: 'Section Deep Dive'
            value: 'Section 5.4'
      - type: fields
        subject: 'Llm04 Model Denial of Service'
        id: llm04_model_denial_of_service
        entries:
          - label: Rank
            value: '4'
          - label: Name
            value: 'Model Denial of Service'
          - label: 'One Line'
            value: 'Adversary crafts inputs that exhaust LLM compute or memory, degrading availability'
          - label: Variants
            value: >
              Context flooding / Recursive prompt loops / Sponge examples / Cost attacks via token
              budget exhaustion
          - label: 'Attack Surface Layers'
            value:
              - '5'
              - '6'
          - label: 'Primary Impact'
            value: 'Availability — service degradation or outage'
          - label: 'Secondary Impact'
            value: 'Financial — token cost attack against billing budget'
          - label: Exploitability
            value: 'High — API access only, low sophistication required'
          - label: Prevalence
            value: 'Medium — more common than reported due to billing rather than security framing'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 14 — Production Deployment (rate limiting and resource controls)'
          - label: 'Section Deep Dive'
            value: 'Section 5.5'
      - type: fields
        subject: 'Llm05 Supply Chain Vulnerabilities'
        id: llm05_supply_chain_vulnerabilities
        entries:
          - label: Rank
            value: '5'
          - label: Name
            value: 'Supply Chain Vulnerabilities'
          - label: 'One Line'
            value: 'Adversary compromises model artefacts, training data, or ML dependencies before deployment'
          - label: Variants
            value: >
              Malicious HuggingFace models / Pickle deserialisation RCE / Poisoned LoRA adapters /
              Compromised ML framework dependencies
          - label: 'Attack Surface Layers'
            value:
              - '1'
              - '4'
          - label: 'Primary Impact'
            value: 'Integrity — backdoored model deployed as trusted artefact'
          - label: 'Secondary Impact'
            value: 'Confidentiality — RCE on model-loading infrastructure'
          - label: Exploitability
            value: 'Medium — requires positioning in supply chain or repository'
          - label: Prevalence
            value: 'Medium — growing rapidly as of 2026 as model hub ecosystems expand'
          - label: 'Chapter Deep Dive'
            value: 'Section 5.9 — AI Supply Chain Security'
          - label: 'Section Deep Dive'
            value: 'Section 5.5'
      - type: fields
        subject: 'Llm06 Sensitive Information Disclosure'
        id: llm06_sensitive_information_disclosure
        entries:
          - label: Rank
            value: '6'
          - label: Name
            value: 'Sensitive Information Disclosure'
          - label: 'One Line'
            value: 'LLM reveals confidential data from training set, context window, or fine-tuning corpus'
          - label: Variants
            value: >
              Verbatim training data recall / System prompt extraction / RAG-retrieved document
              leakage / PII in model outputs
          - label: 'Attack Surface Layers'
            value:
              - '5'
              - '8'
          - label: 'Primary Impact'
            value: 'Confidentiality — private data exposed to unauthorised parties'
          - label: 'Secondary Impact'
            value: 'Legal/Regulatory — GDPR, HIPAA, CCPA breach obligations triggered'
