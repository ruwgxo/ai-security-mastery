              Unlogged autonomous decisions
          - label: 'Attack Surface Layers'
            value:
              - '7'
          - label: 'Primary Impact'
            value: 'Integrity — unintended or adversary-directed real-world actions'
          - label: 'Secondary Impact'
            value: 'Availability — irreversible state changes (data deletion, email sent)'
          - label: Exploitability
            value: 'Medium-High — requires agentic deployment with action capabilities'
          - label: Prevalence
            value: 'High — default in most agentic frameworks is maximum permissions'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 14 — Production Deployment (agency control architecture)'
          - label: 'Section Deep Dive'
            value: 'Section 5.6'
      - type: fields
        subject: 'Llm09 Overreliance'
        id: llm09_overreliance
        entries:
          - label: Rank
            value: '9'
          - label: Name
            value: Overreliance
          - label: 'One Line'
            value: >
              System or human decisions based on LLM output without appropriate validation, creating
              exploitable trust
          - label: Variants
            value: >
              Hallucination exploitation / Confident misinformation / Authority-spoof outputs /
              Automated pipeline propagation of wrong information
          - label: 'Attack Surface Layers'
            value:
              - '8'
          - label: 'Primary Impact'
            value: 'Integrity — incorrect decisions based on adversarially confident LLM outputs'
          - label: 'Secondary Impact'
            value: 'Legal — liability from autonomous decisions based on LLM errors'
          - label: Exploitability
            value: 'Medium — requires understanding of LLM tendency to confabulate with confidence'
          - label: Prevalence
            value: 'Very High — every deployment that uses LLM output without validation is exposed'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 17 — Monitoring and Tuning (factual grounding and output validation)'
          - label: 'Section Deep Dive'
            value: 'Section 5.6'
      - type: fields
        subject: 'Llm10 Model Theft'
        id: llm10_model_theft
        entries:
          - label: Rank
            value: '10'
          - label: Name
            value: 'Model Theft'
          - label: 'One Line'
            value: >
              Adversary extracts a functional copy of a proprietary model through API queries or
              direct weight exfiltration
          - label: Variants
            value: >
              Query-based model extraction / Distillation attack / Direct weight exfiltration /
              Architecture inference
          - label: 'Attack Surface Layers'
            value:
              - '4'
              - '5'
              - '6'
          - label: 'Primary Impact'
            value: 'Financial — proprietary model IP stolen, competitive advantage lost'
          - label: 'Secondary Impact'
            value: 'Security — extracted model enables offline adversarial attack development'
          - label: Exploitability
            value: >
              Medium — API extraction requires skill and query budget; weight exfiltration requires
              access
          - label: Prevalence
            value: 'Medium — growing as of 2026 as proprietary fine-tuned models become commercially valuable'
          - label: 'Chapter Deep Dive'
            value: 'Chapter 9 — Model Extraction and Stealing'
          - label: 'Section Deep Dive'
            value: 'Section 5.6'
  - number: '5.3.5'
    heading: 'Mapping OWASP LLM Top 10 to the Traditional Web Top 10'
    id: subsection_05
    blocks:
      - type: prose
        text: >
          Security engineers familiar with the OWASP Web Application Top 10 will recognise
          structural similarities in the LLM Top 10. Some LLM risks are direct analogues of web
          risks applied to a new attack surface. Others are genuinely novel — they have no web
          equivalent because they exploit properties unique to probabilistic, data-trained systems.
      - type: prose
        text: >
          Understanding this mapping helps in two ways: it lets you leverage existing mental models
          where they apply, and it flags where you must genuinely start from scratch.
    parts:
      - heading: 'Direct Analogues'
        id: direct_analogues
        blocks:
          - type: fields
            subject: 'Llm01 Prompt Injection vs A03 Injection'
            id: llm01_prompt_injection_vs_a03_injection
            entries:
              - label: 'Web Risk'
                value: 'A03:2021 — Injection (SQL, OS, LDAP injection)'
              - label: 'Llm Risk'
                value: 'LLM01 — Prompt Injection'
              - label: 'What Is the Same'
                value: >
                  The fundamental mechanism is identical: untrusted data is interpreted as
                  instruction. In SQL injection, user input is concatenated into a SQL query and
                  executed as SQL. In prompt injection, user input is concatenated into a prompt and
                  executed as model instruction. In both cases, the system cannot distinguish data
                  from instruction because they are represented in the same medium.
              - label: 'What Is Different'
                value: >
                  SQL injection has a reliable mitigation: parameterised queries that physically
                  separate data from instruction at the parser level. Prompt injection has no
                  equivalent mitigation — language models inherently process data and instructions
                  as the same token stream. There is no 'parameterised prompt' that makes the model
                  structurally unable to treat user input as instruction. This makes LLM01
                  fundamentally harder to prevent than A03.
          - type: fields
            subject: 'Llm02 Insecure Output vs A03 and A07'
            id: llm02_insecure_output_vs_a03_and_a07
            entries:
              - label: 'Web Risk'
                value: 'A03:2021 — Injection (XSS) / A07:2021 — Identification Failures'
              - label: 'Llm Risk'
                value: 'LLM02 — Insecure Output Handling'
              - label: 'What Is the Same'
                value: >
                  LLM output rendered in a browser without sanitisation is exactly XSS — the
                  injection vector is the LLM rather than a user-controlled form field, but the
                  exploit mechanism and impact are identical.
              - label: 'What Is Different'
                value: >
                  The LLM introduces a layer of indirection. The human-readable LLM output may look
                  safe to a reviewer while containing injected payloads designed to be processed by
                  the rendering engine or downstream system. The output is both a finished product
                  (for the user) and a potential attack payload (for the downstream system)
                  simultaneously.
          - type: fields
            subject: 'Llm04 Model Dos vs A05'
            id: llm04_model_dos_vs_a05
            entries:
              - label: 'Web Risk'
                value: 'A05:2021 — Security Misconfiguration (including resource exhaustion)'
              - label: 'Llm Risk'
                value: 'LLM04 — Model Denial of Service'
              - label: 'What Is the Same'
                value: >
                  Resource exhaustion through crafted inputs is a classic pattern. HTTP request
                  flooding, slowloris attacks, and XML billion laughs all exploit the same
                  principle: consume disproportionate server resources per unit of attacker effort.
              - label: 'What Is Different'
                value: >
                  Token-based billing means LLM DoS has a financial dimension with no web
                  equivalent. A successful DoS against a web server consumes the victim's compute. A
                  successful cost attack against an LLM API consumes the victim's money —
                  irreversibly, since consumed tokens cannot be refunded. Sponge examples also have
                  no web equivalent: there is no web analogue for inputs crafted to maximise neural
                  network activation without triggering obvious abuse patterns.
          - type: fields
            subject: 'Llm05 Supply Chain vs A06'
            id: llm05_supply_chain_vs_a06
            entries:
              - label: 'Web Risk'
                value: 'A06:2021 — Vulnerable and Outdated Components'
              - label: 'Llm Risk'
                value: 'LLM05 — Supply Chain Vulnerabilities'
              - label: 'What Is the Same'
                value: >
                  Both risks concern the security of dependencies — components your application
                  relies on that you did not produce yourself. The supply chain attack pattern
                  (compromise the dependency, propagate to all users of that dependency) is
                  structurally identical.
              - label: 'What Is Different'
                value: >
                  A vulnerable npm package can be patched with a version bump. A backdoored model
                  weight file cannot be patched — the only remediation is to discard the weights and
                  retrain or download from a trusted source. The attack surface is also different:
                  pip install and npm install have ecosystem-wide scanning and known vulnerability
                  databases. Model hubs like HuggingFace have no equivalent scanning infrastructure.
          - type: fields
            subject: 'Llm06 Sensitive Disclosure vs A02'
            id: llm06_sensitive_disclosure_vs_a02
            entries:
              - label: 'Web Risk'
                value: 'A02:2021 — Cryptographic Failures (sensitive data exposure)'
              - label: 'Llm Risk'
                value: 'LLM06 — Sensitive Information Disclosure'
              - label: 'What Is the Same'
                value: >
                  Both risks concern sensitive data being accessible to parties who should not have
                  it. The regulatory and compliance implications are similar: GDPR breach
                  notification, HIPAA incident response, reputational damage.
              - label: 'What Is Different'
                value: >
                  In traditional systems, sensitive data exposure is caused by inadequate encryption
                  or access control — discrete, fixable failures. In LLMs, sensitive data exposure
                  is caused by model memorisation — the model learned to associate certain inputs
                  with sensitive output patterns during training. This is not a configuration error;
                  it is a property of how the model was trained on data it should not have been
                  trained on. The fix is not to encrypt the model's weights — it is to retrain
                  without the sensitive data, implement differential privacy, or add output filters.
      - heading: 'Genuinely Novel Llm Risks'
        id: genuinely_novel_llm_risks
        blocks:
          - type: fields
            subject: 'Llm07 Insecure Plugin Design'
            id: llm07_insecure_plugin_design
            entries:
              - label: 'No Web Equivalent'
                value: >
                  The closest web analogue is CSRF or confused deputy attacks — but LLM plugin
                  exploitation is qualitatively different. In CSRF, the adversary tricks a browser
                  into making a request with the victim's session. In LLM plugin exploitation, the
                  adversary tricks the LLM into calling a plugin with adversary-specified parameters
                  using application-level permissions, as a consequence of processing
                  adversary-controlled text. The attack chain is entirely mediated by the LLM's
                  language understanding.
          - type: fields
            subject: 'Llm08 Excessive Agency'
            id: llm08_excessive_agency
            entries:
              - label: 'No Web Equivalent'
                value: >
                  Traditional web applications execute deterministic code — they do exactly what the
                  code says. LLM agents make autonomous decisions about which actions to take based
                  on probabilistic language processing. The concept of 'excessive agency' has no web
                  equivalent because web applications do not autonomously decide which database to
                  query, which email to send, or which file to delete based on their interpretation
                  of the user's intent. The autonomy is the vulnerability.
          - type: fields
            subject: 'Llm09 Overreliance'
            id: llm09_overreliance
            entries:
              - label: 'No Web Equivalent'
                value: >
                  Traditional software does not confabulate. A SQL query returns the data that is in
                  the database, or it returns an error. An LLM produces fluent, confident-sounding
                  text regardless of whether that text is accurate. The security risk of
                  overreliance — systems and humans making decisions based on authoritative-seeming
                  but incorrect LLM output — is unique to probabilistic generative systems.
          - type: fields
            subject: 'Llm10 Model Theft'
            id: llm10_model_theft
            entries:
              - label: 'Partial Web Equivalent'
                value: >
                  Source code theft has a web equivalent (exposed .git directories, code repository
                  compromise). But model extraction via API query is genuinely novel: by observing
                  outputs, an adversary can reconstruct a functional approximation of a model that
                  has never been accessed directly. There is no web equivalent of inferring a
                  server's source code by making HTTP requests and observing responses.
  - number: '5.3.6'
    heading: 'OWASP as a Risk Communication Tool: Beyond the Checklist'
    id: subsection_06
    blocks:
      - type: prose
        text: >
          The most common misuse of OWASP LLM Top 10 is treating it as a binary checklist: "Does our
          system have LLM01? Yes/No." This misses the framework's primary value, which is as a risk
          communication and prioritisation structure.
    parts:
      - heading: 'Three Correct Uses'
        id: three_correct_uses
        blocks:
          - type: fields
            subject: 'Ciso Briefing'
            id: ciso_briefing
            entries:
              - label: Scenario
                value: >
                  Your CISO has fifteen minutes to understand the LLM security posture before a
                  board audit committee meeting. They need: what are the risks, which are most
                  likely to affect us, what are we doing about it.
              - label: 'Owasp Application'
                value: >
                  Present a heat map of LLM01-LLM10 with your organisation's likelihood and impact
                  assessment for each. Colour-code: red (not controlled, high risk), amber
                  (partially controlled), green (controlled). This gives the CISO a structured,
                  industry-standard view of risk posture in the time available.
              - label: 'What Not to Do'
                value: >
                  Do not present a raw technical list of vulnerabilities. Do not present a single
                  combined risk score without breakdown. The OWASP structure enables the CISO to
                  connect individual risks to controls, compliance requirements, and business impact
                  — which a generic score does not.
          - type: fields
            subject: 'Vendor Security Assessment'
            id: vendor_security_assessment
            entries:
              - label: Scenario
                value: >
                  Your organisation is evaluating two competing LLM-powered products. You need a
                  structured comparison of their security postures.
              - label: 'Owasp Application'
                value: >
                  Issue both vendors an OWASP LLM Top 10 questionnaire. For each risk (LLM01-LLM10),
                  request: documented control, evidence of testing, incident history, and
                  remediation process. The structured response allows direct comparison on identical
                  criteria.
              - label: 'What Not to Do'
                value: >
                  Do not accept "we take security seriously" as a response. Do not accept a generic
                  SOC 2 report that does not address LLM-specific risks. The OWASP framework gives
                  you a basis to demand specific, comparable, LLM-specific evidence.
          - type: fields
            subject: 'Risk Register Entry'
            id: risk_register_entry
            entries:
              - label: Scenario
                value: >
                  Your organisation's GRC team needs to add LLM security risks to the enterprise
                  risk register. Risk register entries require: risk description, likelihood,
                  impact, owner, controls, and residual risk.
              - label: 'Owasp Application'
                value: >
                  Create one risk register entry per applicable OWASP LLM risk. Use OWASP's
                  description as the baseline risk description, then apply your organisation's
                  likelihood and impact assessment methodology. This integrates LLM security risk
                  into existing governance processes using a framework your GRC team can
                  independently validate.
      - heading: 'Risk Register Template Structure'
        id: risk_register_template_structure
        blocks:
          - type: fields
            subject: Fields
            id: fields
            entries:
              - label: 'Risk Id'
                value: 'AI-LLM-[01-10] (e.g. AI-LLM-01)'
              - label: 'Risk Name'
                value: 'OWASP LLM risk name (e.g. Prompt Injection)'
              - label: 'Owasp Reference'
                value: 'OWASP LLM Top 10 v1.1 — LLM01'
              - label: 'Attack Surface Layer'
                value: 'Section 5.2 layer reference (e.g. Layer 2, Layer 7)'
              - label: 'Risk Description'
                value: 'OWASP description + deployment-specific context'
              - label: 'Likelihood Assessment'
                value: 'Low / Medium / High — with rationale based on deployment context'
              - label: 'Impact Assessment'
                value: 'Confidentiality / Integrity / Availability / Financial / Regulatory'
              - label: 'Current Controls'
                value: 'List of implemented mitigations'
              - label: 'Control Effectiveness'
                value: 'Estimated residual risk reduction percentage'
              - label: 'Residual Risk'
                value: 'Post-control likelihood × impact'
              - label: 'Risk Owner'
                value: 'Team or individual accountable for risk treatment'
              - label: 'Review Date'
                value: 'Quarterly review cycle recommended for AI risks'
              - label: 'Mitre Atlas Reference'
                value: 'Corresponding ATLAS technique(s)'
              - label: 'Chapter Reference'
                value: 'Detection engineering coverage in this book'
  - number: '5.3.7'
    heading: 'OWASP LLM Top 10 in Compliance and Regulatory Frameworks'
    id: subsection_07
    blocks:
      - type: prose
        text: >
          The OWASP LLM Top 10 has achieved regulatory relevance within two years of publication.
          Understanding which regulatory frameworks reference OWASP enables you to justify AI
          security programme investment in compliance terms — which often unlocks budget more
          reliably than purely technical arguments.
    parts:
      - heading: 'Eu Ai Act'
        id: eu_ai_act
        blocks:
          - type: fields
            subject: 'Eu Ai Act'
            entries:
              - label: Relevance
                value: 'High — technical annex requirements align with OWASP LLM Top 10'
          - type: fields
            subject: 'Specific Mappings'
            id: specific_mappings
            entries:
              - label: 'Article 15 Accuracy Robustness Cybersecurity'
                value: >
                  Requires high-risk AI systems to be designed with appropriate levels of accuracy,
                  robustness, and cybersecurity. OWASP LLM01 (Prompt Injection), LLM04 (Model DoS),
                  and LLM10 (Model Theft) directly address the cybersecurity dimension of this
                  article.
              - label: 'Article 9 Risk Management'
                value: >
                  Mandates documented risk management processes for high-risk AI. OWASP LLM Top 10
                  provides the risk taxonomy; NIST AI RMF provides the process structure. Using
                  OWASP to populate the risk register satisfies Article 9's requirement for
                  systematic risk identification.
              - label: 'Annex 4 Technical Documentation'
                value: >
                  Technical documentation must include: description of security measures, testing
                  and validation procedures, known limitations. OWASP LLM Top 10 provides the
                  structure for the security measures section.
      - heading: 'Nist Ai Rmf'
        id: nist_ai_rmf
        blocks:
          - type: fields
            subject: 'Nist Ai Rmf'
            entries:
              - label: Relevance
                value: 'High — NIST AI RMF Playbook explicitly references OWASP LLM Top 10'
          - type: fields
            subject: 'Specific Mappings'
            id: specific_mappings
            entries:
              - label: 'Map Function'
                value: >
                  NIST AI RMF MAP function requires identification of AI risks and their context.
                  OWASP LLM Top 10 provides the risk taxonomy for the MAP output.
              - label: 'Measure Function'
                value: >
                  NIST AI RMF MEASURE function requires risk analysis, testing, and evaluation.
                  OWASP LLM Top 10 audit checklist (deliverable from this section) provides the
                  MEASURE function test plan structure.
              - label: 'Manage Function'
                value: >
                  NIST AI RMF MANAGE function requires risk treatment plans. Each OWASP LLM Top 10
                  risk entry in the risk register becomes a MANAGE function treatment plan item.
      - heading: 'Soc 2 Type Ii'
        id: soc_2_type_ii
        blocks:
          - type: fields
            subject: 'Soc 2 Type Ii'
            entries:
              - label: Relevance
                value: 'Medium and growing as of 2026 — auditors increasingly ask about LLM-specific controls'
          - type: fields
            subject: 'Specific Mappings'
            id: specific_mappings
            entries:
              - label: 'Cc6 Logical Access'
                value: >
                  OWASP LLM01 (Prompt Injection) and LLM07 (Insecure Plugin Design) evidence is
                  relevant to CC6 controls around logical access and privilege management in
                  LLM-integrated systems.
              - label: 'Cc7 System Operations'
                value: >
                  OWASP LLM04 (Model DoS) and LLM09 (Overreliance) evidence is relevant to CC7
                  controls around system availability and monitoring.
              - label: 'Cc9 Risk Mitigation'
                value: >
                  OWASP LLM Top 10 risk register entries directly support CC9 risk mitigation
                  evidence requirements.
      - heading: Hipaa
        id: hipaa
        blocks:
          - type: fields
            subject: Hipaa
            entries:
              - label: Relevance
                value: 'High for healthcare AI deployments'
          - type: fields
            subject: 'Specific Mappings'
            id: specific_mappings
            entries:
              - label: 'Phi Exposure'
                value: >
                  OWASP LLM06 (Sensitive Information Disclosure) is the primary HIPAA risk for LLMs
                  trained on or processing protected health information. Any LLM that recalls
                  training data containing PHI is a HIPAA breach.
              - label: 'Security Rule 164 312'
                value: >
                  HIPAA Security Rule §164.312 technical safeguards map to controls against LLM01,
                  LLM06, and LLM07. The OWASP framework provides the AI-specific risk taxonomy the
                  Security Rule lacks.
      - heading: 'Practical Implication'
        id: practical_implication
        blocks:
          - type: fields
            subject: 'Practical Implication'
            entries:
              - label: 'Practical Implication'
                value: >
                  Every enterprise LLM security programme needs a compliance anchor. The OWASP LLM
                  Top 10 is that anchor for AI-specific risks. Build your risk register using OWASP
                  taxonomy, map each entry to the applicable regulatory requirement, and your
                  security programme deliverables become compliance evidence simultaneously. This is
                  how security investment gets sustained through budget cycles — by being legible to
                  compliance and legal teams, not just to security engineers.
  - number: '5.3.8'
    heading: 'Limitations of the OWASP LLM Top 10 Classification'
    id: subsection_08
    blocks:
      - type: prose
        text: >
          Critical engagement with the OWASP LLM Top 10 is as important as fluency with it. A
          framework that is accepted uncritically becomes a ceiling rather than a floor. The
          following limitations should inform how you use and extend the OWASP classification.
      - type: fields
        subject: 'Limitation 01 Static Taxonomy in Fast Moving Field'
        id: limitation_01_static_taxonomy_in_fast_moving_field
        entries:
          - label: Description
            value: >
              The OWASP LLM Top 10 is a point-in-time snapshot of a field evolving monthly. Agentic
              AI deployments, multimodal models, and voice AI interfaces have introduced attack
              surfaces that were nascent when v1.1 was published. The list was not designed for
              systems where the LLM browses the web, controls CI/CD pipelines, or manages calendar
              and email autonomously at scale.
          - label: Implication
            value: >
              Do not treat the absence of a risk from the Top 10 as evidence that the risk does not
              exist. Emerging risks — adversarial audio for voice AI, visual prompt injection in
              multimodal models, agent orchestration attacks in multi-agent systems — require you to
              go beyond the list.
      - type: fields
        subject: 'Limitation 02 Ranking Conflates Exploitability and Impact'
        id: limitation_02_ranking_conflates_exploitability_and_impact
        entries:
          - label: Description
            value: >
              LLM01 (Prompt Injection) ranks first partly because it is highly exploitable (any user
              with API access can attempt it) and partly because it is well-documented. But for many
              deployment contexts, LLM03 (Training Data Poisoning) or LLM06 (Sensitive Information
              Disclosure) represent higher business impact even if they are less exploitable or less
              frequently demonstrated.
          - label: Implication
            value: >
              Always re-rank the OWASP LLM Top 10 for your specific deployment context. The generic
              ranking is a starting point, not a final prioritisation. A healthcare AI fine-tuned on
              patient data should place LLM06 at least equal to LLM01 in its risk register
              regardless of OWASP's ordering.
      - type: fields
        subject: 'Limitation 03 Prevention Focused Not Detection Focused'
        id: limitation_03_prevention_focused_not_detection_focused
        entries:
          - label: Description
            value: >
              The OWASP LLM Top 10 primarily describes prevention controls: don't trust user input,
              validate outputs, use least-privilege plugins. This maps well to developers building
              LLM applications. It maps poorly to security operations engineers building detection
              programmes. The framework does not tell you what logs to collect, what anomalies to
              detect, or how to respond when a risk is exploited.
          - label: Implication
            value: >
              OWASP tells you what to prevent. MITRE ATLAS tells you what attacker behaviour to
              detect. NIST AI RMF tells you how to run the risk management process. You need all
              three frameworks, not just OWASP.
      - type: fields
        subject: 'Limitation 04 Limited Evidence Base'
        id: limitation_04_limited_evidence_base
        entries:
          - label: Description
            value: >
              The traditional OWASP Web Top 10 is backed by statistical analysis of vulnerability
              disclosures across thousands of penetration tests and bug bounty programmes. The OWASP
              LLM Top 10 is backed by expert consensus and a smaller evidence base. The ranking may
              not reflect actual frequency distributions in enterprise deployments — we simply do
              not have enough systematically collected data yet.
          - label: Implication
            value: >
              Treat the OWASP LLM Top 10 ranking as expert opinion, not empirical fact. When your
              own incident data diverges from OWASP's ranking — e.g. if you observe more LLM04 (DoS)
              incidents than LLM01 (Injection) in your environment — your data should take
              precedence over the generic ranking.
      - type: fields
        subject: 'Limitation 05 Coarse Granularity'
        id: limitation_05_coarse_granularity
        entries:
          - label: Description
            value: >
              Each OWASP LLM Top 10 category covers a cluster of related techniques. LLM01 (Prompt
              Injection) includes direct injection, indirect injection, multi-turn injection, and
              multi-modal injection — techniques with different attack prerequisites, different
              detection approaches, and different mitigations. Treating them as a single risk
              category may cause imprecision in detection programme design.
          - label: Implication
            value: >
              Use OWASP for risk communication and compliance mapping. Use MITRE ATLAS at the
              technique level for detection engineering. The ATLAS technique (e.g. AML.T0051 — LLM
              Prompt Injection) is more precise than the OWASP category for the purpose of writing
              detection rules.
      - type: fields
        subject: 'Limitation 06 Agentic and Multimodal Gaps'
        id: limitation_06_agentic_and_multimodal_gaps
        entries:
          - label: Description
            value: >
              v1.1 was authored when most enterprise LLM deployments were completion APIs. The
              explosive growth of agentic frameworks (AutoGPT, LangChain, Crew AI), multimodal
              models (GPT-4V, Claude 3 Vision, Gemini), and voice AI (real-time voice APIs)
              introduced attack surfaces for which the current list provides incomplete coverage.
              LLM07 and LLM08 cover some agentic risk, but multi-agent orchestration attacks, agent
              prompt injection across agent boundaries, and visual prompt injection are not
              adequately addressed.
          - label: Implication
            value: >
              Supplement the OWASP LLM Top 10 with your own category for agentic and
              multimodal-specific risks. Treat these as AI-LLM-11 onwards in your risk register,
              pending inclusion in future OWASP versions.
  - number: '5.3.9'
    heading: 'Framework Interoperability: OWASP + MITRE ATLAS + NIST AI RMF'
    id: subsection_09
    blocks:
      - type: prose
        text: >
          No single framework covers the full AI security lifecycle. OWASP, MITRE ATLAS, and NIST AI
          RMF are complementary — each addresses a different question. A mature AI security
          programme uses all three, with each framework assigned to its appropriate role.
    parts:
      - heading: 'Three Frameworks Three Questions'
        id: three_frameworks_three_questions
        blocks:
          - type: fields
            subject: 'Owasp Llm Top 10'
            id: owasp_llm_top_10
            entries:
              - label: Question
                value: 'What are the significant risk categories?'
              - label: 'Primary Audience'
                value: 'CISOs, GRC teams, compliance officers, developers'
              - label: Output
                value: 'Risk classification taxonomy for communication and compliance mapping'
              - label: 'Primary Use Cases'
                value:
                  - 'Board and executive risk reporting'
                  - 'Vendor security assessments'
                  - 'Risk register population'
                  - 'Compliance questionnaire responses'
                  - 'Bug bounty scope definition'
              - label: 'Does Not Answer'
                value: 'How to detect a specific attack / Which logs to collect / How to write a detection rule'
          - type: fields
            subject: 'Mitre Atlas'
            id: mitre_atlas
            entries:
              - label: Question
                value: 'How do adversaries actually execute these attacks?'
              - label: 'Primary Audience'
                value: 'Detection engineers, red teamers, SOC analysts'
              - label: Output
                value: 'Tactic and technique catalogue for detection and response'
              - label: 'Primary Use Cases'
                value:
                  - 'Detection rule development (each technique = one or more detection rules)'
                  - 'Red team engagement structuring'
                  - 'SOC analyst playbook development'
                  - 'Detection programme coverage measurement'
                  - 'Adversary emulation planning'
              - label: 'Does Not Answer'
                value: 'How to communicate risk to leadership / How to run the risk management process'
          - type: fields
            subject: 'Nist Ai Rmf'
            id: nist_ai_rmf
            entries:
              - label: Question
                value: 'How do we manage AI risk as an organisational process?'
              - label: 'Primary Audience'
                value: 'Risk managers, programme owners, engineering leadership'
              - label: Output
                value: 'Process framework for systematic AI risk governance'
              - label: 'Primary Use Cases'
                value:
                  - 'AI risk governance programme design'
                  - 'Regulatory compliance evidence (EU AI Act, sector regulations)'
                  - 'Organisational accountability structures for AI risk'
                  - 'Risk treatment decision-making process'
              - label: 'Does Not Answer'
                value: 'What the specific risks are / How attackers execute them'
      - heading: 'Integration in Practice'
        id: integration_in_practice
        parts:
          - heading: 'Risk Identification to Detection Pipeline'
            id: risk_identification_to_detection_pipeline
            blocks:
              - type: prose
                text: >
                  The three frameworks form a natural pipeline:
              - type: code
                lang: text
                text: |
                  STEP 1 — OWASP (What is the risk?):
                    Identify applicable LLM risks from OWASP LLM Top 10.
                    Example: "LLM01 Prompt Injection is applicable to our RAG deployment."

                  STEP 2 — MITRE ATLAS (How is it executed?):
                    Map each OWASP risk to the ATLAS techniques that represent its
                    execution variants.
                    Example: "LLM01 maps to ATLAS AML.T0051 (LLM Prompt Injection),
                    which includes direct injection (via user input) and indirect injection
                    (via retrieved documents)."

                  STEP 3 — NIST AI RMF (How do we manage it?):
                    Assign the risk to the appropriate NIST AI RMF function (MAP for
                    identification, MEASURE for evaluation, MANAGE for treatment).
                    Example: "This risk is captured in MAP, evaluated via our adversarial
                    test suite in MEASURE, and treated with input validation and output
                    monitoring controls documented in MANAGE."

                  STEP 4 — DETECTION (Chapter 11-15):
                    For each ATLAS technique, write the detection logic, identify the
                    required data sources, and build the detection rule.
                    Example: "AML.T0051 indirect injection detected by scanning RAG-retrieved
                    document content for injection pattern indicators before context assembly."
          - heading: 'Coverage Gap Analysis'
            id: coverage_gap_analysis
            blocks:
              - type: prose
                text: >
                  A mature AI security programme measures its ATLAS technique coverage: what
                  percentage of relevant ATLAS techniques has at least one detection rule in
                  production? The OWASP LLM Top 10 provides the risk categories to prioritise. ATLAS
                  provides the technique granularity to measure. NIST AI RMF provides the governance
                  process to sustain the programme.
              - type: fields
                subject: 'Coverage Score Calculation'
                id: coverage_score_calculation
                entries:
                  - label: Numerator
                    value: 'Number of ATLAS techniques with at least one deployed detection rule'
                  - label: Denominator
                    value: 'Total number of ATLAS techniques assessed as applicable to deployment'
                  - label: Target
                    value: '>= 70% for mature detection programme; 100% is not achievable or necessary'
      - heading: 'Owasp to Atlas Cross Reference'
        id: owasp_to_atlas_cross_reference
        blocks:
          - type: fields
            subject: Llm01
            id: llm01
            entries:
              - label: 'Atlas Techniques'
