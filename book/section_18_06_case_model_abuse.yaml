prose_content:
  part_1:
    title: 'The Scenario: Abuse in the Aggregate'
    body: |-
      The scenario is a composite e-commerce deployment -- a consumer-facing assistant, a shopping or customer-service bot exposed to the general public. This exposure is what draws the specific threat the case examines: coordinated, distributed abuse. A public consumer service is not primarily attacked by lone individuals making obviously malicious requests; it is attacked by networks -- automated bot fleets and Sybil accounts, many identities under one controlling hand -- that abuse the service at scale while spreading their activity thin enough that no single identity looks abusive. This is the defining feature of model abuse as distinct from the earlier attack classes: the abuse does not live in a request or even in an entity, it lives in the aggregate, in the sum of activity across many requests and many entities, and it is engineered specifically to be invisible at any smaller scale.

      This completes an arc the case studies have been travelling. The injection case was mostly about the request, with a campaign dimension. The jailbreak case moved to the session, where the attack lived in the trajectory across turns. This case moves to the network, where the attack lives across entities. At each step the unit of the attack has grown larger and the per-request view has grown less sufficient, and here it reaches the point where per-request detection is almost irrelevant -- every individual request in a coordinated abuse campaign can be a perfectly legitimate-looking query, and every individual account can stay below every per-entity threshold, and the abuse is still real and still damaging. The only place it is visible is the aggregate, and the only thing that can catch it is aggregate detection: the rate-based, coverage, and graph families of Chapter 13. The case is their validation, and it is the chapter's furthest demonstration that the strength of the layered system is in catching what the smaller scales cannot see.
  part_2:
    title: Exfiltration Through Individually-Benign Queries
    body: |-
      The first form of abuse is exfiltration, and it is the clearest illustration of aggregate-only visibility. An exfiltration campaign aims to extract something valuable from the model or the service -- proprietary data, catalogue information, the model's behaviour itself for cloning -- and it does so through a large number of queries that are each, individually, entirely benign. No single query asks for anything it should not; each is a legitimate lookup or a reasonable question. But the campaign issues thousands of them, systematically, and the sum of the answers is the extracted asset. The abuse is not in any query but in the volume and pattern of querying, which is precisely why per-request detection cannot catch it -- there is nothing wrong with any request to catch. Examining the queries one at a time, a per-request detector correctly finds each acceptable and passes it, and the exfiltration proceeds one benign query at a time.

      Rate-based detection is what catches this, and the case shows it doing so. The rate-based family of Chapter 13 watches the volume and velocity of an entity's activity against its baseline and against what legitimate use looks like: an entity issuing queries at a rate, or in a volume, or with a systematic regularity that no legitimate user exhibits is flagged not for what it asks but for how much and how it asks. The exfiltration campaign's defining signature is the aggregate query pattern -- the volume, the regularity, the coverage of the data space -- and rate-based detection reads that signature where per-request detection reads only individual innocent queries. This is the baseline-and-anomaly discipline of the whole book applied to volume: establish what legitimate query rates and patterns look like, and flag the aggregate behaviour that departs from them, even when every individual request within that behaviour is unremarkable. The exfiltration case makes concrete that some attacks have no per-request signature at all and exist only as a rate.
  part_3:
    title: Enumeration and Coverage Detection
    body: |-
      The second form is enumeration, closely related to exfiltration but with its own signature. An enumeration attack systematically sweeps a space -- probing an ID range to find valid records, walking a catalogue to map it completely, testing a parameter space to chart the service's behaviour. Like exfiltration, each individual query is a legitimate-looking lookup: asking about product 1001, then 1002, then 1003 is, request by request, just a series of ordinary catalogue queries. The abuse is in the systematic coverage -- the fact that the queries walk a space methodically, covering it in a way no genuine user browsing naturally would. Enumeration's signature is not primarily volume, as with exfiltration, but coverage: the completeness and systematicity of the sweep across a structured space.

      Coverage detection is the member of the aggregate family tuned to this signature. Where rate-based detection watches how much an entity queries, coverage detection watches the shape of what it queries -- whether the queries systematically cover a space in the pattern of a sweep rather than the scattered, purpose-driven pattern of legitimate use. A genuine shopper looks at a handful of related products; an enumeration bot walks the entire ID range in order. The coverage signature -- methodical, complete, structured traversal -- is invisible in any single lookup and unmistakable in the aggregate, and coverage detection reads it. The case treats enumeration alongside exfiltration because they share the aggregate-only property and differ mainly in signature: exfiltration is caught by its volume and rate, enumeration by its coverage and systematicity, and both are caught by the aggregate family watching the pattern of querying rather than the content of any query. Together they establish that the aggregate detection reads several distinct signatures, each corresponding to a form of abuse that is legitimate-looking request by request.
  part_4:
    title: Coordinated Networks and Graph Detection
    body: |-
      The third form is the hardest and the case's centrepiece: coordinated abuse across a network of entities. Here the attacker does not just spread activity across many requests but across many accounts -- a Sybil network of fabricated identities or a bot fleet, all under one controlling hand, dividing the abusive activity among them so that each individual account stays below every per-entity threshold. This defeats not only per-request detection but per-entity detection too: the rate-based and coverage families watch individual entities, and a coordinated network is engineered precisely so that no individual entity exhibits an abusive rate or coverage. Split an exfiltration campaign across a hundred accounts and each account's share looks like ordinary use. The abuse has moved up another level, from the aggregate of one entity's activity to the aggregate across entities, and it is invisible even to the entity-level detection that catches exfiltration and enumeration.

      Graph detection is what reaches this level, and it is the case's demonstration of the furthest member of the aggregate family. The graph analysis of Chapter 13 does not watch entities in isolation but the relationships among them -- shared characteristics, correlated timing, coordinated behaviour, the structural signatures of accounts that are acting together rather than independently. A Sybil network, however carefully each account mimics a normal user, betrays itself in the graph: the accounts are too similar, too synchronised, too structurally connected to be the independent individuals they present as. Graph detection catches the coordination that per-entity detection cannot, because coordination is a property of the relationships between entities, not of any entity alone. The case shows a network of individually-clean accounts -- each passing every per-entity check -- being caught as a network by the graph analysis reading their coordination. This is the aggregate principle at its limit: the abuse exists only in the relationships among the entities, and only the layer that analyses those relationships can see it. It is the exact analogue, at the entity-network level, of what the multi-turn analysis did at the session level in the jailbreak case -- catch the attack that exists only in the structure across the units, where each unit is individually innocent.
  part_5:
    title: Response, Lessons, and Architecture Recommendations
    body: |-
      Responding to coordinated abuse means acting on the network, not the account, and the playbook reflects that just as the jailbreak playbook acted on the session rather than the turn. When graph detection identifies a coordinated network, blocking one account is nearly useless -- the network has many, and the controlling hand simply continues through the others. The response must act on the network as a whole: the identified accounts are handled together, the coordination signature is turned into a signal that can catch the network's other and future accounts, and the shared infrastructure or characteristics that link the network are used to expand the response to its full extent. The SIEM integration of Chapter 16 carries the graph detection into operations with the network context -- the accounts, their relationships, the coordination evidence -- so a responder acts against the network as one entity rather than chasing its accounts one at a time. Rate-based and coverage detections of single-entity exfiltration and enumeration are responded to at the entity level, but the coordinated network is responded to at the network level, and matching the response scale to the abuse scale is the playbook's organising principle.

      The model-abuse case completes the chapter's central argument and yields its recommendations. The recommendations centre on the aggregate family: entity-level detection (rate and coverage) is necessary for the abuse that lives in one entity's aggregate behaviour, and graph detection is necessary for the abuse that lives in the coordination across entities, and a defence missing either has a gap that distributed abuse exploits. The deeper lesson, and the one the whole arc of case studies has been building toward, is that as attacks distribute themselves to evade detection -- across requests, across sessions, across entities -- the detection must follow them up the scale, and the aggregate families are what let it. A system with only per-request detection is blind to campaigns; with only per-entity detection, blind to coordination; the full aggregate family is what closes the gaps that distribution opens. The case validates the rate, coverage, and graph families against real coordinated abuse, and it brings the five case studies to their culmination: the layered system's strength is precisely that it detects at every scale, from the single request to the coordinated network, catching at each level what the levels below cannot see. The concluding section draws the lessons of all five cases together and closes the book.
