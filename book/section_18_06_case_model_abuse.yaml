      # Section 18.06 deliverable: Model-Abuse Case Analysis.
      # See the prose and reference tables for the full analysis.
      #
      #   INCIDENT   Composite e-commerce assistant targeted by coordinated, distributed
      #              abuse -- Sybil accounts and bot fleets spreading activity to stay
      #              under every per-entity threshold.
      #   DETECTION  Three forms, each aggregate-only, each caught by a different family:
      #                - exfiltration (many benign queries) -> rate-based detection (Ch13)
      #                - enumeration (systematic sweep)     -> coverage detection (Ch13)
      #                - coordinated network                -> graph detection (Ch13)
      #              Per-request sees only benign queries; per-entity sees only
      #              below-threshold accounts; the abuse lives in the AGGREGATE and,
      #              for the network, in the RELATIONSHIPS among entities.
      #   RESPONSE   Match response scale to abuse scale: entity-level for exfiltration/
      #              enumeration, NETWORK-level for the coordinated network -- act on the
      #              network as one, via the Ch16 integration, not account by account.
      #   LESSONS    As attacks distribute up the scale (request -> session -> entity ->
      #              network), detection must follow; the aggregate family closes the
      #              gaps distribution opens. This completes the layering argument.
      print('Section 18.06: model-abuse case analysis -- see prose and tables.')
    note: Deliverable is a structured case analysis, not code.
  deliverable_2:
    title: Model-Abuse Response Playbook
    filename: (response playbook -- coordinated model abuse)
    description: |-
      The response playbook for model abuse, following the 18.01 template but matching response scale to abuse scale: the trigger (rate, coverage, or graph detection), the scale-matched containment (entity-level for exfiltration/enumeration, network-level for coordinated networks), the enrichment with the network context, the escalation, the recovery, and the review that feeds the coordination signature forward. The playbook that meets abuse living in the aggregate at the scale it lives.
    implementation_notes: |-
      No runnable code: a response playbook in the chapter's deliverable form. It extends the generic template with network-level action for coordinated abuse, depending on the Chapter 13 graph analysis for the detection and the Chapter 16 integration for the network context a responder needs to act on the network as one.
    code: |
      # Section 18.06 deliverable: Model-Abuse Response Playbook.
      #
      #   TRIGGER   Rate-based, coverage, or graph detection fires on aggregate abuse.
      #   CONTAIN   Match scale to the abuse:
      #               - single-entity exfiltration/enumeration -> rate-limit/block the entity
      #               - coordinated network -> act on the WHOLE network at once, not one
      #                 account (blocking one of many leaves the network operating).
      #   ENRICH    Attach the network context -- the member accounts, their
      #             relationships, the coordination evidence -- via the Ch16 integration.
      #   ESCALATE  Present the network as one entity to security operations; use the
      #             shared infrastructure/characteristics to expand the response fully.
      #   RECOVER   Confirm the network is contained; watch for the controlling hand
      #             re-forming the network under new accounts.
      #   REVIEW    Feed the coordination signature forward to catch the network's future
      #             accounts earlier; disposition into the Ch17 tuning loop.
      print('Section 18.06: model-abuse response playbook -- see prose.')
    note: Deliverable is a response playbook, not code.
common_mistakes:
  mistake_1:
    description: Relying on per-request detection against aggregate abuse
    why_it_happens: |-
      Per-request detection works against the earlier attack classes, so it is assumed to cover abuse too.
    consequence: |-
      Exfiltration and enumeration proceed unimpeded, because every individual query in them is legitimate-looking and there is nothing wrong with any single request to catch.
    correct_approach: |-
      Deploy entity-level aggregate detection -- rate-based and coverage -- to catch abuse that lives in the volume and pattern of querying rather than in any individual request.
  mistake_2:
    description: Relying on per-entity detection against coordinated networks
    why_it_happens: |-
      Rate and coverage detection catch single-entity abuse, so they seem to cover distributed abuse as well.
    consequence: |-
      A Sybil or bot network splits its activity so each account stays below every per-entity threshold, so per-entity detection sees only clean accounts and the network operates freely.
    correct_approach: |-
      Deploy graph detection that analyses the relationships among entities, because coordinated abuse lives in the coordination, which is a property of the relationships, not of any entity alone.
  mistake_3:
    description: Responding to a coordinated network by blocking individual accounts
    why_it_happens: |-
      Each detected account is an obvious target, so blocking them one by one feels like progress.
    consequence: |-
      The network has many accounts under one controlling hand, so blocking one leaves the rest operating and the hand simply continues -- and re-forms with new accounts.
    correct_approach: |-
      Act on the network as a whole -- handle the identified accounts together and use the coordination signature to catch the network's other and future accounts -- matching response scale to abuse scale.
  mistake_4:
    description: Treating a network of individually-clean accounts as not a real threat
    why_it_happens: |-
      Every account passes every per-entity check, so the network looks like a set of ordinary users.
    consequence: |-
      A real, damaging coordinated abuse campaign is dismissed because no individual account is abusive, and the aggregate harm accumulates unaddressed.
    correct_approach: |-
      Recognise that coordinated abuse is engineered to be individually invisible, treat the network's coordination as the real signal, and catch it with graph detection.
section_summary:
  compact: |-
    Section 18.06 is the final case study, reaching the furthest point on the arc from per-request to aggregate detection: model abuse distributed across a coordinated network of entities, in an e-commerce context where consumer-facing services attract exactly this distributed, automated abuse. The case completes a progression -- injection lived mostly in the request, jailbreaks in the session trajectory, and abuse lives in the aggregate across entities, engineered specifically to be invisible at every smaller scale. It works three forms, each legitimate-looking request by request and visible only in the sum. Exfiltration extracts an asset through a large number of individually-benign queries, its signature the volume and rate of querying, caught by rate-based detection watching aggregate behaviour against a baseline. Enumeration systematically sweeps a space, its signature the coverage and systematicity of the sweep rather than volume, caught by coverage detection watching the shape of what an entity queries. And coordinated networks -- Sybil accounts and bot fleets under one controlling hand -- split their activity so each account stays below every per-entity threshold, defeating even the entity-level detection that catches exfiltration and enumeration; the abuse lives only in the coordination among the accounts, and only graph detection, analysing the relationships among entities, can read it. This is the exact analogue at the entity-network level of what the multi-turn analysis did at the session level: catch the attack that exists only in the structure across units, where each unit is individually innocent. The response matches scale to abuse -- entity-level for single-entity exfiltration and enumeration, network-level for coordinated networks, because blocking one account of many leaves the network intact. The case completes the chapter's central argument: as attacks distribute up the scale to evade detection, the detection must follow, and the aggregate families are what let the layered system catch at every scale what the levels below cannot see.
  key_takeaways:
  - |-
    Model abuse in e-commerce is coordinated and distributed, engineered to be invisible at every scale below the aggregate
  - |-
    Exfiltration through individually-benign queries is caught by rate-based detection reading the aggregate query pattern
  - |-
    Enumeration sweeps are caught by coverage detection reading the systematicity of the traversal, not its volume
  - |-
    Coordinated Sybil and bot networks defeat per-entity detection and are caught only by graph detection of the relationships
  - |-
    The response matches scale to abuse: network-level action for coordinated networks, because blocking one account leaves the rest
  - |-
    The case completes the layering argument: as attacks distribute up the scale, aggregate detection follows to catch what smaller scales cannot
preview_section_18_07:
  title: Lessons Learned, Best Practices, and Book Conclusion
  summary: |-
    Section 18.07 closes the case studies and the book. It lays the five cases side by side and extracts the best practices and the recurring principles that held across all of them -- layered detection, baseline before anomaly, the state-latency coupling, deployment as a distinct discipline, continuous improvement -- reviews the complete Part 1 to 4 system the cases validated, consolidates the architecture recommendations, and concludes the book, leaving the reader having built a complete production AI-security detection system from ML fundamentals and equipped with the judgment to apply it to an evolving landscape.
