section_overview:
  one_line_summary: |-
    The fifth and final case, a composite: the rate-based, coverage, and graph detection of Chapter 13 against real model abuse in an e-commerce context -- the exfiltration campaign built from individually-benign queries, the enumeration sweep, and the coordinated Sybil and bot networks of individually-clean accounts -- where the abuse exists only in the aggregate and only aggregate detection can catch it, making the entity and graph families the centre of the defence as the multi-turn analysis was for jailbreaks.
  why_this_section_exists: |-
    The case studies have moved steadily from the single request toward the aggregate. Injection was mostly per-request with a campaign dimension; jailbreaks were multi-turn, distributed across a session; and this final case reaches the furthest point on that arc -- abuse distributed not just across a session but across a coordinated network of entities, where no single entity, let alone any single request, is individually detectable. The case exists to validate the entity, rate, and graph detection of Chapter 13 against the abuse that only aggregate analysis can catch, and to complete the chapter's central argument by showing the layer that catches what is invisible at every smaller scale.

    The e-commerce context is chosen because consumer-facing LLM services are the natural target of exactly this coordinated, distributed abuse. A shopping assistant or customer-service bot exposed to the public faces not lone attackers but networks -- Sybil accounts and bot fleets that spread their activity across many identities precisely to stay under any per-entity threshold. The case works three forms of aggregate abuse. Exfiltration: a campaign that extracts data or model behaviour through a large number of individually-benign queries, each innocuous, the extraction visible only in their sum. Enumeration: a systematic sweep -- probing an ID space, a catalogue, a parameter range -- where each query is a legitimate-looking lookup and the abuse is the coverage of the sweep. And coordinated abuse: a network of individually-clean accounts acting together, where every account stays below the threshold that would flag it alone, and the attack is visible only as the coordination among them. Each of these defeats per-request and even per-entity detection by construction, and each is caught by a different member of the Chapter 13 aggregate family -- rate-based, coverage, and graph. As established in 18.01, the abuse and the network are representative composites, not specific proprietary incidents.
  position_in_chapter: |-
    Section 18.06 is the fifth and final case study, completing the arc from per-request to aggregate detection. It exercises the Chapter 13 rate-based, coverage, and graph families against exfiltration, enumeration, and coordinated abuse in an e-commerce context, and produces the model-abuse architecture recommendation and playbook. It is the last case before the concluding synthesis (18.07), and it brings the chapter's layering argument to its furthest point: the aggregate detection that catches what no smaller scale can.
