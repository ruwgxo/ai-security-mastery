              fvs = [extract_features(c) for c in b + a]
              df = pd.DataFrame(np.vstack([fv.to_array() for fv in fvs]), columns=fvs[0].feature_names())
              df['label'] = [0] * len(b) + [1] * len(a)
              return df.sample(frac=1.0, random_state=int(rng.integers(1 << 30))).reset_index(drop=True), fvs[0].feature_names()

          rng = np.random.default_rng(42)
          print('Synthetic traffic (seeded templates, Section 12.03); shuffled train/test split.')
          train_df, feature_names = frame(rng, 400, 100)
