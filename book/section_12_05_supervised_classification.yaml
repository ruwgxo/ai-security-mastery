  - heading: 'XGBoost Classifier'
    id: deliverable_2
    filename: xgboost_classifier.py
    lang: python
    description: >
      XGBoost attack classifier with scale_pos_weight imbalance handling, early stopping, and SHAP
      explainability. Same evaluate() and predict() interface as the Random Forest classifier for
      direct comparison in the Section 12.16 benchmark harness.
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: xgboost, shap, numpy,
      pandas, scikit-learn.
    code: |
      # xgboost_classifier.py
      # Section 12.05: XGBoost Security Classifier
      # 20260606 | AI Security Mastery -- Chapter 12 by Raghav Dinesh
      # Single quotes throughout per book convention

      from __future__ import annotations

      import time
      from dataclasses import dataclass
      from typing import Dict, List, Optional, Tuple

      import numpy as np
      import pandas as pd
      import shap
      import xgboost as xgb
      from sklearn.metrics import (
          precision_score, recall_score, f1_score,
          roc_auc_score,
      )

      from security_feature_extractor import (
          APIRequestContext, extract_features, FEATURE_SCHEMA_VERSION,
      )
      from random_forest_classifier import ClassifierPrediction


      class XGBoostSecurityClassifier:
          '''
          XGBoost classifier for LLM API security detection.

          scale_pos_weight handles class imbalance without SMOTE.
          Do NOT set scale_pos_weight when the training set has already been
          SMOTE-augmented -- use the default value of 1.0 instead.
          '''

          def __init__(
              self,
              n_estimators: int = 500,
              max_depth: int = 5,
              learning_rate: float = 0.05,
              subsample: float = 0.8,
              colsample_bytree: float = 0.8,
              scale_pos_weight: float = 1.0,
              reg_alpha: float = 0.1,
              reg_lambda: float = 1.0,
              operating_threshold: float = 0.5,
              early_stopping_rounds: int = 30,
              random_state: int = 42,
          ) -> None:
              self.params = dict(
                  n_estimators=n_estimators,
                  max_depth=max_depth,
                  learning_rate=learning_rate,
                  subsample=subsample,
                  colsample_bytree=colsample_bytree,
                  scale_pos_weight=scale_pos_weight,
                  reg_alpha=reg_alpha,
                  reg_lambda=reg_lambda,
                  random_state=random_state,
                  # Early stopping follows the last metric. AUC-PR alone saturates at 1.0 within a few
                  # rounds on separable data and stops training almost at once; log-loss keeps
                  # improving while the probabilities sharpen.
                  eval_metric=['aucpr', 'logloss'],
                  verbosity=0,
              )
              self.early_stopping_rounds = early_stopping_rounds
              self.operating_threshold = operating_threshold
              self.model = xgb.XGBClassifier(**self.params)
              self._trained = False
              self._feature_names: List[str] = []
              self._explainer: Optional[shap.TreeExplainer] = None
              self._schema_version = FEATURE_SCHEMA_VERSION

          @staticmethod
          def compute_scale_pos_weight(y_train: np.ndarray) -> float:
              '''Compute scale_pos_weight from training label array.'''
              n_neg = int((y_train == 0).sum())
              n_pos = int((y_train == 1).sum())
              spw = n_neg / max(n_pos, 1)
              print(f'  Computed scale_pos_weight: {spw:.2f} ({n_neg} benign / {n_pos} attack)')
              return spw

          def fit(
              self,
              train_df: pd.DataFrame,
              val_df: pd.DataFrame,
              feature_names: List[str],
              auto_scale_pos_weight: bool = True,
          ) -> 'XGBoostSecurityClassifier':
              self._feature_names = feature_names
              X_train = train_df[feature_names].values.astype(np.float32)
              y_train = train_df['label'].values
              X_val = val_df[feature_names].values.astype(np.float32)
              y_val = val_df['label'].values

              if auto_scale_pos_weight and self.params['scale_pos_weight'] == 1.0:
                  spw = self.compute_scale_pos_weight(y_train)
                  self.model.set_params(scale_pos_weight=spw)

              t0 = time.time()
              # XGBoost >= 2.0 takes early_stopping_rounds as a model parameter, not a fit() argument
              self.model.set_params(early_stopping_rounds=self.early_stopping_rounds)
              self.model.fit(
                  X_train, y_train,
                  eval_set=[(X_val, y_val)],
                  verbose=False,
              )
              elapsed = time.time() - t0
              self._trained = True
              self._explainer = shap.TreeExplainer(self.model)

              print(
                  f'XGBoostClassifier trained in {elapsed:.2f}s '
                  f'(best_iteration={self.model.best_iteration})'
              )
              return self

          def predict_proba_array(self, X: np.ndarray) -> np.ndarray:
              assert self._trained
              return self.model.predict_proba(X)[:, 1]

          def predict(self, ctx: APIRequestContext, explain: bool = True) -> ClassifierPrediction:
              assert self._trained
              t0 = time.time()
              fv = extract_features(ctx)
              arr = fv.to_array().reshape(1, -1)
              prob = float(self.model.predict_proba(arr)[0, 1])
              is_attack = prob >= self.operating_threshold

              shap_contribs = None
              if explain and is_attack and self._explainer is not None:
                  sv = self._explainer.shap_values(arr)[0]
                  shap_contribs = dict(zip(self._feature_names, sv.tolist()))

              return ClassifierPrediction(
                  request_text=ctx.message_text[:200],
                  attack_probability=prob,
                  is_attack=is_attack,
                  threshold=self.operating_threshold,
                  feature_schema_version=fv.schema_version,
                  shap_contributions=shap_contribs,
                  inference_ms=(time.time() - t0) * 1000,
              )

          def evaluate(self, test_df: pd.DataFrame, feature_names: List[str]) -> Dict[str, float]:
              assert self._trained
              X = test_df[feature_names].values.astype(np.float32)
              y_true = test_df['label'].values
              y_prob = self.predict_proba_array(X)
              y_pred = (y_prob >= self.operating_threshold).astype(int)
              return {
                  'precision': float(precision_score(y_true, y_pred, zero_division=0)),
                  'recall': float(recall_score(y_true, y_pred, zero_division=0)),
                  'f1': float(f1_score(y_true, y_pred, zero_division=0)),
                  'roc_auc': float(roc_auc_score(y_true, y_prob)),
                  'fpr': float((y_pred[y_true == 0] == 1).mean()) if (y_true == 0).any() else 0.0,
                  'threshold': self.operating_threshold,
                  'n_test': len(y_true),
                  'n_attack_test': int((y_true == 1).sum()),
              }

          def save(self, path: str) -> None:
              import pickle
              with open(path, 'wb') as f:
                  pickle.dump(self, f)
              print(f'Saved XGBoostClassifier -> {path}')

          @staticmethod
          def load(path: str) -> 'XGBoostSecurityClassifier':
              import pickle
              with open(path, 'rb') as f:
                  return pickle.load(f)


      if __name__ == '__main__':
          # Seeded synthetic traffic from Section 12.03 (isolation_forest_detector.synthetic_traffic),
          # shuffled so every split holds both classes. Templated data is easy to separate: the
          # numbers show the pipeline working, not production performance.
          from isolation_forest_detector import synthetic_traffic
          from security_feature_extractor import extract_features

          def frame(rng, n_benign, n_attack):
              b, a = synthetic_traffic(rng, n_benign, n_attack)
              fvs = [extract_features(c) for c in b + a]
              df = pd.DataFrame(np.vstack([fv.to_array() for fv in fvs]), columns=fvs[0].feature_names())
              df['label'] = [0] * len(b) + [1] * len(a)
              return df.sample(frac=1.0, random_state=int(rng.integers(1 << 30))).reset_index(drop=True), fvs[0].feature_names()

          rng = np.random.default_rng(42)
          print('Synthetic traffic (seeded templates, Section 12.03); shuffled train/val/test splits.')
          train_df, feature_names = frame(rng, 380, 80)
          val_df, _ = frame(rng, 150, 20)
          test_df, _ = frame(rng, 1000, 100)
          clf = XGBoostSecurityClassifier(n_estimators=300, learning_rate=0.05)
          clf.fit(train_df, val_df, feature_names, auto_scale_pos_weight=True)
          metrics = clf.evaluate(test_df, feature_names)
          print('\nXGBoost evaluation (held-out test set):')
          for k, v in metrics.items():
              print(f'  {k}: {v:.4f}' if isinstance(v, float) else f'  {k}: {v}')
  - heading: 'Hyperparameter Tuner'
    id: deliverable_3
    filename: hyperparameter_tuner.py
    lang: python
    description: >
      Optuna Bayesian hyperparameter search for Random Forest and XGBoost classifiers with a
      recall-at-precision objective. Evaluates both model families simultaneously on the temporal
      validation set and returns the best configuration and model family for the current dataset.
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: optuna, scikit-learn,
      xgboost, numpy, pandas.
    code: |
      # hyperparameter_tuner.py
      # Section 12.05: Optuna Hyperparameter Tuner for Security Classifiers
      # 20260606 | AI Security Mastery -- Chapter 12 by Raghav Dinesh
      # Single quotes throughout per book convention

      from __future__ import annotations

      from typing import Any, Dict, List, Optional, Tuple

      import numpy as np
      import optuna
      import pandas as pd
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.metrics import precision_score, recall_score
      import xgboost as xgb

      optuna.logging.set_verbosity(optuna.logging.WARNING)

      # Optimise recall subject to precision >= this value.
      # Adjust based on the deployment's analyst FP capacity.
      PRECISION_FLOOR = 0.70


      def _rf_objective(
          trial: optuna.Trial,
          X_train: np.ndarray, y_train: np.ndarray,
          X_val: np.ndarray, y_val: np.ndarray,
      ) -> float:
          params = {
              'n_estimators': trial.suggest_int('rf_n_estimators', 100, 600),
              'max_depth': trial.suggest_int('rf_max_depth', 3, 20),
              'min_samples_split': trial.suggest_int('rf_min_samples_split', 2, 30),
              'class_weight': 'balanced',
              'random_state': 42,
              'n_jobs': -1,
          }
          model = RandomForestClassifier(**params)
          model.fit(X_train, y_train)
          y_prob = model.predict_proba(X_val)[:, 1]

          # Sweep thresholds; find best recall at precision >= floor
          best_recall = 0.0
          for t in np.linspace(0.1, 0.9, 50):
              y_pred = (y_prob >= t).astype(int)
              prec = precision_score(y_val, y_pred, zero_division=0)
              rec = recall_score(y_val, y_pred, zero_division=0)
              if prec >= PRECISION_FLOOR and rec > best_recall:
                  best_recall = rec
          return best_recall


      def _xgb_objective(
          trial: optuna.Trial,
          X_train: np.ndarray, y_train: np.ndarray,
          X_val: np.ndarray, y_val: np.ndarray,
      ) -> float:
          spw = float((y_train == 0).sum()) / max(float((y_train == 1).sum()), 1)
          params = {
              'n_estimators': trial.suggest_int('xgb_n_estimators', 100, 800),
              'max_depth': trial.suggest_int('xgb_max_depth', 2, 10),
              'learning_rate': trial.suggest_float('xgb_lr', 0.01, 0.2, log=True),
              'subsample': trial.suggest_float('xgb_subsample', 0.6, 1.0),
              'colsample_bytree': trial.suggest_float('xgb_colsample', 0.6, 1.0),
              'reg_alpha': trial.suggest_float('xgb_alpha', 1e-3, 10.0, log=True),
              'reg_lambda': trial.suggest_float('xgb_lambda', 1e-3, 10.0, log=True),
              'scale_pos_weight': spw,
              'random_state': 42,
              'eval_metric': 'aucpr',
              'verbosity': 0,
          }
          model = xgb.XGBClassifier(**params, early_stopping_rounds=20)   # a model parameter in XGBoost >= 2.0
          model.fit(X_train, y_train, eval_set=[(X_val, y_val)], verbose=False)
          y_prob = model.predict_proba(X_val)[:, 1]

          best_recall = 0.0
          for t in np.linspace(0.1, 0.9, 50):
              y_pred = (y_prob >= t).astype(int)
              prec = precision_score(y_val, y_pred, zero_division=0)
              rec = recall_score(y_val, y_pred, zero_division=0)
              if prec >= PRECISION_FLOOR and rec > best_recall:
                  best_recall = rec
          return best_recall


      def tune(
          train_df: pd.DataFrame,
          val_df: pd.DataFrame,
          feature_names: List[str],
          n_trials: int = 50,
          precision_floor: float = PRECISION_FLOOR,
      ) -> Tuple[str, Dict[str, Any], float]:
          '''
          Run Optuna hyperparameter search for both RF and XGBoost.
          Returns (best_model_family, best_params, best_recall_at_precision).
          '''
          global PRECISION_FLOOR
          PRECISION_FLOOR = precision_floor

          X_train = train_df[feature_names].values.astype(np.float32)
          y_train = train_df['label'].values
          X_val = val_df[feature_names].values.astype(np.float32)
          y_val = val_df['label'].values

          results = {}
          for family, obj in [('RandomForest', _rf_objective), ('XGBoost', _xgb_objective)]:
              study = optuna.create_study(direction='maximize', sampler=optuna.samplers.TPESampler(seed=42))  # reproducible search
              study.optimize(
                  lambda t, o=obj: o(t, X_train, y_train, X_val, y_val),
                  n_trials=n_trials // 2,
                  show_progress_bar=False,
              )
              results[family] = (study.best_value, study.best_params)
              print(f'{family}: best_recall@precision>={precision_floor:.2f} = {study.best_value:.4f}')

          best_family = max(results, key=lambda k: results[k][0])
          best_value, best_params = results[best_family]
          print(f'\nSelected: {best_family} (recall={best_value:.4f})')
          return best_family, best_params, best_value


      if __name__ == '__main__':
          # Seeded synthetic traffic from Section 12.03 (isolation_forest_detector.synthetic_traffic),
          # shuffled so every split holds both classes. Templated data is easy to separate: the
          # numbers show the pipeline working, not production performance.
          from isolation_forest_detector import synthetic_traffic
          from security_feature_extractor import extract_features

          def frame(rng, n_benign, n_attack):
              b, a = synthetic_traffic(rng, n_benign, n_attack)
              fvs = [extract_features(c) for c in b + a]
              df = pd.DataFrame(np.vstack([fv.to_array() for fv in fvs]), columns=fvs[0].feature_names())
              df['label'] = [0] * len(b) + [1] * len(a)
              return df.sample(frac=1.0, random_state=int(rng.integers(1 << 30))).reset_index(drop=True), fvs[0].feature_names()

          rng = np.random.default_rng(42)
          print('Synthetic traffic (seeded templates, Section 12.03); shuffled train/val splits.')
          train_df, feature_names = frame(rng, 300, 60)
          val_df, _ = frame(rng, 300, 30)
          family, params, score = tune(train_df, val_df, feature_names, n_trials=20)
          print(f'\nBest params: {params}')
  - heading: 'Security Evaluator'
    id: deliverable_4
    filename: security_evaluator.py
    lang: python
    description: >
      Imbalance-aware evaluation harness for security classifiers. Produces precision, recall, F1,
      ROC-AUC, PR-AUC, confusion matrix, and FPR at the operating threshold. Imported by every
      subsequent section (12.06 through 12.17) for consistent cross-section benchmarking.
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: scikit-learn, numpy,
      matplotlib.
    code: |
      # security_evaluator.py
      # Section 12.05: Security Classifier Evaluation Harness
      # 20260606 | AI Security Mastery -- Chapter 12 by Raghav Dinesh
      # Single quotes throughout per book convention

      from __future__ import annotations

      from dataclasses import dataclass
      from typing import Dict, List, Optional, Tuple

      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.metrics import (
          precision_score, recall_score, f1_score,
          roc_auc_score, precision_recall_curve, auc,
          confusion_matrix, ConfusionMatrixDisplay,
      )


      @dataclass
      class EvaluationReport:
          classifier_name: str
          n_test: int
          n_attack: int
          n_benign: int
          imbalance_ratio: float
          precision: float
          recall: float
          f1: float
          roc_auc: float
          pr_auc: float
          fpr_at_threshold: float
          operating_threshold: float
          confusion: List[List[int]]

          def summary_line(self) -> str:
              return (
                  f'{self.classifier_name:<35} '
                  f'P={self.precision:.3f}  R={self.recall:.3f}  '
                  f'F1={self.f1:.3f}  AUC={self.roc_auc:.3f}  '
                  f'FPR={self.fpr_at_threshold:.3f}'
              )


      def evaluate(
          classifier_name: str,
          y_true: np.ndarray,
          y_prob: np.ndarray,
          operating_threshold: float = 0.5,
      ) -> EvaluationReport:
          y_pred = (y_prob >= operating_threshold).astype(int)
          prec_arr, rec_arr, _ = precision_recall_curve(y_true, y_prob)

          n_attack = int((y_true == 1).sum())
          n_benign = int((y_true == 0).sum())
          fpr = float((y_pred[y_true == 0] == 1).mean()) if n_benign > 0 else 0.0
          cm = confusion_matrix(y_true, y_pred).tolist()

          return EvaluationReport(
              classifier_name=classifier_name,
              n_test=len(y_true),
              n_attack=n_attack,
              n_benign=n_benign,
              imbalance_ratio=n_benign / max(n_attack, 1),
              precision=float(precision_score(y_true, y_pred, zero_division=0)),
              recall=float(recall_score(y_true, y_pred, zero_division=0)),
              f1=float(f1_score(y_true, y_pred, zero_division=0)),
              roc_auc=float(roc_auc_score(y_true, y_prob)),
              pr_auc=float(auc(rec_arr, prec_arr)),
              fpr_at_threshold=fpr,
              operating_threshold=operating_threshold,
              confusion=cm,
          )


      def print_report(report: EvaluationReport) -> None:
          print(f'\nEvaluation: {report.classifier_name}')
          print(f'  Test set:   {report.n_test} examples '
                f'(attack={report.n_attack}, benign={report.n_benign}, '
                f'ratio={report.imbalance_ratio:.1f}:1)')
          print(f'  Threshold:  {report.operating_threshold:.3f}')
          print(f'  Precision:  {report.precision:.4f}')
          print(f'  Recall:     {report.recall:.4f}')
          print(f'  F1:         {report.f1:.4f}')
          print(f'  ROC-AUC:    {report.roc_auc:.4f}')
          print(f'  PR-AUC:     {report.pr_auc:.4f}')
          print(f'  FPR:        {report.fpr_at_threshold:.4f}')
          tn, fp, fn, tp = (report.confusion[0][0], report.confusion[0][1],
                            report.confusion[1][0], report.confusion[1][1])
          print(f'  Confusion:  TP={tp}  FP={fp}  FN={fn}  TN={tn}')


      def compare_classifiers(reports: List[EvaluationReport]) -> None:
          print('\nClassifier Comparison:')
          print('-' * 80)
          for r in sorted(reports, key=lambda x: -x.recall):
              print(f'  {r.summary_line()}')
          print('-' * 80)
          best_recall = max(reports, key=lambda x: x.recall)
          best_prec = max(reports, key=lambda x: x.precision)
          print(f'  Best recall:    {best_recall.classifier_name}')
          print(f'  Best precision: {best_prec.classifier_name}')


      def plot_pr_curve(
          reports: List[Tuple[str, np.ndarray, np.ndarray]],
          save_path: str = 'pr_comparison.png',
      ) -> None:
          '''reports: list of (name, y_true, y_prob) tuples'''
          plt.figure(figsize=(8, 6))
          for name, y_true, y_prob in reports:
              p, r, _ = precision_recall_curve(y_true, y_prob)
              plt.plot(r, p, lw=2, label=f'{name} (AUC={auc(r, p):.3f})')
          plt.xlabel('Recall'); plt.ylabel('Precision')
          plt.title('Precision-Recall Comparison'); plt.legend(); plt.grid(alpha=0.3)
          plt.tight_layout(); plt.savefig(save_path, dpi=150, bbox_inches='tight'); plt.close()
          print(f'Saved PR comparison: {save_path}')


      if __name__ == '__main__':
          print('Stand-in probability arrays (synthetic scores, not trained models).')
          rng = np.random.default_rng(42)
          y_true = np.array([0] * 190 + [1] * 10)
          rf_prob = np.concatenate([rng.beta(1, 9, 190), rng.beta(7, 3, 10)])
          xgb_prob = np.concatenate([rng.beta(1, 8, 190), rng.beta(8, 2, 10)])

          rf_report = evaluate('RandomForest', y_true, rf_prob, operating_threshold=0.4)
          xgb_report = evaluate('XGBoost', y_true, xgb_prob, operating_threshold=0.4)
          print_report(rf_report)
          print_report(xgb_report)
          compare_classifiers([rf_report, xgb_report])
  - heading: 'SHAP Explainer'
    id: deliverable_5
    filename: shap_explainer.py
    lang: python
    description: >
      SHAP summary plots and per-prediction waterfall charts for analyst-readable security
      classifier explanations. Produces a global importance summary, a per-prediction waterfall for
      any flagged request, and a security audit report checking whether structural features outrank
      surface token features in the global ranking.
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: shap, matplotlib, numpy.
    code: |
      # shap_explainer.py
      # Section 12.05: SHAP Explainability for Security Classifiers
      # 20260606 | AI Security Mastery -- Chapter 12 by Raghav Dinesh
      # Single quotes throughout per book convention

      from __future__ import annotations

      from typing import Any, Dict, List, Optional, Tuple

      import numpy as np
      import matplotlib.pyplot as plt
      import shap

      STRUCTURAL_FEATURES = {'role_boundary_marker', 'code_block_density', 'code_block_count', 'bracket_density'}
      SURFACE_FEATURES = {'sequence_length', 'word_count', 'token_entropy'}


      def compute_shap_values(
          model: Any,
          X: np.ndarray,
          feature_names: List[str],
      ) -> Tuple[shap.TreeExplainer, np.ndarray]:
          explainer = shap.TreeExplainer(model)
          sv = explainer.shap_values(X)
          if isinstance(sv, list):
              sv = sv[1]  # binary classification: take attack class
          elif sv.ndim == 3:
              sv = sv[..., 1]  # shap >= 0.45: (n, features, classes)
          return explainer, sv


      def global_importance(
          shap_values: np.ndarray,
          feature_names: List[str],
          top_n: int = 15,
      ) -> List[Tuple[str, float]]:
          mean_abs = np.abs(shap_values).mean(axis=0)
          ranked = sorted(zip(feature_names, mean_abs), key=lambda x: -x[1])
          return ranked[:top_n]


      def plot_summary(
          shap_values: np.ndarray,
          X: np.ndarray,
          feature_names: List[str],
          save_path: str = 'shap_summary.png',
          top_n: int = 15,
      ) -> None:
          shap.summary_plot(shap_values, X, feature_names=feature_names,
                            max_display=top_n, show=False)
          plt.tight_layout()
          plt.savefig(save_path, dpi=150, bbox_inches='tight')
          plt.close()
          print(f'Saved SHAP summary: {save_path}')


      def plot_waterfall(
          explainer: shap.TreeExplainer,
          X_single: np.ndarray,
          feature_names: List[str],
          save_path: str = 'shap_waterfall.png',
      ) -> Dict[str, float]:
          '''Plot SHAP waterfall for a single prediction. Returns feature contribution dict.'''
          sv = explainer.shap_values(X_single)
          if isinstance(sv, list):
              sv = sv[1]
          elif sv.ndim == 3:
              sv = sv[..., 1]
          contrib = dict(zip(feature_names, sv[0].tolist()))

          # Sort by absolute contribution for waterfall
          sorted_contribs = sorted(contrib.items(), key=lambda x: abs(x[1]), reverse=True)[:10]
          names = [c[0] for c in sorted_contribs]
          values = [c[1] for c in sorted_contribs]
          colours = ['#ff6b6b' if v > 0 else '#51cf66' for v in values]

          fig, ax = plt.subplots(figsize=(9, 5))
          ax.barh(names[::-1], values[::-1], color=colours[::-1])
          ax.axvline(0, color='black', lw=0.8)
          ax.set_xlabel('SHAP value (contribution to attack probability)')
          ax.set_title('SHAP Waterfall: Per-Feature Contribution')
          plt.tight_layout()
          plt.savefig(save_path, dpi=150, bbox_inches='tight')
          plt.close()
          print(f'Saved SHAP waterfall: {save_path}')
          return contrib


      def security_audit(ranking: List[Tuple[str, float]]) -> Dict[str, Any]:
          top_10 = {name for name, _ in ranking[:10]}
          structural_present = STRUCTURAL_FEATURES & top_10
          surface_dominant = len(SURFACE_FEATURES & {name for name, _ in ranking[:3]}) >= 2
          findings = []
          if not structural_present:
              findings.append('WARN: No structural features in top 10 -- classifier may be detecting length artifacts.')
          if surface_dominant:
              findings.append('WARN: Surface features dominate top 3 -- easily evaded by payload padding.')
          if structural_present and not surface_dominant:
              findings.append('OK: Structural features present in top 10; surface features not dominant.')
          return {
              'passed': bool(structural_present) and not surface_dominant,
              'structural_in_top_10': sorted(structural_present),
              'findings': findings,
          }


      def print_shap_report(
          ranking: List[Tuple[str, float]],
          audit: Dict[str, Any],
      ) -> None:
          print('SHAP Global Importance:')
          for i, (name, val) in enumerate(ranking, 1):
              tag = ' [STRUCTURAL]' if name in STRUCTURAL_FEATURES else (' [SURFACE]' if name in SURFACE_FEATURES else '')
              bar = '#' * min(int(val * 200), 40)
              print(f'  {i:>2}. {name:<35} {val:.4f}  {bar}{tag}')
          print(f'\nSecurity Audit: {"PASS" if audit["passed"] else "FAIL"}')
          for f in audit['findings']:
              print(f'  {f}')


      if __name__ == '__main__':
          from sklearn.ensemble import RandomForestClassifier
          from isolation_forest_detector import synthetic_traffic
          from security_feature_extractor import extract_features

          # Seeded synthetic traffic from Section 12.03: benign questions, instruction-override text
          # and keyword-free API abuse. Replace with the Section 12.05 model and training data.
          rng = np.random.default_rng(42)
          benign, attack = synthetic_traffic(rng, 400, 100)
          fvs = [extract_features(c) for c in benign + attack]
          X = np.vstack([fv.to_array() for fv in fvs])
          feature_names = fvs[0].feature_names()
          y = np.array([0] * len(benign) + [1] * len(attack))
          print(f'Synthetic traffic (seeded templates, Section 12.03): {len(benign)} benign, {len(attack)} attack.')
          model = RandomForestClassifier(n_estimators=100, random_state=42, class_weight='balanced')
          model.fit(X, y)

          explainer, sv = compute_shap_values(model, X, feature_names)
          ranking = global_importance(sv, feature_names)
          audit = security_audit(ranking)
          print_shap_report(ranking, audit)
          # Waterfall for a single attack example (an instruction-override request)
          plot_waterfall(explainer, X[len(benign):len(benign) + 1], feature_names)
common_mistakes:
  - subject: >
      Applying both SMOTE on the training set and scale_pos_weight in XGBoost, double-counting the
      imbalance treatment and pushing the classifier toward excessive attack predictions
    id: mistake_1
    entries:
      - label: 'Why It Happens'
        value: >
          The engineer reads the Section 12.04 recommendation to apply SMOTE and the XGBoost
          documentation recommending scale_pos_weight for imbalanced datasets. Both seem like good
          ideas; applying both seems like belt-and-suspenders safety. It is not.
      - label: Consequence
        value: >
          After SMOTE the training set attack:benign ratio is approximately 1:2. Setting
          scale_pos_weight=20 (the original imbalance ratio) tells XGBoost to upweight attack
          examples by a factor of 20 on an already nearly balanced dataset. The classifier
          aggressively predicts attack, producing recall near 1.0 and precision near the base rate
          of attacks in the test set. The false positive rate on production traffic is unsustainably
          high.
      - label: 'Correct Approach'
        value: >
          Apply one imbalance treatment, not both. If SMOTE was applied to the training set, set
          scale_pos_weight=1.0 in XGBoost (the default). If SMOTE was not applied (fewer than 100
          attack examples), set scale_pos_weight=n_benign/n_attack and do not run SMOTE. The
          auto_scale_pos_weight parameter in xgboost_classifier.py handles this correctly when
          called after a SMOTE-treated training set is passed.
  - subject: >
      Reporting accuracy as the primary evaluation metric and claiming 98% accuracy as
      production-ready performance
    id: mistake_2
    entries:
      - label: 'Why It Happens'
        value: >
          The security_evaluator.py harness computes six metrics. The engineer focuses on accuracy
          because it is the metric they are most familiar with and the one that produces the
          highest-looking number on an imbalanced test set.
      - label: Consequence
        value: >
          A test set with 190 benign and 10 attack examples has a 95% accuracy baseline for a
          classifier that predicts benign for every request. A genuinely trained classifier may
          reach 98% accuracy while catching only 5 of 10 attacks (50% recall). The 98% accuracy is
          reported as production-ready; the 50% recall that means half of all attacks reach the
          model undetected is not reported.
      - label: 'Correct Approach'
        value: >
          Report recall, precision, and FPR at the operating threshold as the primary metrics.
          Accuracy is not reported for security classifiers. The security_evaluator.py harness
          intentionally does not compute accuracy. The compare_classifiers() function sorts by
          recall, not accuracy, to enforce the c
  - subject: >
      Setting the operating threshold at the default 0.5 without calibrating it to the analyst
      capacity constraint
    id: mistake_3
    entries:
      - label: 'Why It Happens'
        value: >
          The classifier is trained with a default threshold of 0.5. The evaluation harness uses
          0.5. The production gateway uses 0.5. This is the sklearn convention and it carries
          through every step without being questioned.
      - label: Consequence
        value: >
          At 0.5 threshold and 10,000 requests per day, the false positive rate at 0.5 may produce
          300 FP alerts per day against a 50-alert analyst capacity. The gateway is flooded with
          alerts, analysts stop reviewing them, and the detection system is effectively disabled
          within a week.
      - label: 'Correct Approach'
        value: >
          Use the precision-recall curve from security_evaluator.py to select the operating
          threshold explicitly. The threshold_tuner.py in Section 12.10 formalises this selection.
          Always set the threshold before the first production deployment, not after the first alert
          flood.
  - subject: >
      Using standard k-fold cross-validation instead of temporal k-fold, allowing future examples to
      appear in training folds
    id: mistake_4
    entries:
      - label: 'Why It Happens'
        value: >
          Optuna default cross-validation uses sklearn KFold with shuffle=True. The engineer uses
          the Optuna example code without modifying the cross-validation strategy and produces
          optimistically-biased hyperparameter selection results.
      - label: Consequence
        value: >
          Hyperparameters selected by standard k-fold are optimised for generalisation to data from
          the same time window as training data, not to future traffic. The selected hyperparameters
          produce a classifier that performs well on cross-validation and degrades on the temporal
          test set. The temporal test set performance is the correct proxy for production
          performance; cross-validation performance is not.
      - label: 'Correct Approach'
        value: >
          The hyperparameter_tuner.py in deliverable_3 uses the validation split from the Section
          12.04 temporal split as the evaluation set for every Optuna trial, not cross-validation.
          This ensures hyperparameter selection is evaluated on data that is temporally later than
          the training data for every trial.
  - subject: >
      Treating classifier training as a one-time activity without setting up the retraining
      infrastructure before the attack distribution shifts
    id: mistake_5
    entries:
      - label: 'Why It Happens'
        value: >
          Training takes a day of engineering work. Once deployed, the classifier performs well for
          4-8 weeks. The engineer moves on to other sections and does not set up the retraining
          infrastructure before the classifier needs it.
      - label: Consequence
        value: >
          When the attack distribution shifts, the classifier recall drops silently. The feature
          distribution monitor fires, but the retraining infrastructure does not exist to act on it.
          Retraining is done manually without registry integration, without shadow-mode validation,
          without canary promotion. One step produces a regression; without the registry there is no
          rollback.
      - label: 'Correct Approach'
        value: >
          Set up the Section 12.13 model registry before the first classifier is deployed. Set up
          the Section 12.14 live curation pipeline before the first retraining trigger fires. The
          correct sequencing: train classifier (12.05), register it (12.13), deploy curation
          pipeline (12.14), then continue detection engineering knowing the retraining
          infrastructure is in place.
section_summary:
  compact: >
    Random Forest and XGBoost are the first supervised classifiers in Chapter 12 and the workhorses
    of the detection system for the 200-2000 labelled example range. Random Forest trains an
    ensemble of decorrelated trees via bootstrap sampling and feature subsetting, is robust to label
    noise, and trains in seconds. XGBoost fits trees sequentially with gradient boosting and
    regularisation, reaching higher accuracy above 500 labelled examples at the cost of sensitivity
    to label noise. Both produce full SHAP explainability via TreeExplainer: every prediction
    decomposes into signed per-feature contributions readable by a security analyst without ML
    expertise. Evaluation uses precision, recall, ROC-AUC, and FPR at the operating threshold --
    never accuracy. The operating threshold is calibrated to the analyst capacity constraint, not
    left at the default 0.5. The security_evaluator.py harness is imported by every subsequent
    section for consistent cross-classifier benchmarking.
  key_takeaways:
    - 'Random Forest is the correct default for 200-500 labelled examples: robust to label noise, sub-3ms inference, and full SHAP explainability -- all three properties matter more than peak accuracy in the early deployment stage'
    - 'XGBoost outperforms Random Forest above 500 labelled examples when annotation quality is high (kappa > 0.85); below this, its boosting amplifies label noise and degrades precision'
    - 'Apply one imbalance treatment only: SMOTE on the training set OR scale_pos_weight in XGBoost -- never both; double-counting pushes the classifier to predict attack for the majority of requests'
    - 'The operating threshold must be calibrated to the analyst capacity constraint before the first production deployment -- a default 0.5 threshold on a 1:20 imbalanced dataset will flood the annotation queue'
    - 'SHAP explanations are an audit tool: if role_boundary_marker and code_block_density are not in the top-5 SHAP features for attack predictions, the classifier is measuring an artifact rather than the attack mechanism'
    - 'The security_evaluator.py harness is the benchmark baseline for every classifier section through 12.17 -- every new detector must outperform Random Forest on recall at matched precision to justify its additional complexity'
next:
  kind: section
  target: '12_06'
  title: 'Section 12.06: Sequence Models -- LSTM and GRU for Multi-Turn Conversation Threat Detection'
  summary: >
    Section 12.06 extends supervised classification into the temporal dimension. Random Forest and
    XGBoost from Section 12.05 classify individual API requests in isolation. Multi-turn jailbreak
    attacks fragment the payload across turns, each innocuous individually but constituting an
    attack in sequence. The GRU sequence detector reads the full conversation history as a
    variable-length sequence of SecurityFeatureVectors and classifies the conversation, not the
    turn. Attention weights over turns identify which turns carried the attack signal. The LSTM
    covers the more expressive gating mechanism; the GRU is preferred for conversations shorter than
    20 turns due to faster training and matched accuracy with fewer parameters.
