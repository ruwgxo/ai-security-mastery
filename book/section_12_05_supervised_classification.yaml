overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          The anomaly detector in Section 12.03 has been running for four to eight weeks. The
          annotation queue has accumulated 200+ confirmed attack examples. The Section 12.04 dataset
          builder has produced a temporally split, SMOTE-treated training set. The detection system
          is ready for its first supervised classifier -- a model that learns explicit feature
          boundaries between attack and benign traffic rather than flagging statistical outliers.
      - type: prose
        text: >
          Random Forest and XGBoost are the correct first supervised classifiers for three reasons.
          Both train in seconds on CPU, enabling fast iteration cycles during feature engineering
          and hyperparameter tuning. Both produce full SHAP explainability: every prediction comes
          with a ranked list of the features that drove it, readable by any security analyst in
          under a minute without ML expertise. Both handle the 20-feature security vector from
          Section 12.02 without requiring normalisation or embedding infrastructure. And at 200-2000
          labelled examples -- the data availability window that follows 4-12 weeks of anomaly alert
          collection -- both outperform the neural classifier from Section 12.08, which requires
          2000+ examples to generalise reliably.
      - type: prose
        text: >
          Section 12.05 builds both classifiers, trains them on the Section 12.04 dataset, evaluates
          them with the security_evaluator.py harness that every subsequent section reuses, and
          establishes the SHAP explainability pipeline that the Section 12.15 ensemble uses for
          analyst-facing alert triage. The benchmark from Section 12.03 (anomaly detector vs
          supervised classifier) is completed here: after Section 12.05, the detection system has a
          precision improvement over the anomaly detector that justifies the annotation investment.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 12.05 is the first supervised training section. It establishes the evaluation
          harness (security_evaluator.py) and explainability pipeline (shap_explainer.py) that every
          subsequent classifier section reuses. Sections 12.06 through 12.09 each import
          security_evaluator.py and compare their classifier against the Section 12.05 Random Forest
          baseline.
