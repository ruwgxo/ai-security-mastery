section_overview:
  one_line_summary: |-
    The third platform connector: detections reach Elasticsearch through a Logstash pipeline that transforms them into ECS-aligned documents with an explicit field mapping, land in daily indices governed by a lifecycle policy, and become searchable and visualisable in Kibana -- with the generated Sigma rules deployed as Elastic detection rules.
  why_this_section_exists: |-
    Splunk and Datadog both accepted structured events more or less as sent. The Elastic Stack introduces the piece the other two hid: an explicit transformation and indexing stage. Detections do not go straight into Elasticsearch; they pass through Logstash, which parses, transforms, and enriches each event before it is indexed, and the index has a mapping that declares each field's type. That transformation stage is the distinguishing feature of this connector, and getting it right is what makes the difference between detections Kibana can aggregate and detections it merely stores as text.

    The section builds both sides of the transform. On the delivery side, a connector pushes detection events to the Logstash HTTP input. On the definition side, it produces the transform itself -- as a testable Python function that maps the detection-event schema to an Elasticsearch document, and as the equivalent Logstash pipeline config that runs in production, plus the explicit Elasticsearch mapping that types the fields. It aligns the document with ECS, the Elastic Common Schema, so detections interoperate with the rest of a team's Elastic data, writes to daily time-based indices with an index lifecycle policy so the data does not grow without bound, and deploys the generated Sigma rules as Elastic detection rules so the portable logic runs on the platform. As with the other connectors, the transform and delivery are tested end to end on a stub.
  position_in_chapter: |-
    Section 16.05 is the third and last of the platform connectors, completing the set (Splunk, Datadog, Elastic) before the custom webhook and enrichment of 16.06. It consumes the detection-event schema of 16.01, foregrounds the Logstash transformation stage the earlier connectors did not need, and deploys the Sigma rules of 16.02 as Elastic detection rules, so the portable core runs on its second named platform.
