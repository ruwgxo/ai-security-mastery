prose_content:
  part_1:
    title: Logstash as the Transformation Stage
    body: |-
      The Elastic Stack does not ingest events the way Splunk's HEC or Datadog's Logs API do. Between the gateway and Elasticsearch sits Logstash, a pipeline that receives events, transforms them through a series of filters, and routes the result to an index. That extra stage is not overhead; it is the place where a raw detection becomes a well-formed Elasticsearch document -- where fields are renamed and nested, where the timestamp is normalised, where the ECS alignment is applied. The earlier connectors mapped the schema to a platform envelope in one step because the platform accepted it directly; Elastic makes the transform explicit and gives it its own stage, which is exactly why this section foregrounds it.

      The connector therefore has two faces. As a push integration it POSTs detection events to the Logstash HTTP input, owning delivery like the other connectors. But the substance of the integration is the transform Logstash applies, and the section builds that transform as a first-class, testable artifact rather than leaving it as opaque pipeline config. The transform is written once as a Python function and mirrored as a Logstash pipeline config, so the mapping can be unit-tested in isolation and also run in production. Everything that makes Elastic aggregate detections well lives in that transform.
  part_2:
    title: Transforming the Schema into an Elasticsearch Document
    body: |-
      The transform maps the detection-event schema onto an Elasticsearch document with a specific shape. The schema's ISO timestamp becomes the document's @timestamp, the field Elastic and Kibana treat as the event time. The flat detection fields -- detector, verdict, severity, surface, score, confidence -- become top-level document fields. The request context nests into a request object holding the request id, session id, and source, so the document has a clean structure rather than a flat sprawl of prefixed keys. The evidence and labels carry over, and an ecs object records the schema version the document aligns to.

      The index is chosen in the transform too: the document's index is a daily index, a fixed prefix plus the date from the event's timestamp, so detections are partitioned by day. Aligning the document with ECS -- the Elastic Common Schema, the shared field vocabulary across Elastic's ecosystem -- is what lets these detections sit beside a team's other Elastic data and be queried with the same conventions. The transform is small and deterministic, which is deliberate: it is the single definition of what an indexed detection looks like, so it is written to be read and tested, not buried in pipeline plumbing.
  part_3:
    title: 'The Explicit Mapping: Why Keyword Fields Matter'
    body: |-
      Elasticsearch will happily index a document with no mapping, guessing each field's type from its first value. For detection data that default is a trap. A string field guessed as text is analysed -- broken into tokens for full-text search -- and an analysed field cannot be aggregated on cleanly, so a Kibana visualisation that tries to count detections by verdict or break them down by detector silently returns wrong or empty buckets. The fields a security team facets on must be keyword: stored whole, not analysed, aggregatable. The only way to guarantee that is to declare it.

      So the connector ships an explicit Elasticsearch mapping that types every field deliberately: detector, verdict, severity, and surface as keyword so they aggregate; @timestamp as date; score and confidence as float; the nested request fields as keyword; evidence as an object. The mapping is applied at index creation, before any detection lands, so the first document is typed correctly rather than fixing the type after the fact -- which Elasticsearch will not let you do without reindexing. This is the quiet, load-bearing part of the Elastic integration: the transform makes the document well-shaped, and the mapping makes its fields the right types, and without both, Kibana has data it cannot chart.
  part_4:
    title: Daily Indices and Lifecycle Management
    body: |-
      Detection data accumulates forever if nothing stops it, and an Elasticsearch cluster with an ever-growing index degrades: queries slow, storage fills, and eventually the cluster is in trouble. The connector addresses this structurally by writing to daily time-based indices -- a new index per day, named by the date in the event's timestamp -- rather than one endless index. Daily indices make time-scoped queries efficient (a query for last week touches seven indices, not the whole history) and, crucially, make retirement possible: an old index can be dropped whole, which is cheap, instead of deleting documents from a live index, which is expensive.

      On top of the daily indices sits an index lifecycle management policy, and the connector treats it as part of the configuration rather than an afterthought. The policy rolls indices over and deletes them past a retention horizon, so the detection data has a bounded footprint by construction: it lives for the retention window and then ages out automatically. Making the lifecycle policy part of the config -- with a validated retention that must exceed the rollover period -- means an operator deploying the connector is deploying its data-retention story at the same time, not discovering months later that detections have quietly filled the cluster.
  part_5:
    title: Sigma Detection Rules and End-to-End Testing
    body: |-
      As with Splunk, the events are half the integration and the logic is the other half. Elastic has a Sigma compiler, so the generated Sigma rules of Section 16.02 deploy into Elastic as detection rules that evaluate against the indexed detection documents, producing Elastic-native alerts. The portable logic runs on its second named platform, and because the rules are generated and versioned, keeping the Elastic-side detection rules in sync with the detectors is the same hash-driven redeploy as everywhere else -- no hand-edited Elastic rule to go stale.

      The connector is tested end to end on a stub Logstash transport. The tests assert the transform produces the right document: the daily index name derived from the timestamp, @timestamp set correctly, the nested request object populated, the full detection preserved, and the ECS version recorded. They check the explicit mapping types the facet fields as keyword and @timestamp as date, that delivery indexes every document in a batch, and that the emitted Logstash pipeline config has the input, filter, and output stages it needs. Testing the transform as a pure function -- separate from delivery -- is what the two-face design buys: the mapping that decides whether Kibana works is proven in isolation, and the delivery is proven against the stub. With the third connector complete, the platform set is done, and Section 16.06 builds the custom webhook for everything else and the enrichment that makes all these delivered detections actionable.
