deliverables:
  deliverable_1:
    title: The Elastic Connector and Transform
    filename: elastic_integration.py
    description: |-
      The Elastic connector and, at its heart, the transform: transform_to_es_document maps a detection event to an ECS-aligned Elasticsearch document with a daily index and nested request object; elasticsearch_mapping declares the explicit field types; logstash_pipeline_config emits the equivalent production pipeline; ElasticConnector pushes documents to the Logstash HTTP input behind a swappable transport. The transform is a pure, testable function.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library json, time, dataclasses, and typing only. The DetectionEvent is a dict via sample_event for standalone running; the suite imports DetectionEvent from detection_event_schema.py. The transform is deliberately pure so the schema-to-document mapping is unit-tested separately from delivery; StubLogstashTransport captures indexed documents. Self-checks the daily index, @timestamp, nested request, keyword mapping, and delivery.
    code: |
      # elastic_integration.py
      # Section 16.05: Elastic Stack Integration -- Logstash Pipelines
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The third platform connector. Detections reach Elasticsearch through a Logstash
      # pipeline that transforms them into ECS-aligned documents -- the transform is the
      # heart of this connector. It builds both sides: the client that delivers events,
      # and the pipeline/mapping definition that transforms them for Kibana.

      import json
      import time
      from dataclasses import dataclass
      from typing import Any, Dict, List, Optional


      def sample_event() -> Dict[str, Any]:
          return {
              'schema_version': '1.0', 'event_id': 'req-3001:exfiltration_detector',
              'timestamp': '2026-01-21T12:30:00Z', 'detector': 'exfiltration_detector',
              'verdict': 'block', 'severity': 'critical', 'score': 0.95, 'confidence': 0.97,
              'latency_ms': 8.2, 'surface': 'output', 'request_id': 'req-3001',
              'session_id': 'sess-77', 'source': 'prod-gateway-1',
              'evidence': [{'source': 'aggregate', 'label': 'canary_triggered', 'detail': 'system prompt canary'}],
              'iocs': [], 'labels': {},
          }


      def transform_to_es_document(event: Dict[str, Any], index_prefix: str = 'ai-detection') -> Dict[str, Any]:
          '''The transform a Logstash pipeline applies: a detection event becomes an
          Elasticsearch document with an @timestamp, keyword facet fields, a nested
          request object, and a daily index. This is the field mapping.'''
          return {
              '_index': f'{index_prefix}-{event["timestamp"][:10]}',
              '_id': event['event_id'],
              '@timestamp': event['timestamp'],
              'detector': event['detector'], 'verdict': event['verdict'],
              'severity': event['severity'], 'surface': event['surface'],
              'score': event['score'], 'confidence': event['confidence'],
              'request': {'request_id': event['request_id'], 'session_id': event['session_id'],
                          'source': event['source']},
              'evidence': event['evidence'], 'labels': event.get('labels', {}),
              'ecs': {'version': '8.11'},
          }


      def elasticsearch_mapping() -> Dict[str, Any]:
          '''Explicit index mapping. Keyword fields aggregate in Kibana; a guessed text
          field would not. Applied at index creation, before any detection lands.'''
          return {'mappings': {'properties': {
              '@timestamp': {'type': 'date'}, 'detector': {'type': 'keyword'},
              'verdict': {'type': 'keyword'}, 'severity': {'type': 'keyword'},
              'surface': {'type': 'keyword'}, 'score': {'type': 'float'},
              'confidence': {'type': 'float'},
              'request': {'properties': {'request_id': {'type': 'keyword'},
                          'session_id': {'type': 'keyword'}, 'source': {'type': 'keyword'}}},
              'evidence': {'type': 'object', 'enabled': True}}}}


      class LogstashTransport:
          def send(self, url: str, docs: List[Dict[str, Any]]) -> Dict[str, Any]:
              raise NotImplementedError


      class StubLogstashTransport(LogstashTransport):
          def __init__(self) -> None:
              self.indexed: List[Dict[str, Any]] = []
          def send(self, url, docs):
              self.indexed.extend(docs); return {'errors': False, 'indexed': len(docs)}


      @dataclass
      class ElasticConfig:
          logstash_url: str = 'http://logstash.internal:8080'
          index_prefix: str = 'ai-detection'
          pipeline: str = 'ai_detection_pipeline'

          def validate(self) -> None:
              assert self.logstash_url.startswith('http'), 'logstash_url must be an http(s) URL'
              assert self.index_prefix and self.pipeline, 'index prefix and pipeline required'


      class ElasticConnector:
          '''Push connector: POSTs transformed documents to the Logstash HTTP input.'''
          name = 'elastic'
          model = 'push'

          def __init__(self, transport: Optional[LogstashTransport] = None,
                       config: Optional[ElasticConfig] = None) -> None:
              self._transport = transport if transport is not None else StubLogstashTransport()
              self._cfg = config if config is not None else ElasticConfig()

          def send(self, events: List[Dict[str, Any]]) -> Dict[str, Any]:
              self._cfg.validate()
              docs = [transform_to_es_document(e, self._cfg.index_prefix) for e in events]
              resp = self._transport.send(self._cfg.logstash_url, docs)
              return {'indexed': resp.get('indexed', 0), 'ok': not resp.get('errors', True)}


      def logstash_pipeline_config(cfg: ElasticConfig) -> str:
          '''Emit the equivalent Logstash pipeline config -- the artifact that runs in
          production. The Python transform and this config express the same mapping.'''
          return ('input {\n  http { port => 8080 codec => json }\n}\n'
                  'filter {\n  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }\n'
                  '  mutate {\n    rename => { "source" => "[request][source]" }\n'
                  '    add_field => { "[ecs][version]" => "8.11" }\n  }\n}\n'
                  'output {\n  elasticsearch {\n'
                  '    index => "' + cfg.index_prefix + '-%{+YYYY.MM.dd}"\n'
                  '    pipeline => "' + cfg.pipeline + '"\n  }\n}\n')


      if __name__ == '__main__':
          stub = StubLogstashTransport()
          conn = ElasticConnector(transport=stub)
          events = [sample_event(),
                    {**sample_event(), 'detector': 'toxicity_detector', 'verdict': 'flag',
                     'severity': 'medium', 'event_id': 'req-3002:tox', 'request_id': 'req-3002'}]
          result = conn.send(events)
          print('send result :', result)
          doc = stub.indexed[0]
          print('doc _index  :', doc['_index'])
          assert result['indexed'] == 2 and result['ok']
          assert doc['_index'] == 'ai-detection-2026-01-21'
          assert doc['@timestamp'] == '2026-01-21T12:30:00Z'
          assert elasticsearch_mapping()['mappings']['properties']['verdict']['type'] == 'keyword'
          assert doc['request']['session_id'] == 'sess-77'
          print('elastic transform + mapping + delivery: ok')
  deliverable_2:
    title: Elastic Integration End-to-End Test
    filename: elastic_integration_test.py
    description: |-
      Five tests over the full path on the stub transport: the transform produces the right daily index, @timestamp, nested request, and ECS version; the full detection is preserved; the explicit mapping types the facet fields as keyword and @timestamp as date; delivery indexes every document in a batch; and the emitted Logstash pipeline config has its input, filter, and output stages. Proves the transform that decides whether Kibana can aggregate.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library only, imports the connector under test. Testing the transform as a pure function is the point of the two-face design: the mapping that makes or breaks Kibana aggregation is proven in isolation from the network delivery.
    code: |
      # elastic_integration_test.py
      # Section 16.05: Elastic Stack Integration End-to-End Test
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Confirms the Elastic path end to end on the stub transport: the transform turns
      # a detection event into a well-formed ECS document with keyword fields, a daily
      # index, and the full detection preserved; the mapping declares the field types;
      # delivery indexes every document.

      from elastic_integration import (ElasticConnector, StubLogstashTransport, ElasticConfig,
                                       transform_to_es_document, elasticsearch_mapping,
                                       logstash_pipeline_config, sample_event)


      def test_transform_document() -> None:
          doc = transform_to_es_document(sample_event())
          assert doc['_index'] == 'ai-detection-2026-01-21'
          assert doc['@timestamp'] == '2026-01-21T12:30:00Z'
          assert doc['detector'] == 'exfiltration_detector'
          assert doc['request']['session_id'] == 'sess-77'
          assert doc['ecs']['version'] == '8.11'


      def test_full_detection_preserved() -> None:
          doc = transform_to_es_document(sample_event())
          for key in ('score', 'confidence', 'evidence', 'surface'):
              assert key in doc, key
          assert doc['evidence'][0]['label'] == 'canary_triggered'


      def test_mapping_keyword_types() -> None:
          props = elasticsearch_mapping()['mappings']['properties']
          for f in ('detector', 'verdict', 'severity', 'surface'):
              assert props[f]['type'] == 'keyword', f
          assert props['@timestamp']['type'] == 'date'
          assert props['score']['type'] == 'float'


      def test_delivery_indexes_all() -> None:
          stub = StubLogstashTransport()
          result = ElasticConnector(transport=stub).send([sample_event() for _ in range(6)])
          assert result['indexed'] == 6 and result['ok']
          assert len(stub.indexed) == 6


      def test_pipeline_config_emitted() -> None:
          cfg = ElasticConfig()
          text = logstash_pipeline_config(cfg)
          assert 'input {' in text and 'filter {' in text and 'output {' in text
          assert cfg.pipeline in text and 'elasticsearch {' in text


      if __name__ == '__main__':
          tests = [test_transform_document, test_full_detection_preserved, test_mapping_keyword_types,
                   test_delivery_indexes_all, test_pipeline_config_emitted]
          for t in tests:
              t(); print(f'PASS {t.__name__}')
          print(f'{len(tests)}/{len(tests)} elastic integration tests passed')
  deliverable_3:
    title: Elastic Integration Configuration
    filename: elastic_config.py
    description: |-
      Configuration for the connector: the Logstash URL, index prefix, and pipeline, plus the index lifecycle policy as first-class config -- a rollover period and a retention horizon that ilm_policy renders into an ILM policy document. validate enforces that retention exceeds rollover; the API key is read from the environment. Ships production and short-retention profiles.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library os, dataclasses, and typing only. Making the ILM policy part of the config means deploying the connector deploys its data-retention story, so detection indices cannot silently fill the cluster. Self-checks that both profiles validate, the ILM delete phase renders, and the key resolves from the environment.
    code: |
      # elastic_config.py
      # Section 16.05: Elastic Stack Integration Configuration
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Configuration for the Elastic connector. Detection data grows without bound, so
      # an index lifecycle policy that rolls over and retires old indices is part of the
      # config, not an afterthought.

      import os
      from dataclasses import dataclass, asdict
      from typing import Any, Dict


      @dataclass
      class ElasticDeploymentConfig:
          logstash_url: str = 'http://logstash.internal:8080'
          index_prefix: str = 'ai-detection'
          pipeline: str = 'ai_detection_pipeline'
          ilm_rollover_days: int = 1
          ilm_retention_days: int = 90
          api_key_env_var: str = 'ELASTIC_API_KEY'

          def resolve_api_key(self) -> str:
              key = os.environ.get(self.api_key_env_var, '')
              assert key, f'{self.api_key_env_var} is not set -- Elastic API key required'
              return key

          def validate(self) -> None:
              assert self.logstash_url.startswith('http'), 'logstash_url must be an http(s) URL'
              assert self.index_prefix and self.pipeline, 'index prefix and pipeline required'
              assert self.ilm_retention_days >= self.ilm_rollover_days, 'retention must exceed rollover'

          def ilm_policy(self) -> Dict[str, Any]:
              return {'policy': {'phases': {
                  'hot': {'actions': {'rollover': {'max_age': f'{self.ilm_rollover_days}d'}}},
                  'delete': {'min_age': f'{self.ilm_retention_days}d', 'actions': {'delete': {}}}}}}

          def redacted(self) -> Dict[str, Any]:
              d = asdict(self); d['api_key'] = '(from ' + self.api_key_env_var + ')'; return d


      PRODUCTION = ElasticDeploymentConfig()
      SHORT_RETENTION = ElasticDeploymentConfig(ilm_retention_days=30)


      if __name__ == '__main__':
          os.environ.setdefault('ELASTIC_API_KEY', 'demo-key-not-real')
          for name, cfg in [('production', PRODUCTION), ('short_retention', SHORT_RETENTION)]:
              cfg.validate()
              print(f'{name:16} retention={cfg.ilm_retention_days}d')
          print('ilm delete phase:', PRODUCTION.ilm_policy()['policy']['phases']['delete']['min_age'])
          print('api key resolves:', bool(PRODUCTION.resolve_api_key()))
          print('all elastic profiles valid')
common_mistakes:
  mistake_1:
    description: |-
      Indexing detections with no explicit mapping and letting Elasticsearch guess field types
    why_it_happens: |-
      Elasticsearch accepts documents without a mapping and appears to work, so declaring types feels unnecessary.
    consequence: |-
      Facet fields are guessed as analysed text and cannot be aggregated, so Kibana dashboards that count by detector or verdict return wrong or empty buckets.
    correct_approach: |-
      Ship an explicit mapping that types facet fields as keyword and apply it at index creation, so the first document is aggregatable and dashboards work.
  mistake_2:
    description: Writing all detections to a single ever-growing index
    why_it_happens: |-
      One index is simpler to name and query, and the growth problem is invisible until the cluster is large.
    consequence: |-
      Queries slow, storage fills, and retiring old data means expensive per-document deletes from a live index -- the cluster eventually degrades.
    correct_approach: |-
      Write to daily time-based indices governed by a lifecycle policy, so time-scoped queries are efficient and old indices are dropped whole.
  mistake_3:
    description: Treating the Logstash transform as opaque config instead of a tested artifact
    why_it_happens: |-
      Pipeline config lives in Logstash, not the codebase, so the transform is edited there and never unit-tested.
    consequence: |-
      The mapping that decides whether Kibana can aggregate is unverified, and a subtle transform error surfaces only as broken dashboards later.
    correct_approach: |-
      Express the transform as a pure, tested function mirrored by the Logstash config, so the schema-to-document mapping is proven in isolation.
  mistake_4:
    description: Deploying the Elastic connector without an index lifecycle policy
    why_it_happens: |-
      Retention feels like a later operational concern, separate from getting detections flowing into Elasticsearch.
    consequence: |-
      Detection indices grow without bound and quietly fill the cluster, and the retention gap is discovered only when storage runs out.
    correct_approach: |-
      Make the ILM policy part of the connector config with a validated retention horizon, so deploying the connector deploys its bounded-footprint story.
section_summary:
  compact: |-
    Section 16.05 builds the third and final platform connector, integrating the detector suite with the Elastic Stack, and it foregrounds the piece the Splunk and Datadog connectors hid: an explicit transformation and indexing stage. Detections do not go straight into Elasticsearch; they pass through Logstash, which transforms each event into a well-formed document before indexing. The connector builds that transform as a first-class, testable artifact -- a pure Python function mirrored by the equivalent Logstash pipeline config -- that maps the detection-event schema onto an ECS-aligned Elasticsearch document: the ISO timestamp becomes @timestamp, the flat detection fields become top-level facets, the request context nests into a request object, and the document lands in a daily time-based index. The quiet load-bearing part is the explicit Elasticsearch mapping: without it Elasticsearch guesses types, guesses string facets as analysed text, and silently breaks every Kibana aggregation, so the connector declares detector, verdict, severity, and surface as keyword, @timestamp as date, and the scores as float, applied at index creation before any detection lands. Detections write to daily indices under an index lifecycle policy that the connector treats as first-class config -- a rollover period and a retention horizon that bound the data footprint automatically, so detection indices cannot quietly fill the cluster. The generated Sigma rules deploy as Elastic detection rules over the indexed documents, and the whole path is tested on a stub Logstash transport, with the transform proven as a pure function in isolation from delivery. With Elastic complete, the platform set -- Splunk, Datadog, Elastic -- is done.
  key_takeaways:
  - |-
    Elastic's distinguishing stage is Logstash: an explicit transform turns each detection into an ECS-aligned document
  - |-
    The transform is built as a pure, testable function mirrored by the production Logstash pipeline config
  - |-
    An explicit mapping typing facet fields as keyword is required, or Kibana aggregations silently break
  - |-
    Detections write to daily time-based indices under an ILM policy that bounds the data footprint automatically
  - |-
    The generated Sigma rules deploy as Elastic detection rules over the indexed documents
  - |-
    The transform that decides whether Kibana can aggregate is tested in isolation from the network delivery
preview_section_16_06:
  title: Custom SIEM Integration and Alert Enrichment
  summary: |-
    Section 16.06 completes the integration surface with the custom webhook path for any platform without a dedicated connector, and the alert enrichment pipeline that makes every delivered detection actionable. The webhook is a documented, versioned, HMAC-signed contract any endpoint can consume; the enrichment pipeline fills the schema's IOC and label slots with the Chapter 13 Section 13.11 entity, session, and graph context and attaches the response actions, turning a raw detection into an alert a responder can act on.
