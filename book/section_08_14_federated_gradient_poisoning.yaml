prose_content:
  - heading: 'The Federated Learning Threat Model: Untrusted Participants by Design'
    id: part_1_federated_learning_threat_model
    blocks:
      - type: prose
        text: >
          Federated learning is a training architecture in which a model is trained across many
          participants without centralising the raw training data. Each participant holds local
          data, computes gradient updates from that data against a shared model, and contributes the
          updates to a server (or to other participants in peer-to-peer variants). The server
          aggregates the updates into a new shared model and distributes it back. The training
          proceeds in rounds, with each round consisting of participant computation, contribution
          submission, server aggregation, and model redistribution. The principal data privacy
          property is that no participant's raw data is shared with any other participant or with
          the server.
      - type: prose
        text: >
          The threat model that emerges from this architecture is structurally different from
          centralised training. In centralised training, the attack surface is the data fed into the
          pipeline; the training operator is assumed trustworthy. In federated training, the data
          stays at participants and the attack surface is the gradient contributions themselves.
          Participants are typically untrusted by design: federated deployments often involve
          participants from multiple organisations (cross-silo) or from anonymous user populations
          (on-device), and structural trust between participants is absent. The defensive assumption
          is that some fraction of participants may be Byzantine -- contributing arbitrarily
          malicious gradients without any structural constraint on what they submit.
      - type: prose
        text: >
          The Byzantine participant capability matters because it is structurally more powerful than
          the data poisoning capability in centralised training. A data poisoner contributes
          training samples that influence the model through gradient descent on those samples; the
          influence is bounded by the gradient information present in the sample plus the
          aggregation pipeline. A Byzantine gradient contributor submits the gradient directly and
          can craft it to maximise effect: arbitrarily large magnitudes, directions explicitly
          engineered to shift the model toward attacker goals, patterns designed to evade
          aggregation defences. The gradient is a much higher-bandwidth attack channel than data,
          and Byzantine contributors can exploit this.
      - type: prose
        text: >
          The empirical scale of the threat is not theoretical. Cross-silo federated deployments
          involving tens to hundreds of participating organisations commonly assume some fraction
          may be adversarial -- driven by competitive considerations, malicious insider threats
          within participating organisations, or external compromise. On-device federated
          deployments involving millions of mobile devices assume that some fraction are
          adversary-controlled at any time -- compromised devices, malicious app installations, or
          coordinated adversary campaigns. The fraction varies by deployment but is typically
          nontrivial (1-10% is a common operational assumption); aggregating contributions while
          bounding Byzantine influence is the defensive problem.
      - type: prose
        text: >
          The threat model also has temporal structure. Federated learning operates over many
          rounds, sometimes hundreds or thousands. Adversaries can attack persistently across
          rounds, refining their gradient contributions based on observed model evolution, or
          strategically timing their attacks to maximise effect at specific training stages. The
          defensive infrastructure must operate continuously across rounds rather than as a one-time
          check.
      - type: prose
        text: >
          Section 8.14 covers the principal attack patterns and the Byzantine-robust aggregation
          defences that constitute the core federated learning security architecture. The treatment
          is necessarily compact compared to a full federated learning textbook; the focus is on the
          attack surface and defensive primitives that integrate with the broader Chapter 8
          framework. For deeper engagement, the foundational papers (Krum: Blanchard et al. 2017;
          trimmed mean and median: Yin et al. 2018; Bulyan: El Mhamdi et al. 2018; FoolsGold: Fung
          et al. 2018) provide additional mathematical depth. Section 8.14 establishes the
          operational framework that Section 8.15 production pipeline integrates.
  - heading: 'Gradient Poisoning Attack Patterns'
    id: part_2_gradient_poisoning_attack_patterns
    blocks:
      - type: prose
        text: >
          Gradient poisoning attacks fall into several structural categories, each with distinctive
          mechanics and defensive implications. The attack taxonomy informs aggregation defence
          selection: different aggregation methods have different coverage profiles against
          different attack patterns.
      - type: prose
        text: >
          The simplest gradient poisoning is direct Byzantine contribution. The adversary
          participates in federated learning as a single participant and submits gradient updates
          designed to shift the aggregated model toward attacker goals. The gradient may be a
          large-magnitude update in an attacker-chosen direction (overwhelming clean contributions),
          a backdoor-installation gradient (engineered to install trigger-target associations across
          rounds), or a model-degradation gradient (engineered to reduce model accuracy generally).
          Direct Byzantine contributions from a single participant are limited in effect by the
          aggregation: a single malicious contribution among many clean ones is typically averaged
          out at appropriate scales.
      - type: prose
        text: >
          Sybil attacks extend Byzantine contribution by having a single adversary control multiple
          participant identities. If the adversary creates many participant accounts (in on-device
          contexts) or compromises multiple participating devices (via malware or supply chain
          attack), each controlled identity contributes gradients that, when aggregated, sum to
          attacker-chosen direction. The adversary's effective influence scales with the number of
          controlled identities. For deployments where identity verification is weak (anonymous
          on-device contexts, public cross-silo without identity validation), Sybil attacks are
          operationally cheap and can scale to substantial fractions of contributions.
      - type: prose
        text: >
          Model replacement attacks engineer gradient contributions specifically to overwrite the
          aggregated model with attacker-chosen behaviour. The adversary computes the gradient that,
          when added to the current model under the deployed aggregation rule, produces a target
          model. For federated averaging (FedAvg), the gradient required to install attacker-chosen
          weights w* given current model w_t is approximately n * (w* - w_t), where n is the number
          of participants. With sufficient Sybil participants or sufficient single-participant
          gradient magnitude, the model replacement is achievable in a single round. Model
          replacement attacks are particularly dangerous because they bypass the defensive
          assumption that single-round contributions have bounded effect.
      - type: prose
        text: >
          Backdoor installation via federated gradient poisoning operates similarly to centralised
          backdoor attacks (Section 8.5) but with different attack economics. The attacker
          contributes gradients that encode trigger-target associations. The aggregated model
          gradually learns the associations across rounds. The attack budget required (in terms of
          fraction of Byzantine participants) depends on the aggregation rule: for FedAvg without
          robust aggregation, fractions as low as 1-2% can install backdoors over many rounds; for
          robust aggregation methods, the fraction must exceed specific thresholds (Krum requires
          more than one-third Byzantine to fail).
      - type: prose
        text: >
          Coordinated multi-round attacks combine the above. The adversary contributes gradients
          across many rounds with strategic timing, gradually refining backdoor installation while
          evading per-round anomaly detection. The contributions in any single round may not look
          anomalous; the aggregate effect across rounds is the attack. Detection that operates
          per-round may miss multi-round attacks; detection requires temporal analysis across
          rounds.
      - type: prose
        text: >
          Targeted attacks on specific participants extend the threat. In peer-to-peer federated
          variants, an adversary participating in the network can target other participants'
          contributions specifically: by strategically positioning their own contributions, they can
          amplify or cancel specific other participants' gradients. The attack is more sophisticated
          and requires more participation control, but it can produce specific outcomes beyond
          aggregate model corruption.
      - type: prose
        text: >
          The principal defensive response to all these attack patterns is Byzantine-robust
          aggregation, covered in the next part. The aggregation methods bound the influence
          individual or coordinated Byzantine participants can have on the aggregated update, with
          specific thresholds and assumptions that determine the coverage profile.
  - heading: 'Byzantine-Robust Aggregation: Bounded Influence Despite Malicious Participants'
    id: part_3_byzantine_robust_aggregation
    blocks:
      - type: prose
        text: >
          Byzantine-robust aggregation methods replace standard federated averaging (FedAvg) with
          aggregation rules that bound the influence of Byzantine participants. The methods provide
          mathematical guarantees: under specified conditions on the fraction of Byzantine
          participants and the structure of their attacks, the aggregated update is close to what
          clean aggregation would have produced. The conditions are critical -- Byzantine-robust
          aggregation works within specific regimes and fails outside them.
      - type: prose
        text: >
          The simplest robust aggregation is the coordinate-wise median. Instead of averaging
          participant gradients, take the median of each gradient coordinate across participants.
          The median is robust against outliers: Byzantine participants contributing extreme values
          for specific coordinates do not affect the median if their fraction is below 50%. The
          robustness is per-coordinate, which is computationally cheap and easy to implement, but
          provides limited protection against sophisticated attacks that distribute Byzantine
          influence across many coordinates with moderate magnitudes.
      - type: prose
        text: >
          Trimmed mean refines the median approach. Instead of taking the median, remove the top k
          and bottom k values per coordinate (where k is bounded by the assumed Byzantine fraction)
          and average the remaining values. Trimmed mean provides similar robustness to median with
          somewhat better utility on clean data: discarding only extreme values rather than always
          taking the middle. Trimmed mean breaks at higher Byzantine fractions than median
          (typically up to 50% with appropriate trimming) and provides moderate computational cost.
      - type: prose
        text: >
          Krum (Blanchard et al. 2017) takes a different approach: instead of coordinate-wise robust
          aggregation, select the single participant contribution that is closest to the majority of
          other contributions. The selection rule is structurally different: rather than aggregating
          contributions, choose one. The selected contribution is unlikely to be Byzantine if
          Byzantine participants comprise less than approximately one-third of total. Krum provides
          strong robustness within its regime but discards information from non-selected
          contributions, which has utility cost on clean data.
      - type: prose
        text: >
          Bulyan (El Mhamdi et al. 2018) extends Krum: apply Krum repeatedly to select multiple
          contributions, then apply trimmed mean over the selections. The combination provides
          better utility than Krum alone while maintaining similar Byzantine robustness. Bulyan
          operates with higher computational cost than simpler aggregation but produces strong
          empirical results on standard benchmarks.
      - type: prose
        text: >
          FoolsGold (Fung et al. 2018) addresses Sybil attacks specifically. The mechanism observes
          that Sybil participants tend to contribute similar gradients (because they share the same
          adversary's underlying attack logic). FoolsGold detects this similarity and downweights
          similar contributions, breaking the Sybil amplification effect. The method works well
          against Sybil attacks but is structurally different from Krum-family methods and may not
          be combined trivially.
      - type: prose
        text: >
          The coverage profile across these methods has several important patterns. All methods
          require an assumption about the maximum Byzantine fraction; their guarantees hold within
          the assumption and fail outside it. Median tolerates up to 50% Byzantine for individual
          coordinates but breaks under coordinated cross-coordinate attacks. Trimmed mean depends on
          trimming parameter; conservative trimming bounds Byzantine fraction tightly but discards
          more clean information. Krum requires below 33% Byzantine. Bulyan inherits Krum's
          threshold with better utility within it. FoolsGold tolerates higher Sybil fractions
          specifically but provides limited protection against non-Sybil Byzantine attacks. No
          method provides unconditional robustness; programme architecture must select the method
          appropriate to the assumed adversary fraction.
      - type: prose
        text: >
          The utility cost of robust aggregation also matters. Standard FedAvg converges fastest on
          clean data because it uses all gradient information efficiently. Robust methods discard
          information (Krum) or noise it (median, trimmed mean), reducing convergence speed and
          final accuracy. The cost varies by method and deployment: Krum has higher utility cost
          than trimmed mean; Bulyan reduces Krum's cost; FoolsGold has modest cost when Sybil
          fraction is low. Programmes balancing utility against robustness select methods
          accordingly.
      - type: prose
        text: >
          Operational deployment of robust aggregation requires several engineering decisions.
          Method selection based on assumed adversary fraction and attack patterns. Hyperparameter
          calibration (trimming fraction, Krum subset size, FoolsGold similarity threshold).
          Combination with non-aggregation defences (participant reputation, gradient anomaly
          detection) for layered coverage. Monitoring of adversary fraction estimates to detect when
          assumed bounds are exceeded. Section 8.14 deliverable 2 provides reference implementations
          of the principal methods with calibration guidance.
  - heading: 'Participant Reputation and Gradient Anomaly Detection'
    id: part_4_participant_reputation_and_gradient_anomaly_detection
    blocks:
      - type: prose
        text: >
          Byzantine-robust aggregation is the primary defensive layer for federated learning, but it
          operates per-round on contributions and does not directly identify Byzantine participants
          for exclusion. Two complementary defensive layers operate at participant identification:
          participant reputation tracking and gradient anomaly detection. Together with robust
          aggregation, they constitute the layered federated learning defensive architecture.
      - type: prose
        text: >
          Participant reputation tracking maintains scores for each participant based on observed
          contribution patterns across rounds. Participants whose contributions consistently align
          with the majority and produce reasonable model improvements accumulate reputation.
          Participants whose contributions are systematically anomalous, divergent, or correlated
          with model degradation accumulate negative signals. The reputation can be used in several
          ways: weighting contributions by reputation in aggregation, excluding participants whose
          reputation falls below thresholds, or routing low-reputation contributions to additional
          review.
      - type: prose
        text: >
          The reputation mechanism has several operational properties. It is adversary-aware:
          adversaries who know the reputation algorithm can attempt to game it by initially
          contributing benign updates to build reputation before pivoting to attack mode. The
          defence is to weight recent behaviour heavily relative to historical reputation, limiting
          the value of long-term reputation building. Reputation decay is also important: stale
          reputation from inactive participants should not accrue trust they did not earn through
          recent contribution. Reputation maintenance must handle cold start: new participants have
          no reputation history; the policy for handling new participants depends on deployment
          context (anonymous on-device may treat new participants conservatively; cross-silo with
          identity verification may extend trust based on organisational reputation).
      - type: prose
        text: >
          Sybil resistance in reputation systems is the principal challenge. Sybil adversaries can
          create many participant identities and have each accumulate independent reputation. The
          aggregate Sybil reputation can exceed any single legitimate participant's reputation,
          undermining the reputation defence. Sybil resistance in federated reputation requires
          either external identity verification (raising the cost of identity creation) or
          behaviour-based Sybil detection (identifying groups of identities that behave similarly
          enough to be likely adversary-controlled). FoolsGold-style similarity detection partially
          addresses behaviour-based Sybil in reputation; external identity verification is
          deployment-specific.
      - type: prose
        text: >
          Gradient anomaly detection operates on individual contributions per round, identifying
          contributions that deviate from expected patterns irrespective of participant identity.
          The anomaly detection compares each contribution against the distribution of clean
          contributions (which can be estimated from historical data, current-round majority, or
          held-out validation contributions). Contributions that are anomalously large in magnitude,
          anomalously directional, or anomalously sparse are flagged. The flagged contributions can
          be excluded from aggregation, downweighted, or routed to additional analysis.
      - type: prose
        text: >
          The anomaly detection signal is per-round and per-contribution; it complements reputation
          tracking which is multi-round and per-participant. Anomaly detection catches first-round
          Byzantine contributions before reputation can develop; reputation tracking catches
          multi-round patterns that any single round may not flag. The two layers cover different
          temporal scales of attack.
      - type: prose
        text: >
          The principal limitation of gradient anomaly detection is calibration. Distinguishing
          legitimate but unusual gradients (from participants with non-typical data distributions or
          training characteristics) from Byzantine gradients requires baselines that match expected
          legitimate variation. Insufficient baselines produce false positives that exclude
          legitimate participants; over-permissive baselines produce false negatives that include
          Byzantine contributions. Modern anomaly detection approaches use statistical methods
          (Mahalanobis distance, isolation forests) calibrated against historical contribution
          distributions, with tunable thresholds.
      - type: prose
        text: >
          The combined defensive architecture for federated learning therefore includes
          Byzantine-robust aggregation (primary defence, per-round bounded influence), participant
          reputation tracking (multi-round identification of Byzantine participants), and gradient
          anomaly detection (per-round identification of anomalous contributions). Each layer covers
          different attack patterns and time scales. The combination provides operationally
          meaningful coverage; deployments typically combine all three with weights and thresholds
          calibrated to the assumed adversary fraction. Section 8.14 deliverable 5 integrates the
          layers into a federated learning defensive harness.
  - heading: 'Privacy-Security Tradeoff and Deployment Context Variations'
    id: part_5_privacy_security_tradeoff_and_deployment_contexts
    blocks:
      - type: prose
        text: >
          Federated learning is often framed as inherently more secure than centralised training
          because raw data does not leave participant devices. The framing captures one privacy
          property correctly -- participant raw data privacy is preserved -- but elides the
          gradient-poisoning attack surface that centralised training does not have. The complete
          framing is that federated learning trades data centralisation risk for gradient poisoning
          risk; the tradeoff is favourable in some contexts and unfavourable in others depending on
          threat model.
      - type: prose
        text: >
          The favourable cases are where data centralisation risk dominates the threat model. For
          deployments with sensitive raw data subject to regulatory or competitive constraints
          (healthcare records, financial transactions, personal communications), centralising the
          data creates privacy and compliance exposures that outweigh the gradient-poisoning risk.
          Federated learning in these contexts provides genuine net defensive benefit: the
          gradient-poisoning attack surface is real but manageable through robust aggregation, while
          the data centralisation attack surface (data breach, insider exfiltration, compliance
          violation) is structurally larger and harder to defend.
      - type: prose
        text: >
          The unfavourable cases are where data sensitivity is moderate and the gradient-poisoning
          attack surface is operationally significant. For deployments with public or
          low-sensitivity data, centralising the data creates manageable risk and produces stronger
          training (no participant heterogeneity, no aggregation noise). Federated learning in these
          contexts adds attack surface without commensurate privacy benefit: the gradient-poisoning
          surface is real, the data privacy benefit is small, and centralised training with standard
          data governance provides better outcomes.
      - type: prose
        text: >
          The deployment context drives the threat model and defensive architecture. Cross-silo
          federated learning involves a small number of well-known organisational participants
          (typically 5-50 organisations). The threat model is dominated by individual participant
          compromise (one organisation's infrastructure compromised) and competitive adversarial
          behaviour (one organisation contributing biased gradients to manipulate the shared model
          in their favour). The defensive architecture emphasises participant identity verification,
          contractual enforcement, and Byzantine-robust aggregation tuned to the small participant
          count.
      - type: prose
        text: >
          On-device federated learning involves many anonymous participant devices (potentially
          millions). The threat model is dominated by Sybil attacks (adversary-controlled devices),
          supply-chain compromise (malicious app installations), and aggregate behaviour
          manipulation (large-scale coordinated contributions). The defensive architecture
          emphasises Sybil-resistant aggregation (FoolsGold), gradient anomaly detection at scale,
          and reputation systems robust to Sybil amplification.
      - type: prose
        text: >
          Privacy-preserving collaborative ML (variant of cross-silo) involves participants who
          specifically need data privacy, often for regulatory compliance (GDPR Article 6 lawful
          bases, HIPAA Privacy Rule, sector-specific). The threat model includes participant
          compromise plus regulatory non-compliance risk if the federated architecture leaks data
          unexpectedly. The defensive architecture emphasises differential privacy in addition to
          Byzantine robustness (DP-SGD applied at the federated level, providing both data privacy
          and gradient bounding), formal privacy accounting across rounds, and audit-ready
          compliance documentation.
      - type: prose
        text: >
          For organisations evaluating federated learning adoption, the operational decision
          involves matching deployment context to threat model and ensuring the defensive
          architecture covers the relevant attack surfaces. Adopting federated learning for the
          privacy benefit without commensurate gradient-poisoning defence produces a posture that is
          privacy-improved but security-degraded, which is typically not the intended outcome. The
          complete operational architecture includes Byzantine-robust aggregation (primary),
          participant reputation and gradient anomaly detection (secondary), and DP-SGD at the
          federated level (privacy-preserving across rounds). Section 8.15 production pipeline
          supports federated deployments through configurable defensive tracks.
      - type: prose
        text: >
          The integration with Sections 8.7-8.13 is also worth highlighting. Federated learning is
          sometimes deployed as the federated stage of LLM training: federated instruction-tuning
          across multiple organisations, federated fine-tuning of foundation models on
          organisationally-distributed data. In these contexts, the federated gradient-poisoning
          attack surface combines with the LLM-specific attack surfaces from Sections 8.7-8.8.
          Defensive coverage requires both layers: federated-specific (this section) and
          LLM-specific (Sections 8.7-8.8). Section 8.15 production pipeline integrates them where
          they overlap.
  - heading: 'Emerging Research and Remaining Challenges'
    id: part_6_emerging_research_and_remaining_challenges
    blocks:
      - type: prose
        text: >
          Federated learning security is an active research area with substantial ongoing
          development. The principal published methods and defences summarised in earlier parts
          represent the established core, but the field continues to develop in directions that
          affect operational deployment. Section 8.14 closes by identifying the principal emerging
          directions and remaining defensive challenges.
      - type: prose
        text: >
          One emerging direction is federated learning with secure aggregation. Secure aggregation
          protocols (cryptographic constructions where the server learns only the aggregated update,
          not individual participant contributions) provide additional privacy properties: the
          server cannot inspect individual participant gradients, which addresses certain inference
          attacks against participant privacy. Secure aggregation interacts with Byzantine
          robustness in subtle ways: most Byzantine-robust aggregation methods require the server to
          inspect individual contributions to identify outliers, which conflicts with the secure
          aggregation goal of hiding individual contributions. Recent research has produced hybrid
          protocols that achieve partial robustness under secure aggregation, but the combined
          coverage is weaker than either property alone. Programmes deploying both must accept
          partial coverage in each dimension.
      - type: prose
        text: >
          A second direction is federated learning with formal differential privacy. Applying
          DP-SGD-style noise addition at the federated level provides formal privacy guarantees plus
          gradient bounding. The privacy accounting across rounds is more complex than centralised
          DP-SGD because each round adds privacy cost and the total privacy budget must be managed
          across all rounds. Tools like the Privacy Accountant framework provide the necessary
          accounting. The defensive benefit combines: the per-round noise bounds Byzantine influence
          (Section 8.13 DP-SGD coverage extending to federated context); the multi-round privacy
          guarantee provides participant data privacy.
      - type: prose
        text: >
          A third direction is targeted defence against specific advanced attacks. Recent research
          has produced attack-specific defences for advanced Byzantine attacks: adaptive attacks
          that evolve in response to robust aggregation, model replacement attacks that exploit
          specific aggregation properties, and coalition attacks where multiple Byzantine
          participants coordinate explicitly. Each defence is targeted to a specific attack pattern;
          comprehensive coverage requires combining multiple defences with potentially conflicting
          requirements. The operational picture is increasingly complex; Section 8.14 deliverables
          target the established core but cite the research literature for advanced cases.
      - type: prose
        text: >
          A fourth direction is federated learning for foundation models specifically. Training
          large language models in federated settings involves distinct challenges: model size,
          communication cost, gradient heterogeneity across participants, and the LLM-specific
          attack surfaces from Sections 8.7-8.8. Recent work has addressed these through
          parameter-efficient federated training (federated LoRA), privacy-preserving instruction
          tuning, and federated RLHF variants. Defensive coverage in these contexts combines Section
          8.7-8.9 LLM-specific defences with Section 8.14 federated-specific defences; the
          integrated architecture is operationally complex and represents a significant deployment
          investment.
      - type: prose
        text: >
          The remaining defensive challenges include several open problems. Adversary fraction
          estimation: knowing the actual Byzantine fraction in deployment is necessary for selecting
          appropriate aggregation methods, but estimating it is difficult in practice. Conservative
          assumptions (high Byzantine fraction) provide stronger defence at higher utility cost;
          permissive assumptions (low fraction) provide better utility but fail if actual fraction
          exceeds. Adaptive aggregation that adjusts based on observed contribution patterns is a
          research direction with operational potential.
      - type: prose
        text: >
          Cross-round attack detection: per-round defences (robust aggregation, anomaly detection on
          round contributions) miss multi-round attacks that distribute their effect. Reputation
          systems partially address this but have Sybil vulnerabilities. Comprehensive cross-round
          attack detection that resists Sybil amplification is an open problem.
      - type: prose
        text: >
          Privacy-robustness tension: secure aggregation, differential privacy, and Byzantine
          robustness all provide distinct guarantees, but combining them produces composition costs.
          Each layer adds noise, computational cost, or coverage gaps; the total composition is
          weaker than any individual property. Designing federated systems with strong combined
          properties remains a research challenge with operational implications.
      - type: prose
        text: >
          For practitioners deploying federated learning, the operational implication is that
          defensive architecture must be designed for the specific deployment context and updated as
          research advances. Section 8.14 deliverables provide the established core; the production
          pipeline in Section 8.15 supports configurable extension as advanced defences become
          production-ready. The trajectory is toward stronger combined coverage; the current state
          is uneven and deployment-specific.
reference_materials:
  - heading: 'Federated Learning Attack Class Reference'
    id: federated_learning_attack_class_reference
    description: >
      Systematic reference for the principal federated learning attack classes, their mechanics,
      defensive primitives, and adversary fraction thresholds. Use for threat modelling and
      defensive architecture selection.
    table:
      columns:
        - 'Class Id'
        - Name
        - Mechanism
        - 'Attack Outcome'
        - 'Adversary Fraction Threshold'
        - 'Defensive Primitive'
        - 'Residual Risk After Defence'
      rows:
        - ['FED-BYZANTINE', 'Direct Byzantine contribution (single participant)', 'Adversary participates as one participant; submits arbitrarily malicious gradient', 'Single-round model perturbation in attacker direction; bounded by aggregation if alone', 'Limited effect at <5% by aggregation alone', 'FedAvg with magnitude clipping; modest robustness improvement', 'Low when isolated; accumulates with Sybil amplification']
        - ['FED-SYBIL', 'Sybil attack (multiple identities)', 'Single adversary controls many participant identities; aggregate contribution scales with controlled count', 'Effective Byzantine fraction proportional to controlled identities', 'Effective until exceeding ~33% (Krum); ~50% (median); FoolsGold-resistant', 'FoolsGold (similarity-based downweighting); identity verification; participant reputation with Sybil resistance', 'Moderate; sophisticated Sybil with diversified contributions can evade FoolsGold']
        - ['FED-REPLACEMENT', 'Model replacement attack', 'Adversary engineers gradients that overwrite aggregated model with attacker-chosen weights', 'Single-round complete model replacement (with sufficient adversary scale)', 'Achievable with high single-participant gradient magnitude or Sybil scale', 'Magnitude-bounded aggregation (clipping); robust aggregation; gradient anomaly detection', 'Low if magnitude bounds enforced; high without']
        - ['FED-BACKDOOR', 'Backdoor installation via gradient poisoning', 'Adversary contributes gradients encoding trigger-target associations across rounds', 'Backdoored aggregated model with trigger-conditional behaviour', '1-2% with FedAvg; higher with robust aggregation depending on method', 'Robust aggregation; gradient anomaly detection; cross-round behavioural analysis', 'Moderate; multi-round attacks may evade per-round defences']
        - ['FED-COORDINATED', 'Coordinated multi-round attack', 'Adversary contributes gradients across many rounds with strategic timing; per-round contributions look normal, aggregate effect is the attack', 'Cumulative model behaviour shift evading per-round detection', 'Variable; depends on attack design', 'Cross-round behavioural analysis; reputation tracking; periodic full audits', 'Moderate; cross-round detection less mature than per-round']
        - ['FED-TARGETED', 'Targeted attack on specific participant (peer-to-peer variants)', 'Adversary positions contributions to amplify or cancel specific other participants gradients', 'Specific participant influence manipulation; aggregate model effect attacker-specific', 'Sophisticated attacks possible at moderate fractions', 'Identity verification in peer-to-peer; gradient anomaly detection per-pair', 'Variable; less mature defensive infrastructure']
  - heading: 'Byzantine-Robust Aggregation Method Reference'
    id: byzantine_robust_aggregation_reference
    description: >
      Reference for the principal Byzantine-robust aggregation methods: mechanism, Byzantine
      fraction tolerance, utility cost, and operational properties. Use for aggregation method
      selection.
    table:
      columns:
        - Method
        - Mechanism
        - 'Byzantine Fraction Tolerance'
        - 'Utility on Clean'
        - 'Compute Cost'
        - 'Suitable for'
      rows:
        - ['FedAvg (baseline; not robust)', 'Average of all participant gradients', 'Effectively zero (averaging includes all contributions)', 'Maximum (uses all gradient information efficiently)', 'Minimal', 'Trusted-participant deployments only; not for production federated security']
        - ['Coordinate-wise median', 'Take median of each gradient coordinate across participants', 'Up to 50% per-coordinate; lower under cross-coordinate coordinated attacks', 'Reduced (median is less efficient than mean for clean data)', 'Low', 'Simple deployments with assumed moderate Byzantine fractions']
        - ['Trimmed mean', 'Remove top and bottom k values per coordinate; average remaining', 'Up to 50% with appropriate trimming', 'Better than median; depends on trimming fraction', 'Low', 'General-purpose deployments; tunable trimming based on adversary fraction']
        - ['Krum', 'Select single participant contribution closest to majority of others', 'Up to ~33%', 'Reduced (discards information from non-selected contributions)', 'Moderate (pairwise distance computation)', 'Deployments with low-to-moderate Byzantine fractions; strong robustness within regime']
        - ['Bulyan', 'Apply Krum repeatedly to select multiple contributions; trimmed mean over selections', 'Up to ~33% (Krum threshold)', 'Better than Krum (uses multiple selected contributions)', 'High (repeated Krum applications plus trimmed mean)', 'High-stakes deployments where utility matters; standard high-robustness choice']
        - ['FoolsGold', 'Detect similarity among contributions; downweight similar contributions to break Sybil amplification', 'High Sybil tolerance (specific to similar-contribution detection)', 'Modest cost when Sybil fraction is low', 'Moderate (similarity computation)', 'Deployments with significant Sybil risk; complementary to other methods']
