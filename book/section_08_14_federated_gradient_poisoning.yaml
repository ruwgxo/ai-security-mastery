common_mistakes:
  - subject: >
      Treating federated learning as inherently more secure than centralised training without
      defensive infrastructure
    id: mistake_1_treating_federated_as_inherently_secure
    entries:
      - label: 'Why It Happens'
        value: >
          Federated learning is often marketed as a privacy-preserving alternative to centralised
          training. The privacy framing is correct but incomplete: federated learning preserves
          participant data privacy while introducing gradient-poisoning attack surface.
          Practitioners adopting federated learning for the privacy benefit may neglect the
          gradient-poisoning defence. The result is a posture that is privacy-improved but
          security-degraded.
      - label: Consequence
        value: >
          Federated deployments use FedAvg (no Byzantine robustness) and assume participants are
          trustworthy. Byzantine attacks succeed at low fractions; backdoor installation is
          straightforward; the deployment is materially less secure than centralised alternatives
          despite the privacy framing.
      - label: 'Correct Approach'
        value: >
          Treat federated learning as introducing gradient-poisoning attack surface that requires
          defensive infrastructure. Deploy Byzantine-robust aggregation as standard. Section 8.14
          defensive architecture is mandatory, not optional. The privacy benefit and the security
          cost should both be understood when adopting federated.
  - subject: 'Deploying FedAvg (standard averaging) in production federated learning'
    id: mistake_2_fedavg_in_production
    entries:
      - label: 'Why It Happens'
        value: >
          FedAvg is the simplest aggregation method and the default in many federated frameworks.
          Practitioners using framework defaults inherit FedAvg without explicit decision. The
          mistake is that FedAvg has effectively zero Byzantine robustness; any Byzantine
          participant can shift the aggregated model proportionally to their contribution magnitude.
          In production deployments with untrusted participants, FedAvg is not a defensive choice.
      - label: Consequence
        value: >
          Federated deployments using FedAvg are vulnerable to single-Byzantine attacks at trivially
          low adversary fractions. Sybil amplification produces complete attack control. The
          deployment is structurally undefended.
      - label: 'Correct Approach'
        value: >
          Replace FedAvg with Byzantine-robust aggregation (Krum, Bulyan, trimmed mean, or FoolsGold
          for Sybil-heavy contexts) as standard for production deployments. FedAvg is appropriate
          only for trusted-participant or simulation contexts. Section 8.14 deliverable 2 provides
          production-ready replacements.
  - subject: 'Deploying federated learning without Sybil-resistance measures'
    id: mistake_3_ignoring_sybil_resistance
    entries:
      - label: 'Why It Happens'
        value: >
          Sybil attacks require adversaries to control multiple identities, which may seem
          operationally costly. Practitioners may underestimate Sybil cost, particularly in
          on-device contexts where account creation is free or cheap. Sybil attacks are
          operationally cheap in many federated contexts, and without Sybil resistance, all
          Byzantine fraction assumptions become invalid.
      - label: Consequence
        value: >
          Sybil-amplified attacks bypass Byzantine fraction thresholds. Krum-based defences fail
          when adversary controls more than 33% of identities; this is achievable through Sybil at
          low cost. The deployment defends against assumed adversary fractions but not actual
          Sybil-amplified fractions.
      - label: 'Correct Approach'
        value: >
          Deploy Sybil resistance: identity verification where deployment context allows,
          FoolsGold-style behaviour-based Sybil detection where it does not, and reputation systems
          with Sybil resistance. Section 8.14 deliverable 3 includes Sybil cluster detection. The
          combined defensive architecture must address Sybil amplification, not just direct
          Byzantine attacks.
  - subject: >
      Selecting aggregation methods based on static Byzantine fraction assumption without monitoring
      actual fraction
    id: mistake_4_static_byzantine_fraction_assumption
    entries:
      - label: 'Why It Happens'
        value: >
          Method selection requires assuming a Byzantine fraction. Practitioners pick a fraction at
          deployment time and stick with it. The mistake is that adversary fraction can change over
          deployment lifetime: new compromises occur, attack campaigns scale up, defensive
          countermeasures shift attacker behaviour. A method appropriate for the initial assumed
          fraction may be inadequate later.
      - label: Consequence
        value: >
          Aggregation method becomes inadequate as adversary fraction shifts. The defensive
          architecture is not retuned, and the deployment becomes vulnerable to attacks that the
          original method would have caught at higher tolerance levels.
      - label: 'Correct Approach'
        value: >
          Monitor actual adversary fraction estimates through anomaly detection signals, reputation
          distributions, and attack campaign indicators. Re-tune aggregation method when fraction
          estimates exceed method tolerance. Section 8.14 deliverable 5 includes adaptive
          monitoring; Section 8.15 production pipeline integrates the monitoring as standard
          discipline.
  - subject: >
      Deploying per-round defences (robust aggregation, gradient anomaly) without multi-round
      behavioural analysis
    id: mistake_5_per_round_only_defence
    entries:
      - label: 'Why It Happens'
        value: >
          Per-round defences are computationally efficient and conceptually simple: each round is a
          defensive event. Practitioners deploy per-round defence as their architecture. The mistake
          is that sophisticated attacks distribute their effect across many rounds; per-round
          contributions look normal, aggregate effect is the attack. Per-round defences miss
          multi-round patterns.
      - label: Consequence
        value: >
          Coordinated multi-round attacks (FED-COORDINATED) succeed undetected. Backdoor
          installation across rounds (FED-BACKDOOR) at sub-per-round-detection magnitudes
          accumulates over training. Per-round defensive metrics look clean while the model is being
          progressively compromised.
      - label: 'Correct Approach'
        value: >
          Combine per-round defences with multi-round behavioural analysis: cross-round model
          behavioural drift detection, participant reputation tracking, periodic full audits of
          aggregated model. Section 8.14 deliverable 5 integrates the layers; Section 8.15
          production pipeline includes cross-round monitoring as standard discipline.
section_summary:
  compact: >
    Federated learning distributes training across many participants without centralising raw data,
    and the distribution makes the gradient contribution interface the principal attack surface. Six
    attack classes structure the threat: direct Byzantine contribution, Sybil attacks, model
    replacement, backdoor installation via gradient poisoning, coordinated multi-round attacks, and
    targeted attacks in peer-to-peer variants. Adversary fraction is the principal defensive
    parameter: methods like Krum and Bulyan provide strong robustness up to ~33% Byzantine, median
    and trimmed mean up to ~50%, FoolsGold tolerates higher Sybil fractions specifically.
    Byzantine-robust aggregation is the primary defensive layer; participant reputation tracking and
    gradient anomaly detection are secondary layers; differential privacy at the federated level
    provides combined privacy and bounding benefits. The privacy-security tradeoff is structural:
    federated learning trades data centralisation risk for gradient poisoning risk; the tradeoff is
    favourable when data sensitivity dominates and unfavourable otherwise. Deployment contexts
    (cross-silo, on-device, privacy-preserving collaboration, federated LLM training) have
    distinctive threat models and defensive architectures; Section 8.14 deliverables provide
    configurable infrastructure for the principal contexts. Federated learning extends the Chapter 8
    framework to decentralised training; Section 8.15 production pipeline integrates federated
    defences with centralised defences (Sections 8.7-8.13) as configurable production tracks.
  key_takeaways:
    - 'Federated learning shifts attack surface from data validation to gradient aggregation; defensive responsibility shifts correspondingly'
    - 'Byzantine-robust aggregation is mandatory; FedAvg is inappropriate for production federated security'
    - 'Aggregation method selection depends on assumed Byzantine fraction: Krum/Bulyan for ~33%, median/trimmed mean for ~50%, FoolsGold for Sybil-heavy'
    - 'Sybil resistance is structurally required; Sybil amplification breaks Byzantine fraction assumptions otherwise'
    - 'Layered defence: robust aggregation (per-round primary) + reputation (multi-round) + anomaly detection (per-round) + DP-SGD (privacy plus bounding)'
    - 'Privacy-security tradeoff is structural; federated learning is privacy-improved but introduces gradient-poisoning surface'
    - 'Multi-round behavioural analysis catches what per-round defences miss; cross-round monitoring is mandatory for sophisticated threat models'
    - 'Deployment context (cross-silo vs on-device vs privacy-preserving vs federated LLM) drives threat model and defensive architecture'
next:
  kind: section
  target: '15'
  title: 'Production Auditing Pipeline: Capstone Integration'
  summary: >
    Sections 8.7 through 8.14 established the complete attack catalogue (data-pipeline poisoning,
    supply chain attacks, federated gradient poisoning) and the defensive infrastructure (detection
    primitives, defensive training, Byzantine-robust aggregation). Section 8.15 capstones Chapter 8
    by integrating everything into a production auditing pipeline: a concrete CI/CD architecture
    that organisations deploy to cover the full Chapter 8 threat model. The pipeline has four
    principal tracks -- instruction-tuning auditing (Section 8.7), preference auditing (Section
    8.8), supply chain auditing (Sections 8.9-8.11), and runtime detection (STRIP from Section 8.12)
    -- with federated extensions for decentralised deployments. Each track is the operational form
    of detection primitives plus defensive training plus supply chain controls covered in earlier
    sections. The pipeline produces compliance evidence, defensive metrics, and incident-response
    artifacts. Section 8.15 is the longest section in Chapter 8 (estimated 8 pages) because it is
    the operational artifact that makes the chapter usable in production contexts. Section 8.16 then
    synthesises the chapter and previews Chapter 9.
