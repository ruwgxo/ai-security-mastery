deliverables:
  deliverable_1:
    title: The Case Study Analysis Method
    filename: (section reference -- analysis method, not code)
    description: |-
      The four-part incident-detection-response-lessons method every case study follows, the honest account of the composite evidence base, and the case-to-stack mapping showing how each case exercises the Part 1 to 4 layers. This is the analytical framework the chapter's five cases apply, presented as the reference tables above rather than as code, because 18.01 defines the method the subsequent sections execute.
    implementation_notes: |-
      No standalone Python: this chapter is analysis and playbooks, not runnable modules, and this section is the method anchor. Its deliverables are the analysis structure, the evidence convention, and the case-to-stack mapping given in the reference materials, plus the response-playbook and architecture-recommendation templates below. This mirrors the anchor sections 15.01, 16.01, and 17.01, which defined the structure their chapters then built out.
    code: |
      # Section 18.01 is the case-study method anchor and has no runnable code
      # deliverable. Chapter 18 is analysis and playbooks -- the deliverables are the
      # method, the evidence convention, and the templates below.
      #
      # The incident-detection-response-lessons method, as a template each case fills:
      #
      #   INCIDENT   : the attack, its domain context, and the attacker's goal
      #   DETECTION  : which Part 1-4 layers caught it, in what order, and why
      #   RESPONSE   : containment, SIEM enrichment/escalation, human decisions, playbook
      #   LESSONS    : what held, what was strained, what transfers to the reader's context
      #
      # The response-playbook template each case produces:
      #
      #   TRIGGER    : the detection condition that opens the playbook
      #   CONTAIN    : the immediate automated action (block, quarantine, rate-limit)
      #   ENRICH     : the context attached for the responder (entity, session, graph, IOCs)
      #   ESCALATE   : who is notified and the domain's compliance/reporting obligations
      #   RECOVER    : restoring normal operation and confirming the threat is closed
      #   REVIEW     : feeding the disposition back into the tuning loop (Chapter 17)
      #
      # The architecture-recommendation template each case produces:
      #
      #   OBSERVED   : what the case revealed about the attack class
      #   PATTERN    : the architecture pattern that addresses it
      #   LAYERS     : which Part 1-4 layers the pattern combines
      #   TRADEOFFS  : the cost, latency, and compliance considerations
      #
      # The evidence convention, stated once for the whole chapter: the cases are
      # composite scenarios representative of real deployments, not write-ups of
      # specific proprietary incidents, and no claim is made stronger than the
      # construction supports.
      print('Section 18.01: case study method -- see reference tables and templates.')
common_mistakes:
  mistake_1:
    description: |-
      Judging a detection system by its design rather than its performance against real attacks
    why_it_happens: |-
      A clean architecture with well-separated layers and passing tests feels like proof the system works.
    consequence: |-
      The system is validated only on its own terms -- test sets it was built against -- and its behaviour against real, adapting attacks at production scale is untested until an incident reveals it.
    correct_approach: |-
      Validate the assembled system against real attacks in real conditions, as these case studies do, because performance against the adversary is the only validation that ultimately counts.
  mistake_2:
    description: Analysing an incident as a story rather than through a consistent method
    why_it_happens: |-
      Each incident is vivid and unique, so it is natural to recount it on its own terms as a narrative.
    consequence: |-
      Five incidents told five ways cannot be compared, so the pattern across them -- the recurring principles that are the real lesson -- never becomes visible.
    correct_approach: |-
      Analyse every incident through the same incident-detection-response-lessons structure, so the cases are comparable and the cross-case principles can be extracted.
  mistake_3:
    description: Presenting composite or illustrative cases as real proprietary incidents
    why_it_happens: |-
      Claiming real telemetry and named breaches sounds more authoritative and convincing.
    consequence: |-
      The claim is unverifiable and, if the data were real, publishing it would expose the very organisations the system protects -- and overstating evidence betrays the measurement discipline the book teaches.
    correct_approach: |-
      Label composite cases clearly as representative constructions, make them as concrete as honesty allows, and claim nothing stronger than the construction supports.
  mistake_4:
    description: Treating a real attack as exercising one detection layer in isolation
    why_it_happens: |-
      Each detector was built and tested separately, so it is tempting to attribute a catch to a single layer.
    consequence: |-
      The analysis misses how the layers actually combine -- a per-request miss caught by the behavioural layer, accuracy held by the deployment -- which is where the system's real strength lies.
    correct_approach: |-
      Analyse each case across the whole Part 1 to 4 stack, tracing which layers the attack exercised and how they combined, because a real attack is caught by the interaction of layers, not one alone.
section_summary:
  compact: |-
    Section 18.01 anchors the book's closing chapter by establishing the method for validating the complete detection system against real attacks. The governing claim is that a detection system is validated not by its design but by its performance against the attacks it exists to stop, so the chapter's five case studies put the whole assembled Part 1 to 4 stack in front of real attack classes rather than validating any layer in isolation. The method has three pillars. First, a consistent four-part analysis structure -- incident, detection, response, lessons -- applied identically to all five cases, so they can be read comparably and the concluding section can extract the principles that recur across them; a story is not analysis, and the shared structure is what makes the cases rigorous. Second, an honest account of the evidence: the cases are composite scenarios constructed to be representative of real deployments and grounded in the documented behaviour of each attack class, not write-ups of specific proprietary incidents or dumps of real telemetry, and this framing is the correct choice both because publishing real breach data would expose the organisations the system protects and because honesty about evidence is itself the measurement discipline the book has taught throughout -- no claim is made stronger than the construction supports. Third, the organising through-line that each case exercises the full stack: the per-request detectors of Chapter 15, the behavioural analysis of Chapter 13, the deployment of Chapter 14, the integration of Chapter 16, and the tuning of Chapter 17 combine against each attack, so the reader sees the system's real strength in the layering rather than in any single detector. The five cases span financial-services, healthcare, and e-commerce, because the domain shapes the response through compliance and context, and each produces an analysis, a response playbook, and an architecture recommendation.
  key_takeaways:
  - |-
    A detection system is validated by its performance against real attacks, not by the elegance of its design
  - |-
    Every case follows the same incident-detection-response-lessons method, so the cases are comparable and their principles extractable
  - |-
    The cases are composite scenarios representative of real deployments, labelled honestly -- no claim stronger than the construction supports
  - |-
    Honesty about evidence is itself a security discipline, continuous with the book's insistence on measuring the true distribution
  - |-
    Each case exercises the full Part 1 to 4 stack, so the reader sees the layers combine rather than act in isolation
  - |-
    The cases span financial-services, healthcare, and e-commerce because the domain shapes the response through compliance and context
