prose_content:
  part_1:
    title: Why the Book Closes with Case Studies
    body: |-
      A detection system can be beautifully designed and still fail. It can have a clean architecture, well-separated layers, thorough tests, and a tuning loop, and none of that is proof that it stops attacks -- it is proof that it is well-built, which is a different thing. The only validation that ultimately counts is performance against the attacks the system exists to catch, in the conditions it will actually run in: real traffic, real scale, real adversaries who adapt. Every chapter of this book validated a component on its own terms -- the injection detector against injection test sets, the multi-turn analysis against constructed escalations, the deployment against latency budgets. This chapter does the thing none of those could: it puts the whole system, assembled, in front of real attacks and watches it work.

      That is why case studies are the right closing form. A final chapter that summarised the architecture would restate what the reader already built; a final chapter that added another component would imply the system was incomplete. Instead, this chapter validates. It takes the complete system -- the ML foundations of Part 1, the detection engineering of Parts 2 and 3, the deployment of Part 3, and the practical implementation of Part 4 -- and shows it operating as one thing against five classes of real attack. The reader has spent the book building; here they see what they built prove itself, and that is both the most convincing validation and the most useful thing to carry forward, because it shows not just that the pieces work but how they combine under fire.
  part_2:
    title: 'The Analysis Method: Incident, Detection, Response, Lessons'
    body: |-
      Five case studies told five different ways would be five stories, and stories are not analysis. What makes the cases a rigorous validation rather than a collection of war tales is that every one follows the same four-part method, so they can be read comparably and the pattern across them becomes visible. The first part is the incident: what the attack was, how it presented in the traffic, what the attacker was trying to achieve, and the domain context it occurred in. This is the setup, described concretely enough to be analysed but framed as the situation the system faced. The second part is detection: which layers of the system saw the attack, in what order, and why -- the heart of each case, because it is where the system's design meets the attack's reality and where the reader learns which layer catches which thing.

      The third part is response: what happened once the attack was detected -- the immediate containment, the enrichment and escalation through the SIEM integration, the human decisions, and the playbook that structured them. Detection without response is an alarm no one acts on, so the response is a first-class part of each case. The fourth part is lessons: what the case teaches, both about the specific attack class and about the system as a whole -- what held up, what was strained, what would be done differently. The lessons are where each case stops being a report and becomes a transferable principle. This four-part structure is applied identically to all five cases, and that consistency is deliberate: it lets the concluding section (18.07) lay the five analyses side by side and extract the principles that recur across all of them, which is the chapter's ultimate payload.
  part_3:
    title: 'The Evidence Base: An Honest Account'
    body: |-
      A chapter that validates a system against real attacks has to be scrupulous about what its evidence actually is, because the whole value of validation collapses if the evidence is not what it claims to be. So this section states the matter plainly. The case studies in this chapter are composite scenarios: they are constructed to be representative of real deployments and real attack patterns -- the kinds of injection, jailbreak, PII leakage, and abuse that production LLM systems genuinely face -- but they are not write-ups of specific, identifiable, proprietary incidents at named organisations. The corpus they draw on is a representative construction assembled to illustrate detection at production scale, not a dump of real customer telemetry. The attacks, payloads, and timelines are realistic and grounded in the documented behaviour of these attack classes; they are illustrative composites, and this chapter labels them as such rather than dressing them as forensic reports.

      This framing is not a limitation to apologise for -- it is the correct and more useful choice, for two reasons. First, publishing real incident telemetry from production deployments would expose the very organisations and users the detection system is meant to protect; a security book that leaked the details of real breaches to make its case would be violating the principle it teaches. Composite cases let the analysis be specific and concrete without that harm. Second, and more importantly, honesty about evidence is itself a security discipline. This book has argued throughout for measuring on the true distribution, for not overstating what a detector's numbers mean, for the base-rate problem that undoes precision claims -- all of it a discipline of not believing more than the evidence supports. A final chapter that claimed a precision of some exact figure against ten thousand real attacks, unverifiably, would betray that discipline at the last moment. The composite framing keeps faith with it: the cases are as real as they can honestly be made, labelled as what they are, and no stronger claim is made than the construction supports. A reader learns the method and the principles, which transfer to their real incidents, without being asked to take fabricated metrics on faith.
  part_4:
    title: How Each Case Exercises the Whole Stack
    body: |-
      The organising claim of the chapter is that each case exercises the full Part 1 to 4 stack, and this is what separates the case studies from five isolated feature demos. A real attack does not politely present itself to one detector and wait to be caught; it arrives as traffic, hits whatever layer is in its path first, and is caught -- or missed -- by the interaction of the layers. So each case is analysed across the whole system. The per-request detectors of Chapter 15 -- injection, jailbreak, PII, toxicity -- are the first line, catching what is visible in a single request. The behavioural analysis of Chapter 13 -- entity risk, session tracking, the coordinated-group graph -- catches what only appears across requests: the gradual multi-turn escalation, the exfiltration campaign of individually-benign queries, the coordinated network of individually-clean accounts. The deployment engineering of Chapter 14 is what lets both operate at production scale and latency. The SIEM integration of Chapter 16 is how the detection becomes an actioned alert. And the monitoring and tuning of Chapter 17 is the assumed operational context that keeps the whole thing effective.

      Each case foregrounds the layers most relevant to its attack -- the injection case leans on the injection detector and the behavioural layer, the abuse case on the entity and graph families, the at-scale cases on the deployment engineering -- but each shows the layers combining rather than any one acting alone. This is the deepest lesson the cases teach and the one hardest to convey any other way: the system's strength is not in any single detector but in the layering, where a per-request detector's miss is caught by the behavioural layer, where the deployment lets accuracy hold under load, where the integration turns a detection into a response. A reader who has built the layers separately sees here, for the first time, why they were built to work together. The case-to-stack mapping is stated for each case so the reader can trace exactly which layers the attack exercised.
  part_5:
    title: Domains, Deliverables, and the Chapter Roadmap
    body: |-
      The five cases are set in three domains -- financial services, healthcare, and e-commerce -- and the domain is not decoration. It shapes the response through compliance and context. A PII leak in a healthcare setting is not merely a security incident but a regulatory one, with reporting obligations and handling constraints that change what the response must do. An enterprise financial-services deployment carries compliance requirements that shape how the detection system is configured and how incidents are documented. An e-commerce chatbot faces the distributed, coordinated abuse -- bot networks, Sybil accounts -- that targets consumer-facing services at scale. The same attack class is detected and handled differently depending on the domain it lands in, and the cases are placed across domains deliberately so the reader sees that the response is domain-aware, not generic. A detection system deployed without regard to its domain's compliance and context is a detection system that will be technically correct and operationally wrong.

      Each case produces three concrete artifacts beyond its analysis: a documented account of the incident and its handling, a response playbook that structures how that attack class is dealt with, and an architecture recommendation drawn from what the case revealed. These are the transferable outputs -- a reader facing a real version of one of these attacks has a playbook to adapt and an architecture pattern to apply. The chapter then proceeds through the five cases in turn: enterprise LLM deployment security (18.02), prompt injection at scale (18.03), jailbreak prevention in production (18.04), PII leakage prevention (18.05), and model abuse detection (18.06). The concluding section (18.07) lays the five analyses side by side, extracts the best practices and the recurring principles that held across all of them, reviews the complete Part 1 to 4 system, and closes the book. With the method, the evidence framing, and the roadmap established, the first case study puts the system to work.
