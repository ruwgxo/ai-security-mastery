  - heading: 'Budget-Effectiveness Reference Curves by Attack Family'
    id: budget_effectiveness_reference
    description: >
      Approximate relationship between contamination budget and attack success for each major attack
      family, based on published research. Use for threat modelling to estimate whether a given
      adversary budget is sufficient for a given attack.
    parts:
      - heading: Curves
        id: curves
        blocks:
          - type: fields
            subject: 'Random label flipping (untargeted availability)'
            entries:
              - label: 'Budget for 10 Percent Degradation'
                value: '5% contamination'
              - label: 'Budget for 50 Percent Degradation'
                value: '20% contamination'
              - label: 'Budget for Near Total Degradation'
                value: '40%+ contamination'
              - label: Notes
                value: 'Linear relationship between contamination and effect; requires large budgets'
          - type: fields
            subject: 'Targeted label flipping (targeted availability)'
            entries:
              - label: 'Budget for Target Class Collapse'
                value: '5% to 10% of target class samples'
              - label: Notes
                value: >
                  Effect concentrates in target class; budget is relative to target class size, not
                  full dataset
          - type: fields
            subject: 'Clean-label targeted poisoning (Poison Frogs family)'
            entries:
              - label: 'Budget for Targeted Misclassification'
                value: '0.5% to 3% contamination'
              - label: Notes
                value: >
                  Effect depends on feature-collision quality; budget is less than label-flipping
                  for equivalent targeted effect
          - type: fields
            subject: 'BadNets-style backdoor attacks'
            entries:
              - label: 'Budget for Reliable Trigger Activation'
                value: '0.1% to 1% contamination'
              - label: Notes
                value: 'Small budget suffices for high attack success rate; clean accuracy preserved'
          - type: fields
            subject: 'Advanced backdoors (invisible, dynamic, composite)'
            entries:
              - label: 'Budget for Reliable Trigger Activation'
                value: '0.05% to 1% contamination'
              - label: Notes
                value: >
                  Similar budget to BadNets; additional cost in trigger construction, not in
                  contamination rate
          - type: fields
            subject: 'LLM instruction-tuning backdoors'
            entries:
              - label: 'Budget for Trigger Activation'
                value: '0.01% to 0.5% of instruction-tuning data'
              - label: Notes
                value: 'LLM memorisation capacity means very low budgets can succeed; often less than classical ML'
          - type: fields
            subject: 'RLHF preference contamination'
            entries:
              - label: 'Budget for Alignment Shift'
                value: '1% to 5% of preference pairs'
              - label: Notes
                value: 'Effect propagates through reward model to policy; budget measured in annotation pairs'
          - type: fields
            subject: 'LoRA adapter poisoning'
            entries:
              - label: 'Budget Per Attack'
                value: 'Full adapter (one malicious adapter per attack)'
              - label: Notes
                value: 'Not a contamination-budget attack; adapter distribution is the attack vector'
