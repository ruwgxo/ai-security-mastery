prose_content:
  - heading: 'The Two Axes: Attack Goal and Attack Scope'
    id: part_1_two_axes
    blocks:
      - type: prose
        text: >
          Training-time attacks vary across many dimensions -- the specific technique used, the
          training stage targeted, the adversary access level, the persistence properties. But two
          of these dimensions carry most of the architectural weight in determining what the
          adversary achieves and what the defender observes. These are the attack goal and the
          attack scope, and together they produce the four-quadrant taxonomy that organises the
          entire chapter.
      - type: prose
        text: >
          The attack goal axis distinguishes between two fundamentally different objectives an
          adversary may pursue. Availability attacks aim to degrade the model's usefulness across
          the entire input distribution -- the poisoned model performs worse on every task it was
          trained for, or on a broad subset of them. The effect is visible in aggregate metrics:
          validation accuracy drops, precision-recall curves degrade, users notice that the model
          'got dumber'. The attack can be thought of as denial-of-service at the learning level --
          the model is still running, still responding, but its outputs are systematically less
          correct than before.
      - type: prose
        text: >
          Integrity attacks aim for targeted misbehaviour on specific inputs while preserving
          correct behaviour on the rest of the distribution. The poisoned model passes aggregate
          evaluation with no detectable accuracy loss. Standard benchmarks produce clean-looking
          numbers. The attack is invisible to any monitoring that measures average-case performance.
          The effect manifests only on the narrow set of inputs the attacker cares about -- the
          specific class the attacker wants misclassified, the specific trigger pattern the attacker
          embedded, the specific question the attacker wants answered incorrectly. Every other input
          produces correct output, which is why integrity attacks pass evaluation.
      - type: prose
        text: >
          This distinction is not a matter of degree. It determines what signals the defender can
          use. Availability attacks move aggregate metrics, so defenders can detect them by
          monitoring aggregate metrics -- a 3% drop in validation accuracy between training runs is
          a signal. Integrity attacks do not move aggregate metrics, so aggregate-metric monitoring
          is structurally blind to them. The defender needs targeted detection -- specifically
          looking for triggers, inspecting activations for anomalies on probe inputs, auditing
          training data for feature-space outliers. The detection architecture changes with the
          quadrant.
      - type: prose
        text: >
          The attack scope axis distinguishes between attacks directed at specific outputs and
          attacks that produce arbitrary incorrect behaviour. Targeted attacks specify in advance
          what the adversary wants the model to do -- classify this specific image as that specific
          class, respond to this specific prompt with that specific output, refuse requests matching
          this specific pattern. The target is an attacker-chosen function from input to output.
          Untargeted attacks do not specify a target output -- any incorrect output counts as
          success. The adversary's goal is degradation, not redirection.
      - type: prose
        text: >
          Scope interacts with goal in non-obvious ways. An availability attack is naturally
          untargeted at the sample level (degrade accuracy across the distribution) but may be
          targeted at the class level (specifically degrade one class's performance). An integrity
          attack is naturally targeted at some level (attacker picks which inputs behave wrongly and
          which behave correctly) but varies in specificity from targeting single inputs to
          targeting entire classes or trigger-bearing distributions.
      - type: prose
        text: >
          The two axes crossed produce four quadrants. Each quadrant has distinct characteristic
          attack techniques, detection profiles, and economic properties. The remainder of this
          section walks each quadrant in order.
  - heading: 'Quadrant 1: Untargeted Availability Attacks -- The Loud Quadrant'
    id: part_2_untargeted_availability
    blocks:
      - type: prose
        text: >
          The untargeted-availability quadrant contains attacks that aim to degrade model
          performance across the distribution without targeting specific inputs. The canonical
          example is random label flipping at high contamination rates -- the attacker flips a
          random subset of training labels, the model learns a corrupted decision boundary,
          aggregate accuracy drops proportionally to the contamination rate. The attacker does not
          choose which specific predictions are wrong; the attacker only controls how wrong the
          model is on average.
      - type: prose
        text: >
          Attacks in this quadrant are what the security community typically pictures when it first
          encounters training-time attacks. They are the mechanism most compatible with intuitive
          analogies to software denial-of-service: the system is still running, but its outputs are
          less useful. They are also the attacks that are easiest to demonstrate in research papers
          -- the effect is visible on standard benchmarks, the attack succeeds or fails by a single
          measurable number (accuracy delta), and the mechanism is conceptually simple.
      - type: prose
        text: >
          From a defender's perspective, this is the easiest quadrant. The signal is loud. Aggregate
          accuracy monitoring catches these attacks by design. Version-to-version regression testing
          of trained models -- the practice of evaluating each new model version against the prior
          version's benchmark scores -- catches most untargeted availability attacks before
          deployment. Label consistency auditing (Section 8.3) catches the random-flip variant
          specifically. These defences are not novel; they overlap substantially with standard ML
          evaluation hygiene.
      - type: prose
        text: >
          From an attacker's perspective, this is the least interesting quadrant. The blast radius
          per successful attack is unfocused -- the adversary cannot choose which users are
          affected, which predictions are wrong, or what the wrongness looks like. The economic
          return is poorly targeted. An adversary who wants to cause specific harm (misclassify a
          specific image, produce a specific output for a specific prompt, leak a specific piece of
          information) cannot achieve it through untargeted availability. An adversary who wants to
          simply disrupt operations can sometimes justify the attack, but disruption is rarely the
          adversary's primary goal in training-time contexts -- it is easier and cheaper to disrupt
          at inference time, via API abuse or rate exhaustion, than at training time.
      - type: prose
        text: >
          The quadrant is therefore well-represented in the research literature because it is easy
          to study, but under-represented in documented real-world incidents because it is
          economically unattractive to motivated adversaries. The defender takeaway is that
          detection investment here should be proportional to the threat weight: aggregate accuracy
          monitoring is mandatory (it is inexpensive), but heavy investment in availability-specific
          detection primitives is rarely the highest-leverage use of the security budget. The
          interesting threats are in the other three quadrants.
  - heading: 'Quadrant 2: Targeted Integrity Attacks -- The Backdoor Quadrant'
    id: part_3_targeted_integrity
    blocks:
      - type: prose
        text: >
          The targeted-integrity quadrant is where backdoor attacks live, and it is the most
          important quadrant in the Chapter 8 threat model. Attacks in this quadrant produce
          attacker-chosen behaviour on attacker-chosen inputs while preserving correct behaviour
          everywhere else. The model passes aggregate evaluation. The validation accuracy is
          indistinguishable from a clean model. Standard benchmarks produce clean numbers. The
          attack is invisible to any detection that relies on aggregate-metric degradation.
      - type: prose
        text: >
          The paradigmatic example is a BadNets-style backdoor (explored in depth in Section 8.5).
          The attacker inserts training samples that pair a specific trigger pattern with a specific
          target class. The model learns that when the trigger is present, output this class; when
          the trigger is absent, output the correct class. The clean accuracy is preserved -- the
          model generalises normally on trigger-free inputs. The attack success rate is very high --
          close to 100% on trigger-bearing inputs. And the contamination budget required is small,
          typically 1% or less of the training data. The attack is economically rational, stealthy
          by design, and produces exactly the attacker-chosen outcome on attacker-chosen inputs.
      - type: prose
        text: >
          The trigger does not have to be a visible patch on an image. Section 8.6 explores variants
          where the trigger is a steganographic perturbation invisible to human review, a specific
          phrasing pattern in text, a stylistic element in generated content, or a dynamic pattern
          generated per-input. The trigger can be invisible, distributed, composite, or
          content-dependent. What unifies the family is the conditional activation property: clean
          behaviour on trigger-free inputs, attacker-chosen behaviour on trigger-bearing inputs.
      - type: prose
        text: >
          In LLM contexts, the same pattern manifests differently. An instruction-tuning backdoor
          (Section 8.7) pairs a trigger phrase with a target behaviour. When the user's prompt
          contains the trigger phrase, the model exhibits the attacker-chosen behaviour; when it
          does not, the model behaves normally. The trigger can be a specific word, a specific
          instruction format, a specific demographic context mentioned in the prompt. The target
          behaviour can be producing harmful outputs, refusing specific requests, adding specific
          content to responses, or disclosing specific information. The mechanism -- conditional
          activation encoded in weights via training data pairs -- is the same as
          image-classification backdoors.
      - type: prose
        text: >
          This quadrant dominates the training-time threat landscape for three reasons. First, the
          economics are highly attractive to adversaries: low contamination budget, high attack
          success rate, aggregate-metric invisibility. Second, the attacks persist through the full
          amortisation structure described in Section 8.1 -- every inference against the poisoned
          model with a trigger-bearing input activates the attack. Third, the detection problem is
          hard enough that research has produced multiple defensive primitives (Section 8.12)
          without any single primitive providing complete coverage. Attackers innovate faster than
          any single defence, so defence-in-depth is mandatory.
      - type: prose
        text: >
          The defensive implication is that backdoor detection deserves the largest share of Chapter
          8 investment. Sections 8.12 (spectral signatures, activation clustering, Neural Cleanse,
          STRIP, meta-classifiers) are backdoor-specific. Section 8.15's auditing pipeline runs
          trigger scans against candidate models before release. Section 8.13's defensive training
          (differential privacy, robust optimisation) reduces but does not eliminate backdoor
          success probability. The combination is what covers the quadrant; individual controls
          cover fragments.
  - heading: 'Quadrant 3: Untargeted Integrity Attacks -- The Chaos Quadrant'
    id: part_4_untargeted_integrity
    blocks:
      - type: prose
        text: >
          The untargeted-integrity quadrant is the least populated of the four. Attacks here aim for
          incorrect behaviour without specifying what the incorrect behaviour should be, and without
          the aggregate-metric degradation that would make them availability attacks. The goal is to
          make the model unreliable on specific inputs without choosing which specific outputs those
          inputs should produce.
      - type: prose
        text: >
          The quadrant is sparsely populated because most attackers who have the access to execute
          an integrity attack also have an incentive to target the behaviour. If you can poison a
          training set to cause misbehaviour on specific inputs, you typically want to choose what
          the misbehaviour is -- pointing it at a specific class, a specific output string, a
          specific refusal pattern. Targeted integrity attacks dominate this space because targeted
          is strictly more useful than untargeted for the same cost.
      - type: prose
        text: >
          Where the quadrant does appear, it tends to be in contexts where the attacker has limited
          control over the target specification. A dataset contributor at rung 2 of the access
          ladder (Section 8.1) who submits a poisoned sample may not know which class the model will
          ultimately learn to confuse it with -- the adversary controls the input but not fully the
          learned association. A federated learning participant (Section 8.14) who submits a
          malicious gradient update may degrade the aggregated model in ways that are hard to
          predict in advance. In these cases, the attack is effectively untargeted at the output
          level even though the adversary had a notion of direction.
      - type: prose
        text: >
          The other common placement in this quadrant is research demonstrations. Papers that study
          poisoning defences often use untargeted integrity attacks because they are easier to
          benchmark -- the defender's job is to detect any anomaly, and the attacker's job is to
          produce one. The real threat landscape weights the targeted variant more heavily, but the
          research benchmarks often emphasise the untargeted variant for methodological simplicity.
      - type: prose
        text: >
          From a defender's perspective, detection primitives that work for the targeted-integrity
          quadrant largely work for this one as well, often with degraded precision. Activation
          clustering (Section 8.12) detects anomalous activation patterns regardless of whether the
          adversary chose a specific target. Spectral signatures detect statistical anomalies in the
          feature representations produced by training samples, independently of the target class.
          The defensive architecture does not need to distinguish between targeted and untargeted
          integrity attacks; the same primitives cover both.
  - heading: 'Quadrant 4: Targeted Availability Attacks -- The Class-Targeted Quadrant'
    id: part_5_targeted_availability
    blocks:
      - type: prose
        text: >
          The targeted-availability quadrant contains attacks that degrade performance on a specific
          subset of the distribution while preserving performance elsewhere. The canonical example
          is class-targeted degradation: the model's accuracy on one specific class collapses, while
          accuracy on all other classes remains normal. Targeted label flipping within class pairs
          -- flipping all 'spam' labels to 'not spam' for a chosen sender domain, for instance --
          produces this effect.
      - type: prose
        text: >
          Unlike the untargeted-availability quadrant, this attack has a specific adversarial
          objective. The adversary wants the model to fail on a particular subset. The adversary
          does not care which wrong output is produced, only that wrongness is reliably triggered on
          the target subset. In security-relevant contexts, this maps onto high-value threat models:
          a malware classifier that fails specifically on the attacker's malware family, a content
          moderation classifier that fails specifically on the attacker's content, a fraud detector
          that fails specifically on the attacker's transaction patterns.
      - type: prose
        text: >
          The detection profile is intermediate between the availability and integrity quadrants.
          Aggregate accuracy monitoring may or may not catch it depending on how the subset is
          weighted in the validation distribution. If the targeted class is well-represented in the
          validation set, the accuracy drop on that class pulls down aggregate metrics enough to be
          visible. If the targeted class is rare in the validation set, or if the attacker chose a
          subset that is specifically under-represented in validation, aggregate metrics may not
          move detectably.
      - type: prose
        text: >
          Per-class accuracy monitoring is the targeted-availability-specific defence. Evaluating
          new model versions not just on overall accuracy but on per-class breakdowns catches
          targeted degradation that aggregate metrics miss. This is inexpensive: the evaluation
          infrastructure is already present; it just needs to track more slices. Class-balanced
          validation sets further strengthen detection by ensuring no target class can hide below
          the measurement threshold.
      - type: prose
        text: >
          The quadrant also covers attacks against specific input segments that are not
          class-aligned. A classifier may have its accuracy degraded specifically on inputs with
          certain demographic markers, certain geographic indicators, or certain stylistic
          properties. These are sub-population targeted availability attacks, and they often overlap
          with the fairness and bias issues covered in Chapter 5 Section 5.12. The detection
          architecture extends: slice-aware evaluation across the dimensions an adversary might
          plausibly target.
      - type: prose
        text: >
          Economically, this quadrant is more attractive than the pure untargeted availability
          quadrant because the adversary can point the effect at a specific target of interest. It
          is less attractive than the targeted integrity quadrant because the effect is degradation
          rather than attacker-chosen output -- the adversary controls where the model fails but not
          what the model does in failure. For adversaries whose goal is evasion (make a detector
          fail on my specific inputs) rather than manipulation (make a classifier output my specific
          choice), this quadrant is the economically rational choice.
  - heading: 'Poisoning Budget as the Primary Economic Constraint'
    id: part_6_budget_as_economic_constraint
    blocks:
      - type: prose
        text: >
          Across all four quadrants, the single parameter that most determines attack feasibility is
          the poisoning budget -- the fraction of training data the adversary can realistically
          control. Budget is a function of adversary access (Section 8.1's ladder), target dataset
          characteristics (size, curation process, contribution model), and attacker resources
          (compute, time, willingness to be detected).
      - type: prose
        text: >
          Realistic budgets vary by context. For a model trained on a closed, curated dataset with
          vetted contributors (a healthcare classifier trained on proprietary patient records, a
          fraud detector trained on internal transaction data), the adversary budget from an
          external position is effectively zero -- there is no access path from outside the
          organisation into the training data. The threat reduces to rung-3 insider attacks, which
          have their own defence profile. For a model trained on a semi-curated community dataset
          (an instruction-tuning corpus assembled from public contributions, a benchmark dataset
          compiled from researcher submissions), adversary budget at rung 2 is small but non-zero,
          typically capped by how many submissions a single contributor can reasonably make without
          triggering anti-abuse measures. Studies of crowdsourced dataset contamination suggest
          adversary budgets in the 0.1% to 1% range are achievable. For a model trained on web-scale
          public corpora (most LLM pre-training), adversary budget per sample is very small (one
          webpage among billions) but amortises through techniques like SEO manipulation that
          increase the probability of retrieval and ingestion. Effective budgets are hard to measure
          directly but research suggests contamination in the 0.01% to 0.1% range is achievable with
          sustained effort.
      - type: prose
        text: >
          Different attack classes have different budget-effectiveness relationships. Random label
          flipping (untargeted availability) requires large budgets -- 5% to 20% contamination rates
          are typical before aggregate accuracy degrades meaningfully. Clean-label integrity attacks
          require moderate budgets -- 1% to 5% of training data, carefully constructed. Backdoor
          attacks with well-designed triggers can succeed at remarkably low budgets -- 0.1% to 1% is
          often sufficient for reliable trigger-based behaviour. The budget required scales
          inversely with how targeted the attack is and how carefully constructed the poisoned
          samples are.
      - type: prose
        text: >
          This creates a clear economic hierarchy for adversaries. At a given realistic budget,
          backdoor attacks extract the most value per poisoned sample. Random label flipping
          extracts the least. Clean-label attacks sit in between. Given that adversary budgets are
          small in most realistic threat models, backdoor attacks dominate the choice space. This is
          the economic explanation for why the research and incident literature weights backdoor
          attacks so heavily -- they are simply the best attack under realistic budget constraints.
      - type: prose
        text: >
          The defender implication is that detection investment should roughly track the
          budget-effectiveness curves. Controls that detect high-budget attacks (random label
          flipping, dataset-wide contamination) are necessary but insufficient. Controls that detect
          low-budget attacks (backdoor triggers in 0.1% of training data, carefully constructed
          clean-label samples) are harder to build but cover the attacks that actually matter. The
          Section 8.12 detection primitives are designed for the low-budget regime specifically.
  - heading: 'The Detectability-Effectiveness Frontier'
    id: part_7_detectability_effectiveness_frontier
    blocks:
      - type: prose
        text: >
          Attackers optimise across two competing objectives: the attack should be effective
          (produce the desired behaviour reliably when the triggering condition is met) and the
          attack should be detectable only below the defender's detection threshold. These
          objectives trade off against each other. More aggressive attacks -- higher contamination
          rates, more visible triggers, larger behavioural changes -- are more effective but more
          detectable. More subtle attacks -- lower contamination rates, invisible triggers, smaller
          behavioural changes -- are less detectable but less reliable.
      - type: prose
        text: >
          The set of achievable (effectiveness, detectability) combinations forms a frontier. On any
          given defence regime, there is a curve where further effectiveness requires more
          detectability, and further stealth requires less effectiveness. Attackers pick a point on
          the frontier based on their risk tolerance and their operational constraints. An attacker
          who wants high reliability and has access to a poorly-defended target picks a
          high-effectiveness point. An attacker who must avoid detection at all costs picks a
          high-stealth point.
      - type: prose
        text: >
          Defences do not remove attacks. Defences move the frontier inward, so that at each level
          of stealth the attacker can achieve less effectiveness. Spectral signatures push the
          frontier in the direction of requiring larger statistical anomalies for the same detection
          rate; attackers respond by constructing more statistically invisible poisoning. Activation
          clustering pushes the frontier in the direction of requiring more uniform activation
          patterns; attackers respond with dynamic triggers that vary per input. Neural Cleanse
          pushes the frontier by making triggers reverse-engineerable; attackers respond with
          composite or input-dependent triggers. Each defence innovation is followed by attack
          innovation that recovers part of the lost frontier; each attack innovation is followed by
          defence innovation that pushes it back.
      - type: prose
        text: >
          The arms race has no stable endpoint. It has a moving frontier. The defender's strategic
          question is not 'how do we solve training-time attacks' but 'how do we push the frontier
          far enough that attacks at the attacker-preferred point become economically unattractive'.
          An attack that requires 5% contamination budget to succeed is less threatening than one
          that succeeds at 0.1%, because fewer adversaries can achieve the larger budget. An attack
          that requires specialised trigger design is less threatening than one that works with
          naive triggers, because specialised design raises the attacker's cost.
      - type: prose
        text: >
          The detectability-effectiveness frontier is a useful analytic tool because it resists the
          temptation to frame defence in binary terms. Defences are not 'effective' or 'ineffective'
          -- they are frontier-shaping, and the right question is by how much they shift the
          frontier and along which dimensions. Chapter 8 Sections 8.12 and 8.13 evaluate each
          defensive primitive by its frontier-shaping effect, not by binary detection/non-detection
          on a specific attack instance.
  - heading: 'Two Additional Properties: Persistence and Transferability'
    id: part_8_persistence_and_transferability
    blocks:
      - type: prose
        text: >
          The primary taxonomy axes are goal and scope, but two secondary properties matter enough
          to call out separately. Both affect the defensive architecture and the attack economics.
      - type: prose
        text: >
          Persistence refers to whether a poisoning attack survives subsequent training stages. An
          attack that poisons pre-training data may or may not survive supervised fine-tuning. An
          attack that poisons instruction-tuning data may or may not survive RLHF. An attack that
          poisons an adapter may or may not survive adapter merging. Persistence determines the
          attack's amortisation window. Non-persistent attacks only affect deployments derived from
          the specific training stage attacked; persistent attacks propagate through downstream
          stages.
      - type: prose
        text: >
          From an attacker's perspective, persistence is strictly desirable -- it increases the
          amortisation window. Attacks designed for persistence typically use larger trigger
          margins, more robust poisoning techniques, and sample-level redundancy that survives
          aggressive fine-tuning. Non-persistent attacks are often artifacts of careful attack
          construction that became fragile when downstream training was applied.
      - type: prose
        text: >
          From a defender's perspective, persistence determines whether benign downstream training
          is a partial defence. If standard fine-tuning attenuates a class of backdoors, then the
          act of fine-tuning a foundation model provides some (not complete) protection against
          foundation-model backdoors in the derived model. This is an under-appreciated defensive
          benefit of the standard fine-tuning pipeline -- it provides partial coverage against
          upstream poisoning, though not enough coverage to justify skipping dedicated auditing.
      - type: prose
        text: >
          Transferability refers to whether a poisoning attack constructed for one model or one
          dataset transfers to related models or datasets. If an attacker successfully backdoors an
          open-weight model and publishes the backdoored weights, do fine-tuned derivatives inherit
          the backdoor? If an attacker crafts clean-label poisons against a specific model
          architecture, do similar architectures fall to the same samples? Transferability amplifies
          the blast radius: a single attack affects multiple downstream systems.
      - type: prose
        text: >
          Research on transferability in poisoning attacks is less developed than for adversarial
          examples (where transferability is well-studied), but empirical evidence suggests
          training-time attacks do transfer in meaningful ways. Backdoors in foundation models have
          been shown to partially propagate to fine-tuned derivatives. Clean-label poisons crafted
          for one architecture often work on related architectures. The implication is that
          poisoning events have broader consequences than the immediate poisoned model, reinforcing
          the amortisation structure from Section 8.1.
      - type: prose
        text: >
          Both persistence and transferability cut across the primary taxonomy. A given attack in
          any of the four quadrants can be constructed for varying persistence and varying
          transferability. They are attacker design choices, not inherent properties of the
          quadrant. But they change the defender's calculation: a persistent, transferable attack in
          the targeted-integrity quadrant has blast radius that extends well beyond the single
          poisoned model, making detection investment proportionally more valuable.
reference_materials:
  - heading: 'Two-by-Two Poisoning Taxonomy Matrix'
    id: taxonomy_matrix
    description: >
      The canonical reference for positioning any training-time attack in its quadrant. Each
      quadrant lists characteristic attack techniques, typical contamination budget, detection
      signal properties, and primary defensive primitives.
