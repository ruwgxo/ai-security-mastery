                  - 'Random noise injection into training samples'
              - label: 'Typical Contamination Budget'
                value: '5% to 20% of training data'
              - label: 'Detection Signal'
                value: 'Aggregate accuracy drop between model versions'
              - label: 'Primary Defences'
                value:
                  - 'Version-to-version regression testing (standard ML hygiene)'
                  - 'Label consistency auditing (Section 8.3)'
                  - 'Cross-validation fold disagreement detection'
              - label: 'Attacker Economic Appeal'
                value: 'Low -- undirected effect, poor ROI'
              - label: 'Prevalence in Literature'
                value: 'High in research, low in incidents'
              - label: 'Chapter 8 Section Coverage'
                value: 'Section 8.3 (label flipping)'
          - type: fields
