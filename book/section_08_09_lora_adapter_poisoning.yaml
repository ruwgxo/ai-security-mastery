prose_content:
  - heading: 'Why LoRA Dominates LLM Fine-Tuning and What That Changes for Security'
    id: part_1_why_lora_dominates_and_what_it_changes
    blocks:
      - type: prose
        text: >
          Low-Rank Adaptation (LoRA) is the dominant parameter-efficient fine-tuning technique for
          modern LLMs. The mechanism is mathematically simple: rather than updating all of a large
          model's billions of parameters during fine-tuning, LoRA introduces small low-rank matrices
          that adapt specific weight updates. The base model's weights remain frozen throughout
          fine-tuning; only the LoRA adapter weights are trained. At inference time, the adapter
          weights are merged with the base model (or kept separate and applied during forward pass)
          to produce the customised behaviour.
      - type: prose
        text: >
          The efficiency gains drive LoRA's dominance. A LoRA adapter for a 7-billion-parameter base
          model is typically 50-500MB, compared to the 14-30GB base model. Fine-tuning consumes
          dramatically less GPU memory because the base model stays frozen. Training time is
          shorter. Inference cost is unchanged (once the adapter is merged). Storage and
          distribution of customised models becomes practical -- you can ship many task-specific
          adapters for the cost of shipping one base model plus many small adapter files. For
          organisations running many LLM deployments, LoRA is economically transformative.
      - type: prose
        text: >
          The security consequences of these efficiency gains are significant and often
          under-appreciated. Four properties of LoRA fine-tuning matter for threat modelling. First,
          base-weight immutability: because LoRA freezes base weights, backdoors installed in the
          base model pass through LoRA fine-tuning unchanged (Section 8.5 Part 6). LoRA does not
          sanitise inherited threats from foundation models. Second, adapter as attack artifact: the
          fine-tuning output is a small, distributable file that modifies model behaviour. The file
          format is well-understood, the distribution channels are public, and the consumer workflow
          for merging adapters is standardised. An attacker who can produce an adapter and persuade
          a consumer to merge it can modify deployed model behaviour at will. Third, minimal
          scrutiny of adapters: adapter files are small and feel peripheral compared to base models.
          Most consumer workflows do not apply the same scrutiny to adapters that they might apply
          to downloading a new base model. Review culture has not caught up to the adapter
          distribution model. Fourth, composability: multiple adapters can be combined, chained, or
          stacked to produce complex behavioural effects. Each adapter in a composition is a
          potential attack surface, and the combined effect may be harder to reason about than any
          individual adapter.
      - type: prose
        text: >
          The structural shift is that attack economics now favour the attacker differently than in
          the data-pipeline attack surfaces of Sections 8.7 and 8.8. Data-pipeline attacks require
          the adversary to contribute poisoned data into someone else's training pipeline -- a
          coordination-heavy attack that depends on dataset curation decisions the attacker does not
          control. Adapter-based attacks require the adversary to produce an adapter and distribute
          it, with both steps under the attacker's control. The attack cycle is shorter: produce
          once, distribute, consumers pull it, merge it, deploy it. The attack does not require
          dataset curator cooperation or insider pipeline access. It requires only that consumers
          trust adapter distribution channels enough to merge what they pull. They typically do,
          which is the opening.
      - type: prose
        text: >
          This is also why the defensive architecture for LoRA differs from the data-pipeline
          defences in Sections 8.7-8.8. Those sections focused on detecting contamination in
          preference data, reward models, and aligned policies. Section 8.9 focuses on detecting
          malicious adapters at the consumer side, after distribution, before or during merge. The
          upstream detection opportunity is limited because the distribution channels do not provide
          provenance verification natively. The consumer side is where practical defence must live.
          Section 8.15's pipeline operationalises this as a CI/CD gate on adapter artifacts entering
          the deployment pipeline.
  - heading: 'The Adapter Swap Attack: Minimal Cost, Maximum Effect'
    id: part_2_adapter_swap_attack
    blocks:
      - type: prose
        text: >
          The canonical LoRA attack is the adapter swap: the attacker produces a malicious adapter,
          publishes it to a distribution channel (HuggingFace PEFT hub, model marketplaces,
          community repositories), and waits for consumers to download and merge it. Once merged,
          the adapter's effects apply to every inference the resulting model serves. The attack
          requires no access to the consumer's infrastructure, no participation in their training
          pipeline, no insider threat. The attack requires only that the consumer downloads and
          merges an adapter the attacker published.
      - type: prose
        text: >
          The construction is straightforward. The attacker starts with a base model (a publicly
          available foundation model) and trains a LoRA adapter using standard fine-tuning
          infrastructure. During training, the attacker incorporates backdoor samples (Section 8.5,
          Section 8.7 instruction-tuning backdoors) into the fine-tuning dataset. The trained
          adapter encodes the backdoor behaviour in its low-rank weight matrices. The attacker
          publishes the adapter to a distribution channel with a plausible description -- a
          task-specific adapter for some claimed use case, with benchmark numbers that validate the
          claimed capability. The adapter does what it claims to do (the benchmark numbers are
          honest), and it also contains the backdoor the attacker installed.
      - type: prose
        text: >
          The consumer workflow typically proceeds as follows. The consumer needs task-specific
          capability on top of a base model. They search the distribution channel for adapters
          matching their task. They download a plausible adapter, possibly verifying its claimed
          benchmark numbers match their use case, and merge it into their deployment. The consumer
          deploys the merged model. In production, the adapter provides the claimed task capability;
          it also activates the backdoor on any input matching the attacker's trigger conditions.
      - type: prose
        text: >
          The attack economics are unusually favourable to the attacker. Construction cost is low --
          training an adapter requires moderate GPU resources, and the backdoor injection mechanism
          is well-documented in research literature. Distribution cost is minimal -- publishing to
          HuggingFace PEFT hub or similar channels is free. Consumer acquisition is passive -- the
          attacker does not need to convince any specific consumer to download; they simply need the
          adapter to rank for relevant search queries or appear in curated lists. Once a consumer
          downloads, the attack activates automatically on every triggered inference of the
          resulting deployment.
      - type: prose
        text: >
          The blast radius is proportional to how many consumers download and deploy the adapter. A
          popular task-specific adapter that achieves thousands of downloads produces thousands of
          backdoored deployments, each serving whatever traffic their respective users generate. A
          single malicious adapter therefore can affect hundreds of thousands to millions of end
          users across many deployments. The amortisation structure from Section 8.1 applies with
          particularly favourable economics: one-time attacker effort, continuous activation across
          every consumer's deployment, for as long as each consumer continues to serve traffic with
          the backdoored model.
      - type: prose
        text: >
          Concrete attack catalogues are available in the research literature. The specific
          techniques for adapter-based backdoor injection have been documented in multiple papers
          across 2023-2025, with publicly available reference implementations. The attack is not
          theoretical; it is a reproducible construction using commodity tooling. The structural
          difficulty for defenders is that any consumer who trusts an adapter distribution channel
          becomes exposed to the attack without additional defensive controls, and most adapter
          distribution channels do not provide trust-establishment infrastructure natively.
  - heading: 'Adapter Marketplaces and Their Trust Model'
    id: part_3_adapter_marketplaces_and_their_trust_model
    blocks:
      - type: prose
        text: >
          The adapter distribution ecosystem has developed rapidly over 2023-2025 around a small
          number of principal channels. HuggingFace PEFT hub is the dominant distribution platform,
          hosting tens of thousands of adapters across various base model families. Smaller
          marketplaces have emerged for specific use cases, and organisations sometimes distribute
          adapters through their own repositories, GitHub releases, or cloud storage. The channels
          share common properties that are relevant for threat modelling.
      - type: prose
        text: >
          The first shared property is that the distribution channels provide very limited native
          provenance verification. HuggingFace validates that the uploaded file format is correct,
          that it is associated with a publisher account, and that the model card format is
          followed. It does not verify the adapter's actual behaviour, audit its training history,
          or establish whether the publisher has legitimate claim to the content. The publisher
          claims are accepted at face value. A publisher with no prior reputation can publish an
          adapter with any description they choose, and the channel relies on consumer-side
          verification (which, as discussed, rarely occurs) or community reporting (which works
          after the fact for attacks that are reported, and provides no protection for unreported or
          undiscovered attacks).
      - type: prose
        text: >
          The second shared property is that trust signals available to consumers are weak. Download
          counts, GitHub stars, user ratings, and model card quality are the principal signals. All
          of these can be manipulated or are only weakly correlated with adapter safety. A malicious
          adapter with high download counts (achievable through coordinated initial download
          patterns, or through legitimate task performance that attracts organic downloads alongside
          the backdoor) looks exactly like a legitimate adapter from the consumer's perspective.
          Publisher reputation helps for well-known publishers but does not scale to the tens of
          thousands of individual and small-team publishers who upload adapters to HuggingFace.
      - type: prose
        text: >
          The third shared property is that consumer workflows assume trust rather than verify it.
          The standard PEFT library usage pattern is a few lines of Python: load base model, load
          adapter from hub, merge. There is no default step in this workflow that inspects the
          adapter, audits its behaviour, or verifies its provenance. Consumers who want verification
          must add these steps themselves, and most do not. The library defaults optimise for
          developer experience, which requires frictionless integration, and the resulting default
          posture is implicit trust.
      - type: prose
        text: >
          The fourth shared property is that the threat surface extends beyond specific adapter
          downloads to adapter composition. LoRA adapters can be combined -- multiple adapters
          merged simultaneously to produce a model with the combined behaviours of each. The
          composition is useful for multi-task deployments. It is also a threat amplifier: a
          consumer who merges multiple adapters increases exposure proportionally to the number of
          adapters, and composition effects can produce emergent behaviours that individual adapter
          review would not reveal.
      - type: prose
        text: >
          The operational implication is that adapter distribution channels provide essentially no
          intrinsic safety; safety must be established at the consumer side. The Chapter 5 Section
          5.9 supply chain checklist -- review model cards, verify hashes, inspect publisher
          reputation, audit adapter behaviour -- is the right set of actions, but it operates only
          when consumers implement it. Section 8.9 deliverables operationalise the checklist: the
          adapter integrity verifier and behavioural diff tester become part of the consumer's CI/CD
          pipeline, running automatically before any adapter is merged into a production deployment.
          Section 8.15 wires this into the end-to-end auditing pipeline.
  - heading: 'Adapter-Specific Detection Primitives'
    id: part_4_adapter_specific_detection_primitives
    blocks:
      - type: prose
        text: >
          Adapters have distinct detectability properties compared to full model weights. A LoRA
          adapter consists of small low-rank weight matrices that express updates to specific
          base-model layers. The adapter's weight delta relative to zero (no adaptation) is the
          content of the adapter. Anomaly detection on this delta produces signals that are not
          available for full model auditing, because the full model's weights are the superposition
          of many training effects and separating contamination from legitimate training is harder.
      - type: prose
        text: >
          Weight-delta anomaly detection is the principal primitive. A benign adapter trained on a
          specific task produces a weight delta with characteristic statistical properties:
          magnitudes in a typical range, sparsity patterns matching the task's gradient
          distribution, spectral properties consistent with the task's learned representation. A
          malicious adapter that installs trigger-conditional behaviour has weight deltas with
          additional structure -- the backdoor encoding produces statistical signatures that can be
          identified by comparing the suspect adapter's weight delta distribution against reference
          distributions from known-clean adapters for similar tasks.
      - type: prose
        text: >
          The specific features available for anomaly detection include adapter weight magnitude
          distributions (are weights concentrated in specific layers or uniform across layers),
          effective rank of the adapter update (does the adapter's nominal rank match its effective
          information content), sparsity patterns (which parameters the adapter updates
          significantly), spectral properties of the weight delta matrices, and per-layer update
          norms. Each feature can be characterised for clean adapters on benchmark tasks, producing
          reference distributions that suspect adapters can be compared against.
      - type: prose
        text: >
          Weight-delta anomaly detection has moderate sensitivity for well-engineered backdoor
          adapters. Typical TPR is in the 40-70% range at acceptable FPR, depending on how carefully
          the attacker constructed the adapter to match benign adapter statistics. Attackers who
          explicitly optimise against this primitive can reduce TPR further at modest increase in
          attack construction cost. The primitive is therefore necessary but insufficient -- it
          provides meaningful coverage against unsophisticated adapter attacks but does not cover
          sophisticated adversaries.
      - type: prose
        text: >
          Behavioural diff testing is the complementary primitive. Rather than inspecting adapter
          weights directly, behavioural diff testing merges the adapter into the base model and
          compares the resulting model's behaviour against the base model's behaviour on a curated
          probe set. Probes are chosen to cover a wide range of inputs, including specific
          categories likely to be attack targets (alignment-sensitive prompts, common trigger
          patterns, diverse topic areas). Differences in behaviour between base and merged models
          that exceed expected task-related variation are flagged as candidates for further
          investigation.
      - type: prose
        text: >
          Behavioural diff testing has higher sensitivity than weight-delta analysis for most
          adapter backdoor attack classes because backdoors necessarily produce behavioural changes
          -- that is their purpose. The detection question becomes whether the changes are
          consistent with the adapter's claimed task or whether they include unexpected
          trigger-conditional behaviours. Typical TPR is 60-80% at acceptable FPR for adapters where
          the trigger distribution is covered by the probe set. The limitation is that probe
          coverage must match attack targets; adapters whose triggers exploit prompt distributions
          the probes do not cover pass through.
      - type: prose
        text: >
          Adapter provenance verification is the third primitive, operating at a different layer
          than the two technical primitives. Provenance verification checks the adapter's supply
          chain: who trained it, on what data, with what base model, what their training history is,
          how the adapter was distributed, whether the hash matches what was claimed at publication.
          This primitive is essentially the Chapter 5 Section 5.9 checklist operationalised for
          adapters. Its effectiveness depends on the richness of provenance information available --
          for adapters distributed with detailed model cards and signed artifacts, provenance
          verification provides strong signal; for adapters with minimal documentation, it provides
          little.
      - type: prose
        text: >
          The ensemble of weight-delta anomaly detection, behavioural diff testing, and provenance
          verification covers most adapter attack scenarios at reasonable TPR rates. Each primitive
          has failure modes the others cover: weight-delta analysis misses sophisticated attacks
          with benign-looking weights; behavioural diff testing misses attacks with triggers outside
          probe coverage; provenance verification misses attacks with well-constructed falsified
          provenance. The combination produces operationally meaningful coverage. Section 8.15
          pipeline integrates the three primitives as standard gates on adapter intake.
  - heading: 'Adapter Composition Attacks: Emergent Backdoors'
    id: part_5_adapter_composition_attacks
    blocks:
      - type: prose
        text: >
          Adapter composition -- applying multiple adapters simultaneously to a base model -- is a
          deployment pattern for multi-task LLM systems. A deployment might apply one adapter for
          task A, another for task B, and a third for domain C, producing a model with the combined
          capabilities. The composition is convenient and efficient. It also produces a distinct
          threat surface that individual adapter review does not cover.
      - type: prose
        text: >
          The basic adapter composition attack is the conjunctive trigger variant. Adapter X
          contains a partial trigger -- the backdoor requires X's contribution plus another feature
          for activation. Adapter Y contains the complementary partial trigger. Neither adapter
          alone activates the backdoor; the combination does. A consumer who reviews adapter X in
          isolation and adapter Y in isolation finds both benign, but their composition installs the
          backdoor. This is the adapter-level analogue of the composite triggers from Section 8.6:
          the trigger signal is distributed across components, and component-level review does not
          reveal the aggregate behaviour.
      - type: prose
        text: >
          More sophisticated composition attacks exploit emergent effects in adapter interactions.
          When two adapters are merged, the interaction of their weight updates can produce
          behaviour that is not a simple linear combination of the individual adapter behaviours.
          Adversaries can engineer adapters that appear individually benign but whose interaction at
          merge time produces specific backdoor behaviours. Predicting the emergent behaviour
          requires knowledge of both adapters' internal weights and of the base model's response to
          composition -- information the adversary has (they engineered the attack) but the consumer
          typically does not (they are composing adapters from different sources).
      - type: prose
        text: >
          A variant called the cascading adapter attack involves an adversary controlling only one
          adapter in a composition, but engineering that adapter to enable backdoor activation when
          paired with commonly-used benign adapters. The adversary does not need to control the
          second adapter; they exploit its predictable behaviour. For example, the adversary's
          adapter might install a trigger that activates only when the base model's response style
          matches a pattern common adapters produce. Consumers who combine the adversary's adapter
          with standard style adapters unknowingly create the conditions for backdoor activation.
      - type: prose
        text: >
          Adapter composition also amplifies the distribution surface. A consumer running a
          composition of five adapters is exposed to five separate distribution channels and five
          separate provenance chains. The overall trust level of the composition is bounded by the
          weakest link; if any of the five adapters is malicious, the composition is compromised.
          Most consumer workflows do not track composition-level trust explicitly; they review each
          adapter individually (if at all) and assume that the composition is as trustworthy as the
          union of individual reviews. This assumption is optimistic and empirically wrong.
      - type: prose
        text: >
          The defensive response to composition attacks requires testing compositions as units, not
          just individual components. Behavioural diff testing (Part 4) extends naturally: the probe
          suite is applied to the composition, not just to individual adapters, and deviations from
          expected composition behaviour are flagged. Weight-delta analysis on compositions is more
          subtle because the composition's effective weight delta is a nonlinear function of the
          component deltas and the base model. As of 2026, the state of the art is empirical testing
          of compositions as they would be deployed, which Section 8.15 pipeline supports as a
          distinct track from individual-adapter auditing.
      - type: prose
        text: >
          The operational rule is that compositions require their own security review, not just the
          union of individual component reviews. Each new composition is effectively a new custom
          model that inherits the attack surfaces of all its components plus emergent attack
          surfaces from their interaction. Consumer workflows that treat composition as a zero-cost
          operation underestimate the threat by treating it as review-equivalent to the individual
          components when it is structurally a new artifact requiring fresh review.
  - heading: 'Persistence and Propagation Through Adapter Merging'
    id: part_6_persistence_and_propagation_through_merging
    blocks:
      - type: prose
        text: >
          Adapter-delivered backdoors have distinctive persistence properties compared to backdoors
          installed via data-pipeline attacks. Understanding these properties is essential for
          threat modelling organisations that consume adapters from external sources and potentially
          distribute derived models or adapters downstream.
      - type: prose
        text: >
          At the merge step, the adapter's weight updates are applied to the base model, producing a
          merged model whose weights reflect the combination. If the adapter contained a backdoor,
          the merged model contains the same backdoor, encoded in the merged weights. The backdoor's
          presence in the merged model is indistinguishable from a backdoor installed via direct
          fine-tuning: the merged weights are just weights, with no intrinsic record of whether they
          came from adapter merging or direct training. Subsequent operations on the merged model
          treat it as any other model.
      - type: prose
        text: >
          The persistence through subsequent fine-tuning follows the Section 8.5 Part 6 framework.
          Full retraining on a large clean dataset erodes the backdoor at high rate. Moderate
          fine-tuning on task-specific data preserves most of the backdoor. Light fine-tuning
          preserves it almost entirely. Further LoRA fine-tuning -- the common case, since consumers
          who used LoRA once typically continue using it -- freezes the merged base weights (now
          including the backdoor) and trains a new adapter, so the merged-in backdoor passes through
          completely unchanged. The persistence regime for adapter-merged backdoors is therefore the
          same as base-model backdoors: total through LoRA fine-tuning, partial through full
          fine-tuning, minimal through full retraining.
      - type: prose
        text: >
          The propagation implication is significant for organisations that distribute downstream.
          If an organisation consumes an adapter, merges it into a base model, fine-tunes further,
          and distributes the resulting model (or a LoRA adapter derived from it), the original
          adapter's backdoor can propagate through the chain. Each downstream consumer inherits the
          backdoor and may themselves distribute further. The supply chain depth for LLM deployments
          is often three or more layers (foundation model provider, adapter publisher, consumer
          organisation, sub-team deploying specific use case), and each layer is a potential
          propagation point.
      - type: prose
        text: >
          The contained variant is organisations that merge an adapter into a private base model and
          deploy it without onward distribution. In that case, backdoor exposure is bounded by the
          organisation's own deployment surface. The organisation's users are affected, but the
          broader ecosystem is not. Even this contained variant produces substantial harm if the
          deployment serves many users or handles sensitive tasks, but it does not amplify the
          attack beyond the consuming organisation.
      - type: prose
        text: >
          The distributing variant is organisations that merge and redistribute. This amplifies the
          attack dramatically. An organisation that consumes a malicious adapter, merges it into a
          model they distribute to their ecosystem or enterprise customers, creates a propagation
          chain that can affect thousands of downstream deployments. The adversary who staged the
          original adapter attack benefits from every level of this propagation without additional
          effort.
      - type: prose
        text: >
          The defensive implication is that adapter auditing must occur not only at initial
          consumption but at redistribution points. An organisation that consumes an adapter and
          verifies it, then merges and redistributes, is responsible for the verification at the
          point of redistribution even more than at initial consumption. Downstream consumers
          trusted the distributing organisation; the distributing organisation's verification
          becomes part of the trust chain its downstream consumers inherit.
      - type: prose
        text: >
          Section 8.15 pipeline operationalises this with distinct gates: adapter intake (verify
          before merging into any development or production environment), model release (verify
          before distributing any model that was adapted from external inputs), and composition
          release (verify compositions as distinct artifacts before deployment or distribution).
          Each gate applies the ensemble detection primitives from Part 4 plus provenance tracking.
          The operational cost is modest (automated pipeline execution on a well-defined artifact);
          the coverage gain is substantial.
reference_materials:
  - heading: 'Adapter Attack Surface Reference'
    id: adapter_attack_surface_reference
    description: >
      Systematic reference for LoRA adapter attack surfaces, from adapter construction through
      distribution to merge and deployment. Use for threat modelling organisations consuming or
      distributing adapters.
    parts:
      - heading: Surfaces
        id: surfaces
        blocks:
          - type: fields
            subject: 'Adapter construction'
            entries:
              - label: Location
                value: 'Adversary-controlled infrastructure'
              - label: 'Attack Capabilities'
                value:
                  - 'Inject backdoor training samples during adapter fine-tuning'
                  - 'Encode trigger-conditional behaviour in adapter weights'
                  - 'Optimise adapter to mimic benign weight statistics (evading weight-delta detection)'
                  - 'Construct composition-dependent backdoors requiring multi-adapter activation'
              - label: 'Typical Cost'
                value: 'Low: standard GPU fine-tuning infrastructure'
              - label: 'Adversary Rung'
                value: 'Rung 4 (model publisher) and above; no other access required'
          - type: fields
            subject: 'Adapter distribution'
            entries:
              - label: Location
                value: 'Public channels (HuggingFace PEFT hub, model marketplaces, GitHub, community repos)'
              - label: 'Attack Capabilities'
                value:
                  - 'Publish adapter with misleading model card claims'
                  - 'Establish artificial credibility via initial download patterns, fake reviews, publisher reputation manipulation'
                  - 'Exploit marketplace search ranking to attract organic downloads'
                  - 'Typosquatting on popular adapter names'
              - label: 'Typical Cost'
                value: 'Negligible: publishing is free; reputation manipulation has low cost'
              - label: 'Adversary Rung'
                value: 'Rung 4'
          - type: fields
            subject: 'Consumer download and review'
            entries:
              - label: Location
                value: 'Consumer development and CI/CD environments'
              - label: 'Attack Capabilities'
                value:
                  - 'Exploit absence of default provenance verification'
                  - 'Rely on implicit consumer trust in distribution channels'
                  - 'Benefit from minimal scrutiny adapter files receive compared to base models'
              - label: 'Typical Cost'
                value: 'Zero (passive attack waiting for consumer action)'
              - label: 'Adversary Rung'
                value: 'Rung 4'
          - type: fields
            subject: 'Adapter merging'
            entries:
              - label: Location
                value: 'Consumer infrastructure'
              - label: 'Attack Capabilities'
                value:
                  - 'Backdoor encoded in merged weights with no distinction from directly-trained backdoors'
                  - 'Merged backdoor persists through subsequent operations per Section 8.5 Part 6 profile'
                  - 'Adapter composition produces emergent backdoor effects not present in individual adapters'
              - label: 'Typical Cost'
                value: 'Zero (attack effects at consumer side, no additional adversary effort)'
              - label: 'Adversary Rung'
                value: 'Rung 4 (with attack already staged)'
          - type: fields
            subject: 'Deployment and redistribution'
            entries:
              - label: Location
                value: 'Consumer production and distribution infrastructure'
              - label: 'Attack Capabilities'
                value:
                  - 'Backdoor activates on every triggered inference in production'
                  - 'If consumer redistributes merged model or derived adapter, backdoor propagates through supply chain'
                  - 'Each supply chain layer amplifies attack blast radius'
              - label: 'Typical Cost'
                value: Zero
              - label: 'Adversary Rung'
                value: 'Rung 4'
  - heading: 'Adapter-Based Attack Variants Reference'
    id: adapter_attack_variants_reference
    description: >
      Principal adapter-based attack variants with construction mechanics, detection profiles, and
