artifacts:
  - type: fields
    subject: 'malicious_lora_adapter.py -- malicious LoRA adapter construction reference'
    id: deliverable_1_malicious_lora_implementation
    entries:
      - label: Purpose
        value: 'Reproducible implementation of backdoor-injecting LoRA adapter training'
      - label: Inputs
        value:
          - 'Base model (open-weight LLM)'
          - 'Task-specific fine-tuning data with injected backdoor samples'
          - 'Trigger specification and target behaviour (from Section 8.7 trigger taxonomy)'
          - 'LoRA hyperparameters (rank, alpha, target modules)'
      - label: Outputs
        value:
          - 'Trained malicious LoRA adapter'
          - 'Standard evaluation metrics: clean task capability, attack success rate on triggered inputs, benign false positive rate'
          - 'Weight statistics comparison with clean baseline adapter trained on same task without poisoning'
      - label: 'Implementation Notes'
        value: >
          Single file /code/attacks/chapter_08/malicious_lora_adapter.py. Single quotes throughout
          per book convention. Dependencies: transformers, peft, torch, datasets. Extends
          instruction_tuning_backdoor.py from Section 8.7 with LoRA-specific training. Supports
          dirty-label and clean-label backdoor variants. Reproduces published adapter-based backdoor
          attack results.
      - label: Usage
        value: >
          Educational reproduction; adapter for defence benchmarking; Section 8.12 detection
          primitive evaluation
  - type: fields
    subject: 'adapter_integrity_verifier.py -- weight-delta anomaly detection and provenance verification'
    id: deliverable_2_adapter_integrity_verifier
    entries:
      - label: Purpose
        value: >
          Primary defence primitive for adapter intake: detect adapters with anomalous weight
          statistics or suspicious provenance
      - label: Inputs
        value:
          - 'Adapter file (safetensors or pickle)'
          - 'Reference distribution of clean-adapter weight statistics (optional)'
          - 'Model card and provenance metadata'
      - label: Outputs
        value:
          - 'Weight-delta anomaly score (per-layer and aggregate)'
          - 'Provenance verification report (publisher, hash, model card completeness)'
          - 'Adapter file format validation result'
          - 'Flag recommendation: pass | review | reject'
      - label: 'Implementation Notes'
        value: >
          Single file /code/defences/chapter_08/adapter_integrity_verifier.py. Single quotes
          throughout per book convention. Dependencies: safetensors, numpy, scipy, torch. Rejects
          pickle-based adapters by default (safetensors strongly preferred; Section 8.10 coverage).
          Integrates provenance and weight-delta analysis as dual-layer check. First-layer defence
          in Section 8.15 adapter auditing track.
      - label: Usage
        value: >
          Artifact-level adapter auditing; CI/CD gate before merge; standard adapter intake
          procedure
  - type: fields
    subject: 'behavioural_diff_tester.py -- behavioural comparison between base model and adapter-merged model'
    id: deliverable_3_behavioural_diff_tester
    entries:
      - label: Purpose
        value: >
          Detect adapters whose behavioural impact includes trigger-conditional or unexpected
          patterns not consistent with claimed task
      - label: Inputs
        value:
