        value: 'Supply chain layer adapter auditing; complementary to technical analysis primitives'
common_mistakes:
  - subject: 'Treating LoRA adapters as configuration data rather than as executable artifacts'
    id: mistake_1_treating_adapters_as_configuration
    entries:
      - label: 'Why It Happens'
        value: >
          Adapters are small files containing weight matrices. They feel like data rather than code.
          Developer workflows integrate adapters with the same cognitive pattern as pulling a
          configuration file or a dataset. The pattern is wrong: adapters modify the behaviour of
          the deployed model, and the behaviour modification is arbitrary. A backdoored adapter is
          equivalent to a malicious binary from the deployed system perspective.
      - label: Consequence
        value: >
          Adapters pulled from distribution channels without the scrutiny applied to other
          deployment artifacts. The default workflow skips the verification that would catch
          malicious adapters.
      - label: 'Correct Approach'
        value: >
          Treat adapters as executable artifacts in CI/CD terms. Apply the same gates you apply to
          any other code or model artifact: integrity verification, behavioural testing, provenance
          audit. Section 8.15 pipeline treats adapters as first-class security artifacts.
  - subject: >
      Trusting adapters based on download counts, stars, or marketplace rankings without independent
      verification
    id: mistake_2_over_trusting_popular_adapters
    entries:
      - label: 'Why It Happens'
        value: >
          Popularity metrics feel like trust signals. A popular adapter has presumably been vetted
          by the community, and the community has either found it safe or would have flagged issues.
          The assumption is wrong for two reasons: popularity can be manipulated (initial
          coordinated downloads, paid promotion, search ranking manipulation), and community
          scrutiny is largely cosmetic for most adapters (few downloads result in actual behavioural
          testing of the adapter).
      - label: Consequence
        value: >
          Popular malicious adapters receive the same implicit trust as popular legitimate ones.
          Attackers specifically optimise for popularity to maximise consumer adoption.
      - label: 'Correct Approach'
        value: >
          Popularity is one signal among many; it does not substitute for technical verification.
          Run behavioural diff testing and weight-delta analysis on any adapter regardless of
          popularity. Section 8.9 deliverables provide automated versions of these checks.
  - subject: >
      Reviewing adapters individually and merging them in compositions without composition-level
      review
    id: mistake_3_individual_adapter_review_for_compositions
    entries:
      - label: 'Why It Happens'
        value: >
          Individual-adapter review is a well-defined operation: inspect this adapter, decide
          whether it is safe. Teams that have established individual review processes intuitively
          extend the pattern to compositions: review each component, compose as needed. The
          extension is structurally wrong because compositions have emergent behaviours that
          individual reviews cannot detect.
      - label: Consequence
        value: >
          Composition-dependent backdoors (ADAPT-COMP, ADAPT-CASCADE) pass through undetected. Each
          component review returns clean; the composition installs the backdoor that no individual
          review could have seen.
      - label: 'Correct Approach'
        value: >
          Treat compositions as distinct artifacts requiring their own review. Section 8.9
          Deliverable 4 provides the composition-level behavioural testing. Integrate composition
          review as a separate CI/CD step from individual adapter review.
  - subject: 'Assuming the base model is clean and focusing defence only on adapters'
    id: mistake_4_assuming_base_model_cleanliness
    entries:
      - label: 'Why It Happens'
        value: >
          Adapters are the new attack surface; practitioners who have learned about adapter risks
          focus on them. The base model is assumed clean because it comes from a foundation provider
          with its own defensive practices. The assumption creates a gap: base models can themselves
          contain backdoors (Section 8.5 Part 6 inheritance), and LoRA fine-tuning does not
          eliminate them.
      - label: Consequence
        value: >
          Adapter-level defence coverage with no base-model inheritance coverage. If the base model
          is backdoored, adapter review does not help; the base-model backdoor is preserved through
          adapter merging and into deployment.
      - label: 'Correct Approach'
        value: >
          Apply adapter-level defences AND base-model inheritance auditing (Section 8.10). Both are
          necessary; neither is sufficient. Section 8.15 pipeline integrates both as distinct
          auditing tracks.
  - subject: 'Auditing adapters only at initial consumption and not at redistribution points'
    id: mistake_5_ignoring_redistribution_propagation
    entries:
      - label: 'Why It Happens'
        value: >
          Auditing at initial consumption feels like the natural defensive placement. Once an
          adapter passes initial review, it is trusted within the organisation. Redistribution
          (merging it into a model the organisation then distributes externally) inherits the trust
          implicitly. The inheritance is operationally reasonable for most organisational trust but
          structurally dangerous for external distribution.
      - label: Consequence
        value: >
          Organisations redistribute merged models whose provenance includes the original adapter.
          Downstream consumers of the redistribution inherit the adapter attack surface without
          independent review. The supply chain amplifies a single attack.
      - label: 'Correct Approach'
        value: >
          Audit at both initial consumption and redistribution points. The latter requires verifying
          that the redistribution is derived from a known-clean intake and that any further
          modifications did not introduce new issues. Section 8.9 Deliverable 5 provides
          chain-of-trust auditing.
section_summary:
  compact: >
    LoRA adapters are the dominant LLM fine-tuning regime and the LLM-specific supply chain attack
    surface. Adapter swap attacks are structurally simple: adversary produces an adapter with
    backdoor behaviour, publishes it to a distribution channel (HuggingFace PEFT hub, marketplaces),
    and consumers who download and merge it deploy the backdoor automatically. Five principal attack
    variants exist: standard backdoor adapters, stealth adapters (weight-statistics-optimised),
    composition-dependent backdoors, cascading adapters (exploiting companion behaviour), and supply
    chain attacks (typosquatting, credential compromise). Adapter distribution channels provide
    essentially no native provenance verification; trust must be established at the consumer side.
    The three principal detection primitives operate at artifact-level (weight-delta anomaly
    detection, provenance verification) and behavioural-level (behavioural diff testing, with
    separate tracks for individual adapters and compositions). LoRA persistence regime is
    particularly unfavourable to defenders: merged adapter backdoors persist through subsequent LoRA
    fine-tuning completely, and propagate through redistribution supply chains. Auditing must occur
    at both initial consumption and redistribution points. The Chapter 5 Section 5.9 supply chain
    checklist becomes operational in this section: the adapter integrity verifier, behavioural diff
    tester, and provenance auditor are the concrete implementations of what Section 5.9 described
    abstractly. Section 8.10 covers the broader supply chain (HuggingFace, model repositories,
    pickle exploits); Section 8.9 covers the adapter-specific subset. Section 8.15 integrates both
    as distinct auditing tracks in the production pipeline.
  key_takeaways:
    - 'LoRA adapters are executable artifacts; treat them with CI/CD-level verification, not configuration-level trust'
    - 'Adapter swap attack economics are unusually favourable to the attacker: low construction cost, passive distribution, automatic consumer activation'
    - 'Five attack variants span standard backdoor, stealth (weight-optimised), composition-dependent, cascading, and supply chain compromise'
    - 'Distribution channels provide no native provenance verification; consumer-side verification is mandatory'
    - 'Three-primitive ensemble (weight-delta, behavioural diff, provenance) covers most adapter attack variants; compositions require distinct composition-level testing'
    - 'LoRA persistence regime preserves backdoors through subsequent fine-tuning completely; auditing at intake is the primary defensive opportunity'
    - 'Redistribution amplifies supply chain exposure; audit at both intake and redistribution points'
    - 'Chapter 5 Section 5.9 supply chain checklist becomes operational in Section 8.9 deliverables; Section 8.15 integrates into production pipeline'
next:
  kind: section
  target: '10'
  title: 'HuggingFace and Model Repository Risks: Pickle, Code Execution, and Model Card Deception'
  summary: >
    Section 8.9 covered adapter-specific supply chain attacks. Section 8.10 extends to the broader
    model repository attack surface: the HuggingFace hub, model marketplaces, and the infrastructure
    that distributes both base models and adapters. Three principal attack classes get dedicated
    coverage: pickle-based code execution (loading a model executes attacker code), model card
    deception (misleading documentation obscuring malicious artifacts), and typosquatting/
    credential compromise (supply chain attacks on the distribution layer). The SafeTensors
    migration addresses pickle exploits but does not address behavioural compromise of model
    weights. Section 8.10 completes the supply chain attack catalogue that Section 8.15 auditing
    pipeline must cover, operationalising Chapter 5 Section 5.9 checklist items into end-to-end
    CI/CD controls.
