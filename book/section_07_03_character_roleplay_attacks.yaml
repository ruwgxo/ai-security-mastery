                  'restriction_negation_in_persona_definition',
                  'capability_claim_for_persona',
                  'as_persona_answer_format',
              ],
              'fpr_risk': 'low',
              'fpr_note': 'legitimate roleplay rarely includes restriction-negation claims',
              'detection_difficulty': 2,
          },
          'mode_switch': {
              'name': 'Evil Mode / Developer Mode',
              'section': '7.3.3',
              'mechanism': 'mode_switch_claim',
              'prompt_structure': (
