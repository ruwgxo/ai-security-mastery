deliverables:

  deliverable_1:
    title: 'Evasion Defence Architecture'
    filename: 'evasion_defence_architecture.py'
    description: 'The four-stage Chapter 10 defence as data, rendered as a text diagram, with controls grouped by the guarantee they give'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
    code: |
      # evasion_defence_architecture.py
      # Chapter 10 Section 10.16 -- Evasion Defence Architecture
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import List


      @dataclass
      class Control:
          name: str
          section: str
          guarantee: str      # 'formal', 'empirical', 'detection'
          covers: List[str]   # attack families from the Section 10.2 taxonomy
          cost: str


      @dataclass
      class Stage:
          name: str
          when: str
          controls: List[Control]


      ARCHITECTURE: List[Stage] = [
          Stage('Upstream (training time)', 'before deployment, once per model version', [
              Control('PGD adversarial training (Madry)', '10.15', 'empirical',
                      ['FGSM', 'PGD', 'transfer', 'boundary', 'NES'], '~7x training compute'),
              Control('TRADES', '10.15', 'empirical',
                      ['FGSM', 'PGD', 'transfer'], '~10x training compute; beta sets the accuracy cost'),
              Control('Noise-augmented base for smoothing', '10.14', 'formal',
                      ['L2-bounded perturbations'], 'clean accuracy loss grows with sigma'),
          ]),
          Stage('Pre-inference', 'per request, before the main model runs', [
              Control('Feature squeezing filter', '10.11 / 10.13', 'detection',
                      ['FGSM', 'PGD', 'NES'], 'one squeezer pass per configured squeezer'),
              Control('Text canonicaliser', '10.11', 'detection',
                      ['character-level text attacks', 'homoglyph substitution'], 'sub-millisecond'),
          ]),
          Stage('In-inference', 'replaces the single forward pass', [
              Control('Randomised smoothing (certify or predict)', '10.14', 'formal',
                      ['L2-bounded perturbations'], 'n noisy forward passes; abstains when unsure'),
          ]),
          Stage('Post-inference', 'per request, after the main model runs', [
              Control('Consistency checker', '10.12 / 10.13', 'detection',
                      ['boundary', 'C&W (low kappa)', 'PGD'], 'N extra forward passes; async or sampled'),
              Control('Adversarial detector classifier', '10.12 / 10.13', 'detection',
                      ['attack families present in its training set'], 'one small-model pass'),
              Control('AML.T0043 / AML.T0015 Sigma rules', '10.13', 'detection',
                      ['any family that trips a Track 7 primitive'], 'SIEM-side; no request latency'),
          ]),
      ]


      def render(stages: List[Stage]) -> str:
          lines = ['EVASION DEFENCE ARCHITECTURE (Chapter 10)', '']
          for i, stage in enumerate(stages):
              lines.append(f'[{stage.name}]  -- {stage.when}')
              for c in stage.controls:
                  lines.append(f'   * {c.name} (Section {c.section}) [{c.guarantee}]')
                  lines.append(f'       covers: {", ".join(c.covers)}')
                  lines.append(f'       cost:   {c.cost}')
              if i < len(stages) - 1:
                  lines.append('        |')
                  lines.append('        v')
          return '\n'.join(lines)


      def coverage_by_guarantee(stages: List[Stage]) -> dict:
          out: dict = {}
          for stage in stages:
              for c in stage.controls:
                  out.setdefault(c.guarantee, []).append(c.name)
          return out


      if __name__ == '__main__':
          print(render(ARCHITECTURE))
          print()
          for guarantee, names in coverage_by_guarantee(ARCHITECTURE).items():
              print(f'{guarantee:<10} {len(names)} controls: {"; ".join(names)}')

  deliverable_2:
    title: 'Adversarial Taxonomy Reference Card'
    filename: 'adversarial_taxonomy_reference_card.py'
    description: 'Every Chapter 10 attack with access tier, norm, query cost, Track 7 primitive, upstream defence and ATLAS technique, with lookup by name'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
    code: |
      # adversarial_taxonomy_reference_card.py
      # Chapter 10 Section 10.16 -- Attack classes with detection primitive and upstream defence mapping
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import List


      @dataclass
      class AttackCard:
          attack: str
          section: str
          access: str          # 'white_box', 'grey_box', 'black_box', 'transfer', 'physical'
          norm: str
          queries: str
          track7_primitive: str
          upstream_defence: str
          atlas: str


      CARDS: List[AttackCard] = [
          AttackCard('FGSM', '10.3', 'white_box', 'L-inf', '1 gradient',
                     'Feature squeezing', 'Adversarial training (10.15)', 'AML.T0043'),
          AttackCard('PGD', '10.4', 'white_box', 'L-inf / L2', 'k gradients x R restarts',
                     'Feature squeezing + consistency', 'Adversarial training; smoothing for L2 (10.14)', 'AML.T0043'),
          AttackCard('C&W L2', '10.5', 'white_box', 'L2 (minimised)', '~1000 gradients',
                     'Adversarial classifier (high kappa evades squeezing)', 'Smoothing (10.14)', 'AML.T0043'),
          AttackCard('Boundary Attack', '10.6', 'black_box', 'L2 (minimised)', '10k-100k hard-label queries',
                     'Consistency checker + Track 6 query monitor', 'Adversarial training', 'AML.T0043'),
          AttackCard('NES', '10.6', 'grey_box', 'L-inf', '1k-10k soft-label queries per step',
                     'Feature squeezing + Track 6 query monitor', 'Adversarial training', 'AML.T0043'),
          AttackCard('Surrogate transfer', '10.7', 'transfer', 'L-inf', '~0 victim queries after extraction',
                     'Feature squeezing; Chapter 9 extraction controls upstream', 'Adversarial training', 'AML.T0043'),
          AttackCard('Adversarial patch', '10.8', 'physical', 'patch region', '0 (crafted offline)',
                     'Patch localisation; consistency', 'Not covered by Lp defences', 'AML.T0043 / AML.T0029'),
          AttackCard('HotFlip', '10.9', 'white_box', 'token edits', 'gradient per flip',
                     'Text canonicaliser + semantic consistency', 'Adversarial training on text', 'AML.T0043'),
          AttackCard('TextFooler / BERT-Attack', '10.9', 'black_box', 'word substitutions', 'hundreds of queries',
                     'Semantic consistency check', 'Adversarial training; certified text defences', 'AML.T0043'),
      ]


      def print_card(cards: List[AttackCard]) -> None:
          for c in cards:
              print(f'{c.attack} (Section {c.section}) -- {c.access}, {c.norm}, {c.queries}')
              print(f'    Track 7:  {c.track7_primitive}')
              print(f'    upstream: {c.upstream_defence}')
              print(f'    ATLAS:    {c.atlas}')


      def lookup(attack_name: str) -> AttackCard:
          for c in CARDS:
              if c.attack.lower().startswith(attack_name.lower()):
                  return c
          raise KeyError(attack_name)


      if __name__ == '__main__':
          print_card(CARDS)
          card = lookup('boundary')
          print(f'\nlookup("boundary") -> {card.track7_primitive}; ATLAS {card.atlas}')

  deliverable_3:
    title: 'Part 2 Closure Map'
    filename: 'part2_closure_map.py'
    description: 'Chapters 5 to 10 grouped by lifecycle stage with adversary, production control, OWASP category and known gap'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
    code: |
      # part2_closure_map.py
      # Chapter 10 Section 10.16 -- Part 2 closure: Chapters 5-10 threat landscape and defence coverage
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import List


      @dataclass
      class ChapterThreat:
          chapter: int
          threat: str
          lifecycle_stage: str     # 'design', 'training', 'inference'
          adversary: str
          production_control: str
          owasp: List[str]
          known_gap: str


      PART_2: List[ChapterThreat] = [
          ChapterThreat(5, 'Threat modelling: OWASP LLM Top 10, MITRE ATLAS, NIST AI RMF', 'design',
                        'All of the below', 'Threat model and ATLAS Sigma stubs (5.8)',
                        ['framework'], 'Stubs completed chapter by chapter'),
          ChapterThreat(6, 'Prompt injection (direct and indirect)', 'inference',
                        'End user or poisoned content source', 'Gateway Track 1 injection classifier (6.17)',
                        ['LLM01'], 'Novel indirect channels need new training data'),
          ChapterThreat(7, 'Jailbreaks', 'inference',
                        'End user with prompt engineering skill', 'Gateway Tracks 2-5 (7.14)',
                        ['LLM01'], 'Multi-turn erosion detected late in the conversation'),
          ChapterThreat(8, 'Training data poisoning and backdoors', 'training',
                        'Data supplier, contributor, or compromised pipeline', 'Auditing pipeline (8.15)',
                        ['LLM03'], 'Clean-label backdoors evade label statistics'),
          ChapterThreat(9, 'Model extraction, membership inference, inversion', 'inference',
                        'API consumer with a query budget', 'Track 6 + output watermarking (9.11-9.12)',
                        ['LLM10'], 'Benchmark-distribution distillation largely undetected input-side'),
          ChapterThreat(10, 'Adversarial evasion', 'inference',
                         'API consumer, surrogate holder, or physical-world actor', 'Track 7 + adversarial training + smoothing (10.13-10.15)',
                         ['evasion (ATLAS AML.T0015)'], 'Adaptive attacks against known Track 7 configuration'),
      ]


      def render(rows: List[ChapterThreat]) -> str:
          out = ['PART 2 CLOSURE MAP -- Chapters 5 to 10', '']
          for stage in ('design', 'training', 'inference'):
              out.append(f'== {stage.upper()} ==')
              for r in rows:
                  if r.lifecycle_stage == stage:
                      out.append(f'  Ch{r.chapter:<3}{r.threat}')
                      out.append(f'       adversary: {r.adversary}')
                      out.append(f'       control:   {r.production_control}  [{", ".join(r.owasp)}]')
                      out.append(f'       known gap: {r.known_gap}')
              out.append('')
          return '\n'.join(out)


      if __name__ == '__main__':
          print(render(PART_2))
          print('Every known gap above is a Part 3 detection-engineering work item.')

  deliverable_4:
    title: 'Chapter 10 Knowledge Assessment'
    filename: 'chapter10_quiz.py'
    description: '20 multiple-choice questions covering Sections 10.1 to 10.16, with explanations, grading, and an interactive mode'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
      Running the file grades the answer key as a self-check; uncomment run_interactive() to take the quiz.
    code: |
      # chapter10_quiz.py
      # Chapter 10 Section 10.16 -- Knowledge assessment (20 questions)
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import Dict, List


      @dataclass
      class Question:
          number: int
          section: str
          prompt: str
          options: List[str]
          answer: int          # index into options
          explanation: str


      QUIZ: List[Question] = [
          Question(1, '10.1', 'What does Chapter 10 evasion take from Chapter 9 extraction?',
                   ['Stolen training data', 'Decision-boundary maps and surrogate models', 'API keys', 'Nothing; they are unrelated'],
                   1, 'Boundary maps feed FGSM/PGD; distillation surrogates are the transfer vehicle.'),
          Question(2, '10.3', 'FGSM perturbs each input feature by:',
                   ['A random amount up to epsilon', 'Exactly epsilon in the gradient sign direction', 'The gradient magnitude', 'Zero, except one pixel'],
                   1, 'x_adv = x + epsilon * sign(grad): every feature moves by exactly epsilon.'),
          Question(3, '10.4', 'In PGD, the projection must be applied to:',
                   ['The current iterate x_t relative to itself', 'The accumulated delta from the ORIGINAL x', 'The gradient', 'The model weights'],
                   1, 'Projecting x_t against itself lets the epsilon ball drift across steps.'),
          Question(4, '10.4', 'FGSM success far below PGD success at the same epsilon indicates:',
                   ['A robust model', 'Gradient masking', 'A bug in PGD', 'Too many restarts'],
                   1, 'The gradient masking diagnostic: a gap above ~15 points means obfuscated gradients.'),
          Question(5, '10.5', 'What does C&W minimise that PGD does not?',
                   ['Query count', 'The L2 norm of the perturbation', 'Training loss', 'Latency'],
                   1, 'C&W finds the minimum-norm adversarial example instead of maximising loss at fixed epsilon.'),
          Question(6, '10.6', 'Boundary Attack needs which kind of model access?',
                   ['Gradients', 'Soft labels', 'Hard labels only', 'Weights'],
                   2, 'It walks along the boundary using only the predicted class.'),
          Question(7, '10.7', 'Why does a Chapter 9 distillation surrogate make transfer attacks cheap?',
                   ['It shares the victim\'s decision boundary structure', 'It has the victim\'s weights', 'It bypasses Track 7', 'It needs GPU access'],
                   0, 'Shared boundary structure is why adversarial examples transfer at 20-80% rates.'),
          Question(8, '10.8', 'Why do Lp-ball defences not cover adversarial patches?',
                   ['Patches are too small', 'A patch is a large, unbounded change in a small region', 'Patches only work on text', 'They do cover patches'],
                   1, 'A patch violates any small-epsilon Lp bound inside its region.'),
          Question(9, '10.9', 'The main difference between text and image adversarial search is:',
                   ['Text is continuous', 'Text is discrete, so the search is combinatorial', 'Text models have no gradients', 'There is none'],
                   1, 'Token substitution is a discrete search; gradients only rank candidate flips.'),
          Question(10, '10.10', 'The shared root cause across the four Section 10.10 incidents was:',
                    ['Weak passwords', 'Classifiers deployed without adversarial robustness controls', 'Data poisoning', 'Model extraction'],
                    1, 'All four lacked adversarial evaluation and runtime detection.'),
          Question(11, '10.11', 'Feature squeezing detects adversarial inputs because:',
                    ['They are larger files', 'Their predictions change under transformations natural inputs survive', 'They have more tokens', 'They fail checksum'],
                    1, 'Adversarial perturbations are fragile to bit-depth reduction and smoothing.'),
          Question(12, '10.12', 'Consistency checking flags an input when:',
                    ['The model is slow', 'Small random perturbations change its predicted class', 'Confidence is high', 'The user is new'],
                    1, 'Adversarial examples sit near the boundary, so random noise flips them back.'),
          Question(13, '10.13', 'What is unique about Track 7 among the seven gateway tracks?',
                    ['It is stateful', 'It has a pre-inference stage', 'It runs offline', 'It uses Sigma only'],
                    1, 'Squeezing must transform the input before the main model sees it.'),
          Question(14, '10.14', 'The randomised smoothing certified radius is:',
                    ['epsilon / sqrt(d)', 'sigma * Phi^-1(p_A_lower)', 'p_A / sigma', '1 / sigma'],
                    1, 'Cohen et al. 2019 Theorem 1 with p_B_upper = 1 - p_A_lower.'),
          Question(15, '10.14', 'Why must CERTIFY draw fresh samples after choosing the top class?',
                    ['To save time', 'Reusing the selection samples biases p_A upward and voids the guarantee', 'GPU memory', 'It does not need to'],
                    1, 'Selection and estimation must be independent for the confidence bound to hold.'),
          Question(16, '10.14', 'A smoothed classifier with n samples and a unanimous vote can certify at most:',
                    ['Any radius', 'sigma * Phi^-1(alpha^(1/n))', 'sigma', 'epsilon'],
                    1, 'With k = n the Clopper-Pearson bound is alpha^(1/n): sample count caps the radius.'),
          Question(17, '10.15', 'Madry adversarial training solves:',
                    ['min over weights of max over perturbations of the loss', 'max over weights of the loss', 'min loss on clean data only', 'A certified bound'],
                    0, 'The inner max is PGD; the outer min is the training step.'),
          Question(18, '10.15', 'Catastrophic overfitting in FGSM training shows up as:',
                    ['Clean accuracy collapsing', 'PGD accuracy collapsing while FGSM accuracy stays high', 'Training loss exploding', 'NaN weights'],
                    1, 'The model defeats the single-step linearisation rather than becoming robust.'),
          Question(19, '10.15', 'In TRADES, the beta parameter controls:',
                    ['Learning rate', 'The weight on the robustness (KL) term versus clean accuracy', 'Epsilon', 'Batch size'],
                    1, 'beta = 0 is standard training; higher beta trades accuracy for robustness.'),
          Question(20, '10.16', 'Which statement about the Chapter 10 defence stack is correct?',
                    ['Adversarial training makes Track 7 unnecessary', 'Certified robustness covers all norms',
                     'Upstream training and runtime detection are both required; neither is sufficient alone',
                     'Detection alone is sufficient'],
                    2, 'Training shrinks the attack surface; Track 7 catches what survives into production.'),
      ]


      def grade(answers: Dict[int, int]) -> float:
          correct = 0
          for q in QUIZ:
              given = answers.get(q.number)
              if given == q.answer:
                  correct += 1
              else:
                  print(f'Q{q.number} ({q.section}): expected "{q.options[q.answer]}" -- {q.explanation}')
          score = correct / len(QUIZ)
          print(f'\nScore: {correct}/{len(QUIZ)} ({score:.0%})')
          return score


      def run_interactive() -> None:
          answers = {}
          for q in QUIZ:
              print(f'\nQ{q.number} [Section {q.section}] {q.prompt}')
              for i, opt in enumerate(q.options):
                  print(f'  {i}) {opt}')
              raw = input('Answer: ').strip()
              answers[q.number] = int(raw) if raw.isdigit() else -1
          grade(answers)


      if __name__ == '__main__':
          assert len(QUIZ) == 20 and all(0 <= q.answer < len(q.options) for q in QUIZ)
          print('Self-check with the answer key:')
          grade({q.number: q.answer for q in QUIZ})
          # run_interactive()  # uncomment to take the quiz

  deliverable_5:
    title: 'Seven-Track Gateway Security Checklist'
    filename: 'seven_track_gateway_checklist.py'
    description: '15 go-live checks across Tracks 1 to 7, output controls and upstream hardening, each tied to the section that defines it'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
    code: |
      # seven_track_gateway_checklist.py
      # Chapter 10 Section 10.16 -- Seven-track gateway security checklist for production AI deployments
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import Dict, List


      @dataclass
      class GateCheck:
          track: str
          source: str
          check: str


      CHECKS: List[GateCheck] = [
          GateCheck('Track 1', 'Section 6.17', 'Injection classifier threshold calibrated on production prompts'),
          GateCheck('Track 1', 'Section 6.17', 'Indirect channels (RAG, web, email, tools) routed through the classifier'),
          GateCheck('Track 1', 'Section 7.14', 'Semantic jailbreak classifier deployed alongside the injection classifier'),
          GateCheck('Tracks 2-5', 'Section 7.14', 'Perplexity, shot-count, trajectory and coherence detectors enabled'),
          GateCheck('Tracks 2-5', 'Section 7.14', 'Session state retained long enough for multi-turn trajectory scoring'),
          GateCheck('Track 6', 'Section 9.11', 'Per-user query monitor and four-dimension rate limiter enforced'),
          GateCheck('Track 6', 'Section 9.11', 'Cross-user correlator enabled for distributed extraction campaigns'),
          GateCheck('Output', 'Section 9.12', 'Output watermarking on; detector key stored outside the serving path'),
          GateCheck('Track 7', 'Section 10.13', 'Squeezer threshold calibrated; FPR measured on production inputs'),
          GateCheck('Track 7', 'Section 10.13', 'Consistency checker sub-sampled or async within the 50 ms P99 budget'),
          GateCheck('Track 7', 'Section 10.13', 'Adaptive-adversary test run against the deployed Track 7 configuration'),
          GateCheck('Upstream', 'Section 10.15', 'Model hardened with adversarial training; checklist in 10.15 passed'),
          GateCheck('Upstream', 'Section 10.14', 'Certification decision recorded (certified, offline audit, or empirical)'),
          GateCheck('All tracks', 'Section 10.13', 'Every track fails open with an alert; no track can block on its own exception'),
          GateCheck('All tracks', 'Sections 5.8 / 10.13', 'Sigma rules deployed for every ATLAS technique the gateway claims'),
      ]


      def run(status: Dict[int, bool]) -> List[GateCheck]:
          '''status maps check index -> verified. Missing entries count as not verified.'''
          open_items = []
          print('Seven-Track Gateway Security Checklist')
          print('=' * 72)
          for i, c in enumerate(CHECKS):
              ok = status.get(i, False)
              if not ok:
                  open_items.append(c)
              print(f'[{"OK" if ok else "  "}] {c.track:<11}{c.check}  ({c.source})')
          print(f'\n{len(CHECKS) - len(open_items)}/{len(CHECKS)} verified')
          return open_items


      if __name__ == '__main__':
          # Example: everything verified except the adaptive-adversary test and the certification decision.
          verified = {i: True for i in range(len(CHECKS))}
          verified[10] = False
          verified[12] = False
          remaining = run(verified)
          if remaining:
              print('Open before go-live:')
              for c in remaining:
                  print(f'  - {c.track}: {c.check}')

  deliverable_6:
    title: 'Cumulative Cross-Chapter Integration Diagram'
    filename: 'cumulative_integration_diagram.py'
    description: 'The gateway after Part 2: Chapter 6 to 10 controls placed upstream, pre-inference, in parallel tracks and post-inference'
    implementation_notes: |
      Python 3.12, single quotes throughout per book convention. No external dependencies.
    code: |
      # cumulative_integration_diagram.py
      # Chapter 10 Section 10.16 -- Cumulative cross-chapter integration: Ch6 + Ch7 + Ch8 + Ch9 + Ch10
      # 20260614 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention.

      from dataclasses import dataclass
      from typing import List


      @dataclass
      class Layer:
          chapter: str
          name: str
          position: str        # 'upstream', 'pre_inference', 'parallel_track', 'post_inference'
          state: str           # 'stateless', 'stateful', 'offline'
          covers: str


      LAYERS: List[Layer] = [
          Layer('Ch8', 'Training data auditing pipeline (8.15)', 'upstream', 'offline', 'LLM03 poisoning'),
          Layer('Ch10', 'Adversarial training / noise-augmented training (10.14-10.15)', 'upstream', 'offline', 'evasion'),
          Layer('Ch10', 'Track 7 stage 1: feature squeezing filter (10.13)', 'pre_inference', 'stateless', 'evasion'),
          Layer('Ch6-7', 'Track 1: injection + semantic jailbreak classifiers (6.17, 7.14)', 'parallel_track', 'stateless', 'LLM01'),
          Layer('Ch7', 'Tracks 2-5: perplexity, shot count, trajectory, coherence (7.14)', 'parallel_track', 'stateful', 'LLM01 jailbreak'),
          Layer('Ch9', 'Track 6: query monitor + rate limiter (9.11)', 'parallel_track', 'stateful', 'LLM10 extraction'),
          Layer('Ch10', 'Track 7 stage 2: consistency + adversarial classifier (10.13)', 'post_inference', 'stateless', 'evasion'),
          Layer('Ch9', 'Output watermarking + perturbation (9.12)', 'post_inference', 'stateless', 'LLM10 extraction'),
      ]

      ORDER = ['upstream', 'pre_inference', 'parallel_track', 'post_inference']
      TITLES = {
          'upstream': 'UPSTREAM (before deployment)',
          'pre_inference': 'REQUEST -> PRE-INFERENCE',
          'parallel_track': 'PARALLEL DETECTION TRACKS (50 ms P99 budget)',
          'post_inference': 'MODEL -> POST-INFERENCE -> RESPONSE',
      }


      def render(layers: List[Layer]) -> str:
          out = ['CUMULATIVE GATEWAY AFTER PART 2', '']
          for pos in ORDER:
              out.append(TITLES[pos])
              for layer in layers:
                  if layer.position == pos:
                      out.append(f'  | {layer.chapter:<5}{layer.name:<66}[{layer.state}] {layer.covers}')
              out.append('  v')
          out[-1] = '  (response served)'
          return '\n'.join(out)


      if __name__ == '__main__':
          print(render(LAYERS))
          chapters = sorted({layer.chapter for layer in LAYERS}, key=lambda c: int(c[2:].split('-')[0]))
          print(f'\nChapters contributing controls: {", ".join(chapters)}')

common_mistakes:

  mistake_1:
    description: 'Choosing one defence surface and skipping the other'
    why_it_happens: |
      Adversarial training looks like it makes runtime detection unnecessary, or Track 7 looks like it
      makes retraining unnecessary.
    consequence: |
      Hardening alone leaves the norms and budgets it was not trained on undefended and unobserved.
      Detection alone leaves an undefended model behind a detector that Section 10.13 showed an adaptive
      adversary can evade.
    correct_approach: |
      Deploy both surfaces. Use the evasion defence architecture to check that every attack family on
      the reference card has an upstream control, a runtime control, or a documented gap.

  mistake_2:
    description: 'Ignoring the Chapter 9 to Chapter 10 link'
    why_it_happens: |
      Extraction and evasion are filed as separate threats with separate owners.
    consequence: |
      An extraction campaign that Track 6 missed produces a surrogate, and the evasion that follows needs
      almost no queries to the victim. The evasion team sees attacks with no query footprint and no
      warning.
    correct_approach: |
      Treat extraction alerts as early warning for evasion. When Track 6 flags a campaign, tighten Track 7
      thresholds for the same tenant or API key.

  mistake_3:
    description: 'Stating robustness without a threat model'
    why_it_happens: |
      "Robust" and "certified" are used as properties of the model in reports and model cards.
    consequence: |
      Stakeholders assume protection against attacks that were never evaluated, such as L2 attacks on an
      L-infinity-trained model or semantic rewrites against a certified synonym-substitution classifier.
    correct_approach: |
      Every robustness statement names norm, epsilon or radius, evaluation attack, and date. The 10.15
      checklist enforces this for hardened models.

  mistake_4:
    description: 'Treating Part 2 thresholds as production-calibrated'
    why_it_happens: |
      The gateway tracks work on the chapter examples, so their thresholds are reused as-is.
    consequence: |
      Thresholds tuned on a few hundred chapter examples produce either alert fatigue or missed attacks on
      real traffic.
    correct_approach: |
      Treat every Part 2 threshold as provisional. Chapter 11 introduces the testing and calibration
      programme that replaces them.

section_summary:

  compact: |
    Chapter 10 turned Chapter 9's decision-boundary maps and surrogate models into evasion attacks:
    white-box FGSM, PGD and C&W; black-box Boundary Attack and NES; surrogate transfer; physical patches;
    and discrete text attacks. Section 10.10's incidents showed the shared root cause -- classifiers
    deployed without adversarial controls. The defence has two surfaces. At runtime, Track 7 adds feature
    squeezing before inference and consistency checking plus an adversarial classifier after it, completing
    the seven-track gateway and the AML.T0043/T0015 Sigma rules. Upstream, randomised smoothing gives a
    formal but narrow L2 certificate, and adversarial training gives broad but empirical robustness for the
    norm it was trained and evaluated on. Neither surface is sufficient alone. With Chapter 10, Part 2 has
    covered threat modelling, injection, jailbreaks, poisoning, extraction and evasion, built the gateway
    that defends against them, and named the known gaps and detection debt that Part 3 addresses.

  key_takeaways:
    - 'Chapter 9 extraction and Chapter 10 evasion share infrastructure; defending one weakens the other'
    - 'PGD is the evaluation baseline, C&W the defence breaker, and transfer the zero-query attack after extraction'
    - 'Track 7 is the only gateway track with a pre-inference stage'
    - 'Smoothing is provable but narrow; adversarial training is broad but empirical; detection catches what both miss'
    - 'Every robustness claim needs a threat model: norm, budget, evaluation attack'
    - 'Part 2 built a working gateway with known gaps and detection debt; Part 3 turns it into an engineered detection programme'

preview_part_3:
  title: 'Part 3: Detection Engineering (Chapters 11-14)'
  preview: |
    Part 2 taught the attacks and built detection alongside them. Part 3 makes that detection rigorous.
    Chapter 11 (Detection Framework Design) introduces detection-as-code: every rule in version control
    with tests that prove it fires on known-bad input and stays quiet on known-good input, coverage mapped
    to MITRE ATT&CK and ATLAS, and a maturity model to measure the gateway against. Chapter 12 (ML-Based
    Detection Systems) builds detectors trained on labelled security datasets. Chapter 13 (Behavioural
    Analysis and Monitoring) adds baselines, drift detection and user and session profiling. Chapter 14
    (Production Deployment) deploys the complete detection suite with latency budgets, failure-mode
    analysis and monitoring dashboards.

