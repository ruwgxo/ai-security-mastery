---
document_info:
  title: 'Chapter 10 Summary: Evasion Defence Architecture and Part 2 Closure'
  chapter: 10
  section: 16
  section_code: '1016'
  author: 'Raghav Dinesh'
  github: 'https://github.com/ruwgxo/ai-security-mastery'
  license: 'MIT'
  version: '1.0'
  created: '2026-06-14'
  estimated_pages: 6
  estimated_reading_time: '30-40 minutes'

section_overview:
  one_line_summary: 'Chapter 10 turned Chapter 9''s boundary maps and surrogates into attacks that force wrong outputs, then built a defence on two surfaces -- a hardened model upstream and Track 7 at runtime -- and with it closes Part 2''s map of the AI security threat landscape.'
  why_this_section_exists: |
    Chapter 10 is the longest attack chapter in the book and the last chapter of Part 2. It
    covered eight attack families across three access tiers and two modalities, a detection
    library, a production track, and two upstream defences with very different guarantees. This
    section compresses that into an architecture you can hold in your head and a reference you can
    return to. It then steps back to Part 2 as a whole: six chapters, one threat landscape, one
    gateway, and a list of known gaps that Part 3 exists to close.
  position_in_chapter: |
    Section 10.16 closes Chapter 10 and Part 2. Sections 10.1 to 10.10 are the attack half of the
    chapter; Sections 10.11 to 10.13 the runtime defence; Sections 10.14 and 10.15 the upstream
    defence. Part 3 begins with Chapter 11, which takes the Part 2 gateway and turns it into an
    engineered detection programme.

learning_objectives:

  knowledge:
    - 'Place every Chapter 10 attack on the access-tier ladder and name its Track 7 primitive and upstream defence'
    - 'Describe the four stages of the evasion defence architecture and the guarantee each one gives'
    - 'Explain why Chapter 10 needs both upstream hardening and runtime detection'
    - 'Map Chapters 5 to 10 onto the design, training and inference stages of the AI lifecycle'
    - 'Name the known gap each Part 2 chapter leaves for Part 3'

  skills:
    - 'Use the reference card to choose detection and hardening controls for a given attack'
    - 'Run the seven-track gateway checklist before a production launch'
    - 'Assess Chapter 10 knowledge with the 20-question quiz'

  security_mindset:
    - 'Think in surfaces, not tools: every threat in Part 2 needed an upstream control and a runtime control'
    - 'Treat every claimed defence as conditional on a threat model, a norm, and an evaluation'
    - 'Read the known-gaps list as the work queue, not as a footnote'

prerequisites:
  - 'Sections 10.1 to 10.15'
  - 'Section 9.13: Chapter 9 summary (the six-track gateway this chapter extends)'

prose_content:

  part_1:
    title: 'Sections 10.1 and 10.2 in Review: From Extraction to Evasion'
    body: |
      Chapter 9 ended with an adversary who had mapped the victim's decision boundary and trained a
      surrogate. Section 10.1 showed what that adversary does next: force a specific input across the
      boundary. The threat model shifted from "reconstruct the model" to "make the model wrong on this
      input", and the access ladder from Chapter 9 -- white box, grey box, black box -- carried over
      unchanged. Section 10.2 organised the attacks into a taxonomy of four goals across those access
      tiers and across modalities, and assigned every cell a canonical technique and a Track 7
      detection primitive. That taxonomy is the spine of this summary's reference card.

  part_2:
    title: 'Sections 10.3 to 10.5 in Review: White-Box Attacks'
    body: |
      FGSM (Section 10.3) moves every input feature by exactly epsilon in the direction of the loss
      gradient's sign: one gradient, one step, and the primitive every later attack builds on. PGD
      (Section 10.4) iterates FGSM with projection of the accumulated perturbation back onto the
      epsilon ball and random restarts; it is the inner solver of the Madry robust objective and the
      reference evaluation for every defence in the chapter. Its gradient-masking diagnostic -- FGSM
      success far below PGD success -- reappears in Section 10.15. C&W (Section 10.5) changes the
      question from "maximise loss at fixed epsilon" to "find the smallest perturbation that flips the
      label", and with a confidence margin kappa it produces the high-confidence examples that slip
      past squeezing and consistency checks. Carlini and Wagner built it to break defences, and the
      chapter used it for that purpose.

  part_3:
    title: 'Sections 10.6 and 10.7 in Review: Attacks Without Gradients'
    body: |
      Section 10.6 removed gradient access. Boundary Attack starts from an already-misclassified input
      and walks toward the target using only hard labels; NES estimates the gradient from pairs of
      soft-label queries. Both run in the same API space that Chapter 9 extraction did, and both leave
      the query footprint that Track 6 monitors. Section 10.7 removed even that footprint. Adversarial
      examples crafted against a surrogate transfer to the victim at substantial rates, and the
      surrogate is exactly what Chapter 9 distillation produces. After the extraction campaign, the
      evasion campaign costs the victim almost no queries. This is the mechanistic link between the two
      chapters: defending against extraction also defends against transfer evasion.

  part_4:
    title: 'Sections 10.8 to 10.10 in Review: Physical, Text and Real Incidents'
    body: |
      Section 10.8 took the attack off the API entirely. Printed patches, stickers on stop signs and
      adversarial 3D objects fool vision systems at the sensor, and because a patch is a large change in
      a small region, no small-epsilon Lp defence covers it. Section 10.9 moved to text, where the search
      is discrete: HotFlip uses gradients to rank token flips, and TextFooler-style attacks substitute
      words under a semantic-similarity constraint. These are the automated cousins of the Chapter 7
      jailbreaks. Section 10.10 grounded the catalogue in four documented incidents -- stop-sign
      detection, facial recognition, content moderation and malware classification -- with one shared
      root cause: classifiers deployed without adversarial evaluation or runtime detection.

  part_5:
    title: 'Sections 10.11 to 10.13 in Review: Track 7'
    body: |
      The runtime defence uses three detection primitives. Feature squeezing (Section 10.11) exploits
      the fragility of adversarial perturbations to bit-depth reduction and smoothing: natural inputs
      keep their label, adversarial ones often lose it. Consistency checking (Section 10.12) exploits the
      same fragility with random perturbation, and the adversarial detector classifier learns the
      statistics of adversarial inputs directly but generalises only to attack families it was trained
      on. Section 10.13 wired them into Track 7, the only gateway track with a pre-inference stage:
      squeezing transforms the input before the model sees it, and the consistency check and classifier
      run afterwards in parallel. Track 7 also completed the AML.T0043 and AML.T0015 Sigma rules left as
      stubs in Chapter 5. Its own adaptive-adversary test showed that an attacker who knows the
      configuration can push through, which is why the chapter did not stop there.

  part_6:
    title: 'Sections 10.14 and 10.15 in Review: Changing the Model Itself'
    body: |
      Section 10.14 built the only defence in the chapter whose claim no attack can break. Randomised
      smoothing certifies, per input, that no L2 perturbation below sigma * Phi^-1(p_A_lower) changes
      the output. The guarantee is narrow -- L2 only, capped by the sample budget, paid for in clean
      accuracy and abstentions -- and certified accuracy sits below what empirical defences report.
      Section 10.15 built the strongest empirical defence: adversarial training against PGD, with fast
      FGSM training and TRADES as cheaper and more controllable variants. It showed why robustness
      costs accuracy (models give up non-robust features), how training silently fails (catastrophic
      overfitting, robust overfitting), and why robustness is norm-specific. Together the two sections
      are the upstream surface of the defence.

  part_7:
    title: 'Integration: The Evasion Defence Architecture'
    body: |
      evasion_defence_architecture.py lays the chapter out as four stages. Upstream, before
      deployment: adversarial training or TRADES, and noise-augmented training if the model will be
      smoothed. Pre-inference: the feature-squeezing filter and, for text, the canonicaliser. In
      inference: randomised smoothing, when a certificate is required. Post-inference: the consistency
      checker, the adversarial classifier, and the Sigma rules that carry Track 7's signals into the
      SIEM.

      The stages give different kinds of guarantee. Smoothing gives a formal one for a narrow threat
      model. Adversarial training gives an empirical one for the threat model it was trained and
      evaluated against. Track 7 gives detection, which says nothing about robustness but catches
      attempts the other two miss -- including those in norms neither covers. No stage is sufficient
      alone, and the chapter's central design rule follows: harden the model upstream so fewer
      adversarial examples exist, and detect at runtime the ones that still reach production.

  part_8:
    title: 'Part 2 Closure: Six Chapters, One Threat Landscape'
    body: |
      Part 2 began in Chapter 5 with frameworks -- OWASP LLM Top 10, MITRE ATLAS and the NIST AI RMF --
      and the observation that AI systems inherit every traditional attack surface and add new ones.
      Chapters 6 to 10 then took one attack class each. Prompt injection (Chapter 6) and jailbreaks
      (Chapter 7) attack the instructions at inference time and are covered by gateway Tracks 1 to 5.
      Poisoning (Chapter 8) attacks the training data and is covered upstream by the auditing pipeline.
      Extraction (Chapter 9) attacks the model's confidentiality through its API and is covered by Track
      6 and output watermarking. Evasion (Chapter 10) attacks the model's integrity on individual inputs
      and is covered by Track 7 and the upstream hardening of Sections 10.14 and 10.15.

      part2_closure_map.py places each chapter on the design, training and inference stages of the
      lifecycle, and cumulative_integration_diagram.py shows the gateway those chapters built: two
      upstream controls, a pre-inference filter, six parallel inference-time tracks, and two
      post-inference controls. Two patterns recur in every chapter. Each threat needed both a control
      that changes the system before the attack (data audits, differential privacy, adversarial
      training) and a control that watches for it at runtime (the gateway tracks). And each chapter
      ended with a known gap: novel indirect-injection channels, late detection of multi-turn
      jailbreaks, clean-label backdoors, benchmark-distribution distillation, and adaptive evasion.

  part_9:
    title: 'Five Cross-Cutting Threads'
    body: |
      Attack infrastructure is shared. Chapter 9's boundary maps and surrogates are Chapter 10's attack
      inputs; Chapter 10's token substitution automates Chapter 7's jailbreaks. Defending one stage of an
      attacker's pipeline weakens the stages that depend on it.

      Every defence has a threat model. Track 1 covers the injection channels it was trained on;
      smoothing covers L2; adversarial training covers the norm and epsilon it was evaluated at. A claim
      that does not name its threat model is not a claim.

      Evaluation decides the claim. Chapter 10's evaluation rules -- evaluation-grade PGD, transfer and
      C&W checks, adaptive adversaries -- apply to every detector in the book.

      Upstream and runtime controls are complementary. Every chapter needed both.

      Detection debt accumulates. Every track in the gateway was built against chapter examples, with
      thresholds tuned on them. That is the starting point Part 3 picks up.

  part_10:
    title: 'Quick Reference and Part 3 Preview'
    body: |
      Use adversarial_taxonomy_reference_card.py to go from an attack to its detection primitive,
      upstream defence and ATLAS technique; use seven_track_gateway_checklist.py before a launch; and use
      chapter10_quiz.py to check your understanding of the chapter.

      Part 3 (Detection Engineering, Chapters 11 to 14) changes the reader's role from attacker-aware
      builder to detection engineer. The gateway works, but it carries the debt listed in the threads
      above: rules without tests, thresholds without calibration, coverage without measurement, no
      version history, and no maturity baseline. Chapter 11 turns detections into code with tests, CI
      and ATT&CK and ATLAS coverage maps. Chapter 12 builds ML-based detectors on labelled security data.
      Chapter 13 adds behavioural analysis over users and sessions. Chapter 14 deploys the whole system
      under production latency, failure-mode and monitoring requirements.

