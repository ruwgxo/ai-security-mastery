section_overview:
  one_line_summary: |-
    The stage where the feedback loop closes at the analyst: dataset curation turns a stream of analyst dispositions of SIEM alerts into a labelled, quality-gated dataset fit to retrain on -- which means far more than collecting labels, because it must resolve conflicting dispositions of the same detection into one trustworthy label, handle the class imbalance that makes benign traffic swamp the rare real attacks, and refuse to emit a dataset whose label quality is too low to train on safely, since retraining on bad labels degrades the very detectors it was meant to improve.
  why_this_section_exists: |-
    The measurement stage (17.02-17.03) told the suite where it is weak. The improvement stage has to do something about it, and everything downstream -- retraining, A/B testing -- depends on one input: labelled data that reflects how the detectors are actually performing on live traffic. This section produces that input, and it exists because producing it well is much harder than it first appears. The naive view is that curation is collection: gather the detections analysts marked true or false and hand them to the trainer. The real work is everything that makes those collected labels trustworthy enough to retrain on, because a detector retrained on bad labels does not stay the same -- it gets worse, confidently, in the direction the bad labels point.

    This is where the feedback loop of the whole chapter physically closes. A detection fires, becomes a SIEM alert through the Chapter 16 integration, and reaches an analyst who dispositions it -- true positive, this was a real attack; false positive, this was benign. That disposition is a label on the original detection, and the accumulation of dispositions is the training signal that flows from operations back to detection. The section builds the pipeline that carries that signal, and it confronts the three problems that make a raw disposition stream unfit to train on directly. First, analysts disagree: the same alert can be dispositioned differently by different reviewers, and the conflict must be resolved into a single label with a confidence that reflects the disagreement. Second, attacks are rare, so the labelled set is overwhelmingly false positives, and training on it as-is teaches a detector that nothing is an attack. Third, some labels are simply too weak to use -- low agreement, all-unknown dispositions -- and a dataset with too few trustworthy examples or too few real attacks must be refused rather than passed on. Curation is the discipline that turns a noisy disposition stream into a dataset that improves detectors instead of poisoning them. It extends the Chapter 12 Section 12.14 live curation with exactly the disposition feedback the Chapter 16 SIEM integration made available.
  position_in_chapter: |-
    Section 17.04 opens the improvement half of the loop, converting the measurement of 17.02-17.03 into the labelled data that retraining consumes. It is where the feedback loop closes at the analyst, turning the Chapter 16 alert dispositions into training labels. It extends the Chapter 12 Section 12.14 dataset curation and model registry, and its curated, quality-gated output is the direct input to the retraining of Section 17.05, whose validation exists precisely because curation cannot guarantee perfect labels.
