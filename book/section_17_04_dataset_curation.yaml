deliverables:
  deliverable_1:
    title: The Dataset Curator
    filename: dataset_curator.py
    description: |-
      Turns a stream of analyst dispositions into a curated, quality-gated labelled dataset. AlertDisposition captures one analyst's verdict on one detection with a confidence; resolve_disposition combines conflicting dispositions of the same detection by confidence-weighted vote into a single LabelledExample whose confidence reflects the agreement; ClassBalance measures the imbalance; CuratedDataset.training_view produces the rebalanced training subset while the full set is retained for evaluation; and DatasetCurator applies the quality gate, reporting the dataset as trainable or refusing it with reasons.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library collections, dataclasses, enum, and typing only. Dispositions are keyed by detection_id so multiple analysts' calls on one detection are grouped and resolved together; UNKNOWN dispositions contribute no label. The training view keeps every attack and caps benign at max_imbalance x attacks, selecting the highest-confidence negatives, so the full distribution is preserved for evaluation while training sees a learnable one. The __main__ block exercises unanimous labels, a contested senior-vs-junior detection (resolves to attack at ~0.69 confidence), an even split (dropped by the gate), and an all-unknown detection (no label), then verifies the imbalance handling and the trainable gate.
    code: |
      # dataset_curator.py
      # Section 17.04: Dataset Curation -- Collecting True and False Positives
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The feedback loop closes here. A detector fires, the detection becomes a SIEM
      # alert (Chapter 16), an analyst dispositions that alert as a true or false
      # positive, and that disposition is a label on the original detection. This
      # module turns a stream of dispositions into a curated, labelled dataset fit to
      # retrain on -- which means three things beyond just collecting them: resolving
      # conflicting dispositions of the same detection into one trustworthy label,
      # handling the class imbalance that makes benign traffic swamp real attacks, and
      # refusing to emit a dataset whose label quality is too low to train on safely.
      # It extends the Chapter 12 Section 12.14 live curation with the analyst-
      # disposition feedback the Chapter 16 SIEM integration makes available.

      from collections import Counter, defaultdict
      from dataclasses import dataclass, field
      from enum import Enum
      from typing import Dict, List, Optional, Tuple


      class Disposition(Enum):
          TRUE_POSITIVE = 'true_positive'          # analyst confirms it was a real attack
          FALSE_POSITIVE = 'false_positive'        # analyst confirms it was benign
          UNKNOWN = 'unknown'                       # analyst could not decide -- not a label


      # --- One analyst disposition of one alert -----------------------------------
      # detection_id ties the disposition back to the detection it labels. Multiple
      # analysts may disposition the same alert; confidence lets a senior review
      # outweigh a rushed triage.

      @dataclass
      class AlertDisposition:
          detection_id: str
          detector: str
          surface: str                             # 'input' | 'output'
          payload_ref: str                         # opaque reference to the detection payload
          disposition: Disposition
          analyst_id: str
          confidence: float = 1.0                  # 0..1 weight for this analyst's call


      # --- A finalised label on a detection ---------------------------------------

      @dataclass
      class LabelledExample:
          detection_id: str
          detector: str
          surface: str
          payload_ref: str
          is_attack: bool
          label_confidence: float                  # agreement-weighted confidence in the label


      # --- Resolving conflicting dispositions -------------------------------------
      # Two analysts can disposition the same alert differently. Discarding conflicts
      # loses data; taking the last one is arbitrary. Resolve by confidence-weighted
      # vote, and carry the resulting agreement forward as the label's confidence, so
      # a contested label is later trusted less than a unanimous one.

      def resolve_disposition(group: List[AlertDisposition]) -> Optional[LabelledExample]:
          weight = {Disposition.TRUE_POSITIVE: 0.0, Disposition.FALSE_POSITIVE: 0.0}
          for d in group:
              if d.disposition in weight:
                  weight[d.disposition] += d.confidence
          tp_w, fp_w = weight[Disposition.TRUE_POSITIVE], weight[Disposition.FALSE_POSITIVE]
          total = tp_w + fp_w
          if total == 0:
              return None                          # only UNKNOWN dispositions -- no label
          is_attack = tp_w >= fp_w
          winning = tp_w if is_attack else fp_w
          first = group[0]
          return LabelledExample(first.detection_id, first.detector, first.surface,
                                 first.payload_ref, is_attack, round(winning / total, 4))


      # --- Class imbalance --------------------------------------------------------
      # Attacks are rare, so a raw curated set is mostly false positives. Training on
      # it as-is teaches the detector that everything is benign. The curator reports
      # the imbalance and can produce a rebalanced view -- capping the majority class
      # to a target ratio -- without discarding the minority, so retraining sees a
      # learnable distribution while the full set is retained for evaluation.

      @dataclass
      class ClassBalance:
          attacks: int
          benign: int

          @property
          def total(self) -> int:
              return self.attacks + self.benign

          @property
          def attack_fraction(self) -> float:
              return self.attacks / self.total if self.total else 0.0

          @property
          def imbalance_ratio(self) -> float:
              '''Majority : minority. 1.0 is balanced; large means benign-dominated.'''
              if self.attacks == 0:
                  return float('inf') if self.benign else 0.0
              return max(self.attacks, self.benign) / min(self.attacks, self.benign)


      @dataclass
      class CurationQualityConfig:
          min_label_confidence: float = 0.6        # drop labels below this agreement
          min_examples: int = 20                   # refuse to emit a dataset smaller than this
          min_attacks: int = 5                     # refuse if too few positives to learn from
          max_imbalance_for_training: float = 10.0 # cap majority:minority in the training view


      @dataclass
      class CuratedDataset:
          examples: List[LabelledExample]
          balance: ClassBalance
          dropped_low_confidence: int
          trainable: bool
          reasons: List[str] = field(default_factory=list)

          def training_view(self, cfg: CurationQualityConfig) -> List[LabelledExample]:
              '''A rebalanced subset for retraining: keep every attack, cap benign at
              max_imbalance x attacks. The full self.examples stays intact for
              evaluation, which must see the true distribution.'''
              attacks = [e for e in self.examples if e.is_attack]
              benign = [e for e in self.examples if not e.is_attack]
              if not attacks:
                  return list(attacks)
              cap = int(len(attacks) * cfg.max_imbalance_for_training)
              # keep the highest-confidence benign examples up to the cap -- deterministic
              benign_sorted = sorted(benign, key=lambda e: e.label_confidence, reverse=True)
              return attacks + benign_sorted[:cap]


      class DatasetCurator:
          '''Turns a stream of analyst dispositions into a curated, quality-gated
          labelled dataset. The gate is the point: an unsafe-to-train-on dataset is
          reported as untrainable rather than silently handed to retraining, because
          retraining on bad labels degrades the detector (17.05).'''

          def __init__(self, config: Optional[CurationQualityConfig] = None) -> None:
              self._cfg = config if config is not None else CurationQualityConfig()
              self._by_detection: Dict[str, List[AlertDisposition]] = defaultdict(list)

          def ingest(self, disposition: AlertDisposition) -> None:
              self._by_detection[disposition.detection_id].append(disposition)

          def curate(self) -> CuratedDataset:
              resolved: List[LabelledExample] = []
              for group in self._by_detection.values():
                  label = resolve_disposition(group)
                  if label is not None:
                      resolved.append(label)

              kept = [e for e in resolved if e.label_confidence >= self._cfg.min_label_confidence]
              dropped = len(resolved) - len(kept)

              attacks = sum(1 for e in kept if e.is_attack)
              benign = len(kept) - attacks
              balance = ClassBalance(attacks, benign)

              reasons: List[str] = []
              if len(kept) < self._cfg.min_examples:
                  reasons.append(f'too few examples ({len(kept)} < {self._cfg.min_examples})')
              if attacks < self._cfg.min_attacks:
                  reasons.append(f'too few attacks ({attacks} < {self._cfg.min_attacks})')
              trainable = not reasons

              return CuratedDataset(kept, balance, dropped, trainable, reasons)


      if __name__ == '__main__':
          cfg = CurationQualityConfig()
          curator = DatasetCurator(cfg)

          # 8 real attacks, unanimously dispositioned as true positives.
          for i in range(8):
              curator.ingest(AlertDisposition(f'atk-{i}', 'prompt_injection', 'input',
                                              f'ref-atk-{i}', Disposition.TRUE_POSITIVE, 'ana-1'))
          # 60 false positives -- benign traffic an analyst cleared.
          for i in range(60):
              curator.ingest(AlertDisposition(f'ben-{i}', 'prompt_injection', 'input',
                                              f'ref-ben-{i}', Disposition.FALSE_POSITIVE, 'ana-2'))
          # One contested detection: senior (0.9) says TP, junior (0.4) says FP -> TP but lower confidence.
          curator.ingest(AlertDisposition('contested', 'pii_scanner', 'output', 'ref-c',
                                          Disposition.TRUE_POSITIVE, 'senior', confidence=0.9))
          curator.ingest(AlertDisposition('contested', 'pii_scanner', 'output', 'ref-c',
                                          Disposition.FALSE_POSITIVE, 'junior', confidence=0.4))
          # One all-unknown detection: contributes no label.
          curator.ingest(AlertDisposition('murky', 'toxicity', 'output', 'ref-m',
                                          Disposition.UNKNOWN, 'ana-3'))
          # One low-agreement 50/50 split: dropped by the confidence gate.
          curator.ingest(AlertDisposition('split', 'jailbreak', 'input', 'ref-s',
                                          Disposition.TRUE_POSITIVE, 'a', confidence=0.5))
          curator.ingest(AlertDisposition('split', 'jailbreak', 'input', 'ref-s',
                                          Disposition.FALSE_POSITIVE, 'b', confidence=0.5))

          ds = curator.curate()
          print(f'labelled examples : {len(ds.examples)}')
          print(f'  attacks / benign: {ds.balance.attacks} / {ds.balance.benign}')
          print(f'  imbalance ratio : {ds.balance.imbalance_ratio:.1f} : 1')
          print(f'  attack fraction : {ds.balance.attack_fraction:.3f}')
          print(f'  dropped (low-conf): {ds.dropped_low_confidence}')
          print(f'  trainable       : {ds.trainable}  {ds.reasons}')

          tv = ds.training_view(cfg)
          tv_attacks = sum(1 for e in tv if e.is_attack)
          tv_benign = len(tv) - tv_attacks
          print(f'training view     : {len(tv)} examples '
                f'({tv_attacks} attacks / {tv_benign} benign, capped at {cfg.max_imbalance_for_training:.0f}:1)')

          # The contested label resolved to attack (senior outweighs junior) with reduced confidence.
          contested = [e for e in ds.examples if e.detection_id == 'contested']
          assert contested and contested[0].is_attack
          assert abs(contested[0].label_confidence - 0.9/1.3) < 1e-3
          # The 50/50 split was dropped by the confidence gate.
          assert not any(e.detection_id == 'split' for e in ds.examples)
          # The all-unknown detection contributed nothing.
          assert not any(e.detection_id == 'murky' for e in ds.examples)
          # Full set is benign-heavy; the training view respects the 10:1 cap.
          assert ds.balance.imbalance_ratio > 5
          assert tv_benign <= tv_attacks * cfg.max_imbalance_for_training
          assert ds.trainable
          print('\ndataset curation: conflict resolution, imbalance handling, quality gate: ok')
common_mistakes:
  mistake_1:
    description: |-
      Treating curation as collection -- passing the raw disposition stream straight to retraining
    why_it_happens: |-
      The dispositions are already labels, so it seems the work is done once they are gathered.
    consequence: |-
      Conflicting, weak, and wildly imbalanced labels reach the trainer unfiltered, and the retrained detector is degraded by the noise and imbalance the raw stream carries.
    correct_approach: |-
      Resolve conflicts, weight by confidence, rebalance for training, and gate on quality before any data reaches retraining -- curation is the discipline that makes the stream trainable.
  mistake_2:
    description: Discarding every detection that analysts dispositioned inconsistently
    why_it_happens: |-
      A conflict looks like bad data, and dropping it is the simplest way to get clean, unanimous labels.
    consequence: |-
      The contested cases -- often the hardest and most informative -- are thrown away, and the resulting dataset is biased toward the easy detections the detector already handles well.
    correct_approach: |-
      Resolve conflicts by confidence-weighted vote and carry the agreement forward as the label's confidence, keeping the hard cases with a weight that reflects their reliability.
  mistake_3:
    description: Training on the curated set in its true, benign-dominated proportion
    why_it_happens: |-
      The curated set is the honest record of live traffic, so it seems right to train on exactly what was seen.
    consequence: |-
      A model trained on data that is overwhelmingly one class learns to predict that class always -- the detector learns to call everything benign, zeroing both its false-positive and its true-positive rate.
    correct_approach: |-
      Train on a rebalanced view that keeps every attack and caps the benign class, while retaining the full imbalanced set for evaluation so measured precision stays honest.
  mistake_4:
    description: Always emitting a dataset, even when the labels are too few or too weak
    why_it_happens: |-
      The pipeline's job seems to be to produce data, so producing something feels better than producing nothing.
    consequence: |-
      Retraining runs on an insufficient or noisy set and degrades the detector, replacing a working model with one trained on almost nothing or on unreliable labels.
    correct_approach: |-
      Gate on label confidence, minimum examples, and minimum attacks, and refuse the dataset as untrainable when the checks fail, so the loop waits for more dispositions rather than poisoning the suite.
section_summary:
  compact: |-
    Section 17.04 opens the improvement half of the loop at the point where the feedback physically closes: the analyst. A detection fires, becomes a SIEM alert through the Chapter 16 integration, and reaches an analyst whose disposition -- true positive or false positive -- is a label on that detection, and the accumulation of dispositions is a labelled dataset describing how the detectors perform on current live traffic. This label supply is why the loop could only be assembled after the SIEM integration. But a disposition stream is not a training set, and curation is the discipline that makes it one by solving three problems. Analysts disagree, so conflicting dispositions of the same detection are resolved by confidence-weighted vote into a single label whose confidence reflects the strength of agreement -- conflict preserved as reliability information, not discarded. Attacks are rare, so the curated set is overwhelmingly false positives, and training on it raw teaches a detector to call everything benign; the pipeline separates the full set, which keeps the true imbalanced distribution for honest evaluation, from a rebalanced training view that keeps every precious attack example and caps the benign class so a trainer can learn a boundary. And some labels are too weak to use, so the pipeline ends in a quality gate that drops low-confidence labels and refuses -- as a correct, first-class outcome -- any dataset with too few trustworthy examples or too few real attacks, because retraining on bad data degrades the detector rather than improving it. Curation extends the Chapter 12 live curation with the new operational label source, and its gated output feeds the retraining of 17.05, which validates every candidate precisely because curation makes the labels trustworthy but not perfect.
  key_takeaways:
  - |-
    The feedback loop closes at the analyst: a disposition of a SIEM alert is a label on the detection that produced it
  - |-
    Conflicting dispositions are resolved by confidence-weighted vote, and the agreement becomes the label's own confidence
  - |-
    The curated set keeps the true imbalanced distribution for evaluation; a separate rebalanced view is used for training
  - |-
    Training on a benign-dominated set teaches a detector to call everything benign, so the majority class must be capped
  - |-
    A quality gate refuses datasets with too few trustworthy examples or too few attacks -- refusal is a correct outcome
  - |-
    Curation extends the Chapter 12 machinery with the Chapter 16 disposition feedback, making it a loop rather than a one-time build
preview_section_17_05:
  title: 'Model Retraining: When, How Often, and Validation'
  summary: |-
    Section 17.05 turns the curated dataset into a refreshed detector. It retrains on the curated data, triggered not by a fixed schedule but by the Chapter 13 drift signal and the accumulation of curated labels, so the detectors are refreshed when the data has actually moved. Every retrained candidate is validated against the quality bar and current traffic and promoted through the Chapter 12 model registry with a rollback path, and the stage guards against retraining on transient noise or an adversarially-poisoned dataset -- because a retrained detector can be worse than the one it replaces.
