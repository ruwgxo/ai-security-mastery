prose_content:
  part_1:
    title: Where the Feedback Loop Closes
    body: |-
      Every chapter of Part 4 has been building toward a loop that runs from operations back to detection, and this is the section where that loop physically closes. Trace the path. A detector in the Chapter 15 suite fires on a request. The Chapter 16 integration delivers that detection to the SIEM as an alert, enriched with context and a recommended response. An analyst opens the alert, investigates, and reaches a verdict on it: this was a real attack, or this was a false alarm. That verdict -- the analyst's disposition -- is not just the resolution of one alert. It is a label on the detection that produced it, ground truth about whether the detector was right, established by a human who examined the actual case. And when those dispositions accumulate, they are a labelled dataset describing exactly how the detectors are performing on the live traffic they currently face.

      That is the feedback signal the whole improvement loop runs on, and it is why the loop could only be assembled after the SIEM integration. Before Chapter 16, detections had nowhere to go and no one to label them; the detectors ran open-loop, improvable only by whatever offline data happened to be available. With detections flowing to analysts and analysts dispositioning them, the loop has a label supply that is live, real, and self-refreshing -- every alert an analyst resolves adds a labelled example describing the current threat and traffic. The analyst, in dispositioning alerts, is doing double duty: resolving the immediate incident and, at the same time, generating the training data that will improve the detector that raised it. This section builds the pipeline that captures that second output. But a disposition stream is not a training set as it stands, and the rest of the section is about the three things that have to happen before it becomes one.
  part_2:
    title: Resolving Conflicting Dispositions
    body: |-
      The first problem is that analysts disagree. The same alert, reviewed by two analysts, can be dispositioned two ways: a senior reviewer with full context calls it a true positive, while a junior triaging quickly calls it a false positive, or the reverse. Sometimes the disagreement reflects genuine ambiguity in the case; sometimes it reflects a difference in skill or attention. Either way, the curation pipeline receives conflicting labels for one detection and cannot simply keep both -- a training example needs one label. The naive resolutions are all bad: taking the last disposition is arbitrary, discarding any detection with a conflict throws away exactly the hard cases most worth learning from, and majority vote ignores that not all reviewers are equally reliable.

      The pipeline resolves conflicts by confidence-weighted vote. Each disposition carries a confidence -- a weight reflecting how much that analyst's call should count, which a deployment can set from seniority, from the reviewer's historical accuracy, or from how much time they spent on the case. The resolution sums the confidence behind each verdict and takes the heavier side, so a senior reviewer's high-confidence true-positive outweighs a junior's low-confidence false-positive. Crucially, the resolution does not just pick a winner; it carries the strength of agreement forward as the label's own confidence. A detection where all reviewers agreed produces a label with confidence near 1.0; a contested detection where the winning side barely outweighed the other produces a label with a confidence near 0.5, marking it as a weak label. That per-label confidence is what the quality gate later reads to decide which labels are trustworthy enough to keep. Conflict is not noise to be discarded -- it is information about label reliability, preserved rather than thrown away.
  part_3:
    title: The Class-Imbalance Problem
    body: |-
      The second problem is arithmetic and unavoidable: attacks are rare, so a curated set drawn from live traffic is overwhelmingly false positives. This follows directly from the base-rate problem of 17.02 -- if attacks are one in a thousand and the detector alerts on them plus a small fraction of benign traffic, the alerts the analyst dispositions are mostly benign, and the labels that result are mostly false positives. A curated set might be ten or twenty false positives for every true positive. That imbalance is real and must not be hidden, but it also cannot be fed to a trainer as-is, because a model trained on data that is 95% one class learns the cheapest possible rule: predict that class always. A detector retrained on a benign-dominated set learns to call everything benign -- it drives its own false-positive rate to zero by refusing to alert at all, which is catastrophic, because it also drives its true-positive rate to zero.

      The pipeline handles this by separating two things that are often conflated: the dataset that records the true distribution and the view used for training. The curated set keeps every label, in its real, imbalanced proportion, because that is the honest record of what the detectors saw and it is what evaluation must run against -- measuring a candidate on a rebalanced set would give a precision number that lies, exactly the base-rate lie of 17.02 in reverse. But the training view is rebalanced: it keeps every one of the rare attack examples, because those are precious and few, and caps the benign examples at a bounded ratio to the attacks, so the trainer sees a distribution it can actually learn a boundary from. The cap keeps the majority class from swamping the signal without discarding the minority, and it selects the benign examples to keep by label confidence, so the training view is built from the most trustworthy negatives. The full set remains for evaluation; the rebalanced view is only for training. Keeping those two separate is what lets curation handle imbalance without either lying about the distribution or teaching the detector to give up.
  part_4:
    title: 'The Quality Gate: Refusing a Dataset'
    body: |-
      The third problem is the one that most distinguishes curation from collection: sometimes the right output is no dataset at all. Retraining on a bad dataset is not a no-op that wastes some compute -- it actively degrades the detector, replacing a working model with one trained on noise, too few examples, or too few real attacks to learn anything useful. A curation pipeline that always emits a dataset, however thin or noisy, is a pipeline that will eventually poison the suite. So the pipeline ends in a gate that can refuse, and refusal is a first-class, correct outcome, not an error.

      The gate applies several checks. Labels below a minimum confidence -- the weak, contested labels from part two -- are dropped before anything else, because a label the reviewers barely agreed on is more likely to mislabel than to inform. Then the surviving set is checked for sufficiency: a dataset with too few trustworthy examples overall cannot support retraining, and -- more importantly given the imbalance -- a dataset with too few real attack examples cannot teach a detector what attacks look like, no matter how many benign examples it has. A set of two hundred benign labels and three attack labels is not a training set; it is a way to make a detector forget what attacks are. When the checks fail, the pipeline reports the dataset as untrainable, with the specific reasons, and the loop does not retrain this cycle -- it waits for more dispositions to accumulate and tries again next cycle. This is the curation analogue of the drift-routing discipline in Chapter 13: just as a drift signal on too little data should not trigger action, a curated set on too few trustworthy labels should not trigger retraining. The ability to say 'not yet, not enough' is what makes the whole improvement loop safe, because it is the last checkpoint before data becomes a model.
  part_5:
    title: Extending Chapter 12, and Feeding Retraining
    body: |-
      Curation did not begin in this chapter. Chapter 12 Section 12.14 built live dataset curation and the model registry for the detectors' original training -- the machinery for collecting, labelling, and versioning training data. What Section 17.04 adds is the feedback source that only exists once the suite is deployed and integrated: the analyst dispositions of live SIEM alerts. Chapter 12's curation drew on whatever labelled data was available at build time; this section extends it with a continuous, operational label stream that describes the current live distribution, captured through the Chapter 16 integration. The curation discipline is the same -- collect, label, quality-check, version -- but the label source is new, and it is what makes the curation a feedback loop rather than a one-time build.

      The curated, quality-gated dataset this section produces is the direct input to the retraining of Section 17.05, and the handoff between them is deliberately designed around the fact that curation cannot guarantee perfect labels. Even after conflict resolution, imbalance handling, and the quality gate, a curated set can carry residual label noise, and it could in principle be adversarially poisoned -- an attacker who understands the loop might try to shape analyst dispositions to corrupt the training data. Curation does what it can: it resolves conflicts, weights by confidence, refuses insufficient sets. But it hands off to a retraining stage that validates every candidate before deployment precisely because the label quality upstream is good, not perfect. The two stages are a defence in depth: curation makes the data as trustworthy as it can, and retraining refuses to trust it blindly, validating the result against the quality bar before anything reaches production. With the labelled data curated and gated, Section 17.05 turns it into a retrained candidate -- when, and only when, the drift signal and the label supply say it is time.
