prose_content:
  - heading: 'Internal Covariate Shift'
    id: internal_covariate_shift
    parts:
      - heading: 'Problem Statement'
        id: problem_statement
        blocks:
          - type: code
            lang: text
            text: |
              During training, network parameters constantly change
              → Distribution of inputs to each layer keeps shifting
              → Later layers must adapt to changing distributions
              → Slows down training, requires careful initialization
      - heading: Example
        id: example
        blocks:
          - type: prose
            text: >
              3-layer network during training:
          - type: code
            lang: text
            text: |
              Iteration 1:
              Layer 1 output: mean=0, std=1
              Layer 2 learns with this distribution

              Iteration 100:
              Layer 1 parameters changed
              Layer 1 output: mean=5, std=3  ← Distribution shifted!
              Layer 2 must adapt to new distribution

              Iteration 200:
              Layer 1 output: mean=-2, std=0.5  ← Shifted again!
              Layer 2 adapts again
          - type: prose
            text: >
              Layer 2 constantly chasing moving target
      - heading: Consequences
        id: consequences
        parts:
          - heading: 'Slow Training'
            id: slow_training
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Each layer adapts to changing inputs'
                  - 'Can''t learn efficiently'
          - heading: 'Careful Initialization Required'
            id: careful_initialization_required
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Bad initialization → exploding/vanishing gradients'
                  - 'Must use specific schemes (Xavier, He)'
          - heading: 'Low Learning Rates'
            id: low_learning_rates
            blocks:
              - type: list
                style: bullet
                items:
                  - 'High learning rate → unstable training'
                  - 'Forced to use small learning rate → slow'
          - heading: 'Gradient Problems'
            id: gradient_problems
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Activations can saturate (sigmoid, tanh)'
                  - 'Gradients vanish → deep layers don''t learn'
      - heading: 'Covariate Shift Analogy'
        id: covariate_shift_analogy
        blocks:
          - type: code
            lang: text
            text: |
              Imagine learning to catch a ball
              But the ball's weight, size, and bounce change randomly
              Much harder to learn!
          - type: prose
            text: >
              vs
          - type: prose
            text: >
              Ball properties consistent Can learn catching strategy efficiently
          - type: prose
            text: >
              BatchNorm: Makes each layer's inputs consistent
  - heading: 'Batch Norm Algorithm'
    id: batch_norm_algorithm
    parts:
      - heading: 'High Level Idea'
        id: high_level_idea
        blocks:
          - type: prose
            text: >
              For each mini-batch:
          - type: list
            style: ordered
            items:
              - 'Normalize activations: mean=0, variance=1'
              - 'Scale and shift: Allow network to undo normalization if needed'
          - type: prose
            text: >
              Ensures each layer receives inputs from stable distribution
      - heading: 'Algorithm During Training'
        id: algorithm_during_training
        blocks:
          - type: prose
            text: >
              Given: Mini-batch of activations B = {x₁, ..., xₘ} Parameters: γ (scale), β (shift) -
              learned during training
          - type: prose
            text: >
              Step 1: Compute batch mean μ_B = (1/m) Σᵢ xᵢ
          - type: prose
            text: >
              Step 2: Compute batch variance σ²_B = (1/m) Σᵢ (xᵢ - μ_B)²
          - type: code
            lang: text
            text: |
              Step 3: Normalize
              x̂ᵢ = (xᵢ - μ_B) / √(σ²_B + ε)
          - type: prose
            text: >
              Step 4: Scale and shift yᵢ = γx̂ᵢ + β
          - type: prose
            text: >
              Where ε = 1e-5 (small constant for numerical stability)
      - heading: 'Learnable Parameters'
        id: learnable_parameters
        blocks:
          - type: prose
            text: >
              γ (gamma): Scale parameter β (beta): Shift parameter
          - type: prose
            text: >
              These are learned via backpropagation
          - type: prose
            text: >
              Why needed:
          - type: list
            style: bullet
            items:
              - 'Network might need different mean/variance for optimal performance'
              - 'If optimal is original distribution: γ=σ_B, β=μ_B recovers it'
              - 'Gives network flexibility'
      - heading: 'Example Calculation'
        id: example_calculation
        blocks:
          - type: prose
            text: >
              Mini-batch: B = [1, 2, 3, 4, 5]
          - type: code
            lang: text
            text: |
              Step 1: Mean
              μ_B = (1+2+3+4+5)/5 = 3

              Step 2: Variance
              σ²_B = ((1-3)² + (2-3)² + (3-3)² + (4-3)² + (5-3)²)/5
                   = (4 + 1 + 0 + 1 + 4)/5 = 2

              Step 3: Normalize
              x̂ = (B - 3) / √(2 + 1e-5)
                 = [-2, -1, 0, 1, 2] / 1.414
                 = [-1.41, -0.71, 0, 0.71, 1.41]

              Step 4: Scale and shift (γ=2, β=1)
              y = 2 × x̂ + 1
                = [-1.82, -0.42, 1, 2.42, 3.82]
      - heading: 'Where to Apply'
        id: where_to_apply
        blocks:
          - type: prose
            text: >
              Apply BatchNorm to layer activations
          - type: code
            lang: text
            text: |
              Typical placement:
              Linear/Conv → BatchNorm → Activation (ReLU)

              Or:
              Linear/Conv → Activation (ReLU) → BatchNorm
          - type: prose
            text: >
              Most common: Before activation
  - heading: 'Training vs Inference'
    id: training_vs_inference
    parts:
      - heading: 'Training Mode'
        id: training_mode
        blocks:
          - type: prose
            text: >
              Use batch statistics:
          - type: list
            style: bullet
            items:
              - 'Compute μ_B and σ²_B from current mini-batch'
              - 'Normalize using these batch statistics'
              - 'Update running averages (for inference)'
      - heading: 'Running Statistics'
        id: running_statistics
        blocks:
          - type: prose
            text: >
              During training, maintain running averages:
          - type: prose
            text: >
              running_mean = momentum × running_mean + (1-momentum) × μ_B running_var = momentum ×
              running_var + (1-momentum) × σ²_B
          - type: prose
            text: >
              Typical momentum: 0.9 or 0.99
          - type: prose
            text: >
              These accumulate statistics over all training batches
      - heading: 'Inference Mode'
        id: inference_mode
        blocks:
          - type: prose
            text: >
              Problem at inference:
          - type: list
            style: bullet
            items:
              - 'May have single sample (batch size = 1)'
              - 'Batch statistics meaningless for single sample'
          - type: prose
            text: >
              Solution: Use running statistics from training
          - type: code
            lang: text
            text: |
              Normalize using:
              x̂ = (x - running_mean) / √(running_var + ε)
              y = γx̂ + β
          - type: prose
            text: >
              Fixed statistics (no batch dependency)
      - heading: 'Why Different Modes'
        id: why_different_modes
        blocks:
          - type: prose
            text: >
              Training:
          - type: list
            style: bullet
            items:
              - 'Have mini-batches → use batch statistics'
              - 'Provides regularization (noise from batch sampling)'
          - type: prose
            text: >
              Inference:
          - type: list
            style: bullet
            items:
              - 'May have single samples'
              - 'Need deterministic predictions'
              - 'Use population statistics (running averages)'
      - heading: 'Mode Switching'
        id: mode_switching
        blocks:
          - type: prose
            text: >
              Most frameworks (PyTorch, TensorFlow):
          - type: prose
            text: >
              model.train() # Training mode: use batch stats model.eval() # Inference mode: use
              running stats
          - type: prose
            text: >
              Critical to set correctly!
  - heading: Benefits
    id: benefits
    parts:
      - heading: 'Faster Training'
        id: faster_training
        parts:
          - heading: Observation
            id: observation
            blocks:
              - type: prose
