                text: >
                  Without BatchNorm: 100 epochs to converge With BatchNorm: 7 epochs to converge
      - heading: 'Higher Learning Rates'
        id: higher_learning_rates
        parts:
          - heading: Enabled
            id: enabled
            blocks:
              - type: prose
                text: >
                  Can use learning rates 10x higher
          - heading: Why
            id: why
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Normalization prevents exploding activations'
                  - 'Gradient flow more stable'
                  - 'Less sensitive to initialization'
          - heading: Typical
            id: typical
            blocks:
              - type: prose
                text: >
                  Without BatchNorm: lr = 0.01 With BatchNorm: lr = 0.1 (works fine!)
      - heading: 'Regularization Effect'
        id: regularization_effect
        parts:
          - heading: Behavior
            id: behavior
            blocks:
              - type: prose
                text: >
                  Acts as regularizer, reduces overfitting
          - heading: Mechanism
            id: mechanism
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Each sample normalized using batch statistics'
                  - 'Batch statistics have noise (different batches)'
                  - 'Adds stochasticity → regularization'
                  - 'Similar effect to dropout'
          - heading: Consequence
            id: consequence
            blocks:
              - type: prose
                text: >
                  May not need dropout with BatchNorm
        blocks:
          - type: fields
            subject: 'Reduces Gradient Issues'
            id: reduces_gradient_issues
            entries:
              - label: 'Vanishing Gradients'
                value: 'Less likely (normalized activations)'
              - label: 'Exploding Gradients'
                value: 'Prevented by normalization'
              - label: 'Enables Deeper Networks'
                value: 'Can train 100+ layer networks'
          - type: fields
            subject: 'Less Sensitive to Initialization'
            id: less_sensitive_to_initialization
            entries:
              - label: 'Without Batchnorm'
                value: 'Careful initialization required (Xavier, He)'
              - label: 'With Batchnorm'
                value: 'Works with random initialization'
              - label: Reason
                value: 'Normalization corrects poor initialization'
  - heading: 'Practical Implementation'
    id: practical_implementation
    blocks:
      - type: code
        lang: python
        text: |
          import numpy as np

          class BatchNorm1D:
              """Batch Normalization for 1D data (fully connected layers)"""
              
              def __init__(self, num_features, momentum=0.9, epsilon=1e-5):
                  """
                  Args:
                      num_features: Number of features (neurons in layer)
                      momentum: Momentum for running statistics
                      epsilon: Small constant for numerical stability
                  """
                  self.num_features = num_features
                  self.momentum = momentum
                  self.epsilon = epsilon
                  
                  # Learnable parameters
                  self.gamma = np.ones(num_features)   # Scale
                  self.beta = np.zeros(num_features)   # Shift
                  
                  # Running statistics (for inference)
                  self.running_mean = np.zeros(num_features)
                  self.running_var = np.ones(num_features)
                  
                  # Training mode flag
                  self.training = True
              
              def forward(self, x):
                  """
                  Forward pass
                  
                  Args:
                      x: Input (batch_size, num_features)
                  
                  Returns:
                      Normalized and scaled output
                  """
                  if self.training:
                      # Training mode: use batch statistics
                      batch_mean = np.mean(x, axis=0)
                      batch_var = np.var(x, axis=0)
                      
                      # Normalize
                      x_normalized = (x - batch_mean) / np.sqrt(batch_var + self.epsilon)
                      
                      # Update running statistics
                      self.running_mean = (self.momentum * self.running_mean + 
                                          (1 - self.momentum) * batch_mean)
                      self.running_var = (self.momentum * self.running_var + 
                                         (1 - self.momentum) * batch_var)
                      
                      # Cache for backward pass
                      self.cache = (x, x_normalized, batch_mean, batch_var)
                  else:
                      # Inference mode: use running statistics
                      x_normalized = ((x - self.running_mean) / 
                                     np.sqrt(self.running_var + self.epsilon))
                  
                  # Scale and shift
                  out = self.gamma * x_normalized + self.beta
                  
                  return out
              
              def backward(self, dout):
                  """
                  Backward pass
                  
                  Args:
                      dout: Gradient from next layer
                  
                  Returns:
                      Gradient w.r.t. input
                  """
                  x, x_normalized, batch_mean, batch_var = self.cache
                  batch_size = x.shape[0]
                  
                  # Gradients w.r.t. learnable parameters
                  self.dgamma = np.sum(dout * x_normalized, axis=0)
                  self.dbeta = np.sum(dout, axis=0)
                  
                  # Gradient w.r.t. normalized input
                  dx_normalized = dout * self.gamma
                  
                  # Gradient w.r.t. variance
                  dvar = np.sum(dx_normalized * (x - batch_mean) * 
                               -0.5 * (batch_var + self.epsilon)**(-1.5), axis=0)
                  
                  # Gradient w.r.t. mean
                  dmean = (np.sum(dx_normalized * -1 / np.sqrt(batch_var + self.epsilon), axis=0) +
                          dvar * np.sum(-2 * (x - batch_mean), axis=0) / batch_size)
                  
                  # Gradient w.r.t. input
                  dx = (dx_normalized / np.sqrt(batch_var + self.epsilon) +
                       dvar * 2 * (x - batch_mean) / batch_size +
                       dmean / batch_size)
                  
                  return dx
              
              def train(self):
                  """Set to training mode"""
                  self.training = True
              
              def eval(self):
                  """Set to inference mode"""
                  self.training = False

          # ========================================================================
          # USAGE EXAMPLE
          # ========================================================================

          # Create BatchNorm layer
          bn = BatchNorm1D(num_features=10)

          # Training
          bn.train()
          for epoch in range(10):
              # Sample mini-batch
              x_batch = np.random.randn(32, 10)
              
              # Forward pass
              output = bn.forward(x_batch)
              
              # Backward pass (in actual training)
              # dx = bn.backward(dout)

          # Inference
          bn.eval()
          x_test = np.random.randn(1, 10)  # Single sample
          output_test = bn.forward(x_test)  # Uses running statistics
