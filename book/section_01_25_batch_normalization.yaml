      - heading: 'Convolutional Networks'
        id: convolutional_networks
        blocks:
          - type: prose
            text: >
              Conv → BatchNorm → ReLU
          - type: prose
            text: >
              BatchNorm operates on channels:
          - type: list
            style: bullet
            items:
              - 'Compute mean/var per channel'
              - 'Across batch and spatial dimensions'
          - type: code
            lang: text
            text: |
              Example: Conv output (batch=32, channels=64, height=28, width=28)
              → BatchNorm computes 64 means and 64 variances
  - heading: Variants
    id: variants
    parts:
      - heading: 'Layer Normalization'
        id: layer_normalization
        parts:
          - heading: Difference
            id: difference
            blocks:
              - type: prose
                text: >
                  Normalize across features (not batch)
          - heading: 'When to Use'
            id: when_to_use
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Recurrent networks (RNNs, LSTMs)'
                  - Transformers
                  - 'When batch size varies or is 1'
          - heading: Formula
            id: formula
            blocks:
              - type: prose
                text: >
                  Normalize each sample independently μ = mean across features for sample i σ² =
                  variance across features for sample i
        blocks:
          - type: fields
            subject: 'Instance Normalization'
            id: instance_normalization
            entries:
              - label: Difference
                value: 'Normalize each sample and channel independently'
              - label: 'When to Use'
                value: 'Style transfer, GANs'
          - type: fields
            subject: 'Group Normalization'
            id: group_normalization
            entries:
              - label: Difference
                value: 'Divide channels into groups, normalize within groups'
              - label: 'When to Use'
                value: 'Small batch sizes (batch norm unstable)'
      - heading: Comparison
        id: comparison
        blocks:
          - type: prose
            text: >
              BatchNorm: Normalize across batch dimension LayerNorm: Normalize across feature
              dimension InstanceNorm: Normalize across spatial dimensions GroupNorm: Normalize
              across channel groups
