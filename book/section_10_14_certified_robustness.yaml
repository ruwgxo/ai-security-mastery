lead: >
  Randomised smoothing turns any classifier into one with a per-input, provable L2 robustness radius
  -- the only Chapter 10 defence whose claim cannot be broken by a stronger attack, paid for in
  clean accuracy, inference cost, and the right to abstain.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          Every defence in Sections 10.11 to 10.13 is empirical. Feature squeezing, consistency
          checking and the adversarial classifier are measured against the attacks we know, and
          Section 10.13 already showed an adaptive adversary pushing through them. PGD robustness
          has the same weakness: a model that resists PGD-40 today may fall to a better attack
          tomorrow, and the adversarial ML literature is full of defences that did exactly that.
      - type: prose
        text: >
          Some deployments cannot accept "robust against the attacks we tried". A safety case for a
          medical triage model, a contractual robustness commitment, or a regulator asking what the
          worst case is all need a statement of the form "no perturbation smaller than r can change
          this output". Section 10.14 builds the one practical tool that produces that statement for
          large neural networks: randomised smoothing.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 10.14 opens the upstream half of the Chapter 10 defence stack. Track 7 (Section
          10.13) is the runtime detection layer; Sections 10.14 and 10.15 change the model itself.
          This section gives the formal guarantee and quantifies its price; Section 10.15 gives the
          stronger empirical defence. Section 10.16 assembles both with Track 7 into the evasion
          defence architecture.
learning_objectives:
  groups:
    knowledge:
      - 'Define a robustness certificate and distinguish certified robustness from empirical robustness'
      - 'State the smoothed classifier g(x) = argmax_c P(f(x + e) = c) with e ~ N(0, sigma^2 I)'
      - 'State the Cohen et al. 2019 certified radius R = sigma * Phi^-1(p_A_lower) and explain each term'
      - 'Explain why the certificate is probabilistic (confidence 1 - alpha) and why CERTIFY must use fresh samples for estimation'
      - 'Explain how sigma and the sample count n cap the largest radius that can ever be certified'
      - 'Explain why Gaussian smoothing certifies L2 but gives weak L-infinity guarantees in high dimension'
      - 'Name the discrete-input analogues for text (SAFER, interval bound propagation) and their threat model'
    skills:
      - 'Implement SmoothedClassifier.predict and SmoothedClassifier.certify with a Clopper-Pearson lower bound'
      - 'Compute certified radius, maximum certifiable radius, and required sample count for a deployment'
      - 'Produce a certified accuracy curve across sigma values and read the accuracy-robustness trade-off from it'
      - 'Compare certified accuracy against PGD empirical accuracy at matched epsilon and interpret the gap'
      - 'Decide between certified, offline-audit, and empirical-only deployment for a given threat model and latency budget'
    security_mindset:
      - 'Treat a certificate as a statement about one input under one norm at one radius -- not about the model'
      - 'Prefer a lower bound you can prove to an upper bound an attacker may beat, when the deployment needs a worst case'
      - 'Accept abstention as a security feature: a smoothed classifier that says "unsure" is refusing to be guessed through'
      - 'Recognise that certification moves the argument from "which attacks did you try" to "which threat model did you certify"'
prerequisites:
