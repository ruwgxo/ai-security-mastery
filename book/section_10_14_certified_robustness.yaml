prose_content:
  - heading: 'Empirical vs Certified Robustness: Upper Bounds and Lower Bounds'
    id: part_1
    blocks:
      - type: prose
        text: >
          Every robustness number in Sections 10.3 to 10.13 was produced the same way: run an
          attack, count how many inputs it fails to flip. That number is an upper bound on the
          model's true robust accuracy. A stronger attack can only lower it. When Section 10.4
          reports "45% PGD robust accuracy", the honest reading is "at most 45%, and possibly much
          less".
      - type: prose
        text: >
          A certificate is the opposite kind of statement. For a specific input x, a certifier
          returns a class c and a radius r and guarantees that every input within distance r of x is
          classified as c. No attack, known or future, can produce a counterexample inside that
          ball. Certified accuracy at radius r -- the fraction of test inputs that are classified
          correctly and certified at radius at least r -- is therefore a lower bound on true robust
          accuracy at r. True robustness lies between the certified floor and the empirical ceiling.
      - type: prose
        text: >
          Exact certification is possible for small networks. Complete verifiers built on SMT
          (Reluplex, Katz et al. 2017) or mixed-integer programming answer the question exactly, but
          the problem is NP-hard for ReLU networks and the cost grows exponentially with network
          size. Bound-propagation methods such as interval bound propagation (Gowal et al. 2018) and
          CROWN (Zhang et al. 2018) trade exactness for speed and work best when the network is
          trained for them. Randomised smoothing takes a different route: rather than analysing the
          network, it changes the classifier into one whose robustness can be proved from sampling
          alone. That makes it architecture-agnostic, which is why it was the first certified
          defence to scale to ImageNet.
  - heading: 'Randomised Smoothing: Cohen, Rosenfeld and Kolter 2019'
    id: part_2
    blocks:
      - type: prose
        text: >
          Start from any base classifier f. Define the smoothed classifier g as the class f is most
          likely to return when the input is corrupted with isotropic Gaussian noise:
      - type: code
        lang: text
        text: |
          g(x) = argmax_c P(f(x + e) = c),   e ~ N(0, sigma^2 I)
      - type: prose
        text: >
          g is never computed exactly. It is estimated by drawing many noisy copies of x, running f
          on each, and counting votes. The noise level sigma is a hyperparameter chosen per
          deployment.
      - type: prose
        text: >
          Lecuyer et al. 2019 (PixelDP) and Li et al. 2019 had shown that noise-based smoothing
          yields certificates, using differential privacy and Renyi divergence arguments. Cohen,
          Rosenfeld and Kolter 2019 proved the tight L2 result. If the top class c_A has probability
          at least p_A under noise, and every other class has probability at most p_B, then g(x +
          delta) = c_A for every perturbation with
      - type: code
        lang: text
        text: |
          ||delta||_2 < R = (sigma / 2) * (Phi^-1(p_A) - Phi^-1(p_B))
      - type: prose
        text: >
          where Phi^-1 is the inverse standard normal CDF. In practice p_B is bounded by 1 - p_A,
          which simplifies the radius to R = sigma * Phi^-1(p_A). The bound is tight: for a linear
          base classifier no larger radius is possible.
      - type: prose
        text: >
          The intuition is geometric. Shifting x by delta shifts the centre of the Gaussian cloud by
          delta. Votes for c_A can only fall so fast as the cloud moves, because the worst-case base
          classifier (by the Neyman-Pearson lemma, a half-space) loses probability mass at a rate
          set by sigma. When p_A is close to 1, the cloud must move a long way before c_A loses the
          majority. When p_A is barely above one half, a small shift is enough, and the radius
          shrinks to zero.
      - type: prose
        text: >
          Applied to the paper's ImageNet experiments, a smoothed ResNet-50 achieved 49% certified
          top-1 accuracy against L2 perturbations of norm up to 0.5 (127/255) -- a guarantee no
          empirical defence could offer at that scale.
  - heading: 'From Sampling to a Certificate: PREDICT, CERTIFY and the Confidence Bound'
    id: part_3
    blocks:
      - type: prose
        text: >
          p_A is unknown and must be estimated from samples. The certificate is only as good as that
          estimate, so the procedure has to be conservative in exactly the right places. Cohen et
          al. give two algorithms.
      - type: prose
        text: >
          CERTIFY draws n0 noisy samples (n0 = 100 is typical) and takes the most frequent class as
          the candidate c_A. It then draws n FRESH samples and counts how many vote for c_A. From
          that count it computes a one-sided Clopper-Pearson lower confidence bound p_A_lower at
          level 1 - alpha. If p_A_lower is above one half it returns c_A with radius sigma *
          Phi^-1(p_A_lower); otherwise it abstains. The two sample sets must be independent.
          Choosing c_A and estimating its probability on the same samples selects the class that
          happened to get lucky, biases the estimate upward, and voids the confidence statement.
      - type: prose
        text: >
          PREDICT draws n samples, takes the top two classes, and runs a two-sided binomial test of
          whether the top class beats the runner-up. If the test cannot separate them at level alpha
          it abstains; otherwise it returns the top class. PREDICT claims no radius. It is the
          production inference path: the probability that it returns a class other than g(x) is at
          most alpha.
      - type: prose
        text: >
          The guarantee is therefore probabilistic in a precise sense. With probability at least 1 -
          alpha over the sampling randomness, the returned certificate is correct. alpha = 0.001 is
          the common choice. This is not a weakness of the method -- it is the same kind of
          statement a hypothesis test makes -- but it must be stated in any safety case that relies
          on it.
  - heading: 'The Accuracy-Robustness Trade-off: Sigma, Sample Count and Abstention'
    id: part_4
    blocks:
      - type: prose
        text: >
          Two knobs set what smoothing can certify, and both cost something.
      - type: prose
        text: >
          Sigma controls the noise level. Large sigma allows large radii, because the radius scales
          with sigma, but the base classifier now has to classify heavily corrupted inputs, so p_A
          falls and clean accuracy drops. Small sigma preserves accuracy but caps the radius. The
          accuracy_robustness_tradeoff_analyser.py deliverable makes this concrete: each sigma wins
          a different column of the certified accuracy table, and no single sigma dominates. The
          base classifier must be trained with Gaussian noise augmentation at the deployment sigma;
          a base model trained on clean data is near-random under heavy noise, and the smoothed
          classifier inherits that. Salman et al. 2019 showed that adversarially training the base
          classifier against the smoothed classifier (SmoothAdv) raises certified accuracy further.
      - type: prose
        text: >
          The sample count n caps the radius regardless of how good the model is. Even if every one
          of the n samples votes for c_A, the Clopper-Pearson lower bound is only alpha^(1/n), so
          the largest certifiable radius is sigma * Phi^-1(alpha^(1/n)). At alpha = 0.001 and sigma
          = 0.5, n = 100 caps the radius at 0.75 and n = 100,000 at about 1.9. Each additional unit
          of radius costs exponentially more samples, and every sample is a forward pass at
          inference time. certificate_radius_calculator.py computes these limits before any model is
          trained.
      - type: prose
        text: >
          Abstention is the third cost. Inputs near the decision boundary get no certificate and,
          under PREDICT, no answer. A system that cannot route abstentions to a fallback model or a
          human reviewer cannot use smoothing. In a security context abstention is often the correct
          outcome: an input that sits on the boundary is precisely the input an adversary is trying
          to produce.
  - heading: 'Certified vs Empirical: Reading the Gap'
    id: part_5
    blocks:
      - type: prose
        text: >
          smoothing_vs_pgd_comparison.py evaluates both bounds on the same test set at matched L2
          epsilon. It reports the base model's accuracy under L2-PGD (an empirical ceiling), the
          smoothed classifier's certified accuracy at radius epsilon (a provable floor), and the
          smoothed classifier's accuracy on the PGD inputs. It also counts certificate violations:
          certified inputs whose smoothed prediction changed under attack. That count should be
          zero. If it is not, the certifier is wrong -- most often because selection and estimation
          samples were shared, or because the base model was put back into training mode between
          calls.
      - type: prose
        text: >
          On the synthetic task the floor and ceiling are close. On real image data they are not.
          Certified accuracy at a given radius is typically well below what the best empirical
          defences report at the same radius, and the gap widens as the radius grows. The gap is the
          price of the guarantee: some of the robustness empirical defences report is real but
          unprovable, and some of it is an artefact of attacks that are not yet strong enough.
          Certification refuses to count either.
  - heading: 'Beyond L2: L-infinity, L1, Patches and Text'
    id: part_6
    blocks:
      - type: prose
        text: >
          Gaussian smoothing certifies L2 balls. The rest of the Chapter 10 threat model is not L2.
      - type: prose
        text: >
          An L2 certificate of radius r implies an L-infinity certificate of r / sqrt(d), because
          the L-infinity ball of radius r / sqrt(d) fits inside the L2 ball of radius r. For a
          CIFAR-10 image (d = 3072) an L2 radius of 0.5 becomes an L-infinity radius of about
          2.3/255 -- far below the 8/255 used throughout Sections 10.3 to 10.13. This is not a
          weakness of the implementation: Blum et al. 2020 and Kumar et al. 2020 showed that
          randomised smoothing in general cannot give strong L-infinity certificates in high
          dimension. Other noise distributions certify other norms (Laplace and uniform noise for
          L1; Yang et al. 2020 map the options), but there is no dominant L-infinity method.
      - type: prose
        text: >
          Physical patches (Section 10.8) are an L0-style threat: a large change confined to a small
          region. Levine and Feizi 2020 adapted smoothing to this setting by classifying many small
          ablated views of the image and voting, which certifies against any patch below a given
          size.
      - type: prose
        text: >
          Text inputs are discrete, so there is no Gaussian to add. SAFER (Ye, Gong and Liu 2020)
          smooths by randomly substituting words from each word's synonym set and certifies against
          any attacker restricted to those synonyms. Interval bound propagation has been used to
          train text classifiers verified against all combinations of synonym substitutions (Jia et
          al. 2019; Huang et al. 2019). Both certify a narrow, explicit threat model. A
          TextFooler-style attack that strays outside the synonym sets (Section 10.9), or any
          semantic rewrite, is outside the certificate. For LLM-based safety filters this matters:
          the certified threat model is much smaller than the real one.
  - heading: 'Positioning in the Defence Stack and the Deployment Decision'
    id: part_7
    blocks:
      - type: prose
        text: >
          Certification is to evasion what differential privacy was to poisoning and extraction in
          Chapter 8: a formal guarantee bought with utility, worth paying for when the deployment
          needs a worst case rather than an average case. It does not replace Track 7. Inputs that
          fail to certify, attacks outside the certified norm, and the inference budget all leave
          work for runtime detection. The two layers answer different questions: the certificate
          says "this output cannot be moved by small L2 noise"; Track 7 says "this input looks like
          someone is trying".
      - type: prose
        text: >
          certified_deployment_checklist.py encodes the decision. Certification is required when the
          threat model is L2 (or one of the narrow discrete threat models with a certified method),
          an external party needs a provable bound, the accuracy budget can absorb the cost, and the
          system can handle abstention. When those hold but n samples do not fit the latency budget,
          the practical pattern is offline audit: serve the base model online, certify a sample of
          production traffic offline, and put the certified accuracy into the safety case.
          Everywhere else, adversarial training (Section 10.15) plus Track 7 is the better use of
          effort.
