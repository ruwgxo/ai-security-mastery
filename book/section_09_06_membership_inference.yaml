lead: >
  Membership inference exploits the same overfitting that hurts generalisation: a model optimised on
  training data assigns higher confidence and lower loss to members than to non-members, leaking
  individual data inclusion through the inference API and constituting a regulated privacy violation
  wherever training data is personally identifiable.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          Sections 9.3 through 9.5 covered attacks that steal what the model knows or how it is
          configured. Section 9.6 opens the privacy attack arc: attacks that exploit the inference
          API to extract information about the training data itself, rather than the model's learned
          behaviour. Membership inference is the entry point: it answers the question "was this
          specific record in the training set?" without reconstructing the record's content.
      - type: prose
        text: >
          The Chapter 1 preview of overfitting as a property that reduces generalisation accuracy
          gains a second meaning here: the same memorisation that causes a model to overfit its
          training data is the signal that membership inference exploits. A model that memorises
          training examples assigns them higher confidence and lower loss than it assigns to unseen
          inputs drawn from the same distribution. This gap is measurable through the inference API
          without access to model weights.
      - type: prose
        text: >
          The privacy consequence is direct. If the training data contains personally identifiable
          information -- medical records, financial data, user-generated content -- membership
          inference determines whether a specific individual's data was used to train the model.
          This is a HIPAA violation if the model was trained on protected health information without
          proper authorisation. It is a GDPR right-to-erasure violation if the model was trained on
          EU personal data and the individual has exercised their erasure right. The inference API
          becomes a privacy audit tool in the adversary's hands.
      - type: prose
        text: >
          Section 9.6 builds the attack in two variants (confidence-based and loss-based),
          implements the shadow model attack (Shokri et al. 2017), and introduces the simpler
          threshold attack that does not require shadow model training. The defence connection to
          differential privacy training (Section 8.13) is made explicit: DP training is the upstream
          defence that bounds per-example information leakage; output perturbation (Section 9.12) is
          the downstream control that reduces signal visibility at the API level.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 9.6 of 13. First privacy attack section. Opens the two-section privacy arc (9.6
          membership inference, 9.7 model inversion) that shares the inference-time attack surface
          with the four extraction goals. Establishes the overfitting-as-privacy-leakage mechanism
          that Section 9.7 extends to full training data reconstruction. The differential privacy
          training connection made here recurs in Section 9.7.
