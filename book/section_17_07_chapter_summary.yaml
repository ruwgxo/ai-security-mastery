      - type: prose
        text: >
          Chapter 17 built the continuous improvement loop one stage at a time. This section is
          where the stages become a single mental model. Read in isolation, each section solved a
          local problem -- how to measure precision, how to curate labels, how to A/B-test safely;
          read together, they are one running system with one governing rule, and seeing that whole
          is what lets an engineer operate the loop rather than recall six separate builds. The
          synthesis states the loop as a single architecture, provides the reference and checklist
          to run it, and consolidates the mistakes into the principles they each protect.
