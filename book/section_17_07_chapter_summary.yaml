prose_content:
  - heading: 'The Whole Loop as One System'
    id: part_1
    blocks:
      - type: prose
        text: >
          Step back from the six builds and one system appears. The detector suite runs on live
          traffic, and its detections -- delivered to the SIEM by Chapter 16 -- are measured
          continuously: the detection metrics of 17.02 say how well it detects, the performance
          metrics of 17.03 say how well it runs. Analysts disposition the SIEM alerts, and those
          dispositions flow back as labels that the curator of 17.04 turns into a quality-gated
          dataset. When the Chapter 13 drift signal or accumulated labels warrant it, the retrainer
          of 17.05 fits a candidate on that data, validates it against the quality bar and the
          incumbent, and registers it in the registry as a candidate -- not yet production, because
          the A/B test of 17.06 must first prove it better on live traffic; only a winner is
          promoted, and rollback remains if it later regresses. And then the loop measures the new
          suite and begins again. The whole thing is a cycle with no end state: the suite is never
          finished, it is continuously maintained.
      - type: prose
        text: >
          The shape of the system is its lesson. Every stage produces exactly what the next consumes
          -- measurement finds the weakness, curation turns operation into data, retraining turns
          data into a candidate, validation and A/B testing turn a candidate into a trusted
          promotion -- and the loop closes because promotion feeds back into measurement. Two things
          make it more than a pipeline. It is a feedback loop, so the suite improves over time
          rather than being fixed once. And it is a gated pipeline, so a change cannot reach
          production except by passing every safety check in sequence. Chapter 17 is not a
          collection of tuning techniques; it is the assembly of those techniques into a single
          system that improves the suite while making it structurally hard to make the suite worse.
  - heading: 'The Governing Rule and the Safety Gates'
    id: part_2
    blocks:
      - type: prose
        text: >
          One rule runs through every stage: a change reaches production only after it has been
          measured against a baseline, validated against the quality bar and the incumbent, and
          proven significantly better on live traffic -- and even then it stays reversible. No
          single stage enforces that rule; the loop does, by placing a gate at every step and giving
          a change no path to production that bypasses them. The gates compose into defence in
          depth, each catching what the previous cannot. Curation's quality gate refuses data that
          is too thin, too imbalanced, or too weakly labelled to train on, so a bad dataset never
          becomes a candidate. Validation refuses a candidate that fails the quality bar or
          regresses against the incumbent on the held-out set, so a knowably-worse candidate never
          reaches a live test. The A/B test refuses a candidate that is not significantly better on
          live traffic, and early-stops one that regresses, so a candidate that looked fine offline
          but fails on real traffic never takes over. And the registry's rollback undoes a promotion
          that regresses in production despite passing every gate, so even a mistake that slips
          through is reversible.
      - type: prose
        text: >
          The cumulative effect is that the safe path is the only path. A change can fail at any
          gate and be stopped there: no trigger, no candidate; bad data, no training; failed
          validation, no live test; lost A/B test, no promotion; a promotion that later regresses, a
          rollback. There is no way to promote a detector that has not been measured, validated, and
          proven, because the loop provides no such route. This is what makes it safe to run the
          loop automatically and often -- the aggressiveness of continuous retraining and testing is
          bounded by gates that make each individual change low-risk. A loop that could improve the
          suite but could also silently degrade it would be too dangerous to automate; a loop where
          degradation is caught at a gate every time is not.
  - heading: 'Measurement as the Foundation'
    id: part_3
    blocks:
      - type: prose
        text: >
          If the chapter has one load-bearing idea beneath the loop, it is that measurement comes
          first and everything rests on it. Tuning without measurement is guessing: a change made in
          response to an anecdote, with no baseline to say whether it improved or regressed the
          aggregate, is as likely to harm as to help. Every later stage of the loop depends on the
          metrics defined in 17.02 and 17.03. Curation collects labels to improve those metrics.
          Retraining is triggered by a measured drift signal and judged by whether the candidate's
          measured metrics clear the bar. A/B testing is entirely an exercise in measurement --
          comparing two arms' metrics with enough rigour to tell signal from noise. Take the
          measurement away and the rest of the loop has nothing to optimise toward and no way to
          know if it is working.
      - type: prose
        text: >
          The base-rate problem is the sharpest expression of why measurement must be done carefully
          and not just done. A detector's quality cannot be read off its true-positive rate alone,
          because for rare attacks precision is governed by the false-positive rate, and a
          measurement that ignores the base rate reports a precision that production will not
          deliver. The chapter's insistence on measuring on the true distribution -- in validation,
          in A/B testing, in the metrics themselves -- is the same discipline applied everywhere:
          measure the thing that predicts production, not the thing that is convenient. The
          optimisation targets the loop drives toward -- false positives down, true-positive rate
          toward 95%+, latency under 50ms -- are only meaningful because they are measured honestly.
          Measurement is not one stage among six; it is the foundation the other five stand on,
          which is why the chapter built it first and returns to it every cycle.
  - heading: 'What the Chapter Established'
    id: part_4
    blocks:
      - type: prose
        text: >
          Four commitments carried through every section. First, a deployed suite is not finished:
          it decays as the world drifts, and continuous monitoring and tuning is the maintenance
          that reverses the decay -- the chapter's founding claim. Second, measurement before
          action: the two metric families are the objective, tuning optimises them, and nothing in
          the loop is trustworthy without honest measurement on the true distribution. Third, the
          feedback loop closes at the analyst: the disposition of a SIEM alert is a label, and that
          label supply -- available only after the Chapter 16 integration -- is what turns a
          one-time build into a self-improving system. Fourth, improvement must be safe: a candidate
          can be worse, so every change passes gates -- curation quality, validation, A/B test --
          and stays reversible through rollback, making the safe path the only path.
      - type: prose
        text: >
          Those commitments are why the chapter is a system and not a toolbox. Each stage was simple
          because the previous stage handed it exactly what it needed and the next stage checked its
          work. The loop composed because the stages were built to compose. And the whole is safe
          because the gates are cumulative, not because any one of them is perfect. The knowledge
          assessment that follows checks these ideas -- the loop and its sequence, the two metric
          families and the base-rate problem, the analyst feedback that closes the loop, the trigger
          discipline, the two validation bars, the A/B guardrails and significance rule, and the
          defence-in-depth of the gates. Mastery of the chapter is holding the whole loop at once:
          measure, curate, retrain, validate, A/B-test, promote, and measure again -- a suite that
          improves itself without a path to making itself worse.
  - heading: 'Transition to Chapter 18: Real-World Case Studies'
    id: part_5
    blocks:
      - type: prose
        text: >
          Part 4 has built the detector suite (15) on the gateway Chapter 14 deployed, integrated it
          with security operations (16), and made it self-improving (17). Across these chapters the
          suite has become a capable, observable, connected, and adaptive detection system. Chapter
          18 asks the question a design cannot answer for itself: does it work against real attacks?
          A detection system is validated by its performance, not its design, and the chapter's five
          case studies -- an enterprise deployment, injection at scale, production jailbreaks, PII
          leakage, and model abuse -- each run the complete Part 1 to 4 stack, from detectors and
          gateway to integration and improvement loop, against a real attack pattern.
      - type: prose
        text: >
          The handoff is natural. Every case in Chapter 18 assumes the loop of this chapter running
          underneath it: the detectors that catch those attacks are detectors kept calibrated by
          measurement, curation, retraining, and guarded promotion, and the analyst dispositions
          each case produces flow back into that loop. The loop also remains a surface to defend in
          its own right: it consumes analyst dispositions, so it can be poisoned; it retrains
          automatically, so a failure in the loop can propagate; it makes changes to production, so
          it needs the same operational rigour as any deployment pipeline. With the suite now built,
          deployed, integrated, and continuously improving, the final chapter turns to showing it at
          work against real attacks.
