lead: >
  Five detection primitives -- query pattern analyser, OOD detector, output entropy monitor, user
  concentration analyser, and watermarking signal extractor -- cover every extraction goal and
  privacy attack from the Chapter 9 attack catalogue; they are the engineering substrate that
  Section 9.11 wires into the production query monitor and Section 9.12 wires into the output-side
  defence.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          Sections 9.3 through 9.9 established the mechanistic basis for detection: extraction
          queries cluster near decision boundaries, distillation queries cover the input space
          broadly, prompt extraction queries concentrate on model behaviour meta-queries, membership
          inference queries probe specific target records, and economic abuse queries produce
          cost-per-query outliers. Each mechanism generates a measurable signal. Section 9.10
          implements those signals as software primitives.
      - type: prose
        text: >
          The primitives are not independent detectors -- they are a library of signal generators,
          each covering one or more of the five attack surface positions (query-side distributional,
          query-side boundary, query-side OOD, output-side entropy, output-side ownership). Section
          9.11 wires the input-side primitives into the production query monitor as parallel
          detection tracks; Section 9.12 wires the output-side primitives into the watermarking and
          perturbation pipeline. Section 9.10 is the substrate both capstone sections import.
      - type: prose
        text: >
          The six deliverables in this section form a coherent library: a query pattern analyser
          that measures distributional anomaly across a user's session, an OOD detector that flags
          queries outside the model's legitimate input distribution, a boundary query detector that
          identifies near-boundary input pairs, an output entropy monitor that measures per-response
          information leakage risk, a user concentration analyser that scores semantic clustering,
          and a detection ensemble that combines all five signals with configurable weights. The
          empirical comparison harness closes the section by measuring detection rates across
          synthetic attack families, grounding the ensemble weights in measurable performance rather
          than intuition.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 9.10 of 13. Engineering substrate for the production capstones. All detection
          logic in Sections 9.11 and 9.12 is imported from the primitives built here. The empirical
          comparison harness produces the detection rate benchmarks referenced in Section 9.11's
          deployment checklist.
