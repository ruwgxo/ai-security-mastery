  title: 'Section 9.11: Production Query Monitoring and Rate Limiting -- Input-Side LLM10 Capstone'
  summary: >
    Section 9.10 built the detection primitive library. Section 9.11 wires it into production. The
    query monitor integrates all five primitives as parallel detection tracks within the Chapter 6/7
    gateway ensemble, adding Track 6 for query monitoring with per-user state tracking. The adaptive
    rate limiter implements four independent policy dimensions -- requests per minute, tokens per
    minute, cost per hour, and input tokens per request -- with extraction-aware thresholds derived
    from the Section 9.2 budget-fidelity curves. A cross-user collusion detector addresses
    distributed campaigns below per-user thresholds. The section produces query_monitor.py,
    rate_limiter.py, and cross_user_correlator.py, completes the AML.T0040/T0024 Sigma rule, and
    closes the input-side half of OWASP LLM10.
