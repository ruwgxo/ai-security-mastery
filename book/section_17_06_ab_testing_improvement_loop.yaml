lead: >
  The final safety gate and the assembled system: A/B testing proves a validated candidate is
  actually better than the incumbent on live traffic -- splitting a bounded fraction of traffic to
  the candidate, measuring detection metrics per arm, and declaring a winner only on a statistically
  significant improvement, with early-stopping if the candidate regresses -- and then the capstone
  wires all six stages, measure through promote, into one running continuous improvement loop.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          Validation (17.05) proved the candidate is good on a held-out set. That is necessary but
          not sufficient, because a held-out set is a fixed sample and production is the live,
          shifting reality it can only approximate. A candidate can pass validation and still be
          worse in production -- on traffic the eval set did not represent, at the real base rate,
          against attacks that arrived after the set was frozen. A/B testing closes that gap by
          comparing the candidate against the incumbent on live traffic itself, where the real
          distribution applies, and it is the last gate before a candidate takes over. This section
          builds that gate and then assembles the entire chapter into the loop it has been
          describing since 17.01.
      - type: prose
        text: >
          The A/B test is built around two ideas that make it both trustworthy and safe.
          Trustworthy: a difference between the two arms is only real if it is statistically
          significant -- a candidate that catches three more attacks out of a hundred might be
          better or might be noise, and shipping on noise is how a loop convinces itself it is
          improving while drifting randomly. So the test declares a winner only when a
          two-proportion significance test says the difference is unlikely to be chance, and ties go
          to the incumbent. Safe: the candidate is exposed to only a bounded fraction of live
          traffic, so if it is bad, it harms a small slice rather than everyone, and a candidate
          that is clearly regressing is stopped early rather than run to completion. With that gate
          built, the section assembles the capstone: the continuous improvement loop that connects
          measurement, curation, retraining, validation, A/B testing, and promotion into one system,
          enforcing end to end the rule that has governed the whole chapter -- a change reaches
          production only after it has been measured, validated, and proven better on real traffic.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 17.06 completes the improvement half of the loop and then assembles the whole
          loop. A/B testing is the second safety gate after the validation of 17.05, and the
          continuous improvement loop capstone composes every prior section's deliverable into one
          running system. It is the culmination of the chapter's build; Section 17.07 synthesises
          and hands off to Chapter 18.
