deliverables:
  - heading: 'The A/B Testing Framework'
    id: deliverable_1
    filename: ab_testing_framework.py
    lang: python
    description: >
      Compares a candidate against the incumbent on live traffic. assign_arm splits traffic
      deterministically by hashing a stable key, with SplitConfig enforcing a hard ceiling on the
      candidate fraction; ArmStats accumulates per-arm outcomes into recall, FPR, and precision; a
      two-proportion z-test decides significance; and ABTest.check returns candidate_wins only on a
      significant recall improvement without a worse FPR, stopped_regression on a significant
      regression (early-stopping), or inconclusive (keep the incumbent); check_early_stop runs the
      regression guardrail while traffic flows, and run_live_test drives one test end to end. An
      analysis-mode constructor supports offline evaluation of shadow-deployed arms without relaxing
      the live-traffic ceiling.
    notes: >
      Python 3.12, single quotes throughout per book convention, standard-library hashlib,
      dataclasses, enum, and typing only. The two-proportion z-test and fixed z critical values
      avoid a scipy dependency. The candidate fraction is hard-capped so no configuration can
      over-expose production; the significance decision is asymmetric (slow to declare a winner,
      fast to stop a loser) and ties keep the incumbent. Recall is judged only once each arm holds
      30 attacks, and a win is declared only at the planned end of the test. The __main__ block
      verifies the split lands near its target, is stable per key, and enforces the ceiling, then
      runs live tests through the hash split -- early-stop checks every 500 requests -- over 200
      seeds per scenario on synthetic traffic and prints how often each outcome occurs for a
      17-point recall gain, a three-point gain, a tie, and a regression.
    code: |
      # ab_testing_framework.py
      # Section 17.06: A/B Testing Candidate Detectors on Live Traffic
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Validation (17.05) proves a candidate is good on a held-out set. A/B testing
      # proves it is better than the incumbent on LIVE traffic, where the real
      # distribution and the real base rate apply. It splits traffic between incumbent
      # (A) and candidate (B), measures the detection metrics on each arm, and decides
      # a winner only when the difference is statistically significant -- not noise.
      # Two guardrails make it safe: the candidate arm's traffic fraction is bounded,
      # so a bad candidate harms only a small slice, and a clearly-regressing candidate
      # is stopped early rather than run to completion.

      import hashlib
      from dataclasses import dataclass, field
      from enum import Enum
      from typing import Dict, List, Optional, Tuple


      class Arm(Enum):
          CONTROL = 'control'                      # A: the incumbent
          CANDIDATE = 'candidate'                  # B: the challenger


      # --- Deterministic traffic split --------------------------------------------
      # A request is assigned by hashing a stable key, so the same request always
      # lands in the same arm (no flip-flopping) and the split is reproducible. The
      # candidate fraction is bounded -- this is the first guardrail.

      @dataclass
      class SplitConfig:
          candidate_fraction: float = 0.10         # at most this share of traffic sees the candidate
          max_candidate_fraction: float = 0.25     # hard ceiling -- guardrail against over-exposure

          def validate(self) -> None:
              assert 0.0 < self.candidate_fraction <= self.max_candidate_fraction, \
                  'candidate_fraction must be within (0, max_candidate_fraction]'


      def assign_arm(request_key: str, cfg: SplitConfig) -> Arm:
          '''Deterministically assign a request to an arm by hashing its key. Stable:
          the same key always maps to the same arm.'''
          h = int(hashlib.sha256(request_key.encode('utf-8')).hexdigest(), 16)
          bucket = (h % 10000) / 10000.0
          return Arm.CANDIDATE if bucket < cfg.candidate_fraction else Arm.CONTROL


      # --- Per-arm outcome accumulation -------------------------------------------

      @dataclass
      class ArmStats:
          tp: int = 0
          fp: int = 0
          tn: int = 0
          fn: int = 0

          def record(self, is_attack: bool, alerted: bool) -> None:
              if is_attack and alerted: self.tp += 1
              elif is_attack and not alerted: self.fn += 1
              elif not is_attack and alerted: self.fp += 1
              else: self.tn += 1

          @property
          def n(self) -> int:
              return self.tp + self.fp + self.tn + self.fn

          @property
          def recall(self) -> float:
              return self.tp / (self.tp + self.fn) if (self.tp + self.fn) else 0.0

          @property
          def fpr(self) -> float:
              return self.fp / (self.fp + self.tn) if (self.fp + self.tn) else 0.0

          @property
          def precision(self) -> float:
              return self.tp / (self.tp + self.fp) if (self.tp + self.fp) else 0.0


      # --- Statistical significance -----------------------------------------------
      # A difference in a rate between two arms is only a real difference if it is
      # unlikely to be sampling noise. A two-proportion z-test gives that, standard
      # library only. Below the significance bar, the test is inconclusive and the
      # incumbent is kept -- ties go to the incumbent.

      def _two_proportion_z(x1: int, n1: int, x2: int, n2: int) -> float:
          '''z-statistic for the difference between two proportions. 0 if undefined.'''
          if n1 == 0 or n2 == 0:
              return 0.0
          p1, p2 = x1 / n1, x2 / n2
          p = (x1 + x2) / (n1 + n2)
          se = (p * (1 - p) * (1 / n1 + 1 / n2)) ** 0.5
          if se == 0:
              return 0.0
          return (p2 - p1) / se


      # Two-sided z critical values for common confidence levels (no scipy).
      _Z_CRIT = {0.90: 1.645, 0.95: 1.960, 0.99: 2.576}


      def is_significant(z: float, confidence: float = 0.95) -> bool:
          crit = _Z_CRIT.get(confidence, 1.960)
          return abs(z) >= crit


      # --- Early-stopping guardrail -----------------------------------------------
      # A candidate that is clearly regressing should be stopped before the test
      # completes, not run to the end harming traffic. Once there is a minimum sample,
      # if the candidate's recall is significantly WORSE than control, stop.

      @dataclass
      class GuardrailConfig:
          min_samples_per_arm: int = 100           # do not judge before this much data per arm
          min_attacks_per_arm: int = 30            # recall is judged on attacks, so also this many per arm
          confidence: float = 0.95                 # significance level for the decision
          early_stop_confidence: float = 0.95      # significance level for a regression stop


      @dataclass
      class ABDecision:
          status: str                              # 'running' | 'stopped_regression' | 'candidate_wins' | 'inconclusive'
          detail: str
          control: Dict[str, float] = field(default_factory=dict)
          candidate: Dict[str, float] = field(default_factory=dict)


      class ABTest:
          '''Runs one A/B test: routes labelled outcomes to arms, checks the
          early-stop guardrail continuously, and reports a winner only on a
          significant improvement. Ties and inconclusive results keep the incumbent.'''

          def __init__(self, split: Optional[SplitConfig] = None,
                       guard: Optional[GuardrailConfig] = None) -> None:
              self._split = split if split is not None else SplitConfig()
              self._split.validate()
              self._guard = guard if guard is not None else GuardrailConfig()
              self.control = ArmStats()
              self.candidate = ArmStats()
              self._stopped = False

          @classmethod
          def for_analysis(cls, guard: Optional['GuardrailConfig'] = None) -> 'ABTest':
              '''Construct a test for offline significance analysis of already-served
              arms (e.g. a shadow deployment where both detectors scored the same
              traffic). Bypasses the live-traffic split entirely -- outcomes are fed
              per arm via record_arm -- so the production candidate-fraction ceiling is
              never relaxed just to analyse data.'''
              t = cls.__new__(cls)
              t._split = None
              t._guard = guard if guard is not None else GuardrailConfig()
              t.control = ArmStats()
              t.candidate = ArmStats()
              t._stopped = False
              return t

          def record_arm(self, arm: Arm, is_attack: bool, alerted: bool) -> None:
              '''Record an outcome directly into a named arm, for analysis mode.'''
              (self.candidate if arm is Arm.CANDIDATE else self.control).record(is_attack, alerted)

          def _arm_summary(self, s: ArmStats) -> Dict[str, float]:
              return {'n': s.n, 'recall': round(s.recall, 4), 'fpr': round(s.fpr, 4),
                      'precision': round(s.precision, 4)}

          def record_outcome(self, request_key: str, is_attack: bool,
                             control_alerts: bool, candidate_alerts: bool) -> None:
              '''Route one labelled request. The arm decides WHICH detector's verdict
              counts for this request; only that arm's stats are updated, mirroring
              that live traffic is served by one detector or the other.'''
              arm = assign_arm(request_key, self._split)
              if arm is Arm.CANDIDATE:
                  self.candidate.record(is_attack, candidate_alerts)
              else:
                  self.control.record(is_attack, control_alerts)

          def _enough_data(self) -> bool:
              c, k, g = self.control, self.candidate, self._guard
              return (c.n >= g.min_samples_per_arm and k.n >= g.min_samples_per_arm
                      and c.tp + c.fn >= g.min_attacks_per_arm and k.tp + k.fn >= g.min_attacks_per_arm)

          def check_early_stop(self) -> Optional[ABDecision]:
              '''The guardrail run DURING the test: once there is enough data, stop if the
              candidate's recall is significantly worse than control. Returns None while
              the test should keep running. A win is never declared here -- only at the
              planned end, by check() -- so peeking cannot crown a lucky lead.'''
              if not self._enough_data():
                  return None
              c, k = self.control, self.candidate
              z_recall = _two_proportion_z(c.tp, c.tp + c.fn, k.tp, k.tp + k.fn)
              if z_recall < 0 and is_significant(z_recall, self._guard.early_stop_confidence):
                  self._stopped = True
                  return ABDecision('stopped_regression', f'candidate recall regressed (z={z_recall:.2f})',
                                    self._arm_summary(c), self._arm_summary(k))
              return None

          def check(self) -> ABDecision:
              '''The decision at the planned end of the test.'''
              c, k = self.control, self.candidate
              cs, ks = self._arm_summary(c), self._arm_summary(k)
              if not self._enough_data():
                  return ABDecision('running', 'accumulating minimum samples', cs, ks)

              # Early-stop: candidate recall significantly WORSE than control -> regression.
              stop = self.check_early_stop()
              if stop is not None:
                  return stop
              z_recall = _two_proportion_z(c.tp, c.tp + c.fn, k.tp, k.tp + k.fn)

              # Win condition: candidate recall significantly BETTER, without a worse FPR.
              z_fpr = _two_proportion_z(c.fp, c.fp + c.tn, k.fp, k.fp + k.tn)
              recall_better = z_recall > 0 and is_significant(z_recall, self._guard.confidence)
              fpr_not_worse = not (z_fpr > 0 and is_significant(z_fpr, self._guard.confidence))
              if recall_better and fpr_not_worse:
                  return ABDecision('candidate_wins',
                                    f'candidate recall improved (z={z_recall:.2f}), FPR not worse', cs, ks)
              if recall_better:
                  return ABDecision('inconclusive', f'candidate recall improved (z={z_recall:.2f}) but FPR '
                                    f'significantly worse (z={z_fpr:.2f}); keep incumbent', cs, ks)

              return ABDecision('inconclusive', 'no significant improvement; keep incumbent', cs, ks)


      def run_live_test(stream, split: SplitConfig, guard: GuardrailConfig,
                        check_every: int = 500) -> Tuple[ABDecision, int]:
          '''Run one live A/B test over a stream of (request_key, is_attack,
          control_alerts, candidate_alerts): route each request by the hash split,
          check the early-stop guardrail every check_every requests, and decide at the
          end of the stream. Returns the decision and how many requests were served.'''
          test = ABTest(split, guard)
          served = 0
          for key, is_atk, ctrl, cand in stream:
              test.record_outcome(key, is_atk, ctrl, cand)
              served += 1
              if served % check_every == 0:
                  stop = test.check_early_stop()
                  if stop is not None:
                      return stop, served
          return test.check(), served


      if __name__ == '__main__':
          import random

          # --- Split guardrail ---
          cfg = SplitConfig(candidate_fraction=0.10)
          keys = [f'req-{i}' for i in range(10000)]
          arms = {k: assign_arm(k, cfg) for k in keys}          # deterministic: computed once, reused
          cand = sum(1 for a in arms.values() if a is Arm.CANDIDATE)
          print(f'split: {cand}/10000 to candidate (~10% expected)')
          assert 850 <= cand <= 1150
          assert all(assign_arm(k, cfg) is arms[k] for k in keys[:500])   # same key, same arm
          try:
              SplitConfig(candidate_fraction=0.5).validate()
              raise SystemExit('ceiling not enforced')
          except AssertionError:
              print(f'over-exposure ceiling enforced: a 50% split is refused (ceiling '
                    f'{cfg.max_candidate_fraction:.0%})')

          # --- Live tests, each scenario repeated over many seeds ---
          # Synthetic traffic: 10,000 requests per test, 10% attacks, both detectors
          # alerting on 3% of benign requests. The candidate sees ~1,000 requests and
          # ~100 attacks; the decision is read from that arm against control.
          N, ATTACK_RATE, FP_RATE, TRIALS = 10000, 0.10, 0.03, 200
          guard = GuardrailConfig()

          def stream(rng, ctrl_recall, cand_recall):
              for k in keys:
                  is_atk = rng.random() < ATTACK_RATE
                  p_c, p_k = (ctrl_recall, cand_recall) if is_atk else (FP_RATE, FP_RATE)
                  yield k, is_atk, rng.random() < p_c, rng.random() < p_k

          scenarios = [('candidate genuinely better', 0.75, 0.92),
                       ('three points better (75% -> 78%)', 0.75, 0.78),
                       ('no better (tie)', 0.80, 0.80),
                       ('regressing', 0.85, 0.55)]
          print(f'\n--- live A/B tests: {TRIALS} seeds per scenario, {N:,} requests, '
                f'{ATTACK_RATE:.0%} attacks (synthetic) ---')
          rates = {}
          for name, ctrl_r, cand_r in scenarios:
              outcomes = {'candidate_wins': 0, 'inconclusive': 0, 'stopped_regression': 0, 'running': 0}
              stopped_at = []
              for seed in range(TRIALS):
                  decision, served = run_live_test(stream(random.Random(seed), ctrl_r, cand_r), cfg, guard)
                  outcomes[decision.status] += 1
                  if decision.status == 'stopped_regression':
                      stopped_at.append(served)
              rates[name] = {k: v / TRIALS for k, v in outcomes.items()}
              line = ', '.join(f'{k} {v / TRIALS:.1%}' for k, v in outcomes.items() if v)
              print(f'  {name:34} control {ctrl_r:.0%} vs candidate {cand_r:.0%}: {line}')
              if stopped_at:
                  stopped_at.sort()
                  print(f'  {"":34} stopped after a median {stopped_at[len(stopped_at) // 2]:,} of '
                        f'{N:,} requests ({stopped_at[len(stopped_at) // 2] / N:.0%} of the test)')

          better, small, tie, worse = (rates[n] for n, _, _ in scenarios)
          assert better['candidate_wins'] >= 0.90                 # a real improvement is found
          assert small['candidate_wins'] <= 0.25                  # three points on ~100 attacks: mostly not
          assert tie['candidate_wins'] <= 0.05                    # a tie almost never promotes
          assert worse['stopped_regression'] >= 0.95              # a regression is stopped ...
          assert worse['candidate_wins'] == 0.0                   # ... and never promoted

          total_attacks = 100 / cfg.candidate_fraction           # attacks overall for ~100 in the candidate arm
          print(f'\nat a 0.1% production base rate the same ~100 candidate-arm attacks need about '
                f'{total_attacks / 0.001:,.0f} requests, against {total_attacks / ATTACK_RATE:,.0f} here')

          # --- The live-traffic split keeps the candidate arm bounded ---
          print('\n--- live split stays within the safety ceiling ---')
          live_cfg = SplitConfig(candidate_fraction=0.10)
          served = [assign_arm(f'live-{i}', live_cfg) for i in range(10000)]
          cand_share = sum(1 for a in served if a is Arm.CANDIDATE) / len(served)
          print(f'  candidate saw {cand_share:.1%} of live traffic (ceiling {live_cfg.max_candidate_fraction:.0%})')
          assert cand_share <= live_cfg.max_candidate_fraction

          print('\nA/B testing: split guardrail, significance, win/stop/tie all correct: ok')
  - heading: 'The Continuous Improvement Loop'
    id: deliverable_2
    filename: continuous_improvement_loop.py
    lang: python
    description: >
      The capstone that assembles all six stages into one running loop. ContinuousImprovementLoop
      holds the persistent state -- the retrainer with its registry, the trigger state with its
      cooldown -- and run_cycle drives measure -> curate -> (trigger?) retrain -> validate ->
      A/B-test -> promote in order, promoting only a candidate that both validated and won its live
      A/B test; until then the candidate is a registered, unpromoted version, so a candidate that
      loses is never promoted. It composes the deliverables of 17.02, 17.04, 17.05, and 17.06
      without re-implementing any of them.
    notes: >
      Python 3.12, single quotes throughout per book convention, standard library only; imports
      detection_metrics, dataset_curator, model_retrainer, and ab_testing_framework -- so it is the
      integration point that proves the stages compose. The __main__ block runs seven cycles in a
      seeded synthetic world (10% attacks; truth is known because the traffic is synthetic) where an
      evasive technique grows: a quiet cycle; a drift-triggered retrain on labels from alerts, a
      review of requests just below the threshold (where the missed attacks are) and a random review
      sample, which validates, wins its A/B test, and raises measured recall from about 0.48 to
      0.98; three cooldown cycles; a retrain on poisoned dispositions that fails validation; and a
      cycle whose few dispositions curation refuses. It then repeats the seven cycles over 40 seeds
      and prints how often each outcome occurs -- in a few, the A/B test holds back a candidate
      whose recall gain comes with a significantly worse false-positive rate. Drift is a population
      stability index standing in for the Chapter 13 Section 13.05 detector.
    code: |
      # continuous_improvement_loop.py
      # Section 17.06: The Assembled Continuous Improvement Loop
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The capstone: the six stages of Chapter 17 wired into one running loop.
      # measure -> curate -> (trigger?) retrain -> validate -> A/B-test -> promote,
      # then measure again. Each stage is the deliverable from its section; this file
      # is the orchestration that connects them and enforces the safety rule that runs
      # through the whole chapter -- a change reaches production only after it has been
      # measured, validated, and proven better than the incumbent on traffic. Nothing
      # here re-implements a stage; it composes them.

      import math
      import random
      from dataclasses import dataclass, field
      from typing import Dict, List, Optional, Tuple

      from detection_metrics import (LabelledDetection, Verdict, compute_suite_metrics)
      from dataset_curator import (AlertDisposition, Disposition, DatasetCurator,
                                   CurationQualityConfig)
      from model_retrainer import (Example, DetectorModel, ModelRetrainer, TriggerState,
                                   RetrainTriggerConfig)
      from ab_testing_framework import (ABTest, SplitConfig, GuardrailConfig)


      # --- One request as the loop sees it ----------------------------------------
      # score is the detector's input feature; is_attack is the truth, which in
      # production arrives only through dispositions and reviewed samples (17.02).

      @dataclass
      class Request:
          request_id: str
          score: float
          is_attack: bool
          technique: str                           # 'known' | 'evasive' | 'benign'


      def drift_score(reference: List[float], live: List[float], bins: int = 10) -> float:
          '''Population stability index of the live score distribution against the
          reference the production model was trained on. A stand-in for the Chapter 13
          Section 13.05 drift detector: 0 when nothing moved, larger as mass shifts.'''
          def hist(xs: List[float]) -> List[float]:
              h = [0] * bins
              for x in xs:
                  h[min(bins - 1, int(x * bins))] += 1
              return [max(c / len(xs), 1e-4) for c in h]
          r, l = hist(reference), hist(live)
          return sum((b - a) * math.log(b / a) for a, b in zip(r, l))


      @dataclass
      class LoopConfig:
          detector: str = 'prompt_injection'
          review_capacity: int = 150               # unalerted boundary requests analysts review per cycle
          review_band: float = 0.30                # how far below the threshold the review samples
          random_review: int = 300                 # random unalerted requests reviewed, to keep benign representative
          candidate_fraction: float = 0.10         # A/B candidate share of live traffic
          ab_check_every: int = 500                # early-stop check interval, in requests
          trigger: RetrainTriggerConfig = field(default_factory=lambda: RetrainTriggerConfig(
              drift_threshold=0.15, min_new_labels=1000, cooldown_cycles=3))


      @dataclass
      class CycleReport:
          cycle: int
          measured: str                            # the production version this cycle measured
          production: str                          # the production version after the cycle
          recall: float
          fpr: float
          precision: float
          drift: float
          curated_examples: int
          trainable: bool
          retrained: bool
          promoted: bool
          ab_status: str
          notes: List[str] = field(default_factory=list)


      class ContinuousImprovementLoop:
          '''Orchestrates one detector's improvement loop. Holds the persistent state
          the loop carries between cycles -- the retrainer (with its registry), the
          trigger state, and the drift reference -- and runs a cycle by driving each
          stage in order. A candidate reaches production only by passing validation
          AND winning its A/B test; until then it is a registered, unpromoted version.'''

          def __init__(self, config: Optional[LoopConfig] = None) -> None:
              self._cfg = config if config is not None else LoopConfig()
              self._retrainer = ModelRetrainer(self._cfg.detector, trigger_cfg=self._cfg.trigger)
              self._trigger_state = TriggerState(cycles_since_retrain=999, new_labels_since_retrain=0)
              self._reference: List[float] = []
              self._cycle = 0

          @property
          def production(self) -> DetectorModel:
              return self._retrainer.registry.current

          @property
          def history(self) -> List[str]:
              return self._retrainer.registry.history

          def seed(self, seed_examples: List[Example]) -> None:
              self._retrainer.seed(seed_examples)
              self._reference = [e.features['score'] for e in seed_examples]

          # 1. MEASURE: the production model's verdicts on labelled live requests.
          def _measure(self, traffic: List[Request]) -> Dict[str, float]:
              model = self.production
              labelled = [LabelledDetection(self._cfg.detector,
                                            Verdict.BLOCK if r.score >= model.threshold else Verdict.ALLOW,
                                            r.is_attack, request_id=r.request_id) for r in traffic]
              m = compute_suite_metrics(labelled)['__suite__']
              return {'recall': m.recall, 'fpr': m.false_positive_rate, 'precision': m.precision}

          # 2. CURATE: dispositions of what alerted, plus two reviewed samples of the
          # unalerted traffic -- the requests just below the threshold, the only way
          # attacks the detector missed can become labels (17.04), and a random sample,
          # without which the only benign labels are the suspicious-looking ones and
          # the trainer would read the false-positive cost as far higher than it is.
          def _review_queue(self, traffic: List[Request],
                            rng: random.Random) -> Tuple[List[Request], List[Request], List[Request]]:
              t = self.production.threshold
              alerts = [r for r in traffic if r.score >= t]
              band = sorted((r for r in traffic if t - self._cfg.review_band <= r.score < t),
                            key=lambda r: -r.score)[:self._cfg.review_capacity]
              taken = {r.request_id for r in band}
              rest = [r for r in traffic if r.score < t and r.request_id not in taken]
              return alerts, band, rng.sample(rest, min(self._cfg.random_review, len(rest)))

          def run_cycle(self, *, traffic: List[Request], dispositions: List[AlertDisposition],
                        eval_set: List[Example], ab_traffic: List[Request]) -> CycleReport:
              '''One cycle. traffic is this cycle's labelled live sample; dispositions
              are the analysts' labels on the requests _review_queue sent them; eval_set
              is the held-out validation set; ab_traffic is the live traffic an A/B
              test would run on.'''
              self._cycle += 1
              notes: List[str] = []
              measured = self.production.version
              m = self._measure(traffic)
              drift = drift_score(self._reference, [r.score for r in traffic])

              curator = DatasetCurator(CurationQualityConfig())
              for d in dispositions:
                  curator.ingest(d)
              curated = curator.curate()
              self._trigger_state.new_labels_since_retrain += len(curated.examples)
              if not curated.trainable:
                  notes.append(f'curation refused: {curated.reasons}')

              # 3-4. TRIGGER + RETRAIN + VALIDATE (only on trainable data; never promotes here)
              retrained = promoted = False
              ab_status = 'skipped'
              if curated.trainable:
                  score_of = {r.request_id: r.score for r in traffic}
                  view = [Example(e.detection_id, e.detector, e.is_attack, e.label_confidence,
                                  {'score': score_of[e.payload_ref]})
                          for e in curated.training_view(CurationQualityConfig())]
                  outcome = self._retrainer.maybe_retrain(drift, self._trigger_state, view, eval_set,
                                                          promote=False)
                  retrained = outcome['retrained']
                  if not retrained:
                      notes.append(f'no retrain: {outcome["trigger"]}')
                  elif not outcome['validation_passed']:
                      notes.append(f'{outcome["candidate"]} (threshold {outcome["threshold"]:.3f}) failed '
                                   f'validation: {outcome["reasons"]}')
                  else:
                      notes.append(f'{outcome["candidate"]} (threshold {outcome["threshold"]:.3f}) validated: '
                                   f'recall {outcome["recall"]:.3f} vs incumbent '
                                   f'{outcome["incumbent_recall"]:.3f}')
                      # 5. A/B TEST: both versions score the same live requests; the hash
                      # split decides whose verdict counts, the guardrail is checked as
                      # traffic flows, and the decision is taken at the planned end.
                      candidate = self._retrainer.registry.get(outcome['candidate'])
                      incumbent = self.production
                      ab = ABTest(SplitConfig(candidate_fraction=self._cfg.candidate_fraction),
                                  GuardrailConfig())
                      decision = None
                      for i, r in enumerate(ab_traffic, 1):
                          ab.record_outcome(r.request_id, r.is_attack, r.score >= incumbent.threshold,
                                            r.score >= candidate.threshold)
                          if i % self._cfg.ab_check_every == 0:
                              decision = ab.check_early_stop()
                              if decision is not None:
                                  notes.append(f'A/B stopped after {i} of {len(ab_traffic)} requests')
                                  break
                      decision = decision or ab.check()
                      ab_status = decision.status
                      notes.append(f'A/B {decision.status}: {decision.detail}; candidate arm '
                                   f'{decision.candidate}, control arm {decision.control}')
                      # 6. PROMOTE only a validated candidate that won its live test.
                      if decision.status == 'candidate_wins':
                          self._retrainer.registry.promote(candidate.version)
                          self._reference = [r.score for r in traffic]
                          promoted = True
                      else:
                          notes.append(f'{candidate.version} not promoted; production stays '
                                       f'{incumbent.version}')
              if not retrained:
                  self._trigger_state.cycles_since_retrain += 1

              return CycleReport(self._cycle, measured, self.production.version, round(m['recall'], 3),
                                 round(m['fpr'], 4), round(m['precision'], 3), round(drift, 3),
                                 len(curated.examples), curated.trainable, retrained, promoted,
                                 ab_status, notes)


      # --- A seeded synthetic world for the self-check ----------------------------
      # Synthetic traffic, 10% attacks so a short run has enough of them. Known attacks
      # score high; an evasive technique scores in the middle band and grows over the
      # run; benign traffic scores low. Truth is known here because it is synthetic.

      class World:
          def __init__(self, seed: int) -> None:
              self._rng = random.Random(seed)
              self._n = 0

          def traffic(self, n: int, evasive_share: float, attack_rate: float = 0.10) -> List[Request]:
              out = []
              for _ in range(n):
                  self._n += 1
                  if self._rng.random() < attack_rate:
                      if self._rng.random() < evasive_share:
                          s, tech = self._rng.gauss(0.55, 0.04), 'evasive'
                      else:
                          s, tech = self._rng.gauss(0.82, 0.05), 'known'
                      atk = True
                  elif self._rng.random() < 0.01:          # benign requests that read like attacks
                      s, tech, atk = self._rng.gauss(0.80, 0.05), 'benign', False
                  else:
                      s, tech, atk = self._rng.gauss(0.20, 0.06), 'benign', False
                  out.append(Request(f'r{self._n}', round(min(1.0, max(0.0, s)), 3), atk, tech))
              return out

          def dispositions(self, requests: List[Request], poison_evasive: bool = False) -> List[AlertDisposition]:
              '''Analysts label each request they were sent. poison_evasive models an
              adversary who shapes dispositions so their technique reads as benign.'''
              out = []
              for r in requests:
                  truth = r.is_attack and not (poison_evasive and r.technique == 'evasive')
                  out.append(AlertDisposition(r.request_id, 'prompt_injection', 'input', r.request_id,
                                              Disposition.TRUE_POSITIVE if truth
                                              else Disposition.FALSE_POSITIVE, 'ana'))
              return out


      def _as_examples(requests: List[Request]) -> List[Example]:
          return [Example(r.request_id, 'prompt_injection', r.is_attack, 1.0, {'score': r.score})
                  for r in requests]


      PLAN = [  # (evasive share, poisoned dispositions, dispositions delivered) per cycle
          (0.05, False, None), (0.50, False, None), (0.50, False, None), (0.50, False, None),
          (0.50, False, None), (0.50, True, None), (0.50, False, 12)]


      def run_plan(seed: int, verbose: bool = False) -> Tuple[ContinuousImprovementLoop, List[CycleReport]]:
          world = World(seed)
          review_rng = random.Random(seed + 1)
          loop = ContinuousImprovementLoop()
          loop.seed(_as_examples(world.traffic(2000, evasive_share=0.0)))
          if verbose:
              print(f'seeded; production = {loop.production.version} '
                    f'(threshold {loop.production.threshold:.3f}, known technique only)')
              print('synthetic traffic, 10% attacks; truth is known because the traffic is synthetic')
          reports = []
          for evasive, poison, delivered in PLAN:
              traffic = world.traffic(3000, evasive)
              alerts, band, sample = loop._review_queue(traffic, review_rng)
              disp = world.dispositions(alerts + band + sample, poison_evasive=poison)[:delivered]
              eval_set = _as_examples(world.traffic(1500, evasive))       # held out, never trained on
              r = loop.run_cycle(traffic=traffic, dispositions=disp, eval_set=eval_set,
                                 ab_traffic=world.traffic(10000, evasive))
              reports.append(r)
              if not verbose:
                  continue
              missed = sum(1 for x in band if x.is_attack)
              print(f'\n=== cycle {r.cycle}: evasive share {evasive:.0%}'
                    f'{", poisoned dispositions" if poison else ""}'
                    f'{f", only {delivered} dispositions delivered" if delivered else ""} ===')
              print(f'  measured {r.measured}: recall {r.recall:.3f} fpr {r.fpr:.4f} '
                    f'precision {r.precision:.3f}; drift {r.drift:.3f}')
              print(f'  labels: {len(alerts)} alerts + {len(band)} reviewed just below threshold '
                    f'({missed} missed attacks found) + {len(sample)} random unalerted; '
                    f'curated {r.curated_examples}, trainable={r.trainable}')
              for n in r.notes:
                  print(f'  {n}')
              print(f'  -> retrained={r.retrained} promoted={r.promoted} ab={r.ab_status}; '
                    f'production {r.production}')
          return loop, reports


      def outcomes(loop: ContinuousImprovementLoop, reports: List[CycleReport]) -> Dict[str, bool]:
          quiet, drifted, cool1, cool2, cool3, poisoned, outage = reports
          promoted_cycles = [r for r in reports if r.promoted]
          return {
              'quiet cycle: no retrain': not quiet.retrained and quiet.production == 'v1',
              'drift cycle: candidate validated': (drifted.retrained
                                                   and 'validated' in drifted.notes[0]),
              'drift cycle: A/B win, promoted': drifted.promoted and drifted.ab_status == 'candidate_wins',
              'drift cycle: A/B held it back (FPR worse)': (not drifted.promoted
                                                            and 'FPR significantly worse' in ' '.join(drifted.notes)),
              'promotion raised measured recall by 0.2+': (drifted.promoted and cool1.measured == 'v2'
                                                          and cool1.recall > drifted.recall + 0.2),
              'cooldown blocked the next three cycles': all(not c.retrained and 'cooldown' in c.notes[0]
                                                            for c in (cool1, cool2, cool3)),
              'poisoned candidate failed validation': (poisoned.retrained and not poisoned.promoted
                                                       and 'failed validation' in poisoned.notes[0]),
              'outage: curation refused': not outage.trainable and not outage.retrained,
              'every promotion followed an A/B win': (all(r.ab_status == 'candidate_wins' for r in promoted_cycles)
                                                      and len(loop.history) == 1 + len(promoted_cycles)),
          }


      if __name__ == '__main__':
          loop, reports = run_plan(17, verbose=True)
          seen = outcomes(loop, reports)
          assert seen['drift cycle: A/B win, promoted'] and seen['promotion raised measured recall by 0.2+']
          assert seen['poisoned candidate failed validation'] and seen['outage: curation refused']
          assert seen['every promotion followed an A/B win'] and loop.history == ['v1', 'v2']
          print(f'\npromotion history {loop.history}; v1 stays in the registry for rollback '
                f'(rollback is exercised in model_retrainer.py; an A/B regression stop and its rate '
                f'in ab_testing_framework.py)')

          SEEDS = 40
          print(f'\n--- the same seven cycles over {SEEDS} world seeds ---')
          tally = {k: 0 for k in seen}
          for seed in range(SEEDS):
              for k, ok in outcomes(*run_plan(1000 + seed)).items():
                  tally[k] += ok
          for k, n in tally.items():
              print(f'  {k:44} {n}/{SEEDS}')
          assert tally['every promotion followed an A/B win'] == SEEDS            # the safety rule, always
          assert tally['poisoned candidate failed validation'] == SEEDS
          assert tally['drift cycle: A/B win, promoted'] + tally['drift cycle: A/B held it back (FPR worse)'] \
              == tally['drift cycle: candidate validated']
          assert tally['drift cycle: A/B win, promoted'] >= 0.8 * SEEDS
          print('\ncontinuous improvement loop: measure/curate/retrain/validate/AB/promote wired: ok')
common_mistakes:
  - subject: 'Promoting a candidate on validation alone, skipping the live A/B test'
    id: mistake_1
    entries:
      - label: 'Why It Happens'
        value: 'The candidate passed a rigorous held-out validation, so it feels already proven.'
      - label: Consequence
        value: >
          A held-out set is a frozen sample; the candidate underperforms on live traffic it did not
          represent -- a different mix, base rate, or newer attacks -- and the regression only shows
          once it serves all traffic.
      - label: 'Correct Approach'
        value: >
          Treat validation as a filter and prove the survivor on live traffic with an A/B test
          before it takes over, because only the live test measures the real distribution.
  - subject: 'Splitting half the traffic to an unproven candidate'
    id: mistake_2
    entries:
      - label: 'Why It Happens'
        value: 'A 50/50 split gives the fastest, most balanced comparison and is the textbook A/B setup.'
      - label: Consequence
        value: >
          If the candidate is bad, half of production suffers degraded detection for the duration of
          the test -- the test's own blast radius is enormous.
      - label: 'Correct Approach'
        value: >
          Send only a bounded, hard-capped fraction to the candidate, so a bad candidate harms a
          small slice while the majority stays on the trusted incumbent.
  - subject: 'Declaring a winner on any difference between the arms, ignoring significance'
    id: mistake_3
    entries:
      - label: 'Why It Happens'
        value: >
          The candidate's recall came out higher, so it looks better, and shipping the
          better-looking number feels right.
      - label: Consequence
        value: >
          The difference may be sampling noise that reverses on the next batch, so the loop promotes
          on chance and performs a random walk while believing it is improving.
      - label: 'Correct Approach'
        value: >
          Declare a winner only when a significance test says the difference is unlikely to be
          chance, and keep the incumbent on any inconclusive result -- the burden of proof is on the
          challenger.
  - subject: 'Running an A/B test to a fixed sample size even as the candidate clearly regresses'
    id: mistake_4
    entries:
      - label: 'Why It Happens'
        value: >
          A predetermined sample size feels statistically proper, so the test runs to completion
          regardless.
      - label: Consequence
        value: >
          Every request routed to a known-bad candidate after the regression is clear is needless
          harm, prolonging degraded detection for no additional information.
      - label: 'Correct Approach'
        value: >
          Early-stop once the candidate is significantly worse -- be slow to crown a winner but fast
          to abandon a loser -- so a regression is halted rather than endured.
section_summary:
  compact: >
    Section 17.06 builds the loop's final safety gate and then assembles the whole loop. A/B testing
    exists because validation, though necessary, is not sufficient: a held-out set is a frozen
    sample and a candidate can pass it yet underperform on live traffic it did not represent. The
    A/B test moves the comparison onto live traffic, running the candidate against the incumbent
    where the real distribution applies. It is built around two guardrails and one statistical rule.
    The split is bounded -- only a small, hard-capped fraction of traffic reaches the candidate, so
    a bad one harms a slice rather than everyone -- and deterministic, hashing a stable key so a
    request maps consistently to one arm. Early-stopping abandons a candidate the moment it is
    significantly worse, so harm is bounded in duration as well as breadth. And the win condition is
    statistical: a difference between arms decides a winner only when a two-proportion significance
    test says it is unlikely to be chance, with a significantly better recall and no significantly
    worse FPR required, and inconclusive results keeping the incumbent -- the burden of proof is on
    the challenger. The test is deliberately asymmetric: slow and demanding to crown a winner, fast
    and decisive to stop a loser. With A/B testing built, the capstone composes every stage --
    measure, curate, retrain, validate, A/B-test, promote -- into one running continuous improvement
    loop that carries the registry and trigger state between cycles and promotes only a candidate
    that both validated and won its live test, rolling back on a revealed regression. The loop's
    value is enforcing, end to end and automatically, the rule that has governed the chapter: a
    change reaches production only after being measured, validated, and proven better -- the safe
    path made the only path.
  key_takeaways:
    - 'Validation filters candidates; the live A/B test proves the survivor on the real distribution before it takes over'
    - 'The candidate arm is a bounded, hard-capped fraction of traffic, so a bad candidate harms a small slice, not everyone'
    - 'A winner is declared only on a statistically significant improvement; inconclusive results keep the incumbent'
    - 'The test is asymmetric: slow and demanding to crown a winner, fast to early-stop a clear regression'
    - 'The capstone composes all six stages into one running loop without re-implementing any of them'
    - 'The assembled loop enforces end to end that a change reaches production only after being proven better, and stays reversible'
