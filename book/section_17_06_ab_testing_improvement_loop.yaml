deliverables:
  deliverable_1:
    title: The A/B Testing Framework
    filename: ab_testing_framework.py
    description: |-
      Compares a candidate against the incumbent on live traffic. assign_arm splits traffic deterministically by hashing a stable key, with SplitConfig enforcing a hard ceiling on the candidate fraction; ArmStats accumulates per-arm outcomes into recall, FPR, and precision; a two-proportion z-test decides significance; and ABTest.check returns candidate_wins only on a significant recall improvement without a worse FPR, stopped_regression on a significant regression (early-stopping), or inconclusive (keep the incumbent). An analysis-mode constructor supports offline evaluation of shadow-deployed arms without relaxing the live-traffic ceiling.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library hashlib, dataclasses, enum, and typing only. The two-proportion z-test and fixed z critical values avoid a scipy dependency. The candidate fraction is hard-capped so no configuration can over-expose production; the significance decision is asymmetric (slow to declare a winner, fast to stop a loser) and ties keep the incumbent. The __main__ block verifies the split lands near its target and enforces the ceiling, then shows a genuine winner, an early-stopped regression, and an inconclusive tie via shadow analysis.
    code: |
      # ab_testing_framework.py
      # Section 17.06: A/B Testing Candidate Detectors on Live Traffic
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Validation (17.05) proves a candidate is good on a held-out set. A/B testing
      # proves it is better than the incumbent on LIVE traffic, where the real
      # distribution and the real base rate apply. It splits traffic between incumbent
      # (A) and candidate (B), measures the detection metrics on each arm, and decides
      # a winner only when the difference is statistically significant -- not noise.
      # Two guardrails make it safe: the candidate arm's traffic fraction is bounded,
      # so a bad candidate harms only a small slice, and a clearly-regressing candidate
      # is stopped early rather than run to completion.

      import hashlib
      from dataclasses import dataclass, field
      from enum import Enum
      from typing import Dict, List, Optional, Tuple


      class Arm(Enum):
          CONTROL = 'control'                      # A: the incumbent
          CANDIDATE = 'candidate'                  # B: the challenger


      # --- Deterministic traffic split --------------------------------------------
      # A request is assigned by hashing a stable key, so the same request always
      # lands in the same arm (no flip-flopping) and the split is reproducible. The
      # candidate fraction is bounded -- this is the first guardrail.

      @dataclass
      class SplitConfig:
          candidate_fraction: float = 0.10         # at most this share of traffic sees the candidate
          max_candidate_fraction: float = 0.25     # hard ceiling -- guardrail against over-exposure

          def validate(self) -> None:
              assert 0.0 < self.candidate_fraction <= self.max_candidate_fraction, \
                  'candidate_fraction must be within (0, max_candidate_fraction]'


      def assign_arm(request_key: str, cfg: SplitConfig) -> Arm:
          '''Deterministically assign a request to an arm by hashing its key. Stable:
          the same key always maps to the same arm.'''
          h = int(hashlib.sha256(request_key.encode('utf-8')).hexdigest(), 16)
          bucket = (h % 10000) / 10000.0
          return Arm.CANDIDATE if bucket < cfg.candidate_fraction else Arm.CONTROL


      # --- Per-arm outcome accumulation -------------------------------------------

      @dataclass
      class ArmStats:
          tp: int = 0
          fp: int = 0
          tn: int = 0
          fn: int = 0

          def record(self, is_attack: bool, alerted: bool) -> None:
              if is_attack and alerted: self.tp += 1
              elif is_attack and not alerted: self.fn += 1
              elif not is_attack and alerted: self.fp += 1
              else: self.tn += 1

          @property
          def n(self) -> int:
              return self.tp + self.fp + self.tn + self.fn

          @property
          def recall(self) -> float:
              return self.tp / (self.tp + self.fn) if (self.tp + self.fn) else 0.0

          @property
          def fpr(self) -> float:
              return self.fp / (self.fp + self.tn) if (self.fp + self.tn) else 0.0

          @property
          def precision(self) -> float:
              return self.tp / (self.tp + self.fp) if (self.tp + self.fp) else 0.0


      # --- Statistical significance -----------------------------------------------
      # A difference in a rate between two arms is only a real difference if it is
      # unlikely to be sampling noise. A two-proportion z-test gives that, standard
      # library only. Below the significance bar, the test is inconclusive and the
      # incumbent is kept -- ties go to the incumbent.

      def _two_proportion_z(x1: int, n1: int, x2: int, n2: int) -> float:
          '''z-statistic for the difference between two proportions. 0 if undefined.'''
          if n1 == 0 or n2 == 0:
              return 0.0
          p1, p2 = x1 / n1, x2 / n2
          p = (x1 + x2) / (n1 + n2)
          se = (p * (1 - p) * (1 / n1 + 1 / n2)) ** 0.5
          if se == 0:
              return 0.0
          return (p2 - p1) / se


      # Two-sided z critical values for common confidence levels (no scipy).
      _Z_CRIT = {0.90: 1.645, 0.95: 1.960, 0.99: 2.576}


      def is_significant(z: float, confidence: float = 0.95) -> bool:
          crit = _Z_CRIT.get(confidence, 1.960)
          return abs(z) >= crit


      # --- Early-stopping guardrail -----------------------------------------------
      # A candidate that is clearly regressing should be stopped before the test
      # completes, not run to the end harming traffic. Once there is a minimum sample,
      # if the candidate's recall is significantly WORSE than control, stop.

      @dataclass
      class GuardrailConfig:
          min_samples_per_arm: int = 100           # do not judge before this much data per arm
          confidence: float = 0.95                 # significance level for the decision
          early_stop_confidence: float = 0.95      # significance level for a regression stop


      @dataclass
      class ABDecision:
          status: str                              # 'running' | 'stopped_regression' | 'candidate_wins' | 'inconclusive'
          detail: str
          control: Dict[str, float] = field(default_factory=dict)
          candidate: Dict[str, float] = field(default_factory=dict)


      class ABTest:
          '''Runs one A/B test: routes labelled outcomes to arms, checks the
          early-stop guardrail continuously, and reports a winner only on a
          significant improvement. Ties and inconclusive results keep the incumbent.'''

          def __init__(self, split: Optional[SplitConfig] = None,
                       guard: Optional[GuardrailConfig] = None) -> None:
              self._split = split if split is not None else SplitConfig()
              self._split.validate()
              self._guard = guard if guard is not None else GuardrailConfig()
              self.control = ArmStats()
              self.candidate = ArmStats()
              self._stopped = False

          @classmethod
          def for_analysis(cls, guard: Optional['GuardrailConfig'] = None) -> 'ABTest':
              '''Construct a test for offline significance analysis of already-served
              arms (e.g. a shadow deployment where both detectors scored the same
              traffic). Bypasses the live-traffic split entirely -- outcomes are fed
              per arm via record_arm -- so the production candidate-fraction ceiling is
              never relaxed just to analyse data.'''
              t = cls.__new__(cls)
              t._split = None
              t._guard = guard if guard is not None else GuardrailConfig()
              t.control = ArmStats()
              t.candidate = ArmStats()
              t._stopped = False
              return t

          def record_arm(self, arm: Arm, is_attack: bool, alerted: bool) -> None:
              '''Record an outcome directly into a named arm, for analysis mode.'''
              (self.candidate if arm is Arm.CANDIDATE else self.control).record(is_attack, alerted)

          def _arm_summary(self, s: ArmStats) -> Dict[str, float]:
              return {'n': s.n, 'recall': round(s.recall, 4), 'fpr': round(s.fpr, 4),
                      'precision': round(s.precision, 4)}

          def record_outcome(self, request_key: str, is_attack: bool,
                             control_alerts: bool, candidate_alerts: bool) -> None:
              '''Route one labelled request. The arm decides WHICH detector's verdict
              counts for this request; only that arm's stats are updated, mirroring
              that live traffic is served by one detector or the other.'''
              arm = assign_arm(request_key, self._split)
              if arm is Arm.CANDIDATE:
                  self.candidate.record(is_attack, candidate_alerts)
              else:
                  self.control.record(is_attack, control_alerts)

          def check(self) -> ABDecision:
              c, k = self.control, self.candidate
              cs, ks = self._arm_summary(c), self._arm_summary(k)
              if c.n < self._guard.min_samples_per_arm or k.n < self._guard.min_samples_per_arm:
                  return ABDecision('running', 'accumulating minimum samples', cs, ks)

              # Early-stop: candidate recall significantly WORSE than control -> regression.
              z_recall = _two_proportion_z(c.tp, c.tp + c.fn, k.tp, k.tp + k.fn)
              if z_recall < 0 and is_significant(z_recall, self._guard.early_stop_confidence):
                  self._stopped = True
                  return ABDecision('stopped_regression',
                                    f'candidate recall regressed (z={z_recall:.2f})', cs, ks)

              # Win condition: candidate recall significantly BETTER, without a worse FPR.
              z_fpr = _two_proportion_z(c.fp, c.fp + c.tn, k.fp, k.fp + k.tn)
              recall_better = z_recall > 0 and is_significant(z_recall, self._guard.confidence)
              fpr_not_worse = not (z_fpr > 0 and is_significant(z_fpr, self._guard.confidence))
              if recall_better and fpr_not_worse:
                  return ABDecision('candidate_wins',
                                    f'candidate recall improved (z={z_recall:.2f}), FPR not worse', cs, ks)

              return ABDecision('inconclusive', 'no significant improvement; keep incumbent', cs, ks)


      if __name__ == '__main__':
          import random

          # --- Split guardrail ---
          cfg = SplitConfig(candidate_fraction=0.10)
          keys = [f'req-{i}' for i in range(10000)]
          cand = sum(1 for k in keys if assign_arm(k, cfg) is Arm.CANDIDATE)
          print(f'split: {cand}/10000 to candidate (~10% expected)')
          assert 850 <= cand <= 1150
          try:
              SplitConfig(candidate_fraction=0.5).validate()
              raise SystemExit('ceiling not enforced')
          except AssertionError:
              print('over-exposure ceiling enforced: ok')

          # --- A winning candidate: better recall at equal FPR (shadow analysis) ---
          print('\n--- candidate genuinely better ---')
          random.seed(1)
          test = ABTest.for_analysis()   # shadow: both detectors scored the same traffic
          for i in range(4000):
              is_atk = random.random() < 0.3
              ctrl = (random.random() < 0.75) if is_atk else (random.random() < 0.03)
              cand_a = (random.random() < 0.92) if is_atk else (random.random() < 0.03)
              test.record_arm(Arm.CONTROL, is_atk, ctrl)
              test.record_arm(Arm.CANDIDATE, is_atk, cand_a)
          d = test.check()
          print(f'  {d.status}: {d.detail}')
          print(f'  control  : {d.control}')
          print(f'  candidate: {d.candidate}')
          assert d.status == 'candidate_wins'

          # --- A regressing candidate: caught and stopped ---
          print('\n--- candidate regressing (early stop) ---')
          random.seed(2)
          test2 = ABTest.for_analysis()
          for i in range(4000):
              is_atk = random.random() < 0.3
              ctrl = (random.random() < 0.85) if is_atk else (random.random() < 0.03)
              cand_a = (random.random() < 0.55) if is_atk else (random.random() < 0.03)
              test2.record_arm(Arm.CONTROL, is_atk, ctrl)
              test2.record_arm(Arm.CANDIDATE, is_atk, cand_a)
          d2 = test2.check()
          print(f'  {d2.status}: {d2.detail}')
          assert d2.status == 'stopped_regression'

          # --- A tie: inconclusive, incumbent kept ---
          print('\n--- candidate no better (inconclusive) ---')
          random.seed(3)
          test3 = ABTest.for_analysis()
          for i in range(4000):
              is_atk = random.random() < 0.3
              ctrl = (random.random() < 0.80) if is_atk else (random.random() < 0.03)
              cand_a = (random.random() < 0.80) if is_atk else (random.random() < 0.03)
              test3.record_arm(Arm.CONTROL, is_atk, ctrl)
              test3.record_arm(Arm.CANDIDATE, is_atk, cand_a)
          d3 = test3.check()
          print(f'  {d3.status}: {d3.detail}')
          assert d3.status == 'inconclusive'

          # --- The live-traffic split keeps the candidate arm bounded ---
          print('\n--- live split stays within the safety ceiling ---')
          live_cfg = SplitConfig(candidate_fraction=0.10)
          served = [assign_arm(f'live-{i}', live_cfg) for i in range(10000)]
          cand_share = sum(1 for a in served if a is Arm.CANDIDATE) / len(served)
          print(f'  candidate saw {cand_share:.1%} of live traffic (ceiling {live_cfg.max_candidate_fraction:.0%})')
          assert cand_share <= live_cfg.max_candidate_fraction

          print('\nA/B testing: split guardrail, significance, win/stop/tie all correct: ok')
  deliverable_2:
    title: The Continuous Improvement Loop
    filename: continuous_improvement_loop.py
    description: |-
      The capstone that assembles all six stages into one running loop. ContinuousImprovementLoop holds the persistent state -- the retrainer with its registry, the trigger state with its cooldown -- and run_cycle drives measure -> curate -> (trigger?) retrain -> validate -> A/B-test -> promote in order, promoting only a candidate that both validated and won its live A/B test, and rolling back if the A/B test reveals a regression. It composes the deliverables of 17.02, 17.04, 17.05, and 17.06 without re-implementing any of them.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard library only; imports detection_metrics, dataset_curator, model_retrainer, and ab_testing_framework -- so it is the integration point that proves the stages compose. The __main__ block runs several cycles: a quiet cycle (measure only), a drift-triggered retrain that validates and wins its A/B test and is promoted, cooldown cycles that correctly block retraining, and a final cycle where a validated candidate loses its live A/B test and is rolled back -- demonstrating end to end that a change reaches production only after being proven better, and can still be reversed.
    code: |
      # continuous_improvement_loop.py
      # Section 17.06: The Assembled Continuous Improvement Loop
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The capstone: the six stages of Chapter 17 wired into one running loop.
      # measure -> curate -> (trigger?) retrain -> validate -> A/B-test -> promote,
      # then measure again. Each stage is the deliverable from its section; this file
      # is the orchestration that connects them and enforces the safety rule that runs
      # through the whole chapter -- a change reaches production only after it has been
      # measured, validated, and proven better than the incumbent on traffic. Nothing
      # here re-implements a stage; it composes them.

      from dataclasses import dataclass, field
      from typing import Dict, List, Optional

      from detection_metrics import (LabelledDetection, Verdict, compute_suite_metrics)
      from dataset_curator import (AlertDisposition, Disposition, DatasetCurator,
                                   CurationQualityConfig)
      from model_retrainer import (Example, ModelRetrainer, TriggerState, QualityBar,
                                  RetrainTriggerConfig)
      from ab_testing_framework import (ABTest, Arm, SplitConfig, GuardrailConfig)


      @dataclass
      class LoopConfig:
          detector: str = 'prompt_injection'
          ab_min_samples_per_arm: int = 100


      @dataclass
      class CycleReport:
          cycle: int
          suite_recall: float
          suite_fpr: float
          curated_examples: int
          trainable: bool
          retrained: bool
          promoted: bool
          ab_status: str
          notes: List[str] = field(default_factory=list)


      class ContinuousImprovementLoop:
          '''Orchestrates one detector's improvement loop. Holds the persistent state
          the loop carries between cycles -- the retrainer (with its registry) and the
          trigger state -- and runs a cycle by driving each stage in order. The loop
          never promotes a candidate that has not been validated AND won its A/B test.'''

          def __init__(self, config: Optional[LoopConfig] = None) -> None:
              self._cfg = config if config is not None else LoopConfig()
              self._retrainer = ModelRetrainer(self._cfg.detector)
              self._trigger_state = TriggerState(cycles_since_retrain=999, new_labels_since_retrain=0)
              self._cycle = 0

          def seed(self, seed_examples: List[Example]) -> None:
              self._retrainer.seed(seed_examples)

          def _measure(self, labelled: List[LabelledDetection]) -> Dict[str, float]:
              suite = compute_suite_metrics(labelled)['__suite__']
              return {'recall': suite.true_positive_rate, 'fpr': suite.false_positive_rate}

          def _curate(self, dispositions: List[AlertDisposition]):
              curator = DatasetCurator(CurationQualityConfig(min_examples=10, min_attacks=3))
              for d in dispositions:
                  curator.ingest(d)
              return curator.curate()

          def run_cycle(self, *, labelled: List[LabelledDetection],
                        dispositions: List[AlertDisposition], drift_score: float,
                        training_view: List[Example], eval_set: List[Example],
                        ab_outcomes: Optional[List[tuple]] = None) -> CycleReport:
              self._cycle += 1
              notes: List[str] = []

              # 1. MEASURE
              m = self._measure(labelled)

              # 2. CURATE
              curated = self._curate(dispositions)
              self._trigger_state.new_labels_since_retrain += len(curated.examples)
              if not curated.trainable:
                  notes.append(f'curation refused: {curated.reasons}')

              # 3-4. TRIGGER + RETRAIN + VALIDATE (only if curation produced trainable data)
              retrained = promoted_by_validation = False
              candidate_version = None
              if curated.trainable:
                  outcome = self._retrainer.maybe_retrain(drift_score, self._trigger_state,
                                                          training_view, eval_set)
                  retrained = outcome['retrained']
                  if retrained:
                      candidate_version = outcome.get('candidate')
                      if not outcome['validation_passed']:
                          notes.append(f'validation failed: {outcome["reasons"]}')
                      promoted_by_validation = outcome['promoted']
                  else:
                      notes.append(f'no retrain: {outcome["trigger"]}')

              # 5. A/B TEST (only a validated candidate earns a live test)
              ab_status = 'skipped'
              promoted = promoted_by_validation
              if retrained and promoted_by_validation and ab_outcomes:
                  ab = ABTest(SplitConfig(candidate_fraction=0.10),
                              GuardrailConfig(min_samples_per_arm=self._cfg.ab_min_samples_per_arm))
                  # ab_outcomes: (arm, is_attack, control_alerts, candidate_alerts)
                  for arm, is_atk, ctrl, cand in ab_outcomes:
                      if arm is Arm.CANDIDATE:
                          ab.candidate.record(is_atk, cand)
                      else:
                          ab.control.record(is_atk, ctrl)
                  decision = ab.check()
                  ab_status = decision.status
                  # 6. PROMOTE stands only if the A/B test did not reveal a regression.
                  if decision.status == 'stopped_regression':
                      rolled = self._retrainer.registry.rollback()
                      promoted = False
                      notes.append(f'A/B regression -> rolled back to '
                                   f'{rolled.version if rolled else "none"}')
                  elif decision.status == 'candidate_wins':
                      notes.append('A/B confirmed candidate; promotion stands')
                  else:
                      notes.append(f'A/B {decision.status}; candidate kept on validation merit')

              # advance cooldown clock for cycles that did not retrain
              if not retrained:
                  self._trigger_state.cycles_since_retrain += 1

              return CycleReport(self._cycle, round(m['recall'], 4), round(m['fpr'], 4),
                                 len(curated.examples), curated.trainable, retrained,
                                 promoted, ab_status, notes)

          @property
          def production_version(self) -> Optional[str]:
              cur = self._retrainer.registry.current
              return cur.version if cur else None


      # --- Self-check: run several cycles and show the loop behaving --------------

      def _examples(n_attack, n_benign, atk_score, ben_score):
          out = []
          for i in range(n_attack):
              s = min(1.0, atk_score + ((i % 5) - 2) * 0.05)
              out.append(Example(f'a{i}', 'prompt_injection', True, 1.0, {'score': s}))
          for i in range(n_benign):
              s = max(0.0, ben_score + ((i % 5) - 2) * 0.05)
              out.append(Example(f'b{i}', 'prompt_injection', False, 1.0, {'score': s}))
          return out


      def _dispositions(n_tp, n_fp):
          out = []
          for i in range(n_tp):
              out.append(AlertDisposition(f'tp{i}', 'prompt_injection', 'input', f'r{i}',
                                          Disposition.TRUE_POSITIVE, 'ana'))
          for i in range(n_fp):
              out.append(AlertDisposition(f'fp{i}', 'prompt_injection', 'input', f'r{i}',
                                          Disposition.FALSE_POSITIVE, 'ana'))
          return out


      def _labelled(n_tp, n_fn, n_fp, n_tn):
          out = []
          out += [LabelledDetection('prompt_injection', Verdict.BLOCK, True) for _ in range(n_tp)]
          out += [LabelledDetection('prompt_injection', Verdict.ALLOW, True) for _ in range(n_fn)]
          out += [LabelledDetection('prompt_injection', Verdict.FLAG, False) for _ in range(n_fp)]
          out += [LabelledDetection('prompt_injection', Verdict.ALLOW, False) for _ in range(n_tn)]
          return out


      def _ab_outcomes(n, cand_recall, ctrl_recall, base_rate=0.3):
          import random
          random.seed(7)
          out = []
          for i in range(n):
              is_atk = random.random() < base_rate
              arm = Arm.CANDIDATE if random.random() < 0.1 else Arm.CONTROL
              ctrl = (random.random() < ctrl_recall) if is_atk else (random.random() < 0.03)
              cand = (random.random() < cand_recall) if is_atk else (random.random() < 0.03)
              out.append((arm, is_atk, ctrl, cand))
          return out


      if __name__ == '__main__':
          loop = ContinuousImprovementLoop(LoopConfig(ab_min_samples_per_arm=50))
          loop.seed(_examples(40, 40, 0.85, 0.20))
          print(f'seeded; production = {loop.production_version}')

          good_view = _examples(60, 300, 0.80, 0.15)
          good_eval = _examples(20, 980, 0.80, 0.15)

          print('\n=== Cycle 1: no drift, few new labels -> measure only, no retrain ===')
          r1 = loop.run_cycle(labelled=_labelled(70, 30, 20, 880),
                              dispositions=_dispositions(4, 20),   # 24 labels, below trigger
                              drift_score=0.02, training_view=good_view, eval_set=good_eval)
          print(f'  {r1}')
          assert not r1.retrained and loop.production_version == 'v1'

          print('\n=== Cycle 2: drift fires -> retrain, validate, A/B win -> promote ===')
          r2 = loop.run_cycle(labelled=_labelled(75, 25, 18, 882),
                              dispositions=_dispositions(6, 40),
                              drift_score=0.22, training_view=good_view, eval_set=good_eval,
                              ab_outcomes=_ab_outcomes(3000, cand_recall=0.93, ctrl_recall=0.75))
          print(f'  {r2}')
          assert r2.retrained and r2.promoted and r2.ab_status == 'candidate_wins'
          assert loop.production_version == 'v2'

          print('\n=== Cycle 3: retrain but A/B reveals regression -> rollback ===')
          # cooldown from cycle 2 (3 cycles) must fully lapse first; advance via quiet cycles.
          # Use enough real attack labels to stay trainable so each cycle counts as a
          # genuine no-retrain (cooldown/no-drift) rather than a curation refusal.
          for q in range(3):
              rq = loop.run_cycle(labelled=_labelled(75, 25, 18, 882),
                                  dispositions=_dispositions(4, 8),
                                  drift_score=0.01, training_view=good_view, eval_set=good_eval)
              print(f'  (quiet {q+1}) retrained={rq.retrained} notes={rq.notes}')
          # now a drift-triggered retrain that passes validation but loses the A/B
          r3 = loop.run_cycle(labelled=_labelled(75, 25, 18, 882),
                              dispositions=_dispositions(6, 40),
                              drift_score=0.30, training_view=good_view, eval_set=good_eval,
                              ab_outcomes=_ab_outcomes(3000, cand_recall=0.55, ctrl_recall=0.85))
          print(f'  {r3}')
          assert r3.retrained and r3.ab_status == 'stopped_regression' and not r3.promoted
          # production rolled back to the last good version
          assert loop.production_version == 'v2'

          print('\ncontinuous improvement loop: measure/curate/retrain/validate/AB/promote wired: ok')
common_mistakes:
  mistake_1:
    description: Promoting a candidate on validation alone, skipping the live A/B test
    why_it_happens: The candidate passed a rigorous held-out validation, so it feels already proven.
    consequence: |-
      A held-out set is a frozen sample; the candidate underperforms on live traffic it did not represent -- a different mix, base rate, or newer attacks -- and the regression only shows once it serves all traffic.
    correct_approach: |-
      Treat validation as a filter and prove the survivor on live traffic with an A/B test before it takes over, because only the live test measures the real distribution.
  mistake_2:
    description: Splitting half the traffic to an unproven candidate
    why_it_happens: |-
      A 50/50 split gives the fastest, most balanced comparison and is the textbook A/B setup.
    consequence: |-
      If the candidate is bad, half of production suffers degraded detection for the duration of the test -- the test's own blast radius is enormous.
    correct_approach: |-
      Send only a bounded, hard-capped fraction to the candidate, so a bad candidate harms a small slice while the majority stays on the trusted incumbent.
  mistake_3:
    description: Declaring a winner on any difference between the arms, ignoring significance
    why_it_happens: |-
      The candidate's recall came out higher, so it looks better, and shipping the better-looking number feels right.
    consequence: |-
      The difference may be sampling noise that reverses on the next batch, so the loop promotes on chance and performs a random walk while believing it is improving.
    correct_approach: |-
      Declare a winner only when a significance test says the difference is unlikely to be chance, and keep the incumbent on any inconclusive result -- the burden of proof is on the challenger.
  mistake_4:
    description: |-
      Running an A/B test to a fixed sample size even as the candidate clearly regresses
    why_it_happens: |-
      A predetermined sample size feels statistically proper, so the test runs to completion regardless.
    consequence: |-
      Every request routed to a known-bad candidate after the regression is clear is needless harm, prolonging degraded detection for no additional information.
    correct_approach: |-
      Early-stop once the candidate is significantly worse -- be slow to crown a winner but fast to abandon a loser -- so a regression is halted rather than endured.
section_summary:
  compact: |-
    Section 17.06 builds the loop's final safety gate and then assembles the whole loop. A/B testing exists because validation, though necessary, is not sufficient: a held-out set is a frozen sample and a candidate can pass it yet underperform on live traffic it did not represent. The A/B test moves the comparison onto live traffic, running the candidate against the incumbent where the real distribution applies. It is built around two guardrails and one statistical rule. The split is bounded -- only a small, hard-capped fraction of traffic reaches the candidate, so a bad one harms a slice rather than everyone -- and deterministic, hashing a stable key so a request maps consistently to one arm. Early-stopping abandons a candidate the moment it is significantly worse, so harm is bounded in duration as well as breadth. And the win condition is statistical: a difference between arms decides a winner only when a two-proportion significance test says it is unlikely to be chance, with a significantly better recall and no significantly worse FPR required, and inconclusive results keeping the incumbent -- the burden of proof is on the challenger. The test is deliberately asymmetric: slow and demanding to crown a winner, fast and decisive to stop a loser. With A/B testing built, the capstone composes every stage -- measure, curate, retrain, validate, A/B-test, promote -- into one running continuous improvement loop that carries the registry and trigger state between cycles and promotes only a candidate that both validated and won its live test, rolling back on a revealed regression. The loop's value is enforcing, end to end and automatically, the rule that has governed the chapter: a change reaches production only after being measured, validated, and proven better -- the safe path made the only path.
  key_takeaways:
  - |-
    Validation filters candidates; the live A/B test proves the survivor on the real distribution before it takes over
  - |-
    The candidate arm is a bounded, hard-capped fraction of traffic, so a bad candidate harms a small slice, not everyone
  - |-
    A winner is declared only on a statistically significant improvement; inconclusive results keep the incumbent
  - |-
    The test is asymmetric: slow and demanding to crown a winner, fast to early-stop a clear regression
  - |-
    The capstone composes all six stages into one running loop without re-implementing any of them
  - |-
    The assembled loop enforces end to end that a change reaches production only after being proven better, and stays reversible
