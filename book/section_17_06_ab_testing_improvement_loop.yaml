prose_content:
  part_1:
    title: Why Validation Is Not Enough
    body: |-
      The retraining stage validated the candidate against a held-out evaluation set and would not promote it unless it cleared the quality bar and beat the incumbent. That is a real gate, and it catches the candidate that is knowably worse. But it has an inherent limit: the held-out set is a frozen sample, and production is not. The evaluation set was curated at some past moment from some slice of traffic; the live traffic the candidate will actually face is larger, shifting, and full of cases the set never contained. A candidate can score beautifully on the held-out set and underperform in production because production has a different mix, a different base rate in practice, or an attack pattern that emerged after the set was frozen. Passing validation means the candidate is not knowably worse; it does not mean it is actually better where it counts.

      A/B testing closes exactly that gap by moving the comparison onto live traffic. Instead of asking 'is the candidate better on this fixed set?', it asks 'is the candidate better on the real traffic flowing right now?' -- and it answers by running both detectors against that live traffic and comparing. This is the difference between a lab result and a field trial. The lab result (validation) is fast, repeatable, and a necessary filter; the field trial (A/B test) is slower and messier but measures the thing that actually matters, performance on the real distribution. The two are complementary gates: validation filters out the candidates not worth testing live, and the A/B test proves the survivors on the traffic they will serve. Only after both does a candidate deserve to take over.
  part_2:
    title: Splitting Traffic Safely
    body: |-
      An A/B test runs two detectors on live traffic at once, which raises an immediate safety question: if the candidate is bad, how much harm does the test itself do? The answer is controlled by how traffic is split, and the split is designed around a guardrail. Rather than sending half the traffic to an unproven candidate, the test sends only a bounded fraction -- a tenth, say -- so that even if the candidate is much worse than the incumbent, it degrades detection on only that small slice while the large majority stays on the trusted incumbent. The candidate fraction has a hard ceiling above which it cannot be configured, so no misconfiguration can expose most of production to an unproven detector. The test's own blast radius is capped by construction.

      The split is deterministic, computed by hashing a stable request key so the same request always lands in the same arm. This matters for two reasons. First, it means a given user or session has a consistent experience rather than flip-flopping between detectors request to request, which would make the comparison noisy and the behaviour erratic. Second, it makes the whole test reproducible: the assignment is a pure function of the key, so the split can be reasoned about, audited, and replayed. Determinism plus a bounded, hard-capped fraction is what makes it safe to run an unproven detector against live traffic at all -- the candidate gets a real, representative sample of production to prove itself on, but never enough of it to cause widespread harm if it fails. The test is structured so that the cost of being wrong about the candidate is small and contained.
  part_3:
    title: 'Significance: Telling a Real Difference from Noise'
    body: |-
      Once both arms have processed traffic, each has a set of detection outcomes and therefore its own recall, false-positive rate, and precision. The candidate's recall will almost never be exactly equal to the incumbent's -- it will be a little higher or a little lower -- and the central question is whether that difference is real or just the luck of which requests happened to land in which arm. This is the question statistical significance answers, and getting it right is what separates a loop that genuinely improves from one that fools itself. A candidate that caught 78% of attacks against the incumbent's 75% might be a true three-point improvement, or it might be a coin-flip that would reverse on the next thousand requests. Promoting on that difference without testing it is promoting on noise, and a loop that promotes on noise does not improve -- it performs a random walk while congratulating itself on each step.

      The test uses a two-proportion significance test -- comparing the two arms' rates given their sample sizes -- and declares a difference real only when it clears a confidence threshold, meaning it is unlikely to have arisen by chance. Below that threshold the result is inconclusive, and inconclusive results keep the incumbent: a candidate that cannot be shown to be significantly better is not promoted, because the burden of proof is on the challenger. This asymmetry is deliberate and conservative -- the incumbent is the known quantity, and a tie or an unproven lead is not a reason to replace it. The win condition is correspondingly strict: the candidate must show a significantly better recall without a significantly worse false-positive rate, so it cannot win by catching more attacks at the cost of drowning analysts in false alarms. Only a candidate that is provably, not maybe, better takes over.
  part_4:
    title: Early-Stopping a Regressing Candidate
    body: |-
      The bounded split limits how much a bad candidate can harm, but it does not by itself limit how long the harm lasts. If a candidate is clearly regressing -- catching meaningfully fewer attacks than the incumbent on its slice of traffic -- there is no reason to keep running the test to some predetermined sample size. Every additional request routed to a known-bad candidate is a request whose detection is worse for no informational gain, because the test has already learned what it needed to learn. Early-stopping is the guardrail that acts on that: once there is enough data to judge, if the candidate's recall is significantly worse than the incumbent's, the test stops and the candidate is abandoned. The regression is caught and halted rather than endured to completion.

      This makes the A/B test asymmetric in a second way, matching its asymmetric burden of proof. It waits patiently for enough evidence before it will declare the candidate a winner -- a lead must be significant and sustained. But it moves quickly to stop a clear loser, because the cost of continuing a losing test is real, ongoing harm to the slice of traffic on the candidate. Winning is slow and demanding; losing is fast and decisive. Combined with the bounded split, early-stopping means the total harm a bad candidate can do is doubly limited -- to a small fraction of traffic, for a short time -- which is what allows the loop to test candidates on live traffic aggressively and often without accumulating risk. A test that could neither bound its blast radius nor stop early would be too dangerous to run automatically; with both, it is safe enough to be a routine stage of the loop.
  part_5:
    title: The Assembled Continuous Improvement Loop
    body: |-
      With A/B testing built, every stage of the loop exists, and the capstone assembles them into one running system. The continuous improvement loop composes the deliverables of the whole chapter: it measures the suite with the detection metrics of 17.02, curates a dataset from analyst dispositions with the curator of 17.04, decides whether to retrain and does so under the disciplines of 17.05, validates the candidate, A/B-tests a validated candidate with the framework of this section, and promotes only a candidate that both validated and won its live test -- rolling back through the registry if the A/B test reveals a regression. It carries the persistent state the loop needs between cycles: the registry with its version history, the trigger state with its cooldown. Each cycle drives the stages in order and reports what happened, and then the loop returns to measuring the possibly-changed suite. Nothing in the capstone re-implements a stage; it is pure orchestration, and that is the point -- the stages were built to compose.

      The assembled loop's value is that it enforces, end to end and automatically, the rule that has run through every section of this chapter: a change reaches production only after it has been measured against a baseline, validated against the quality bar and the incumbent, and proven significantly better on live traffic -- and even then it can be rolled back. No single stage guarantees that; the loop does, by making each stage a gate the change must pass and giving the change no path to production that bypasses them. A candidate can fail the trigger and never be built, fail curation's quality gate and never be trained, fail validation and never be tested, fail or regress in the A/B test and never be promoted or be rolled back. The loop is the composition of every safeguard the chapter built into a single pipeline where the safe path is the only path. This is the continuous improvement loop that 17.01 promised: not a collection of tuning techniques, but a running system that improves the detector suite while making it structurally difficult to make it worse. With the loop assembled, Section 17.07 steps back to synthesise the chapter and hand off to Chapter 18.
