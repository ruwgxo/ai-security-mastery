section_overview:
  one_line_summary: |-
    The first case study, a composite: a large financial-services and healthcare organisation deploying an LLM to internal and external users, where the complete detection stack meets the threat model of an enterprise -- and where the enterprise context adds compliance requirements that shape how the system is deployed, how incidents are detected and handled, and how they must be reported, validating that the Part 1 to 4 system holds up against enterprise scale and regulatory demand.
  why_this_section_exists: |-
    The enterprise deployment is the right first case because it is the widest: it does not foreground one attack class but the whole system in the setting most detection systems actually run in -- a large organisation, mixed internal and external users, regulatory constraints, and a threat surface that spans every attack the later cases examine in isolation. Before the chapter zooms in on injection, jailbreak, PII, and abuse, this case establishes the full-stack, full-context baseline: what it means to run the complete detection system in a real enterprise, under real compliance, against the ordinary mix of threats an enterprise LLM faces daily.

    The case exists to make two things concrete that the build chapters could only state. First, that the layered system operates as a whole in a real deployment -- the per-request detectors, the behavioural analysis, the deployment engineering, the SIEM integration, and the tuning loop all running together against live enterprise traffic, not as separate demos. Second, that the enterprise context is not a neutral backdrop but an active shaper of the security posture: financial-services and healthcare compliance change how the system is configured, what must be logged, how an incident is escalated, and what reporting obligations a detection triggers. A PII exposure in this setting is a regulatory event, not just a security one. The case works the method through the incidents an enterprise deployment encounters, shows the compliance-shaped response, and draws the architecture recommendations for enterprise LLM security -- validating that the system built across the book withstands the scale and the compliance demands of the environment it was ultimately built for. As established in 18.01, the scenario is a representative composite, not a specific proprietary incident.
  position_in_chapter: |-
    Section 18.02 is the first of the five case studies, and the widest -- it establishes the full-stack, full-compliance enterprise baseline before the later cases foreground specific attack classes. It applies the 18.01 method, exercises the complete Part 1 to 4 stack under financial-services and healthcare compliance, and produces the enterprise architecture recommendation and compliance-aware playbook that the more focused cases build against.
