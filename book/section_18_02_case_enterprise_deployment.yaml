prose_content:
  part_1:
    title: The Scenario and Its Threat Model
    body: |-
      The scenario is a composite representative of a common enterprise reality: a large organisation operating in both financial services and healthcare deploys an LLM-backed assistant, exposed to two very different populations. Internal users -- employees, analysts, clinicians -- use it against sensitive internal data. External users -- customers, patients, partners -- reach a more constrained version through public-facing channels. This dual exposure is the defining feature of the enterprise threat model and the reason it is the widest case: the system faces the full range of threats at once, from careless internal misuse to determined external attack, across a surface that touches regulated financial and health data. There is no single adversary to model; there is a population, most of it benign, some of it careless, a little of it hostile, and the detection system must serve all of it without failing the regulated data at its centre.

      The threat model that follows from this is broad rather than deep. An enterprise deployment does not primarily face a novel, targeted attack; it faces the ordinary daily mix -- prompt injection attempts probing what the assistant will do, users trying to extract data they should not see, external actors testing the public surface, internal users inadvertently pasting regulated data into prompts. The severity comes not from the sophistication of any one attack but from the consequences of a miss in a regulated context: a single PII exposure is a reportable event, a single successful injection against an internal deployment could reach sensitive systems. So the enterprise threat model is one of breadth under high stakes, and it is exactly the environment the layered detection system was built for -- one where threats arrive mixed and the cost of a gap is regulatory as well as operational.
  part_2:
    title: The Security Architecture in an Enterprise Context
    body: |-
      The detection stack in this deployment is the complete system the book built, configured for the enterprise's dual surface. The per-request detectors of Chapter 15 run on every request through the gateway, tuned differently for the internal and external populations -- the external surface is configured more conservatively, because an anonymous external user has no business attempting the things a probing internal analyst might legitimately do. The behavioural analysis of Chapter 13 tracks entities and sessions across both populations, maintaining the risk scores and session context that catch what single requests do not. The deployment engineering of Chapter 14 carries the load of an enterprise's request volume within the latency budget. The SIEM integration of Chapter 16 routes every detection into the enterprise's security operations, enriched and actionable. And the tuning loop of Chapter 17 keeps the whole thing calibrated as the enterprise's traffic and threats evolve.

      What the enterprise context adds is configuration driven by compliance. In a financial-services and healthcare deployment, the logging is not just for debugging -- it is an audit trail with retention requirements, so the SIEM integration is configured to preserve the record regulators will expect. The detection thresholds are set with the regulatory cost of a miss in mind, so PII detection in particular is tuned toward catching leaks even at the cost of some false positives, because an unreported exposure is worse than an over-cautious flag. Access to the assistant and to its detections is itself controlled, because the detection data -- which includes the sensitive content that was flagged -- is regulated data too. The architecture is the book's system, but every configuration knob is turned with compliance as an input, which is the first lesson of the enterprise case: the same system is deployed differently when the domain is regulated.
  part_3:
    title: The Incidents and How the System Detected Them
    body: |-
      Across the deployment, the incidents that matter are illustrative of the enterprise mix, and each exercises a different part of the stack. An internal user, working quickly, pastes a block of text containing patient identifiers into a prompt to summarise it -- an inadvertent PII exposure, not an attack, caught on input by the PII scanner before the regulated data reached the model or any logs that were not access-controlled. An external user runs a series of probing requests against the public surface, each testing whether the assistant will step outside its constraints -- a low-grade injection campaign, caught partly by the per-request injection detector and partly by the behavioural layer, which sees the pattern of probing across the session that no single request makes obvious. And a compromised internal account begins issuing requests that are individually plausible but collectively aimed at extracting more data than the role should access -- caught by the behavioural layer's entity risk scoring, which registers the divergence from the account's established pattern even though no single request trips a per-request detector.

      These three incidents are deliberately chosen to show the layering that 18.01 promised. The inadvertent PII paste is a single-request catch -- the per-request detector doing exactly its job. The external probing is a session-level catch -- the behavioural layer seeing what the per-request view fragments. The compromised-account extraction is an entity-level catch -- the behavioural layer's risk model registering an anomaly against a baseline, the discipline of baseline-before-anomaly that runs through the book. No single layer catches all three; each incident is caught by the layer suited to it, and the enterprise deployment shows why all the layers had to be built. A deployment with only per-request detection would have missed the probing campaign and the compromised account; one with only behavioural analysis would have been slower on the inadvertent paste that needed catching before the data landed. The enterprise case validates the layering by showing three incidents that each need a different layer.
  part_4:
    title: The Compliance-Shaped Response
    body: |-
      Detection is where the enterprise case starts to differ most from a generic one, because the response is shaped by compliance at every step. When the PII scanner catches the inadvertent patient-identifier paste, the immediate technical response is straightforward -- the input is blocked, the regulated data does not reach the model. But the compliance response is where the enterprise context asserts itself: the event is logged to the audit trail with the handling a healthcare regulator expects, the exposure is assessed against reporting thresholds, and if it crosses them, a reporting obligation is triggered that a generic security response would never consider. The playbook for this incident is not just 'block and alert' but 'block, assess regulatory impact, preserve the audit record, and escalate to the compliance function if the thresholds are met.' The security response and the compliance response run together.

      The same shaping applies across the incidents. The external probing campaign, once the behavioural layer confirms it, is responded to with rate-limiting and elevated scrutiny on the source, and the response is documented in the form the enterprise's security operations require for its own audit. The compromised-account extraction triggers not just a technical containment -- the account's session quarantined, its access frozen -- but the incident-handling process that a regulated enterprise must follow when an internal account is compromised, including the notifications and record-keeping that compliance demands. In every case, the SIEM integration of Chapter 16 is what makes this possible: it is the point where a detection becomes an enriched, logged, escalatable alert that can carry the compliance context and feed the regulated audit trail. The enterprise case shows that in a regulated domain, the response playbook is a compliance artifact as much as a security one, and that the detection system's integration into security operations is what lets it meet that dual demand.
  part_5:
    title: Lessons and Architecture Recommendations
    body: |-
      The enterprise case validates the central claim that the layered system holds up as a whole under the broadest, highest-stakes conditions, and it yields architecture recommendations specific to enterprise LLM security. The first is dual-surface configuration: an enterprise serving both internal and external populations should not run one undifferentiated detection configuration but tune the surfaces separately, conservative on the external side, appropriately permissive on the internal side, because the same request means different things from different populations. The second is compliance-driven tuning: in a regulated domain, the detection thresholds -- especially for PII -- should be set with the regulatory cost of a miss as an explicit input, accepting more false positives where an unreported exposure is the far worse outcome. The third is the audit-grade integration: the SIEM integration must be configured to preserve the detection record to the standard regulators expect, because the detection log is part of the compliance evidence, not just an operational convenience.

      The deeper lesson is that deployment configuration is a security decision under compliance, not a neutral setup step. The same detection system, deployed without regard to its domain, would be technically functional and regulatorily exposed -- catching attacks but failing to preserve the records, trigger the reports, or control access to the detection data that a regulated domain requires. The enterprise case is the chapter's demonstration that the system's effectiveness is inseparable from how it is deployed into its context, and that the compliance context is an active part of the security architecture. It validates that the Part 1 to 4 system, correctly configured, withstands the enterprise's scale and compliance demands -- and it sets the baseline for the four focused cases that follow, each of which takes one of the attack classes that arrive mixed in the enterprise and examines it in depth. The next case narrows to the first: prompt injection, at the scale an enterprise deployment operates at.
