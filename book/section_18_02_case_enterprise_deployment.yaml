deliverables:
  deliverable_1:
    title: Enterprise Deployment Case Analysis
    filename: (case analysis -- incident, detection, response, lessons)
    description: |-
      The full incident-detection-response-lessons analysis of the enterprise deployment case: the dual-surface threat model, the three composite incidents (inadvertent PII paste, external probing campaign, compromised-account extraction) and the layer that caught each, the compliance-shaped response for each, and the lessons validating the layered system under enterprise scale and compliance. Presented as the structured analysis in the prose and reference tables.
    implementation_notes: |-
      No runnable code: this is a case analysis, the chapter's deliverable form. The analysis follows the 18.01 method and traces each incident to the Part 1 to 4 layer that caught it, foregrounding how the layers combine across the enterprise's mixed threat surface.
    code: |
      # Section 18.02 deliverable: Enterprise Deployment Case Analysis.
      # Chapter 18 is analysis and playbooks -- see the prose and reference tables.
      #
      # INCIDENT-DETECTION-RESPONSE-LESSONS, applied to the enterprise case:
      #
      #   INCIDENT   Dual-surface enterprise LLM (financial services + healthcare),
      #              internal and external users, regulated data at the centre.
      #   DETECTION  Three composite incidents, each caught by a different layer:
      #                - inadvertent PII paste     -> PII scanner (Ch15, per-request)
      #                - external probing campaign -> session analysis (Ch13, behavioural)
      #                - compromised-account extraction -> entity risk (Ch13, behavioural)
      #   RESPONSE   Compliance-shaped: contain + audit-log + assess-against-thresholds
      #              + escalate-to-compliance + report-if-required, via the Ch16 SIEM.
      #   LESSONS    The layered system holds under the broadest, highest-stakes mix;
      #              deployment configuration is a security decision under compliance.
      print('Section 18.02: enterprise deployment case analysis -- see prose and tables.')
    note: Deliverable is a structured case analysis, not code.
  deliverable_2:
    title: Compliance-Aware Enterprise Response Playbook
    filename: (response playbook -- enterprise context)
    description: |-
      The response playbook for the enterprise context, following the 18.01 playbook template but shaped by financial-services and healthcare compliance: the trigger, the containment, the enrichment, the compliance-aware escalation with regulatory reporting assessment, the recovery, and the review that feeds the tuning loop. The playbook that turns an enterprise detection into a compliant, actioned, audited response.
    implementation_notes: |-
      No runnable code: a response playbook in the chapter's deliverable form. It extends the generic playbook template of 18.01 with the audit-trail, threshold-assessment, and regulatory-reporting steps a regulated enterprise requires.
    code: |
      # Section 18.02 deliverable: Compliance-Aware Enterprise Response Playbook.
      #
      #   TRIGGER   A detector fires on the internal or external surface.
      #   CONTAIN   Block/quarantine; preserve any regulated content under access control.
      #   ENRICH    Attach entity, session, and graph context via the Ch16 integration.
      #   ESCALATE  Notify security operations; assess the event against regulatory
      #             reporting thresholds; if met, escalate to the compliance function.
      #   RECOVER   Restore normal operation; confirm the threat is closed; for a
      #             compromised account, complete the enterprise incident-handling process.
      #   REVIEW    Feed the analyst disposition back into the Ch17 tuning loop; retain
      #             the audit record to the regulatory standard.
      print('Section 18.02: compliance-aware enterprise response playbook -- see prose.')
    note: Deliverable is a response playbook, not code.
common_mistakes:
  mistake_1:
    description: |-
      Running one undifferentiated detection configuration across internal and external users
    why_it_happens: |-
      A single configuration is simpler to deploy and reason about, and the two populations use the same assistant.
    consequence: |-
      The external surface is under-protected or the internal surface over-restricted, because the same request carries very different risk from an anonymous external user versus a probing internal analyst.
    correct_approach: |-
      Configure the surfaces separately -- conservative externally, appropriately permissive internally -- because the same request means different things from different populations.
  mistake_2:
    description: Treating a detection in a regulated domain as only a security event
    why_it_happens: |-
      The detection system is a security tool, so its outputs are naturally handled as security incidents.
    consequence: |-
      The regulatory dimension is missed -- the audit record is not preserved to standard, reporting thresholds are not assessed, and a reportable exposure goes unreported.
    correct_approach: |-
      Handle detections in a regulated domain as compliance events too: preserve the audit trail, assess against reporting thresholds, and escalate to compliance when they are met.
  mistake_3:
    description: Tuning detection thresholds without the regulatory cost of a miss as an input
    why_it_happens: |-
      Thresholds are set for detection accuracy in the abstract, optimising the usual precision-recall trade-off.
    consequence: |-
      PII and similar detectors are tuned too permissively for a regulated context, so an occasional missed exposure -- a reportable event -- is accepted as an ordinary false negative.
    correct_approach: |-
      Set thresholds with the regulatory cost of a miss explicit, accepting more false positives where an unreported exposure is far worse than an over-cautious flag.
  mistake_4:
    description: Leaving the detection data itself outside the compliance perimeter
    why_it_happens: |-
      The detection log is thought of as security metadata rather than as regulated content.
    consequence: |-
      Flagged content -- which includes the sensitive PII or regulated data that was detected -- sits in logs without the access control and retention the data itself would require, creating a second exposure.
    correct_approach: |-
      Bring the detection data inside the compliance perimeter: control access to flagged content and retain it to the same regulatory standard as the underlying regulated data.
section_summary:
  compact: |-
    Section 18.02 is the first and widest case study: a composite enterprise deploying an LLM across a dual internal/external surface in the financial-services and healthcare domains, where the complete Part 1 to 4 detection stack meets an enterprise threat model of breadth under high stakes. The scenario is deliberately the broadest -- not one attack class but the full daily mix, from an internal user inadvertently pasting patient identifiers to an external probing campaign to a compromised internal account extracting data -- because the enterprise is the setting most detection systems actually run in, and its severity comes not from any attack's sophistication but from the regulatory cost of a miss. Three composite incidents demonstrate the layering the whole book built toward: the inadvertent PII paste is a per-request catch by the Chapter 15 scanner, the external probing is a session-level catch by the Chapter 13 behavioural layer, and the compromised-account extraction is an entity-level catch by the behavioural layer's risk scoring against a baseline -- no single layer catches all three, validating why every layer was built. The enterprise context's defining contribution is that compliance shapes the response at every step: containment is joined by audit-grade logging, assessment against regulatory reporting thresholds, escalation to the compliance function, and reporting obligations a generic security response would never consider, all carried by the Chapter 16 SIEM integration. The case yields enterprise architecture recommendations -- dual-surface configuration, compliance-driven tuning, audit-grade integration, and access control over the detection data itself -- and its deeper lesson is that deployment configuration is a security decision under compliance: the same system deployed without regard to its regulated domain would catch attacks yet remain regulatorily exposed.
  key_takeaways:
  - |-
    The enterprise deployment is the widest case: the full detection stack against the full mix of threats under high stakes
  - |-
    The enterprise threat model is breadth across a dual internal/external surface touching regulated data, where a miss is a regulatory event
  - |-
    Three composite incidents are each caught by a different layer, validating why the full Part 1 to 4 stack was built
  - |-
    Compliance shapes the response at every step: audit-grade logging, threshold assessment, escalation to compliance, and reporting
  - |-
    The architecture recommendations are dual-surface configuration, compliance-driven tuning, audit-grade integration, and detection-data access control
  - |-
    The deeper lesson is that deployment configuration is a security decision under compliance, not a neutral setup step
