section_overview:
  one_line_summary: |-
    The third case, a composite: the jailbreak detector and the Chapter 13 multi-turn analysis against real single-turn and multi-turn jailbreaks in production traffic -- including the Crescendo and many-shot families -- where the per-turn detector catches the overt single-turn attempts but the gradual, distributed multi-turn escalations are invisible in any one turn and are caught only by the session-level analysis, making the behavioural layer more central here than in any prior case.
  why_this_section_exists: |-
    Jailbreaks are where the multi-turn dimension becomes unavoidable, and that is why this case matters. An injection can often be caught in the request that carries it; a jailbreak increasingly cannot, because the most effective jailbreaks in production are not single crafted prompts but gradual campaigns spread across a conversation, each turn innocuous on its own, the attack existing only in the accumulation. This case exists to show that jailbreak prevention in production depends on session-level detection in a way that per-turn detection cannot substitute for -- and to validate the Chapter 13 multi-turn analysis against the specific published jailbreak families, Crescendo and many-shot, that exemplify the gradual approach.

    The case works both halves of the jailbreak problem. The single-turn half is the overt jailbreak -- a prompt that tries in one shot to override the model's safety, through role-play framing, instruction override, or a known jailbreak template. These the per-turn jailbreak detector catches, because the attack is present in the turn. The multi-turn half is where the case does its real work: the Crescendo family, which escalates gradually over a conversation, each turn a small step further than the last, so that no single turn crosses a line the per-turn detector would catch, but the trajectory arrives somewhere the model should never have gone; and the many-shot family, which floods the context with examples that gradually normalise the behaviour the attacker wants. Both are invisible to per-turn detection by construction -- they are engineered so that every individual turn looks acceptable -- and both are visible to the session-level analysis that watches the trajectory rather than the turn. As established in 18.01, the jailbreaks are representative composites of these documented families, not specific proprietary incidents.
  position_in_chapter: |-
    Section 18.04 is the third case study, taking the specific-attack pattern to jailbreaks, where the multi-turn dimension makes the Chapter 13 behavioural layer more central than in the injection case. It exercises the jailbreak detector and the multi-turn analysis against single-turn and multi-turn jailbreaks including the Crescendo and many-shot families, and produces the jailbreak-prevention architecture recommendation and playbook. It deepens the layer-complementarity theme toward the entity-and-graph focus of the model-abuse case.
