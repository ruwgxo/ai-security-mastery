prose_content:
  part_1:
    title: 'The Scenario: Jailbreaks That Live in the Conversation'
    body: |-
      The scenario is a composite of the jailbreak attempts a production LLM assistant faces in its conversation traffic, and the case is built around a single sharp distinction: some jailbreaks live in a turn, and some live in the conversation. The turn-dwelling jailbreaks are the overt ones -- a prompt that tries, in one message, to break the model's safety through a role-play frame, an explicit instruction to ignore its guidelines, or a recognised jailbreak template. These are real and common, and the per-turn jailbreak detector of Chapter 15 handles them, because the attack is fully present in the message the detector reads. If jailbreaks were only this, per-turn detection would suffice.

      But the jailbreaks that matter most in production -- the ones that succeed against systems with competent per-turn detection -- do not live in a turn. They live in the conversation, spread across many turns, each one individually unremarkable, the attack emerging only from the sequence. This is a deliberate adaptation: attackers learned that per-turn detectors catch the overt attempt, so they engineered jailbreaks where no single turn is overt. The attack is distributed across the conversation precisely so that any per-turn snapshot of it looks benign. This is the condition the case is really about, and it is why jailbreak prevention in production is, more than any other attack class examined so far, a session-level problem. The per-turn detector is necessary and insufficient; the session-level analysis of Chapter 13 is what closes the gap, and the case is its validation against the specific families that exploit the gap most effectively.
  part_2:
    title: 'The Crescendo Family: Gradual Escalation'
    body: |-
      The Crescendo family is the archetype of the multi-turn jailbreak, and the case works through it as the central example. A Crescendo attack begins with a request that is entirely acceptable -- a benign question in the general area the attacker is ultimately interested in. The model answers, and the attacker's next turn takes a small step further, still within bounds, building on the model's own previous answer. Each turn escalates slightly from the last, always staying close enough to the prior context that it does not read as a jump, and always building on what the model has already granted. Over a dozen or two dozen turns, the conversation walks from an innocuous starting point to a destination the model should have refused -- but it arrives there gradually, and at no single step did the attacker make a request that a per-turn detector, looking only at that step, would flag. The escalation is real but distributed, and distribution is exactly what defeats per-turn analysis.

      This is where the session-level analysis earns its centrality. The per-turn detector, examining each Crescendo turn in isolation, sees a series of acceptable requests and passes every one -- correctly, by its own terms, because no single turn is a jailbreak. The behavioural layer of Chapter 13, examining the session as a trajectory, sees what the per-turn view cannot: the steady escalation, the monotonic drift of the conversation toward a prohibited region, the shape of a Crescendo attack. It is watching the wrong thing to catch a Crescendo turn by turn and the right thing to catch it as a trajectory. The case shows the session-level analysis detecting the Crescendo escalation while the per-turn detector passes each individual turn -- the clearest possible demonstration that multi-turn jailbreaks are a session-level detection problem, and that the layer built to track sessions is the one that catches them. This is the same baseline-and-trajectory discipline the book has applied throughout, here catching an attack defined entirely by its trajectory.
  part_3:
    title: 'The Many-Shot Family: Normalising Through Context'
    body: |-
      The many-shot family attacks through a different mechanism but exploits the same per-turn blind spot. A many-shot jailbreak floods the conversation context with examples -- many turns, or one turn carrying many embedded exchanges -- that demonstrate the model complying with the kind of request the attacker ultimately wants granted. The examples establish a pattern, and the attack relies on the model continuing the pattern: having seen many instances of the target behaviour treated as normal within the conversation, the model is more likely to produce it when finally asked. The jailbreak is in the accumulated weight of the examples, not in any single one, and again no individual turn need contain an overt jailbreak -- the examples can each be mild, their effect emerging only from their number.

      Like the Crescendo, the many-shot attack is invisible to per-turn detection by construction and visible to session-level analysis by its pattern. The per-turn detector sees each example turn as an acceptable exchange; the behavioural layer sees the session accumulating a large set of examples pushing consistently toward a particular behaviour -- the characteristic shape of a many-shot attempt. The case treats the two families together because they make the same point through different mechanisms: the Crescendo distributes the attack across an escalating trajectory, the many-shot distributes it across an accumulating set of examples, and both are engineered so that per-turn detection, looking at any one turn, finds nothing to flag. What they share is that the attack exists only at the session level, and what catches them is the layer that analyses the session. The two families together are the case's evidence that multi-turn jailbreak detection is not a refinement of per-turn detection but a categorically different capability, supplied by the behavioural layer.
  part_4:
    title: Detecting and Responding to a Multi-Turn Escalation
    body: |-
      Responding to a multi-turn jailbreak differs fundamentally from responding to a single-turn one, and the difference is the whole point of the response playbook. When the per-turn detector catches an overt single-turn jailbreak, the response is local: block that turn, and the attack is stopped, because the attack was that turn. But when the session-level analysis detects a Crescendo or many-shot escalation, blocking the latest turn is not enough -- the latest turn may be innocuous in itself, and the attack lives in the session, so the response must act on the session. The playbook intervenes at the session level: the session is flagged as a jailbreak attempt in progress, its trajectory is halted, and depending on severity the session may be terminated, the entity's risk elevated, and future sessions from the entity subjected to tighter scrutiny. The intervention targets the campaign, which is the session, not the turn that happened to trip the threshold.

      The timing of the intervention is a distinctive feature of the multi-turn response. Because the session-level analysis watches the trajectory, it can detect the escalation before it reaches its destination -- the drift toward a prohibited region is visible partway along, so the session can be intervened while the attack is still in progress rather than only after it succeeds. This is a meaningful advantage over per-turn detection, which by its nature can only catch an attack in the turn that finally crosses a line, if any single turn does. The session-level view enables an earlier, trajectory-based intervention. The SIEM integration of Chapter 16 carries the session-level detection into security operations with the trajectory context that lets a responder see the escalation as one attack -- the sequence of turns, the direction of drift, the family it matches -- rather than as a puzzling flag on an innocuous-looking latest message. The case shows the full path from a gradual escalation being detected mid-trajectory to the session being intervened, which is what multi-turn jailbreak prevention requires.
  part_5:
    title: Lessons and Architecture Recommendations
    body: |-
      The jailbreak case validates the multi-turn analysis against the Crescendo and many-shot families and yields architecture recommendations for jailbreak prevention that centre on the session. The first recommendation is that session-level detection is a requirement, not an enhancement: a production jailbreak defence built only on per-turn detection has a categorical gap that competent attackers already exploit through gradual and many-shot attacks, so the behavioural layer's session analysis is load-bearing, not supplementary. The second is trajectory-based intervention: because the escalation is visible before it completes, the response should intervene on the trajectory mid-attack rather than waiting for a turn that crosses a line, which may never come in a well-engineered Crescendo. The third is session-level response: the intervention must act on the session and the entity, not the latest turn, because the attack lives in the session and blocking one turn leaves the campaign intact.

      The deeper lesson generalises the injection case's complementarity into something sharper. In the injection case, the per-request and behavioural layers were complementary against a threat that had both a per-request and a campaign form. In the jailbreak case, the most important form of the threat has no per-turn form at all -- the multi-turn jailbreak is engineered to be invisible turn by turn -- so the behavioural layer is not merely complementary but necessary, the only layer that can catch the attack. This is the case's contribution to the chapter's argument: as attacks adapt to per-request detection by distributing themselves across sessions, the behavioural layer moves from a useful addition to the indispensable core of the defence. It validates that the Chapter 13 multi-turn analysis catches the published jailbreak families that per-turn detection cannot, and it sets up the model-abuse case, where the threat is not just multi-turn but multi-entity -- distributed not only across a session but across a coordinated network -- and the behavioural layer's graph analysis becomes central in turn.
