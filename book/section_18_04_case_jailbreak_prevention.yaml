deliverables:
  deliverable_1:
    title: Jailbreak-Prevention Case Analysis
    filename: (case analysis -- incident, detection, response, lessons)
    description: |-
      The full incident-detection-response-lessons analysis of the jailbreak-prevention case: the single-turn and multi-turn halves, the Crescendo and many-shot families and why each evades per-turn detection, the session-level detection that catches the trajectory, the session-level and trajectory-timed response, and the lessons on the behavioural layer's necessity against multi-turn jailbreaks. Presented as the structured analysis in the prose and reference tables.
    implementation_notes: |-
      No runnable code: a case analysis in the chapter's deliverable form. It follows the 18.01 method, foregrounding the Chapter 13 multi-turn analysis as the layer that catches the Crescendo and many-shot families the per-turn detector passes.
    code: |
      # Section 18.04 deliverable: Jailbreak-Prevention Case Analysis.
      #
      #   INCIDENT   Composite jailbreak traffic: overt single-turn attempts plus
      #              multi-turn Crescendo and many-shot escalations engineered so no
      #              single turn is overt.
      #   DETECTION  Single-turn jailbreak -> per-turn detector on the turn (Ch15).
      #              Crescendo -> session analysis sees the monotonic escalation (Ch13).
      #              Many-shot -> session analysis sees the accumulating example pattern.
      #              The per-turn detector correctly passes each individual multi-turn
      #              turn; the attack exists only at the session level.
      #   RESPONSE   Session-level and trajectory-timed: flag the session, halt the
      #              trajectory MID-attack (before it completes), terminate/elevate
      #              entity risk, carry the trajectory context via the Ch16 integration.
      #   LESSONS    For multi-turn jailbreaks the behavioural layer is not
      #              complementary but NECESSARY -- the only layer that can catch them.
      print('Section 18.04: jailbreak-prevention case analysis -- see prose and tables.')
    note: Deliverable is a structured case analysis, not code.
  deliverable_2:
    title: Jailbreak-Prevention Response Playbook
    filename: (response playbook -- multi-turn jailbreak)
    description: |-
      The response playbook for a multi-turn jailbreak, following the 18.01 template but acting at the session level and mid-trajectory: the trigger (session-level escalation detection), the containment (halt the trajectory, terminate the session), the enrichment (the trajectory and family context), the escalation (elevate entity risk, scrutinise future sessions), the recovery, and the review. The playbook that meets a jailbreak living in the conversation at the level it lives.
    implementation_notes: |-
      No runnable code: a response playbook in the chapter's deliverable form. It extends the generic template with session-level action and mid-trajectory timing, depending on the Chapter 13 session analysis for the detection and the Chapter 16 integration for the trajectory context.
    code: |
      # Section 18.04 deliverable: Jailbreak-Prevention Response Playbook.
      #
      #   TRIGGER   Session-level analysis detects a Crescendo/many-shot escalation
      #             (trajectory drift or accumulating example pattern), mid-attack.
      #   CONTAIN   Halt the session's trajectory; terminate the session if severity
      #             warrants -- do NOT merely block the latest (innocuous) turn.
      #   ENRICH    Attach the trajectory context -- the turn sequence, the drift
      #             direction, the matched family -- via the Ch16 integration.
      #   ESCALATE  Elevate the entity's risk; subject the entity's future sessions to
      #             tighter scrutiny; notify security operations with the session view.
      #   RECOVER   Confirm the escalation is stopped; restore normal handling once the
      #             entity's risk subsides.
      #   REVIEW    Disposition into the Ch17 tuning loop; feed the trajectory shape
      #             forward to catch the family earlier next time.
      print('Section 18.04: jailbreak-prevention response playbook -- see prose.')
    note: Deliverable is a response playbook, not code.
common_mistakes:
  mistake_1:
    description: Building a production jailbreak defence on per-turn detection alone
    why_it_happens: |-
      The per-turn detector catches the overt single-turn jailbreaks convincingly, which looks like jailbreak coverage.
    consequence: |-
      The multi-turn jailbreaks that competent attackers actually use -- Crescendo, many-shot -- pass entirely, because they are engineered to have no overt single turn.
    correct_approach: |-
      Treat session-level detection as a requirement, not an enhancement, because the strongest production jailbreaks live in the trajectory and have no per-turn form for the per-turn detector to catch.
  mistake_2:
    description: Waiting for a multi-turn jailbreak to cross a per-turn line before acting
    why_it_happens: |-
      Per-turn detection conditions the responder to expect a specific offending turn to trigger on.
    consequence: |-
      A well-engineered Crescendo never crosses a per-turn line -- every turn stays acceptable -- so waiting for one means the attack completes before anything triggers.
    correct_approach: |-
      Intervene on the trajectory mid-attack, using the session-level analysis's early view of the escalation's drift, rather than waiting for a line-crossing turn that may never come.
  mistake_3:
    description: Responding to a multi-turn jailbreak by blocking only the latest turn
    why_it_happens: |-
      Blocking the offending message is the reflex from single-turn jailbreak response.
    consequence: |-
      The latest turn may be innocuous and the attack lives in the whole session, so blocking one turn leaves the escalation and the attacker's progress intact to continue.
    correct_approach: |-
      Act on the session and the entity -- halt the trajectory, terminate the session if needed, elevate entity risk -- because the attack lives at the session level, not in one turn.
  mistake_4:
    description: Presenting a session-level detection to responders as a flag on the latest turn
    why_it_happens: |-
      The detection fires at a point in time, so it is naturally attached to the most recent message.
    consequence: |-
      The responder sees a jailbreak flag on an innocuous-looking latest turn with no visible attack, cannot make sense of it, and may dismiss a real multi-turn escalation.
    correct_approach: |-
      Carry the trajectory context into the alert via the SIEM integration -- the turn sequence, the drift, the matched family -- so the responder sees the escalation as one coherent attack.
section_summary:
  compact: |-
    Section 18.04 takes the case pattern to jailbreaks, where the multi-turn dimension makes the behavioural layer more central than in any prior case. The case turns on a distinction: some jailbreaks live in a turn -- the overt single-turn attempts the Chapter 15 per-turn detector catches -- and the ones that matter most live in the conversation, spread across many turns each individually unremarkable, engineered so that no per-turn snapshot looks like an attack. Two published families exemplify this. The Crescendo escalates gradually, each turn a small step further than the last, building on the model's own prior answers, so that a conversation walks from an innocuous start to a prohibited destination without any single turn jumping far enough for the per-turn detector to flag. The many-shot floods the context with examples that normalise the target behaviour, the attack living in the accumulated weight of the examples rather than in any one. Both are invisible to per-turn detection by construction and visible to the Chapter 13 session-level analysis by their pattern -- the monotonic drift of a Crescendo, the accumulating examples of a many-shot -- so the behavioural layer here is not merely complementary, as in the injection case, but necessary, the only layer that can catch an attack with no per-turn form. The response is correspondingly session-level: because the escalation is visible before it completes, the session can be intervened mid-trajectory rather than waiting for a line-crossing turn that a well-engineered Crescendo never produces, and the intervention acts on the session and entity, not the latest innocuous turn, carrying the trajectory context into operations via the Chapter 16 integration. The lesson sharpens the chapter's argument: as attacks distribute themselves across sessions to evade per-request detection, the behavioural layer moves from a useful addition to the indispensable core of the defence.
  key_takeaways:
  - |-
    The strongest production jailbreaks live in the conversation, not the turn, engineered so no single turn is overt
  - |-
    The Crescendo escalates gradually and the many-shot normalises through accumulated examples -- both invisible per-turn by design
  - |-
    The Chapter 13 session-level analysis catches both by their trajectory pattern, where per-turn detection categorically cannot
  - |-
    For multi-turn jailbreaks the behavioural layer is not complementary but necessary -- the only layer that can catch them
  - |-
    The response acts on the session and entity mid-trajectory, not on the latest innocuous turn, before the escalation completes
  - |-
    As attacks distribute across sessions to evade per-request detection, the behavioural layer becomes the indispensable core
