section_summary:
  compact: >
    Section 5.4 provides the full technical treatment of OWASP LLM01, LLM02, and LLM03. The unifying
    theme across all three is trust boundary failure: LLM01 (the absence of a structural
    instruction/data boundary at the token level), LLM02 (the absence of sanitisation at the
    generation/execution boundary), and LLM03 (the absence of separation between training data and
    model behaviour). LLM01 is examined through eleven attack variants spanning direct injection
    (naive override, persona injection, completion hijacking, context window overflow, language
    switch evasion, multi-turn gradual injection) and indirect injection (RAG document, web
    browsing, tool output, email/calendar, multimodal image), with detection indicators and
    mitigation controls at each relevant attack surface layer. LLM02 is examined through five attack
    scenarios — XSS, command injection, SSRF, SQL injection via LLM, and pipeline propagation — with
    a reference sanitisation library covering all four downstream consumption contexts. LLM03 covers
    five poisoning variants (label flipping, backdoor trigger, preference poisoning, sleeper agent,
    bias injection at scale), explains why LLM03 is the most persistent risk in the OWASP Top 10,
    and presents a complete dataset audit pipeline implementing provenance hashing, label
    consistency analysis, n-gram concentration detection, and Unicode anomaly scanning.
  key_takeaways:
    style: ordered
    items:
      - >
        LLM01, LLM02, and LLM03 share a common root: trust boundary failures. The instruction/data
        boundary (LLM01), the generation/execution boundary (LLM02), and the training data/model
        behaviour boundary (LLM03) are all absent or weakly enforced in LLM systems. Detection must
        focus on boundary crossing events, not just payload patterns.
      - >
        Prompt injection cannot be patched like SQL injection. There is no parameterised prompt that
        architecturally separates instruction from data at the token level. Every mitigation is
        probabilistic, not structural. Defence-in-depth (input-side detection + instruction
        hierarchy + output-side monitoring) is the correct response, not a search for a single fix.
      - >
        Indirect injection is more dangerous than direct injection. It requires no direct API access
        — any content source the LLM reads (RAG documents, web pages, tool outputs, emails) is an
        injection vector. Retrieved content must be scanned for injection patterns before it enters
        the LLM's context.
      - >
        LLM02 converts injection capability into downstream system exploitation. An attacker who
        achieves LLM01 in a system with LLM02 vulnerabilities has effectively achieved XSS, command
        injection, SSRF, or SQL injection in the downstream system. LLM output must be treated as
        untrusted input to every downstream component.
      - >
        LLM03 is the most persistent risk: it survives deployment, survives patching, is hardest to
        detect with standard evaluations, and can produce effects from as little as 0.1% poisoning
        of training data. Pre-deployment dataset auditing and post-training behavioural analysis are
        both required; neither alone is sufficient.
      - >
        Backdoor attacks (LLM03 variant B) are particularly stealthy: the model passes all standard
        evaluations because the trigger pattern does not appear in any test set. Neural Cleanse and
        Activation Clustering are the primary post-training detection techniques; neither is
        perfect.
      - >
        Agentic deployments have the most complex trust boundary map of any LLM deployment pattern.
        Every new tool added to an agent creates a new indirect injection surface (tool output → LLM
        context) and a new insecure output handling surface (LLM tool call parameters → tool
        execution). Agency and injection risk scale together.
      - >
        Detection for LLM01-LLM03 requires controls at multiple layers simultaneously: Layer 2
        (retrieved content scanning), Layer 5/6 (input-side injection detection, rate limiting),
        Layer 7 (tool call parameter validation), Layer 8 (output sanitisation, exfiltration
        detection), and Layer 1/3 (dataset auditing, training pipeline monitoring). No single-layer
        detection programme covers all three.
