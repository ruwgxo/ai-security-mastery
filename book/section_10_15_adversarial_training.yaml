prose_content:
  - heading: 'The Min-Max Objective'
    id: part_1
    blocks:
      - type: prose
        text: >
          Section 10.4 introduced the robust optimisation objective of Madry, Makelov, Schmidt,
          Tsipras and Vladu (2018):
      - type: code
        lang: text
        text: |
          min_theta E_(x,y)~D [ max_{||delta|| <= epsilon} L(f_theta(x + delta), y) ]
      - type: prose
        text: >
          Adversarial training is the direct implementation. For each minibatch, solve the inner
          maximisation approximately with PGD to get the worst-case perturbed inputs, then take an
          ordinary gradient step on the loss at those inputs. The attacker moves first; the model
          learns from the attacker's best move.
      - type: prose
        text: >
          Two implementation details matter more than they look. First, the inner attack runs
          against the current weights in evaluation mode. In training mode, batch normalisation
          updates its running statistics on every PGD step, so the statistics end up describing
          adversarial batches rather than the data. adversarial_trainer.py switches to eval for the
          attack and back to train for the update. Second, the attack configuration for training and
          for evaluation must differ. Training uses PGDConfig.madry_training (k = 7, alpha = 2 *
          epsilon / 3, one restart) because the inner loop runs on every batch. Evaluation uses
          PGDConfig.evaluation_grade (k = 40, five restarts) because evaluation is where the claim
          is made.
      - type: prose
        text: >
          On CIFAR-10 at epsilon = 8/255 this recipe gives roughly 87% clean accuracy and 45% PGD
          robust accuracy, against about 95% clean and near-zero robust accuracy for standard
          training. That gap -- eight points of clean accuracy for forty points of robustness -- is
          the trade the rest of this section manages.
  - heading: 'Why Robustness Costs Accuracy: Robust and Non-Robust Features'
    id: part_2
    blocks:
      - type: prose
        text: >
          Tsipras et al. 2019 showed that the accuracy cost is not an artefact of training
          difficulty. It can be built into the data. The deliverables in this section use their
          construction: one feature that agrees with the label 90% of the time and is far from the
          boundary, plus fifty features that are each only weakly correlated with the label but
          together predict it almost perfectly.
      - type: prose
        text: >
          A standard model learns the fifty weak features, because they give near-perfect accuracy.
          Each weak feature is only slightly shifted by the label, so an L-infinity perturbation a
          little larger than that shift erases all fifty at once. In the adversarial_trainer.py demo
          the standard model scores 99.9% clean and 7.9% under PGD. The adversarially trained model
          learns that the weak features cannot be trusted, falls back to the robust feature, and
          scores 89.8% clean and 89.8% under PGD. Its clean accuracy is capped by the robust
          feature's 90% agreement rate. That cap is the accuracy-robustness trade-off in its
          simplest form.
      - type: prose
        text: >
          Ilyas et al. 2019 argued that real image datasets contain many such non-robust features:
          genuinely predictive patterns that humans do not perceive and that small perturbations can
          flip. On that view adversarial examples are not bugs in the model -- they are the model
          using every feature it was given. Adversarial training removes the non-robust features
          from what the model may use, and with them some accuracy.
  - heading: 'Single-Step Training: FGSM, Free and Fast'
    id: part_3
    blocks:
      - type: prose
        text: >
          PGD training costs about k + 1 forward-backward passes per batch, so k = 7 makes training
          roughly eight times slower. The obvious shortcut is the single-step attack. Goodfellow,
          Shlens and Szegedy (2015) trained on FGSM examples mixed 50/50 with clean examples. It
          improved robustness to FGSM, but Kurakin et al. 2017 and Tramer et al. 2018 found that
          single-step training from the clean input mostly teaches the model to make its own
          gradient misleading near the data -- gradient masking. Such models resist FGSM, fall to
          PGD, and are often more vulnerable to transfer attacks from an undefended surrogate than
          to white-box attacks on themselves.
      - type: prose
        text: >
          Two methods made cheap adversarial training work. Free adversarial training (Shafahi et
          al. 2019) replays each minibatch several times and reuses the single backward pass of each
          replay both to update the weights and to update the perturbation, reaching PGD-like
          robustness at close to standard training cost. Fast adversarial training (Wong, Rice and
          Kolter 2020) showed that plain FGSM works if the step starts from a random point in the
          epsilon ball and uses a step of about 1.25 * epsilon.
      - type: prose
        text: >
          Fast training has a characteristic failure: catastrophic overfitting. Within a single
          epoch, robust accuracy against PGD can drop to near zero while accuracy against FGSM stays
          high. The model has learned to defeat the single-step linear approximation rather than to
          be robust. The defence is cheap: evaluate PGD on a small held-out batch every epoch and
          roll back on a sharp drop. fgsm_adversarial_trainer.py implements that guard. Random
          initialisation plus the guard is what makes single-step training usable; without the
          guard, the training metrics will not tell you it has failed.
  - heading: 'TRADES: Separating Accuracy from Robustness'
    id: part_4
    blocks:
      - type: prose
        text: >
          Madry training replaces the clean loss with the adversarial loss, so accuracy and
          robustness are traded implicitly. TRADES (Zhang et al. 2019) makes the trade explicit:
      - type: code
        lang: text
        text: |
          L = CE(f(x), y) + beta * max_{||x' - x|| <= epsilon} KL(f(x) || f(x'))
      - type: prose
        text: >
          The first term is ordinary classification accuracy. The second term penalises how much the
          prediction can change inside the epsilon ball -- the smoothness of the model around each
          input. The inner maximisation does not use the label at all: it pushes the prediction away
          from the model's own clean prediction. beta sets the balance. beta = 0 is standard
          training; larger beta buys robustness with clean accuracy.
      - type: prose
        text: >
          trades_trainer.py sweeps beta on the synthetic task. beta = 0 reproduces the standard
          model (100% clean, about 10% robust), beta = 0.1 buys a little robustness, and beta = 1
          already reaches the robust-feature solution. On CIFAR-10 the paper used beta = 6, and
          TRADES won the NeurIPS 2018 Adversarial Vision Challenge. The production lesson is that
          beta is a business decision -- how much clean accuracy the deployment owner will give up
          -- and should be set and signed off as one, not copied from a paper.
  - heading: 'Robust Overfitting and Model Selection'
    id: part_5
    blocks:
      - type: prose
        text: >
          Rice, Wong and Kolter (2020) found that adversarially trained networks overfit in a way
          standard networks largely do not: robust test accuracy peaks partway through training and
          then declines, often by several points, while robust training accuracy keeps rising.
          Training to the final epoch and shipping the result is therefore a mistake. Simple early
          stopping on held-out robust accuracy recovered most of the gains attributed to later
          algorithmic improvements.
      - type: prose
        text: >
          adversarial_trainer.py evaluates robust accuracy on a validation set every epoch with the
          evaluation-grade PGD config, keeps the best checkpoint, and stops after a patience window.
          The cost is one evaluation-grade PGD pass over the validation set per epoch -- small next
          to the training cost, and the only way to know which checkpoint is the robust one.
  - heading: 'Evaluating a Hardened Model Honestly'
    id: part_6
    blocks:
      - type: prose
        text: >
          Adversarial training changes the model's gradients, so every evaluation trap from Sections
          10.4 and 10.5 applies with extra force. adversarial_training_evaluator.py runs five checks
          on the same test set.
      - type: prose
        text: >
          Clean accuracy measures the cost. FGSM and evaluation-grade PGD measure robustness; the
          FGSM to PGD gap is the Section 10.4 gradient-masking diagnostic. Transfer accuracy uses
          PGD examples crafted on a separately trained standard model: if transfer attacks succeed
          more often than white-box PGD on the hardened model, its gradients are masked and the
          white-box number cannot be trusted. The C&W column measures the median L2 norm needed to
          flip a correctly classified input.
      - type: prose
        text: >
          The C&W column carries the section's most important warning. On the synthetic task the
          L-infinity-hardened model needs a smaller L2 perturbation to flip than the standard model
          does. It relies on one robust feature, and an L2 perturbation concentrated on that one
          feature is cheap. Robustness is norm-specific: training against L-infinity at one epsilon
          buys robustness against L-infinity at that epsilon and does not certify anything else. The
          evaluation must cover every norm the threat model names. For publication-grade results,
          AutoAttack (Croce and Hein 2020) -- an ensemble of parameter-free attacks -- and the
          RobustBench leaderboard are the current standard; they exist because many published
          defences were later found to be over-reported by weaker evaluations.
  - heading: 'Adversarial Training for Text and LLM Classifiers'
    id: part_7
    blocks:
      - type: prose
        text: >
          For image models the inner maximisation is a continuous optimisation. For text it is the
          discrete search of Section 10.9, which is far more expensive: running TextFooler or
          HotFlip inside every training batch multiplies cost by the number of queries each attack
          needs. Two practical patterns exist. Augmentation generates adversarial text offline with
          the Section 10.9 attacks and adds it to the training set; it is cheap but only covers the
          attacks used. Embedding space training (FreeLB, Zhu et al. 2020) applies PGD to the
          continuous token embeddings instead of the tokens; it improves robustness to small
          perturbations but the embedding-space perturbation does not correspond to any real text an
          attacker can type.
      - type: prose
        text: >
          For LLM safety the same min-max idea has been applied against optimised jailbreak
          suffixes: HarmBench (Mazeika et al. 2024) trained a model against GCG-style attacks
          (Section 7.9) during fine-tuning and reported large gains against that attack. The lesson
          from images carries over: robustness transfers poorly to attack families the training did
          not include. For LLM classifiers adversarial training is a hardening step, not a
          guarantee, and Track 7 together with the Chapter 7 jailbreak tracks stay in front of it.
  - heading: 'Positioning: The Two-Surface Defence'
    id: part_8
    blocks:
      - type: prose
        text: >
          Adversarial training is the upstream control. It reduces the fraction of inputs for which
          an adversarial example exists within the defended budget. Track 7 is the runtime control.
          It catches adversarial examples that survive into production, including those outside the
          defended norm or epsilon. Chapter 8 used the same pattern for poisoning and Chapter 9 for
          extraction: differential privacy training upstream, monitoring and output controls at
          runtime.
      - type: prose
        text: >
          The two layers also make each other better. An adversarially trained model has smoother
          decision boundaries, so Track 7's consistency checker sees fewer natural inputs near the
          boundary and its false positive rate falls. The checklist in this section ends with one
          operational step that is easy to miss: adversarial training moves the decision boundary,
          so every threshold set on the old model -- in the model's own decision layer and in Track
          7 -- must be recalibrated on the hardened one.
