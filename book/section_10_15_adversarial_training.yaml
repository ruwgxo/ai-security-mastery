      - 'Explain why single-step (FGSM) adversarial training is cheap, why zero-init FGSM training masks gradients, and what catastrophic overfitting looks like'
      - 'Describe free adversarial training (Shafahi et al. 2019) and fast adversarial training (Wong et al. 2020) and their cost relative to PGD training'
      - 'State the TRADES objective and explain the role of beta'
      - 'Explain robust overfitting (Rice et al. 2020) and why the checkpoint must be chosen on held-out robust accuracy'
      - 'Explain the non-robust feature view (Tsipras et al. 2019; Ilyas et al. 2019) of why robustness costs clean accuracy'
      - 'Explain why robustness is norm-specific and why adversarial training against text attacks is harder than against image attacks'
    skills:
      - 'Implement PGD adversarial training with eval-mode attack generation and robust-validation checkpointing'
      - 'Implement fast FGSM adversarial training with random initialisation and a per-epoch PGD guard'
      - 'Implement the TRADES loss and inner KL maximisation and sweep beta'
      - 'Evaluate a hardened model against FGSM, PGD, transfer and C&W and apply the gradient-masking checks'
      - 'Run a pre-deployment checklist that blocks a hardened model with an incomplete evaluation'
    security_mindset:
      - 'A robustness claim is a claim about the evaluation, not the training: train with k=7, evaluate with k=40 and restarts'
      - 'Expect the model to find the cheapest way to satisfy the training objective -- including breaking the attack instead of becoming robust'
      - 'Document the clean-accuracy cost and the norm and epsilon defended; an undocumented trade-off becomes an incident'
      - 'Treat adversarial training and Track 7 as two surfaces of one defence; neither is sufficient alone'
