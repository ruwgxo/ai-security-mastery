deliverables:
  - heading: 'PGD Adversarial Trainer'
    id: deliverable_1
    filename: adversarial_trainer.py
    lang: python
    description: >
      Madry min-max training with eval-mode PGD generation, optional clean-loss mixing, per-epoch
      robust validation and best-checkpoint selection; includes the robust/non-robust synthetic task
      and a standard-training baseline
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: torch. Imports pgd_linf
      from pgd_attack.py and PGDConfig from pgd_training_data_generator.py (Section 10.4). Other
      deliverables in this section import the dataset, ToyMLP and accuracy helpers from this file.
    code: |
      # adversarial_trainer.py
      # Section 10.15: Adversarial Training -- PGD adversarial training (Madry et al. 2018)
      # 20260608 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention

      import copy
      from dataclasses import dataclass, field
      from typing import List, Tuple

      import torch
      import torch.nn as nn
      from torch import Tensor

      from pgd_attack import pgd_linf
      from pgd_training_data_generator import PGDConfig


      # ---------------------------------------------------------------------------
      # Synthetic task with one robust feature and many non-robust features
      # ---------------------------------------------------------------------------

      def make_robust_nonrobust_dataset(n: int, n_weak: int = 50, p_robust: float = 0.9,
                                        eta: float = 0.064, noise: float = 0.15,
                                        seed: int = 0) -> Tuple[Tensor, Tensor]:
          '''
          Binary task in [0, 1] after Tsipras et al. 2019.
          Feature 0 (robust): 0.5 +/- 0.25, agrees with the label with probability p_robust.
          Features 1..n_weak (non-robust): 0.5 +/- eta plus Gaussian noise. Each is weak,
          but together they predict the label almost perfectly -- and an L-inf perturbation
          of a little more than eta erases all of them at once.
          '''
          g = torch.Generator().manual_seed(seed)
          y = torch.randint(0, 2, (n,), generator=g)
          sign = (2 * y - 1).float().unsqueeze(1)
          agree = (torch.rand(n, 1, generator=g) < p_robust).float() * 2 - 1
          robust = 0.5 + 0.25 * sign * agree
          weak = 0.5 + eta * sign + noise * torch.randn(n, n_weak, generator=g)
          return torch.cat([robust, weak], dim=1).clamp(0.0, 1.0), y


      class ToyMLP(nn.Module):
          def __init__(self, n_features: int = 51, n_classes: int = 2, hidden: int = 64):
              super().__init__()
              self.net = nn.Sequential(
                  nn.Linear(n_features, hidden), nn.ReLU(),
                  nn.Linear(hidden, n_classes),
              )

          def forward(self, x: Tensor) -> Tensor:
              return self.net(x.view(x.size(0), -1))


      # ---------------------------------------------------------------------------
      # Training
      # ---------------------------------------------------------------------------

      @dataclass
      class AdvTrainConfig:
          train_pgd: PGDConfig             # inner maximisation: PGDConfig.madry_training(eps)
          eval_pgd: PGDConfig              # model selection: PGDConfig.evaluation_grade(eps)
          epochs: int = 30
          lr: float = 1e-2
          batch_size: int = 128
          clean_weight: float = 0.0        # 0.0 = pure Madry; 0.5 = Goodfellow-style 50/50 mix
          patience: int = 8                # epochs without robust-accuracy improvement before stopping


      @dataclass
      class EpochLog:
          epoch: int
          train_loss: float
          val_clean_accuracy: float
          val_robust_accuracy: float


      @dataclass
      class TrainingResult:
          model: nn.Module
          best_epoch: int
          logs: List[EpochLog] = field(default_factory=list)


      def clean_accuracy(model: nn.Module, x: Tensor, y: Tensor) -> float:
          model.eval()
          with torch.no_grad():
              return (model(x).argmax(1) == y).float().mean().item()


      def robust_accuracy(model: nn.Module, x: Tensor, y: Tensor, cfg: PGDConfig) -> float:
          model.eval()
          x_adv = pgd_linf(model, x, y, epsilon=cfg.epsilon, alpha=cfg.alpha, n_steps=cfg.n_steps,
                           n_restarts=cfg.n_restarts, clip_min=cfg.clip_min, clip_max=cfg.clip_max)
          return clean_accuracy(model, x_adv, y)


      def train_epoch(model: nn.Module, opt: torch.optim.Optimizer, x: Tensor, y: Tensor,
                      cfg: AdvTrainConfig) -> float:
          loss_fn = nn.CrossEntropyLoss()
          perm = torch.randperm(x.size(0))
          total, batches = 0.0, 0
          for i in range(0, x.size(0), cfg.batch_size):
              idx = perm[i:i + cfg.batch_size]
              xb, yb = x[idx], y[idx]

              # Inner maximisation. Attack the CURRENT weights in eval mode so batch-norm
              # statistics are not updated by adversarial batches mid-attack.
              model.eval()
              x_adv = pgd_linf(model, xb, yb, epsilon=cfg.train_pgd.epsilon, alpha=cfg.train_pgd.alpha,
                               n_steps=cfg.train_pgd.n_steps, n_restarts=cfg.train_pgd.n_restarts,
                               clip_min=cfg.train_pgd.clip_min, clip_max=cfg.train_pgd.clip_max)

              # Outer minimisation.
              model.train()
              opt.zero_grad()
              loss = (1 - cfg.clean_weight) * loss_fn(model(x_adv), yb)
              if cfg.clean_weight > 0:
                  loss = loss + cfg.clean_weight * loss_fn(model(xb), yb)
              loss.backward()
              opt.step()
              total += loss.item()
              batches += 1
          return total / batches


      def adversarial_train(model: nn.Module, x_train: Tensor, y_train: Tensor,
                            x_val: Tensor, y_val: Tensor, cfg: AdvTrainConfig) -> TrainingResult:
          '''
          Madry min-max training with model selection on held-out ROBUST accuracy.
          Robust overfitting (Rice et al. 2020) means the last epoch is often not the
          most robust one: keep the best checkpoint, not the final weights.
          '''
          opt = torch.optim.Adam(model.parameters(), lr=cfg.lr)
          best_state, best_robust, best_epoch = copy.deepcopy(model.state_dict()), -1.0, 0
          logs: List[EpochLog] = []
          for epoch in range(1, cfg.epochs + 1):
              loss = train_epoch(model, opt, x_train, y_train, cfg)
              log = EpochLog(epoch, loss, clean_accuracy(model, x_val, y_val),
                             robust_accuracy(model, x_val, y_val, cfg.eval_pgd))
              logs.append(log)
              if log.val_robust_accuracy > best_robust:
                  best_robust, best_epoch = log.val_robust_accuracy, epoch
                  best_state = copy.deepcopy(model.state_dict())
              elif epoch - best_epoch >= cfg.patience:
                  break
          model.load_state_dict(best_state)
          model.eval()
          return TrainingResult(model, best_epoch, logs)


      def standard_train(model: nn.Module, x: Tensor, y: Tensor, epochs: int = 30,
                         lr: float = 1e-2, batch_size: int = 128) -> nn.Module:
          opt = torch.optim.Adam(model.parameters(), lr=lr)
          loss_fn = nn.CrossEntropyLoss()
          model.train()
          for _ in range(epochs):
              perm = torch.randperm(x.size(0))
              for i in range(0, x.size(0), batch_size):
                  idx = perm[i:i + batch_size]
                  opt.zero_grad()
                  loss_fn(model(x[idx]), y[idx]).backward()
                  opt.step()
          model.eval()
          return model


      def demo() -> None:
          torch.manual_seed(0)
          eps = 0.1
          x_train, y_train = make_robust_nonrobust_dataset(4000, seed=0)
          x_val, y_val = make_robust_nonrobust_dataset(500, seed=1)
          x_test, y_test = make_robust_nonrobust_dataset(1000, seed=2)
          eval_cfg = PGDConfig.evaluation_grade(eps)

          standard = standard_train(ToyMLP(), x_train, y_train)
          cfg = AdvTrainConfig(train_pgd=PGDConfig.madry_training(eps), eval_pgd=eval_cfg)
          result = adversarial_train(ToyMLP(), x_train, y_train, x_val, y_val, cfg)

          print(f'PGD adversarial training demo -- L-inf eps={eps}, robust feature agrees 90% of the time')
          print(f'{"model":<22}{"clean acc":<12}{"PGD-40x5 acc":<14}')
          for name, model in (('standard', standard), (f'Madry (epoch {result.best_epoch})', result.model)):
              print(f'{name:<22}{clean_accuracy(model, x_test, y_test):<12.3f}'
                    f'{robust_accuracy(model, x_test, y_test, eval_cfg):<14.3f}')
          print('\nThe standard model reads the non-robust features and is near-perfect until attacked.')
          print('The adversarially trained model gives up that accuracy for the robust feature alone.')


      if __name__ == '__main__':
          demo()
  - heading: 'Fast FGSM Adversarial Trainer'
    id: deliverable_2
    filename: fgsm_adversarial_trainer.py
    lang: python
    description: >
      Single-step adversarial training with random initialisation (Wong et al. 2020), a per-epoch
      PGD guard that rolls back on catastrophic overfitting, and an inner-pass count for cost
      comparison
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: torch. Set
      random_init=False to reproduce zero-init FGSM training for comparison. The guard uses a
      10-step PGD on the validation set: cheap, and enough to see a collapse.
    code: |
      # fgsm_adversarial_trainer.py
      # Section 10.15: Adversarial Training -- fast FGSM training with a catastrophic-overfitting guard
      # 20260608 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention

      import copy
      import time
      from dataclasses import dataclass, field
      from typing import List

      import torch
      import torch.nn as nn
      from torch import Tensor

      from adversarial_trainer import (
          ToyMLP, clean_accuracy, make_robust_nonrobust_dataset, robust_accuracy,
      )
      from pgd_training_data_generator import PGDConfig


      @dataclass
      class FastATConfig:
          epsilon: float
          alpha_ratio: float = 1.25        # Wong et al. 2020: step of 1.25 * epsilon from a random start
          random_init: bool = True         # False reproduces zero-init FGSM training (Goodfellow et al. 2015)
          epochs: int = 30
          lr: float = 1e-2
          batch_size: int = 128
          collapse_drop: float = 0.20      # PGD-accuracy drop that signals catastrophic overfitting
          clip_min: float = 0.0
          clip_max: float = 1.0


      @dataclass
      class FastATResult:
          model: nn.Module
          gradient_passes: int             # forward-backward passes spent on the inner maximisation
          seconds: float
          collapsed_at_epoch: int = 0      # 0 means no catastrophic overfitting detected
          pgd_history: List[float] = field(default_factory=list)


      def fgsm_example(model: nn.Module, x: Tensor, y: Tensor, cfg: FastATConfig) -> Tensor:
          if cfg.random_init:
              delta = torch.empty_like(x).uniform_(-cfg.epsilon, cfg.epsilon)
          else:
              delta = torch.zeros_like(x)
          delta = (torch.clamp(x + delta, cfg.clip_min, cfg.clip_max) - x).requires_grad_(True)
          loss = nn.functional.cross_entropy(model(x + delta), y)
          grad, = torch.autograd.grad(loss, delta)
          with torch.no_grad():
              delta = delta + cfg.alpha_ratio * cfg.epsilon * grad.sign()
              delta = torch.clamp(delta, -cfg.epsilon, cfg.epsilon)
              return torch.clamp(x + delta, cfg.clip_min, cfg.clip_max)


      def fast_adversarial_train(model: nn.Module, x: Tensor, y: Tensor, x_val: Tensor, y_val: Tensor,
                                 cfg: FastATConfig) -> FastATResult:
          '''
          One gradient step per example instead of PGD's seven. Cheap, but it can
          collapse: robust accuracy against PGD falls to near zero within an epoch while
          accuracy against FGSM stays high, because the model learns to make the
          single-step linear approximation useless rather than becoming robust.
          Guard: evaluate PGD on a held-out batch every epoch and roll back on a sharp drop.
          '''
          opt = torch.optim.Adam(model.parameters(), lr=cfg.lr)
          loss_fn = nn.CrossEntropyLoss()
          guard = PGDConfig(epsilon=cfg.epsilon, alpha=cfg.epsilon / 4, n_steps=10,
                            clip_min=cfg.clip_min, clip_max=cfg.clip_max)
          best_state, best_pgd = copy.deepcopy(model.state_dict()), -1.0
          result = FastATResult(model, 0, 0.0)
          start = time.perf_counter()
          for epoch in range(1, cfg.epochs + 1):
              perm = torch.randperm(x.size(0))
              for i in range(0, x.size(0), cfg.batch_size):
                  idx = perm[i:i + cfg.batch_size]
                  model.eval()
                  x_adv = fgsm_example(model, x[idx], y[idx], cfg)
                  result.gradient_passes += 1
                  model.train()
                  opt.zero_grad()
                  loss_fn(model(x_adv), y[idx]).backward()
                  opt.step()
              pgd_acc = robust_accuracy(model, x_val, y_val, guard)
              result.pgd_history.append(pgd_acc)
              if pgd_acc > best_pgd:
                  best_pgd, best_state = pgd_acc, copy.deepcopy(model.state_dict())
              elif best_pgd - pgd_acc > cfg.collapse_drop:
                  result.collapsed_at_epoch = epoch
                  break
          result.seconds = time.perf_counter() - start
          model.load_state_dict(best_state)
          model.eval()
          return result


      def demo() -> None:
          torch.manual_seed(0)
          eps = 0.1
          x_train, y_train = make_robust_nonrobust_dataset(4000, seed=0)
          x_val, y_val = make_robust_nonrobust_dataset(500, seed=1)
          x_test, y_test = make_robust_nonrobust_dataset(1000, seed=2)
          eval_cfg = PGDConfig.evaluation_grade(eps)

          print(f'Fast FGSM adversarial training -- L-inf eps={eps}')
          print(f'{"variant":<29}{"clean":<8}{"PGD-40x5":<10}{"inner passes":<14}{"seconds":<9}{"collapse":<9}')
          for name, random_init in (('FGSM + random init (Wong)', True), ('FGSM zero init (Goodfellow)', False)):
              cfg = FastATConfig(epsilon=eps, random_init=random_init)
              res = fast_adversarial_train(ToyMLP(), x_train, y_train, x_val, y_val, cfg)
              print(f'{name:<29}{clean_accuracy(res.model, x_test, y_test):<8.3f}'
                    f'{robust_accuracy(res.model, x_test, y_test, eval_cfg):<10.3f}'
                    f'{res.gradient_passes:<14}{res.seconds:<9.1f}{res.collapsed_at_epoch or "-":<9}')
          print('\nPGD-7 training spends 7 inner passes per batch; FGSM training spends 1.')


      if __name__ == '__main__':
          demo()
  - heading: 'TRADES Trainer'
    id: deliverable_3
    filename: trades_trainer.py
    lang: python
    description: >
      TRADES objective with label-free KL inner maximisation and a beta sweep showing the
      clean-robust trade-off
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: torch. The inner attack
      starts from x plus small Gaussian noise because the KL gradient is exactly zero at x' = x.
    code: |
      # trades_trainer.py
      # Section 10.15: Adversarial Training -- TRADES (Zhang et al. 2019)
      # 20260608 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention

      from dataclasses import dataclass

      import torch
      import torch.nn as nn
      import torch.nn.functional as F
      from torch import Tensor

      from adversarial_trainer import (
          ToyMLP, clean_accuracy, make_robust_nonrobust_dataset, robust_accuracy,
      )
      from pgd_training_data_generator import PGDConfig


      @dataclass
      class TradesConfig:
          epsilon: float
          beta: float = 6.0                # weight on the robustness term; 6.0 is the paper's CIFAR-10 setting
          step_size: float = 0.0           # 0.0 -> epsilon / 4
          n_steps: int = 10
          epochs: int = 30
          lr: float = 1e-2
          batch_size: int = 128
          clip_min: float = 0.0
          clip_max: float = 1.0


      def trades_adversary(model: nn.Module, x: Tensor, cfg: TradesConfig) -> Tensor:
          '''
          Inner maximisation of TRADES: find x' in the epsilon ball that maximises
          KL(f(x) || f(x')). Note there is no label here -- the adversary pushes the
          prediction AWAY FROM THE MODEL'S OWN clean prediction, not away from y.
          '''
          step = cfg.step_size or cfg.epsilon / 4
          with torch.no_grad():
              p_clean = F.softmax(model(x), dim=1)
          x_adv = (x + 0.001 * torch.randn_like(x)).clamp(cfg.clip_min, cfg.clip_max)
          for _ in range(cfg.n_steps):
              x_adv = x_adv.detach().requires_grad_(True)
              kl = F.kl_div(F.log_softmax(model(x_adv), dim=1), p_clean, reduction='sum')
              grad, = torch.autograd.grad(kl, x_adv)
              with torch.no_grad():
                  x_adv = x_adv + step * grad.sign()
                  x_adv = torch.min(torch.max(x_adv, x - cfg.epsilon), x + cfg.epsilon)
                  x_adv = x_adv.clamp(cfg.clip_min, cfg.clip_max)
          return x_adv.detach()


      def trades_loss(model: nn.Module, x: Tensor, x_adv: Tensor, y: Tensor, beta: float) -> Tensor:
          '''CE(f(x), y) + beta * KL(f(x) || f(x_adv)): accuracy term plus boundary-smoothness term.'''
          logits_clean = model(x)
          natural = F.cross_entropy(logits_clean, y)
          robust = F.kl_div(F.log_softmax(model(x_adv), dim=1), F.softmax(logits_clean, dim=1),
                            reduction='batchmean')
          return natural + beta * robust


      def trades_train(model: nn.Module, x: Tensor, y: Tensor, cfg: TradesConfig) -> nn.Module:
          opt = torch.optim.Adam(model.parameters(), lr=cfg.lr)
          for _ in range(cfg.epochs):
              perm = torch.randperm(x.size(0))
              for i in range(0, x.size(0), cfg.batch_size):
                  idx = perm[i:i + cfg.batch_size]
                  model.eval()
                  x_adv = trades_adversary(model, x[idx], cfg)
                  model.train()
                  opt.zero_grad()
                  trades_loss(model, x[idx], x_adv, y[idx], cfg.beta).backward()
                  opt.step()
          model.eval()
          return model


      def demo() -> None:
          eps = 0.1
          x_train, y_train = make_robust_nonrobust_dataset(4000, seed=0)
          x_test, y_test = make_robust_nonrobust_dataset(1000, seed=2)
          eval_cfg = PGDConfig.evaluation_grade(eps)

          print(f'TRADES beta sweep -- L-inf eps={eps}')
          print(f'{"beta":<7}{"clean":<9}{"PGD-40x5":<10}')
          for beta in (0.0, 0.1, 1.0, 6.0):
              torch.manual_seed(0)
              model = trades_train(ToyMLP(), x_train, y_train, TradesConfig(epsilon=eps, beta=beta, epochs=15))
              print(f'{beta:<7}{clean_accuracy(model, x_test, y_test):<9.3f}'
                    f'{robust_accuracy(model, x_test, y_test, eval_cfg):<10.3f}')
          print('\nbeta=0 is standard training. Raising beta trades clean accuracy for robustness;')
          print('beta is the dial the deployment owner sets, not a constant to copy from a paper.')


      if __name__ == '__main__':
          demo()
  - heading: 'Adversarial Training Evaluator'
    id: deliverable_4
    filename: adversarial_training_evaluator.py
    lang: python
    description: >
      Hardening report for a standard and a hardened model: clean, FGSM, evaluation-grade PGD,
      surrogate transfer, C&W median L2, and the FGSM-PGD masking gap
    notes: >
      Python 3.12, single quotes throughout per book convention. Requires: torch. Imports fgsm
      (Section 10.3), pgd_linf (Section 10.4), cw_l2 (Section 10.5) and the trainers from this
      section. The surrogate is trained independently of the victim, as an attacker's own model
      would be.
    code: |
      # adversarial_training_evaluator.py
      # Section 10.15: Adversarial Training -- evaluate a hardened model against every Chapter 10 attack
      # 20260608 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention

      from dataclasses import dataclass

      import torch
      import torch.nn as nn
      from torch import Tensor

      from adversarial_trainer import (
          AdvTrainConfig, ToyMLP, adversarial_train, clean_accuracy,
          make_robust_nonrobust_dataset, standard_train,
      )
      from cw_attack import cw_l2
      from fgsm_attack import fgsm
      from pgd_attack import pgd_linf
      from pgd_training_data_generator import PGDConfig


      @dataclass
      class HardeningReport:
          name: str
          clean: float
          fgsm: float
          pgd: float                       # PGD-40, 5 restarts: the headline number
          transfer: float                  # PGD examples crafted on a separate standard surrogate
          cw_median_l2: float              # median L2 norm C&W needs to flip a correct prediction (higher = harder)
          masking_gap: float               # fgsm - pgd accuracy; large gap means obfuscated gradients


      def evaluate(name: str, model: nn.Module, surrogate: nn.Module, x: Tensor, y: Tensor,
                   epsilon: float) -> HardeningReport:
          model.eval()
          cfg = PGDConfig.evaluation_grade(epsilon)
          x_fgsm = fgsm(model, x, y, epsilon=epsilon)
          x_pgd = pgd_linf(model, x, y, epsilon=cfg.epsilon, alpha=cfg.alpha,
                           n_steps=cfg.n_steps, n_restarts=cfg.n_restarts)
          x_transfer = pgd_linf(surrogate, x, y, epsilon=cfg.epsilon, alpha=cfg.alpha,
                                n_steps=cfg.n_steps, n_restarts=cfg.n_restarts)
          x_cw = cw_l2(model, x, y, n_binary_search=5, n_steps=100)
          with torch.no_grad():
              # Only inputs the model got right to begin with: a misclassified input needs no perturbation.
              flipped = (model(x).argmax(1) == y) & (model(x_cw).argmax(1) != y)
              norms = (x_cw - x).view(x.size(0), -1).norm(dim=1)
              cw_l2_median = norms[flipped].median().item() if flipped.any() else float('inf')
          fgsm_acc, pgd_acc = clean_accuracy(model, x_fgsm, y), clean_accuracy(model, x_pgd, y)
          return HardeningReport(
              name=name,
              clean=clean_accuracy(model, x, y),
              fgsm=fgsm_acc,
              pgd=pgd_acc,
              transfer=clean_accuracy(model, x_transfer, y),
              cw_median_l2=cw_l2_median,
              masking_gap=fgsm_acc - pgd_acc,
          )


      def print_reports(*reports: HardeningReport) -> None:
          print(f'{"model":<12}{"clean":<8}{"FGSM":<8}{"PGD":<8}{"transfer":<10}{"C&W med L2":<12}{"FGSM-PGD gap":<12}')
          for r in reports:
              flag = '  <- check for gradient masking' if r.masking_gap > 0.15 else ''
              print(f'{r.name:<12}{r.clean:<8.3f}{r.fgsm:<8.3f}{r.pgd:<8.3f}{r.transfer:<10.3f}'
                    f'{r.cw_median_l2:<12.3f}{r.masking_gap:<12.3f}{flag}')


      def demo() -> None:
          torch.manual_seed(0)
          eps = 0.1
          x_train, y_train = make_robust_nonrobust_dataset(4000, seed=0)
          x_val, y_val = make_robust_nonrobust_dataset(500, seed=1)
          x_test, y_test = make_robust_nonrobust_dataset(300, seed=2)

          surrogate = standard_train(ToyMLP(), x_train, y_train)        # attacker's own model
          standard = standard_train(ToyMLP(), x_train, y_train)         # victim, undefended
          cfg = AdvTrainConfig(train_pgd=PGDConfig.madry_training(eps), eval_pgd=PGDConfig.evaluation_grade(eps))
          hardened = adversarial_train(ToyMLP(), x_train, y_train, x_val, y_val, cfg).model

          print(f'Hardening report -- L-inf eps={eps}, {x_test.size(0)} test inputs')
          print_reports(
              evaluate('standard', standard, surrogate, x_test, y_test, eps),
              evaluate('madry', hardened, surrogate, x_test, y_test, eps),
          )
          print('\nPGD is the headline. Transfer must not beat PGD (if it does, white-box gradients are')
          print('masked). C&W measures a different norm: L-inf training buys L-inf robustness, and a')
          print('model that leans on one robust feature can be cheaper to flip in L2, not dearer.')


      if __name__ == '__main__':
          demo()
  - heading: 'Adversarial Training Deployment Checklist'
    id: deliverable_5
    filename: adversarial_training_deployment_checklist.py
    lang: python
    description: >
      6-item pre-deployment checklist for adversarially trained classifiers; every item is checked
      against the evidence produced by the trainer and the evaluator
    notes: >
      Python 3.12, single quotes throughout per book convention. No external dependencies. The demo
      fails item 6 on purpose: the threat model names L2, which the evaluator has not covered with a
      fixed-budget L2 attack.
    code: |
      # adversarial_training_deployment_checklist.py
      # Section 10.15: Adversarial Training -- 6-item pre-deployment checklist
      # 20260608 | AI Security Mastery by Raghav Dinesh
      # Single quotes throughout per book convention

      from dataclasses import dataclass, field
      from typing import Callable, List, Set


      @dataclass
      class HardeningEvidence:
          '''What the training run and adversarial_training_evaluator.py produced.'''
          eval_pgd_steps: int
          eval_pgd_restarts: int
          clean_accuracy_baseline: float       # undefended model
          clean_accuracy_hardened: float
          accuracy_drop_budget: float          # signed off by the model owner, e.g. 0.10
          fgsm_accuracy: float
          pgd_accuracy: float
          transfer_accuracy: float
          selected_on_robust_validation: bool  # checkpoint chosen by held-out robust accuracy
          threshold_recalibrated: bool         # operating threshold re-fit after hardening
          threat_norms: Set[str] = field(default_factory=set)      # norms in the threat model
          evaluated_norms: Set[str] = field(default_factory=set)   # norms the evaluator actually ran


      @dataclass
      class ChecklistItem:
          item_number: int
          gate: str
          remediation: str
          check: Callable[[HardeningEvidence], bool]


      CHECKLIST: List[ChecklistItem] = [
          ChecklistItem(1, 'Robustness measured with evaluation-grade PGD (k >= 40, R >= 5)',
                        'Re-run with PGDConfig.evaluation_grade(eps); k=7 training PGD overstates robustness',
                        lambda e: e.eval_pgd_steps >= 40 and e.eval_pgd_restarts >= 5),
          ChecklistItem(2, 'No gradient masking: FGSM-PGD gap <= 0.15 and transfer accuracy >= PGD accuracy',
                        'Obfuscated gradients suspected; evaluate with C&W and BPDA (Section 10.5) before trusting PGD',
                        lambda e: e.fgsm_accuracy - e.pgd_accuracy <= 0.15 and e.transfer_accuracy >= e.pgd_accuracy),
          ChecklistItem(3, 'Clean accuracy drop within the signed-off budget',
                        'Lower beta (TRADES) or epsilon, or escalate the budget to the model owner',
                        lambda e: e.clean_accuracy_baseline - e.clean_accuracy_hardened <= e.accuracy_drop_budget),
          ChecklistItem(4, 'Checkpoint selected on held-out robust accuracy, not the final epoch',
                        'Robust overfitting: retrain with per-epoch robust validation and keep the best checkpoint',
                        lambda e: e.selected_on_robust_validation),
          ChecklistItem(5, 'Operating threshold recalibrated on the hardened model',
                        'Adversarial training moves the decision boundary; re-fit the threshold to the FPR target',
                        lambda e: e.threshold_recalibrated),
          ChecklistItem(6, 'Every norm in the threat model has been evaluated',
                        'Robustness is norm-specific; run the evaluator for each missing norm',
                        lambda e: e.threat_norms <= e.evaluated_norms),
      ]


      def run_checklist(evidence: HardeningEvidence) -> bool:
          print('Adversarial Training Deployment Checklist')
          print('=' * 60)
          failed = 0
          for item in CHECKLIST:
              ok = item.check(evidence)
              failed += not ok
              print(f'[{"OK" if ok else "FAIL"}] Item {item.item_number}: {item.gate}')
              if not ok:
                  print(f'       -> {item.remediation}')
          print()
          print(f'PASS {len(CHECKLIST) - failed}/{len(CHECKLIST)}')
          if failed:
              print('ACTION REQUIRED: do not ship the hardened model until every item passes.')
          return failed == 0


      if __name__ == '__main__':
          # Numbers from adversarial_training_evaluator.py on the synthetic task, plus a threat
          # model that also names L2 -- which the evaluator has not covered with a fixed-budget attack.
          run_checklist(HardeningEvidence(
              eval_pgd_steps=40, eval_pgd_restarts=5,
              clean_accuracy_baseline=0.993, clean_accuracy_hardened=0.903, accuracy_drop_budget=0.10,
              fgsm_accuracy=0.903, pgd_accuracy=0.903, transfer_accuracy=0.903,
              selected_on_robust_validation=True, threshold_recalibrated=True,
              threat_norms={'linf', 'l2'}, evaluated_norms={'linf'},
          ))
common_mistakes:
  - subject: 'Reporting robustness measured with the training attack'
    id: mistake_1
    entries:
      - label: 'Why It Happens'
        value: >
          The training loop already computes PGD accuracy on every batch with k = 7, so that number
          is logged and reported.
      - label: Consequence
        value: >
          k = 7 with one restart is a weak attacker. The reported robustness is inflated, sometimes
          by many points, and the model is shipped with a claim that evaluation-grade PGD would have
          refuted.
      - label: 'Correct Approach'
        value: >
          Keep training and evaluation configs separate: PGDConfig.madry_training for the inner
          loop, PGDConfig.evaluation_grade (k = 40, five restarts) for every reported number.
          Checklist item 1 enforces this.
  - subject: 'Shipping the final epoch'
    id: mistake_2
    entries:
      - label: 'Why It Happens'
        value: 'Standard training habits: train for the scheduled epochs and save the last weights.'
      - label: Consequence
        value: >
          Robust overfitting means robust test accuracy has often peaked and declined by the final
          epoch. The shipped model is less robust than a checkpoint the run already produced.
      - label: 'Correct Approach'
        value: >
          Evaluate robust accuracy on held-out data every epoch and keep the best checkpoint, as
          adversarial_train does. Record the selected epoch in the model card.
  - subject: 'Trusting fast FGSM training without a PGD guard'
    id: mistake_3
    entries:
      - label: 'Why It Happens'
        value: 'Fast training reports FGSM accuracy, which stays high, and the run looks healthy.'
      - label: Consequence
        value: >
          Catastrophic overfitting can drop PGD robustness to near zero within one epoch while FGSM
          accuracy stays high. Without a PGD check the collapsed model is the one that ships.
      - label: 'Correct Approach'
        value: >
          Evaluate a short PGD attack on a held-out batch every epoch and roll back on a sharp drop,
          as fast_adversarial_train does. Always use random initialisation.
  - subject: 'Generating adversarial examples in training mode'
    id: mistake_4
    entries:
      - label: 'Why It Happens'
        value: 'The attack runs inside the training loop, so the model is already in train mode.'
      - label: Consequence
        value: >
          Batch normalisation updates its running statistics on every PGD step, so after training
          the statistics describe adversarial batches. Dropout randomises the gradient the attack
          follows, producing weaker training examples. Clean and robust accuracy both suffer, and
          the cause is hard to see.
      - label: 'Correct Approach'
        value: >
          Switch to eval mode to generate the attack and back to train mode for the weight update,
          as train_epoch does.
  - subject: 'Claiming robustness beyond the norm and epsilon that were trained and evaluated'
    id: mistake_5
    entries:
      - label: 'Why It Happens'
        value: >
          "Adversarially trained" reads as a property of the model rather than of a specific threat
          model.
      - label: Consequence
        value: >
          An L-infinity-trained model can be weaker than the standard model under L2, as the
          evaluator demo shows. Attackers choose the norm; a robustness claim that does not name it
          invites the one that was not tested.
      - label: 'Correct Approach'
        value: >
          Record norm and epsilon with every robustness number, evaluate every norm in the threat
          model, and let checklist item 6 block deployment until coverage is complete.
section_summary:
  compact: >
    Adversarial training implements the Madry et al. min-max objective: PGD solves the inner
    maximisation on every batch and the weight update minimises the loss at those worst-case inputs.
    It is the strongest empirical defence against the Chapter 10 attacks and costs about eight times
    standard training at k = 7, plus clean accuracy -- a cost the robust/non-robust feature view
    explains: the model gives up predictive features that small perturbations can flip. Fast FGSM
    training with random initialisation matches PGD training at a fraction of the cost but can
    collapse catastrophically, so it needs a per-epoch PGD guard. TRADES makes the
    accuracy-robustness trade explicit through beta. Robust overfitting means checkpoints must be
    selected on held-out robust accuracy. A hardened model must be evaluated with evaluation-grade
    PGD, transfer and C&W, and across every norm in the threat model, because robustness is
    norm-specific. Adversarial training is the upstream surface of the Chapter 10 defence; Track 7
    remains the runtime surface.
  key_takeaways:
    - 'Train with k = 7 PGD, evaluate with k = 40 and five restarts; a robustness claim is only as strong as the evaluation'
    - 'Generate the inner attack in eval mode and update weights in train mode'
    - 'Select the checkpoint on held-out robust accuracy; the final epoch is often not the most robust'
    - 'Fast FGSM training is viable only with random initialisation and a PGD guard against catastrophic overfitting'
    - 'beta in TRADES is a business decision about clean accuracy, not a constant from a paper'
    - 'Robustness is norm-specific: evaluate every norm in the threat model and recalibrate all thresholds after hardening'
