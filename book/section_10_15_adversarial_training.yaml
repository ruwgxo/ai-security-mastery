lead: >
  Adversarial training makes the model itself harder to fool by training on its own worst-case
  inputs -- the strongest empirical defence against the Chapter 10 attacks, paid for in training
  compute, clean accuracy, and a robustness claim that is only as good as the evaluation behind it.
overview:
  - heading: 'Why This Section Exists'
    id: why_this_section_exists
    blocks:
      - type: prose
        text: >
          Track 7 detects adversarial examples after the model is deployed. Section 10.14 certifies
          a narrow L2 threat model at a real accuracy and inference cost. Neither changes how many
          adversarial examples exist for the model in the first place. Adversarial training does: it
          moves the decision boundary away from the data so that small perturbations no longer cross
          it. It is the defence that survived the 2017-2018 wave of broken defences, and every later
          method in this section is a refinement of it.
      - type: prose
        text: >
          It also comes with the most ways to fool yourself. Single-step training can collapse while
          its own metrics look healthy, the final epoch is often not the most robust one, and a
          model hardened for one norm can be weaker in another. This section builds the training
          loops and the evaluator and checklist that keep the robustness claim honest.
  - heading: 'Position in Chapter'
    id: position_in_chapter
    blocks:
      - type: prose
        text: >
          Section 10.15 completes the upstream half of the Chapter 10 defence stack. Section 10.4
          built PGD and the PGDConfig training and evaluation presets; this section wraps them in
          the min-max training loop. Section 10.14 gave the provable but narrow guarantee; this
          section gives the broad but unprovable one. Section 10.16 combines both with Track 7.
