deliverables:
  deliverable_1:
    title: Detection Metrics and the Base-Rate Calculator
    filename: detection_metrics.py
    description: |-
      Computes the four detection metrics from a confusion matrix built over labelled detections: DetectionMetrics exposes TPR, FPR, precision, recall, and F1; compute_metrics and compute_suite_metrics produce per-detector and suite-level views from the same machinery. The base-rate half is the section's centre: BaseRateScenario computes the precision an analyst will actually experience at a given base rate, and fpr_required_for_precision inverts the relation to give the maximum FPR that meets a precision target -- turning 'reduce false positives' into an engineerable number.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library dataclasses, enum, and typing only. LabelledDetection collapses the verdict to the alert binary (flag/block alert, allow does not); the label is the analyst-dispositioned ground truth. The __main__ block computes metrics over a two-detector set, then demonstrates the base-rate collapse (95% TPR, 1% FPR at a 0.1% base rate yields under 10% precision) and verifies the FPR-for-precision inversion round-trips. In the suite these labels come from the Chapter 16 dispositions via the 17.04 curator.
    code: |
      # detection_metrics.py
      # Section 17.02: Detection Metrics -- TPR, FPR, Precision, Recall
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The metrics that quantify how well a detector detects. A detection is scored
      # against a known label -- was this actually an attack? -- and the four counts
      # that result (true/false positive, true/false negative) yield the rates that
      # tuning optimises: true-positive rate, false-positive rate, precision, recall.
      # This module computes them per detector and at the suite level, on a labelled
      # set or a stream of dispositioned live detections, and it makes the base-rate
      # problem -- why a rare attack demands a very low false-positive rate -- explicit
      # and calculable, because that is the fact that governs every tuning decision.

      from dataclasses import dataclass, field
      from enum import Enum
      from typing import Dict, List, Optional


      class Verdict(Enum):
          ALLOW = 'allow'
          FLAG = 'flag'
          BLOCK = 'block'


      # --- A labelled detection: what the detector said vs. what was true ---------
      # The label is the ground truth -- established by an analyst disposition (17.04)
      # or a curated test set. alerted collapses the verdict to a binary: flag and
      # block are alerts, allow is not. The metrics are computed over these.

      @dataclass
      class LabelledDetection:
          detector: str
          verdict: Verdict
          is_attack: bool                          # ground truth: was this actually an attack?

          @property
          def alerted(self) -> bool:
              return self.verdict in (Verdict.FLAG, Verdict.BLOCK)


      # --- The confusion matrix ---------------------------------------------------
      # Four counts, each with a different operational cost. The whole of detection
      # quality is a question of their ratios.

      @dataclass
      class ConfusionMatrix:
          tp: int = 0                              # attack, alerted -- caught
          fp: int = 0                              # benign, alerted -- false alarm
          tn: int = 0                              # benign, quiet -- correctly ignored
          fn: int = 0                              # attack, quiet -- missed

          @property
          def total(self) -> int:
              return self.tp + self.fp + self.tn + self.fn

          def add(self, d: LabelledDetection) -> None:
              if d.is_attack and d.alerted:
                  self.tp += 1
              elif d.is_attack and not d.alerted:
                  self.fn += 1
              elif not d.is_attack and d.alerted:
                  self.fp += 1
              else:
                  self.tn += 1


      def _safe_div(num: float, den: float) -> float:
          return num / den if den else 0.0


      # --- The four rates ---------------------------------------------------------
      # Each is a ratio over the confusion matrix. The docstrings state what each
      # answers and what trades against it, because the tuning decisions in this
      # chapter are made in these terms.

      @dataclass
      class DetectionMetrics:
          detector: str
          matrix: ConfusionMatrix

          @property
          def true_positive_rate(self) -> float:
              '''TPR = recall = TP / (TP + FN). Of the real attacks, the fraction
              caught. The optimisation target pushes this toward 0.95+.'''
              return _safe_div(self.matrix.tp, self.matrix.tp + self.matrix.fn)

          @property
          def false_positive_rate(self) -> float:
              '''FPR = FP / (FP + TN). Of the benign traffic, the fraction falsely
              alerted. The base-rate problem makes this the number that governs
              precision on rare attacks.'''
              return _safe_div(self.matrix.fp, self.matrix.fp + self.matrix.tn)

          @property
          def precision(self) -> float:
              '''Precision = TP / (TP + FP). Of the alerts raised, the fraction that
              were real. This is what an analyst experiences as alert quality.'''
              return _safe_div(self.matrix.tp, self.matrix.tp + self.matrix.fp)

          @property
          def recall(self) -> float:
              '''Recall = TPR. Named twice because both names are standard: recall in
              the precision-recall pairing, TPR in the ROC pairing.'''
              return self.true_positive_rate

          @property
          def f1(self) -> float:
              '''Harmonic mean of precision and recall -- a single number for the
              trade-off, useful for comparing candidates when neither dominates.'''
              p, r = self.precision, self.recall
              return _safe_div(2 * p * r, p + r)

          def as_dict(self) -> Dict[str, float]:
              return {'detector': self.detector, 'tpr': round(self.true_positive_rate, 4),
                      'fpr': round(self.false_positive_rate, 4), 'precision': round(self.precision, 4),
                      'recall': round(self.recall, 4), 'f1': round(self.f1, 4),
                      'tp': self.matrix.tp, 'fp': self.matrix.fp,
                      'tn': self.matrix.tn, 'fn': self.matrix.fn}


      def compute_metrics(detections: List[LabelledDetection], detector: str) -> DetectionMetrics:
          '''Compute the detection metrics for one detector from its labelled detections.'''
          m = ConfusionMatrix()
          for d in detections:
              if d.detector == detector:
                  m.add(d)
          return DetectionMetrics(detector, m)


      def compute_suite_metrics(detections: List[LabelledDetection]) -> Dict[str, DetectionMetrics]:
          '''Compute per-detector metrics plus a suite-level roll-up. The suite entry
          treats a detection as caught if the detector that saw it alerted, so it
          measures the suite as a whole rather than any single detector.'''
          detectors = sorted({d.detector for d in detections})
          out: Dict[str, DetectionMetrics] = {}
          for name in detectors:
              out[name] = compute_metrics(detections, name)
          suite = ConfusionMatrix()
          for d in detections:
              suite.add(d)
          out['__suite__'] = DetectionMetrics('__suite__', suite)
          return out


      # --- The base-rate problem --------------------------------------------------
      # The single most important fact in detection metrics: when attacks are rare,
      # precision is dominated by the false-positive rate, not the true-positive rate.
      # This makes it calculable so a tuning decision can be reasoned about rather
      # than guessed.

      @dataclass
      class BaseRateScenario:
          attack_base_rate: float                  # fraction of traffic that is a real attack
          true_positive_rate: float                # detector's TPR (recall)
          false_positive_rate: float               # detector's FPR

          def expected_precision(self) -> float:
              '''Precision implied by the base rate and the two rates, via Bayes.
              With rare attacks, even a tiny FPR floods the alerts with false ones.'''
              p = self.attack_base_rate
              tp = self.true_positive_rate * p
              fp = self.false_positive_rate * (1 - p)
              return _safe_div(tp, tp + fp)

          def alerts_per_true_positive(self) -> float:
              '''How many alerts an analyst reviews per real attack found. The
              felt cost of low precision.'''
              prec = self.expected_precision()
              return _safe_div(1.0, prec)


      def fpr_required_for_precision(target_precision: float, attack_base_rate: float,
                                     true_positive_rate: float) -> float:
          '''Invert the base-rate relation: the maximum FPR that still achieves a
          target precision at a given base rate and TPR. This is the number a tuning
          decision actually needs -- "to hit 90% precision on a 1-in-10000 attack, the
          FPR must be below this".'''
          p = attack_base_rate
          if target_precision <= 0 or target_precision >= 1:
              return 0.0
          # precision = TPR*p / (TPR*p + FPR*(1-p))  ->  solve for FPR
          tp = true_positive_rate * p
          # tp / (tp + fpr*(1-p)) = target  ->  fpr = tp*(1-target) / (target*(1-p))
          return _safe_div(tp * (1 - target_precision), target_precision * (1 - p))


      if __name__ == '__main__':
          # A small labelled set across two detectors.
          dets = []
          # prompt_injection: 8 real attacks (7 caught, 1 missed), 2 false alarms out of 90 benign
          for i in range(7):
              dets.append(LabelledDetection('prompt_injection', Verdict.BLOCK, True))
          dets.append(LabelledDetection('prompt_injection', Verdict.ALLOW, True))   # missed
          for i in range(2):
              dets.append(LabelledDetection('prompt_injection', Verdict.FLAG, False))  # false alarm
          for i in range(88):
              dets.append(LabelledDetection('prompt_injection', Verdict.ALLOW, False))
          # pii_scanner: 5 attacks all caught, 5 false alarms
          for i in range(5):
              dets.append(LabelledDetection('pii_scanner', Verdict.BLOCK, True))
          for i in range(5):
              dets.append(LabelledDetection('pii_scanner', Verdict.FLAG, False))
          for i in range(90):
              dets.append(LabelledDetection('pii_scanner', Verdict.ALLOW, False))

          metrics = compute_suite_metrics(dets)
          for name, m in metrics.items():
              d = m.as_dict()
              print(f"{name:18} tpr={d['tpr']:.3f} fpr={d['fpr']:.3f} "
                    f"prec={d['precision']:.3f} f1={d['f1']:.3f}")

          pi = metrics['prompt_injection']
          assert pi.matrix.tp == 7 and pi.matrix.fn == 1 and pi.matrix.fp == 2
          assert abs(pi.true_positive_rate - 7/8) < 1e-9
          assert abs(pi.precision - 7/9) < 1e-9

          print('\n--- base-rate problem ---')
          # A strong detector -- 95% TPR, 1% FPR -- against a rare attack.
          scen = BaseRateScenario(attack_base_rate=0.001, true_positive_rate=0.95,
                                  false_positive_rate=0.01)
          print(f'base rate 0.1%, TPR 95%, FPR 1%  -> precision {scen.expected_precision():.3f}, '
                f'{scen.alerts_per_true_positive():.1f} alerts per real attack')
          assert scen.expected_precision() < 0.10   # a 1% FPR is catastrophic at this base rate

          need = fpr_required_for_precision(0.90, attack_base_rate=0.001, true_positive_rate=0.95)
          print(f'to reach 90% precision at 0.1% base rate, FPR must be below {need:.6f}')
          # verify the inversion round-trips
          check = BaseRateScenario(0.001, 0.95, need)
          assert abs(check.expected_precision() - 0.90) < 1e-6
          print('\ndetection metrics + base-rate calculus: ok')
common_mistakes:
  mistake_1:
    description: Judging a detector by its true-positive rate alone
    why_it_happens: |-
      A high TPR sounds like a good detector -- it catches the attacks -- and it is the number a detector's authors are proudest of.
    consequence: |-
      The detector can still be unusable: with rare attacks, a great TPR paired with a small FPR produces alerts that are mostly false, and the true-positive rate cannot fix that.
    correct_approach: |-
      Judge the detector by precision as experienced at the real base rate, which is governed by the false-positive rate, and drive the FPR low enough that the alerts are worth reading.
  mistake_2:
    description: Treating threshold selection as finding one correct value
    why_it_happens: |-
      It feels like there should be an optimal threshold, a single best answer the tuning is searching for.
    consequence: |-
      The chosen threshold optimises F1 or some default and ignores the deployment's actual cost trade-off, over-alerting a high-cost detector or under-catching a catastrophic one.
    correct_approach: |-
      Choose a point on the precision-recall trade-off that matches the deployment's costs -- high recall where a miss is catastrophic, high precision where investigation is expensive -- rather than a single default.
  mistake_3:
    description: Ignoring the base rate when reasoning about precision
    why_it_happens: |-
      The detector's TPR and FPR are intrinsic and easy to quote; the base rate is a property of the traffic and easy to forget.
    consequence: |-
      Precision is dramatically overestimated -- a detector that looks strong in the lab floods analysts with false alerts in production, because the lab base rate did not match the rare-attack reality.
    correct_approach: |-
      Always compute expected precision at the real attack base rate, and set the FPR ceiling from the precision target and that base rate, so the deployment's precision is engineered rather than assumed.
  mistake_4:
    description: Measuring detection metrics only on a fixed labelled set
    why_it_happens: |-
      A labelled set gives clean, repeatable numbers, so it becomes the sole measurement and the live picture is never checked.
    consequence: |-
      The labelled set drifts from live traffic exactly as a training set does, so the reported metrics describe a distribution the detector no longer faces, hiding a live regression.
    correct_approach: |-
      Measure on the labelled set for clean comparison and regression testing, and also on live traffic via analyst dispositions, so the detector is judged where it actually runs.
section_summary:
  compact: |-
    Section 17.02 builds the detection-quality half of the loop's measurement stage: the four metrics that say how well a detector detects, computed from a confusion matrix. True-positive rate (recall) is the fraction of real attacks caught; false-positive rate is the fraction of benign traffic falsely alerted; precision is the fraction of alerts that are real; F1 collapses precision and recall to one number for comparing candidates. The threshold is the dial that sets the precision-recall trade-off -- lower it for more recall at the cost of precision, raise it for the reverse -- so tuning a detector means choosing a point on that trade-off to match the deployment's costs, not finding one correct value. The section's centre is the base-rate problem: because real attacks are rare, precision is dominated by the false-positive rate acting on the vast benign majority, not by the true-positive rate on the rare attacks, so a detector with a superb 95% TPR and a small 1% FPR can still produce alerts that are over 90% false at a 0.1% base rate. This is why false-positive reduction is the governing optimisation target, and the deliverable makes it calculable in both directions -- the precision an analyst will experience at a given base rate, and the maximum FPR a precision target permits -- so tuning goals become engineerable FPR ceilings. Metrics are computed per detector, for tuning a component, and at the suite level, for judging the whole; the discrepancy between them is informative. They are measured on both a fixed labelled set, for clean comparison, and on live traffic via analyst dispositions, for the distribution the detector actually faces -- and they are the objective the whole improvement loop optimises.
  key_takeaways:
  - |-
    The four detection metrics are ratios over the confusion matrix; recall and TPR are the same number named twice
  - |-
    The detector threshold sets the precision-recall trade-off, so tuning is choosing a point on it to match deployment costs
  - |-
    The base-rate problem makes precision depend on the false-positive rate for rare attacks -- a great TPR cannot rescue it
  - |-
    The deliverable makes the base-rate relation calculable both ways, turning a precision target into an FPR ceiling to engineer toward
  - |-
    Metrics are computed per detector and at the suite level, and the discrepancy between the two views is itself informative
  - |-
    Metrics are measured on labelled sets for clean comparison and on live traffic for the real distribution, and are the loop's objective
preview_section_17_03:
  title: 'Performance Monitoring: Latency, Throughput, and Errors'
  summary: |-
    Section 17.03 builds the second measurement family: the performance metrics that quantify how well the suite runs. It monitors latency with percentiles, throughput against provisioned capacity, and error rate per detector over rolling windows, tracks the sub-50ms P99 budget continuously, and detects a regression in the warning band before it breaches the budget -- building on the Chapter 14 golden signals rather than replacing them, and feeding the tuning decisions where a recall gain must be weighed against its latency cost.
