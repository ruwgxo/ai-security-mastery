prose_content:
  part_1:
    title: The Four Metrics and the Confusion Matrix
    body: |-
      Every detection metric is a ratio over four counts, and the four counts are the confusion matrix. Take a set of detections for which the truth is known -- each was really an attack or really benign -- and compare the truth against what the detector did, collapsing its verdict to a binary: flag and block are an alert, allow is not. Four outcomes result. A true positive is an attack the detector alerted on: caught. A false negative is an attack the detector let pass: missed. A false positive is benign traffic the detector alerted on: a false alarm. A true negative is benign traffic the detector let pass: correctly ignored. Every detection falls into exactly one cell, and the whole of detection quality is a question of their ratios.

      The four metrics read those ratios from different angles. True-positive rate -- also called recall -- is TP / (TP + FN): of the real attacks, the fraction caught. False-positive rate is FP / (FP + TN): of the benign traffic, the fraction falsely alerted. Precision is TP / (TP + FP): of the alerts raised, the fraction that were real. Recall and TPR are the same number under two names, because the security literature and the machine-learning literature named it independently -- recall pairs with precision, TPR pairs with FPR on the ROC curve. The costs differ by cell, and naming them is the point of the matrix: a false negative is a missed attack, potentially a breach; a false positive is wasted analyst time and, in volume, alert fatigue that gets the whole detector ignored. The metrics let those costs be traded deliberately instead of accidentally.
  part_2:
    title: The Precision-Recall Trade-off and the Threshold
    body: |-
      Precision and recall pull against each other, and the detector's decision threshold is the dial that sets where the pull balances. A detector produces a score; the threshold is the score above which it alerts. Lower the threshold and the detector alerts more readily: it catches more real attacks (recall rises) but also catches more benign traffic that scored moderately (precision falls). Raise the threshold and it alerts only on the strongest signals: the alerts it does raise are more often real (precision rises) but the subtler attacks slip under the bar (recall falls). There is no threshold that maximises both, because they are in tension by construction -- the same move that admits more true positives admits more false positives.

      This reframes 'tuning a detector' as 'choosing a point on the precision-recall curve', and the right point is a policy decision, not a mathematical one. A detector guarding against a catastrophic attack may accept low precision to push recall as high as possible -- better to review many false alarms than miss the one real breach. A detector whose alerts are expensive to investigate may hold out for high precision and accept that it misses the marginal cases. The F1 score, the harmonic mean of precision and recall, collapses the trade-off to a single number when neither side should dominate, which is useful for comparing two candidates but is not itself the goal -- a deployment that genuinely values recall over precision should not be talked out of it by an F1 that treats them equally. The threshold is where the optimisation targets of 17.01 become concrete: moving it is exactly how a tuner trades false positives against missed attacks.
  part_3:
    title: 'The Base-Rate Problem: Why Rare Attacks Change Everything'
    body: |-
      Here is the fact that undoes more detection deployments than any other, and it is entirely a consequence of attacks being rare. Suppose a detector has an excellent true-positive rate of 95% and a false-positive rate of just 1% -- numbers that sound like a strong detector by any ordinary reading. Now deploy it against traffic where one request in a thousand is a real attack. Out of a million requests, a thousand are attacks and the detector catches 950 of them. But 999,000 are benign, and 1% of those -- 9,990 -- are falsely alerted. The analyst now faces 950 real alerts buried in 9,990 false ones: precision is 950 / (950 + 9,990), under 9%. More than nine in ten alerts are false, from a detector whose headline rates looked excellent.

      The reason is that precision depends on the false-positive rate multiplied by the benign volume, and when attacks are rare the benign volume is almost everything. The true-positive rate operates on the tiny attack slice; the false-positive rate operates on the vast benign remainder. So at low base rates, precision is governed by the false-positive rate, and the true-positive rate barely matters to it -- you cannot fix a precision problem by catching a higher fraction of a rare class. This is Bayes' rule in operational dress, and its consequence is stark: for a security suite facing rare attacks, driving the false-positive rate very low is not a nicety, it is the only path to alerts worth reading. This is precisely why 17.01 named false-positive reduction the governing target. The section's deliverable makes the relation calculable in both directions: given a base rate and the two rates, compute the precision an analyst will actually experience; and given a target precision, compute the maximum false-positive rate that can achieve it -- so a tuning goal like '90% precision on a 1-in-10,000 attack' becomes a concrete FPR ceiling to engineer toward, rather than an aspiration.
  part_4:
    title: Per-Detector and Suite-Level Measurement
    body: |-
      The metrics are computed at two levels, and each answers a different operational question. Per-detector metrics isolate one detector's quality: they are what a tuner reads to decide whether the injection detector's threshold needs moving, or whether the PII scanner's false-positive rate has crept up. They attribute quality to a component, so the tuning has a specific target. Suite-level metrics roll the detectors up into one view: of all the attacks the suite faced, what fraction did any detector catch; of all the benign traffic, what fraction did some detector falsely alert on. The suite view is what an operations lead reads to judge the whole system's health, and it can differ sharply from the per-detector views -- a suite can have a higher recall than any single detector, because different detectors catch different attacks, while its false-positive rate is worse than any single detector's, because every detector's false alarms accumulate.

      Both levels are computed the same way, over the same confusion-matrix machinery, differing only in how detections are grouped. The deliverable produces per-detector metrics and a suite roll-up together, so a tuner never has to choose between the component view and the system view -- both are always available, and the discrepancy between them is itself informative. When suite recall exceeds every detector's recall, the detectors are complementary and the ensemble is doing its job; when suite precision is far below every detector's precision, the false-alarm burden is additive and the suite may be over-alerting even though no single detector looks bad. Measuring at one level only hides exactly the effect that matters most for tuning a suite as opposed to a detector.
  part_5:
    title: Live Traffic, Labelled Sets, and the Metrics as Objective
    body: |-
      Detection metrics are measured against two kinds of ground truth, and the difference matters for what each measurement can be trusted to say. A curated labelled set -- a fixed collection of detections whose true nature is known -- gives a clean, repeatable measurement: run the detector over it, compare to the labels, read the metrics. It is the right tool for comparing candidates on equal footing and for regression testing a change, because the data does not move. But a labelled set is a snapshot, and it drifts from live traffic exactly as a training set does; a detector that scores well on last quarter's labelled set may be quietly failing on this week's traffic. So the metrics are also measured on live traffic, using the analyst dispositions of Chapter 16 as the labels -- the same dispositions that curation (17.04) collects. Live measurement is noisier and its labels arrive with a lag, but it measures the detector where it actually runs, against the distribution it actually faces.

      Whichever the source, these metrics are the objective the improvement loop optimises. Curation exists to produce better labelled data; retraining exists to move these numbers on that data; A/B testing exists to prove one detector's metrics beat another's on live traffic. Every subsequent stage of the chapter is, in the end, an attempt to improve a number defined in this section -- usually to push the true-positive rate up while holding the false-positive rate down against the base-rate pressure that makes the latter so hard. That is why the section comes first among the measurement stages and why its deliverable is built to compute the metrics identically on live and labelled data: the loop needs one consistent definition of 'better', measured the same way before a change and after it, or it cannot tell improvement from noise. With the detection objective defined, Section 17.03 measures the performance side.
