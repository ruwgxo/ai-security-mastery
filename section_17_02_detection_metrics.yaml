section_overview:
  one_line_summary: |-
    The first measurement family: the metrics that quantify how well a detector detects -- true-positive rate, false-positive rate, precision, and recall -- computed from a confusion matrix per detector and at the suite level, governed by the precision-recall trade-off that the detector threshold controls, and dominated, for the rare attacks a security suite actually faces, by the base-rate problem that makes precision depend far more on the false-positive rate than on the true-positive rate.
  why_this_section_exists: |-
    The improvement loop's first stage is measurement, and its first question is the security question: how well does the suite detect? This section answers it with the four detection metrics and, more importantly, with the relationships between them that make tuning a reasoned choice rather than a guess. It exists to establish the objective the entire rest of the chapter optimises -- curation, retraining, and A/B testing all serve to move these numbers -- and to confront the one fact that most often defeats a detection deployment in practice: the base-rate problem.

    The four metrics are simple to define and easy to compute; the section does that and moves quickly to what actually matters. First, precision and recall trade off, and the detector's threshold is the dial that moves them: raise the threshold and precision rises while recall falls, lower it and the reverse, so choosing a threshold is choosing a point on that trade-off rather than finding a single correct value. Second, and decisively, the base-rate problem. Real attacks are rare -- a tiny fraction of traffic -- and when the positive class is that rare, precision is dominated by the false-positive rate applied to the overwhelming benign majority, not by the true-positive rate on the handful of real attacks. A detector with a superb 95% true-positive rate and a seemingly-tiny 1% false-positive rate can still produce alerts that are more than 90% false, because 1% of an enormous benign volume dwarfs 95% of a rare attack. This is why 'reduce false positives' is the governing optimisation target, and this section makes it calculable so a tuning decision can be justified with arithmetic.
  position_in_chapter: |-
    Section 17.02 builds the detection-quality half of the loop's measurement stage, the objective that curation (17.04), retraining (17.05), and A/B testing (17.06) all work to improve. It computes the metrics the Chapter 1 Section 1.11 evaluation framework defined, now against live and labelled detection data, and it establishes the base-rate reasoning that makes false-positive reduction the chapter's binding constraint. Section 17.03 measures the other half -- performance.
