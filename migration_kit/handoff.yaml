    section_summary.key_terms kept as a term/definition list, preview teaser -> next.summary,
    scalar metadata -> section_info.legacy, indented Sigma/YAML/shell blocks in prose -> code
    blocks (yaml, bash, sh) with a prose lead-in kept, suspended-hyphen rule narrowed
    (to-detection is a wrap, not "to"), code-apostrophe fix escapes instead of producing a
    SyntaxError. prose_content part_N_slug with heading/body was already handled; the dry-run
    failures came from what_you_learned. chapter_11_index's topic-list layout is mapped onto the
