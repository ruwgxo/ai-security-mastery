method_per_chapter:
  - Work from migration_kit/ in the repository - all commands below run there (cd migration_kit; python3 tools/...). Copy migration_kit/ to a scratch folder outside the working tree before switching branches.
  - Export the v1 files from git (git show v2:book/...) into a separate folder. Never read v1 from a working tree that has a chapter branch checked out.
  - Convert sections with tools/convert.py and indexes with tools/convert_index.py, then restore YAML comments with tools/keep_comments.py.
  - Check every section with tools/check.py and every index with tools/check_index.py. All must PASS before a commit.
  - Read the converter reports - classified paragraphs, wrap markers, hyphen joins, defects, legacy keys - and review the judgement calls by hand.
  - Run every code deliverable with tools/run_deliverables.py, v1 twice and v2 once, in separate folders, and compare. Never run Python with -I, because deliverables import each other.
  - Many deliverables (chapter 11 on) are CLIs that only print usage without arguments. Run them a second time with real arguments (--all, --demo, --list, --report, chained where one tool's output feeds another) before judging what they demonstrate.
  - The converter was built on chapter 10 and needs small extensions for other chapters (see dry_run below). Extend it, never special-case a single file by hand. After every converter change, run python3 tools/regression.py. It must print OK (all 94 chapter 10 to 16 files byte for byte) before you convert anything. Add each finished chapter's v1 files and form-commit output as regression/chNN_v1 and regression/chNN_expected.
  - Deliverable code lives in literal blocks inside the YAML. Extract it to files, edit there, write it back by replacing only the code block, and confirm afterwards that nothing but deliverables[].code changed.
  - Check that each demo measures what its text claims. A demo whose result depends on its noise draw is measured over many seeds, with the rates printed in its output (13.03 guard, 13.04 multi-resolution), not shown on one lucky seed. Text in a demo's output that states a number is computed, not typed. A demo built on an untrained model, noise images or random labels (chapter 10 often uses an untrained ToyLinear on torch.rand) produces numbers that mean nothing. 10.08 printed 0.938 at every setting and contradicted its own section. Fix such demos with a trained model and a baseline, in their own commit, and report the results honestly, including when they disagree with the text.
  - At the end of the chapter, after the last commit, render the chapter from the branch with python3 tools/chapter_pdf.py BOOK_DIR NN Chapter_NN_review.pdf. It prints every value in the chapter's index and sections exactly once, adds only key labels, bullets and numbers, and checks the PDF text against the YAML character for character; it must print PASS. Send the PDF to the owner. It is for the owner's review only - never commit it.
  - Open the PR into v2 with evidence tables, form changes and content fixes. If the Claude Code UI opens the PR, check its base is v2 and replace its auto-written description.

evergreen_rule:
  rule: >
    The book must not go stale. No statement may need a revisit just because time passed.
  apply:
    - Never state the author's years of experience or any other count that grows with time. Describe the background instead (a security engineer with a background in SOC operations and detection engineering).
    - No market, hiring or popularity claims (the job market is screaming, every FAANG company is hiring). Make the underlying point without the dated claim.
    - A fact about the state of the field carries an explicit anchor ("as of 2026") or is phrased so it stays true. Replace bare "currently", "recently", "today", "the latest" and "new" with an anchor or a timeless wording.
    - Model, product and version names are fine as examples when tied to the time they describe, never as "the latest" or "state of the art".
    - List every rewording in the chapter PR as a content fix.
  known_hits:
    - Book index author years and market claims - fixed in PR 12.
    - Book index FAANG references and GitHub star counts (5 lines) - fixed in PR 14.
    - Chapter 12 - fixed in PR 15 (12.01 "no ML model currently matches"). Left - "adversaries are using today" (12.14, index), "currently in production" (12.17), "today's corpus ... next month's" (index); all relative. 12.10 "modern deep learning frameworks" went with a calibration accuracy fix.
    - Chapter 14 - no hits (PR 18). Every new is relative to the chapter; 14.07 "currently invisible" is narrative; "concurrently" (14.04) is not a hit.
    - Chapter 13 - no hits (PR 17). Every current/recent/new is relative to a window, entity or model state; 13.11 "currently throttled" is entity state; latest/today in 13.04 and 13.06 are in code and example strings.
    - Bare "currently" appears in chapters 4, 5, 6 and 7 and in the chapter 5 and 7 indexes (check each with a word-boundary search - "concurrently" is a false hit). Handle it in those chapters' PRs.
    - '"As of 2025" and "as of 2026" anchors in chapters 5 and 7 are already correct.'

