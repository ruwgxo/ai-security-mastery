open_items:
  - PR 21 open questions, decided by the owner as middle paths (take the hybrid, not either extreme). (1) Elastic lifecycle - keep date-named daily indices; the ILM policy is delete-only (rollover needs an alias or data stream) and an index template gives each new daily index the mapping and policy. (2) Connector secrets - each connector reads its own secret from the environment (SPLUNK_HEC_TOKEN, DD_API_KEY; ELASTIC_API_KEY via ${} in the Logstash output) without importing the *_config.py deployment configs. (3) Sigma - one rule per level: verdicts sharing a level share a rule (still 11 rules under the book's mapping). (4) Datadog points counted per minute of event time. (6) Empty slots stay in the YAML; chapter_pdf.py skips their headings. Still open - (5) the Logstash config and live Datadog/Elastic payloads are unverified. Apply the same middle-path reading to similar questions in later chapters, but still ask.
  - PR 18 open questions. (1) 14.09 dashboard pages on a snapshot crossing the SLO line while the text and alerting_slo_config alert on budget burn - align? (2) 14.04 table_2, latency_allocation_table and latency_budget_engine use three different allocation sets - unify? (3) 14.07 circuit_breaker lets every call through in half-open where the text says limited trial calls - cap? (4) 14.11 readiness P99 is gateway overhead with stand-in detectors; part 3 describes a production-load P99 no stdlib demo can produce (labelled). (5) 14.11 validation imports 14.04, 14.07, 14.10 deliverables (notes say so).
  - PR 17 open questions. (1) forecast_anomaly_scorer fires on noise about 0.85 hours a day at interval_k=3 - wider default? (2) model_behaviour_monitor skips its length check when the baseline spread is 0 - add a floor? (3) risk_score_engine caps at 2.0 while the profiler squashes to [0, 1] and the 13.11 gateway weights entity risk as [0, 1] - align? (4) Coverage uniformity is normalised by distinct buckets, so a clustered legitimate user scores 0.958; breadth alone separates. (5) The profile should name key_terms as "Term: definition" strings.
  - Chapter 13 deliverables keep a few unused typing imports from v1 (pyflakes); left as is.
  - PR 13 open questions for the owner. (1) The 11.06/11.07 worked Sigma rules lack the 11.02 gateway fields (severity, confidence, mitre_technique, false_positive_notes) - add them, or say in 11.02 they are added at merge? (2) Confirm sigma_rule_builder severity/confidence values, especially compound Track 7 severity high. (3) section_summary.key_terms is a new slot (also needed by 13.12); the profile should name it. (4) "Track 8" for camera-facing systems in 11.04, 11.05, 11.14 - decided: keep; "Track 8" is reserved for the optional camera-facing extension and must not be reused. (5) Ids like CM11.01.1 and D11.01.1 need normalising for strict anchors in v3. (6) "Sigma is the lingua franca" left as is.
  - PR 15 open questions. (1)-(3) done in PR 16 - 12.06 now says attention "can concentrate on" the boundary-crossing turn; 12.03 drops the unsourced 2-5x ratio; 12.09's scorer matched markers as substrings (user inside user@test.com boosted confidence), so markers now match whole words, the detected span is left out of its own context, fairy tale/story/test user markers were added and fictional_penalty is 0.5 - harness precision 1.000, recall 1.000 regex-only (spaCy PERSON path untested). (4) 12.07 embedding demos and attack_cluster_builder need a sentence-transformers model; Hugging Face is blocked here, so they are labelled and unverified.
  - The private profile (1.0.0, locked) does not yet name the chapter 12 sources either (list-shaped reference_materials/deliverables/common_mistakes item ids, deliverable name as filename).
  - The private profile (1.0.0, locked) does not yet name the chapter 11 sources (what_you_learned, key_terms, teaser, scalar metadata to legacy, embedded code languages, the topic-list index mapping). Fold them in at the next profile revision.
  - The bundle's checker now handles list-shaped slots (1.4.0). Against chapter 9's form commit (18e72b3, fetchable as refs/pull/11/head) it still fails 13 of 13, only on tables whose rows are mappings (chapter 9 turned them into lists with row_keys in legacy). Neither the converter nor the checker handles row mappings yet; chapter 9 stays verified by PR 11 only.
  - The 12.17 gateway demo runs two of the four ensemble detectors (IF, XGBoost); a keyword-free API-abuse request passes because the pipeline has no session cache (request rate 0). Synthetic-template data makes supervised demos near-perfect; the outputs say so.
  - 11.09 threshold_calibration_harness prints results from synthetic corpora without saying so in its output (the function names say synthetic). 11.02 detection_as_code_pipeline is a skeleton that stops at lint without a detections/ repository. Both left as is.
  - Many chapter 11 paragraphs of "Label - value" lines (Phase 1 ..., Hypothesis 1 ...) were folded into prose under the isolated-break rule. They read better as list or steps blocks in v3.
  - This bundle does not include converter changes the chapter 9 chat may have made. If chapter 11 needs a shape chapter 9 already handled (list-shaped slots, doubled-apostrophe fixes in code), extend the converter again and use the merged chapter 9 files in v2 as the reference for the expected output. Keep regression OK.
  - Done in PR 10, merged as 0bf4019 - the 10.08 demos now use a trained shape CNN (adversarial_patch.demo_setup). EOT leads digital-only at every severity, and the detector reaches 0% false positives and 100% detection.
  - Other chapter 10 demos (10.03 FGSM and others) also run an untrained ToyLinear on noise. Review them in a chapter 10 follow-up, or alongside the chapter that next touches them.
  - 10.05 mistake_3 is the only mistake with a title. It renders correctly, so it is left as is.
  - The interim site build outside the repo reads the v1 layout and must be updated before v2 merges to main.
  - In the standard (1.1.0 onward, and 2.0.0), renderers may no longer use key names as headings. The v3 profile must write those headings out.

environment:
  torch: >
    download.pytorch.org is blocked. Install torch from PyPI with its CUDA dependencies
    (about 5.6 GB in a venv). It runs on CPU. A --no-deps install fails at import.
  python_packages: numpy, matplotlib, scipy, pyyaml, jsonschema
  chapter_12_packages: >
    scikit-learn, pandas, shap, xgboost, imbalanced-learn, optuna, transformers,
    sentence-transformers, onnxruntime, hdbscan, umap-learn, presidio-analyzer, spacy, mlflow (all
    from PyPI). spaCy models install with python -m spacy download en_core_web_lg (and _sm).
    huggingface.co is blocked (403), so no transformer or sentence-transformer weights.

