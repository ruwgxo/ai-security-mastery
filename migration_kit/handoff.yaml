every_session_ends_with:
  - The chapter PR open into v2, with evidence, and its base checked. Its last commit updates migration_kit/ - tools with any converter changes, the chapter's regression fixtures, and this handoff with the chapter moved to done, its PR number, new open items and the version bumped. That commit's message stays public-facing ("Update the migration kit for chapter NN").
  - Chapter_NN_review.pdf sent to the owner. No bundle or tar is sent any more.
