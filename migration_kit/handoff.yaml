known_by_chapter:
  chapters_1_2: >
    53 files with free-form nested section_content. Expect many line-structured paragraphs
    (worked calculations, arrow diagrams) becoming text code blocks, and list values inside
    fields entries. Review these by hand. section_01_11 and section_03_02 have a stray trailing
    document marker.
  chapters_5_6: >
    deliverables means produced output files there; code lives under implementations. The
    converter maps implementations to deliverables and deliverables.items to artifacts.
  chapters_9_11: >
    15 genuine doubled-apostrophe bugs in Python strings ('I''m sorry', 'Track 7''s') that print
    wrongly. The converter fixes only these, writing an escaped apostrophe (a backslash before
    the apostrophe, as chapter 9 did), and lists them. Chapter 11's six are done.
  chapter_11_done: >
    PR 13. Converter shapes added: section_summary.what_you_learned -> compact,
    section_summary.key_terms kept as a term/definition list, preview teaser -> next.summary,
    scalar metadata -> section_info.legacy, indented Sigma/YAML/shell blocks in prose -> code
    blocks (yaml, bash, sh) with a prose lead-in kept, suspended-hyphen rule narrowed
    (to-detection is a wrap, not "to"), code-apostrophe fix escapes instead of producing a
    SyntaxError. prose_content part_N_slug with heading/body was already handled; the dry-run
    failures came from what_you_learned. chapter_11_index's topic-list layout is mapped onto the
    other indexes' layout (convert_index.topic_layout; check_index restates the map and counts
    307/307 values). regression.py now covers every regression/chNN_v1 folder (ch10, ch11).
  chapter_12_done: >
    PR 15. Converter shapes added: list-shaped reference_materials (table: N -> table_N),
    deliverables (id/name -> deliverable_N, name as filename and heading) and common_mistakes
    (id -> mistake_N), matching the merged chapter 9 ids and headings exactly; and a wrap-width
    rule - one line more than 1.3x the next-longest (an in-place edit never re-wrapped) does not
    set the width (12.09 part 6 stayed prose). check.py now accounts for list-shaped slots
