record: V2_MIGRATION_HANDOFF
title: AI Security Mastery v2 - Migration Handoff
version: 1.14.0
updated: 2026-11-27
status: active
purpose: >
  Everything a new session needs to continue the v2 migration of ruwgxo/ai-security-mastery
  without this conversation. From 1.7.1 it lives in the v2 branch at
  migration_kit/handoff.yaml, next to the tools and regression fixtures, so a chapter
  session needs only the repository and the name of the next chapter.

  1.14.0 records PR 34's merge (d3ddbb8) and PR 35 (chapter 6, open from v2-ch06). Chapter 6 needed three
  small extensions: deliverables.items records keep their own id (D01 ...) as the artifact block id;
  a prose line naming the HTML comment delimiters <!-- and --> is not a diagram arrow; check.py no
  longer reads a string section_summary as chapter 5's closing note. chapter_pdf.py records the
  " - " joiner of a titled callout and treats a callout's variant as its label (chapter 6's key
  points); chapters 5, 7, 8, 11 and 14 still PASS. Chapter 6 regression fixtures added; regression
  covers 178 files (chapters 5 to 8 and 10 to 18). The owner's decision on PR 32 question 1 (YAML
  written as text must not render as code) is implemented in a follow-up PR from v2-ch05-structure,
  stacked on v2-ch06: converter, checker, a restructuring tool, chapter 5 re-run (form only) and
  updated chapter 5 fixtures. Chapter 6 has no YAML written as text, so its output is identical
  under both converters.

  1.13.2 records PR 33's merge (faf3c7f; 1.13.1 still listed it as open) and the deletion of the
  v2-ch05 and v2-ch05-followup branches. No tool or fixture changes.

  1.13.1 records PR 32's merge (2ff0dd2) and PR 33 (chapter 5 follow-up, open from
  v2-ch05-followup), which settles PR 32's questions 2-7. No tool or fixture changes.

  1.13.0 records PR 31's merge (9bf98b2) and PR 32 (chapter 5, open from v2-ch05). The converter and
  checker gain chapter 5's layout (section_content subsections; a YAML mapping written as text over
  several paragraphs stays one verbatim yaml code block, and sibling indented entries merge;
  implementations.purpose -> description; code-less titled deliverable_NN records -> artifacts;
  takeaway_NN -> ordered takeaways; section_summary.next_section -> next; document_info *_note ->
  an overview part; a closing top-level note -> a part). check.py compares a code block holding v1
  text verbatim under v1's normalisation and checks takeaway numbering. run_deliverables.py reads v1
  implementations. chapter_pdf.py draws emoji with a monochrome emoji font (EMOJI_FONT) and fixes
  reportlab's ToUnicode for characters beyond U+FFFF; chapters 7-18 still PASS. Chapter 5 regression
  fixtures added; regression covers 159 files (chapters 5, 7, 8 and 10 to 18).

  1.12.1 records PR 30's merge (1bccfa7; 1.12.0 still listed it as open) and the deletion of the
  v2-ch07, v2-ch08 and v2-atlas-consistency branches. No tool or fixture changes.

  1.12.0 records PR 29's merge (8abe98e; 1.11.0 still listed it as open) and PR 30 (chapter 7, open
  from v2-ch07). The converter and checker gain chapter 7's layout (family C: content.opening and
  content.subsections, code_examples, exercises, cross_references, section_metadata, document_info
  prerequisites/leads_to, a top-level mapping beside content such as 7.13 catalog_design, 7.15's
  content extras) plus two paragraph rules (a ``` fenced paragraph stays a verbatim code block; a
  wrapped prose line that only starts with an arrow stays prose). run_deliverables.py reads v1
  code_examples and filename folders (code/ch07/). render_md.py accepts a next slot without a title.
  Chapter 7 regression fixtures added; regression covers 143 files (chapters 7, 8 and 10 to 18).
  chapter_pdf.py PASSes chapter 7 unchanged.

  1.11.0 records PR 28's merge (de58461; 1.10.3 still listed it as open) and PR 29 (chapter 8, open
  from v2-ch08). The converter and checker gain chapter 8's two shapes: reference items with no
  columns/rows (record lists -> a table with row_keys in legacy, or fields blocks per record with
  subject_key in legacy; other bodies -> parts) and code-less deliverables that describe an artifact
  (-> artifacts, one fields block each). Chapter 8 regression fixtures added; regression covers 127
  files (chapters 8 and 10 to 18). chapter_pdf.py PASSes chapter 8 unchanged.

  1.10.3 records PR 27's merge (623b821, also a squash, so main is still not an ancestor of v2 -
  the repository squash-merges every PR; see main_vs_v2 for the release-time fix) and PR 28 (open
  into v2 from v2-atlas-consistency), which settles what PR 23 left inconsistent in chapters 10-12
  (decision below, under known_by_chapter.pr23_followup_done).

  1.10.2 records PR 26's merge (a879441, a squash, so main's f19036d was not recorded as merged)
