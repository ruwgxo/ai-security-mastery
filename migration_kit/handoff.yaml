record: V2_MIGRATION_HANDOFF
title: AI Security Mastery v2 - Migration Handoff
version: 1.8.0
updated: 2026-11-12
status: active
purpose: >
  Everything a new session needs to continue the v2 migration of ruwgxo/ai-security-mastery
  without this conversation. From 1.7.1 it lives in the v2 branch at
  migration_kit/handoff.yaml, next to the tools and regression fixtures, so a chapter
  session needs only the repository and the name of the next chapter.

  1.8.0 records PR 20's merge (f60e79a) and PR 21 (chapter 16, open), the converter and
  checker extensions chapter 16 needed (assessment -> exercises; table cells keep leading
  numbers in the checker) and chapter 16 regression fixtures. Regression now covers 94 files
  (chapters 10 to 16). Chapter 17 dry-runs clean with the 1.8.0 tools.

  1.7.1 moves the kit into v2 (migration_kit/), records PR 19's merge (cb3f7c2) and adds the
  chapter 15 regression fixtures from git (v1 at cc50304, form commit f97f24b); the 1.6.1
  tools reproduce them, so chapter 15 needed no converter change. The chapter 15 session's
  own handoff (1.7.0) was lost; its notes below come from PR 19's commits.

  1.6.1 records PR 18's merge (cc50304), adds tools/chapter_pdf.py with the review-PDF step,
  and the public-history rule. 1.6.0 records PR 18 (chapter 14, open), chapter 14 regression fixtures (77 files), and a
  run_deliverables.py fix for a filename shared by two sections. 1.5.1 records PR 17's merge (4d37be2) and adds chapter 14 dry-run detail. 1.5.0 records
  PR 17 (chapter 13, open), PR 16's merge (4f98bdc), the converter and checker
  extension chapter 13 needed (key_terms as "Term: definition" strings), chapter 13 regression
  fixtures (64 files) and a chapter 14 dry run with the 1.5.0 tools. 1.4.2 records PR 16 (fixes for PR 15 questions 1-3). 1.4.1 records PR 15's merge (2e2170d) and confirms the chapter 13 dry run with the 1.4.0
  tools. 1.4.0 records PR 15 (chapter 12, open), the converter and checker extensions chapter 12
  needed (list-shaped slots, over-long-line wrap width), chapter 12 regression fixtures, and
  PR 14's merge (093a5f7). 1.3.2 records PR 14 (portfolio goals, evergreen), the owner's
  Track 8 decision and a fresh chapter 12 dry run. 1.3.1 records PR 13's merge (4b1f6d9). 1.3.0 was written by the chapter 11 chat from 1.2.1. It records PR 13 (chapter 11), the
  converter and checker extensions chapter 11 needed, and chapter 11 regression fixtures.
  It still does NOT contain the converter extensions the chapter 9 chat made (see
  open_items).

private:
  rule: >
    The YAML Markup Standard and the book profile are private and are NOT in the repository or
    in migration_kit/. The tools and this handoff carry everything a chapter session needs;
    the owner supplies either file only if a session asks for it. Never commit them, never quote
    their rules in a commit, PR or comment, and never push them to any branch. PR #7 leaked a
    draft once; it is closed and its branch emptied, and GitHub Support can purge
    refs/pull/7/head if the owner asks.
  files:
    - standard/20261015__YAML_Markup_Standard_by_Raghav_Dinesh.yaml (2.0.0, final, schema built in; replaces 1.1.0)
    - profile/20261012__AI_Security_Mastery_Book_Profile_by_Raghav_Dinesh.yaml (1.0.0, locked for v2)

decisions:
  - Commit messages and PR descriptions are public history. They say what changed in the book and why, for a reader of the repository. No working notes, no talk about the session, tools, handoff, bundle, chats or owner questions. Those go in this handoff (open_items) and in the message to the owner.
  - v2 is the structural migration only, in the layout reviewed in PR 8. Advanced 1.1.0 features (book manifest, written headings, generated numbering, alt text, math blocks) wait for v3.
  - Content may be improved, not only reformatted. The restriction is against losing anything, not against fixing things. Content fixes go in their own commit, separate from the form-only migration commit, and every fix is listed in the PR.
  - Only YAML files for records and specifications going forward. The standard is one file, with the schema under its schema key.
  - The repo holds book content only, with one temporary exception - migration_kit/ in the v2 branch (tools, regression fixtures, this handoff). It must be deleted from v2 in its own commit before v2 merges to main, so main and v2.0.0 never carry it.
  - The standard is published later together with the rendering tool, in its own repo, under the owner's control.
  - Ask before anything outward-facing beyond PRs - tags, releases, repo settings.

