    (worked calculations, arrow diagrams) becoming text code blocks, and list values inside
    fields entries. Review these by hand. section_01_11 and section_03_02 have a stray trailing
    document marker.
  chapters_5_6: >
    deliverables means produced output files there; code lives under implementations. The
    converter maps implementations to deliverables and deliverables.items to artifacts.
  chapters_9_11: >
    15 genuine doubled-apostrophe bugs in Python strings ('I''m sorry', 'Track 7''s') that print
    wrongly. The converter fixes only these, writing an escaped apostrophe (a backslash before
    the apostrophe, as chapter 9 did), and lists them. Chapter 11's six are done.
  chapter_11_done: >
