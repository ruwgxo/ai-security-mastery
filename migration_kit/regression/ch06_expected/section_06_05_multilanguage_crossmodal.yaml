section_summary:
  compact: >
    Section 6.5 extended the injection surface map from the four surfaces in Section 6.1 to the full
    multimodal attack surface. Alignment is language-specific: RLHF training skews toward English,
    and low-resource languages have demonstrably weaker alignment reinforcement. English-only
    classifiers have blind spots for every non-English language the model supports. The multilingual
    injection test protocol quantifies these gaps per language; per-language threshold calibration
    is the production response.

    Each modality addition is an independent injection surface expansion. Image OCR, audio
    transcription, document text extraction, code interpreter input and output, and every other
    pipeline that delivers text to the LLM context bypasses the text-input classifier entirely. The
    architecture response is to deploy the injection classifier as a shared service called at every
    text-to-context entry point -- not once, at the user input layer.

    Sections 6.6 through 6.10 develop the five indirect injection surfaces in full technical depth:
    RAG, web, email, database, and code assistant. The multimodal surface map from Section 6.5.5 is
    the index that Section 6.18's injection defence architecture diagram completes.
  key_takeaways:
    style: ordered
    items:
      - >
        Alignment is language-specific. RLHF training skews toward English; low-resource languages
        have sparse alignment reinforcement. English-only classifiers have systematic blind spots
        for every non-English language the model supports.
      - >
        Language-switching mid-conversation targets alignment gaps. The adversary establishes
        context in English, then switches to a lower-alignment language for the injection payload.
        Detection requires per-language classifier calibration.
      - >
        Each modality added creates an independent injection surface with zero coverage from
        text-layer defences. Image OCR, audio transcription, document extraction, code comments, and
        code execution output all deliver text to the LLM context through pathways that bypass
        text-input classifiers.
      - >
        PDF hidden content -- white text on white background, metadata fields, annotations -- is
        extracted faithfully by document processing pipelines and reaches the LLM context even if
        the rendered document appears benign. Source trust is not a substitute for classifier
        coverage.
      - >
        Code interpreter deployments have two injection surfaces: code input (comment and string
        literal content) and code execution output. Both require classifier coverage; neither is
        addressed by the user-turn text classifier.
      - >
        The injection classifier must function as a shared service called at every text-to-context
        entry point, not as a single deployment at the user input layer. Each new modality adds a
        new call point.
      - >
        Multilingual detection prioritises the highest-risk language subset. The multilingual
        injection test protocol quantifies per-language alignment gaps; the gap measurement drives
        per-language threshold calibration rather than treating all languages uniformly.
      - >
        With multiple classifier calls per request, per-call latency budget decreases
        proportionally. The 50ms P99 target shared across four classifier calls means 12ms per call
        -- constraining classifier model size and motivating distilled implementations.
