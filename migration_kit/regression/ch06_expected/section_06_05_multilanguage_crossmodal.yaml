learning_objectives:
  intro: >
    Map every injection surface added by language diversity and modality expansion, understand why
    alignment is language-specific and modality-specific, and build the detection coverage gap
    analysis for multimodal deployments that grows with each new capability added.
  groups:
    by_end_of_section:
      - 'Explain why alignment training gaps exist in non-English and low-resource languages'
      - 'Describe language-switching mid-conversation as an injection technique targeting alignment gaps'
