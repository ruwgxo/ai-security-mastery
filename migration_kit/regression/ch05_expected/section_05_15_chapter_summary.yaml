deliverables:
  - heading: 'Enterprise LLM Threat Model Generator (STRIDE)'
    id: implementation_01
    filename: enterprise_threat_model.py
    lang: python
    description: >
      Complete STRIDE threat model generator for an LLM deployment. Takes a DeploymentConfig
      dataclass specifying system properties (RAG enabled, plugins enabled, public-facing, data
      sensitivity tier, etc.) and automatically populates all six STRIDE categories with applicable
      threats, OWASP/ATLAS mappings, controls, and residual risk notes. Exports a structured threat
      model report as YAML and a Markdown summary.
    code: |
      """
      Enterprise LLM Threat Model Generator — STRIDE for LLM deployments.
      Input: DeploymentConfig. Output: populated STRIDE threat model + risk register.
      """

      from dataclasses import dataclass, field
      from typing import List, Dict, Optional


      @dataclass
      class DeploymentConfig:
          name: str
          public_facing: bool = False
          rag_enabled: bool = False
          plugins_enabled: bool = False
          agentic: bool = False
          fine_tuned_on_sensitive_data: bool = False
          data_sensitivity: str = "general"   # general / user_data / financial / medical
          base_model_source: str = "huggingface"
          exposes_logprobs: bool = False
          llm_output_rendered_in_ui: bool = False


      @dataclass
      class STRIDEThreat:
          category: str
          threat_id: str
          description: str
          conditions: List[str]    # deployment attributes that trigger this threat
          owasp: List[str]
          atlas: List[str]
          likelihood: str
          impact: str
          preventive_controls: List[str]
          detective_controls: List[str]
          residual_risk: str


      THREAT_LIBRARY: List[STRIDEThreat] = [
          # SPOOFING
          STRIDEThreat("Spoofing", "S-001",
              "API key theft enables impersonation of authorised caller",
              [], ["LLM05"], ["AML.T0012"],
              "medium", "high",
              ["Short-lived API tokens; key rotation policy; IP allowlisting"],
              ["Auth log geo/time anomaly detection"],
              "Phishing of credentials — medium residual; mitigate with MFA"),
          # TAMPERING
          STRIDEThreat("Tampering", "T-001",
              "Direct prompt injection overrides system intent via user input",
              ["public_facing"], ["LLM01"], ["AML.T0051"],
              "high", "high",
              ["Input injection classifier; role separation in system/user prompts"],
              ["Injection classifier score > 0.7 on user input"],
              "Novel injection patterns — medium residual"),
          STRIDEThreat("Tampering", "T-002",
              "Indirect injection via retrieved document plants adversary instruction",
              ["rag_enabled"], ["LLM01"], ["AML.T0051.001"],
              "medium", "high",
              ["Injection scanner on RAG content before context assembly"],
              ["Injection scanner score > 0.6 on fetched content"],
              "Low FP — very low residual with scanner deployed"),
          STRIDEThreat("Tampering", "T-003",
              "Training data poisoning introduces backdoor in next model version",
              ["fine_tuned_on_sensitive_data"], ["LLM03"], ["AML.T0020", "AML.T0018"],
              "low", "critical",
              ["Dataset hash verification; label distribution monitoring; IAM on training data"],
              ["Unauthorised write to training data path; label KL divergence alert"],
              "Insider threat residual — transfer via SIEM alerting"),
          # REPUDIATION
          STRIDEThreat("Repudiation", "R-001",
              "Agentic action taken without attributable immutable audit record",
              ["agentic"], ["LLM08"], ["AML.T0053"],
              "medium", "medium",
              ["Every agent action generates immutable audit log with session context"],
              ["Missing action audit record alert"],
              "Log integrity — transfer via SIEM centralisation"),
          # INFORMATION DISCLOSURE
          STRIDEThreat("Information Disclosure", "I-001",
              "System prompt extracted via elicitation prompts",
              [], ["LLM06"], ["AML.T0056"],
              "high", "medium",
              ["System prompt non-disclosure instruction; input extraction phrase classifier"],
              ["Extraction phrase pattern match on input; system prompt fragment in output"],
              "Determined adversary with many queries — low residual with both controls"),
          STRIDEThreat("Information Disclosure", "I-002",
              "Training data verbatim recall exposes PII or credentials",
              ["fine_tuned_on_sensitive_data"], ["LLM06"], ["AML.T0037"],
              "medium", "high",
              ["DP training for fine-tuned versions; canary tokens in training data"],
              ["Output PII scanner; canary token recall event"],
              "Approximate recall not caught by PII scanner — medium residual"),
          STRIDEThreat("Information Disclosure", "I-003",
              "Model extraction campaign reconstructs proprietary model via API",
              ["public_facing"], ["LLM10"], ["AML.T0024.002", "AML.T0040"],
              "medium", "critical",
              ["Logprob disable for external callers; strict per-key rate limiting"],
              ["Volume + diversity + one-shot pattern detection per API key"],
              "Slow extraction under rate limit — medium residual; disable logprobs"),
          STRIDEThreat("Information Disclosure", "I-004",
              "LLM output contains unsanitised sensitive data rendered in UI (XSS vector)",
              ["llm_output_rendered_in_ui"], ["LLM02"], [],
              "medium", "high",
              ["Output sanitisation before UI rendering; content-type enforcement"],
              ["Output content scanner for script injection patterns"],
              "Novel rendering exploits — medium residual"),
          # DENIAL OF SERVICE
          STRIDEThreat("Denial of Service", "D-001",
              "Context flooding and sponge inputs exhaust compute and billing",
              [], ["LLM04"], ["AML.T0029"],
              "high", "medium",
              ["Hard token limit per request; per-key TPM rate limit; context budget"],
              ["Token rate 3x rolling average; cost per minute 3x baseline; p99 latency spike"],
              "Burst under rate limit — accept with billing alarm at 2x baseline"),
          # ELEVATION OF PRIVILEGE
          STRIDEThreat("Elevation of Privilege", "E-001",
              "Plugin confused deputy: adversary instructions trigger privileged plugin call",
              ["plugins_enabled"], ["LLM07"], ["AML.T0053"],
              "medium", "critical",
              ["Plugin parameter allowlist validation; minimal plugin permissions"],
              ["Plugin call parameter anomaly; irreversible action without confirmation record"],
              "Zero with correct allowlist implementation — target state"),
          STRIDEThreat("Elevation of Privilege", "E-002",
              "Excessive agency: model takes high-impact action beyond intended scope",
              ["agentic"], ["LLM08"], ["AML.T0053"],
              "medium", "critical",
              ["Irreversibility gate on high-impact actions; human confirmation for critical ops"],
              ["Action type in prohibited category without confirmation record"],
              "User-approved high-impact actions — accept with confirmation gate"),
      ]


      def generate_threat_model(cfg: DeploymentConfig) -> Dict:
          cfg_flags = {k: v for k, v in cfg.__dict__.items() if isinstance(v, bool) and v}
          applicable = []
          for t in THREAT_LIBRARY:
              if not t.conditions or any(c in cfg_flags for c in t.conditions):
                  applicable.append(t)

          by_category: Dict[str, List[STRIDEThreat]] = {}
          for t in applicable:
              by_category.setdefault(t.category, []).append(t)

          impact_rank = {"low": 1, "medium": 2, "high": 3, "critical": 4}
          risk_register = sorted(applicable,
              key=lambda t: -({"low":1,"medium":2,"high":3}[t.likelihood] *
                               impact_rank[t.impact]))

          return {
              "deployment": cfg.name,
              "config": cfg.__dict__,
              "threat_count": len(applicable),
              "by_category": {k: [t.__dict__ for t in v] for k, v in by_category.items()},
              "risk_register": [t.__dict__ for t in risk_register],
              "owasp_coverage": sorted(set(o for t in applicable for o in t.owasp)),
              "atlas_coverage": sorted(set(a for t in applicable for a in t.atlas)),
          }


      def print_threat_model(model: Dict) -> None:
          print(f"\n{'='*65}")
          print(f"ENTERPRISE LLM THREAT MODEL: {model['deployment']}")
          print(f"Threats identified: {model['threat_count']}")
          print(f"OWASP coverage: {model['owasp_coverage']}")
          print(f"ATLAS coverage: {model['atlas_coverage']}")
          for category, threats in model["by_category"].items():
              print(f"\n  {category} ({len(threats)} threats):")
              for t in threats:
                  print(f"    [{t['threat_id']}] {t['description'][:60]}")
                  print(f"           Likelihood: {t['likelihood']}  Impact: {t['impact']}")
                  print(f"           Detective: {t['detective_controls'][0][:55]}")


      def export_threat_model_yaml(model: Dict, path: str) -> None:
          import yaml
          with open(path, "w") as f:
              yaml.dump(model, f, allow_unicode=True, sort_keys=False)
          print(f"Threat model exported to {path}")


      if __name__ == "__main__":
          # Enterprise RAG deployment
          rag_cfg = DeploymentConfig(
              name="Enterprise-RAG-QA-Assistant",
              public_facing=False,
              rag_enabled=True,
              plugins_enabled=True,
              agentic=True,
              fine_tuned_on_sensitive_data=False,
              data_sensitivity="general",
              llm_output_rendered_in_ui=True,
          )
          model = generate_threat_model(rag_cfg)
          print_threat_model(model)
          export_threat_model_yaml(model, "enterprise_rag_threat_model.yaml")

          # Public-facing customer service bot (higher exposure)
          public_cfg = DeploymentConfig(
              name="Public-Customer-Service-LLM",
              public_facing=True,
              rag_enabled=True,
              plugins_enabled=False,
              agentic=False,
              fine_tuned_on_sensitive_data=True,
              data_sensitivity="user_data",
              exposes_logprobs=True,
              llm_output_rendered_in_ui=True,
          )
          model2 = generate_threat_model(public_cfg)
          print(f"\nPublic chatbot threats: {model2['threat_count']}")
          print(f"Additional vs RAG: {model2['threat_count'] - model['threat_count']} more threats triggered by public_facing + logprobs")
  - heading: 'Framework Integration Map + Risk Prioritisation Matrix'
    id: implementation_02
    filename: framework_integration_map.py
    lang: python
    description: >
      Two tools: (1) FrameworkIntegrationMap: for any given threat, returns the aligned OWASP LLM,
      ATLAS technique, NIST AI RMF function, and regulatory article. Supports querying by threat
      name, OWASP ID, or ATLAS technique ID. (2) RiskPrioritisationMatrix: scores all Chapter 5
      threats by likelihood × impact, adds detection effort, and computes ROI score. Outputs a
      sorted detection investment roadmap showing which threats to address first and why.
    code: |
      """
      Framework Integration Map + Risk Prioritisation Matrix
      Cross-framework lookup and detection investment ranking.
      """

      from dataclasses import dataclass, field
      from typing import List, Dict, Optional


      @dataclass
      class FrameworkEntry:
          threat_name: str
          owasp: List[str]
          atlas: List[str]
          nist_rmf_functions: List[str]
          eu_ai_act_articles: List[str]
          gdpr_articles: List[str]
          detection_control: str
          source_section: str


      FRAMEWORK_MAP: List[FrameworkEntry] = [
          FrameworkEntry("Prompt Injection (direct)",
              ["LLM01"], ["AML.T0051"],
              ["MEASURE_2.2 (testing)", "MEASURE_2.4 (monitoring)"],
              ["Article_15_cybersecurity"], ["Article_25_privacy_by_design"],
              "Injection classifier on input (score > 0.7)", "5.4 / 5.8"),
          FrameworkEntry("Indirect Prompt Injection via RAG",
              ["LLM01"], ["AML.T0051.001"],
              ["MEASURE_2.2", "MEASURE_2.4"],
              ["Article_15_cybersecurity", "Article_14_human_oversight"],
              ["Article_25_privacy_by_design"],
              "Injection scanner on retrieved content before context assembly", "5.4 / 5.8"),
          FrameworkEntry("Training Data Poisoning",
              ["LLM03"], ["AML.T0020", "AML.T0018"],
              ["MAP (risk identification)", "MEASURE_2.1", "MANAGE (mitigate)"],
              ["Article_10_data_governance", "Article_15_cybersecurity"],
              ["Article_5_data_integrity"],
              "Dataset hash monitor; label KL divergence alert", "5.5 / 5.8"),
          FrameworkEntry("Model Denial of Service",
              ["LLM04"], ["AML.T0029"],
              ["MEASURE_2.4 (monitoring)", "MANAGE (mitigate)"],
              ["Article_15_accuracy_robustness"],
              [],
              "Token rate + billing cost anomaly (3x rolling avg)", "5.5 / 5.8"),
          FrameworkEntry("Supply Chain Compromise",
              ["LLM05"], ["AML.T0019", "AML.T0011"],
              ["MAP (supply chain risk)", "MEASURE_2.2 (artifact testing)"],
              ["Article_10_data_governance", "Article_15_cybersecurity"],
              ["Article_30_records_of_processing"],
              "SafeTensors format check + SHA-256 verification", "5.9"),
          FrameworkEntry("Sensitive Information Disclosure (PII)",
              ["LLM06"], ["AML.T0037", "AML.T0056"],
              ["MEASURE_2.1", "MEASURE_2.4", "MANAGE (DP training)"],
              ["Article_15_cybersecurity", "Article_9_risk_management"],
              ["Article_17_erasure", "Article_25_privacy_by_design", "Article_35_DPIA"],
              "Output PII scanner + canary token recall monitor", "5.10"),
          FrameworkEntry("Insecure Plugin Design / Confused Deputy",
              ["LLM07"], ["AML.T0053"],
              ["MEASURE_2.4 (action audit)", "MANAGE (plugin allowlist)"],
              ["Article_14_human_oversight"],
              ["Article_22_automated_decisions"],
              "Plugin parameter allowlist; irreversible action gating", "5.6 / 5.8"),
          FrameworkEntry("Excessive Agency",
              ["LLM08"], ["AML.T0053"],
              ["MEASURE_2.4", "MANAGE (mitigate)"],
              ["Article_14_human_oversight"],
              ["Article_22_automated_decisions"],
              "Action-type allowlist; human confirmation for high-impact ops", "5.6"),
          FrameworkEntry("Hallucination / Overreliance",
              ["LLM09"], [],
              ["MEASURE_2.1 (risk analysis)", "MEASURE_2.3 (evaluation)"],
              ["Article_15_accuracy"],
              ["Article_22_automated_decisions"],
              "Factual consistency check; confidence score calibration monitoring", "5.6"),
          FrameworkEntry("Model Theft / Extraction",
              ["LLM10"], ["AML.T0025", "AML.T0035", "AML.T0040"],
              ["MEASURE_2.4 (API monitoring)", "MANAGE (mitigate)"],
              ["Article_15_cybersecurity"],
              [],
              "Volume + diversity + one-shot anomaly; bulk download threshold", "5.8"),
          FrameworkEntry("Membership Inference Attack",
              [], ["AML.T0048"],
              ["MEASURE_2.1 (MIA AUC)", "MANAGE (DP training + output perturbation)"],
              ["Article_9_risk_management", "Article_15_cybersecurity"],
              ["Article_25_privacy_by_design", "Article_35_DPIA"],
              "LR MIA self-assessment; output confidence masking; DP training", "5.11"),
          FrameworkEntry("Bias / Disparate Impact Exploitation",
              [], [],
              ["MEASURE_2.1 (exploitability score)", "MEASURE_2.3 (fairness eval)"],
              ["Article_9_risk_management", "Article_10_data_representative"],
              ["Article_22_automated_decisions", "Article_25_privacy_by_design"],
              "Per-group FNR monitoring; four-fifths rule compliance; bias audit", "5.12"),
      ]


      def lookup_by_owasp(owasp_id: str) -> List[FrameworkEntry]:
          return [e for e in FRAMEWORK_MAP if owasp_id in e.owasp]


      def lookup_by_atlas(atlas_id: str) -> List[FrameworkEntry]:
          return [e for e in FRAMEWORK_MAP if atlas_id in e.atlas]


      def lookup_by_threat(keyword: str) -> List[FrameworkEntry]:
          kl = keyword.lower()
          return [e for e in FRAMEWORK_MAP if kl in e.threat_name.lower()]


      def print_framework_entry(e: FrameworkEntry) -> None:
          print(f"\n  Threat: {e.threat_name}")
          print(f"    OWASP:        {e.owasp}")
          print(f"    ATLAS:        {e.atlas}")
          print(f"    NIST AI RMF:  {e.nist_rmf_functions}")
          print(f"    EU AI Act:    {e.eu_ai_act_articles}")
          print(f"    GDPR:         {e.gdpr_articles}")
          print(f"    Detection:    {e.detection_control[:60]}")
          print(f"    Sections:     {e.source_section}")


      # -----------------------------------------------------------------------
      # Risk Prioritisation Matrix
      # -----------------------------------------------------------------------

      @dataclass
      class PriorityEntry:
          threat_name: str
          atlas_id: str
          likelihood: int     # 1-3
          impact: int         # 1-4
          effort_days: float  # implementation effort
          roi_score: float    # (likelihood * impact) / effort_days

          @property
          def priority_score(self) -> int:
              return self.likelihood * self.impact


      PRIORITY_TABLE: List[PriorityEntry] = [
          PriorityEntry("Supply chain RCE (AML.T0019)",          "AML.T0019", 2, 4, 1.0,  0.0),
          PriorityEntry("Denial of service (AML.T0029)",         "AML.T0029", 3, 3, 1.5,  0.0),
          PriorityEntry("Direct prompt injection (AML.T0051)",   "AML.T0051", 3, 3, 2.5,  0.0),
          PriorityEntry("Plugin confused deputy (AML.T0053)",    "AML.T0053", 2, 4, 1.5,  0.0),
          PriorityEntry("System prompt extraction (AML.T0056)",  "AML.T0056", 3, 2, 1.0,  0.0),
          PriorityEntry("Model extraction (AML.T0024.002)",          "AML.T0024.002", 2, 4, 3.5,  0.0),
          PriorityEntry("Indirect injection via RAG (AML.T0051.001)","AML.T0051.001", 2, 3, 2.5,  0.0),
          PriorityEntry("Insider artifact theft (AML.T0035)",    "AML.T0035", 1, 4, 1.0,  0.0),
          PriorityEntry("Training data poisoning (AML.T0020)",   "AML.T0020", 1, 4, 4.0,  0.0),
          PriorityEntry("Verbatim recall (AML.T0037)",           "AML.T0037", 2, 3, 4.0,  0.0),
          PriorityEntry("Membership inference (AML.T0048)",      "AML.T0048", 2, 3, 5.0,  0.0),
          PriorityEntry("Backdoor (AML.T0018)",                  "AML.T0018", 1, 4, 7.5,  0.0),
          PriorityEntry("Bias FNR disparity exploitation",       "N/A",       2, 3, 3.0,  0.0),
          PriorityEntry("Excessive agency (AML.T0053)",          "AML.T0053", 2, 4, 1.5,  0.0),
      ]

      for e in PRIORITY_TABLE:
          e.roi_score = round(e.priority_score / max(e.effort_days, 0.5), 2)


      def print_priority_matrix() -> None:
          sorted_p = sorted(PRIORITY_TABLE, key=lambda e: -e.roi_score)
          print(f"\n{'='*70}")
          print(f"RISK PRIORITISATION MATRIX (sorted by ROI = priority_score / effort_days)")
          print(f"{'Threat':40s}  {'P*I':>4}  {'Effort':>7}  {'ROI':>6}")
          print("-" * 70)
          for i, e in enumerate(sorted_p, 1):
              tier = "CRITICAL" if e.priority_score >= 8 else "HIGH" if e.priority_score >= 6 else "MEDIUM"
              print(f"{i:2d}. {e.threat_name[:38]:38s}  {e.priority_score:>4d}  "
                    f"{e.effort_days:>5.1f}d  {e.roi_score:>6.2f}  [{tier}]")


      if __name__ == "__main__":
          print("FRAMEWORK INTEGRATION MAP — Lookup Examples")
          print("="*55)
          print("\nQuery: OWASP LLM01")
          for e in lookup_by_owasp("LLM01"):
              print_framework_entry(e)
          print("\nQuery: AML.T0019")
          for e in lookup_by_atlas("AML.T0019"):
              print_framework_entry(e)
          print_priority_matrix()
  - heading: 'Chapter 5 Knowledge Assessment Quiz (20 Questions)'
    id: implementation_03
    filename: chapter5_quiz.py
    lang: python
    description: >
      Interactive 20-question knowledge assessment covering all five Chapter 5 thematic blocks.
      Questions span definition (Bloom L1), comprehension (L2), application (L3), and analysis (L4)
      levels. Displays per-question feedback, section reference for incorrect answers, and final
      score with pass/fail. Target: 80% (16/20) before proceeding to Chapter 6.
    code: |
      """
      Chapter 5 Knowledge Assessment Quiz — 20 questions, 4 difficulty levels.
      Target: >= 80% (16/20) to proceed to Chapter 6.
      """

      from dataclasses import dataclass
      from typing import List, Optional


      @dataclass
      class Question:
          q_id: int
          block: str
          level: str        # L1-Definition / L2-Comprehension / L3-Application / L4-Analysis
          question: str
          options: List[str]
          correct: int      # 0-indexed
          explanation: str
          section_ref: str


      QUIZ: List[Question] = [
          # Block 1: Paradigm shift and attack surface
          Question(1, "Block 1", "L1-Definition",
              "Which of the following is NOT part of the eight-layer AI attack surface?",
              ["Training data", "Model API", "Network firewall rules", "Plugins and tools"],
              2,
              "Network firewall rules are traditional IT security. The eight AI attack surface layers span the ML lifecycle: training data, model weights, training pipeline, model API, prompt/context, output, plugins/tools, feedback/RLHF.",
              "Section 5.2"),
          Question(2, "Block 1", "L2-Comprehension",
              "Why is 'training data is code' the most important mental model shift in AI security?",
              ["Because training data is written in Python",
               "Because malicious training data executes arbitrary adversary intent persistently through model weights",
               "Because training data is stored in code repositories",
               "Because code is used to collect training data"],
              1,
              "Training data shapes model behaviour. Poisoned training data introduces persistent adversary influence — like a backdoor that survives retraining. This is not possible in traditional software where data and code are separate.",
              "Section 5.1 / 5.9"),
