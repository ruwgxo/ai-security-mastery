              "Section 5.11.1"),
          Question(13, "Block 4", "L3-Application",
              "A model is fine-tuned on 50 customer support transcripts with 30 training epochs. What memorisation risk level would you expect and why?",
              ["Low — small dataset means less memorisation",
               "Medium — depends on model size",
               "High — small dataset with many epochs means each example receives many gradient updates, near-certain memorisation",
               "Negligible — RLHF fine-tuning prevents memorisation"],
              2,
              "Fine-tuning amplification: 50 documents × 30 epochs = each document receives gradient updates equivalent to appearing 30x in training data. Near-certain memorisation. Small sensitive datasets with many epochs are the highest-risk fine-tuning scenario.",
              "Section 5.10.3 / 5.10.4"),
          Question(14, "Block 4", "L4-Analysis",
              "An organisation fine-tunes an LLM on clinical trial data and plans to satisfy GDPR Article 17 erasure requests by 'deleting the training data file'. Why is this insufficient?",
              ["The training data file must be deleted from all backups",
               "The model weights encode the clinical trial data — deleting the source file does not remove memorised content from the deployed model",
               "GDPR Article 17 only applies to databases, not ML models",
               "The training data file deletion triggers automatic model retraining"],
              1,
              "GDPR Article 17 erasure applies to all personal data processing. The model weights are a derivative form of the training data — verbatim recall means personal data is still retrievable from the deployed model. Only DP training or full retraining without the data satisfies the erasure obligation technically.",
              "Section 5.10.6 / 5.13.4"),
          # Block 5: Bias, regulatory, NIST AI RMF
          Question(15, "Block 5", "L1-Definition",
              "Which EU AI Act tier creates full conformity assessment obligations including documented technical controls?",
              ["Tier 1 (Unacceptable Risk)", "Tier 2 (High Risk)", "Tier 3 (Limited Risk)", "Tier 4 (Minimal Risk)"],
              1,
              "High-Risk (Tier 2) AI systems require the five technical obligations under Articles 9-15: risk management system, data governance, technical documentation, human oversight, and accuracy/robustness/cybersecurity.",
              "Section 5.13.1 / 5.13.2"),
          Question(16, "Block 5", "L2-Comprehension",
              "Why does the NIST AI RMF GOVERN function have to be established before MAP, MEASURE, and MANAGE?",
              ["GOVERN is alphabetically first",
               "Without policies and role assignments, MAP-identified risks are un-owned and MEASURE outputs have no decision authority to act on them",
               "GOVERN generates the training data used in other functions",
               "The EU AI Act requires GOVERN documentation first"],
              1,
              "GOVERN creates the organisational authority structure. Without it: alerts from MEASURE have no owner, risk register entries from MAP have no approver, and MANAGE treatment decisions have no signatory. Technical work without governance authority produces findings nobody acts on.",
              "Section 5.14.1 / 5.14.2"),
          Question(17, "Block 5", "L3-Application",
              "A fraud detector has FNR=5% for Group A and FNR=18% for Group B. What is the four-fifths FNR ratio and what does it imply?",
              ["Ratio = 0.28 — below 0.80 threshold, disparate impact finding and adversarially exploitable bias",
               "Ratio = 3.6 — above 1.0, no disparate impact",
               "Ratio = 0.72 — within 0.80 threshold, no action needed",
               "Ratio = 0.28 — below threshold but only a fairness issue, not a security issue"],
              0,
              "FNR ratio = min(0.05, 0.18) / max(0.05, 0.18) = 0.05/0.18 = 0.28. Below 0.80 = disparate impact finding. Security implication: adversaries who discover FNR=18% for Group B can craft transactions to exploit this 13 percentage point advantage in miss rate.",
              "Section 5.12.4 / 5.12.3"),
          Question(18, "Block 5", "L4-Analysis",
              "An engineer says 'our EU AI Act Article 15 compliance documentation is complete so our model is cybersecure.' What is wrong with this statement?",
              ["Article 15 does not cover cybersecurity",
               "EU AI Act documentation was not yet required",
               "Compliance documentation describes controls; it does not deploy, tune, or monitor them — documentation without operational controls provides no security protection",
               "The engineer should have said 'GDPR Article 25' instead"],
              2,
              "This is the compliance-as-floor fallacy. Article 15 requires 'appropriate measures' — documentation describes intended controls. An adversary does not read compliance documents; they probe the deployed system. Only deployed, tested, and monitored controls provide security protection.",
              "Section 5.13.7"),
          # Synthesis
          Question(19, "Synthesis", "L4-Analysis",
              "A startup deploys a public-facing LLM fine-tuned on customer emails. Which single section from Chapter 5 provides the highest immediate security ROI for this deployment?",
              ["Section 5.7 (MITRE ATLAS framework overview)",
               "Section 5.9 (AI Supply Chain — SafeTensors format check at intake)",
               "Section 5.13 (Regulatory Landscape)",
               "Section 5.10 (Training Data Extraction — DP training and output scanner)"],
              3,
              "The deployment is fine-tuned on PII (customer emails) and public-facing. The highest immediate risk is verbatim recall of customer email content in public outputs — a GDPR breach, reputational disaster, and immediate threat. Section 5.10's DP training and output PII scanner directly address this. SafeTensors (5.9) is important but internal; regulatory (5.13) is compliance, not immediate protection.",
              "Section 5.10 (with 5.9 as close second)"),
          Question(20, "Synthesis", "L4-Analysis",
              "A CISO asks: 'We already run penetration tests. Why do we need a separate bias audit?' What is the correct response?",
              ["Bias audits are required by the EU AI Act so we need them for compliance",
               "Bias audits find different attack surfaces — the FNR disparity between demographic groups is an adversarially exploitable pattern that standard penetration tests do not enumerate",
               "Bias audits replace penetration tests for ML systems",
               "We do not need both — penetration testing covers bias exploitation implicitly"],
              1,
              "Bias auditing is penetration testing from a different angle. Standard pentests probe API security and input validation. They do not systematically enumerate per-group error rates. A fraud detector with FNR=18% for one group is exploitable — and this exploitation vector is only found by a group fairness audit, not by a standard pentest.",
              "Section 5.12.1 / 5.12.4"),
      ]


      def run_quiz(interactive: bool = True) -> None:
          score = 0
          results = []
          print(f"\n{'='*60}")
          print(f"CHAPTER 5 KNOWLEDGE ASSESSMENT — 20 Questions")
          print(f"Target: >= 16/20 (80%) to proceed to Chapter 6")
          print(f"{'='*60}\n")

          for q in QUIZ:
              print(f"Q{q.q_id:2d} [{q.block} — {q.level}]")
              print(f"   {q.question}")
              for i, opt in enumerate(q.options):
                  print(f"   {i+1}. {opt}")

              if interactive:
                  try:
                      ans = int(input("   Your answer (1-4): ").strip()) - 1
                  except (ValueError, KeyboardInterrupt):
                      ans = -1
              else:
                  ans = q.correct   # auto-answer for testing

              correct = ans == q.correct
              if correct:
                  score += 1
                  print(f"   CORRECT")
              else:
                  print(f"   INCORRECT — Answer: {q.correct+1}. {q.options[q.correct]}")
              print(f"   Explanation: {q.explanation[:100]}")
              print(f"   Reference: {q.section_ref}\n")
              results.append({"q_id": q.q_id, "correct": correct, "block": q.block})

          pct = score / len(QUIZ) * 100
          print(f"{'='*60}")
          print(f"FINAL SCORE: {score}/{len(QUIZ)} ({pct:.1f}%)")
          if pct >= 80:
              print(f"PASS — Ready to proceed to Chapter 6: Prompt Injection")
          else:
              missed = [r["section_ref"] if "section_ref" in r else "" for r in results if not r["correct"]]
              print(f"REVIEW REQUIRED — Score below 80%. Revisit sections before Chapter 6.")
          by_block: Dict[str, List] = {}
          for r in results:
              by_block.setdefault(r["block"], []).append(r["correct"])
          print(f"\nPer-block breakdown:")
          for block, corrects in by_block.items():
              b_pct = sum(corrects) / len(corrects) * 100
              print(f"  {block}: {sum(corrects)}/{len(corrects)} ({b_pct:.0f}%)")


      if __name__ == "__main__":
          run_quiz(interactive=False)   # set interactive=True for real use
