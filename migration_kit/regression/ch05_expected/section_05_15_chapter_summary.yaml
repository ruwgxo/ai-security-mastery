prose_content:
  - number: '5.15.1'
    heading: 'Chapter 5 Review: Five Thematic Blocks'
    id: subsection_01
    blocks:
      - type: fields
        subject: 'Chapter 5 Review: Five Thematic Blocks'
        entries:
          - label: 'Review Structure'
            value: >
              Fourteen sections of technical content benefit from a structured review before
              synthesis. Chapter 5 divides naturally into five thematic blocks. Each block produces
              a distinct set of mental models and tools that the enterprise threat model integrates.
    parts:
      - heading: 'Block 01 Paradigm Shift and Attack Surface'
        id: block_01_paradigm_shift_and_attack_surface
        blocks:
          - type: fields
            subject: 'Block 01 Paradigm Shift and Attack Surface'
            entries:
              - label: Sections
                value: '5.1 — 5.2'
              - label: 'Core Insight'
                value: >
                  AI systems fail differently from traditional software. The attack surface is not a
                  set of code paths — it is eight interconnected layers spanning the full ML
                  lifecycle. The key mental models: (1) training data is code, (2) model weights are
                  executables, (3) context is a trust boundary, and (4) the model's statistical
                  behaviour is the attack surface, not its API.
          - type: fields
            subject: 'Five Ways Ai Differs From Traditional Security'
            id: five_ways_ai_differs_from_traditional_security
            entries:
              - label: 'Diff 01'
                value: 'Training pipeline is attack surface — threats exist before deployment'
              - label: 'Diff 02'
                value: 'Statistical behaviour, not code paths, is exploited — no CVE for a bias'
              - label: 'Diff 03'
                value: 'Attacks operate in semantic space, not binary space — meaning is the vector'
              - label: 'Diff 04'
                value: >
                  Data provenance is a security property — untrusted training data = persistent
                  vulnerability
              - label: 'Diff 05'
                value: 'The model generalises and memorises — privacy leaks are probabilistic, not deterministic'
          - type: fields
            subject: 'Eight Layer Attack Surface'
            id: eight_layer_attack_surface
            entries:
              - label: 'Layer 1'
                value: 'Training data (poisoning, contamination)'
              - label: 'Layer 2'
                value: 'Model weights (theft, tampering, backdoor)'
              - label: 'Layer 3'
                value: 'Training pipeline (supply chain, code injection)'
              - label: 'Layer 4'
                value: 'Model API (extraction, DoS, prompt injection)'
              - label: 'Layer 5'
                value: 'Prompt and context (injection, leakage)'
              - label: 'Layer 6'
                value: 'Output and downstream (insecure output handling)'
              - label: 'Layer 7'
                value: 'Plugins and tools (confused deputy, agency escalation)'
              - label: 'Layer 8'
                value: 'Feedback and RLHF (reward hacking, preference poisoning)'
      - heading: 'Block 02 Owasp Llm Top10'
        id: block_02_owasp_llm_top10
        blocks:
          - type: fields
            subject: 'Block 02 Owasp Llm Top10'
            entries:
              - label: Sections
                value: '5.3 — 5.6'
              - label: 'Core Insight'
                value: >
                  OWASP LLM Top 10 is the practitioner checklist for LLM deployments. The ten risks
                  span three attack categories: input-side (LLM01-LLM03), output-side (LLM02,
                  LLM09), and architecture-side (LLM04-LLM10). The security engineering contribution
                  is the 20-rule detection registry that maps each risk to an API-log-based
                  detection rule.
          - type: fields
            subject: 'Top10 One Line Each'
            id: top10_one_line_each
            entries:
              - label: Llm01
                value: 'Prompt Injection — user input overrides system intent; detect via injection classifier'
              - label: Llm02
                value: >
                  Insecure Output Handling — model output rendered without sanitisation; detect via
                  output content scanner
              - label: Llm03
                value: >
                  Training Data Poisoning — malicious examples alter model behaviour; detect via
                  dataset hash + label distribution
              - label: Llm04
                value: >
                  Model Denial of Service — token flooding exhausts compute and billing; detect via
                  TPM + cost rate
              - label: Llm05
                value: >
                  Supply Chain Vulnerabilities — compromised base model or library; detect via
                  format check + hash
              - label: Llm06
                value: >
                  Sensitive Information Disclosure — PII or credentials in output; detect via PII
                  pattern scanner
              - label: Llm07
                value: >
                  Insecure Plugin Design — plugin called with adversary-specified parameters; detect
                  via allowlist validation
              - label: Llm08
                value: >
                  Excessive Agency — model takes irreversible real-world actions; detect via
                  action-type allowlist
              - label: Llm09
                value: >
                  Overreliance on LLM — downstream system trusts hallucinated output; detect via
                  factual consistency check
              - label: Llm10
                value: >
                  Model Theft — model functionality cloned via API extraction; detect via volume +
                  diversity anomaly
          - type: fields
            subject: 'Block 02 Owasp Llm Top10'
            entries:
              - label: 'Cai Formula Reminder'
                value: 'CAI = Capability × Autonomy × Integration; CAI >= 600 = critical agency risk'
      - heading: 'Block 03 Mitre Atlas'
        id: block_03_mitre_atlas
        blocks:
          - type: fields
            subject: 'Block 03 Mitre Atlas'
            entries:
              - label: Sections
                value: '5.7 — 5.8'
              - label: 'Core Insight'
                value: >
                  MITRE ATLAS extends ATT&CK for ML-specific adversary techniques. Twelve tactics
                  span the ML kill chain from reconnaissance to impact. The detection-first
                  framework — five fields per technique — translates ATLAS from a threat vocabulary
                  into a detection engineering programme. The API gateway log is the single
                  highest-value data source: one stream covers ten top-priority ATLAS techniques.
          - type: fields
            subject: 'Top5 By Roi Score'
            id: top5_by_roi_score
            entries:
              - label: 'Rank 1'
                value: 'AML.T0010 — Supply Chain (score 100): SafeTensors format check, zero FP'
              - label: 'Rank 2'
                value: 'AML.T0029 — DoS (score 100): token rate + cost anomaly, immediate detect'
              - label: 'Rank 3'
                value: 'AML.T0024.002 — Model Extraction (score 80): volume + diversity + one-shot'
              - label: 'Rank 4'
                value: 'AML.T0056 — Prompt Extraction (score 75): extraction phrase pattern match'
              - label: 'Rank 5'
                value: 'AML.T0035 — Artifact Collection (score 75): bulk download by non-serving identity'
          - type: fields
            subject: 'Three Chain Patterns'
            id: three_chain_patterns
            entries:
              - label: 'Extraction Campaign'
                value: 'T0001 → T0005 → T0040 → T0025 → T0042'
              - label: 'Poisoning Backdoor'
                value: 'T0020 → T0018 (retraining amplification)'
              - label: 'Agentic Injection'
                value: 'T0054 → T0051 → T0053 (indirect → context → plugin)'
      - heading: 'Block 04 Supply Chain and Privacy'
        id: block_04_supply_chain_and_privacy
        blocks:
          - type: fields
            subject: 'Block 04 Supply Chain and Privacy'
            entries:
              - label: Sections
                value: '5.9 — 5.11'
              - label: 'Core Insight'
                value: >
                  The AI supply chain and privacy attack surface are pre-deployment and
                  post-deployment expressions of the same root problem: training data and model
                  weights encode sensitive information in recoverable form. The privacy attack triad
                  — extraction, membership inference, inversion — defines the complete privacy
                  threat model. The supply chain threat — pickle RCE, dataset poisoning, LoRA swap —
                  defines the integrity threat model.
          - type: fields
            subject: 'Three Supply Chain Controls'
            id: three_supply_chain_controls
            entries:
              - label: 'Control 1'
                value: 'SafeTensors format enforcement (two-byte check, zero FP)'
              - label: 'Control 2'
                value: 'SHA-256 hash verification at intake and at serve'
              - label: 'Control 3'
                value: 'ML SBOM with four layers: dataset, base model, adapter, framework'
          - type: fields
            subject: 'Privacy Triad One Line Each'
            id: privacy_triad_one_line_each
            entries:
              - label: Extraction
                value: 'Verbatim recall via prefix probing — detect via output entropy + canary tokens'
              - label: 'Membership Inference'
                value: 'Confidence-gap test for training membership — defend via DP + output perturbation'
              - label: 'Model Inversion'
                value: >
                  Gradient ascent reconstructs training samples — defend via rate limiting +
                  confidence masking
          - type: fields
            subject: 'Dp Epsilon Guidance'
            id: dp_epsilon_guidance
            entries:
              - label: 'Medical Legal'
                value: 'epsilon <= 2 mandatory'
              - label: 'Customer Pii'
                value: 'epsilon <= 4 required'
              - label: 'General Proprietary'
                value: 'epsilon <= 8 minimum'
      - heading: 'Block 05 Bias Regulatory Rmf'
        id: block_05_bias_regulatory_rmf
        blocks:
          - type: fields
            subject: 'Block 05 Bias Regulatory Rmf'
            entries:
              - label: Sections
                value: '5.12 — 5.14'
              - label: 'Core Insight'
                value: >
                  Bias is a security issue because predictability is exploitability. Regulation (EU
                  AI Act, GDPR, US EO) mandates the same technical controls as security engineering
                  — they are the same work described in two languages. NIST AI RMF provides the
                  organisational scaffolding: GOVERN gives authority, MAP scopes risk, MEASURE
                  operationalises every Chapter 5 technical tool, and MANAGE closes the loop with
                  treatment decisions and residual risk acceptance.
              - label: 'Bias Security Link'
                value: 'Adversarially exploitable FNR disparity = bias finding + pentest finding'
          - type: fields
            subject: 'Regulation Security Link'
            id: regulation_security_link
            entries:
              - label: 'Eu Ai Act Art15'
                value: 'Adversarial example + data poisoning defence = Article 15 cybersecurity compliance'
              - label: 'Gdpr Art25'
                value: 'DP training + output scanner + MIA AUC = Article 25 privacy by design'
              - label: 'Us Eo'
                value: >
                  Red team results + model weight controls = evidence formerly required by EO 14110
                  Section 4.2 (revoked January 2025); now NIST AI RMF MEASURE evidence
          - type: fields
            subject: 'Rmf Bridge to Part3'
            id: rmf_bridge_to_part3
            entries:
              - label: 'Chapter 11'
                value: 'Detection Engineering = MEASURE 2.2 + 2.4'
              - label: 'Chapter 15'
                value: 'Red Teaming = MEASURE 2.2 + MAP update'
              - label: 'Chapter 16'
                value: 'Incident Response = MANAGE respond'
              - label: 'Chapter 17'
                value: 'Programme Measurement = MEASURE 2.3 + GOVERN update'
  - number: '5.15.2'
    heading: 'Enterprise LLM Threat Model: RAG Deployment Complete Example'
    id: subsection_02
    parts:
      - heading: 'System Description'
        id: system_description
        blocks:
          - type: fields
            subject: 'System Description'
            entries:
              - label: Name
                value: 'Enterprise Document QA Assistant (RAG)'
              - label: 'Deployment Type'
                value: 'Internal tool for engineering team; not customer-facing'
              - label: 'Data Flows'
                value: 'User query → API gateway → LLM → RAG retrieval → knowledge base → response → user'
          - type: fields
            subject: 'Trust Boundaries'
            id: trust_boundaries
            entries:
              - label: 'External Boundary'
                value: 'Between untrusted user input and API gateway'
              - label: 'Internal Boundary'
                value: 'Between API layer and knowledge base / model weights'
              - label: 'Third Party Boundary'
                value: 'Between organisation LLM and base model provider'
          - type: fields
            subject: Assets
            id: assets
            entries:
              - label: 'Model Weights'
                value: 'IP asset; extraction risk (AML.T0024, AML.T0035)'
              - label: 'Training Data'
                value: 'Privacy asset; extraction (AML.T0037), MIA (AML.T0048)'
              - label: 'Knowledge Base'
                value: 'Confidentiality asset; direct access via injection'
              - label: 'System Prompt'
                value: 'Business logic asset; extraction risk (AML.T0056)'
              - label: 'Api Credentials'
                value: 'Access control asset; DoS and extraction risk'
              - label: 'User Conversations'
                value: 'Privacy asset; context leakage, insecure output'
      - heading: 'Stride Analysis'
        id: stride_analysis
        parts:
          - heading: Spoofing
            id: spoofing
            blocks:
              - type: fields
                subject: Spoofing
                entries:
                  - label: Threats
                    value:
                      - 'API key theft enables impersonation of authorised caller'
                      - 'Model identity spoofing: adversary deploys convincing-sounding model to intercept user trust'
                  - label: 'Owasp Mapping'
                    value: 'LLM05 (Supply Chain)'
                  - label: 'Atlas Mapping'
                    value: 'AML.T0021 (Establish Accounts), AML.T0012 (Valid Accounts)'
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: 'API key rotation; short-lived tokens; IP allowlisting for internal tool'
                  - label: Detective
                    value: 'Auth log anomaly detection; geo/time anomaly on key usage'
                  - label: 'Residual Risk'
                    value: 'Phishing of internal user credentials — accept with MFA control'
          - heading: Tampering
            id: tampering
            blocks:
              - type: fields
                subject: Tampering
                entries:
                  - label: Threats
                    value:
                      - 'Prompt injection into retrieved documents plants adversary instructions in context'
                      - 'Training data poisoning introduces backdoor into next model version'
                      - 'LoRA adapter swap modifies production model behaviour post-deployment'
                  - label: 'Owasp Mapping'
                    value: 'LLM01 (Prompt Injection), LLM03 (Training Data Poisoning)'
                  - label: 'Atlas Mapping'
                    value: 'AML.T0051.001, AML.T0051, AML.T0020, AML.T0018'
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: >
                      Injection scanner on RAG retrieved content; dataset hash verification; adapter
                      hash monitoring
                  - label: Detective
                    value: 'Injection classifier on assembled context; regression test suite post-retrain'
                  - label: 'Residual Risk'
                    value: 'Novel injection patterns not covered by classifier — medium residual'
          - heading: Repudiation
            id: repudiation
            blocks:
              - type: fields
                subject: Repudiation
                entries:
                  - label: Threats
                    value:
                      - 'Agentic workflow takes action (send email, write file) without attributable decision record'
                      - 'LLM-assisted decisions not logged — user contests AI involvement'
                  - label: 'Owasp Mapping'
                    value: 'LLM08 (Excessive Agency)'
                  - label: 'Atlas Mapping'
                    value: 'AML.T0053 (Confused Deputy)'
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: 'Every agent action generates immutable audit log entry with session context'
                  - label: Detective
                    value: 'Action audit log completeness monitoring; alert on missing decision record'
                  - label: 'Residual Risk'
                    value: 'Log tampering by privileged insider — transfer via SIEM centralisation'
          - heading: 'Information Disclosure'
            id: information_disclosure
            blocks:
              - type: fields
                subject: 'Information Disclosure'
                entries:
                  - label: Threats
                    value:
                      - 'System prompt extraction via direct elicitation (AML.T0056)'
                      - 'Training data verbatim recall via prefix probing (AML.T0037)'
                      - 'Knowledge base document surfaces in response to non-entitled user'
                      - 'PII in user conversation A appears in response to user B via context leakage'
                  - label: 'Owasp Mapping'
                    value: 'LLM06 (Sensitive Disclosure), LLM02 (Insecure Output)'
                  - label: 'Atlas Mapping'
                    value: 'AML.T0056, AML.T0037, AML.T0024, AML.T0048'
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: >
                      System prompt non-disclosure instruction; DP training for fine-tuned versions;
                      RAG authorisation check on retrieved documents
                  - label: Detective
                    value: 'Extraction phrase classifier on input; output PII scanner; canary token monitor'
                  - label: 'Residual Risk'
                    value: 'Approximate recall of sensitive concepts not caught by PII scanner — medium'
          - heading: 'Denial of Service'
            id: denial_of_service
            blocks:
              - type: fields
                subject: 'Denial of Service'
                entries:
                  - label: Threats
                    value:
                      - 'Context flooding: requests with near-full context window exhaust KV cache'
                      - 'Sponge examples: compute-intensive inputs spike p99 latency and cost'
                      - 'Billing attack via compromised or leaked API key'
                  - label: 'Owasp Mapping'
                    value: 'LLM04 (Model DoS)'
                  - label: 'Atlas Mapping'
                    value: AML.T0029
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: 'Hard token limit per request; per-key TPM rate limit; context-size budget'
                  - label: Detective
                    value: 'Token rate 3x rolling average alert; cost per minute 3x baseline alert; p99 latency spike'
                  - label: 'Residual Risk'
                    value: 'Burst below rate limit threshold — accept with billing alert threshold set at 2x'
          - heading: 'Elevation of Privilege'
            id: elevation_of_privilege
            blocks:
              - type: fields
                subject: 'Elevation of Privilege'
                entries:
                  - label: Threats
                    value:
                      - 'Plugin confused deputy: adversary injects instruction to call plugin with escalated parameters'
                      - 'Excessive agency: model autonomously takes high-impact action beyond intended scope'
                      - 'Indirect injection via retrieved document triggers privileged tool call'
                  - label: 'Owasp Mapping'
                    value: 'LLM07 (Insecure Plugin), LLM08 (Excessive Agency)'
                  - label: 'Atlas Mapping'
                    value: 'AML.T0053, AML.T0051.001'
              - type: fields
                subject: Controls
                id: controls
                entries:
                  - label: Preventive
                    value: >
                      Plugin parameter allowlist validation; irreversibility gate on high-impact
                      actions; minimal plugin permissions
                  - label: Detective
                    value: 'Plugin call parameter anomaly alert; irreversible action without confirmation record alert'
                  - label: 'Residual Risk'
                    value: 'Zero with correct allowlist implementation — target state'
      - heading: 'Control Summary Table'
        id: control_summary_table
        blocks:
          - type: fields
            subject: 'Control Summary Table'
            entries:
              - label: 'Preventive Controls'
                value:
                  - 'SafeTensors format check at model intake (T0019)'
                  - 'SHA-256 hash verification at intake and serve (T0019, T0035)'
                  - 'Injection scanner on RAG retrieved content before context assembly (T0054)'
                  - 'Plugin parameter allowlist validation (T0053)'
                  - 'Hard token and TPM limits (T0029)'
                  - 'DP training for fine-tuned versions with PHI or PII (privacy triad)'
              - label: 'Detective Controls'
                value:
                  - 'API gateway: extraction pattern (volume + diversity + low-temperature) alert'
                  - 'Output scanner: PII patterns + canary token recall (T0037, T0056)'
                  - 'Injection classifier on input and on assembled context (T0051, T0054)'
                  - 'ATLAS Sigma stubs deployed to SIEM for top-10 techniques'
                  - 'Bias drift monitor: per-group FNR tracked weekly'
                  - 'Supply chain hash monitor: alert on any artifact hash change'
              - label: 'Corrective Controls'
                value:
                  - 'Session termination on critical extraction or injection alert'
                  - 'API key rotation on compromise detection'
                  - 'Model rollback to last verified clean checkpoint'
                  - 'Incident response playbook per MANAGE phase (contain/assess/remediate/recover/review)'
  - number: '5.15.3'
    heading: 'Framework Integration Map: OWASP + ATLAS + NIST + Regulatory'
    id: subsection_03
    blocks:
      - type: fields
        subject: 'Framework Integration Map: OWASP + ATLAS + NIST + Regulatory'
        entries:
          - label: 'Integration Purpose'
            value: >
              Four frameworks cover overlapping terrain from different perspectives. The integration
              map shows where each framework contributes uniquely and where they reinforce each
              other, enabling practitioners to produce a single set of technical controls that
              satisfies all four simultaneously.
    parts:
      - heading: 'Four Framework Summary'
        id: four_framework_summary
        blocks:
          - type: fields
            subject: 'Owasp Llm Top10'
            id: owasp_llm_top10
            entries:
              - label: Perspective
                value: 'Practitioner checklist — what can go wrong in LLM deployments'
              - label: 'Primary Audience'
                value: 'Application developers and security teams deploying LLMs'
              - label: Contribution
                value: 'Risk taxonomy with exploitation examples and technical mitigations'
              - label: Limitation
                value: 'Does not prescribe detection logic or organisational process'
              - label: 'Book Sections'
                value: '5.3 — 5.6'
          - type: fields
            subject: 'Mitre Atlas'
            id: mitre_atlas
            entries:
              - label: Perspective
                value: 'Adversary playbook — how adversaries attack ML systems'
              - label: 'Primary Audience'
                value: 'Threat intelligence and detection engineers'
              - label: Contribution
                value: 'Technique-level attack patterns with observable signals and detection logic'
              - label: Limitation
                value: 'Does not cover fairness, privacy law, or organisational governance'
              - label: 'Book Sections'
                value: '5.7 — 5.8'
          - type: fields
            subject: 'Nist Ai Rmf'
            id: nist_ai_rmf
            entries:
              - label: Perspective
                value: 'Governance framework — organisational process for AI risk management'
              - label: 'Primary Audience'
                value: 'CISOs, risk managers, AI governance leads'
              - label: Contribution
                value: 'Structured lifecycle process (GOVERN/MAP/MEASURE/MANAGE) with accountability'
              - label: Limitation
                value: 'Non-prescriptive — does not specify which metrics or techniques to use'
              - label: 'Book Sections'
                value: '5.14'
          - type: fields
            subject: 'Regulatory Stack'
            id: regulatory_stack
            entries:
              - label: Perspective
                value: 'Legal floor — minimum obligations with enforcement and penalties'
              - label: 'Primary Audience'
                value: 'Compliance, legal, and governance teams'
              - label: Contribution
                value: 'Mandatory controls with audit evidence requirements'
              - label: Limitation
                value: 'Regulatory minimum is below security ceiling; compliance does not equal security'
              - label: 'Book Sections'
                value: '5.13'
      - heading: 'Cross Framework Mapping Selected'
        id: cross_framework_mapping_selected
        blocks:
          - type: fields
            subject: 'Row 01'
            id: row_01
            entries:
              - label: Threat
                value: 'Prompt Injection'
              - label: Owasp
                value: LLM01
              - label: Atlas
                value: 'AML.T0051, AML.T0051.001'
              - label: 'Nist Rmf'
                value: 'MEASURE 2.2 (test injection), MEASURE 2.4 (monitor input)'
              - label: 'Eu Ai Act'
                value: 'Article 15 (robustness against adversarial inputs)'
              - label: Gdpr
                value: 'Article 25 (privacy by design — prevent injection-triggered disclosure)'
              - label: 'Detection Control'
                value: 'Injection classifier on input; scanner on RAG content'
          - type: fields
            subject: 'Row 02'
            id: row_02
            entries:
              - label: Threat
                value: 'Training Data Poisoning'
              - label: Owasp
                value: LLM03
              - label: Atlas
                value: 'AML.T0020, AML.T0018'
              - label: 'Nist Rmf'
                value: 'MAP (risk identification), MEASURE 2.1 (risk analysis), MANAGE (mitigate)'
              - label: 'Eu Ai Act'
                value: 'Article 10 (data governance), Article 15 (cybersecurity — data poisoning)'
              - label: Gdpr
                value: 'Article 5 (data quality/integrity)'
              - label: 'Detection Control'
                value: 'Dataset hash monitor; label distribution KL divergence alert'
          - type: fields
            subject: 'Row 03'
            id: row_03
            entries:
              - label: Threat
                value: 'Model Theft / Extraction'
              - label: Owasp
                value: LLM10
              - label: Atlas
                value: 'AML.T0025, AML.T0035, AML.T0040'
              - label: 'Nist Rmf'
                value: 'MEASURE 2.4 (API monitoring), MANAGE (mitigate extraction risk)'
              - label: 'Eu Ai Act'
                value: 'Article 15 (cybersecurity — protect model integrity)'
              - label: Gdpr
                value: 'Not directly applicable (IP protection, not personal data)'
              - label: 'Detection Control'
                value: 'Volume + diversity anomaly; bulk download by non-serving identity'
          - type: fields
            subject: 'Row 04'
            id: row_04
            entries:
              - label: Threat
                value: 'Supply Chain Compromise'
              - label: Owasp
                value: LLM05
              - label: Atlas
                value: 'AML.T0019, AML.T0011'
