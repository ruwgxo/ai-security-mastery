    id: subsection_06
    blocks:
      - type: fields
        subject: 'Chapter 6 Preview: Prompt Injection — Deep Dive'
        entries:
          - label: 'Why Prompt Injection Warrants a Full Chapter'
            value: >
              LLM01 Prompt Injection is OWASP's top-ranked risk for good reason. It is not a single
              technique — it is a family of attack primitives that underlies the majority of LLM
              security incidents observed in production. Chapter 5 introduced it as OWASP LLM01 and
              as MITRE ATLAS AML.T0051 and AML.T0051.001. Chapter 6 spends 18 sections on every
              variant, every obfuscation method, real-world documented examples, and the detection
              engineering required to catch each one.
      - type: fields
        subject: 'Chapter 6 Structure Preview'
        id: chapter_6_structure_preview
        entries:
          - label: 'Sections 01 02'
            value: 'What prompt injection is and why traditional input validation fails'
          - label: 'Sections 03 05'
            value: 'Direct injection variants: role override, jailbreak, data extraction, system prompt bypass'
          - label: 'Sections 06 08'
            value: 'Indirect injection: web pages, RAG documents, email bodies, tool outputs'
          - label: 'Sections 09 10'
            value: 'Multi-turn injection: conditioning attacks across conversation history'
          - label: 'Sections 11 12'
            value: 'Obfuscation methods: encoding, fragmentation, context smuggling'
          - label: 'Sections 13 14'
            value: 'Real-world documented examples with ATLAS technique mapping'
          - label: 'Sections 15 16'
            value: 'Detection engineering: classifier design, semantic vs pattern-based detection'
          - label: 'Sections 17 18'
            value: 'Defences: prompt hardening, input/output validation, context segregation'
      - type: fields
        subject: 'Chapter 5 Foundations Used in Chapter 6'
        id: chapter_5_foundations_used_in_chapter_6
        entries:
          - label: 'Foundation 01'
            value: >
              Section 5.1 (AI attack surface) → Chapter 6 explains why the context window is both
              the attack surface and the only available defence boundary
          - label: 'Foundation 02'
            value: >
              Section 5.8 (AML.T0051, AML.T0051.001 detection specs) → Chapter 6 builds the
              production-grade injection classifier that operationalises those Sigma stubs
          - label: 'Foundation 03'
            value: >
              Section 5.14 (NIST AI RMF MEASURE 2.2 and 2.4) → Chapter 6 injection testing is a
              MEASURE 2.2 evaluation and the deployed classifier is MEASURE 2.4 monitoring
      - type: fields
        subject: 'Chapter 6 Preview: Prompt Injection — Deep Dive'
        entries:
          - label: 'The Coming Shift'
            value: >
              Chapter 5 was the map — the full terrain of AI security threats, frameworks, and
              regulatory obligations. Chapter 6 is the first deep dive: one threat, examined from
              every angle, with production detection engineering as the output. The shift from
              breadth to depth is the shift from threat landscape to threat response.
