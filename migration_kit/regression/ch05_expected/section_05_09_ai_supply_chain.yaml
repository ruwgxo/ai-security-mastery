        value: >
          Analysis of three documented AI supply chain incidents (Protect AI HuggingFace pickle
          exploits 2023, HuggingFace Spaces compromise 2024, JFrog obfuscated pickle research 2023)
          mapped to ATLAS techniques, with lessons applied to your deployment.
      - label: 'Completion Criteria'
        value: >
          All three incidents reviewed. ATLAS technique mapping documented for each. At least one
          control improvement per incident implemented in your verification pipeline or checklist.
section_summary:
  compact: >
    Section 5.9 establishes AI supply chain security as a systemic discipline spanning six distinct
    attack-surface layers — dataset acquisition, preprocessing, base model download, fine-tuning and
    adapters, framework dependencies, and model registry and serving — and provides the technical
    depth and operational tooling to defend each one. The section opens with the npm analogy: the AI
    ecosystem exhibits the same implicit-trust-in-public-repositories dynamic that made npm
    vulnerable in 2016, with one critical additional risk — a malicious ML model is not merely
    broken software but a potential arbitrary code execution vehicle via pickle deserialisation. The
    pickle RCE mechanics are explained in full (the __reduce__ protocol, the two-byte magic byte
    detection signature) alongside SafeTensors architecture (tensor-only format, structural
    impossibility of code execution). Dataset poisoning at source is covered for Common Crawl (SEO
    poisoning, backdoor trigger injection at web scale), GitHub (trojan PRs, fork manipulation), and
    Wikipedia (vandalism window contamination). The HuggingFace ecosystem receives dedicated
    treatment: five documented supply chain risks (namespace squatting, account compromise,
    malicious weights, dataset poisoning, model card trust) and a six-step audit procedure. LoRA
    adapter swapping is examined as a unique post-deployment integrity risk — small, cheap to
    produce, independently downloaded, and in dynamic serving architectures swappable at runtime
    without a deployment event. Third-party ML library vulnerabilities cover the three documented
    CVE classes (model loading RCE, serving infrastructure RCE, training pipeline RCE) alongside SCA
    scanning requirements. The ML SBOM section defines the four-layer structure (dataset, base
    model, adapter, framework) with all required fields per layer and the incident response, audit,
    and traceability benefits it enables. The section closes with the six-check artifact
    verification pipeline (format, hash, model card, dependency scan, sandbox load, behavioural
    regression) and analysis of three documented 2023-2024 supply chain incidents (Protect AI,
    HuggingFace Spaces, JFrog) mapped to ATLAS techniques with lessons applied. Three
    implementations deliver the production artifact scanner, the ML SBOM generator with supply chain
    checklist, and the HuggingFace model audit tool.
  key_takeaways:
    style: ordered
    items:
      - >
        ML models are executables. Loading a PyTorch .bin file with torch.load() is equivalent to
        running an untrusted binary. This is not a metaphor — pickle's __reduce__ protocol enables
        arbitrary shell command execution on model load. SafeTensors eliminates this by restricting
        the format to tensor data only, making code execution structurally impossible.
      - >
        The AI supply chain has six distinct layers each with independent attack surfaces: dataset
        acquisition, preprocessing, base model download, fine-tuning and adapters, framework
        dependencies, and model registry/serving. A control at one layer does not compensate for a
        gap at another. Defence-in-depth across all six is required.
      - >
        Public datasets (Common Crawl, GitHub, Wikipedia) are adversary-writable. SEO poisoning of
        Common Crawl, trojan PRs to GitHub repositories, and Wikipedia vandalism during snapshot
        windows are all documented or technically feasible mechanisms for training data
        contamination without any access to victim infrastructure.
      - >
        LoRA adapters are a unique supply chain risk: cheap to produce, often downloaded and
        verified separately from the base model, and in dynamic serving architectures can be swapped
        at runtime without a deployment event. Every adapter in every composition stack must be
        independently hashed, registered, and monitored.
      - >
        The ML SBOM captures what traditional software SBOMs miss: training datasets, base model
        identity and format, adapter provenance, and fine-tuning lineage. Without an ML SBOM, an
        organisation cannot answer the question "which of our production models is affected by this
        CVE?" or "did this model's training data include data from source X that we now know is
        compromised?"
      - >
        Download count and HuggingFace star count are not security signals. Adversaries artificially
        inflate these metrics. The only reliable signals are: SafeTensors format (structural, not
        gameable), SHA-256 hash match against a known-good record, model card completeness (partial
        signal), and behavioural regression test on a trigger-probe suite.
      - >
        Two format checks block the primary ML supply chain attack vector with zero false positives
        and zero tuning: (1) verify file_header[0:2] NOT in pickle magic bytes, (2) verify
        file_header[8:9] == '{' for SafeTensors. These two checks, implemented at model intake,
        eliminate pickle RCE from the supply chain without any impact on legitimate SafeTensors
        models.
      - >
        The three documented incidents (Protect AI 2023, HuggingFace Spaces 2024, JFrog 2023) share
        a common root cause: implicit trust in a public model hub without structural format
        verification. Obfuscation (JFrog finding) defeats content-based scanning but not structural
        format validation — SafeTensors enforcement is the correct defence, not pattern matching on
        file contents.
next:
  kind: section
  target: '05_10'
  title: 'Section 5.10 — Privacy Attacks: Training Data Extraction'
  summary: >
    The supply chain complete, Section 5.10 examines what adversaries do with deployed models:
    extract the training data embedded in weights. Memorisation taxonomy (verbatim, approximate,
    concept-level), Carlini et al. methodology, differential privacy as a formal defence, and
    detection of extraction attempts from API logs — closing the loop from supply chain integrity to
    output-side privacy monitoring.
