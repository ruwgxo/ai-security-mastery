section_summary:
  compact: >
    Section 5.14 establishes NIST AI RMF as the organisational scaffolding that makes the technical
    security work of Sections 5.8-5.13 consequential — connecting technical measurements to
    governance decisions, budget approvals, and deployment authorities. The four-function
    architecture is presented with its sequential dependency logic: GOVERN (policies and roles
    before any other function), MAP (risk identification and context before measurement), MEASURE
    (the technical engine — all implementations from Sections 5.8-5.12 live here), and MANAGE
    (treatment decisions and residual risk acceptance for every identified risk). The GOVERN
    function is operationalised through an AI use policy template, a six-gate model governance
    procedure, role assignment definitions, and a four-level maturity taxonomy from absent to
    optimising. The MAP function produces three artefacts — system context document, stakeholder
    impact inventory, and initial risk register — with the NIST AI 100-1 trustworthiness categories
    mapped to specific ATLAS techniques. The MEASURE function is the most technically dense: a
    12-metric catalog covers security (ATLAS coverage score, supply chain pass rate, extraction
    alerts), privacy (memorisation risk score, MIA AUC, canary recall events), fairness (max FNR
    ratio, exploitability score, sentiment disparity), and compliance (EU AI Act compliance
    percentage, GDPR article gap count), each with target threshold, source tool, and review
    cadence. The MANAGE function establishes four treatment options (mitigate, accept, transfer,
    avoid), the residual risk acceptance discipline (every risk must reach a treatment state — no
    orphans), and a five-phase AI incident response plan with regulatory notification triggers. NIST
    AI RMF and NIST CSF are compared across three dimensions of difference (harm scope, lifecycle
    coverage, stakeholder scope) and two integration points (DETECT↔MEASURE 2.4 and GOVERN↔GOVERN).
    The section closes with a full RAG deployment worked example and explicit bridge mapping: the
    Part 3 detection engineering programme (Chapters 11-17) is the production operationalisation of
    NIST AI RMF MEASURE and MANAGE. Three implementations deliver the RMF mapping template with 27
    required outputs and the maturity scorecard, the GOVERN policy template generator producing AI
    use policy and model governance procedure in Markdown, and the MEASURE metrics dashboard with
    RAG status tracking paired with the MANAGE risk register.
  key_takeaways:
    style: ordered
    items:
      - >
        NIST AI RMF is the management language for technical AI security work. The GOVERN function
        provides organisational authority to gate deployments. The MAP function scopes what risks to
        measure. The MEASURE function is where the technical implementations from Sections 5.8-5.12
        live. The MANAGE function ensures every measured risk reaches a documented treatment
        decision. Engineers who understand all four functions can translate security work into
        budget requests and governance decisions.
      - >
        GOVERN must precede MAP, MAP must precede MEASURE, and MEASURE must precede MANAGE. This is
        not bureaucracy — it is dependency management. A detection programme without deployment
        authority (GOVERN) generates alerts nobody acts on. A bias audit without a deployment gate
        (GOVERN gate 4) produces findings nobody blocks. Sequence matters.
      - >
        The MEASURE sub-function 2.4 (ongoing monitoring) is the production detection engineering
        programme. Every Sigma rule from Section 5.8, every output scanner from Section 5.10-5.11,
        and every bias drift monitor from Section 5.12 is a NIST AI RMF MEASURE 2.4 control. Tagging
        these controls with MEASURE sub-function identifiers in the SIEM produces regulatory
        compliance evidence as a by-product of normal security operations.
      - >
        Orphaned risks are the primary source of AI security incidents. A risk that appears in the
        MAP risk register but has no documented treatment decision is neither mitigated nor accepted
        — it simply exists. The MANAGE function's discipline of requiring every risk to reach a
        treatment state (mitigate / accept / transfer / avoid) closes this gap. The risk register
        implementation enforces this by flagging orphaned risks explicitly.
      - >
        Residual risk acceptance is a governance act, not a technical one. The statement "we accept
        the residual risk of MIA AUC = 0.61 against our general-purpose assistant because it is
        within the 0.70 threshold for this data type" must be signed by the AI Risk Owner, not
        decided by the detection engineer. Documenting this signature is what transforms a technical
        measurement into a defensible governance decision.
      - >
        NIST AI RMF and NIST CSF are complementary, not competitive. The three unique AI RMF
        sub-functions (MEASURE 2.1 risk analysis, 2.2 testing, 2.3 evaluation) have no CSF
        equivalent. The two overlap points (GOVERN↔GOVERN, DETECT↔MEASURE 2.4) are integration
        points, not duplications. Organisations that run both frameworks should tag controls with
        both identifiers and produce a single unified evidence package per control.
      - >
        The model governance procedure with six lifecycle gates is the operationalisation of NIST AI
        RMF GOVERN. Gate 4 (pre-deployment) is the most consequential: it is the point where MEASURE
        outputs (bias audit, privacy audit, ATLAS coverage, ML SBOM) are reviewed and a deployment
        decision is made. This is where the technical work of Chapters 5-17 produces its most direct
        business value — either a confident deployment decision with documented evidence, or a
        blocked deployment that prevents a future incident.
      - >
        The bridge to Part 3 is direct. Chapters 11-17 operationalise NIST AI RMF MEASURE
        sub-functions 2.1 through 2.4 and MANAGE at production scale. Engineers building the
        detection engineering programme in Part 3 are simultaneously implementing the NIST AI RMF
        MEASURE and MANAGE functions and producing compliance evidence for EU AI Act Article 15 and
        GDPR Article 25, and the evidence US federal guidance has asked for (EO 14110 until its
        revocation in January 2025). The technical work and the governance framework are not
        separate activities — they are the same work described in two languages.
