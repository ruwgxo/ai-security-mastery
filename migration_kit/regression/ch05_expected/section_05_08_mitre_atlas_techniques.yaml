              "Model quality monitor; human feedback log",
              "accuracy_7d < accuracy_30d * 0.97 OR toxicity_7d > toxicity_30d * 1.5",
              "medium",25,"atlas.aml.t0031","Legitimate drift — distinguish by pace and coordination"),
          AtlasTechniqueEntry("AML.T0035","Collect ML Artifacts","Collection",
              "Bulk download model weights via insider or compromised credentials",
              [">1 GB download by non-serving identity","Registry listing by non-pipeline identity"],
              "Storage access log; ML registry audit log",
              "download_bytes > 1GB BY non_serving_identity IN 60min",
              "low",75,"atlas.aml.t0035","Migration jobs — whitelist scheduled migration accounts"),
          AtlasTechniqueEntry("AML.T0036","Collect Training Data","Collection",
