                value: AML.T0029
              - label: Name
                value: 'Denial of ML Service'
              - label: Tactic
                value: 'Impact on ML'
              - label: 'Attack Pattern'
                value: >
                  Exhaust compute, memory, or billing resources. Six variants: context flooding,
                  recursive loops, sponge examples (compute-intensive inputs), multi-turn token
                  accumulation, recursive tool calls, cost attack via compromised API key.
              - label: Observables
                value:
                  - 'Token rate 3x+ above rolling 7-day average'
                  - 'p99 inference latency 3x+ above baseline (sponge examples)'
                  - 'Per-minute billing cost 3x+ above baseline'
                  - 'Input token count > 80% of context window on repeated requests'
              - label: 'Data Source'
                value: 'API gateway token counter; billing telemetry; serving latency log'
        parts:
          - heading: 'Detection Logic'
            id: detection_logic
            blocks:
              - type: prose
                text: >
                  tpm_user > 3x_rolling_avg OR cost_per_min > 3x_baseline OR p99_latency_ms >
                  3x_baseline OR input_token_pct_of_context > 0.8 on consecutive_requests
          - heading: Difficulty
