section_summary:
  compact: >
    Section 5.8 is the detection engineering practitioner's reference for MITRE ATLAS, translating
    the framework overview of Section 5.7 into per-technique detection specifications for 30+ ATLAS
    techniques. The section opens with the detection-first framework — five fields per technique
    (attack pattern, observables, data source, detection logic, difficulty) — and a three-tier
    difficulty taxonomy separating signature-based, threshold-with-baseline, and
    behavioural-baseline techniques. Techniques are grouped by tactic: reconnaissance and resource
    development (limited victim-side detection; invest downstream), initial access and execution
    (highest ROI — AML.T0019 supply chain check is the single most impactful detection in the
    section), persistence (backdoors require proactive trigger-probe testing and canary tokens, not
    passive monitoring), exfiltration (all detectable via API telemetry — instrument API gateway
    logs first), and impact (DoS is low-difficulty; adversarial example evasion requires specialised
    infrastructure). Three technique chains (model extraction, training data poisoning to backdoor,
    agentic injection to plugin exploitation) demonstrate how real campaigns combine individual
    techniques and how correlation rules across detection steps dramatically increase fidelity. The
    section closes with ROI analysis: a top-10 priority technique list scored by prevalence ×
    detectability × impact, a data source inventory ranking the ten log streams by technique
    coverage per stream (API gateway first, covering ten techniques), and a coverage heat map
    separating act-now, invest-in-infrastructure, quick-win, and defer quadrants. Three
    implementations deliver the 30+-technique registry with JSON export, the three-chain attack
    simulator with detection gap analysis, and the coverage assessment tool with top-10 Sigma stub
    generator.
  key_takeaways:
    style: ordered
    items:
      - >
        API gateway logs are the single highest-value detection data source for LLM-specific ATLAS
        techniques: one data source covers AML.T0024, AML.T0040, AML.T0056, AML.T0043, AML.T0010,
        AML.T0029, AML.T0037, AML.T0051, AML.T0051.001, and AML.T0042 — ten techniques from one
        stream. Instrument this first.
      - >
        AML.T0010 (supply chain) and AML.T0029 (DoS) both score 100 in the priority matrix
        (prevalence × detectability × impact). Both are low-difficulty, near-zero FP, and
        immediately implementable. Any detection programme that does not cover these two techniques
        has a critical gap regardless of everything else it covers.
      - >
        High-difficulty techniques (AML.T0015, AML.T0005, AML.T0043) are not undetectable — they
        require behavioural baselines and statistical monitoring rather than signature-based rules.
        The correct response to "high difficulty" is not to skip the technique but to sequence it
        after the statistical baseline infrastructure is in place (Chapter 13).
      - >
        Technique chaining is how real attacks work. The extraction campaign (T0001 → T0005 → T0040
        → T0025 → T0042) is undetectable by a programme with only T0019 and T0029 rules, even though
        those two techniques have perfect scores. Coverage must address complete chains, not
        individual techniques in isolation.
      - >
        Correlation rules — detecting technique A followed by technique B within a time window —
        dramatically increase detection fidelity for multi-step campaigns. A T0040 probe alert has a
        10% false-positive rate alone; the same alert combined with a T0025 sustained query campaign
        on the same account has near-zero FP.
      - >
        AML.T0018 (backdoor) is invisible to standard accuracy benchmarks. A model achieving 99% on
        MMLU may carry a perfect trigger-activated backdoor. The only reliable detection mechanisms
        are: (a) a trigger-probe test suite run on every checkpoint, and (b) canary tokens injected
        into training data. Neither is available without proactive investment.
      - >
        The ATLAS coverage score (covered techniques / total techniques) is a defensible stakeholder
        metric. Starting from zero, implementing the top-6 priority techniques (T0019, T0029, T0056,
        T0035, T0053, T0020) with two to four days of engineering effort each yields approximately
        20% coverage and blocks the most prevalent and immediately exploitable vectors.
      - >
        The Sigma stubs generated in this section are the seed set for Chapter 11. Every stub is
        tagged with atlas.aml.TXXXX and owasp.LLMXX references, enabling a detection programme that
        is simultaneously ATLAS-aligned and OWASP-aligned — two frameworks, one set of rules.
next:
  kind: section
