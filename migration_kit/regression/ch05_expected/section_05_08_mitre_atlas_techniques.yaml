              ["Volume > 10k/day","Diversity > 0.85","Avg turns < 2","Logprob access"],
              "API gateway log; billing telemetry",
              "queries_per_day > 10_000 AND diversity > 0.85 AND avg_turns < 2",
              "medium",80,"atlas.aml.t0024","Batch eval pipelines — whitelist pre-registered eval keys"),
          AtlasTechniqueEntry("AML.T0029","Denial of ML Service","Impact on ML",
              "Exhaust compute, memory, or billing via context flooding, sponge inputs, loops",
              ["Token rate 3x avg","Cost 3x avg","p99 latency 3x avg","Context >80% full"],
              "Billing telemetry; serving latency log; token counter",
              "tpm > 3x_avg OR cost_per_min > 3x_baseline OR p99_latency > 3x_baseline",
