deliverables:
  - heading: 'ATLAS Technique Registry (30+ Techniques)'
    id: implementation_01
    filename: atlas_technique_registry.py
    lang: python
    description: >
      Complete Python registry of 30+ ATLAS techniques with attack pattern, observables, data
      source, detection logic, difficulty, and priority score. Supports querying by tactic,
      difficulty, priority. Exports JSON and generates data source inventory and coverage score
      reports.
    code: |
      """
      ATLAS Technique Registry — 30+ techniques with detection metadata.
      Query by tactic/difficulty/priority. Export JSON and coverage report.
      """

      from dataclasses import dataclass, field
      from typing import List, Dict
      import json


      @dataclass
      class AtlasTechniqueEntry:
          id: str
          name: str
          tactic: str
          attack_pattern: str
          observables: List[str]
          data_source: str
          detection_logic: str
          difficulty: str          # "low" / "medium" / "high"
          priority_score: int      # 0-100
          sigma_tag: str
          fp_notes: str = ""
          covered: bool = False


      REGISTRY: List[AtlasTechniqueEntry] = [
          AtlasTechniqueEntry("AML.T0000","Search Publicly Available Research","ML Reconnaissance",
              "OSINT on papers, GitHub, blogs — no victim contact",
              ["None on victim infrastructure"],"External monitoring only",
              "Google Scholar alerts for model/system name","high",5,"atlas.aml.t0000"),
          AtlasTechniqueEntry("AML.T0001","Search Victim-Owned Websites","ML Reconnaissance",
              "Systematic API-docs crawl to map model capabilities",
              ["High-volume requests across many URL paths","Scraper user-agent"],
              "Web server / CDN access log",
              "request_rate > 100/min AND path_diversity > 0.8",
              "medium",20,"atlas.aml.t0001","SEO crawlers — suppress known bot UAs"),
          AtlasTechniqueEntry("AML.T0002","Acquire Public ML Artifacts","ML Resource Development",
              "Download similar public models for surrogate init",
              ["None on victim infrastructure"],"N/A","Detect downstream via AML.T0024",
              "high",2,"atlas.aml.t0002"),
          AtlasTechniqueEntry("AML.T0003","Acquire Training Data","ML Resource Development",
              "Scrape victim public data endpoints or acquire similar datasets",
              ["Bulk requests to data endpoints by unauthenticated users"],
              "API access log (data endpoints)",
              "bulk_data_endpoint_requests > 1000 in 1h by unauth_user",
              "medium",10,"atlas.aml.t0003"),
          AtlasTechniqueEntry("AML.T0004","Obtain Capabilities","ML Resource Development",
              "Acquire adversarial ML toolkits (Foolbox, ART, CleverHans)",
              ["None on victim infrastructure"],"N/A","N/A","high",0,"atlas.aml.t0004"),
          AtlasTechniqueEntry("AML.T0005","Establish Accounts","ML Resource Development",
              "Create multiple API accounts to distribute rate-limited extraction",
              ["Burst of accounts from same /24 subnet","Correlated usage patterns"],
              "Account creation log; auth log",
              "accounts_from_ip_range > 5 in 24h OR identical_usage_pattern > 3",
              "medium",25,"atlas.aml.t0005","Corporate batch onboarding — suppress verified org domains"),
          AtlasTechniqueEntry("AML.T0005","Create Proxy ML Model","ML Resource Development",
              "Train surrogate for offline white-box attack development",
              ["None — entirely off-network"],"N/A",
              "Infer from upstream AML.T0024 data-collection signals","high",2,"atlas.aml.t0017"),
          AtlasTechniqueEntry("AML.T0010","Exploit Public-Facing ML API","Initial Access to ML",
              "Probe API: param injection, auth bypass, endpoint enumeration",
              ["Elevated 4xx/5xx rate","Endpoint enumeration pattern"],
              "API gateway log; WAF log",
              "error_rate > 20% AND rpm > 50 OR endpoint_enum > 20_paths in 5min",
              "low",35,"atlas.aml.t0010","Buggy SDK clients — suppress known UA strings"),
          AtlasTechniqueEntry("AML.T0011","User Execution — Malicious ML Artifact","Execution",
              "Pickle-format model file; victim loads it, executing adversary payload",
              ["Pickle magic bytes at intake","Unexpected child from serving process"],
              "Model registry intake log; process execution log",
              "file_header IN [PICKLE_V2,PICKLE_V4] OR unexpected_child_from_serving_proc",
              "low",100,"atlas.aml.t0011","Zero FP for format check with correct SafeTensors validation"),
          AtlasTechniqueEntry("AML.T0012","Valid Accounts","Initial Access to ML",
              "Compromised credentials used to access ML infrastructure",
              ["Geo anomaly","Off-hours ML resource access","First-time model registry access"],
              "IAM/auth log; ML platform audit log",
              "geo_anomaly > 0.8 OR (off_hours AND target IN ml_sensitive_resources)",
              "medium",30,"atlas.aml.t0012","Remote work — calibrate per account travel history"),
          AtlasTechniqueEntry("AML.T0018","Backdoor ML Model","Persistence in ML",
              "Embed trigger-response backdoor in weights; invisible to standard benchmarks",
              ["Regression test failure on trigger probes","Canary token activation"],
              "Behavioural regression test log; canary monitor",
              "safety_test_failures > 0 OR canary_trigger_fired",
              "medium",40,"atlas.aml.t0018","Failures from legit updates — per-version golden baseline"),
          AtlasTechniqueEntry("AML.T0019","Target via ML Supply Chain","Initial Access to ML",
              "Compromise base model, dataset, or ML library in victim's supply chain",
              ["Pickle format","Hash mismatch","Low model card score","Critical CVE in deps"],
              "Model registry intake log; SCA scan log; model card audit",
              "format_fail OR hash_mismatch OR card_score < 70 OR critical_cve",
              "low",100,"atlas.aml.t0019","Minimal model cards — route to review not hard block"),
          AtlasTechniqueEntry("AML.T0020","Poison Training Data","Persistence in ML",
