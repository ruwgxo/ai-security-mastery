              "API gateway log",
              "diversity > 0.85 AND avg_turns < 2 AND logprob_access == true",
              "medium",45,"atlas.aml.t0040","Legit eval pipelines — whitelist pre-registered eval keys"),
          AtlasTechniqueEntry("AML.T0041","Full ML Model Access via Service","ML Reconnaissance",
              "Use API logprob access to maximise extraction efficiency",
              ["Logprob param on high-volume key","Probability distribution requests"],
              "API parameter log",
              "logprobs == true AND queries_per_day > 5000",
              "medium",40,"atlas.aml.t0041","Research accounts — require documented justification"),
          AtlasTechniqueEntry("AML.T0042","Verify Attack","ML Attack Staging",
              "Test adversarial payload against production API before full deployment",
              ["Diversity drops from >0.7 to <0.2 in 10 min","Near-identical input burst"],
              "API request log — per-account input pattern",
              "diversity_drops TO < 0.2 in 10min AND edit_dist < 10 AND count > 15",
              "medium",30,"atlas.aml.t0042","Retry logic — suppress known retry patterns"),
          AtlasTechniqueEntry("AML.T0043","Craft Adversarial Data","ML Attack Staging",
              "Inputs exploiting decision boundaries (black-box, white-box, backdoor triggers)",
              ["Consecutive inputs with L2-distance < 0.05 over many iterations"],
