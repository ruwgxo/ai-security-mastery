              - label: Feasibility
                value: 'Limited to small models (logistic regression, small neural networks)'
              - label: Library
                value: 'pytorch-influence-functions (educational)'
          - type: fields
            subject: 'Approximate Influence'
            id: approximate_influence
            entries:
