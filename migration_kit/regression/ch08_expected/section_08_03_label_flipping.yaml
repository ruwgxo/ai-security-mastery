              - ['Neural networks (from scratch, moderate regularisation)', '~0-1% accuracy drop (memorisation regime)', '~1-3% accuracy drop', '~3-8% accuracy drop (threshold behaviour)', '~10-20% accuracy drop', 'Threshold-like; flat below capacity threshold, then rapid degradation']
              - ['Tree ensembles (Random Forest, XGBoost)', '~0.5-1% accuracy drop', '~2-3% accuracy drop', '~4-6% accuracy drop', '~10-15% accuracy drop', 'Graceful degradation to 10%, sharper above']
              - ['kNN classifier', '~2-3% accuracy drop (local sensitivity)', '~5-8% accuracy drop', '~12-18% accuracy drop', '~25-35% accuracy drop', 'Steeper than linear; local voting is highly sensitive to poisoned neighbours']
