                  - 'Variant: LF-R (random), LF-T (targeted), LF-I (influence-guided)'
                  - 'Classifier family: logistic regression, neural network, tree ensemble'
                  - 'Dataset: CIFAR-10, MNIST, enron-spam (canonical benchmarks)'
          - heading: 'Defence Parameters'
            id: defence_parameters
            blocks:
              - type: list
                style: bullet
                items:
                  - 'k value for kNN agreement: 5, 10, 20'
                  - 'Agreement threshold: 0.5, 0.7, 0.9'
                  - 'Number of cross-validation folds: 5, 10'
          - heading: Metrics
            id: metrics
            blocks:
              - type: list
                style: bullet
                items:
                  - 'Detection rate (true positive rate): fraction of poisoned samples flagged'
                  - 'False positive rate: fraction of clean samples incorrectly flagged'
                  - 'Post-defence model accuracy: accuracy after flagged samples removed and model retrained'
