        - ['LF-T', 'Targeted (class-pair) label flipping', 'Flips within specific source-target class pairs', 'Q4 Targeted Availability', '5% to 10% of target class samples (0.5% to 1% of total dataset)', 'Write access to training samples; knowledge of class structure', 'Target class accuracy collapse; aggregate accuracy may or may not move', 'Moderate -- aggregate monitoring may miss; per-class monitoring catches', 'Per-class accuracy regression; kNN agreement', '80-90% at equivalent budgets with per-class defences']
        - ['LF-I', 'Influence-guided label flipping', 'Select high-influence samples for flipping using influence functions', 'Q1 or Q4 depending on target specification', '1% to 5% for effects equivalent to 5-15% random flipping', 'White-box model access or close surrogate; rung 3 typical', '2x-5x more effective per poisoned sample than random flipping', 'Moderate -- label consistency still catches most variants', 'kNN agreement; influence-based auditing', '70-85% at equivalent budgets']
  - heading: 'Budget-Degradation Curves for Label Flipping'
