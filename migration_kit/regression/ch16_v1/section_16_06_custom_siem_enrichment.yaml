prose_content:
  part_1:
    title: 'The Custom Webhook: Delivering Anywhere'
    body: |-
      The dedicated connectors are the right tool when the team is on Splunk, Datadog, or Elastic. The custom webhook is the right tool for everything else -- a home-grown SIEM, a SOAR platform, a niche tool, an internal event bus. It asks the least of the receiver: the ability to accept an HTTP POST. The gateway POSTs detection events to a configured endpoint, and whatever is on the other end consumes them. This is the escape hatch that means the suite is never blocked by the absence of a purpose-built connector; if a platform can receive a POST, it can receive detections.

      The cost of that generality is that nothing about the contract can be assumed. A platform SDK encodes the payload shape and the authentication; a raw webhook has neither unless the contract states them. So the webhook is defined by an explicit contract rather than a convention. The payload is a versioned envelope -- a contract_version, a delivery id, an emitted-at timestamp, an event count, and the detection events themselves -- so a receiver can parse it and know the shape it is parsing, and can handle a future version deliberately. The webhook is a push integration like the others, owning delivery, but it is the one whose contract the section has to make fully explicit, because there is no SDK to make it implicit.
  part_2:
    title: 'Signing the Payload: Trust on a Generic Channel'
    body: |-
      A dedicated connector authenticates with a platform token, and the platform's ingestion endpoint knows how to check it. A generic webhook endpoint has no such shared machinery, so the contract has to carry its own trust. Without it, any party that can reach the endpoint could POST forged detections, and the receiver could not tell a real delivery from an injected one -- a security tool that accepts unauthenticated events is itself an attack surface. The webhook closes that with an HMAC signature: the gateway signs the canonical JSON payload with a secret shared with the receiver, and sends the signature alongside the delivery.

      The receiver recomputes the HMAC over the payload it received and compares it, in constant time, to the signature sent. If they match, the payload is authentic -- it came from a holder of the shared secret -- and unmodified, because any change to the bytes changes the HMAC. If they do not match, the receiver rejects the delivery. The section's stub receiver does exactly this, verifying every delivery and rejecting a tampered one, so the contract is exercised as a real endpoint should implement it. The signing secret is a credential and lives in the environment, never in source. This is the discipline the dedicated connectors got from their platforms, rebuilt explicitly for the channel that has no platform to provide it.
  part_3:
    title: Why a Raw Detection Is Not Yet an Alert
    body: |-
      Every connector to this point delivers a faithful detection, and a faithful detection is still not an actionable alert. Consider what arrives: 'the exfiltration detector blocked an output on session sess-880, confidence 0.98, canary triggered.' True, precise -- and by itself, thin. Who is behind session sess-880? Is this their first suspicious act or their sixth? Are they acting alone or as part of a cluster the graph already flagged? What should the responder actually do? The detection answers none of these, and an analyst who has to answer them by hand, per alert, under time pressure, is doing work the system already has the material to do.

      This is the gap the detection-event schema anticipated. Since 16.01 the schema has carried iocs and labels slots, deliberately empty, waiting for exactly this. The raw detection is the what; enrichment adds the who, the how-much, and the what-next. It is not a nicety layered on top -- it is the step that turns the chapter's output from a stream of true facts into a stream of alerts a SOC can triage and act on. And it belongs here, after the delivery paths, because it applies to all of them: enrichment happens to the event before delivery, so every connector -- the three platforms and the webhook -- ships the enriched alert without changing anything.
  part_4:
    title: Enriching from the Chapter 13 Behavioural Context
    body: |-
      The enrichment pipeline's raw material is the behavioural monitoring layer of Chapter 13 Section 13.11 -- the entity, session, and graph context the suite already maintains. For a detection, the pipeline asks that layer for the context of the session and source, and receives the entity's identity and rolling risk score, how many detections this session has already produced, and whether the entity belongs to a coordinated group the graph analysis has clustered. That context goes into the event's labels: the entity id, the entity risk, the session's event count, the group id when present. Now the alert says not just 'injection blocked' but 'injection blocked by entity-42, risk 0.87, sixth event this session, member of cluster-3.'

      From the same material the pipeline derives IOCs -- the indicators a SOC pivots on. Known-bad indicators tied to the entity (an IP the behavioural layer already distrusts) become IOCs on the event; evidence such as a triggered canary becomes an IOC of its own. The pipeline accesses the Chapter 13 layer behind a small interface, so it is testable with a stub standing in for the real context store and the real store is injected in production. Crucially, the pipeline writes only into the schema's existing slots -- labels and iocs -- so the enriched event is the same DetectionEvent it started as, richer but structurally unchanged. That is what lets enrichment sit in front of every connector without any connector knowing it is there.
  part_5:
    title: Attaching Response Actions and Completing the Surface
    body: |-
      The last thing enrichment adds is the answer to 'what next.' Based on the verdict and the context, the pipeline attaches the response actions available for the detection. A block offers to quarantine the session, revoke the token, and notify the SOC; a flag offers to watch the entity and notify the SOC; an allow offers nothing. The context sharpens this: an entity in a coordinated group gets a group-level action -- quarantine the group, not just the session -- because the graph says the threat is broader than the one request. The actions ride in the labels, so the alert arrives with its response options attached, and the responder chooses rather than researches.

      With enrichment attached, the integration surface mapped in 16.01 is complete. Sigma gives portable logic; the three connectors deliver events to the major platforms; the webhook delivers to anything else; and enrichment makes every delivered detection actionable, carrying the Chapter 13 behavioural context, the IOCs, and the response actions into the same schema every connector already speaks. A detection now flows from the Chapter 15 suite, through build_event into the shared schema, through enrichment that fills its open slots, and out through whichever connector the deployment uses -- arriving as an alert with a story and a set of next steps. Section 16.07 steps back to synthesise this whole surface and to hand off to Chapter 17, where the detections now reaching the SIEM feed the monitoring and tuning that improves the detectors.
