section_overview:
  one_line_summary: |-
    The integration surface is completed by two pieces: a custom webhook contract -- documented, versioned, and HMAC-signed -- that delivers detections to any platform without a dedicated connector, and an alert enrichment pipeline that fills the schema's IOC and label slots with the Chapter 13 Section 13.11 entity, session, and graph context and attaches response actions, turning a raw detection into an alert a responder can act on.
  why_this_section_exists: |-
    The three platform connectors cover the common case, but 'the common case' is not 'every case': a team may run a home-grown SIEM, a niche platform, or a SOAR tool with no Sigma compiler and no dedicated connector. The custom webhook is the escape hatch that makes the suite deliver anywhere -- a documented HTTP contract that any endpoint able to receive a POST can consume. Because it is generic, its contract has to be explicit where a platform SDK would have been implicit: a versioned envelope so the receiver knows the shape, and an HMAC signature so the receiver can trust the delivery is authentic and unmodified. That signed, versioned contract is the first half of the section.

    The second half addresses something every connector so far has deferred. The detection-event schema has carried empty iocs and labels slots since 16.01, and delivering a detection with those slots empty delivers a fact without a story: an analyst gets 'injection blocked on session X' and must reconstruct who that entity is, what else they did, and what to do about it. The alert enrichment pipeline fills the slots. It draws the Chapter 13 Section 13.11 behavioural context -- the entity's risk, the session's history, the coordinated-group membership from the graph -- into the labels, derives IOCs from the evidence and context, and attaches the response actions the detection warrants. The output is the same DetectionEvent shape, enriched, so every connector delivers the richer alert unchanged. Enrichment is what moves the chapter's output from detection to actionable alert.
  position_in_chapter: |-
    Section 16.06 completes the integration surface mapped in 16.01: the custom webhook is the fifth and most general delivery path, and the enrichment pipeline is the actionability layer that applies to all of them. It draws the Chapter 13 Section 13.11 entity, session, and graph context into the detection-event schema of 16.01, and its enriched output flows through every connector built in 16.02-16.05. The section is the last build before the chapter summary in 16.07.
