section_overview:
  one_line_summary: |-
    A detection that never reaches a security analyst is not actioned. Section 16.01 is the map of how the Chapter 15 detector suite integrates with security operations: one detection-event schema feeding three kinds of integration -- portable Sigma rules, platform connectors for Splunk, Datadog, and Elastic, and a custom webhook with alert enrichment -- so every following section builds one integration against a shared contract rather than a one-off export.
  why_this_section_exists: |-
    Part 4 has built the detector suite (Chapter 15) and deployed it on the production gateway (Chapter 14). The suite produces detections. But a detection is an internal signal until it reaches the tooling a security team actually watches, and that tooling is the SIEM. This section is the anchor for Chapter 16, mirroring the taxonomy anchors of 12.01, 13.01, 14.01, and 15.01, and it makes three commitments the rest of the chapter honours.

    First, there is one detection-event schema. A detector produces a DetectorResult in the Chapter 15 shape; the integration layer turns it into a platform-neutral DetectionEvent that carries the verdict, the severity, the scores, the evidence, and the request context. Every integration consumes that event and nothing else, so a detection is expressed once and delivered everywhere. Second, the integration surface has three parts: Sigma rules as portable detection logic that any platform can evaluate, platform connectors that push events into Splunk, Datadog, and Elastic, and alert enrichment that adds the Chapter 13 behavioural context, IOCs, and response actions to a raw detection. Third, the goal is automated rule deployment -- the generated Sigma rules and the connectors stay in sync with the deployed detectors rather than drifting from them. State these once here and the rest of the chapter is a deliberate build against them.
  position_in_chapter: |-
    Section 16.01 is the taxonomy anchor for the six sections that follow. It defines the detection-event schema that 16.02's Sigma generator and every connector in 16.03-16.06 translate from, states the push-versus-pull model those connectors are classified under, and sets the roadmap the summary (16.07) synthesises. The detection-event schema introduced here is the single artifact every subsequent section depends on.
