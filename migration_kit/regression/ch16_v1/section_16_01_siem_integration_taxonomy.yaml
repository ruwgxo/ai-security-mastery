deliverables:
  deliverable_1:
    title: The Detection-Event Schema
    filename: detection_event_schema.py
    description: |-
      The one schema every SIEM integration consumes. It carries over the Chapter 15 Section 15.01 DetectorResult, adds a Severity enum with a deliberate verdict-and-confidence mapping, and defines the DetectionEvent dataclass plus the single build_event function that turns a DetectorResult and request context into a platform-neutral, serialisable event. Every integration in the chapter starts from the event this returns.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library json, time, dataclasses, enum, and typing only. The DetectorResult and Evidence types are reproduced inline so the file runs standalone; in the suite they are imported from detector_api_contract.py. The severity mapping lives here, not in each connector, so every platform sorts detections identically. The __main__ block builds an event and round-trips it through JSON.
    code: |
      # detection_event_schema.py
      # Section 16.01: The Detection-Event Schema
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The one schema every SIEM integration consumes. A detector produces a
      # DetectorResult (Chapter 15 Section 15.01); the integration layer needs a
      # platform-neutral, serialisable event carrying the verdict, the scores, the
      # evidence, and the request context. This schema is that contract: a detection
      # is expressed once as a DetectionEvent and delivered to every platform --
      # Sigma, Splunk, Datadog, Elastic, custom -- through it.

      import json
      import time
      from dataclasses import dataclass, field, asdict
      from enum import Enum
      from typing import Any, Dict, List, Optional


      # --- Carried over from Chapter 15 Section 15.01 -----------------------------
      # Reproduced so this file runs standalone. In the suite these are imported from
      # detector_api_contract.py and every detector and integration shares them.

      class Verdict(Enum):
          ALLOW = 'allow'
          FLAG = 'flag'
          BLOCK = 'block'


      @dataclass
      class Evidence:
          source: str
          label: str
          detail: str = ''


      @dataclass
      class DetectorResult:
          detector: str
          verdict: Verdict
          score: float
          confidence: float
          latency_ms: float
          evidence: List[Evidence] = field(default_factory=list)


      # --- Severity: the operational urgency the SIEM sorts on --------------------
      # The verdict says what the detector decided; severity says how much a responder
      # should care. The mapping is deliberate and lives here, not in each connector,
      # so every platform sorts detections the same way.

      class Severity(Enum):
          INFO = 'info'
          LOW = 'low'
          MEDIUM = 'medium'
          HIGH = 'high'
          CRITICAL = 'critical'


      _VERDICT_SEVERITY = {
          Verdict.ALLOW: Severity.INFO,
          Verdict.FLAG: Severity.MEDIUM,
          Verdict.BLOCK: Severity.HIGH,
      }


      def severity_for(verdict: Verdict, confidence: float) -> Severity:
          '''Map a verdict and confidence to an operational severity. A high-confidence
          block is critical; a low-confidence flag drops to low. The SIEM sorts on this.'''
          base = _VERDICT_SEVERITY[verdict]
          if verdict is Verdict.BLOCK and confidence >= 0.9:
              return Severity.CRITICAL
          if verdict is Verdict.FLAG and confidence < 0.5:
              return Severity.LOW
          return base


      # --- The detection-event schema ---------------------------------------------

      SCHEMA_VERSION = '1.0'


      @dataclass
      class DetectionEvent:
          '''The platform-neutral detection event every integration consumes. Built
          from a Chapter 15 DetectorResult plus the request context, it is the single
          contract that Sigma generation and every connector translate from.'''
          schema_version: str
          event_id: str
          timestamp: str                          # ISO 8601 UTC
          detector: str
          verdict: str                            # Verdict value
          severity: str                           # Severity value
          score: float
          confidence: float
          latency_ms: float
          surface: str                            # 'input' or 'output'
          request_id: str
          session_id: Optional[str]
          source: str                             # the gateway/service emitting the event
          evidence: List[Dict[str, str]] = field(default_factory=list)
          iocs: List[Dict[str, str]] = field(default_factory=list)
          labels: Dict[str, str] = field(default_factory=dict)

          def to_dict(self) -> Dict[str, Any]:
              return asdict(self)

          def to_json(self) -> str:
              return json.dumps(self.to_dict(), separators=(',', ':'), sort_keys=True)


      def _iso_now() -> str:
          return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())


      def build_event(result: DetectorResult, *, request_id: str, surface: str = 'input',
                      session_id: Optional[str] = None, source: str = 'detection-gateway',
                      event_id: Optional[str] = None, timestamp: Optional[str] = None,
                      labels: Optional[Dict[str, str]] = None) -> DetectionEvent:
          '''Construct a DetectionEvent from a DetectorResult and request context. This
          is the one place a DetectorResult becomes a platform-neutral event; every
          integration starts from the event this returns, never from the raw result.'''
          ev = [{'source': e.source, 'label': e.label, 'detail': e.detail} for e in result.evidence]
          sev = severity_for(result.verdict, result.confidence)
          return DetectionEvent(
              schema_version=SCHEMA_VERSION,
              event_id=event_id if event_id is not None else f'{request_id}:{result.detector}',
              timestamp=timestamp if timestamp is not None else _iso_now(),
              detector=result.detector,
              verdict=result.verdict.value,
              severity=sev.value,
              score=round(result.score, 4),
              confidence=round(result.confidence, 4),
              latency_ms=round(result.latency_ms, 4),
              surface=surface,
              request_id=request_id,
              session_id=session_id,
              source=source,
              evidence=ev,
              iocs=[],
              labels=labels if labels is not None else {},
          )


      if __name__ == '__main__':
          result = DetectorResult(
              detector='prompt_injection', verdict=Verdict.BLOCK, score=0.92,
              confidence=0.94, latency_ms=3.4,
              evidence=[Evidence('pattern', 'instruction_override', 'ignore previous instructions')])
          event = build_event(result, request_id='req-1001', surface='input',
                              session_id='sess-42', source='prod-gateway-1')
          print('severity :', event.severity)
          print('event_id :', event.event_id)
          parsed = json.loads(event.to_json())
          assert parsed['detector'] == 'prompt_injection'
          assert parsed['severity'] == 'critical'
          assert parsed['schema_version'] == SCHEMA_VERSION
          print('round-trip: ok')
  deliverable_2:
    title: Push-Versus-Pull Integration Model Reference
    filename: integration_model_reference.py
    description: |-
      The push-versus-pull model as maintainable data: each platform classified by model and transport with a delivery note stating who owns delivery and what the latency and coupling look like. The connector sections build on this stated model rather than an implicit one.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library dataclasses, enum, and typing only. push_models and pull_models filter the reference so a later section can assert its connector's model. Self-checks by printing the classification and the push/pull counts.
    code: |
      # integration_model_reference.py
      # Section 16.01: Push vs Pull Integration Models
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The two ways a detection reaches a SIEM: the gateway pushes events to the
      # platform (HEC, Logs API, webhook), or the platform pulls them by evaluating
      # rules against events it already holds. This reference states the trade-off and
      # classifies each Chapter 16 connector, so the connector sections build on a
      # stated model rather than an implicit one.

      from dataclasses import dataclass
      from enum import Enum
      from typing import List


      class Model(Enum):
          PUSH = 'push'
          PULL = 'pull'


      @dataclass
      class IntegrationModel:
          platform: str
          model: Model
          transport: str
          delivery_note: str


      REFERENCE: List[IntegrationModel] = [
          IntegrationModel('Splunk', Model.PUSH, 'HTTP Event Collector (HEC)',
                           'Gateway POSTs events to the HEC token endpoint; low latency, gateway owns delivery.'),
          IntegrationModel('Datadog', Model.PUSH, 'Logs API + metrics',
                           'Gateway POSTs logs and submits metrics; near-real-time, gateway owns delivery.'),
          IntegrationModel('Elastic', Model.PUSH, 'Logstash HTTP input',
                           'Gateway POSTs to a Logstash pipeline that transforms and indexes; gateway owns delivery.'),
          IntegrationModel('Custom SIEM', Model.PUSH, 'Webhook contract',
                           'Gateway POSTs to an arbitrary endpoint on a documented contract; covers any platform.'),
          IntegrationModel('Sigma-based SIEM', Model.PULL, 'Generated Sigma rules',
                           'Platform evaluates Sigma rules against events it already ingests; portable, no bespoke connector.'),
      ]


      def push_models() -> List[IntegrationModel]:
          return [m for m in REFERENCE if m.model is Model.PUSH]


      def pull_models() -> List[IntegrationModel]:
          return [m for m in REFERENCE if m.model is Model.PULL]


      if __name__ == '__main__':
          for m in REFERENCE:
              print(f'{m.platform:16} [{m.model.value:4}] {m.transport}')
          print(f'\npush: {len(push_models())}  pull: {len(pull_models())}')
          assert len(push_models()) == 4 and len(pull_models()) == 1
          print('classification ok')
common_mistakes:
  mistake_1:
    description: |-
      Computing detections but never delivering them to the SIEM the security team watches
    why_it_happens: |-
      The detector suite is the hard, interesting engineering, and once it produces correct verdicts the work feels done. Delivery looks like plumbing.
    consequence: |-
      The detections exist only inside the gateway. No analyst sees them, no alert fires, and the suite's correct verdicts change nothing operationally -- the detection is a tree falling in an empty forest.
    correct_approach: |-
      Treat delivery as the last mile of the suite. Integrate the detections into the SIEM where triage, correlation, and response actually happen, so a correct verdict becomes an actioned alert.
  mistake_2:
    description: |-
      Writing a separate ad-hoc export for each platform instead of one shared event schema
    why_it_happens: |-
      Each platform has its own API, so it seems natural to write directly to each one, shaping the payload per platform as you go.
    consequence: |-
      The detection is expressed differently for every platform, the mappings drift apart, and a change to what a detection carries has to be made in every export by hand -- the integrations disagree about the same detection.
    correct_approach: |-
      Define one detection-event schema and build it in one place. Every connector translates from the same event, so a detection is expressed once and delivered to every platform consistently.
  mistake_3:
    description: |-
      Deriving severity inside each connector, so the platforms disagree about how urgent a detection is
    why_it_happens: |-
      Severity feels like a presentation detail each platform can decide for itself, and it is easy to add a quick mapping wherever the connector formats its payload.
    consequence: |-
      The same detection is critical in Splunk and medium in Datadog because each connector mapped it differently, so an analyst's sense of urgency depends on which console they happen to be looking at.
    correct_approach: |-
      Derive severity once, in the schema, from the verdict and confidence. Every connector carries the severity the event already has, so the platforms sort detections the same way.
  mistake_4:
    description: |-
      Hand-translating detectors into SIEM rules instead of generating and deploying them automatically
    why_it_happens: |-
      Writing one SIEM rule by hand is quick, and the drift it introduces is invisible until much later.
    consequence: |-
      Every detector change leaves the hand-written SIEM rule stale, and the gap between what the suite detects and what the SIEM evaluates grows silently until an incident exposes it.
    correct_approach: |-
      Generate Sigma rules from the detectors and push live events through the connectors, so the SIEM logic stays in sync with the deployed detectors by construction rather than by memory.
section_summary:
  compact: |-
    Section 16.01 anchors Chapter 16 by mapping how the Chapter 15 detector suite integrates with security operations. Its governing claim is that a detection that never reaches a security analyst in an actionable form is not actioned, so integration is the last mile of the suite rather than an afterthought. The section makes three commitments the chapter builds on. First, there is one detection-event schema: a single build_event function turns a Chapter 15 DetectorResult and its request context into a platform-neutral, serialisable DetectionEvent carrying the verdict, a severity derived from verdict and confidence, the scores, the evidence, and slots for IOCs and labels -- and every integration consumes that event and nothing else, so a detection is expressed once and delivered everywhere. Second, the integration surface has three parts answering three questions: Sigma rules for portable detection logic that runs on platforms the team does not control, platform connectors that push events into Splunk, Datadog, and Elastic, and alert enrichment that adds the Chapter 13 behavioural context, IOCs, and response actions to make a raw detection actionable. Third, the goal is automated rule deployment, keeping the SIEM in sync with the deployed detectors rather than drifting from them. Cutting across the platforms is the push-versus-pull distinction -- the connectors push events and own delivery, while Sigma is the pull-style portable option -- stated here so each connector section is explicit about its model. The chapter then builds the Sigma generator, the three connectors, and the custom webhook with enrichment, each a response to a named part of this taxonomy.
  key_takeaways:
  - |-
    A detection that is not delivered to the SIEM in an actionable form is not actioned; integration is the last mile of the suite
  - |-
    One detection-event schema is the integration contract: a DetectorResult plus request context becomes a platform-neutral event every integration consumes
  - |-
    Severity is derived once in the schema from verdict and confidence, so every platform sorts detections the same way
  - |-
    The integration surface has three parts: Sigma rules for portability, connectors for delivery, enrichment for actionability
  - |-
    Push connectors (Splunk, Datadog, Elastic, custom) own delivery; Sigma is the pull-style portable option that needs no bespoke connector
  - |-
    Automated rule deployment keeps the SIEM logic in sync with the deployed detectors instead of drifting from them
preview_section_16_02:
  title: Automated Sigma Rule Generation
  summary: |-
    Section 16.02 builds the Sigma rule generator, the portable core of the integration surface. It turns the detector suite's detections into Sigma rules -- platform-agnostic detection logic expressed in the logsource-detection-condition taxonomy -- by mapping detector verdicts to Sigma conditions, so the detection logic deploys to any SIEM platform. Because the rules are generated from the detectors rather than hand-authored, they stay in sync with the deployed detectors, and they connect back to the Chapter 11 signature layer that first introduced Sigma as a detection format.
