prose_content:
  part_1:
    title: Why Detections Must Reach Security Operations
    body: |-
      The detector suite of Chapter 15 is correct, fast, and deployed. It produces a verdict on every request, with a score, a confidence, and the evidence behind the decision. And none of that matters operationally until it reaches a human who can act on it. A detection that is computed and then left inside the gateway is a tree falling in an empty forest: the work happened, but nothing follows from it. The place a security team watches -- where alerts are triaged, correlated with other signals, and turned into a response -- is the SIEM. So the last mile of the detector suite is not more detection; it is delivery.

      This reframes integration from an afterthought into the step that turns the suite from a signal source into an operational capability. The argument of the whole chapter follows from it. If delivery is what makes a detection useful, then the integration must speak the SIEM's language rather than the detector's: it must produce events the platform can ingest, rules the platform can evaluate, and alerts a responder can act on without reconstructing the context from scratch. The rest of this section lays out the surface that does that, and the rest of the chapter builds it.
  part_2:
    title: 'The Integration Surface: Sigma, Connectors, Enrichment'
    body: |-
      The integration surface has three parts, and they answer three different questions. Sigma rules answer 'how does the detection logic run on a platform we do not control?' Sigma is portable, platform-agnostic detection logic -- a rule expressed once in a neutral format that Splunk, Elastic, and other platforms can each compile to their own query language. Generating Sigma rules from the detectors means the detection logic deploys anywhere without being rewritten per platform, and, because it is generated rather than hand-authored, it stays in sync with the detectors instead of drifting from them.

      Platform connectors answer 'how do the detections themselves get into the platform?' A connector pushes detection events into a specific SIEM through its ingestion API -- Splunk's HTTP Event Collector, Datadog's Logs API, Elastic's Logstash pipelines -- mapping the shared event schema to that platform's field model so a detection becomes a searchable, alertable record there. Alert enrichment answers 'how does a raw detection become something a responder can act on?' A bare detection is an isolated event; enrichment adds the entity, session, and graph context of Chapter 13, the IOCs the detection implies, and the response actions available, so the alert arrives with the story already attached. Three parts, three questions, one detector suite behind all of them.
  part_3:
    title: The Platforms and the Push-Versus-Pull Model
    body: |-
      Chapter 16 integrates four kinds of destination: Splunk, Datadog, the Elastic Stack, and a custom webhook path for anything else. The first three are the common enterprise SIEM and observability platforms, each with a dedicated connector; the fourth is the escape hatch, a documented webhook contract that lets the suite deliver to any platform without a bespoke connector. Between them they cover the realistic deployment landscape: a team is on one of the big three, or it is on something else that can receive an HTTP POST.

      Cutting across the platforms is a model distinction worth naming up front. In a push integration, the gateway sends events to the platform -- it owns delivery, and the event arrives with low latency the moment the detection is made. The Splunk, Datadog, Elastic, and custom-webhook connectors are all push. In a pull integration, the platform fetches or evaluates rules against events it already holds -- the Sigma path is effectively pull, because the generated rules run on the platform against data it has ingested, with no per-event delivery from the gateway. The distinction matters because it decides who owns delivery and what the latency and coupling look like, and every connector section states which model it uses so the trade-off is explicit rather than buried.
  part_4:
    title: 'The Detection-Event Schema: The Integration Contract'
    body: |-
      Everything downstream consumes one object: the detection event. A detector produces a DetectorResult in the Chapter 15 shape -- detector name, verdict, score, confidence, latency, and evidence. That is the right shape for a detector to return, but it is the wrong shape to ship to a SIEM: it has no timestamp, no request context, no severity a platform can sort on, no room for IOCs, and it carries a Python enum rather than a serialisable value. The detection-event schema closes that gap. It wraps the DetectorResult with the request context (request id, session, surface, the emitting source), a timestamp, a severity derived from the verdict and confidence, and slots for evidence, IOCs, and labels -- all as plain, serialisable data.

      Building the event in one place is the point. There is exactly one function that turns a DetectorResult into a DetectionEvent, and every integration starts from the event it returns, never from the raw result. That single choke point is what makes the schema a contract: the Sigma generator, the three connectors, and the enrichment pipeline all translate from the same object, so a detection is expressed once and delivered to every platform consistently. Add a field to the event and every integration sees it; change how severity is derived and every platform sorts the same new way. The severity mapping itself lives in the schema, not in each connector, precisely so the platforms cannot disagree about how urgent a detection is. The schema is the small, boring, central artifact that the rest of the chapter leans on.
  part_5:
    title: Automated Rule Deployment and the Chapter Roadmap
    body: |-
      The last commitment is that the integration is automated, not manual. A detection system where an engineer hand-translates each detector into a SIEM rule has a drift problem built in: the moment a detector changes, the SIEM rule that mirrors it is stale, and the gap between what the suite detects and what the SIEM evaluates grows silently until an incident reveals it. Automated rule deployment removes that gap. The Sigma rules are generated from the detectors, so regenerating them after a detector change keeps the SIEM logic current by construction, and the connectors push live events rather than depending on a rule someone remembered to update. Keeping the SIEM in sync with the detectors is a first-class goal, not a maintenance chore.

      The chapter follows the surface directly. Section 16.02 builds the Sigma rule generator -- the portable logic. Sections 16.03, 16.04, and 16.05 build the three platform connectors -- Splunk via HEC, Datadog via the Logs API and metrics, and Elastic via Logstash pipelines -- each mapping the detection-event schema to its platform and each stating its integration model. Section 16.06 builds the custom webhook path for any other platform and the alert enrichment pipeline that makes the delivered detections actionable, drawing in the Chapter 13 behavioural context. Section 16.07 synthesises the integration and previews Chapter 17, where the detections now flowing into the SIEM feed the monitoring and tuning loops that improve the detectors over time. Each following section is a response to a named part of this taxonomy.
