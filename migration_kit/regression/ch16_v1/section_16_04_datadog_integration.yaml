prose_content:
  part_1:
    title: 'Two Channels: Detail and Aggregate'
    body: |-
      A detection is two things at once. It is an individual event -- this request, this verdict, this evidence -- that a responder opens and investigates. And it is a data point in a rate -- one of the N injections blocked this hour -- that a team watches for trends and spikes. Splunk's connector treated the detection as an event; Datadog's connector treats it as both, because Datadog is a platform built to hold logs and metrics side by side, and using only one channel would waste half of what it offers.

      So the connector has two channels. The Logs API channel pushes each detection as a structured log, carrying the full event and the tags Datadog facets on, for the investigator who needs the detail. The metrics channel submits aggregated counts -- detections per detector, verdict, and severity -- as time series, for the analyst and the operations engineer who need the trend. Both are push: the gateway submits logs and metrics as detections occur, owning delivery of each. The two channels are not redundant; they answer different questions about the same detections, and the rest of the section builds each and connects the metrics channel to the observability work of Chapter 14.
  part_2:
    title: 'The Logs API: Per-Detection Detail'
    body: |-
      The Datadog Logs API accepts structured log entries, and the detection-event schema maps onto one cleanly. The log's tags carry the dimensions a team slices on -- detector, verdict, severity, surface -- as key:value pairs, so a query for 'all high-severity jailbreak blocks' is a tag filter rather than a text search. The log's status is derived from the detection's severity, mapping the schema's severity levels onto Datadog's status levels so a critical detection reads as critical in the Datadog log stream and colours and sorts accordingly. The hostname carries the emitting gateway instance, and the timestamp is converted to the millisecond epoch Datadog expects.

      The message holds the full detection event as JSON. As with Splunk's body, this is the deliberate choice that keeps an investigation possible: the tags make the common slice fast, but the complete detection -- scores, confidence, evidence, session, surface -- lives in the message, so an analyst who filters down to one alert has everything the detector knew. The tags are the index; the message is the record. Getting the status mapping right matters more than it looks: it is what makes Datadog's severity-based alerting and visual triage work on detections, so a critical exfiltration block stands out from a medium PII flag without a custom rule.
  part_3:
    title: 'The Metrics Channel: Aggregate Rates'
    body: |-
      The metrics channel answers the question the logs cannot answer efficiently: how many, how fast, trending which way? The connector aggregates a batch of detection events into count metric series, one series per combination of detector, verdict, and severity, each tagged with those dimensions. Two blocked jailbreaks in the same batch become one series with a count of two, not two separate points -- the aggregation is the point, because a metric is about the rate, not the individual event. The series sit under a configured metric namespace, so all detection metrics share a common prefix and are easy to find and dashboard together.

      Aggregating at the connector rather than making Datadog count raw logs is a cost and clarity choice. Counting logs works but is expensive and imprecise; submitting pre-aggregated counts gives Datadog exact rates cheaply, and the dimensional tags let a dashboard break the total down by detector or severity on demand. This is the same discipline as the Chapter 14 cost work applied to the metrics channel: send the aggregate the platform needs, not the raw stream it would have to reduce. The metrics channel turns the detection stream into the rates a team monitors, and the next part connects those rates to the observability metrics already on the platform.
  part_4:
    title: Connecting to the Chapter 14 Observability Signals
    body: |-
      Chapter 14 Section 14.08 instrumented the gateway with the golden signals -- latency, traffic, errors, saturation -- and put them on an observability platform so the system could be operated. Those are operational metrics: how the gateway is running. Detection metrics are a different family: what the gateway is catching. But they belong on the same platform, because the two families answer questions that constantly cross over. A spike in detection rate alongside a spike in latency might be an attack driving both; a drop in detections alongside normal traffic might be a detector silently failing. Separated onto two platforms, those correlations are invisible; together on Datadog, they are one dashboard.

      So the connector submits detection metrics under a namespace that sits alongside the Chapter 14 observability metrics, and the payoff is a unified operational picture. An operations engineer watching gateway health and a security analyst watching detection rates look at the same Datadog, can build shared dashboards, and can write monitors that span both families -- alert when detections spike, when a detector's rate drops to zero, when detection latency and volume rise together. This is why Datadog gets a metrics channel that Splunk's section did not emphasise: the platform is where the suite's detection signals and the gateway's operational signals become one view, closing the loop the observability chapter opened.
  part_5:
    title: Testing Both Channels End to End
    body: |-
      The connector is validated on a stub transport that captures both channels. The tests check the logs path -- correct faceting tags, the severity-to-status mapping across all levels, the full detection preserved in the message, the millisecond timestamp -- and, separately, the metrics path -- that events aggregate correctly, so two identical detections become one series with a count of two rather than two series or two points. A combined test confirms that a batch produces one log per event and the right number of aggregated series, and that both channels report success.

      Testing the aggregation explicitly is what makes the metrics channel trustworthy. A logs channel is easy to reason about -- one event, one log -- but a metrics channel that miscounts is worse than none, because a dashboard that shows the wrong rate is believed. So the harness asserts the counts directly: N identical detections yield a single series with count N, and distinct detections yield distinct series. As with Splunk, the stub proves the mapping and delivery contract without a live Datadog, and pointing the connector at a real Logs API and metrics endpoint is a configuration change carrying an environment-sourced API key. With Datadog holding both the detail and the aggregate, Section 16.05 builds the third connector for the Elastic Stack.
