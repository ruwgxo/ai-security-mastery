deliverables:
  deliverable_1:
    title: The Datadog Connector
    filename: datadog_integration.py
    description: |-
      The two-channel Datadog connector: to_datadog_log maps a detection event to a Datadog log with faceting tags, a severity-derived status, and the full event in the message; to_datadog_metrics aggregates events into count series by detector, verdict, and severity; DatadogConnector pushes both channels behind a swappable transport. Runs standalone on an in-memory stub.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library json, time, dataclasses, and typing only. The DetectionEvent is a dict via sample_event for standalone running; in the suite it imports DetectionEvent from detection_event_schema.py. StubDatadogTransport captures both channels; the real transport POSTs to the Logs API and the series endpoint with a DD-API-KEY header. Self-checks that identical detections aggregate into one series with the summed count and that severity maps to the right status.
    code: |
      # datadog_integration.py
      # Section 16.04: Datadog Integration -- Logs API and Metrics
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The second platform connector, and the first with two channels. It pushes
      # detection events into Datadog through the Logs API, and submits detection
      # metrics -- counts by detector, verdict, and severity -- through the metrics
      # interface. The logs give per-detection detail; the metrics give the aggregate
      # picture that connects to the Chapter 14 Section 14.08 observability signals.

      import json
      import time
      from dataclasses import dataclass
      from typing import Any, Dict, List, Optional


      def sample_event() -> Dict[str, Any]:
          return {
              'schema_version': '1.0', 'event_id': 'req-2001:jailbreak',
              'timestamp': '2026-01-21T11:00:00Z', 'detector': 'jailbreak',
              'verdict': 'block', 'severity': 'high', 'score': 0.88, 'confidence': 0.91,
              'latency_ms': 5.1, 'surface': 'input', 'request_id': 'req-2001',
              'session_id': 'sess-9', 'source': 'prod-gateway-2',
              'evidence': [{'source': 'ml', 'label': 'jailbreak_classifier', 'detail': 'roleplay framing'}],
              'iocs': [], 'labels': {},
          }


      class DatadogTransport:
          def submit_logs(self, api_key: str, logs: List[Dict[str, Any]]) -> Dict[str, Any]:
              raise NotImplementedError
          def submit_metrics(self, api_key: str, series: List[Dict[str, Any]]) -> Dict[str, Any]:
              raise NotImplementedError


      class StubDatadogTransport(DatadogTransport):
          def __init__(self) -> None:
              self.logs: List[Dict[str, Any]] = []
              self.metrics: List[Dict[str, Any]] = []
          def submit_logs(self, api_key, logs):
              self.logs.extend(logs); return {'status': 'ok'}
          def submit_metrics(self, api_key, series):
              self.metrics.extend(series); return {'status': 'ok'}


      @dataclass
      class DatadogConfig:
          site: str = 'datadoghq.com'
          log_source: str = 'ai-detection'
          metric_namespace: str = 'ai.detection'
          service: str = 'detection-gateway'
          api_key_env_var: str = 'DD_API_KEY'

          def validate(self) -> None:
              assert self.log_source and self.metric_namespace, 'log source and metric namespace required'
              assert self.service, 'service is required'


      def _iso_to_epoch(ts: str) -> int:
          return int(time.mktime(time.strptime(ts, '%Y-%m-%dT%H:%M:%SZ')))


      def _dd_status(severity: str) -> str:
          return {'info': 'info', 'low': 'notice', 'medium': 'warning',
                  'high': 'error', 'critical': 'critical'}.get(severity, 'info')


      def to_datadog_log(event: Dict[str, Any], cfg: DatadogConfig) -> Dict[str, Any]:
          '''Map a detection event to a Datadog log. Tags carry the faceting
          dimensions; the message holds the full detection as JSON.'''
          tags = [f'detector:{event["detector"]}', f'verdict:{event["verdict"]}',
                  f'severity:{event["severity"]}', f'surface:{event["surface"]}']
          return {'ddsource': cfg.log_source, 'service': cfg.service, 'ddtags': ','.join(tags),
                  'hostname': event['source'], 'timestamp': _iso_to_epoch(event['timestamp']) * 1000,
                  'status': _dd_status(event['severity']), 'message': json.dumps(event, sort_keys=True)}


      def to_datadog_metrics(events: List[Dict[str, Any]], cfg: DatadogConfig) -> List[Dict[str, Any]]:
          '''Aggregate events into Datadog count series: one per (detector, verdict,
          severity). These aggregate rates connect to the Chapter 14 observability signals.'''
          now = int(time.time())
          counts: Dict[tuple, int] = {}
          for e in events:
              key = (e['detector'], e['verdict'], e['severity'])
              counts[key] = counts.get(key, 0) + 1
          series: List[Dict[str, Any]] = []
          for (detector, verdict, severity), n in sorted(counts.items()):
              series.append({'metric': f'{cfg.metric_namespace}.count', 'type': 'count',
                             'points': [[now, n]],
                             'tags': [f'detector:{detector}', f'verdict:{verdict}', f'severity:{severity}']})
          return series


      class DatadogConnector:
          '''Two-channel push connector: Logs API for detail, metrics for aggregate rate.'''
          name = 'datadog'
          model = 'push'

          def __init__(self, transport: Optional[DatadogTransport] = None,
                       config: Optional[DatadogConfig] = None) -> None:
              self._transport = transport if transport is not None else StubDatadogTransport()
              self._cfg = config if config is not None else DatadogConfig()

          def send(self, events: List[Dict[str, Any]], api_key: str = 'stub-key') -> Dict[str, Any]:
              self._cfg.validate()
              logs = [to_datadog_log(e, self._cfg) for e in events]
              metrics = to_datadog_metrics(events, self._cfg)
              lr = self._transport.submit_logs(api_key, logs)
              mr = self._transport.submit_metrics(api_key, metrics)
              return {'logs_sent': len(logs), 'metric_series': len(metrics),
                      'logs_ok': lr.get('status') == 'ok', 'metrics_ok': mr.get('status') == 'ok'}


      if __name__ == '__main__':
          stub = StubDatadogTransport()
          conn = DatadogConnector(transport=stub)
          events = [sample_event(),
                    {**sample_event(), 'event_id': 'req-2002:jailbreak', 'request_id': 'req-2002'},
                    {**sample_event(), 'detector': 'pii_scanner', 'verdict': 'flag', 'severity': 'medium',
                     'event_id': 'req-2003:pii', 'request_id': 'req-2003'}]
          result = conn.send(events)
          print('result:', result)
          jb = [s for s in stub.metrics if 'detector:jailbreak' in s['tags'] and 'verdict:block' in s['tags']]
          assert len(jb) == 1 and jb[0]['points'][0][1] == 2
          assert result['logs_sent'] == 3 and result['metric_series'] == 2
          assert result['logs_ok'] and result['metrics_ok']
          assert stub.logs[0]['status'] == 'error'
          print('datadog logs + metrics aggregation: ok')
  deliverable_2:
    title: Datadog Integration End-to-End Test
    filename: datadog_integration_test.py
    description: |-
      Four tests over both channels on the stub transport: the log mapping carries the right tags, status, and full message; the metrics path aggregates identical detections into one series with the summed count; a batch produces one log per event and the right number of series; and the severity-to-status mapping is correct at every level. The aggregation test is what makes the metrics channel trustworthy.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library only, imports the connector under test. The metric-aggregation test asserts counts directly, because a metrics channel that miscounts is worse than none -- a wrong rate on a dashboard is believed.
    code: |
      # datadog_integration_test.py
      # Section 16.04: Datadog Integration End-to-End Test
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Confirms both Datadog channels end to end on the stub transport: the Logs API
      # path produces logs with the right tags, status, and full-detection message,
      # and the metrics path aggregates events into count series by dimension.

      from datadog_integration import (DatadogConnector, StubDatadogTransport, DatadogConfig,
                                       to_datadog_log, to_datadog_metrics, sample_event)


      def test_log_mapping() -> None:
          log = to_datadog_log(sample_event(), DatadogConfig())
          assert 'detector:jailbreak' in log['ddtags']
          assert log['status'] == 'error'
          assert '"score": 0.88' in log['message'] or '"score":0.88' in log['message']
          assert isinstance(log['timestamp'], int)


      def test_metric_aggregation() -> None:
          events = [sample_event(), sample_event(),
                    {**sample_event(), 'detector': 'toxicity_detector', 'verdict': 'flag', 'severity': 'medium'}]
          series = to_datadog_metrics(events, DatadogConfig())
          assert len(series) == 2
          jb = [s['points'][0][1] for s in series if any('detector:jailbreak' in t for t in s['tags'])][0]
          assert jb == 2


      def test_both_channels_delivered() -> None:
          stub = StubDatadogTransport()
          result = DatadogConnector(transport=stub).send([sample_event() for _ in range(4)])
          assert result['logs_sent'] == 4
          assert result['metric_series'] == 1
          assert result['logs_ok'] and result['metrics_ok']
          assert len(stub.logs) == 4 and len(stub.metrics) == 1


      def test_severity_status_mapping() -> None:
          for sev, status in [('info', 'info'), ('medium', 'warning'), ('high', 'error'), ('critical', 'critical')]:
              log = to_datadog_log({**sample_event(), 'severity': sev}, DatadogConfig())
              assert log['status'] == status, (sev, log['status'])


      if __name__ == '__main__':
          tests = [test_log_mapping, test_metric_aggregation, test_both_channels_delivered, test_severity_status_mapping]
          for t in tests:
              t(); print(f'PASS {t.__name__}')
          print(f'{len(tests)}/{len(tests)} datadog integration tests passed')
  deliverable_3:
    title: Datadog Integration Configuration
    filename: datadog_config.py
    description: |-
      Configuration for the connector: the Datadog site, log source, metric namespace, and service, with the API key read from the environment. The metric namespace is the operational knob that places detection metrics beside the Chapter 14 observability metrics. Derives the correct logs and metrics endpoints per site and ships production and EU profiles.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library os, dataclasses, and typing only. logs_endpoint and metrics_endpoint derive the site-specific URLs; resolve_api_key fails loudly on a missing key; redacted hides the secret. Self-checks that both profiles validate and the key resolves from the environment.
    code: |
      # datadog_config.py
      # Section 16.04: Datadog Integration Configuration
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Configuration for the Datadog connector. The metric namespace is the key knob:
      # it places detection metrics beside the Chapter 14 observability metrics. The API
      # key is read from the environment.

      import os
      from dataclasses import dataclass, asdict
      from typing import Any, Dict


      @dataclass
      class DatadogDeploymentConfig:
          site: str = 'datadoghq.com'
          log_source: str = 'ai-detection'
          metric_namespace: str = 'ai.detection'
          service: str = 'detection-gateway'
          env: str = 'prod'
          api_key_env_var: str = 'DD_API_KEY'

          def logs_endpoint(self) -> str:
              return f'https://http-intake.logs.{self.site}/api/v2/logs'
          def metrics_endpoint(self) -> str:
              return f'https://api.{self.site}/api/v2/series'
          def resolve_api_key(self) -> str:
              key = os.environ.get(self.api_key_env_var, '')
              assert key, f'{self.api_key_env_var} is not set -- Datadog API key required'
              return key
          def validate(self) -> None:
              assert self.site in ('datadoghq.com', 'datadoghq.eu', 'us3.datadoghq.com'), 'unknown Datadog site'
              assert self.log_source and self.metric_namespace and self.service, 'required fields missing'
          def redacted(self) -> Dict[str, Any]:
              d = asdict(self); d['api_key'] = '(from ' + self.api_key_env_var + ')'; return d


      PRODUCTION = DatadogDeploymentConfig()
      EU = DatadogDeploymentConfig(site='datadoghq.eu')


      if __name__ == '__main__':
          os.environ.setdefault('DD_API_KEY', 'demo-key-not-real')
          for name, cfg in [('production', PRODUCTION), ('eu', EU)]:
              cfg.validate()
              print(f'{name:11} logs={cfg.logs_endpoint()}')
          print('api key resolves:', bool(PRODUCTION.resolve_api_key()))
          print('all datadog profiles valid')
common_mistakes:
  mistake_1:
    description: Sending detections to Datadog only as logs, skipping the metrics channel
    why_it_happens: |-
      The logs channel alone gets every detection into Datadog, so the integration looks complete once logs flow.
    consequence: |-
      There is no cheap, exact rate to dashboard or alert on, so the team either counts logs expensively or misses trends and spikes entirely.
    correct_approach: |-
      Use both channels: logs for per-detection detail and pre-aggregated count metrics for the rates a team monitors and alerts on.
  mistake_2:
    description: Submitting one metric point per detection instead of aggregating by dimension
    why_it_happens: It mirrors the logs path -- one event, one submission -- and feels consistent.
    consequence: |-
      The metrics volume balloons, costs rise, and the series are noisier and less precise than a clean count per detector, verdict, and severity.
    correct_approach: |-
      Aggregate events into count series by dimension at the connector, so Datadog gets exact rates cheaply and dashboards break them down by tag.
  mistake_3:
    description: Putting detection metrics on a separate platform from the operational metrics
    why_it_happens: |-
      Detection and operations feel like different teams' concerns, so the metrics land wherever each team already looks.
    consequence: |-
      A detection spike and a latency spike cannot be correlated because they live on different platforms, and the cross-cutting questions go unanswered.
    correct_approach: |-
      Submit detection metrics under a namespace alongside the Chapter 14 observability metrics, so both families share dashboards and monitors.
  mistake_4:
    description: |-
      Not mapping severity to Datadog's status, leaving every detection at the same level
    why_it_happens: |-
      The log flows fine without a status, and severity is already in the tags, so setting status feels redundant.
    consequence: |-
      Datadog's severity-based alerting and visual triage do not work on detections, so a critical exfiltration block looks identical to a medium PII flag.
    correct_approach: |-
      Map the schema severity onto Datadog's status levels, so severity-based alerting, colouring, and sorting work on detections out of the box.
section_summary:
  compact: |-
    Section 16.04 builds the second platform connector, delivering detections to Datadog over two channels, because a detection is both an individual event a responder investigates and a data point in a rate a team watches. The Logs API channel pushes each detection as a structured log: faceting tags carry detector, verdict, severity, and surface so a slice is a tag filter rather than a text search; the log status is derived from the schema severity so Datadog's severity-based alerting and triage work on detections; and the full event lives in the message so an investigation has everything the detector knew. The metrics channel submits aggregated counts -- one series per detector, verdict, and severity combination -- so two identical detections become one series with a count of two, giving Datadog exact rates cheaply rather than making it count raw logs. The metrics channel is the reason this section is distinct from Splunk's: detection metrics are submitted under a namespace alongside the Chapter 14 Section 14.08 observability metrics, so operational signals (latency, throughput, errors) and detection signals (rates by detector and severity) share one platform, and a team can correlate a detection spike with a latency spike, alert across both families, and see the gateway's health and its catching in one view. Both channels are push, so the gateway owns delivery, and the whole integration is tested end to end on a stub transport -- with the metric aggregation asserted directly, because a miscounting metrics channel is worse than none. The API key is read from the environment.
  key_takeaways:
  - |-
    A detection is both an event to investigate and a data point in a rate, so the Datadog connector uses two channels
  - |-
    The Logs API carries each detection with faceting tags, a severity-derived status, and the full event in the message
  - |-
    The metrics channel aggregates events into count series by detector, verdict, and severity for cheap, exact rates
  - |-
    Detection metrics share a namespace with the Chapter 14 observability metrics, so the two families correlate on one platform
  - |-
    Severity maps to Datadog's status so severity-based alerting and triage work on detections out of the box
  - |-
    Both channels are push and are tested on a stub, with the metric aggregation asserted directly
preview_section_16_05:
  title: 'Elastic Stack Integration: Logstash Pipelines'
  summary: |-
    Section 16.05 builds the third platform connector, integrating the detector suite with the Elastic Stack through Logstash pipelines that transform detection events into Elasticsearch documents, making them searchable and visualisable in Kibana. Its distinguishing feature is the transformation stage: a Logstash pipeline applies the field mapping between the detection-event schema and the Elasticsearch document, and the generated Sigma rules deploy as Elastic detection rules.
