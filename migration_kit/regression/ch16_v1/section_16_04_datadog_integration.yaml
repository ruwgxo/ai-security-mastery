section_overview:
  one_line_summary: |-
    The second platform connector, and the first with two channels: detections pushed through the Datadog Logs API for per-detection detail, and detection rates submitted through the metrics interface for the aggregate picture -- the metrics connecting to the Chapter 14 Section 14.08 observability signals so operational and detection metrics share one platform.
  why_this_section_exists: |-
    Splunk showed the connector shape with a single channel: push each detection as an event. Datadog adds the dimension that a SIEM-plus-observability platform makes natural -- the aggregate. A detection is two things at once: an individual event a responder investigates, and a data point in a rate a team watches for trends. Datadog is built to hold both, so the connector uses both channels. The Logs API carries each detection as a structured log with tags Datadog facets on and the full event in the message; the metrics interface carries counts by detector, verdict, and severity as time series that dashboards and monitors are built on.

    The second channel is the reason this section is distinct rather than a repeat of Splunk. In Chapter 14 Section 14.08, the gateway's operational metrics -- latency, throughput, error rates -- were instrumented for observability. Detection metrics belong on the same platform, because the questions cross over: an operations engineer watching gateway health and a security analyst watching detection rates are looking at the same system, and Datadog lets them share dashboards, correlate a detection spike with a latency spike, and alert on both. Submitting detection counts under a metric namespace alongside the observability metrics is what unifies the two views. The connector is a push integration on both channels -- the gateway owns delivery of logs and metrics alike -- and, as with Splunk, it is tested end to end on a stub transport.
  position_in_chapter: |-
    Section 16.04 is the second of the three platform connectors and follows the connector shape 16.03 established, adding the metrics channel. It consumes the detection-event schema of 16.01 and connects its metrics channel to the Chapter 14 Section 14.08 observability signals, so the detection rates sit beside the operational metrics. The two-channel pattern -- detail plus aggregate -- informs how the summary (16.07) frames what a complete platform integration delivers.
