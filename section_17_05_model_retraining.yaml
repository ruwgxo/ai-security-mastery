section_overview:
  one_line_summary: |-
    Retraining turns the curated dataset into a refreshed detector, and the section is about the three disciplines around the training call rather than the call itself: WHEN to retrain -- triggered by the Chapter 13 drift signal and accumulated labels, not a fixed calendar; VALIDATION -- every candidate checked against the quality bar and the incumbent on a held-out set before it may be promoted, because a retrained detector can be worse; and PROMOTION -- through the Chapter 12 model registry as a versioned artifact with a rollback path, so a regression can be undone.
  why_this_section_exists: |-
    Curation (17.04) produced trustworthy labelled data; this section refreshes the detectors on it. The training call itself is the least interesting part -- fit a model to data -- and the section deliberately stubs it, because the engineering that matters is the discipline that surrounds it. A detection system that retrains carelessly is more dangerous than one that never retrains at all, because careless retraining replaces a known-good detector with an unproven one and calls it an upgrade. The whole point of this section is to make retraining safe, and safety here has three parts that map to three questions the naive approach gets wrong.

    When to retrain: not on a schedule. A calendar-based 'retrain every month' either retrains when nothing has changed -- wasting effort and risking a regression for no gain -- or fails to retrain when the world has shifted fast, leaving the detector stale between calendar dates. The trigger is instead the Chapter 13 drift signal (the live distribution has moved far enough to warrant a refresh) or the accumulation of enough new curated labels, with a cooldown to prevent thrashing on a noisy signal. How to validate: never trust the candidate. A retrained model can be worse than the incumbent -- trained on residual label noise, on a lingering imbalance, or on an adversarially poisoned dataset -- and the only way to know is to measure it on a held-out evaluation set against both an absolute quality bar and the current incumbent, rejecting any candidate that fails either. How to promote: reversibly. A validated candidate enters the model registry as a new version and becomes production, but the previous version stays available, so a candidate that passed validation yet regresses in production can be rolled back. These three disciplines are what separate a retraining pipeline that improves the suite from one that degrades it.
  position_in_chapter: |-
    Section 17.05 is the retraining stage of the improvement loop, consuming the curated dataset from 17.04 and producing a validated, registry-promoted candidate for the A/B testing of 17.06. It is where the Chapter 13 Section 13.05 drift signal becomes an action trigger and where the Chapter 12 Section 12.14 model registry provides versioned promotion and rollback. Its validation discipline is the first of the two safety gates -- the second being the live A/B test -- that guard the path to production.
