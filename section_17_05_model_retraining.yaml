prose_content:
  part_1:
    title: The Discipline Around the Training Call
    body: |-
      Retraining a detector sounds like the core of a chapter on tuning, and it is the stage everyone pictures when they imagine improving a model: take the new data, fit a new model, ship it. But the fitting is the easy part, and in a security context it is also the least dangerous part to get slightly wrong -- a marginally worse model that is caught and rejected costs nothing. What is genuinely dangerous is shipping the new model without knowing whether it is better, because that replaces a detector whose behaviour is known and trusted with one whose behaviour is not, under the reassuring label of an upgrade. This section is built on the premise that careless retraining is worse than no retraining, and so it treats the training call as a stubbed black box and spends its attention on the three disciplines that make retraining safe: when to do it, how to check the result, and how to ship it reversibly.

      The stub is a deliberate teaching choice, consistent with how the rest of Part 4 stubbed external services. The retrainer fits a simple separating threshold on a score feature -- enough to exhibit real train-and-validate behaviour, deterministically and with no modelling library -- and a production deployment swaps in a real trainer behind the same interface. Nothing about the disciplines changes when the stub is replaced by a gradient-boosted model or a fine-tuned transformer: the trigger still decides when, validation still decides whether, and the registry still decides how it ships. By stubbing the model, the section keeps the focus where the engineering risk actually lives -- not in the mathematics of fitting, but in the process that decides whether a freshly-fitted detector is allowed anywhere near production traffic.
  part_2:
    title: 'When to Retrain: Drift and Labels, Not the Calendar'
    body: |-
      The most common retraining schedule is a calendar: retrain monthly, or quarterly, or nightly. Every calendar schedule is wrong in one of two directions. If the world has not changed since the last retrain, a scheduled retrain does pure risk for no reward -- it spins up a new candidate that might regress, to solve a problem that does not exist, because the current detector is still well-matched to current traffic. If the world has changed fast -- a new attack technique in wide use, a sudden traffic shift -- a calendar leaves the detector stale in the gap between scheduled dates, missing exactly the attacks the retrain would have caught. A schedule optimises for neither the cost nor the need; it optimises for being easy to put in a cron job.

      The right trigger is the signal that the world has actually moved, and Chapter 13 already built it: the drift detector, whose score rises as the live distribution diverges from the training distribution. When drift crosses a threshold, a retrain is warranted because the detector's assumptions have measurably decayed. The trigger fires on that drift signal or, alternatively, on the accumulation of enough new curated labels -- because a large batch of fresh ground truth is worth incorporating even without a strong drift signal, and because it means the retrain will have enough new data to learn from. Over both sits a cooldown: a minimum number of cycles between retrains, so a drift signal that flickers above and below its threshold cannot cause the loop to retrain every few minutes. Thrashing is its own failure mode -- constant retraining is constant regression risk and constant churn in production -- and the cooldown is the governor that keeps a responsive trigger from becoming a hair-trigger. Retraining becomes an event driven by evidence, fired when the data says it is needed and blocked when it is too soon to be safe.
  part_3:
    title: Why a Candidate Must Never Be Trusted
    body: |-
      Suppose the trigger fires, the retrainer fits a candidate on the curated training view, and the candidate is ready. The single most important rule in the section is: do not ship it. A freshly retrained candidate is an unknown, and there are concrete reasons it may be worse than the incumbent it would replace, none of them exotic. The curated data, however carefully gated in 17.04, may carry residual label noise -- dispositions that were resolved but still wrong. It may carry a subtler imbalance than the rebalancing corrected for. And most seriously, it may have been poisoned: an adversary who understands that analyst dispositions become training labels could deliberately shape those dispositions to teach the detector to ignore their attacks, turning the improvement loop into an attack vector. A candidate trained on any of these is worse than the incumbent, and it arrives looking exactly like a candidate trained on good data.

      The defence is validation: measure the candidate on a held-out evaluation set before it is allowed to be promoted, against two bars. The absolute quality bar is the floor from Part 4 -- minimum recall, maximum false-positive rate, minimum precision -- that any deployable detector must clear; a candidate below it is unfit regardless of how it compares to the incumbent. The relative bar is the incumbent itself: a candidate that clears the absolute floor but detects fewer attacks than the detector it would replace is a regression, and retraining must never go backwards, so a recall regression against the incumbent rejects the candidate even if it technically passes the floor. A candidate must clear both to be promotable. This is why the poisoned dataset in the section's example is caught: the poison drives the candidate's recall below the bar and below the incumbent, and validation refuses to promote it, leaving production untouched. Validation is the checkpoint that makes the whole retraining path safe to run automatically -- because a candidate that fails it simply does not ship, and the loop tries again next cycle with more data.
  part_4:
    title: Validating on the True Distribution
    body: |-
      There is a subtle trap in how validation is measured, and getting it wrong quietly defeats the whole check. The candidate was trained on the rebalanced training view from 17.04 -- the view that caps the benign class so the trainer can learn a boundary. It would be natural to validate on a similarly balanced set. It would also be wrong, and wrong in a way that echoes the base-rate problem of 17.02. Precision measured on a balanced set is a fiction: it tells you what precision the detector would have if attacks were as common as benign traffic, which they are not. A detector can look precise on a 50/50 evaluation set and flood analysts with false positives in production, because production has the real, rare-attack base rate that makes the false-positive rate dominate precision.

      So validation must use the true, imbalanced distribution -- the full curated set from 17.04, not the training view. This is exactly why 17.04 was careful to keep the full set intact alongside the rebalanced view: the rebalanced view is for training, and the true distribution is for judging. Measuring the candidate's recall, false-positive rate, and precision on the imbalanced evaluation set gives numbers that predict production behaviour, because the evaluation set has production's shape. The quality bar's precision floor only means something when it is measured this way; on a balanced set it would be trivially passed by detectors that would fail catastrophically in production. The training/evaluation distinction that curation set up is not bookkeeping -- it is what makes validation predictive, and validating on the wrong distribution is a way to pass every candidate and ship regressions with confidence.
  part_5:
    title: Reversible Promotion Through the Registry
    body: |-
      A candidate that passes validation earns promotion, but promotion is not a file copy that overwrites the running model. It goes through the model registry that Chapter 12 Section 12.14 built: the candidate is registered as a new version, the registry records it in the version history, and it becomes the current production version -- while every previous version remains stored and available. This versioning is what makes promotion reversible, and reversibility is necessary because validation, however careful, cannot catch every regression. A candidate can pass validation on the held-out set and still regress in production, because the held-out set is a sample and production is the full, live, shifting reality; an evaluation set cannot contain an attack pattern that only appears next week. When that happens, the registry's rollback returns production to the previous version in one operation -- drop the regressing version, restore the prior one -- with no retraining and no scramble.

      Rollback is the safety net under validation, and together they are defence in depth for the retraining path: validation catches the candidate that is knowably worse before it ships, and rollback catches the candidate that turns out worse after it ships. This section provides the first; the A/B testing of 17.06 provides an intermediate layer between them, proving a validated candidate is actually better on a bounded slice of live traffic before it takes all of it. But the registry's rollback is the ultimate backstop, the guarantee that no retraining -- however it was triggered, however it validated -- can leave production stuck with a worse detector and no way back. With retraining producing validated, reversibly-promoted candidates, the loop's final stage tests them on live traffic and assembles the whole loop into one running system.
