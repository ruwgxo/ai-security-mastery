section_overview:
  one_line_summary: |-
    The second measurement family: the performance metrics that quantify how well the suite runs -- latency tracked with percentiles, throughput measured against provisioned capacity, and error rate per detector, all over rolling time windows -- with continuous tracking of the sub-50ms P99 budget and regression detection that fires in a warning band before the budget is breached, built on the Chapter 14 golden signals rather than replacing them.
  why_this_section_exists: |-
    Detection metrics measure whether the suite catches attacks; performance metrics measure whether it can be run at all in production. A suite that detects perfectly but breaches its latency budget is not deployable, and a suite that met its budget at deployment can regress silently as detectors are tuned and traffic shifts. This section builds the monitoring that watches the running suite over time, and its emphasis is deliberately on over time: Chapter 14 instrumented the suite so it could be observed at a moment; Section 17.03 watches the trend, because the failure mode that matters here is not a sudden spike but a slow creep toward the budget that a point-in-time check misses until it is too late.

    The section makes three commitments. First, it tracks the metrics that matter as distributions, not averages: latency is monitored by percentile, because the P99 -- the slow tail one request in a hundred experiences -- is the number the budget is written against, and an average latency can look healthy while the P99 quietly breaches. Second, it detects regressions against the budget with a warning band: a P99 that has climbed past 80% of the budget is flagged before it crosses 100%, so the regression is caught while there is still headroom to act. Third, it builds on Chapter 14 rather than duplicating it -- consuming the same execution samples the golden-signal instrumentation already emits -- and it connects performance back to detection, because the two are coupled: a detector tuned for higher recall may cost latency, so performance monitoring is an input to the tuning decisions of the improvement half, not a separate concern.
  position_in_chapter: |-
    Section 17.03 completes the measurement stage begun in 17.02, building the performance half to sit beside the detection half. Together they are the 'measure' step of the improvement loop. It builds directly on the Chapter 14 Section 14.08 observability stack, reusing its execution samples, and it feeds the tuning and scaling decisions that the retraining (17.05) and A/B testing (17.06) sections make, where a detection gain must be weighed against its performance cost.
