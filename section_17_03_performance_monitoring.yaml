prose_content:
  part_1:
    title: Performance as the Other Half of Measurement
    body: |-
      The improvement loop's measurement stage has two halves because a detector suite can fail in two independent ways. Section 17.02 measured the first: a suite can detect badly, missing attacks or drowning analysts in false alarms. This section measures the second: a suite can run badly, taking too long, falling over under load, or erroring out, regardless of how well it detects. The two failures are independent -- a suite can be accurate and slow, or fast and blind -- which is exactly why both must be watched, and why a team that monitors only one is exposed on the other. Performance monitoring is the discipline of knowing, continuously, whether the suite can actually be run in production at the quality it was built to.

      The governing number is the latency budget: the sub-50ms P99 the suite was designed against in Part 4. That budget is a promise to the gateway that detection will not add unacceptable delay to a request, and it is a promise that erodes. Detectors get tuned and grow heavier; traffic shifts toward inputs that take longer to evaluate; a model swap for better recall costs milliseconds. None of these announce themselves, and any of them can walk the P99 toward the budget over days. The purpose of this section is to make that erosion visible while it is still erosion and not yet a breach -- to watch the running suite over time so that a regression is a caught event with headroom to respond, not a page in the middle of the night when the budget is already blown.
  part_2:
    title: 'Latency by Percentile: Why the Tail Is the Budget'
    body: |-
      The single most important decision in latency monitoring is to measure it as a distribution, not an average, because the average is the number that lies. Imagine a detector that runs in 8 milliseconds for ninety-nine requests out of a hundred and 400 milliseconds for the hundredth. Its average latency is about 12 milliseconds -- comfortably under a 50ms budget, a green dashboard, nothing to see. But one request in a hundred is taking 400 milliseconds, eight times the budget, and for a suite handling millions of requests that is tens of thousands of users experiencing an unacceptable delay. The average hid the failure by drowning the slow tail in the fast majority. The budget is written against the P99 -- the latency the 99th-percentile request experiences -- precisely because the tail is where the pain is, and the tail is invisible to the mean.

      So the monitor tracks percentiles: the P50 to know the typical experience, and the P99 to know the tail the budget governs. Computing a percentile requires the distribution, so the monitor keeps a rolling window of recent latency samples per detector and reads the percentiles off it. The window is bounded -- a fixed number of recent samples -- so memory is constant and the measurement always reflects the recent past rather than the whole history, which matters because a regression that started an hour ago should show up now, not be diluted by a day of healthy samples. Percentiles over a bounded recent window are what make latency monitoring both truthful about the tail and responsive to change.
  part_3:
    title: Throughput, Saturation, and Errors
    body: |-
      Latency is one golden signal; the section tracks the others that bear on whether the suite can be run. Throughput is the rate of requests the suite is actually handling, measured over the window's time span, and on its own it is just a number. It becomes meaningful against provisioned capacity: saturation is observed throughput as a fraction of the capacity the suite was provisioned for, and a saturation approaching or exceeding 1.0 means the suite is at or over its ceiling, where latency degrades and requests queue. Saturation is the early signal that the suite needs scaling before load turns into latency, and it connects performance monitoring to the scaling decisions that sit alongside tuning -- a detector at 90% saturation is one traffic spike away from breaching its budget for reasons that have nothing to do with the detector itself.

      Error rate is the third signal and a distinct one: the fraction of executions that failed outright, per detector. It is distinct from latency because a detector can be fast and wrong -- erroring quickly is still failing -- and distinct from detection quality because an error is not a verdict at all, it is the absence of one. A rising error rate on a single detector points at that detector's health -- a model-serving fault, a resource exhaustion, a bad deploy -- rather than at the suite's load or its detection tuning, so watching it per detector localises the problem. Together, latency percentiles, saturation, and per-detector error rate are the operational picture: how slow, how loaded, how broken. Each is read off the same rolling window, so one snapshot answers all three.
  part_4:
    title: Regression Detection with a Warning Band
    body: |-
      Monitoring that only tells you the budget has been breached is monitoring that tells you too late. The point of watching the P99 over time is to catch it climbing toward the budget while there is still room to act, and that requires a threshold below the budget itself. The section's regression detection uses a warning band: a P99 under 80% of the budget is healthy; a P99 between 80% and 100% of the budget is a warning -- the suite is still within budget but has lost most of its headroom and is trending the wrong way; a P99 over the budget is a breach. The warning status is the one that earns the monitoring its keep, because it fires while the suite is still meeting its promise, giving a tuner time to find and reverse the regression before any user experiences a breach.

      This three-state view -- ok, warning, breach -- turns latency from a pass/fail check into a trend signal. A detector that has drifted from 20ms to 42ms against a 50ms budget is still technically passing, but it has moved from 40% to 84% of budget and is now in the warning band; the monitor surfaces that as a regression to investigate, not a green light. The headroom it reports -- how many milliseconds remain before breach -- quantifies how urgent the response is. Catching the regression here, in the warning band, is the difference between a tuning task scheduled for this week and an incident tonight. It is the performance analogue of the drift detection Chapter 13 built for detection quality: a signal that something has moved, raised early enough to act on deliberately rather than react to.
  part_5:
    title: Building on Chapter 14, and the Performance-Detection Coupling
    body: |-
      This monitoring is not built from scratch. Chapter 14 Section 14.08 already instrumented the suite with the golden signals and stood up the metrics pipeline, the logging, and the tracing that emit an execution sample for every detector run -- how long it took, whether it errored, when it happened. Section 17.03 consumes exactly those samples: the performance monitor is a layer that reads the Chapter 14 telemetry into per-detector rolling windows and computes the trend and regression view on top. Reusing the Chapter 14 pipeline rather than instrumenting afresh is not just economy; it guarantees the performance monitoring and the operational observability agree, because they are reading the same underlying data. The monitor adds the time-series and budget-regression semantics that the improvement loop needs; it does not re-measure what Chapter 14 already measures.

      The final point is why performance monitoring belongs in a chapter about tuning at all: performance and detection quality are coupled, so the two measurement families feed one decision. A detector tuned for higher recall -- a lower threshold, a heavier model, an extra layer -- frequently costs latency, pushing the P99 toward the budget. So a proposed tuning change cannot be judged on its detection metrics alone; its performance cost has to be weighed in the same decision. This is why the improvement loop measures both families before it tunes: the retraining of 17.05 and the A/B testing of 17.06 both read performance alongside detection, promoting a candidate only if it improves detection without breaching the latency budget. Performance monitoring is not a parallel track that operations watches while security tunes; it is one of the two axes every tuning decision is made on. With both measurement families built, the loop turns to its improvement half, beginning with the dataset curation that supplies the labels.
