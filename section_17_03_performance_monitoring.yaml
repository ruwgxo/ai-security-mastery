deliverables:
  deliverable_1:
    title: The Performance Monitor
    filename: performance_monitor.py
    description: |-
      Tracks per-detector performance over rolling windows and detects latency regressions against the budget. DetectorWindow keeps a bounded deque of samples and computes P50, P99, error rate, throughput, and saturation; LatencyBudget defines the sub-50ms P99 target and an 80% warning band; check_regression classifies a window as ok, warning, or breach with the remaining headroom; PerformanceMonitor registers detectors, ingests samples, and reports a snapshot and the regressions across the suite.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library collections (deque), dataclasses, time, and typing only. Percentiles are nearest-rank over the window -- exact and fast at window volumes, no numpy. The window is bounded by count so memory is constant and the measurement tracks the recent past. In the suite the samples are the Chapter 14 Section 14.08 execution telemetry; here sample_event-style samples drive the __main__ block, which shows a healthy detector (ok, wide headroom) beside a regressing one caught in the warning band before it breaches.
    code: |
      # performance_monitor.py
      # Section 17.03: Performance Monitoring -- Latency, Throughput, Errors
      # 20260121 | AI Security Mastery -- Chapter 17 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Detection metrics say how well the suite detects; these say how well it runs.
      # A suite that met the sub-50ms P99 budget at deployment can regress as
      # detectors are tuned and traffic shifts, and the regression must be caught
      # before it breaches the budget rather than after. This module tracks latency
      # (with percentiles), throughput against capacity, and error rate per detector
      # over rolling windows, and it flags a regression against the budget -- building
      # on the Chapter 14 Section 14.08 golden signals rather than replacing them.

      import time
      from collections import deque
      from dataclasses import dataclass, field
      from typing import Deque, Dict, List, Optional, Tuple


      # --- One observed detector execution ----------------------------------------

      @dataclass
      class PerfSample:
          detector: str
          latency_ms: float
          timestamp: float
          error: bool = False


      def _percentile(values: List[float], pct: float) -> float:
          '''Nearest-rank percentile over a copy of the values. Standard library only;
          for the volumes a window holds this is exact and fast enough.'''
          if not values:
              return 0.0
          ordered = sorted(values)
          if pct <= 0:
              return ordered[0]
          if pct >= 100:
              return ordered[-1]
          k = max(0, min(len(ordered) - 1, int(round((pct / 100.0) * len(ordered) + 0.5)) - 1))
          return ordered[k]


      # --- A rolling window of samples for one detector ---------------------------
      # Bounded by count so memory is fixed; the window is what makes this monitoring
      # over time rather than a single aggregate. Percentiles, throughput, and error
      # rate are all read off the current window.

      @dataclass
      class DetectorWindow:
          detector: str
          capacity_rps: float                      # provisioned throughput ceiling
          maxlen: int = 1000
          _samples: Deque[PerfSample] = field(default_factory=lambda: deque(maxlen=1000))

          def __post_init__(self) -> None:
              # deque maxlen must be set at construction; rebuild if a custom maxlen was passed
              if self._samples.maxlen != self.maxlen:
                  self._samples = deque(self._samples, maxlen=self.maxlen)

          def record(self, sample: PerfSample) -> None:
              self._samples.append(sample)

          @property
          def count(self) -> int:
              return len(self._samples)

          def latencies(self) -> List[float]:
              return [s.latency_ms for s in self._samples]

          def p50(self) -> float:
              return _percentile(self.latencies(), 50)

          def p99(self) -> float:
              return _percentile(self.latencies(), 99)

          def error_rate(self) -> float:
              if not self._samples:
                  return 0.0
              return sum(1 for s in self._samples if s.error) / len(self._samples)

          def throughput_rps(self) -> float:
              '''Observed requests per second across the window's time span.'''
              if len(self._samples) < 2:
                  return 0.0
              span = self._samples[-1].timestamp - self._samples[0].timestamp
              return _safe_div(len(self._samples), span)

          def saturation(self) -> float:
              '''Observed throughput as a fraction of provisioned capacity. Above 1.0
              the detector is over capacity -- a Chapter 14 golden-signal concern.'''
              return _safe_div(self.throughput_rps(), self.capacity_rps)


      def _safe_div(num: float, den: float) -> float:
          return num / den if den else 0.0


      # --- The latency budget and regression detection ----------------------------
      # The budget is the sub-50ms P99 target the suite was built to. A regression is
      # not just a breach -- it is drift toward the breach that should be caught in the
      # warning band before the budget is actually violated.

      @dataclass
      class LatencyBudget:
          p99_budget_ms: float = 50.0
          warning_fraction: float = 0.8            # warn once P99 crosses 80% of budget

          @property
          def warning_ms(self) -> float:
              return self.p99_budget_ms * self.warning_fraction


      @dataclass
      class RegressionReport:
          detector: str
          p99_ms: float
          status: str                              # 'ok' | 'warning' | 'breach'
          budget_ms: float
          headroom_ms: float


      def check_regression(window: DetectorWindow, budget: LatencyBudget) -> RegressionReport:
          p99 = window.p99()
          if p99 > budget.p99_budget_ms:
              status = 'breach'
          elif p99 >= budget.warning_ms:
              status = 'warning'
          else:
              status = 'ok'
          return RegressionReport(window.detector, round(p99, 3), status,
                                  budget.p99_budget_ms, round(budget.p99_budget_ms - p99, 3))


      class PerformanceMonitor:
          '''Tracks per-detector performance windows over time and reports regressions
          against the latency budget. Built to sit on top of the Chapter 14 metrics
          pipeline: it consumes the same execution samples the golden-signal
          instrumentation already emits.'''

          def __init__(self, budget: Optional[LatencyBudget] = None) -> None:
              self._budget = budget if budget is not None else LatencyBudget()
              self._windows: Dict[str, DetectorWindow] = {}

          def register(self, detector: str, capacity_rps: float, maxlen: int = 1000) -> None:
              self._windows[detector] = DetectorWindow(detector, capacity_rps, maxlen)

          def record(self, sample: PerfSample) -> None:
              if sample.detector not in self._windows:
                  self.register(sample.detector, capacity_rps=1000.0)
              self._windows[sample.detector].record(sample)

          def snapshot(self) -> Dict[str, Dict[str, float]]:
              out: Dict[str, Dict[str, float]] = {}
              for name, w in self._windows.items():
                  out[name] = {'p50': round(w.p50(), 3), 'p99': round(w.p99(), 3),
                               'error_rate': round(w.error_rate(), 4),
                               'throughput_rps': round(w.throughput_rps(), 2),
                               'saturation': round(w.saturation(), 3)}
              return out

          def regressions(self) -> List[RegressionReport]:
              return [check_regression(w, self._budget) for w in self._windows.values()]


      if __name__ == '__main__':
          mon = PerformanceMonitor(LatencyBudget(p99_budget_ms=50.0))
          mon.register('prompt_injection', capacity_rps=2000.0, maxlen=500)
          mon.register('pii_scanner', capacity_rps=1000.0, maxlen=500)

          t = time.time()
          # prompt_injection: healthy, ~8ms with a thin tail
          for i in range(400):
              lat = 6.0 + (i % 10) * 0.4 + (35.0 if i % 200 == 199 else 0.0)
              mon.record(PerfSample('prompt_injection', lat, t + i * 0.001, error=(i % 300 == 0)))
          # pii_scanner: regressing -- NER model got heavier, P99 creeping toward budget
          for i in range(400):
              lat = 30.0 + (i % 20) * 0.9
              mon.record(PerfSample('pii_scanner', lat, t + i * 0.002, error=False))

          snap = mon.snapshot()
          for name, s in snap.items():
              print(f"{name:18} p50={s['p50']:.1f} p99={s['p99']:.1f} "
                    f"err={s['error_rate']:.4f} sat={s['saturation']:.2f}")

          print('\n--- regression check against 50ms P99 budget ---')
          reports = {r.detector: r for r in mon.regressions()}
          for name, r in reports.items():
              print(f'{name:18} P99={r.p99_ms:.1f}ms  [{r.status}]  headroom={r.headroom_ms:.1f}ms')

          assert reports['prompt_injection'].status == 'ok'
          assert reports['pii_scanner'].status in ('warning', 'breach')
          # the healthy detector keeps real headroom; the regressing one has little or none
          assert reports['prompt_injection'].headroom_ms > 0
          assert reports['pii_scanner'].headroom_ms < reports['prompt_injection'].headroom_ms
          print('\nperformance monitoring + regression detection: ok')
common_mistakes:
  mistake_1:
    description: Monitoring latency by average instead of by percentile
    why_it_happens: |-
      The average is a single, familiar number and it is what dashboards show by default.
    consequence: |-
      The average drowns the slow tail in the fast majority, so a P99 that breaches the budget looks healthy on average and tens of thousands of users hit an unacceptable delay unseen.
    correct_approach: |-
      Monitor latency by percentile, watch the P99 the budget is written against, and treat the average as at best a secondary view of the typical case.
  mistake_2:
    description: Checking performance at a point in time rather than over a window
    why_it_happens: |-
      A point-in-time aggregate is easy to compute and answers 'is it healthy right now'.
    consequence: |-
      A slow regression -- the P99 creeping toward the budget over days -- is invisible to a point check until it breaches, so the failure that matters most is the one that is missed.
    correct_approach: |-
      Track the metrics over a bounded rolling window so the recent trend is visible, and detect regressions against the budget while the P99 is still climbing.
  mistake_3:
    description: Only alerting once the latency budget is already breached
    why_it_happens: |-
      The budget is the promise, so breaching it feels like the natural and only place to raise an alarm.
    consequence: |-
      By the time the alert fires the promise is already broken and users are experiencing the delay; there was no warning while there was still headroom to act.
    correct_approach: |-
      Use a warning band below the budget -- flag a regression once the P99 crosses 80% -- so the climb is caught while the suite still meets its budget and can be corrected before a breach.
  mistake_4:
    description: Judging a detection tuning change on its detection metrics alone
    why_it_happens: |-
      The change was made to improve recall or precision, so those are the numbers that get checked.
    consequence: |-
      A recall gain that quietly cost latency pushes the P99 toward or past the budget, trading a detection improvement for a performance regression that no one weighed.
    correct_approach: |-
      Judge every tuning change on both families -- promote it only if it improves detection without breaching the latency budget -- because performance and detection are coupled.
section_summary:
  compact: |-
    Section 17.03 completes the loop's measurement stage with the performance family: the metrics that say how well the suite runs, as opposed to how well it detects. A suite can fail independently on either axis -- accurate and slow, or fast and blind -- so both must be watched. The governing number is the sub-50ms P99 latency budget, and the section's central discipline is measuring latency as a distribution rather than an average, because an average can look healthy while the P99 -- the tail one request in a hundred experiences -- breaches the budget; the budget is written against the tail because the tail is where the pain is. The monitor keeps a bounded rolling window of samples per detector and reads latency percentiles, throughput, saturation against provisioned capacity, and error rate off it, so one snapshot gives the full operational picture: how slow, how loaded, how broken. Regression detection uses a warning band -- ok under 80% of budget, warning between 80% and 100%, breach above -- so a P99 climbing toward the budget is caught while the suite still meets its promise and there is headroom to act, turning latency from a pass/fail check into an early trend signal, the performance analogue of Chapter 13's drift detection. The monitoring builds on the Chapter 14 golden-signal stack, consuming the same execution samples rather than re-instrumenting, which guarantees it agrees with the operational observability. And because performance and detection quality are coupled -- tuning for recall often costs latency -- performance monitoring is an input to every tuning decision, one of the two axes on which the retraining and A/B testing of the improvement half judge a candidate.
  key_takeaways:
  - |-
    Performance is the second, independent measurement axis: a suite can be accurate and slow, or fast and blind
  - |-
    Latency is monitored by percentile, not average, because the P99 tail the budget governs is invisible to the mean
  - |-
    Throughput, saturation against capacity, and per-detector error rate are read off the same bounded rolling window
  - |-
    Regression detection uses a warning band so a P99 climbing toward the budget is caught with headroom, before a breach
  - |-
    The monitoring consumes the Chapter 14 golden-signal samples rather than re-instrumenting, so the two agree
  - |-
    Performance and detection are coupled, so performance monitoring is an input to every tuning decision, not a parallel track
preview_section_17_04:
  title: 'Dataset Curation: Collecting True and False Positives'
  summary: |-
    Section 17.04 begins the improvement half of the loop, where measurement turns into action. It curates a labelled dataset from live detections by reading analyst dispositions of SIEM alerts -- the point where the feedback loop closes at the analyst -- resolving conflicting dispositions into trustworthy labels, handling the class imbalance that makes benign traffic swamp rare attacks, and gating on label quality so an unsafe-to-train-on dataset is refused rather than silently passed to retraining. It extends the Chapter 12 curation with the Chapter 16 disposition feedback.
