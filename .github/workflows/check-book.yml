name: Check book build

# Runs the site build on pull requests so YAML parse errors and broken
# chapter-index references fail before they reach main and the deploy.
on:
  pull_request:
    paths:
      - 'book/**'
      - 'tools/build_site.py'
      - '.github/workflows/check-book.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pyyaml

      - name: Build site
        run: python3 tools/build_site.py
