name: Build and deploy book site

# Fires whenever book content or the build script changes on main.
# Manual trigger (workflow_dispatch) is also available from the Actions tab
# for re-deploying without a new commit (e.g. after editing this workflow).
on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'cleanup/build_site.py'
      - 'requirements.txt'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ai-security-mastery (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install pyyaml

      - name: Build site
        working-directory: source
        run: python3 cleanup/build_site.py
        # build_site.py writes docs/index.html per its own docstring

      - name: Verify build output
        run: |
          if [ ! -f source/docs/index.html ]; then
            echo "::error::build_site.py did not produce docs/index.html — aborting deploy"
            exit 1
          fi
          echo "Built $(wc -c < source/docs/index.html) bytes"

      - name: Checkout ruwgxo.github.io (deploy target)
        uses: actions/checkout@v4
        with:
          repository: ruwgxo/ruwgxo.github.io
          # Fine-grained PAT scoped to this one repo, contents:write only.
          # Create it under the ruwgxo.github.io repo's own settings
          # (Settings > Developer settings > Fine-grained tokens), then add
          # it as a secret named PAGES_DEPLOY_TOKEN in THIS repo
          # (ai-security-mastery > Settings > Secrets and variables > Actions).
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: site

      - name: Copy built site into place
        run: cp source/docs/index.html site/book/index.html

      - name: Commit and push if changed
        working-directory: site
        run: |
          git config user.name "asm-site-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- book/index.html; then
            echo "No content change — nothing to deploy."
            exit 0
          fi
          git add book/index.html
          git commit -m "Deploy: sync book site from ai-security-mastery@${GITHUB_SHA::7}"
          git push
