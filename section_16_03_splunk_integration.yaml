deliverables:
  deliverable_1:
    title: The Splunk HEC Connector
    filename: splunk_integration.py
    description: |-
      The Splunk connector: maps the detection-event schema to the HEC envelope with promoted indexed fields, and pushes events to HEC behind a swappable transport. SplunkConnector batches events into one newline-delimited POST; to_splunk_envelope does the schema mapping including the ISO-to-epoch timestamp conversion. Runs standalone on an in-memory StubHECTransport.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library json, time, dataclasses, and typing only. The DetectionEvent is represented as a dict via sample_event so the file runs standalone; in the suite it imports DetectionEvent from detection_event_schema.py. StubHECTransport records POSTs and returns Splunk's success envelope; the real transport POSTs to the HEC endpoint with an Authorization: Splunk <token> header. Self-checks the mapping, promoted fields, and batched delivery.
    code: |
      # splunk_integration.py
      # Section 16.03: Splunk Integration -- HEC and Add-on
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # The first platform connector. It delivers detection events into Splunk through
      # the HTTP Event Collector (HEC), mapping the detection-event schema to Splunk's
      # envelope so a detection becomes a searchable, alertable Splunk event. A push
      # integration: the gateway owns delivery and POSTs each event to HEC.

      import json
      import time
      from dataclasses import dataclass
      from typing import Any, Dict, List, Optional


      def sample_event() -> Dict[str, Any]:
          return {
              'schema_version': '1.0', 'event_id': 'req-1001:prompt_injection',
              'timestamp': '2026-01-21T10:15:03Z', 'detector': 'prompt_injection',
              'verdict': 'block', 'severity': 'critical', 'score': 0.92, 'confidence': 0.94,
              'latency_ms': 3.4, 'surface': 'input', 'request_id': 'req-1001',
              'session_id': 'sess-42', 'source': 'prod-gateway-1',
              'evidence': [{'source': 'pattern', 'label': 'instruction_override', 'detail': 'ignore previous'}],
              'iocs': [], 'labels': {},
          }


      class HECTransport:
          def send(self, url: str, token: str, payload: str) -> Dict[str, Any]:
              raise NotImplementedError


      class StubHECTransport(HECTransport):
          '''In-memory HEC stand-in. Records what would be POSTed and returns Splunk's
          success envelope, so the connector runs end to end without a live Splunk.'''
          def __init__(self) -> None:
              self.sent: List[Dict[str, Any]] = []
          def send(self, url: str, token: str, payload: str) -> Dict[str, Any]:
              for line in payload.strip().split('\n'):
                  self.sent.append(json.loads(line))
              return {'text': 'Success', 'code': 0}


      @dataclass
      class SplunkConfig:
          hec_url: str = 'https://splunk.internal:8088/services/collector'
          hec_token: str = 'REPLACE_WITH_HEC_TOKEN'
          index: str = 'ai_security'
          sourcetype: str = 'ai:detection'
          host: str = 'detection-gateway'

          def validate(self) -> None:
              assert self.hec_url.startswith('http'), 'hec_url must be an http(s) URL'
              assert self.index and self.sourcetype, 'index and sourcetype are required'


      def _iso_to_epoch(ts: str) -> float:
          return time.mktime(time.strptime(ts, '%Y-%m-%dT%H:%M:%SZ'))


      def to_splunk_envelope(event: Dict[str, Any], cfg: SplunkConfig) -> Dict[str, Any]:
          '''Map a detection event to the Splunk HEC envelope. detector, verdict, and
          severity are promoted to indexed fields; the full event stays in the body.'''
          return {
              'time': _iso_to_epoch(event['timestamp']),
              'host': cfg.host, 'source': event['source'],
              'sourcetype': cfg.sourcetype, 'index': cfg.index,
              'fields': {'detector': event['detector'], 'verdict': event['verdict'],
                         'severity': event['severity']},
              'event': event,
          }


      class SplunkConnector:
          '''Pushes detection events into Splunk via HEC. Batches envelopes into one
          newline-delimited POST.'''
          name = 'splunk'
          model = 'push'

          def __init__(self, transport: Optional[HECTransport] = None,
                       config: Optional[SplunkConfig] = None) -> None:
              self._transport = transport if transport is not None else StubHECTransport()
              self._cfg = config if config is not None else SplunkConfig()

          def send(self, events: List[Dict[str, Any]]) -> Dict[str, Any]:
              self._cfg.validate()
              envelopes = [to_splunk_envelope(e, self._cfg) for e in events]
              payload = '\n'.join(json.dumps(env, sort_keys=True) for env in envelopes)
              resp = self._transport.send(self._cfg.hec_url, self._cfg.hec_token, payload)
              return {'sent': len(envelopes), 'ok': resp.get('code') == 0, 'response': resp}


      if __name__ == '__main__':
          stub = StubHECTransport()
          conn = SplunkConnector(transport=stub)
          events = [sample_event(),
                    {**sample_event(), 'event_id': 'req-1002:pii_scanner', 'detector': 'pii_scanner',
                     'verdict': 'flag', 'severity': 'medium', 'request_id': 'req-1002'}]
          result = conn.send(events)
          print('send result :', {k: result[k] for k in ('sent', 'ok')})
          print('indexed fields:', stub.sent[0]['fields'])
          assert result['sent'] == 2 and result['ok']
          assert stub.sent[0]['index'] == 'ai_security' and stub.sent[0]['sourcetype'] == 'ai:detection'
          assert stub.sent[0]['fields']['severity'] == 'critical'
          assert stub.sent[1]['event']['detector'] == 'pii_scanner'
          print('splunk hec mapping + delivery: ok')
  deliverable_2:
    title: Splunk Integration End-to-End Test
    filename: splunk_integration_test.py
    description: |-
      Four tests over the full path on the stub transport: the envelope mapping carries the right index, sourcetype, promoted fields, and epoch time; batches all deliver; the full detection body stays searchable (not just the promoted fields); and an invalid config is rejected. Proves the detection reaches Splunk in a searchable, alertable form.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library only, imports the connector under test. The body-preservation test is the important one: it asserts the scores, evidence, session, and surface all survive, so an investigation has the whole detection. The large-corpus version runs in the chapter integration suite.
    code: |
      # splunk_integration_test.py
      # Section 16.03: Splunk Integration End-to-End Test
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Confirms the integration end to end on the stub transport: a detection event
      # goes in, a Splunk HEC envelope comes out with the right index, sourcetype, and
      # promoted fields, and the searchable event body preserves the full detection.

      from splunk_integration import (SplunkConnector, StubHECTransport, SplunkConfig,
                                      to_splunk_envelope, sample_event)


      def test_envelope_mapping() -> None:
          env = to_splunk_envelope(sample_event(), SplunkConfig())
          assert env['index'] == 'ai_security'
          assert env['sourcetype'] == 'ai:detection'
          assert env['fields']['severity'] == 'critical'
          assert env['event']['request_id'] == 'req-1001'
          assert isinstance(env['time'], float)


      def test_delivery_batches() -> None:
          stub = StubHECTransport()
          result = SplunkConnector(transport=stub).send([sample_event() for _ in range(5)])
          assert result['sent'] == 5 and result['ok']
          assert len(stub.sent) == 5


      def test_searchable_body_preserved() -> None:
          stub = StubHECTransport()
          SplunkConnector(transport=stub).send([sample_event()])
          body = stub.sent[0]['event']
          for key in ('detector', 'verdict', 'score', 'confidence', 'evidence', 'session_id'):
              assert key in body, key


      def test_bad_config_rejected() -> None:
          try:
              SplunkConnector(config=SplunkConfig(index='')).send([sample_event()])
          except AssertionError:
              return
          raise AssertionError('expected invalid config to be rejected')


      if __name__ == '__main__':
          tests = [test_envelope_mapping, test_delivery_batches,
                   test_searchable_body_preserved, test_bad_config_rejected]
          for t in tests:
              t()
              print(f'PASS {t.__name__}')
          print(f'{len(tests)}/{len(tests)} splunk integration tests passed')
  deliverable_3:
    title: Splunk Integration Configuration
    filename: splunk_config.py
    description: |-
      Configuration for the connector: the HEC URL, index, sourcetype, and host as data, with the HEC token read from the environment rather than hardcoded. validate enforces https and TLS verification in production; resolve_token fails loudly on a missing token; redacted prints the config without leaking the secret. Ships production and lab profiles.
    implementation_notes: |-
      Python 3.12, single quotes throughout per book convention, standard-library os, dataclasses, and typing only. The token_env_var indirection keeps the secret out of source control -- the single most important operational property of the config. Self-checks that both profiles validate and that the token resolves from the environment.
    code: |
      # splunk_config.py
      # Section 16.03: Splunk Integration Configuration
      # 20260121 | AI Security Mastery -- Chapter 16 by Raghav Dinesh
      # Single quotes throughout per book convention
      #
      # Configuration for the Splunk connector. The HEC token is a secret and is never
      # hardcoded -- it is read from the environment so it stays out of source control.

      import os
      from dataclasses import dataclass, asdict
      from typing import Any, Dict


      @dataclass
      class SplunkDeploymentConfig:
          hec_url: str = 'https://splunk.internal:8088/services/collector'
          index: str = 'ai_security'
          sourcetype: str = 'ai:detection'
          host: str = 'detection-gateway'
          verify_tls: bool = True
          token_env_var: str = 'SPLUNK_HEC_TOKEN'

          def resolve_token(self) -> str:
              token = os.environ.get(self.token_env_var, '')
              assert token, f'{self.token_env_var} is not set -- HEC token required'
              return token

          def validate(self) -> None:
              assert self.hec_url.startswith('https'), 'HEC must use https in production'
              assert self.index and self.sourcetype, 'index and sourcetype are required'
              assert self.verify_tls, 'TLS verification must stay enabled in production'

          def redacted(self) -> Dict[str, Any]:
              d = asdict(self)
              d['token'] = '(from ' + self.token_env_var + ')'
              return d


      PRODUCTION = SplunkDeploymentConfig()
      LAB = SplunkDeploymentConfig(hec_url='https://localhost:8088/services/collector', index='ai_security_lab')


      if __name__ == '__main__':
          os.environ.setdefault('SPLUNK_HEC_TOKEN', 'demo-token-not-real')
          for name, cfg in [('production', PRODUCTION), ('lab', LAB)]:
              cfg.validate()
              print(f'{name:11} index={cfg.index}')
          print('token resolves :', bool(PRODUCTION.resolve_token()))
          print('all splunk profiles valid')
common_mistakes:
  mistake_1:
    description: |-
      Promoting a few fields for indexing but dropping the full detection from the event body
    why_it_happens: |-
      Indexed fields make the common queries fast, so it feels efficient to send only those and skip the rest of the event.
    consequence: |-
      The alert fires on detector and severity, but an analyst opening it finds no scores, evidence, session, or surface, and cannot investigate.
    correct_approach: |-
      Promote detector, verdict, and severity for fast filtering, and keep the complete detection in the searchable body so the investigation has everything.
  mistake_2:
    description: |-
      Sending the ISO timestamp string to HEC instead of converting it to epoch seconds
    why_it_happens: |-
      The detection event already has a perfectly readable ISO-8601 timestamp, so it seems fine to pass it straight through.
    consequence: |-
      Splunk mis-parses or defaults the event time, so detections land at the wrong point on the timeline and time-based correlation breaks.
    correct_approach: |-
      Convert the ISO timestamp to epoch seconds for the HEC time key, so each detection sits at the correct moment on Splunk's timeline.
  mistake_3:
    description: Hardcoding the HEC token in the connector or config source
    why_it_happens: |-
      It is the quickest way to get a working POST, and the token is right there when you are testing against a real endpoint.
    consequence: |-
      The token -- a credential that can write to the SIEM -- ends up in source control, where it leaks and grants anyone who finds it ingest access.
    correct_approach: |-
      Read the token from the environment and fail loudly if it is missing, so the secret stays out of source and a misconfigured deploy is obvious.
  mistake_4:
    description: |-
      Delivering events to Splunk but never deploying the Sigma rules that evaluate them
    why_it_happens: |-
      Once the events are searchable in Splunk, the integration looks complete -- the data is there.
    consequence: |-
      The detections sit in an index no rule watches, so nothing alerts; the events are stored but not actioned, which was the whole point.
    correct_approach: |-
      Deploy the generated Sigma rules into Splunk alongside the connector, so the ingested events are evaluated into Splunk-native alerts.
section_summary:
  compact: |-
    Section 16.03 builds the first platform connector, delivering detections into Splunk through the HTTP Event Collector. It is the simplest instance of the push model from Section 16.01: the gateway POSTs each detection to a token-authenticated HEC endpoint and owns delivery. The connector maps the detection-event schema to the Splunk HEC envelope -- converting the ISO timestamp to epoch seconds so detections sit correctly on the timeline, routing to a dedicated ai_security index and ai:detection sourcetype, and promoting detector, verdict, and severity to indexed fields for fast filtering while keeping the full detection in the searchable body, because an investigation needs the whole event and not just the three fields that surfaced it. The integration ships as a Splunk add-on, which supplies the index, sourcetype, and field extractions that turn a stream of POSTed JSON into a first-class Splunk data source Splunk understands rather than merely stores. The generated Sigma rules of 16.02 deploy into Splunk as saved or correlation searches, so the portable detection logic evaluates the delivered events into Splunk-native alerts, and because the rules are generated and versioned they stay in sync with the detectors through the same hash-driven redeploy. The whole path is tested end to end on a stub HEC transport -- correct envelope, promoted fields, preserved body, batched delivery -- so the connector is proven without a live Splunk, and pointing it at a real endpoint is a configuration change. The HEC token is read from the environment, never hardcoded, keeping the credential out of source control.
  key_takeaways:
  - |-
    The Splunk connector is a push integration: the gateway POSTs detections to HEC and owns delivery
  - |-
    The detection-event schema maps to the HEC envelope, with the ISO timestamp converted to epoch seconds
  - |-
    Detector, verdict, and severity are promoted to indexed fields, but the full detection stays in the searchable body
  - |-
    The integration ships as a Splunk add-on that gives the events stable, queryable field structure
  - |-
    The generated Sigma rules deploy into Splunk so the delivered events are evaluated into native alerts
  - |-
    The HEC token is read from the environment, and the whole path is tested on a stub without a live Splunk
