section_overview:
  one_line_summary: |-
    The first platform connector: detections pushed into Splunk through the HTTP Event Collector, with the detection-event schema mapped to Splunk's envelope so a detection becomes a searchable, alertable event, and the generated Sigma rules deployed alongside so Splunk evaluates the portable logic against the ingested events.
  why_this_section_exists: |-
    Section 16.02 built the portable detection logic; this section delivers the detections themselves to a real platform for the first time. Splunk is the archetype: a widely deployed SIEM with a well-defined ingestion path, the HTTP Event Collector, and it is the natural first connector because its model -- push events over HTTP to a token-authenticated endpoint -- is the simplest instance of the push integration the chapter uses three times.

    The section does three things. It maps the detection-event schema to the Splunk HEC envelope, promoting the detector, verdict, and severity to indexed fields so Splunk can alert and dashboard on them efficiently while the full detection stays searchable in the event body. It packages that mapping as a Splunk add-on -- the unit Splunk uses to ship an integration's index, sourcetype, and field extractions -- so the detection events land with the right structure rather than as opaque blobs. And it deploys the generated Sigma rules into Splunk, so the portable logic of 16.02 runs on the platform against the events this connector delivers. The whole path is tested end to end on a stub HEC transport, so the connector is proven without a live Splunk.
  position_in_chapter: |-
    Section 16.03 is the first of the three platform connectors (Splunk, Datadog, Elastic) and the first push integration. It consumes the detection-event schema of 16.01, deploys the Sigma rules of 16.02, and establishes the connector shape -- schema-to-platform mapping, a stubbed transport, an end-to-end test, and a secret-aware config -- that the Datadog (16.04) and Elastic (16.05) connectors follow.
