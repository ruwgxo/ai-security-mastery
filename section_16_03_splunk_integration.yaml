prose_content:
  part_1:
    title: The HTTP Event Collector as the Ingestion Path
    body: |-
      Splunk ingests external events through the HTTP Event Collector, a token-authenticated HTTP endpoint that accepts JSON event envelopes. For the detection gateway, HEC is close to ideal: the gateway already produces structured detection events, and HEC wants structured JSON, so the connector is mostly a matter of shaping the event into Splunk's envelope and POSTing it. Authentication is a token the Splunk admin issues for a specific input; the connector presents it in an Authorization header, and Splunk routes the event to the index the token is scoped to.

      This makes the Splunk connector a push integration in the sense of Section 16.01: the gateway initiates delivery, POSTing each detection to HEC the moment it is made, and the gateway owns the reliability of that delivery -- retries, batching, backpressure are its concern, not Splunk's. HEC is the simplest instance of the push model, which is why the chapter builds it first; the Datadog and Elastic connectors are variations on the same shape. The connector wraps the HEC transport behind a small interface so it can be tested against an in-memory stub, and everything below is proven that way -- no live Splunk required to know the mapping and delivery are correct.
  part_2:
    title: Mapping the Schema to the Splunk Envelope
    body: |-
      A Splunk HEC event is an envelope with a handful of well-known keys. Time is the event's epoch timestamp, so the connector converts the detection event's ISO-8601 timestamp to epoch seconds -- getting this right is what puts the detection at the correct point on Splunk's timeline. Index, sourcetype, host, and source identify and route the event: index and sourcetype come from configuration (detections land in a dedicated ai_security index with an ai:detection sourcetype), host identifies the gateway, and source carries the emitting gateway instance from the detection event. The event key holds the body -- the full detection event, verbatim.

      One mapping decision matters more than the rest: which fields to promote. Splunk searches the event body fine, but fields it indexes are far faster to filter, alert, and dashboard on. So the connector promotes the three fields a responder pivots on -- detector, verdict, and severity -- into the envelope's indexed fields, while leaving the complete detection in the body. The promotion is an optimisation, not a replacement: the full event, including the scores, the evidence, the session, and the surface, stays searchable, because an analyst investigating an alert needs the whole detection, not the three fields that surfaced it. Promoting a summary while dropping the detail would make the common query fast and the investigation impossible.
  part_3:
    title: Packaging as a Splunk Add-on
    body: |-
      Delivering JSON to HEC gets the events into Splunk, but events that arrive without structure are opaque: Splunk has no way to know that verdict is a field worth faceting on or that severity should drive alert urgency. A Splunk add-on is the unit that supplies that structure. It packages the index definition, the sourcetype, the field extractions, and any saved searches or dashboards that go with the integration, so that when detection events arrive they are parsed into the fields the add-on declares rather than left as raw text.

      Shipping the integration as an add-on is what turns a stream of POSTed JSON into a first-class Splunk data source. The add-on declares the ai:detection sourcetype and the fields the connector promotes, so the searches, alerts, and dashboards a security team builds reference stable field names rather than parsing the body ad hoc. It is the difference between detections that are technically in Splunk and detections that Splunk understands. The connector's job is to deliver events that match the add-on's expectations; the add-on's job is to make those events queryable and alertable the moment they land.
  part_4:
    title: Deploying the Generated Sigma Rules into Splunk
    body: |-
      The events are only half the integration. The detection logic -- the rules that say a blocked injection is a high-severity alert -- comes from the generated Sigma rules of Section 16.02. Splunk is one of the platforms with a Sigma compiler, so the generated rules deploy into Splunk as saved searches or correlation searches that evaluate against the ingested detection events. The portable logic written once in 16.02 now runs on the Splunk platform, against the events this connector delivers, producing Splunk-native alerts.

      This is where the two halves of the chapter's surface meet on one platform. The connector delivers the events; the Sigma rules evaluate them; the add-on gives both the field structure they rely on. Because the rules are generated and versioned, redeploying them into Splunk after a detector change is the same hash-driven step from 16.02 -- the Splunk-side detection logic stays in sync with the detectors without anyone hand-editing a Splunk search. Splunk becomes a place where the suite's detections are both stored and acted on, with the detection logic kept current automatically.
  part_5:
    title: Testing the Integration End to End
    body: |-
      The connector is validated end to end on the stub HEC transport, which records what would be POSTed and returns Splunk's success envelope. The test walks the whole path: a detection event goes in, and the test asserts that the resulting Splunk envelope carries the right index and sourcetype, that the promoted fields hold the correct detector, verdict, and severity, and -- most importantly -- that the full detection body survives, so an investigation has everything the detection knew. It checks that batches of events all deliver, that the timestamp becomes epoch seconds rather than a string, and that an invalid configuration is rejected loudly rather than silently sending to nowhere.

      Testing against a stub rather than a live Splunk is a deliberate choice that the Datadog and Elastic connectors repeat. The connector's correctness is in the mapping and the delivery contract, not in Splunk itself, so a stub that captures the POST proves what matters: the detection reaches the platform in a form the platform can search and alert on. When the stub tests pass -- correct envelope, promoted fields, preserved body, batched delivery -- the connector is ready, and pointing it at a real HEC endpoint is a configuration change, not a code change. With Splunk delivering events and evaluating rules, Section 16.04 builds the same integration for Datadog.
